<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: one centered column; worlds stack like toy blocks, each world's lessons wind down a path */
:root{
  --bg:#EDF4F9; --paper:#FFFFFF; --ink:#172636; --muted:#5A6C7D; --line:#D4E1EB;
  --sun:#FFBE2E; --sun-deep:#B37600;
  --good:#1C9F5F; --good-soft:#DDF5E8; --bad:#DD444A; --bad-soft:#FCE4E5;
  --lv:#2E8BC9; --lv-deep:#1C5F8C; --lv-soft:#E0EEF8;
  --f-ui:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;
  --f-en:"Andika","Baloo Bhaijaan 2",Verdana,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
[dir="ltr"]{font-family:var(--f-en)}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.fill{fill:currentColor;stroke:none}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;gap:10px;padding-block:10px;background:var(--bg)}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--paper);box-shadow:0 3px 0 var(--line)}
.iconbtn.ph{visibility:hidden}
.bar-t{unicode-bidi:plaintext;flex:1;min-width:0;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.pill{display:flex;align-items:center;gap:4px;background:var(--paper);padding:6px 12px;border-radius:999px;box-shadow:0 3px 0 var(--line);color:var(--sun-deep);font-weight:800;font-variant-numeric:tabular-nums}
.pill .ico{color:var(--sun)}

/* home */
.hero{display:flex;gap:14px;align-items:center;padding-block:8px 18px}
.owl{font-size:58px;line-height:1;width:84px;height:84px;display:grid;place-items:center;background:var(--paper);border-radius:28px;box-shadow:0 5px 0 var(--line);flex:none}

.hero h1{font-size:17px;font-weight:700;color:var(--lv-deep)}
.muted{color:var(--muted);font-size:14px}
.worlds{display:flex;flex-direction:column;gap:16px}
.world{display:flex;align-items:center;gap:14px;text-align:start;background:var(--paper);border-radius:22px;padding:14px;box-shadow:0 6px 0 var(--lv-deep);border:2px solid var(--lv);transition:transform .12s}
.world:active{transform:translateY(4px);box-shadow:0 2px 0 var(--lv-deep)}
.w-art{font-size:40px;width:66px;height:66px;border-radius:20px;background:var(--lv-soft);display:grid;place-items:center;flex:none}
.w-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.w-txt b{font-size:19px}
.w-txt i{font-style:normal;color:var(--lv-deep);font-weight:700;font-size:14px}
.w-txt small{color:var(--muted);font-size:13px}
.w-num{font-weight:800;color:var(--lv-deep);font-size:13px;position:absolute}
.prog{height:8px;background:var(--lv-soft);border-radius:9px;overflow:hidden;margin-block:4px 2px}
.prog span{display:block;height:100%;background:var(--lv);border-radius:9px}
.locked{filter:grayscale(1);opacity:.55}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.ghost{background:var(--paper);border-radius:14px;padding:10px 14px;font-weight:700;box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.ghost:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.go{background:var(--lv);color:#fff;border-radius:14px;padding:11px 18px;font-weight:800;box-shadow:0 5px 0 var(--lv-deep)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--lv-deep)}
.go:disabled{opacity:.45}

/* level path */
.lv-hero{display:flex;gap:14px;align-items:center;background:var(--lv);color:#fff;border-radius:24px;padding:16px;margin-block:4px 22px;box-shadow:0 6px 0 var(--lv-deep)}
.lv-art{font-size:46px;width:72px;height:72px;border-radius:22px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.04em;opacity:.9}
.lv-hero h1{font-size:24px}
.path{position:relative;display:flex;flex-direction:column;gap:18px;padding-block:6px}
.path::before{content:"";position:absolute;inset-block:30px;inset-inline-start:50%;border-inline-start:4px dashed var(--line)}
.node{position:relative;display:flex;align-items:center;gap:12px;text-align:start;width:min(100%,290px)}
.pos0{margin-inline-start:0}.pos1{margin-inline-start:18%}.pos2{margin-inline-start:34%}.pos3{margin-inline-start:12%}
.disc{width:72px;height:72px;border-radius:50%;background:var(--lv);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:800;box-shadow:0 6px 0 var(--lv-deep);flex:none;border:4px solid var(--paper)}
.node.done .disc{background:var(--sun);color:var(--ink);box-shadow:0 6px 0 var(--sun-deep)}
.node.locked .disc{background:#B8C4CE;box-shadow:0 6px 0 #8E9BA6}
.nlab{background:var(--paper);border-radius:16px;padding:8px 12px;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;min-width:0}
.nlab b{font-size:16px}
.nlab small{color:var(--muted)}
.nst{display:flex;align-items:center;gap:3px;color:var(--sun-deep);font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.nst .ico{width:15px;height:15px;color:var(--sun)}
.node.boss .disc{width:86px;height:86px;background:#1F2A37;color:var(--sun);box-shadow:0 6px 0 #000}
.node.boss .disc .ico{width:38px;height:38px}

/* lesson */
.les-h{padding-block:6px 14px}
.les-h h1{font-size:28px;color:var(--lv-deep)}
.vocab{display:flex;gap:10px;overflow-x:auto;padding-block:4px 12px;margin-bottom:10px;scrollbar-width:thin}
.vw{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--paper);border-radius:16px;padding:10px 12px;min-width:92px;box-shadow:0 4px 0 var(--line)}
.vw .e{font-size:30px;line-height:1.1}
.vw b{font-family:var(--f-en);font-size:15px}
.vw small{color:var(--muted);font-size:12px}
.sec-t{font-weight:800;font-size:15px;color:var(--muted);margin-block:6px 10px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:start;background:var(--paper);border-radius:20px;padding:14px;border:2px solid var(--lv-soft);box-shadow:0 5px 0 var(--lv-soft)}
.act:active{transform:translateY(3px)}
.act .ai{width:46px;height:46px;border-radius:14px;background:var(--lv-soft);color:var(--lv-deep);display:grid;place-items:center}
.act .ai .ico{width:26px;height:26px}
.act b{font-size:17px}
.act small{color:var(--muted);font-family:var(--f-en);font-size:13px}
.stars{display:flex;gap:2px}
.stars .ico{width:18px;height:18px;color:#D3DCE3}
.stars .on{color:var(--sun)}

/* activity panes */
.pane{display:flex;flex-direction:column;gap:14px}
.tip{background:var(--lv-soft);color:var(--lv-deep);border-radius:14px;padding:10px 14px;font-weight:600;font-size:15px}
.chat{display:flex;flex-direction:column;gap:10px;min-height:120px}
.bub{display:flex;align-items:flex-end;gap:8px;max-width:92%}
.bub p{background:var(--paper);border-radius:18px 18px 18px 4px;padding:10px 14px;font-size:18px;box-shadow:0 3px 0 var(--line);min-width:0}
.bub.kid{align-self:flex-end;flex-direction:row-reverse}
.bub.kid p{background:var(--lv);color:#fff;border-radius:18px 18px 4px 18px;box-shadow:0 3px 0 var(--lv-deep)}
.av{font-size:30px;line-height:1;flex:none}
.spk{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--lv-soft);color:var(--lv-deep);flex:none}
.spk.sm{width:34px;height:34px}
.spk.sm .ico{width:18px;height:18px}
.opts,.q-o{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-family:var(--f-en);font-size:17px;box-shadow:0 4px 0 var(--line)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.right{background:var(--good-soft)!important;border-color:var(--good)!important;box-shadow:0 4px 0 var(--good)!important}
.wrong{background:var(--bad-soft)!important;border-color:var(--bad)!important;box-shadow:0 4px 0 var(--bad)!important;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .4s}
.repeat{background:var(--paper);border:2px dashed var(--lv);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns>*{flex:1}
.player{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.play{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--lv);color:#fff;border-radius:18px;padding:14px 20px;font-weight:800;font-size:18px;box-shadow:0 5px 0 var(--lv-deep)}
.play .ico{width:28px;height:28px}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 var(--lv-deep)}
.text{background:var(--paper);border-radius:18px;padding:16px;font-size:20px;line-height:1.75;box-shadow:0 4px 0 var(--line);text-align:left}
.w{border-radius:6px;cursor:pointer}
.w:active{background:var(--sun)}
.q{background:var(--paper);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 0 var(--line)}
.q.ok{outline:2px solid var(--good)}
.q-h{display:flex;gap:10px;align-items:center;font-size:18px;font-weight:700}

/* games */
.g-head{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.g-head span{font-variant-numeric:tabular-nums;color:var(--muted)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{display:flex;flex-direction:column;gap:10px}
.tile{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:10px;font-size:17px;box-shadow:0 4px 0 var(--line);min-height:54px}
.tile.em{font-size:30px;line-height:1}
.tile.em.big{font-size:44px;min-height:92px}
.tile.sel{border-color:var(--lv);box-shadow:0 4px 0 var(--lv);background:var(--lv-soft)}
.tile.gone{visibility:hidden}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{aspect-ratio:3/4;max-width:100%;border-radius:14px;background:var(--lv);color:#fff;display:grid;place-items:center;box-shadow:0 4px 0 var(--lv-deep);font-size:28px;font-weight:800;padding:4px}
.card .front{display:none}
.card.up{background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.card.up .front{display:block}
.card.up .back{display:none}
.card .front.en{font-size:14px;word-break:break-word;line-height:1.2}
.card.got{background:var(--good-soft);border-color:var(--good)}
.clue{display:flex;align-items:center;justify-content:center;gap:14px;background:var(--paper);border-radius:18px;padding:12px;box-shadow:0 4px 0 var(--line);font-weight:700;font-size:18px}
.big-em{font-size:52px;line-height:1}
.slots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;min-height:52px}
.slot{width:40px;height:48px;border-radius:10px;background:var(--paper);border-bottom:4px solid var(--lv);display:grid;place-items:center;font-size:24px;font-weight:700;font-family:var(--f-en)}
.slots.ok .slot{border-color:var(--good);background:var(--good-soft)}
.tiles{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.ltr,.tok{min-width:46px;height:50px;padding:0 12px;border-radius:12px;background:var(--sun);color:var(--ink);font-family:var(--f-en);font-size:22px;font-weight:700;box-shadow:0 4px 0 var(--sun-deep)}
.tok{font-size:17px;height:44px}
.ltr:disabled,.tok:disabled{opacity:.2}
.sent{display:flex;flex-wrap:wrap;gap:8px;min-height:64px;background:var(--paper);border-radius:16px;padding:10px;border:2px dashed var(--line);align-content:flex-start}
.sent .tok{background:var(--lv);color:#fff;box-shadow:0 4px 0 var(--lv-deep)}
.sent.ok{border-color:var(--good);background:var(--good-soft)}
.inp{width:100%;font-family:var(--f-en);font-size:26px;text-align:center;padding:12px;border-radius:14px;border:3px solid var(--line);background:var(--paper);color:var(--ink)}
.hintline{text-align:center;font-size:22px;letter-spacing:.2em;color:var(--lv-deep);min-height:30px}
.target{display:flex;align-items:center;justify-content:center;gap:12px;font-weight:700;font-size:18px}
.field{position:relative;height:340px;border-radius:20px;overflow:hidden;background:linear-gradient(var(--lv-soft),var(--paper));border:2px solid var(--line)}
.bubble{position:absolute;left:0;top:0;padding:10px 14px;border-radius:999px;background:var(--paper);border:3px solid var(--lv);font-family:var(--f-en);font-size:15px;font-weight:700;white-space:nowrap;box-shadow:inset -4px -6px 0 var(--lv-soft)}
.bubble.popped{background:var(--good);color:#fff;border-color:var(--good);transition:opacity .5s;opacity:0}
.bubble.miss{background:var(--bad-soft);border-color:var(--bad);opacity:.5}

/* boss */
.boss-head{display:flex;align-items:center;gap:10px;justify-content:space-between;font-weight:800}
.boss-head .ico{color:var(--sun-deep);width:28px;height:28px}
.timer{height:12px;border-radius:9px;background:var(--line);overflow:hidden}
.timer span{display:block;height:100%;width:100%;background:var(--sun)}
.bprompt{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--paper);border-radius:20px;padding:16px;box-shadow:0 4px 0 var(--line);text-align:center;font-weight:700}
.ar-word{font-size:34px;font-weight:800;color:var(--lv-deep)}
.intro{background:var(--paper);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 5px 0 var(--line)}
.intro ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}

/* result */
.result{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding-block:24px}
.result .bigstars{display:flex;gap:8px}
.result .bigstars .ico{width:64px;height:64px;color:#D3DCE3;animation:pop .5s backwards}
.result .bigstars .on{color:var(--sun)}
.result .bigstars .ico:nth-child(2){animation-delay:.15s}.result .bigstars .ico:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(0)}}
.result h2{font-size:30px}
.result .btns{width:100%;flex-direction:column}

/* words + parents */
.wl{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-bottom:22px}
.wl .vw{min-width:0}
.panel{background:var(--paper);border-radius:20px;padding:16px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.panel h3{font-size:18px}
.panel ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.panel input[type=text]{font:inherit;font-size:18px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700}
.danger{color:var(--bad);border-color:var(--bad-soft)}
.link{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 var(--sun);border:2px solid var(--sun);margin-bottom:18px}
.link .big{font-size:30px;font-weight:800;color:var(--sun-deep);font-variant-numeric:tabular-nums;min-width:40px;text-align:center}
.link small{display:block;color:var(--muted);font-size:13px}
.prog.sun{background:#FFF1CC}.prog.sun span{background:var(--sun)}
a.go{display:inline-block;text-align:center;text-decoration:none}
.gift{background:var(--sun);color:var(--ink);font-weight:800;padding:10px 16px;border-radius:14px;box-shadow:0 4px 0 var(--sun-deep)}
.owl svg{display:block}
.partb{display:inline-block;background:var(--lv-soft);color:var(--lv-deep);font-weight:800;font-size:13px;padding:2px 10px;border-radius:999px;margin-block:2px}
.result a.go{width:100%}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;z-index:20;max-width:calc(100% - 32px);text-align:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:15}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.mem{grid-template-columns:repeat(3,1fr)}.pos2{margin-inline-start:22%}}

 "plastic", "wood"], ["What were Bedouins famous for?", "their generosity", "their big cars", "their ships"]]}, {"en": "Going to Travel", "ar": "سنسافر", "v": "plan|يخطط|📝;suitcase|حقيبة سفر|🧳;passport|جواز سفر|🛂;holiday|إجازة|🏖️;flight|رحلة طيران|🛫;book|يحجز|📆", "c": [["What are you going to do this holiday?", "We're going to visit my uncle in Madinah.", "We going to visiting my uncle.", "Holiday is going to me."], ["How are you going to get there?", "We're going to take the train.", "We are go to take train was.", "The train is going to me."], ["Have you packed your suitcase yet?", "Not yet. I'm going to pack it tonight.", "Not yet, I packed it tomorrow.", "Suitcase packs tonight me."], ["What are you going to see there?", "We're going to visit the Prophet's Mosque.", "We going see it yesterday.", "There is going to see."]], "l": "Next week, Hessa's family is going to travel to Abha. They are going to stay for five days. Hessa is going to visit the mountains and ride the cable car.", "lq": [["Where is the family going?", "to Abha", "to Jeddah", "to Dubai"], ["How long are they going to stay?", "five days", "two weeks", "one day"], ["What is Hessa going to ride?", "the cable car", "a camel", "a boat"]], "r": "Turki is planning a trip with his family. First, they are going to drive to AlUla. They are going to see the old rock tombs at Hegra, which are more than two thousand years old. Then they are going to sleep in a desert camp. Turki's sister wants to see the Elephant Rock at sunset. Turki is going to take his new camera, because he wants to make a short video about the trip for his class.", "rq": [["Where are they going to drive?", "to AlUla", "to the beach", "to the airport"], ["How old are the rock tombs?", "more than two thousand years old", "ten years old", "one hundred years old"], ["Why is Turki taking his camera?", "to make a video for his class", "to sell photos", "to give it to his sister"]]}, {"en": "Camping Night", "ar": "ليلة التخييم", "v": "fire|نار sh."], ["Is it safe to touch a scorpion?", "No! Its sting can be dangerous.", "Yes, scorpions love hugs.", "A scorpion is a kind of fruit."], ["How do desert lizards stay cool?", "They hide under rocks or in the sand.", "They drink cold juice.", "They wear sunglasses."]], "l": "The Arabian oryx is a white animal with long, straight horns. Fifty years ago, there were almost no oryx left in the wild. Today, thanks to protection, there are hundreds again.", "lq": [["What color is the oryx?", "white", "brown", "black"], ["What are its horns like?", "long and straight", "short and curly", "it has no horns"], ["What happened thanks to protection?", "There are hundreds again.", "They all disappeared.", "They learned to fly."]], "r": "Falcons are among the fastest animals on Earth. When a falcon dives to catch its prey, it can reach more than three hundred kilometers per hour. In Arabia, falconry is a very old tradition. Falconers train their birds with patience and care. Before hunting, the falcon wears a small hood on its head to keep it calm. Today, there are falcon hospitals and even falcon passports!", "rq": [["How fast can a diving falcon fly?", "more than three hundred kilometers per hour", "thirty kilometers per hour", "as fast as a camel"], ["What keeps the falcon calm?", "a small hood", "loud music", "food"], ["What special things exist for falcons today?", "hospitals and passports", "schools and buses", "shops and cars"]]}, {"en": "The Old Souq", "ar": "السوق القديم", "v": "spices|بهارات|🌶️;perfume|عطر|🧴;carpet|سجادة|🧶;cheaper|أرخص|🏷️;expensive|غالٍ|💎;bargain|يساوم|🤝", "c": [["How much is this carpet?", "It's three hundred riyals.", "It's three hundred red.", "The carpet is how much."], ["That's too expensive. Can you make it cheaper?", "OK, you can have it for two hundred and fifty.", "Expensive is my friend.", "No, carpets don't speak."], ["Which perfume is the best?", "This oud perfume is the most popular.", "This oud is more best perfume.", "Perfume is the bestest."], ["Thank you. I'll take it.", "Here you are. Enjoy it!", "No, take is a perfume.", "I am take it you."]], "l": "The old souq is busy every evening. You can smell spices, oud and fresh bread. The shops are small, but they sell many things. Prices are often cheaper than in big malls.", "lq": [["When is the souq busy?", "every evening", "only in the morning", "never"], ["What can you smell?", "spices, oud and fresh bread", "fish only", "nothing"], ["How are prices compared to malls?", "often cheaper", "always more expensive", "the same"]], "r": "Abdullah's grandfather has a small spice shop in the old souq. He has worked there for forty years. Every morning he opens the wooden door and fills big bags with cardamom, saffron and cinnamon. Customers come to him because he always gives good advice: which spice is best for coffee, which is best for rice. On Fridays, Abdullah helps him. He is learning that a good shopkeeper must be honest and friendly.", "rq": [["How long has the grandfather worked there?", "forty years", "four years", "fourteen days"], ["Why do customers come to him?", "He gives good advice.", "He is the cheapest.", "He sings songs."], ["What is Abdullah learning?", "to be honest and friendly", "to cook", "to drive"]]}, {"en": "Water Is Life", "ar": "الماء حياة", "v": "drop|قطرة|💧;well|بئر|🪣;tap|صنبور|🚰;waste|يهدر|🚱;rain|مطر|🌧️;save|يوفر|♻️", "c": [["Why is water important?", "Because all living things need it.", "Because water is a kind of sand.", "Water is important for cars only."], ["How can you save water at home?", "I turn off the tap when I brush my teeth.", "I leave the tap on all day.", "I save water in my pocket."], ["Where did people get water long ago?", "They got water from wells.", "They bought it from supermarkets.", "They got it from the moon."], ["What will happen if we waste water?", "We won't have enough in the future.", "We will have more water.", "Water will grow on trees."]], "l": "A dripping tap can waste more than ten liters of water a day. So if you see a dripping tap, tell an adult. Fixing it is easy and it saves a lot of water.", "lq": [["How much can a dripping tap waste?", "more than ten liters a day", "one drop a year", "nothing"], ["What should you do if you see one?", "tell an adult", "ignore it", "open it more"], ["Is fixing it hard?", "No, it is easy.", "Yes, very hard.", "It can't be fixed."]], "r": "Saudi Arabia has no rivers, so getting water is a big challenge. Long ago, people dug deep wells and built small canals called aflaj. Today, most of the drinking water comes from the sea. Big factories called desalination plants remove the salt from seawater. This process needs a lot of energy and money. That is why every drop is precious, and why we should never waste water.", "rq": [["Why is water a challenge in Saudi Arabia?", "There are no rivers.", "It rains every day.", "There is too much snow."], ["Where does most drinking water come from today?", "the sea", "rivers", "the mountains"], ["What do desalination plants do?", "remove salt from seawater", "make juice", "build wells"]]}], "c": "#27A85A", "d": "#17733C", "s": "#DFF4E7", "rate": 0.85, "games": ["sentence", "spell", "pop", "unscramble", "memory", "sentence"]}, {"en": "Jungle Quest", "ar": "مغامرة الأدغال", "sub": "الأكبر والأسرع والأفضل", "icon": "🌴", "boss": "تحدي ملك الأدغال", "lessons": [{"en": "The Biggest and the Best", "ar": "الأكبر والأفضل", "v": "biggest|الأكبر|🐋;fastest|الأسرع|🐆;highest|الأعلى|🏔️;longest|الأطول|🐍;best|الأفضل|🥇;worst|الأسوأ|👎", "c": [["What is the biggest animal in the world?", "The blue whale is the biggest.", "The blue whale is the most big.", "The biggest is a mouse."], ["Who is the best player in your team?", "Saad is the best player.", "Saad is the goodest player.", "Best is the team."], ["What is the longest river in the world?", "The Nile is one of the longest.", "The Nile is the more long.", "Rivers are the shortest cars."], ["Which was the worst day of your holiday?", "The day I was sick was the worst.", "The day was the baddest.", "Worst is a holiday."]], "l": "The cheetah is the fastest land animal. The giraffe is the tallest animal. And the blue whale is the biggest animal that has ever lived, even bigger than the dinosaurs!", "lq": [["What is the fastest land animal?", "the cheetah", "the lion", "the horse"], ["What is the tallest animal?", "the giraffe", "the elephant", "the camel"], ["What is bigger than the dinosaurs?", "the blue whale", "the giraffe", "the cheetah"]], "r": "Mount Everest is the highest mountain in the world. It is almost nine thousand meters high. The air at the top is very thin and cold, so climbers carry oxygen. Climbing Everest is one of the most difficult adventures. In 2013, Raha Moharrak became the first Saudi woman to reach the top. She showed that with hard work and courage, big dreams can come true.", "rq": [["How high is Mount Everest?", "almost nine thousand meters", "nine hundred meters", "ninety meters"], ["Why do climbers carry oxygen?", "The air at the top is thin.", "It is a gift.", "It is heavy."], ["Who was Raha Moharrak?", "the first Saudi woman to reach the top", "a scientist", "a teacher"]]}, {"en": "Rainforest", "ar": "الغابات المطيرة", "v": "rainforest|غابة مطيرة|🌳;monkey|قرد|🐒;frog|ضفدع|🐸;vine|نبات متسلق|🌿;canopy|ظلة الأشجار|🍃;medicine|دواء|💊", "c": [["Why is it called a rainforest?", "Because it rains there almost every day.", "Because it rains forests.", "It is called rain because it is dry."], ["Which animals live in the rainforest?", "Monkeys, frogs, parrots and many insects.", "Penguins and polar bears.", "Only camels."], ["Why are rainforests important?", "They give us oxygen and medicines.", "They give us ice and snow.", "They are not important at all."], ["What can we do to protect them?", "We can use less paper and recycle.", "We can cut more trees.", "We can do nothing ever."]], "l": "The Amazon is the largest rainforest in the world. It is in South America. More than half of all the animal and plant types on Earth live in rainforests.", "lq": [["What is the largest rainforest?", "the Amazon", "the Sahara", "the Nile"], ["Where is it?", "in South America", "in Asia", "in Europe"], ["How many animal and plant types live in rainforests?", "more than half", "only a few", "none"]], "r": "The poison dart frog is tiny, about the size of a paperclip, but it is one of the most dangerous animals in the rainforest. Its bright colors, like blue, yellow and red, are a warning: 'Don't eat me!' Interestingly, these frogs are not dangerous when they live in zoos, because their poison comes from the insects they eat in the wild. Scientists are studying them to make new medicines.", "rq": [["How big is the poison dart frog?", "about the size of a paperclip", "as big as a cat", "as big as a car"], ["What do its bright colors mean?", "a warning", "it is happy", "it is sleeping"], ["Why aren't zoo frogs dangerous?", "Their poison comes from wild insects.", "They are sleeping.", "They are painted."]]}, {"en": "Amazing Insects", "ar": "حشرات مدهشة", "v": "ant|نملة|🐜;bee|نحلة|🐝;butterfly|فراشة|🦋;wing|جناح|🪽;honey|عسل|🍯;hive|خلية|🏠", "c": [["How many legs does an insect have?", "All insects have six legs.", "All insects have eight legs.", "Insects have many cars."], ["What do bees make?", "Bees make honey and wax.", "Bees make milk and cheese.", "Bees make paper."], ["Was a butterfly always a butterfly?", "No, it was a caterpillar first.", "Yes, it was born with wings.", "A butterfly was a fish."], ["Why are ants strong?", "They can carry things much heavier than themselves.", "Because they eat burgers.", "Ants are not strong ever."]], "l": "A bee visits hundreds of flowers every day. It collects nectar and takes it back to the hive. The bees work together to make honey.", "lq": [["How many flowers does a bee visit?", "hundreds every day", "one a week", "none"], ["Where does it take the nectar?", "back to the hive", "to the river", "to the tree"], ["How do the bees make honey?", "They work together.", "One bee works alone.", "They buy it."]], "r": "Ants live in big groups called colonies. Each ant has a job. The queen lays the eggs. Worker ants find food, clean the nest and look after the babies. Soldier ants protect the colony. When an ant finds food, it leaves a special smell on the way back home, so other ants can follow the path. That is why you often see ants walking in a line!", "rq": [["What does the queen do?", "She lays the eggs.", "She finds food.", "She protects the colony."], ["Who protects the colony?", "soldier ants", "worker ants", "the queen"], ["Why do ants walk in a line?", "They follow a special smell.", "They are playing.", "They are lost."]]}, {"en": "Explorer's Diary", "ar": "مذكرات مستكشف", "v": "explore|يستكشف|🧭;journey|رحلة|🛤️;discover|يكتشف|🔍;bridge|جسر|🌉;river|نهر|🏞️;brave|شجاع|🦁", "c": [["Where did you go on your journey?", "We went deep into the forest.", "We goed deep into the forest.", "Journey went me."], ["What did you see?", "We saw a huge waterfall.", "We seen a huge waterfall.", "We see waterfall tomorrow."], ["Were you afraid?", "Only when we crossed the old bridge.", "I was afraid a bridge is.", "Afraid were me."], ["What did you discover?", "We discovered a cave with old paintings.", "We discovered a pizza shop.", "Discover was a cave."]], "l": "Day three. We woke up early and walked for six hours. In the afternoon, we found a small river. We drank fresh water and took photos of colorful birds.", "lq": [["How long did they walk?", "six hours", "three hours", "one hour"], ["What did they find in the afternoon?", "a small river", "a city", "a cave"], ["What did they take photos of?", "colorful birds", "the river", "their tent"]], "r": "Day seven. Today was the most exciting day of our journey. In the morning, it rained heavily and the path was muddy. We almost wanted to go back. But our guide, Pedro, said the waterfall was only an hour away. We kept walking. When we arrived, we couldn't believe our eyes: the water fell from the cliff like a white curtain, and there was a rainbow in the mist. Every tired step was worth it.", "rq": [["What was the weather like in the morning?", "It rained heavily.", "It was sunny.", "It snowed."], ["Who encouraged them to continue?", "Pedro, the guide", "a monkey", "their teacher"], ["What did they see in the mist?", "a rainbow", "a bridge", "a plane"]]}, {"en": "Rivers", "ar": "الأنهار", "v": "source|منبع|⛲;flow|يجري|🌊;bank|ضفة|🏞️;fresh|عذب|💧;flood|فيضان|🌧️;valley|وادٍ|🏔️", "c": [["Where does a river start?", "It starts at a source, often in the mountains.", "It starts in the sea and goes up.", "A river starts at the supermarket."], ["Is river water salty?", "No, most river water is fresh.", "Yes, rivers are saltier than the sea.", "Water is a river bank."], ["What is a wadi?", "It's a dry valley that fills with water after rain.", "It's a kind of fish.", "It's a snowy mountain."], ["Why is it dangerous to play in a wadi after rain?", "Because floods can come very quickly.", "Because wadis are very boring.", "Because the sand is green."]], "l": "The Nile flows through eleven countries in Africa. For thousands of years, farmers in Egypt depended on its water. Every year, the river flooded and made the land rich for farming.", "lq": [["How many countries does the Nile flow through?", "eleven", "two", "fifty"], ["Who depended on its water?", "farmers in Egypt", "fishermen in the sea", "nobody"], ["What did the floods do?", "made the land rich for farming", "destroyed everything forever", "made snow"]], "r": "In Saudi Arabia, there are no permanent rivers, but there are many wadis. Most of the year, a wadi is dry and sandy. But after heavy rain, water rushes through it very fast, like a river. These sudden floods can be dangerous, so people should never drive or camp in a wadi when rain is expected. After the rain, wadis often turn green with grass and flowers for a few weeks.", "rq": [["What is a wadi like most of the year?", "dry and sandy", "full of fish", "covered in snow"], ["Why can wadis be dangerous?", "sudden floods", "wild lions", "they are too hot"], ["What happens after the rain?", "Wadis turn green for a few weeks.", "They become oceans.", "They disappear."]]}, {"en": "Saving Animals", "ar": "إنقاذ الحيوانات", "v": "endangered|مهدد بالانقراض|⚠️;protect|يحمي|🛡️;habitat|موطن|🏡;hunt|يصطاد|🎯;rescue|ينقذ|🚑;zoo|حديقة حيوان|🦓", "c": [["What does endangered mean?", "It means there are very few of them left.", "It means the animal is very angry.", "It means the animal is very big."], ["Why are some animals endangered?", "People destroy their habitats and hunt them.", "Because they eat too many vegetables.", "Because they don't go to school."], ["How can zoos help?", "They can protect animals and help them have babies.", "They can sell animals as toys.", "Zoos make animals disappear."], ["What will you do to help animals?", "I will never throw rubbish in nature.", "I will hunt more animals.", "I will nothing do."]], "l": "There are only about five thousand wild tigers left in the world. A hundred years ago, there were around one hundred thousand. Many countries are now working hard to protect them.", "lq": [["How many wild tigers are left?", "about five thousand", "one hundred thousand", "ten"], ["How many were there a hundred years ago?", "around one hundred thousand", "five thousand", "one million"], ["What are many countries doing now?", "working hard to protect them", "hunting them", "ignoring them"]], "r": "Sea turtles have lived on Earth for more than one hundred million years, but today many of them are in danger. They often eat plastic bags because they look like jellyfish. Also, bright lights on beaches confuse baby turtles, so they walk away from the sea. Volunteers now clean beaches, turn off lights at night and help the babies reach the water safely.", "rq": [["Why do turtles eat plastic bags?", "They look like jellyfish.", "They taste good.", "They are hungry for plastic."], ["What confuses baby turtles?", "bright lights on beaches", "the sound of waves", "the sand"], ["How do volunteers help?", "They clean beaches and turn off lights.", "They catch the turtles.", "They feed them plastic."]]}], "c": "#0F9488", "d": "#086158", "s": "#DBF3F0", "rate": 0.88, "games": ["spell", "pop", "unscramble", "memory", "sentence", "sentence"]}, {"en": "Sports Arena", "ar": "ملعب الأبطال", "sub": "القواعد: must وmustn't والفريق", "icon": "🏟️", "boss": "تحدي بطل الملعب", "lessons": [{"en": "Football Match", "ar": "مباراة كرة قدم", "v": "goal|هدف|🥅;referee|حكم|🧑‍⚖️;score|نتيجة|🔢;kick|يركل|🦵;team|فريق|👥;cheer|يشجع|📣", "c": [["What was the score?", "It was two-one to our team.", "It were two one score was.", "Score is a referee."], ["Who scored the winning goal?", "Salem scored it in the last minute.", "Salem scoring goal minute last.", "The goal scored Salem."], ["Why did the referee stop the game?", "Because a player was hurt.", "Because the ball was hungry.", "Referees always sleep."], ["Do you play football at school?", "Yes, we play every Tuesday.", "Yes, we plays every Tuesday.", "School plays me."]], "l": "In the final match, our team was losing one-zero at half time. In the second half, Fahad scored two goals. We won two-one and the fans cheered loudly.", "lq": [["What was the score at half time?", "one-zero to the other team", "two-one", "zero-zero"], ["Who scored two goals?", "Fahad", "Salem", "the goalkeeper"], ["What was the final score?", "two-one", "one-zero", "three-three"]], "r": "The Saudi national football team surprised the world at the 2022 World Cup in Qatar. In their first match, they played against Argentina, one of the strongest teams. Argentina scored first, but in the second half, Saudi Arabia scored two amazing goals and won two-one. People across the country celebrated in the streets. It showed that with team spirit, anything is possible.", "rq": [["Where was the 2022 World Cup?", "in Qatar", "in Brazil", "in Saudi Arabia"], ["Who did Saudi Arabia play in their first match?", "Argentina", "Brazil", "Spain"], ["What does the story show?", "With team spirit, anything is possible.", "Football is boring.", "Argentina always wins."]]}, {"en": "Team Rules", "ar": "قوانين الفريق", "v": "must|يجب|✅;mustn't|يجب ألا|⛔;rule|قانون|📜;fair|عادل|⚖️;warm up|يُحمّي الجسم|🤸;whistle|صافرة|📯", "c": [["What must you do before you play?", "We must warm up for ten minutes.", "We must to warm up.", "Warm up must us."], ["Can players touch the ball with their hands?", "No, they mustn't, except the goalkeeper.", "Yes, they must always hold it.", "Hands are mustn't."], ["What must you do when the referee blows the whistle?", "We must stop playing.", "We must run home.", "The whistle must stop."], ["Why are rules important?", "They keep the game fair and safe.", "They make the game boring.", "Rules are not important."]], "l": "Swimming pool rules: You must take a shower before you swim. You mustn't run near the pool. You mustn't swim without a lifeguard. You must listen to the lifeguard.", "lq": [["What must you do before you swim?", "take a shower", "eat a big meal", "run"], ["What mustn't you do near the pool?", "run", "walk", "sit"], ["Who must you listen to?", "the lifeguard", "your friends", "nobody"]], "r": "Coach Majed has three golden rules for his team. Rule one: You must always respect your teammates and the other team. Rule two: You mustn't give up, even if you are losing. Rule three: You must enjoy the game. 'Winning is nice,' he says, 'but learning and having fun are more important.' His team doesn't always win, but everyone loves playing for him.", "rq": [["What is rule one?", "Respect everyone.", "Always win.", "Never pass the ball."], ["What mustn't players do?", "give up", "enjoy", "respect others"], ["What does the coach think is more important than winning?", "learning and having fun", "money", "trophies"]]}, {"en": "Healthy Body", "ar": "جسم صحي", "v": "muscle|عضلة|💪;heart|قلب|❤️;exercise|تمرين|🏋️;stretch|يتمدد|🧘;sweat|يعرق|💦;breathe|يتنفس|🌬️", "c": [["How often do you exercise?", "I exercise four times a week.", "I exercise four time week.", "Exercise often me."], ["What happens to your heart when you run?", "It beats faster.", "It stops completely.", "It turns blue."], ["Why do we sweat?", "Sweat cools our bodies.", "Sweat makes us taller.", "Because we are sad."], ["What should you drink after exercise?", "Water is the best.", "Lots of soda.", "Nothing ever."]], "l": "Children should be active for at least sixty minutes every day. You can run, swim, ride a bike or play with friends. Exercise makes your heart and muscles strong.", "lq": [["How long should children be active?", "at least sixty minutes a day", "five minutes a week", "three hours a night"], ["What makes your heart strong?", "exercise", "sleeping all day", "eating sweets"], ["Which activity is NOT in the list?", "boxing", "swimming", "riding a bike"]], "r": "Your heart is a muscle about the size of your fist. It beats around one hundred thousand times a day, pumping blood to every part of your body. When you exercise, your muscles need more oxygen, so your heart beats faster and you breathe more quickly. Regular exercise makes your heart stronger, so it can pump more blood with fewer beats. That's why athletes often have a slow heartbeat when they rest.", "rq": [["How big is your heart?", "about the size of your fist", "as big as your head", "as small as a pea"], ["Why does the heart beat faster during exercise?", "Muscles need more oxygen.", "It is scared.", "It wants to sleep."], ["Why do athletes have a slow resting heartbeat?", "Their hearts are stronger.", "They are sick.", "They don't breathe."]]}, {"en": "Olympic Games", "ar": "الألعاب الأولمبية", "v": "medal|ميدالية|🏅;gold|ذهب|🥇;silver|فضة|🥈;race|سباق|🏃;athlete|رياضي|🤾;country|دولة|🌍", "c": [["How often are the Olympic Games held?", "Every four years.", "Every four days.", "Every four minute."], ["What do you get if you come first?", "You get a gold medal.", "You get a silver cup of tea.", "You get nothing at all."], ["What do the five rings mean?", "They show the continents of the world coming together.", "They are five donuts.", "They are the five best players."], ["Which sport would you like to try at the Olympics?", "I'd like to try fencing.", "I'd like to try sleeping.", "Sport is Olympic me."]], "l": "The first modern Olympic Games were in Athens in 1896. Only a few countries took part. Today, more than two hundred countries send athletes to the Olympics.", "lq": [["Where were the first modern Olympics?", "Athens", "London", "Riyadh"], ["When were they?", "1896", "1996", "2016"], ["How many countries take part today?", "more than two hundred", "only five", "about twenty"]], "r": "At the 2000 Olympic Games in Sydney, Hadi Souan won a silver medal in the four hundred meters hurdles. He became the first Saudi athlete to win an Olympic medal in running. Years later, in 2012, Saudi women competed at the Olympics for the first time. Every Olympics brings new stories of athletes who trained for years, failed many times and never stopped trying.", "rq": [["What medal did Hadi Souan win?", "silver", "gold", "bronze"], ["What happened in 2012?", "Saudi women competed for the first time.", "The Olympics were in Riyadh.", "Hadi won gold."], ["What do Olympic stories show?", "Athletes train hard and never stop trying.", "Winning is easy.", "Only rich countries win."]]}, {"en": "Winning and Losing", "ar": "الفوز والخسارة", "v": "win|يفوز|🏆;lose|يخسر|😞;practice|يتدرب|🔁;proud|فخور|😌;congratulate|يهنئ|🤝;improve|يتحسن|📈", "c": [["How did you feel when you lost the race?", "I was sad, but I'll practice more.", "I was lose sad.", "The race lost me."], ["What should you say to the winner?", "Congratulations! You ran really well.", "You are a cheater!", "Winner is a race."], ["What did you learn from losing?", "I learned that I need to start faster.", "I learned nothing never.", "Losing learned me."], ["Are you proud of yourself?", "Yes, because I tried my best.", "Yes, I am proud a race.", "Proud is losing."]], "l": "Ziad lost the chess final. At first, he wanted to cry. Then he shook hands with the winner and said 'Well done.' His teacher said she was proud of him.", "lq": [["What did Ziad lose?", "the chess final", "a football match", "a race"], ["What did he say to the winner?", "Well done", "Go away", "I am the best"], ["How did his teacher feel?", "proud of him", "angry", "bored"]], "r": "Thomas Edison, the famous inventor, once said that he had not failed; he had just found many ways that didn't work. Many champions think the same. Michael Jordan, one of the best basketball players ever, was not chosen for his school team when he was young. He went home and cried, but then he practiced every day. Losing can teach us more than winning, if we learn from it.", "rq": [["What happened to Michael Jordan when he was young?", "He was not chosen for the school team.", "He won every game.", "He stopped playing."], ["What did he do after crying?", "He practiced every day.", "He gave up.", "He changed sports."], ["What can losing teach us?", "more than winning, if we learn from it", "nothing", "to stop trying"]]}, {"en": "Horses", "ar": "الخيول", "v": "saddle|سرج|🐎;gallop|يعدو|💨;stable|إسطبل|🏚️;rider|فارس|🏇;mane|عرف الحصان|💈;hoof|حافر|🐾", "c": [["Have you ever ridden a horse?", "Yes, I rode one at my uncle's farm.", "Yes, I ridden one yesterday.", "The horse rode me."], ["What do horses eat?", "They eat hay, grass and oats.", "They eat pizza and chips.", "Horses eat saddles."], ["Where do horses sleep?", "They sleep in a stable.", "They sleep in a swimming pool.", "Horses sleep on a bus."], ["Why are Arabian horses famous?", "They are beautiful, smart and can run for a long time.", "They can fly over mountains.", "They are the smallest horses."]], "l": "The Arabian horse is one of the oldest horse breeds in the world. It has a small head, big eyes and a high tail. Arabian horses are strong and very loyal to their owners.", "lq": [["Is the Arabian horse a new breed?", "No, it is one of the oldest.", "Yes, very new.", "We don't know."], ["What are its eyes like?", "big", "small", "closed"], ["How are they with their owners?", "very loyal", "angry", "shy"]], "r": "Riding a horse is not just sitting on its back. A good rider must understand the horse. Horses can feel when a rider is nervous, so you must stay calm. Before riding, you should brush the horse and check its hooves. While riding, you control the horse with the reins and your legs, not by shouting. After the ride, you must give the horse water and let it rest. Respect is the secret of a great rider.", "rq": [["Why must a rider stay calm?", "Horses can feel nervousness.", "Horses like noise.", "To go faster."], ["How do you control a horse?", "with the reins and your legs", "by shouting", "with a whistle"], ["What is the secret of a great rider?", "respect", "speed", "a big saddle"]]}], "c": "#E0702A", "d": "#9E4614", "s": "#FCE9DC", "rate": 0.91, "games": ["pop", "unscramble", "memory", "sentence", "sentence", "spell"]}, {"en": "Snow Kingdom", "ar": "مملكة الثلج", "sub": "توقعات بـ will وكم مرة تفعل؟", "icon": "❄️", "boss": "تحدي ملكة الثلج", "lessons": [{"en": "Weather Forecast", "ar": "نشرة الطقس", "v": "forecast|توقع|📡;temperature|درجة الحرارة|🌡️;storm|عاصفة|⛈️;snow|ثلج|❄️;foggy|ضبابي|🌫️;degrees|درجات|🔢", "c": [["What will the weather be like tomorrow?", "It will be cloudy and cool.", "It will is cloudy.", "Tomorrow will weather me."], ["Will it snow in Riyadh?", "Probably not. It rarely snows there.", "Yes, it will snows every day.", "Riyadh is a snowman."], ["What's the temperature today?", "It's about thirty-five degrees.", "It's thirty-five kilometers.", "Temperature is a forecast."], ["Should we cancel the picnic?", "Yes, a storm is coming this afternoon.", "No, storms are fun picnics.", "The picnic will cancel us."]], "l": "Here is the weather forecast for tomorrow. In the north, it will be cold and windy. In the east, it will be foggy in the morning. In the south, there will be rain in the mountains.", "lq": [["What will the north be like?", "cold and windy", "hot and sunny", "rainy"], ["When will the east be foggy?", "in the morning", "at night", "all day"], ["Where will it rain?", "in the southern mountains", "in the north", "nowhere"]], "r": "In some winters, it snows in the north of Saudi Arabia, especially in the mountains near Tabuk. When this happens, many families drive for hours to see it. Children build snowmen and throw snowballs. For people who live in a hot country, snow is a magical thing. Weather scientists use satellites and computers to predict when the snow will come, so people can plan their trips.", "rq": [["Where does it sometimes snow in Saudi Arabia?", "in the mountains near Tabuk", "in Jeddah", "in Riyadh every day"], ["What do children do in the snow?", "build snowmen and throw snowballs", "swim", "plant trees"], ["How do scientists predict snow?", "with satellites and computers", "by asking camels", "by guessing"]]}, {"en": "Polar Animals", "ar": "حيوانات القطبين", "v": "polar bear|دب قطبي|🐻‍❄️;penguin|بطريق|🐧;seal|فقمة|🦭;fur|فرو|🧥;ice|جليد|🧊;Arctic|القطب الشمالي|🧭", "c": [["Do polar bears and penguins live together?", "No. Polar bears live in the north, and penguins live in the south.", "Yes, they share a house.", "Penguins are polar bears."], ["How do polar bears stay warm?", "They have thick fur and fat.", "They wear jackets.", "They drink hot tea."], ["Can penguins fly?", "No, but they are excellent swimmers.", "Yes, they fly to the moon.", "Penguins drive cars."], ["What will happen if the ice melts?", "Polar animals will lose their homes.", "Polar animals will be happier.", "Nothing will happen."]], "l": "Emperor penguins live in Antarctica. In winter, the father penguin keeps the egg warm on his feet for about two months. During this time, he doesn't eat anything!", "lq": [["Where do emperor penguins live?", "Antarctica", "the Arctic", "Africa"], ["Who keeps the egg warm?", "the father", "the mother", "the baby"], ["What does he eat during this time?", "nothing", "fish", "ice"]], "r": "The polar bear is the largest meat-eating animal on land. Its fur looks white, but it is actually clear, and its skin underneath is black! The black skin absorbs heat from the sun. Polar bears are amazing swimmers and can swim for many hours. They hunt seals from the ice. But as the Arctic gets warmer and the ice melts, it is harder for them to find food.", "rq": [["What color is a polar bear's skin?", "black", "white", "pink"], ["What do polar bears hunt?", "seals", "penguins", "camels"], ["Why is it harder for them to find food?", "The ice is melting.", "Seals are too fast.", "They are lazy."]]}, {"en": "Winter Clothes", "ar": "ملابس الشتاء", "v": "coat|معطف|🧥;scarf|وشاح|🧣;gloves|قفازات|🧤;boots|حذاء طويل|🥾;wool|صوف|🧶;warm|دافئ|♨️", "c": [["It's freezing outside. What will you wear?", "I'll wear my coat, scarf and gloves.", "I'll wear my swimsuit.", "Freezing wears me."], ["Which is warmer, wool or cotton?", "Wool is warmer.", "Wool is more warm than.", "Cotton is a sheep."], ["Where are your boots?", "They're next to the door.", "They is next to door.", "Boots are where."], ["Why do we wear gloves?", "To keep our hands warm.", "To keep our feet wet.", "Because gloves are hungry."]], "l": "Mom packed my bag for the trip to the mountains. She put in a thick coat, a wool hat, two pairs of gloves and warm socks. It will be very cold there.", "lq": [["Where is the trip?", "to the mountains", "to the beach", "to the desert"], ["How many pairs of gloves?", "two", "one", "three"], ["Why did she pack warm clothes?", "It will be very cold.", "It is fashion.", "They are new."]], "r": "People in cold countries have special ways to stay warm. They wear many thin layers instead of one thick layer, because warm air gets trapped between the layers. They cover their heads, because we lose a lot of heat from our heads. And they choose waterproof boots, because wet feet get cold very quickly. In the desert at night, Bedouins wear a heavy wool cloak called a farwa for the same reason.", "rq": [["Why are many thin layers better?", "Warm air gets trapped between them.", "They are cheaper.", "They look nice."], ["Why do people cover their heads?", "We lose a lot of heat from our heads.", "To look tall.", "To hide their hair."], ["What is a farwa?", "a heavy wool cloak", "a kind of boot", "a tent"]]}, {"en": "How Often?", "ar": "كم مرة؟", "v": "always|دائمًا|💯;usually|عادةً|🔁;often|غالبًا|📈;sometimes|أحيانًا|🔀;rarely|نادرًا|📉;never|أبدًا|🚫", "c": [["How often do you read books?", "I usually read before bed.", "I read usually never always.", "Books often me."], ["Do you ever eat fast food?", "Sometimes, but not often.", "Yes, I eat always never.", "Fast food eats me."], ["How often do you visit your grandparents?", "We visit them every Friday.", "We visit them every Friday never.", "Grandparents visit often."], ["Are you ever late for school?", "I'm rarely late. I always wake up early.", "I am late always never.", "School is late me."]], "l": "I always brush my teeth twice a day. I usually walk to school. I sometimes play video games on the weekend, but I never play on school days.", "lq": [["How many times a day does he brush his teeth?", "twice", "once", "never"], ["How does he usually go to school?", "He walks.", "by bus", "by car"], ["When does he never play video games?", "on school days", "on the weekend", "at night"]], "r": "A newspaper asked one hundred children about their habits. Sixty children said they always eat breakfast. Forty said they often read for fun. Only ten children said they never do any sport, and the newspaper said this is a problem. Most children said they sometimes help at home. The newspaper's advice: make good habits now, because habits become who you are.", "rq": [["How many children always eat breakfast?", "sixty", "forty", "ten"], ["What was the problem?", "Ten children never do sport.", "Children read too much.", "Children eat breakfast."], ["What was the newspaper's advice?", "make good habits now", "stop reading", "never help at home"]]}, {"en": "Recipes", "ar": "وصفات الطبخ", "v": "flour|دقيق|🌾;butter|زبدة|🧈;mix|يخلط|🥣;bake|يخبز|🔥;oven|فرن|♨️;spoon|ملعقة|🥄", "c": [["How much flour do we need?", "We need two cups of flour.", "We need two flours cup many.", "Flour is how much."], ["How many eggs are there?", "There are only two eggs.", "There is only two egg.", "Eggs are how many."], ["Is there any butter?", "Yes, there's some in the fridge.", "Yes, there are many butters.", "Butter is a fridge."], ["How long do we bake the cake?", "For about thirty minutes.", "For thirty spoons.", "Bake is thirty."]], "l": "To make pancakes, mix one cup of flour, one egg and one cup of milk. Add a little sugar. Pour some of the mixture into a hot pan and cook for two minutes on each side.", "lq": [["How many eggs do you need?", "one", "two", "three"], ["What do you add a little of?", "sugar", "salt", "butter"], ["How long do you cook each side?", "two minutes", "ten minutes", "one hour"]], "r": "Kleeja are traditional cookies from the Qassim region. To make them, you mix flour, butter and a little sugar. Then you add special spices like cardamom and cinnamon. You fill the dough with dates, shape it into small circles and press a pattern on top. Finally, you bake them in the oven until they are golden. Families often make kleeja together, and they smell wonderful.", "rq": [["Where do kleeja come from?", "the Qassim region", "Italy", "the sea"], ["What do you fill the dough with?", "dates", "chocolate", "cheese"], ["What do families often do?", "make kleeja together", "sell them in Europe", "throw them away"]]}, {"en": "Ice Experiment", "ar": "تجربة الجليد", "v": "melt|يذوب|🫠;freeze|يتجمد|🥶;liquid|سائل|💧;solid|صلب|🧱;salt|ملح|🧂;experiment|تجربة|🧪", "c": [["What will happen to the ice in the sun?", "It will melt and become water.", "It will grow bigger.", "It will become a solid sun."], ["What happens to water in the freezer?", "It freezes and becomes ice.", "It becomes juice.", "It becomes hotter."], ["Is ice a solid or a liquid?", "Ice is a solid.", "Ice is a gas.", "Ice is a liquid tree."], ["What do you think will happen if we put salt on the ice?", "I think it will melt faster.", "I think it will become sugar.", "Salt will freeze the sun."]], "l": "Put one ice cube on a plate and another ice cube on a plate with salt. Wait ten minutes. Which one melts faster? The one with salt! That's why people put salt on icy roads.", "lq": [["How many ice cubes do you need?", "two", "one", "ten"], ["Which ice cube melts faster?", "the one with salt", "the one without salt", "they melt the same"], ["Why do people put salt on roads?", "to melt the ice", "to make them tasty", "to make them white"]], "r": "Water is special because we can find it in three states. As a solid, it is ice. As a liquid, it is the water we drink. As a gas, it is water vapor, which we cannot see. When you heat ice, it melts. When you heat water, it evaporates and becomes vapor. When the vapor cools down high in the sky, it forms clouds, and then it falls again as rain. This journey is called the water cycle.", "rq": [["What are the three states of water?", "solid, liquid and gas", "hot, warm and cold", "big, medium and small"], ["What happens when vapor cools in the sky?", "It forms clouds.", "It becomes ice cream.", "It disappears forever."], ["What is the journey of water called?", "the water cycle", "the ice road", "the rain race"]]}], "c": "#2B6FCC", "d": "#174788", "s": "#DFEAFA", "rate": 0.94, "games": ["unscramble", "memory", "sentence", "sentence", "spell", "pop"]}, {"en": "Tech Lab", "ar": "مختبر التقنية", "sub": "الحاسوب والإنترنت والاختراعات", "icon": "💻", "boss": "تحدي مهندس المختبر", "lessons": [{"en": "Computers", "ar": "الحاسوب", "v": "keyboard|لوحة المفاتيح|⌨️;mouse|فأرة|🖱️;click|ينقر|👆;type|يكتب|🔤;save|يحفظ|💾;printer|طابعة|🖨️", "c": [["What do you use the keyboard for?", "I use it to type words.", "I use it to eat crisps.", "Keyboard uses me."], ["How do I open the file?", "Double-click on it with the mouse.", "Kick the screen twice.", "The file opens you."], ["Did you save your work?", "Yes, I saved it before I closed the program.", "Yes, I saving it tomorrow.", "Work saved me."], ["The printer isn't working. What should I do?", "Check if it has paper and ink.", "Throw it out of the window.", "Printers don't need anything."]], "l": "The first computers were as big as a room. They were very slow and very expensive. Today, a small phone is millions of times faster than those old computers.", "lq": [["How big were the first computers?", "as big as a room", "as small as a phone", "as big as a car"], ["Were they fast?", "No, very slow.", "Yes, very fast.", "They didn't work."], ["What is millions of times faster today?", "a small phone", "an old computer", "a printer"]], "r": "A computer has two main parts: hardware and software. Hardware is everything you can touch: the screen, the keyboard, the mouse and the chips inside. Software is the set of instructions that tells the hardware what to do, like apps and games. Without software, a computer is just a box of metal and plastic. Programmers are the people who write software using special languages called code.", "rq": [["What is hardware?", "everything you can touch", "apps and games", "instructions"], ["What is software?", "instructions that tell the hardware what to do", "the screen", "the keyboard"], ["Who writes software?", "programmers", "doctors", "farmers"]]}, {"en": "Online Safety", "ar": "الأمان على الإنترنت", "v": "password|كلمة المرور|🔐;stranger|غريب|👤;share|يشارك|📤;private|خاص|🙈;report|يبلّغ|🚩;safe|آمن|🛡️", "c": [["Should you share your password with friends?", "No, I must keep it private.", "Yes, I share it with everyone.", "Password is a friend."], ["A stranger online asks for your address. What do you do?", "I don't answer and I tell my parents.", "I give him my address and phone.", "Strangers are my family."], ["What makes a strong password?", "Letters, numbers and symbols mixed together.", "Just the word 'password'.", "My name only."], ["What will you do if you see something upsetting online?", "I will close it and tell an adult.", "I will share it with everyone.", "I will keep it a secret."]], "l": "Three online safety rules: First, never share personal information like your address or school. Second, never meet someone you only know online. Third, always tell a trusted adult if something feels wrong.", "lq": [["What is personal information?", "your address or school", "your favorite color", "the weather"], ["Who should you never meet?", "someone you only know online", "your cousins", "your teacher"], ["Who should you tell if something feels wrong?", "a trusted adult", "nobody", "a stranger"]], "r": "Maha loved playing an online game. One day, a player she didn't know sent her a message: 'You are a great player! Send me your phone number and I will give you free coins.' Maha felt that something was wrong. She didn't reply. Instead, she showed the message to her mother. Her mother helped her block and report the player. Maha felt proud because she made the safe choice.", "rq": [["What did the stranger offer?", "free coins", "a new phone", "a toy"], ["What did Maha do first?", "She didn't reply.", "She sent her number.", "She cried."], ["How did Maha feel at the end?", "proud", "sad", "angry"]]}, {"en": "Coding Robots", "ar": "برمجة الروبوتات", "v": "code|شفرة برمجية|💻;command|أمر|➡️;repeat|يكرر|🔁;step|خطوة|👣;turn|يلتف|↩️;bug|خطأ برمجي|🐞", "c": [["What is coding?", "It's giving instructions to a computer.", "It's a kind of soup.", "Coding is a robot's shoe."], ["How do we make the robot move forward three times?", "We use a repeat command.", "We shout at it.", "We push it with our foot."], ["The robot went the wrong way. Why?", "There is a bug in our code.", "The robot is hungry.", "Robots never make mistakes."], ["How do you fix a bug?", "Check each step carefully and change the wrong one.", "Delete everything and cry.", "Bugs fix themselves."]], "l": "Help the robot reach the star. Move forward two steps. Turn right. Move forward three steps. Turn left. Move forward one step. Well done, you found the star!", "lq": [["How many steps first?", "two", "three", "one"], ["Which way does it turn first?", "right", "left", "around"], ["What does the robot find?", "the star", "a box", "a door"]], "r": "The first computer bug was a real bug! In 1947, a team of engineers found that their giant computer stopped working. They searched inside and found a moth stuck in the machine. They removed it and stuck it in their notebook with the words 'First actual case of bug being found.' Since then, programmers call any mistake in their code a bug, and fixing it is called debugging.", "rq": [["What was the first computer bug?", "a moth", "a spider", "a virus"], ["What did the engineers do with it?", "stuck it in their notebook", "ate it", "threw it away"], ["What is fixing a mistake called?", "debugging", "bugging", "coding"]]}, {"en": "Video Calls", "ar": "مكالمات الفيديو", "v": "call|اتصال|📞;camera|كاميرا|📹;microphone|ميكروفون|🎙️;mute|كتم الصوت|🔇;connection|اتصال بالشبكة|📶;screen|شاشة|🖥️", "c": [["Can you hear me?", "Yes, but your voice is a bit quiet.", "Yes, I am hearing a quiet.", "Hear is a microphone."], ["I can't see you. Is your camera on?", "Sorry, I'll turn it on now.", "Sorry, my camera is eating.", "Camera is me."], ["The picture keeps freezing.", "I think the connection is weak.", "I think the picture is cold.", "Freezing is a camera."], ["Who will you call tonight?", "I'll call my cousin in London.", "I call will tonight cousin.", "Tonight calls me."]], "l": "Every Sunday evening, Omar makes a video call with his grandmother in Egypt. He shows her his drawings and his school projects. She tells him funny stories let voice=null;

try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
const SPEECH=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
let spkQ=[],spkT=0,unlocked=false;
function unlockSpeech(){if(unlocked||!SPEECH)return;unlocked=true;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;u.lang='en-US';speechSynthesis.speak(u)}catch(e){}}
['pointerdown','touchend','keydown'].forEach(ev=>document.addEventListener(ev,unlockSpeech,{capture:true,passive:true}));
function say(text,o={}){
 if(!SPEECH){toast('الصوت غير مدعوم في هذا المتصفح. جرّب Safari أو Chrome.');return}
 const S=speechSynthesis;if(!voice)pickVoice();
 const parts=(String(text).match(/[^.!?]+[.!?]*['"]?/g)||[String(text)]).map(x=>x.trim()).filter(Boolean);
 const rate=o.rate||(LV[ctx.l]&&LV[ctx.l].rate)||.9;
 const go=()=>{spkQ=parts.map(t=>{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=rate;u.pitch=o.pitch||1;u.volume=1;return u});
  spkQ.forEach(u=>{try{S.speak(u)}catch(e){}});try{if(S.paused)S.resume()}catch(e){}};
 clearTimeout(spkT);
 try{if(S.speaking||S.pending){S.cancel();spkT=setTimeout(go,120)}else go()}catch(e){}
}
setInterval(()=>{try{if(SPEECH&&speechSynthesis.speaking&&speechSynthesis.paused)speechSynthesis.resume()}catch(e){}},3000);
document.addEventListener('click',e=>{const t=e.target.closest('[data-say]');if(t)say(t.dataset.say,{pitch:t.dataset.pitch?+t.dataset.pitch:1})});

function gUnscr(L,done){
 const ws=shuffle(V(L).filter(v=>/^[a-z]+$/i.test(v.en)&&v.en.length<=11)).slice(0,5);let r=0,mis=0;
 function round(){const v=ws[r],word=v.en.toLowerCase();let letters,tries=0;do{letters=shuffle(word.split(''))}while(letters.join('')===word&&++tries<8);let ans=[];
  G(`<p class="tip">رتّب الحروف لتكتب الكلمة (${r+1} من ${ws.length})</p><div class="clue"><span class="big-em">${v.em}</span><span>${esc(v.ar)}</span><button class="spk" aria-label="استمع" data-say="${esc(v.en)}">${icon('spk')}</button></div><div class="slots" dir="ltr" id="sl"></div><div class="tiles" dir="ltr" id="tl"></div><div class="btns"><button class="ghost" id="clr">امسح</button></div>`);
  function draw(){$('#sl').innerHTML=letters.map((_,n)=>`<span class="slot">${ans[n]!==undefined?letters[ans[n]]:''}</span>`).join('');
   $('#tl').innerHTML=letters.map((ch,n)=>`<button class="ltr" data-n="${n}" ${ans.includes(n)?'disabled':''}>${ch}</button>`).join('');
   $$('#tl .ltr').forEach(b=>b.onclick=()=>{ans.push(+b.dataset.n);draw();if(ans.length===letters.length)check()})}
  function check(){if(ans.map(n=>letters[n]).join('')===word){ding();say(v.en);$('#sl').classList.add('ok');setTimeout(()=>{++r<ws.length?round():done(starsFrom(mis,0,2))},900)}
   else{buzz();mis++;$('#sl').classList.add('shake');setTimeout(()=>{ans=[];draw();$('#sl').classList.remove('shake')},600)}}
  $('#clr').onclick=()=>{ans=[];draw()};draw();}
 round();
}

function gSpell(L,done){

  G(`<p class="tip">اسمع الكلمة واكتبها بالإنجليزية (${r+1} من ${ws.length})</p><div class="clue"><span class="big-em">${v.em}</span><span>${esc(v.ar)}</span><button class="spk" aria-label="استمع" data-say="${esc(v.en)}">${icon('spk')}</button></div><input id="sp" class="inp" dir="ltr" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="type here"><p class="hintline" dir="ltr" id="hl"></p><div class="btns"><button class="ghost" id="hb">تلميح</button><button class="go" id="ck">تحقّق</button></div>`);
  setTimeout(()=>say(v.en),300);const inp=$('#sp');
  const showHint=()=>{$('#hl').textContent=v.en.slice(0,hint)+' _'.repeat(Math.max(0,v.en.length-hint))};

  const ck=()=>{if(inp.value.trim().toLowerCase()===v.en.toLowerCase()){ding();say(v.en);inp.classList.add('right');setTimeout(()=>{++r<ws.length?round():done(starsFrom(mis,0,2))},800)}
   else{buzz();mis++;wrong++;inp.classList.add('shake');setTimeout(()=>inp.classList.remove('shake'),400);if(wrong>=2){hint=v.en.length;showHint();toast('انظر للكلمة واكتبها')}}};

function gSentence(L,done){
 const ss=L.c.map(c=>c[1]).filter(x=>x.split(' ').length<=14);let r=0,mis=0;
 function round(){const s=ss[r],toks=s.split(' ');let order,tries=0;do{order=shuffle(toks.map((_,n)=>n))}while(order.every((n,k)=>n===k)&&++tries<8);let ans=[];
  G(`<p class="tip">رتّب الكلمات لتكوّن جملة صحيحة (${r+1} من ${ss.length})</p><button class="ghost" data-say="${esc(s)}">اسمع الجملة</button><div class="sent" dir="ltr" id="sa"></div><div class="tiles" dir="ltr" id="st"></div><div class="btns"><button class="ghost" id="clr">امسح</button></div>`);
  function draw(){$('#sa').innerHTML=ans.map((n,k)=>`<button class="tok" data-k="${k}">${esc(toks[n])}</button>`).join('');
   $('#st').innerHTML=order.map(n=>`<button class="tok" data-n="${n}" ${ans.includes(n)?'disabled':''}>${esc(toks[n])}</button>`).join('');
   $$('#sa .tok').forEach(b=>b.onclick=()=>{ans.splice(+b.dataset.k,1);draw()});
   $$('#st .tok').forEach(b=>b.onclick=()=>{ans.push(+b.dataset.n);draw();if(ans.length===toks.length)check()})}
  function check(){if(ans.map(n=>toks[n]).join(' ')===s){ding();say(s);$('#sa').classList.add('ok');setTimeout(()=>{++r<ss.length?round():done(starsFrom(mis,0,2))},1300)}
   else{buzz();mis++;$('#sa').classList.add('shake');setTimeout(()=>{$('#sa').classList.remove('shake')},500)}}
  $('#clr').onclick=()=>{ans=[];draw()};draw();}
 round();
}

function gPop(L,done,token){
 const all=V(L),rounds=shuffle([...all,...shuffle(all).slice(0,2)]);let r=0,mis=0;const speed=34+ctx.l*12,extra=(PART>1||ctx.l>=2)?3:2;
 G(`<p class="tip">اضغط الفقاعة التي تحمل اسم الصورة قبل أن تطير!</p><div class="target" id="tg"></div><div class="field" id="fd" dir="ltr"></div><p class="muted" id="pr" style="text-align:center"></p>`);
 const fd=$('#fd');
 function next(){++r<rounds.length?round():done(starsFrom(mis,0,2))}
 function round(){if(token!==RUN)return;const v=rounds[r];
  $('#tg').innerHTML=`<span class="big-em">${v.em}</span><span>${esc(v.ar)}</span>`;$('#pr').textContent=`${r+1} / ${rounds.length}`;
  fd.innerHTML='';const opts=shuffle([v,...shuffle(all.filter(x=>x.en!==v.en)).slice(0,extra)]);
  const W=fd.clientWidth,H=fd.clientHeight,lane=W/opts.length,lift=shuffle(opts.map((_,n)=>n));let over=false,last=performance.now();
  const bs=opts.map((o,n)=>{const b=document.createElement('button');b.className='bubble';b.textContent=o.en;fd.appendChild(b);const bw=b.offsetWidth;
   const z={b,o,x:Math.max(4,Math.min(W-bw-4,lane*n+(lane-bw)/2)),y:H+10+lift[n]*55,alive:true};
   b.onclick=()=>{if(over||!z.alive)return;if(o.en===v.en){over=true;b.classList.add('popped');ding();say(v.en);setTimeout(next,650)}else{z.alive=false;b.classList.add('miss');mis++;buzz()}};return z});
  function step(now){if(token!==RUN||over)return;const dt=Math.min(.05,(now-last)/1000);last=now;let gone=false;
   bs.forEach(z=>{z.y-=speed*dt;z.b.style.transform=`translate(${z.x}px,${z.y}px)`;if(z.o.en===v.en&&z.y<-60)gone=true});
   if(gone){over=true;mis++;buzz();toast(`الكلمة كانت: ${v.en}`);setTimeout(next,700);return}
   requestAnimationFrame(step)}
  requestAnimationFrame(step);}
 round();
}

  <p style="font-size:20px;font-weight:800">جاهز الآن: <span style="color:var(--sun-deep)">${readyBoard()}</span> ${readyBoard()===1?'نجمة':'نجوم'}</p>
  <p class="muted">بعد أن تضعها في اللوحة (تبويب «مكافأة» ← «أولي: 10 نجوم في الإنجليزية»)، اضغط الزر هنا حتى يبدأ العد من جديد.</p>
  <div id="gvz">${readyBoard()?'<button class="ghost" id="gvb">أعطيته النجوم</button>':''}</div></div>
 <div class="panel"><h3>اختبار الصوت</h3><p>اضغط الزر. إذا سمعت أولي يتكلم فالصوت يعمل.</p><button class="go" id="tst">جرّب الصوت</button><p class="muted" id="tsm"></p></div>
 <div class="panel"><h3>اسم طفلك</h3><input type="text" id="nm" placeholder="مثال: سامي" value="${esc(P.name)}"><button class="go" id="svn">حفظ</button></div>
 <div class="panel"><h3>كيف تستخدمونه معًا</h3><ul>
  <li>جلسة قصيرة كل يوم (15–20 دقيقة) أنفع من جلسة طويلة مرة في الأسبوع.</li>
  <li>في المحادثة، اجلس بجانبه: اقرأ أنت سؤال أولي بصوتك، وهو يجيب ويردد الجملة.</li>
  <li>كل درس فيه 4 أنشطة. يُفتح الدرس التالي بعد إنهاء الأربعة، ويُفتح العالم التالي بعد الفوز بتحديه.</li>
  <li>النجوم: 3 بلا أخطاء، 2 لأخطاء قليلة، 1 للمحاولة. يمكن إعادة أي نشاط لرفع النجوم.</li>
  <li>في هذا الجزء التحديات مفعّلة من البداية: ساعة للعب، وإخفاء نص الاستماع، ووقت أقصر في تحدي كل عالم.</li><li>كل جزء من أولي مستقل، وتقدّمه محفوظ وحده على هذا الجهاز.</li>
  <li>يعتمد الصوت على متصفح الجهاز. إذا لم تسمع شيئًا على الآيفون، أطفئ الوضع الصامت وارفع الصوت.</li>
  <li>التقدم محفوظ على هذا الجهاز وهذا المتصفح فقط.</li></ul></div>
 <div class="panel"><div class="switch"><span>فتح كل العوالم والدروس</span><button class="ghost" id="ua">${P.all?'مفتوحة · أقفلها':'افتحها'}</button></div><p class="muted">مفيد إذا كان طفلك يعرف أول هذا الجزء ويريد البدء من عالم أعلى.</p></div>
 <div class="panel"><h3>البدء من جديد</h3><div id="rz"><button class="ghost danger" id="rs">مسح كل التقدم</button></div></div>`);
 $('#svn').onclick=()=>{P.name=$('#nm').value.trim().slice(0,24);save();toast('تم الحفظ')};
 $('#ua').onclick=()=>{P.all=!P.all;save();parents()};
 const gvb=$('#gvb');if(gvb)gvb.onclick=()=>{const n=readyBoard();if(gvb.dataset.armed){P.given=earned();save();toast(`سُجّلت ${n} ${n===1?'نجمة':'نجوم'} كمُعطاة`);parents()}else{gvb.dataset.armed='1';gvb.textContent=`تأكيد: أعطيته ${n}`;gvb.className='go'}};
 $('#tst').onclick=()=>{say("Hello! I am Ollie. Let's learn English together!",{rate:.9});const m=$('#tsm');
  if(!SPEECH){m.textContent='هذا المتصفح لا يدعم الصوت. افتح الرابط في Safari أو Chrome.';return}
  const en=(speechSynthesis.getVoices()||[]).filter(v=>/^en/i.test(v.lang)).length;
  m.textContent=en?'إذا لم تسمع شيئًا: أطفئ الوضع الصامت في الآيفون وارفع صوت الوسائط.':'لم أجد صوتًا إنجليزيًا في الجهاز بعد. انتظر ثواني وجرّب مرة ثانية، أو أضف صوتًا إنجليزيًا من إعدادات الجهاز (تسهيلات الاستخدام ← المحتوى المنطوق ← الأصوات).'};
 $('#rs').onclick=()=>{$('#rz').innerHTML=`<p>هل أنت متأكد؟ ستُمسح كل النجوم.</p><div class="btns"><button class="go" id="yes" style="background:var(--bad);box-shadow:0 5px 0 #8f2226">نعم، امسح</button><button class="ghost" id="no">إلغاء</button></div>`;
  $('#yes').onclick=()=>{P.s={};P.given=0;save();toast('تم مسح التقدم');parents()};$('#no').onclick=parents};
}

/* ---------- confetti ---------- */
function confetti(){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const cols=['#FFBE2E','#27A85A','#2B6FCC','#E0702A','#6447D1','#DD444A'];
 const ps=Array.from({length:110},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6.28,s:5+Math.random()*6,c:cols[Math.random()*6|0]}));
 const end=performance.now()+2600;
 (function f(now){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
  if(now<end)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})(performance.now());
}

document.documentElement.dir='rtl';document.documentElement.lang='ar';
home();
</script>
</body>
</html>
