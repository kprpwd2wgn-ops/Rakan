<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: one centered column; worlds stack like toy blocks, each world's lessons wind down a path */
:root{
  --bg:#EDF4F9; --paper:#FFFFFF; --ink:#172636; --muted:#5A6C7D; --line:#D4E1EB;
  --sun:#FFBE2E; --sun-deep:#B37600;
  --good:#1C9F5F; --good-soft:#DDF5E8; --bad:#DD444A; --bad-soft:#FCE4E5;
  --lv:#2E8BC9; --lv-deep:#1C5F8C; --lv-soft:#E0EEF8;
  --f-ui:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;
  --f-en:"Andika","Baloo Bhaijaan 2",Verdana,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
[dir="ltr"]{font-family:var(--f-en)}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.fill{fill:currentColor;stroke:none}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;gap:10px;padding-block:10px;background:var(--bg)}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--paper);box-shadow:0 3px 0 var(--line)}
.iconbtn.ph{visibility:hidden}
.bar-t{unicode-bidi:plaintext;flex:1;min-width:0;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.pill{display:flex;align-items:center;gap:4px;background:var(--paper);padding:6px 12px;border-radius:999px;box-shadow:0 3px 0 var(--line);color:var(--sun-deep);font-weight:800;font-variant-numeric:tabular-nums}
.pill .ico{color:var(--sun)}

/* home */
.hero{display:flex;gap:14px;align-items:center;padding-block:8px 18px}
.owl{font-size:58px;line-height:1;width:84px;height:84px;display:grid;place-items:center;background:var(--paper);border-radius:28px;box-shadow:0 5px 0 var(--line);flex:none}
.hello{font-weight:800;font-size:22px}
.hero h1{font-size:17px;font-weight:700;color:var(--lv-deep)}
.muted{color:var(--muted);font-size:14px}
.worlds{display:flex;flex-direction:column;gap:16px}
.world{display:flex;align-items:center;gap:14px;text-align:start;background:var(--paper);border-radius:22px;padding:14px;box-shadow:0 6px 0 var(--lv-deep);border:2px solid var(--lv);transition:transform .12s}
.world:active{transform:translateY(4px);box-shadow:0 2px 0 var(--lv-deep)}
.w-art{font-size:40px;width:66px;height:66px;border-radius:20px;background:var(--lv-soft);display:grid;place-items:center;flex:none}
.w-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.w-txt b{font-size:19px}
.w-txt i{font-style:normal;color:var(--lv-deep);font-weight:700;font-size:14px}
.w-txt small{color:var(--muted);font-size:13px}
.w-num{font-weight:800;color:var(--lv-deep);font-size:13px;position:absolute}
.prog{height:8px;background:var(--lv-soft);border-radius:9px;overflow:hidden;margin-block:4px 2px}
.prog span{display:block;height:100%;background:var(--lv);border-radius:9px}
.locked{filter:grayscale(1);opacity:.55}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.ghost{background:var(--paper);border-radius:14px;padding:10px 14px;font-weight:700;box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.ghost:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.go{background:var(--lv);color:#fff;border-radius:14px;padding:11px 18px;font-weight:800;box-shadow:0 5px 0 var(--lv-deep)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--lv-deep)}
.go:disabled{opacity:.45}

/* level path */
.lv-hero{display:flex;gap:14px;align-items:center;background:var(--lv);color:#fff;border-radius:24px;padding:16px;margin-block:4px 22px;box-shadow:0 6px 0 var(--lv-deep)}
.lv-art{font-size:46px;width:72px;height:72px;border-radius:22px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.04em;opacity:.9}
.lv-hero h1{font-size:24px}
.path{position:relative;display:flex;flex-direction:column;gap:18px;padding-block:6px}
.path::before{content:"";position:absolute;inset-block:30px;inset-inline-start:50%;border-inline-start:4px dashed var(--line)}
.node{position:relative;display:flex;align-items:center;gap:12px;text-align:start;width:min(100%,290px)}
.pos0{margin-inline-start:0}.pos1{margin-inline-start:18%}.pos2{margin-inline-start:34%}.pos3{margin-inline-start:12%}
.disc{width:72px;height:72px;border-radius:50%;background:var(--lv);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:800;box-shadow:0 6px 0 var(--lv-deep);flex:none;border:4px solid var(--paper)}
.node.done .disc{background:var(--sun);color:var(--ink);box-shadow:0 6px 0 var(--sun-deep)}
.node.locked .disc{background:#B8C4CE;box-shadow:0 6px 0 #8E9BA6}
.nlab{background:var(--paper);border-radius:16px;padding:8px 12px;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;min-width:0}
.nlab b{font-size:16px}
.nlab small{color:var(--muted)}
.nst{display:flex;align-items:center;gap:3px;color:var(--sun-deep);font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.nst .ico{width:15px;height:15px;color:var(--sun)}
.node.boss .disc{width:86px;height:86px;background:#1F2A37;color:var(--sun);box-shadow:0 6px 0 #000}
.node.boss .disc .ico{width:38px;height:38px}

/* lesson */
.les-h{padding-block:6px 14px}
.les-h h1{font-size:28px;color:var(--lv-deep)}
.vocab{display:flex;gap:10px;overflow-x:auto;padding-block:4px 12px;margin-bottom:10px;scrollbar-width:thin}
.vw{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--paper);border-radius:16px;padding:10px 12px;min-width:92px;box-shadow:0 4px 0 var(--line)}
.vw .e{font-size:30px;line-height:1.1}
.vw b{font-family:var(--f-en);font-size:15px}
.vw small{color:var(--muted);font-size:12px}
.sec-t{font-weight:800;font-size:15px;color:var(--muted);margin-block:6px 10px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:start;background:var(--paper);border-radius:20px;padding:14px;border:2px solid var(--lv-soft);box-shadow:0 5px 0 var(--lv-soft)}
.act:active{transform:translateY(3px)}
.act .ai{width:46px;height:46px;border-radius:14px;background:var(--lv-soft);color:var(--lv-deep);display:grid;place-items:center}
.act .ai .ico{width:26px;height:26px}
.act b{font-size:17px}
.act small{color:var(--muted);font-family:var(--f-en);font-size:13px}
.stars{display:flex;gap:2px}
.stars .ico{width:18px;height:18px;color:#D3DCE3}
.stars .on{color:var(--sun)}

/* activity panes */
.pane{display:flex;flex-direction:column;gap:14px}
.tip{background:var(--lv-soft);color:var(--lv-deep);border-radius:14px;padding:10px 14px;font-weight:600;font-size:15px}
.chat{display:flex;flex-direction:column;gap:10px;min-height:120px}
.bub{display:flex;align-items:flex-end;gap:8px;max-width:92%}
.bub p{background:var(--paper);border-radius:18px 18px 18px 4px;padding:10px 14px;font-size:18px;box-shadow:0 3px 0 var(--line);min-width:0}
.bub.kid{align-self:flex-end;flex-direction:row-reverse}
.bub.kid p{background:var(--lv);color:#fff;border-radius:18px 18px 4px 18px;box-shadow:0 3px 0 var(--lv-deep)}
.av{font-size:30px;line-height:1;flex:none}
.spk{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--lv-soft);color:var(--lv-deep);flex:none}
.spk.sm{width:34px;height:34px}
.spk.sm .ico{width:18px;height:18px}
.opts,.q-o{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-family:var(--f-en);font-size:17px;box-shadow:0 4px 0 var(--line)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.right{background:var(--good-soft)!important;border-color:var(--good)!important;box-shadow:0 4px 0 var(--good)!important}
.wrong{background:var(--bad-soft)!important;border-color:var(--bad)!important;box-shadow:0 4px 0 var(--bad)!important;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .4s}
.repeat{background:var(--paper);border:2px dashed var(--lv);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns>*{flex:1}
.player{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.play{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--lv);color:#fff;border-radius:18px;padding:14px 20px;font-weight:800;font-size:18px;box-shadow:0 5px 0 var(--lv-deep)}
.play .ico{width:28px;height:28px}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 var(--lv-deep)}
.text{background:var(--paper);border-radius:18px;padding:16px;font-size:20px;line-height:1.75;box-shadow:0 4px 0 var(--line);text-align:left}
.w{border-radius:6px;cursor:pointer}
.w:active{background:var(--sun)}
.q{background:var(--paper);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 0 var(--line)}
.q.ok{outline:2px solid var(--good)}
.q-h{display:flex;gap:10px;align-items:center;font-size:18px;font-weight:700}

/* games */
.g-head{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.g-head span{font-variant-numeric:tabular-nums;color:var(--muted)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{display:flex;flex-direction:column;gap:10px}
.tile{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:10px;font-size:17px;box-shadow:0 4px 0 var(--line);min-height:54px}
.tile.em{font-size:30px;line-height:1}
.tile.em.big{font-size:44px;min-height:92px}
.tile.sel{border-color:var(--lv);box-shadow:0 4px 0 var(--lv);background:var(--lv-soft)}
.tile.gone{visibility:hidden}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{aspect-ratio:3/4;max-width:100%;border-radius:14px;background:var(--lv);color:#fff;display:grid;place-items:center;box-shadow:0 4px 0 var(--lv-deep);font-size:28px;font-weight:800;padding:4px}
.card .front{display:none}
.card.up{background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.card.up .front{display:block}
.card.up .back{display:none}
.card .front.en{font-size:14px;word-break:break-word;line-height:1.2}
.card.got{background:var(--good-soft);border-color:var(--good)}
.clue{display:flex;align-items:center;justify-content:center;gap:14px;background:var(--paper);border-radius:18px;padding:12px;box-shadow:0 4px 0 var(--line);font-weight:700;font-size:18px}
.big-em{font-size:52px;line-height:1}
.slots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;min-height:52px}
.slot{width:40px;height:48px;border-radius:10px;background:var(--paper);border-bottom:4px solid var(--lv);display:grid;place-items:center;font-size:24px;font-weight:700;font-family:var(--f-en)}
.slots.ok .slot{border-color:var(--good);background:var(--good-soft)}
.tiles{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.ltr,.tok{min-width:46px;height:50px;padding:0 12px;border-radius:12px;background:var(--sun);color:var(--ink);font-family:var(--f-en);font-size:22px;font-weight:700;box-shadow:0 4px 0 var(--sun-deep)}
.tok{font-size:17px;height:44px}
.ltr:disabled,.tok:disabled{opacity:.2}
.sent{display:flex;flex-wrap:wrap;gap:8px;min-height:64px;background:var(--paper);border-radius:16px;padding:10px;border:2px dashed var(--line);align-content:flex-start}
.sent .tok{background:var(--lv);color:#fff;box-shadow:0 4px 0 var(--lv-deep)}
.sent.ok{border-color:var(--good);background:var(--good-soft)}
.inp{width:100%;font-family:var(--f-en);font-size:26px;text-align:center;padding:12px;border-radius:14px;border:3px solid var(--line);background:var(--paper);color:var(--ink)}
.hintline{text-align:center;font-size:22px;letter-spacing:.2em;color:var(--lv-deep);min-height:30px}
.target{display:flex;align-items:center;justify-content:center;gap:12px;font-weight:700;font-size:18px}
.field{position:relative;height:340px;border-radius:20px;overflow:hidden;background:linear-gradient(var(--lv-soft),var(--paper));border:2px solid var(--line)}
.bubble{position:absolute;left:0;top:0;padding:10px 14px;border-radius:999px;background:var(--paper);border:3px solid var(--lv);font-family:var(--f-en);font-size:15px;font-weight:700;white-space:nowrap;box-shadow:inset -4px -6px 0 var(--lv-soft)}
.bubble.popped{background:var(--good);color:#fff;border-color:var(--good);transition:opacity .5s;opacity:0}
.bubble.miss{background:var(--bad-soft);border-color:var(--bad);opacity:.5}

/* boss */
.boss-head{display:flex;align-items:center;gap:10px;justify-content:space-between;font-weight:800}
.boss-head .ico{color:var(--sun-deep);width:28px;height:28px}
.timer{height:12px;border-radius:9px;background:var(--line);overflow:hidden}
.timer span{display:block;height:100%;width:100%;background:var(--sun)}
.bprompt{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--paper);border-radius:20px;padding:16px;box-shadow:0 4px 0 var(--line);text-align:center;font-weight:700}
.ar-word{font-size:34px;font-weight:800;color:var(--lv-deep)}
.intro{background:var(--paper);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 5px 0 var(--line)}
.intro ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}

/* result */
.result{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding-block:24px}
.result .bigstars{display:flex;gap:8px}
.result .bigstars .ico{width:64px;height:64px;color:#D3DCE3;animation:pop .5s backwards}
.result .bigstars .on{color:var(--sun)}
.result .bigstars .ico:nth-child(2){animation-delay:.15s}.result .bigstars .ico:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(0)}}
.result h2{font-size:30px}
.result .btns{width:100%;flex-direction:column}

/* words + parents */
.wl{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-bottom:22px}
.wl .vw{min-width:0}
.panel{background:var(--paper);border-radius:20px;padding:16px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.panel h3{font-size:18px}
.panel ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.panel input[type=text]{font:inherit;font-size:18px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700}
.danger{color:var(--bad);border-color:var(--bad-soft)}
.link{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 var(--sun);border:2px solid var(--sun);margin-bottom:18px}
.link .big{font-size:30px;font-weight:800;color:var(--sun-deep);font-variant-numeric:tabular-nums;min-width:40px;text-align:center}
.link small{display:block;color:var(--muted);font-size:13px}
.prog.sun{background:#FFF1CC}.prog.sun span{background:var(--sun)}
a.go{display:inline-block;text-align:center;text-decoration:none}
.gift{background:var(--sun);color:var(--ink);font-weight:800;padding:10px 16px;border-radius:14px;box-shadow:0 4px 0 var(--sun-deep)}
.owl svg{display:block}
.partb{display:inline-block;background:var(--lv-soft);color:var(--lv-deep);font-weight:800;font-size:13px;padding:2px 10px;border-radius:999px;margin-block:2px}
.result a.go{width:100%}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;z-index:20;max-width:calc(100% - 32px);text-align:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:15}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.mem{grid-template-columns:repeat(3,1fr)}.pos2{margin-inline-start:22%}}

/* ===== added with the new games, the daily challenge and the sticker album ===== */
.owl{cursor:pointer}
.owl.hop{animation:hop .5s}
@keyframes hop{30%{transform:translateY(-10px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
/* something is being read aloud */
.speaking{outline:3px solid var(--sun);outline-offset:2px;animation:pulse 1s infinite}
@keyframes pulse{50%{outline-color:transparent}}
.sn{border-radius:6px;transition:background .2s;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sn.on{background:#FFE9A6;box-shadow:0 0 0 3px #FFE9A6}

/* home: daily challenge, shortcuts, parts */
.daily{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:linear-gradient(135deg,#F9813A,#E4532A);color:#fff;border-radius:22px;padding:14px;box-shadow:0 6px 0 #A63A19;margin-bottom:16px}
.daily:active{transform:translateY(4px);box-shadow:0 2px 0 #A63A19}
.daily.done{background:linear-gradient(135deg,#2DB866,#1C9F5F);box-shadow:0 6px 0 #14713F}
.daily.done:active{box-shadow:0 2px 0 #14713F}
.d-ic{font-size:32px;line-height:1;width:58px;height:58px;border-radius:18px;background:rgba(255,255,255,.24);display:grid;place-items:center;flex:none}
.d-t{flex:1;min-width:0;display:flex;flex-direction:column}
.d-t b{font-size:19px}
.d-t small{font-size:13px}
.d-n{display:flex;flex-direction:column;align-items:center;background:rgba(255,255,255,.24);border-radius:16px;padding:6px 10px;flex:none}
.d-n b{font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.d-n small{font-size:11px;white-space:nowrap}
.tiles4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.tile4{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;background:var(--paper);border-radius:16px;padding:10px 2px 8px;box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.tile4:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tile4 span{font-size:26px;line-height:1.15}
.tile4 b{font-size:13px;line-height:1.3}
.tile4 .dot{position:absolute;top:-7px;inset-inline-end:-5px;min-width:22px;height:22px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-style:normal;font-weight:800;font-size:12px;line-height:22px;font-variant-numeric:tabular-nums}
.parts{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:24px}
.parts span{flex-basis:100%;text-align:center;color:var(--muted);font-weight:700;font-size:14px}
.parts a,.parts b{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:800;text-decoration:none;background:var(--paper);color:var(--lv-deep);box-shadow:0 3px 0 var(--line);font-variant-numeric:tabular-nums}
.parts b{background:var(--lv);color:#fff;box-shadow:0 3px 0 var(--lv-deep)}

/* lesson: more games */
.acts+.sec-t{margin-top:24px}
.xg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.xb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;text-align:start;background:var(--paper);border-radius:14px;padding:8px 10px;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);min-height:54px}
.xb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.xb .xe{font-size:22px;line-height:1}
.xb b{font-size:14px;flex:1;min-width:0;line-height:1.3}
.xb .stars .ico{width:13px;height:13px}

/* letter boxes for long words */
.slots.long .slot{width:26px;height:40px;font-size:19px}
.slot.gap{background:none;border-bottom-color:transparent;width:12px}
.slots.words{gap:8px 18px}
.wgrp{display:flex;gap:6px}

/* true or false */
.tfc{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--paper);border-radius:22px;padding:18px;box-shadow:0 5px 0 var(--line);text-align:center}
.tfc .big-em{font-size:64px}
.tfw{font-family:var(--f-en);font-size:30px;line-height:1.2;color:var(--lv-deep)}
.tfb{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf{border-radius:18px;padding:16px 10px;font-size:20px;font-weight:800;color:#fff;border:2px solid transparent}
.tf.yes{background:var(--good);box-shadow:0 5px 0 #14713F}
.tf.no{background:var(--bad);box-shadow:0 5px 0 #8f2226}
.tf:active{transform:translateY(3px)}
.tf.right,.tf.wrong{color:var(--ink)}
.fixline{text-align:center;font-weight:700;min-height:28px;font-size:17px}
.fixline b{font-family:var(--f-en);color:var(--lv-deep)}

/* hide and seek */
.bushes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;background:linear-gradient(#CDEBFF,#E6F6DF 70%);border-radius:20px;padding:14px 10px 10px;border:2px solid var(--line)}
.bush{position:relative;height:116px;overflow:hidden;border-radius:14px}
.bush-art{position:absolute;left:0;right:0;bottom:0;width:100%;height:64px;z-index:1;pointer-events:none}
.peek{position:absolute;left:50%;bottom:46px;font-size:46px;line-height:1.15;transform:translate(-50%,84px);transition:transform .2s cubic-bezier(.3,1.4,.6,1)}
.bush.up .peek{transform:translate(-50%,0)}
.bush.glow .peek{filter:drop-shadow(0 0 7px var(--sun-deep))}
.bush.got .peek{transform:translate(-50%,-4px) scale(1.15)}
.tgw{font-family:var(--f-en);font-size:24px;color:var(--lv-deep)}

/* missing word */
.gapc{display:flex;gap:10px;align-items:flex-start;background:var(--paper);border-radius:18px;padding:14px;box-shadow:0 4px 0 var(--line);text-align:left}
.gapc p{font-family:var(--f-en);font-size:21px;line-height:1.75;flex:1;min-width:0}
.blank{display:inline-block;min-width:76px;border-bottom:4px solid var(--lv);border-radius:6px 6px 0 0;background:var(--lv-soft);text-align:center;padding:0 8px;font-weight:700;line-height:1.35}
.blank.ok{background:var(--good-soft);border-color:var(--good);color:#11663C}
.opt.c{text-align:center;font-weight:700}

/* Ollie's balloons */

  c:[["How is a pearl made?","A tiny piece of sand gets inside an oyster, and the oyster covers it layer by layer.","Pearls grow on palm trees.","A fish makes pearls in a factory."],["Why were Gulf pearls so valuable?","They were famous for their beauty and quality.","They were very cheap.","They were made of plastic."],["What happened to pearl diving after the 1930s?","It became less important when oil was discovered and cultured pearls appeared.","It became the biggest job in the world.","Nothing has changed since then."],["Have you ever seen a real pearl?","Yes, my grandmother has a pearl necklace.","Yes, I have see a pearl yesterday.","Pearl has seen me."]],
  l:"In Bahrain, the old pearling path is now a UNESCO World Heritage Site. Visitors can walk past the old houses of pearl merchants and learn about the hard life of the divers.",
  lq:[["Where is the old pearling path?","in Bahrain","in Egypt","in India"],["What is it now?","a UNESCO World Heritage Site","a shopping mall","a beach"],["What can visitors learn about?","the hard life of the divers","modern cars","space"]],
  r:"When a diver came back to the boat with a basket of oysters, the crew opened them one by one. Most were empty. Sometimes there was a small, plain pearl. Very rarely, a large, perfectly round, shining pearl appeared, and the whole crew celebrated. The captain, called the nokhada, sold the pearls to merchants, who sent them to India and later to Europe. Even though the divers worked hardest, they often earned the least money.",
  rq:[["What did the crew find in most oysters?","nothing","a large pearl","a small fish"],["Who sold the pearls to merchants?","the captain, called the nokhada","the divers","the children"],["Who earned the least money?","the divers","the merchants","the captain"]]}
 ]},

 {en:"Ancient Egypt",ar:"مصر القديمة",v:"pyramid|هرم|🔺;pharaoh|فرعون|👑;tomb|مقبرة|⚰️;ancient|قديم جدًا|🏺;hieroglyphs|الكتابة الهيروغليفية|𓂀;Nile|النيل|🏞️",
  c:[["What were the pyramids built for?","They were built as tombs for the pharaohs.","They were built as shopping malls.","They were built for camels to sleep in."],["How did the ancient Egyptians write?","They used pictures called hieroglyphs.","They used computers.","They didn't write anything."],["Why was the Nile important?","It gave water for farming and travel.","It was a big desert.","It was a famous pharaoh."],["Have you ever visited Egypt?","Not yet, but I'd love to see the pyramids.","Yes, I have visit it tomorrow.","Egypt has visited me."]],
  l:"The Great Pyramid of Giza was built about four thousand five hundred years ago. It was the tallest building in the world for almost four thousand years. Thousands of workers built it.",
  lq:[["When was the Great Pyramid built?","about four thousand five hundred years ago","five hundred years ago","last century"],["How long was it the tallest building?","almost four thousand years","forty years","one year"],["Who built it?","thousands of workers","one pharaoh alone","aliens"]],
  r:"For hundreds of years, nobody could read hieroglyphs. Then, in 1799, soldiers found a stone near the town of Rosetta in Egypt. The Rosetta Stone had the same text written in three scripts: hieroglyphs, another Egyptian script and ancient Greek. Because scholars could read Greek, they could compare the texts. In 1822, a French scholar named Champollion finally understood the hieroglyphs. Suddenly, the walls of temples and tombs could tell their stories again.",
  rq:[["When was the Rosetta Stone found?","in 1799","in 1822","in 2000"],["How many scripts were on the stone?","three","one","ten"],["Why was Greek helpful?","Scholars could read it.","It was the easiest.","It was the biggest."],["Who understood the hieroglyphs?","Champollion","a soldier","a pharaoh"]]},
 {en:"Golden Age Scholars",ar:"علماء العصر الذهبي",v:"scholar|عالِم|🧑‍🎓;library|مكتبة|📚;astronomy|علم الفلك|🔭;algebra|الجبر|➗;translate|يترجم|🔤;observe|يرصد|👀",
  c:[["What was the House of Wisdom?","A famous library and center of learning in Baghdad.","A big palace for kings to sleep.","A shop that sold houses."],["Who is called the father of algebra?","Al-Khwarizmi.","Al-Khwarizmi's camel.","Nobody knows anything about algebra."],["Why did scholars translate books?","To share knowledge from other cultures.","To make the books heavier.","Because they had nothing to do."],["Which scholar would you like to meet?","I'd like to meet Ibn Sina and ask him about medicine.","I'd like meet he medicine.","Scholar meets me."]],
  l:"Ibn Sina was born more than a thousand years ago. He was a doctor and a writer. His book, The Canon of Medicine, was used in universities in Europe for hundreds of years.",
  lq:[["What was Ibn Sina?","a doctor and a writer","a sailor","a king"],["What was his famous book?","The Canon of Medicine","The House of Wisdom","The Rosetta Stone"],["Where was his book used?","in universities in Europe","only in his home","nowhere"]],
  r:"About twelve hundred years ago, Baghdad was one of the greatest cities of learning in the world. Scholars came from many lands to study and work at the House of Wisdom. They translated books from Greek, Persian and Indian into Arabic, and then they added their own discoveries. Al-Khwarizmi wrote about algebra; his name gave us the word 'algorithm,' which computers use today. Other scholars studied the stars, built observatories and made more accurate maps. Their work later helped European scientists during the Renaissance.",
  rq:[["What was Baghdad known for?","learning","fishing","snow"],["What languages were books translated from?","Greek, Persian and Indian","only English","Chinese and Japanese"],["What word comes from Al-Khwarizmi's name?","algorithm","algebra only","alphabet"],["Whom did their work later help?","European scientists during the Renaissance","pirates","pharaohs"]]},
 {en:"The Silk Road",ar:"طريق الحرير",v:"trade|تجارة|🔄;silk|حرير|🧵;route|طريق|🗺️;merchant|تاجر|🧔;caravan|قافلة|🐫;goods|بضائع|📦",
  c:[["What was the Silk Road?","A network of trade routes between China and the Mediterranean.","A road made of silk cloth.","A river in Africa."],["What did merchants trade?","Silk, spices, paper, glass and many other goods.","Only video games.","They traded nothing."],["How did merchants travel?","In caravans with camels and horses.","By plane and train.","On skateboards."],["Besides goods, what else traveled along the road?","Ideas, languages, religions and inventions.","Only the wind.","Nothing at all."]],
  l:"The Silk Road was not one road. It was a network of many routes over land and sea. It was used for more than one thousand five hundred years and connected East Asia with Europe and Africa.",
  lq:[["Was the Silk Road one single road?","No, it was a network of routes.","Yes, one long road.","It was a river."],["How long was it used?","more than one thousand five hundred years","ten years","one hundred years"],["What did it connect?","East Asia with Europe and Africa","only two villages","America and Australia"]],
  r:"Paper was invented in China. For centuries, the Chinese kept the secret of how to make it. In the eighth century, papermaking reached the city of Samarkand, along the Silk Road, and soon after that, Baghdad opened its first paper mill. Paper was cheaper and lighter than the old writing materials, so books became easier to make. Libraries grew, and knowledge spread faster. Later, the technique traveled to Spain and the rest of Europe. A simple invention changed how the whole world learned.",
  rq:[["Where was paper invented?","China","Spain","Egypt"],["Which city on the Silk Road learned papermaking?","Samarkand","Paris","London"],["Why did books become easier to make?","Paper was cheaper and lighter.","There were more trees.","People stopped writing."],["What does the text say about paper?","It changed how the world learned.","It was useless.","Only kings used it."]]},
 {en:"Castles and Forts",ar:"القلاع والحصون",v:"fort|حصن|🏯;wall|سور|🧱;tower|برج|🗼;gate|بوابة|🚪;guard|حارس|💂;protect|يحمي|🛡️",
  c:[["Why did people build forts?","To protect their towns from enemies.","To keep their cars clean.","For birds to live in."],["What did the guards do in the towers?","They watched for danger.","They slept and cooked.","They played video games."],["Have you ever visited Al Masmak Fort?","Yes, I visited it on a school trip in Riyadh.","Yes, I have visit it last week ago.","The fort has visited me."],["What were the walls made of?","Mud bricks and stone.","Glass and plastic.","Chocolate and candy."]],
  l:"Al Masmak Fort is in the center of Riyadh. It was built about one hundred and fifty years ago from mud and clay. Today, it is a museum that tells the story of the founding of the Kingdom.",
  lq:[["Where is Al Masmak Fort?","in the center of Riyadh","in Jeddah","in Abha"],["What was it built from?","mud and clay","glass","steel"],["What is it today?","a museum","a hotel","a school"]],
  r:"In 1902, a young man named Abdulaziz Al Saud and a small group of his men arrived at Riyadh at night. At dawn, they captured Al Masmak Fort. This event was the beginning of a long journey to unite most of the Arabian Peninsula. Thirty years later, in 1932, the Kingdom of Saudi Arabia was officially established. Today, visitors to the fort can still see the spearhead stuck in the old wooden door, a reminder of that famous morning.",
  rq:[["When did Abdulaziz capture the fort?","in 1902","in 1932","in 2002"],["When did they arrive at Riyadh?","at night","at noon","in the afternoon"],["When was the Kingdom officially established?","in 1932","in 1902","in 1950"],["What can visitors still see in the door?","a spearhead","a key","a window"]]},
 {en:"Old Inventions",ar:"اختراعات قديمة",v:"compass|بوصلة|🧭;astrolabe|إسطرلاب|🌐;sundial|ساعة شمسية|☀️;windmill|طاحونة هواء|🌬️;lens|عدسة|🔎;design|يصمم|📐",
  c:[["What was an astrolabe used for?","To find the time and the position of the stars.","To cook rice.","To catch fish."],["How did a sundial show the time?","With the shadow from the sun.","With a battery.","By talking."],["Who improved the astrolabe in the Islamic world?","Many scholars, including Mariam al-Ijliya.","Nobody ever improved it.","A famous camel."],["If you lived a thousand years ago, what would you miss most?","I would miss electricity and the internet.","I would miss the pyramids.","I would miss nothing."]],
  l:"A compass has a small magnet inside. The magnet always points north. Sailors used compasses to find their way across the sea, even when they couldn't see the stars.",
  lq:[["What is inside a compass?","a small magnet","a battery","a clock"],["Which way does it point?","north","south","up"],["When was it especially useful?","when sailors couldn't see the stars","in the desert at noon","only at home"]],
  r:"Mariam al-Ijliya lived in the city of Aleppo more than one thousand years ago. Her father was an astrolabe maker, and she learned the craft from him. Her astrolabes were so accurate and beautifully made that the ruler of the city employed her at his court. An astrolabe could help people tell the time, find the direction of prayer and measure the height of mountains. In 1990, an asteroid was named '7060 Al-'Ijliya' in her honor.",
  rq:[["Where did Mariam al-Ijliya live?","Aleppo","Cairo","Riyadh"],["Who taught her the craft?","her father","her teacher","the ruler"],["What could an astrolabe help people find?","the direction of prayer","lost keys","oil"],["What was named after her?","an asteroid","a city","a ship"]]},
 {en:"Museums",ar:"المتاحف",v:"exhibit|معروض|🖼️;collection|مجموعة|🗃️;curator|أمين المتحف|🧑‍💼;display|يعرض|🪟;fossil|أحفورة|🦴;audio guide|دليل صوتي|🎧",
  c:[["What's the most interesting exhibit you've seen?","I've seen a dinosaur fossil that was ten meters long.","I have seen a fossil it was long.","Exhibit has seen me."],["Why shouldn't we touch the exhibits?","Because they are old and can be damaged easily.","Because they bite.","Because they are made of ice cream."],["What does a curator do?","A curator chooses and cares for the museum's collection.","A curator sells tickets for buses.","A curator cleans the street."],["Would you rather visit a science museum or a history museum?","I'd rather visit a science museum because I love experiments.","I'd rather visiting museums to sleep.","Rather is a museum."]],
  l:"Welcome to the National Museum. Please don't take photos with flash, and don't touch the displays. You can borrow an audio guide at the information desk. Enjoy your visit!",
  lq:[["What shouldn't visitors use?","flash","their eyes","audio guides"],["What shouldn't they touch?","the displays","the floor","the doors"],["Where can they borrow an audio guide?","at the information desk","at the café","outside"]],
  r:"Museums are not just places for old things. Modern museums use technology to make history come alive. In some museums, you can use virtual reality glasses to walk through an ancient city. In others, you can touch a screen to see how a vase looked before it broke. Children can join workshops to make pottery or write their names in ancient scripts. A good museum doesn't only show us the past; it helps us understand who we are today.",
  rq:[["What do modern museums use?","technology","only old books","nothing"],["What can virtual reality glasses do?","let you walk through an ancient city","fix vases","sell tickets"],["What can children do in workshops?","make pottery","drive cars","sleep"],["What does a good museum help us understand?","who we are today","how to cook","how to dive"]]}
 ]},

 {en:"Healthy Habits",ar:"عادات صحية",v:"habit|عادة|🔁;balanced|متوازن|⚖️;vitamin|فيتامين|🍊;junk food|أطعمة غير صحية|🍟;sleep|نوم|😴;hydrated|مرتوٍ|💧",
  c:[["I'm always tired in the morning. What should I do?","You should go to bed earlier and avoid screens at night.","You should drink more fizzy drinks.","You should sleep in the bathroom."],["Should I eat junk food every day?","No, you shouldn't. It's fine only sometimes.","Yes, you should eat it at every meal.","Junk food should eat you."],["How can I get more vitamins?","You should eat more fruit and vegetables.","You should eat more candy.","You should eat vitamins from the floor."],["Why should we drink water often?","To stay hydrated, especially in hot weather.","To make our hair blue.","Water is bad for us."]],
  l:"Doctors say that children aged six to twelve should sleep between nine and twelve hours every night. Sleep helps your brain remember what you learned and helps your body grow.",
  lq:[["How long should children sleep?","between nine and twelve hours","four hours","fifteen hours"],["What does sleep help the brain do?","remember what you learned","forget everything","stop working"],["What else does sleep help?","your body grow","you get taller in one night","nothing"]],
  r:"Scientists say it takes about two months to build a new habit. The trick is to start small. If you want to read more, don't start with one hour a day; start with five minutes. If you want to drink more water, keep a bottle on your desk. Connect the new habit to something you already do, for example, read a page right after you brush your teeth at night. And don't worry if you miss one day. Just start again the next day. Small steps, repeated many times, lead to big changes.",
  rq:[["How long does it take to build a habit?","about two months","one day","ten years"],["What is the trick?","Start small.","Start big.","Never start."],["What should you do if you miss a day?","Start again the next day.","Give up.","Do double tomorrow."],["What lead to big changes?","small steps repeated many times","one big step","luck"]]},
 {en:"First Aid",ar:"الإسعافات الأولية",v:"bandage|ضمادة|🩹;cut|جرح|🩸;burn|حرق|🔥;emergency|طوارئ|🚨;ambulance|سيارة إسعاف|🚑;calm|هادئ|😌",
  c:[["Your friend has cut his finger. What should you do?","Wash it with clean water and put on a bandage.","Put salt on it.","Ignore it and keep playing."],["What should you do if someone burns their hand?","Put it under cool running water for several minutes.","Put butter or ice on it.","Rub it very hard."],["What number do you call in an emergency in Saudi Arabia?","997 for an ambulance, or 911 in some cities.","123456789.","You should never call anyone."],["Why should you stay calm in an emergency?","So you can think clearly and help better.","Because emergencies are boring.","Because calm is a bandage."]],
  l:"If someone feels faint, help them sit or lie down. Raise their legs a little if they are lying down. Give them some fresh air, and if they don't feel better, call for help.",
  lq:[["What should the person do first?","sit or lie down","run","eat"],["What can you raise a little?","their legs","their head","their arms"],["What should you do if they don't feel better?","call for help","go home","laugh"]],
  r:"Last month, Reem was in the kitchen with her grandmother when the old woman touched a hot pan and burned her hand. Reem remembered what she had learned at school. She stayed calm and quickly put her grandmother's hand under cool running water for ten minutes. She didn't put ice or toothpaste on it, because she knew that can make burns worse. Then she covered it loosely with a clean cloth and called her mother. The doctor later said that Reem's quick action helped a lot.",
  rq:[["What happened to the grandmother?","She burned her hand.","She cut her finger.","She fell down."],["How long did Reem put the hand under water?","ten minutes","one minute","one hour"],["What did Reem NOT put on the burn?","ice or toothpaste","water","a clean cloth"],["What did the doctor say?","Reem's quick action helped a lot.","Reem made it worse.","Nothing."]]},
 {en:"Germs",ar:"الجراثيم",v:"germ|جرثومة|🦠;virus|فيروس|🧫;spread|ينتشر|📢;soap|صابون|🧼;sneeze|يعطس|🤧;immune|مناعة|🛡️",
  c:[["How do germs spread?","Through coughs, sneezes and dirty hands.","Through good books.","Germs never spread."],["How long should you wash your hands?","For at least twenty seconds with soap.","For one second without soap.","For three hours."],["What should you do when you sneeze?","Sneeze into a tissue or your elbow.","Sneeze on your friend's face.","Sneeze into your food."],["If you have a fever, should you go to school?","No, you should stay home and rest so you don't spread it.","Yes, you should hug everyone.","Fever is a holiday at school."]],
  l:"Germs are so small that you can't see them without a microscope. Some germs are harmful and make us sick, but many are helpful. For example, some live in our stomachs and help us digest food.",
  lq:[["What do you need to see germs?","a microscope","glasses","a torch"],["Are all germs harmful?","No, many are helpful.","Yes, all of them.","None are harmful."],["Where do some helpful germs live?","in our stomachs","on the moon","in books"]],
  r:"In the 1840s, a doctor named Ignaz Semmelweis noticed something strange in his hospital in Vienna. Many mothers became very sick after giving birth. He realized that doctors were going from one patient to another without washing their hands. He told all the doctors to wash their hands before touching patients, and the number of sick mothers dropped dramatically. Sadly, many doctors laughed at him and didn't believe him. Years later, scientists proved that germs cause disease, and Semmelweis was finally recognized as a hero.",
  rq:[["Where did Semmelweis work?","in a hospital in Vienna","in a school in London","on a ship"],["What were doctors not doing?","washing their hands","talking to patients","writing notes"],["What happened when doctors washed their hands?","fewer mothers got sick","more mothers got sick","nothing changed"],["How did other doctors react at first?","They laughed at him.","They thanked him.","They gave him a prize."]]},
 {en:"Food and Energy",ar:"الغذاء والطاقة",v:"protein|بروتين|🍗;carbohydrates|نشويات|🍞;fat|دهون|🧈;calcium|كالسيوم|🥛;energy|طاقة|⚡;portion|حصة|🍽️",
  c:[["Which foods give us protein?","Eggs, fish, chicken and beans.","Only candy and soda.","Water and air."],["What does calcium do for us?","It makes our bones and teeth strong.","It makes our hair green.","It makes us sleepy."],["What should a healthy plate look like?","Half vegetables and fruit, a quarter protein and a quarter grains.","All chips.","Only meat and nothing else."],["If you skip breakfast, how might you feel?","I might feel tired and find it hard to focus.","I will feel full of energy.","I will become taller."]],
  l:"Carbohydrates like bread, rice and potatoes give us energy. Protein helps our muscles grow and repair. We need a little fat too, from foods like nuts and olive oil.",
  lq:[["What gives us energy?","carbohydrates","water","salt"],["What helps muscles grow?","protein","sugar","fat only"],["Where can we get healthy fat?","nuts and olive oil","candy","soda"]],
  r:"Have you ever felt very hungry and grumpy before lunch? Scientists even have a word for it: 'hangry,' a mix of hungry and angry. When your body runs low on energy, your brain doesn't work as well, so you might get annoyed more easily. That's why a good breakfast is important. Foods that release energy slowly, like oats, eggs and whole-grain bread, keep you full and focused for longer than sugary cereals, which give you quick energy that soon disappears.",
  rq:[["What does 'hangry' mean?","hungry and angry","happy and hungry","tired"],["What happens when your body runs low on energy?","Your brain doesn't work as well.","You get stronger.","You sleep better."],["Which foods release energy slowly?","oats, eggs and whole-grain bread","sugary cereals","candy"],["What is the problem with sugary cereals?","Their energy soon disappears.","They are too slow.","They are too healthy."]]},
 {en:"Sleep and the Brain",ar:"النوم والدماغ",v:"brain|دماغ|🧠;dream|حلم|💭;rest|راحة|🛌;memory|ذاكرة|🗂️;focus|يركّز|🎯;routine|روتين|📋",
  c:[["Why do we need sleep?","Our brain needs time to rest and store memories.","Because the night is boring.","We don't need sleep at all."],["What happens if you don't sleep enough?","It's hard to focus and you feel moody.","You become a superhero.","You grow faster."],["What's a good bedtime routine?","A shower, reading a book and sleeping at the same time every night.","Playing video games until midnight.","Eating a big meal and drinking soda."],["Do you remember your dreams?","Sometimes I remember them in the morning.","I remember dream was it tomorrow.","Dreams remember me."]],
  l:"While you sleep, your brain is very busy. It sorts the things you learned during the day and stores the important ones as memories. That's why sleeping well before a test is better than staying up late.",
  lq:[["Is the brain resting completely during sleep?","No, it is very busy.","Yes, it switches off.","It sleeps more than the body."],["What does the brain store as memories?","the important things you learned","everything you ate","nothing"],["What is better before a test?","sleeping well","staying up late","drinking coffee"]],
  r:"The blue light from phones and tablets tells your brain that it is still daytime. This makes it harder to fall asleep. Scientists recommend switching off screens at least one hour before bed. Instead, you can read a paper book, talk with your family, or listen to calm sounds. Keeping your room dark, quiet and cool also helps. A regular routine, going to bed and waking up at the same time every day, even on weekends, trains your body to sleep better.",
  rq:[["What does blue light tell the brain?","It is still daytime.","It is time to sleep.","It is winter."],["When should you switch off screens?","at least one hour before bed","right before sleeping","never"],["What kind of room helps sleep?","dark, quiet and cool","bright and noisy","hot"],["What trains your body to sleep better?","a regular routine","sleeping late on weekends","more screen time"]]},
 {en:"Talking About Feelings",ar:"التعبير عن المشاعر",v:"worried|قلق|😟;nervous|متوتر|😬;frustrated|محبط|😤;relieved|مرتاح|😮‍💨;lonely|وحيد|🥺;confident|واثق|😎",
  c:[["You look worried. Is everything OK?","I'm nervous about my presentation tomorrow.","I'm worried a presentation was.","Everything looks me."],["What should I do when I feel nervous?","You should take deep breaths and practice once more.","You should shout at everyone.","You should never practice."],["How did you feel after the exam?","I felt relieved because it went well.","I felt relieve was it.","The exam felt me."],["What do you do when a friend feels lonely?","I invite them to play or just sit and talk with them.","I tell them to go away.","I laugh at them."]],
  l:"It's normal to feel frustrated when something is difficult. When this happens, take a short break, drink some water, and then try again. You can also ask someone for help.",
  lq:[["Is it normal to feel frustrated?","Yes, it is normal.","No, never.","Only for adults."],["What should you take?","a short break","a long holiday","a pill"],["Who can you ask?","someone for help","nobody","a stranger online"]],
  r:"Dana had just moved to a new school, and for the first week she felt lonely. At break time, she sat alone and pretended to read. One day, a girl named Jood sat next to her and asked, 'What are you reading?' They started talking and discovered they both loved drawing. The next day, Jood introduced Dana to her friends. Dana later said, 'That small question changed my whole year.' Sometimes a simple act of kindness is all someone needs.",
  rq:[["Why did Dana feel lonely?","She moved to a new school.","She lost her book.","She was sick."],["What did Dana do at break time?","She sat alone and pretended to read.","She played football.","She went home."],["What did Dana and Jood both love?","drawing","swimming","cooking"],["What is the message of the story?","A simple act of kindness can help a lot.","Reading is boring.","New schools are bad."]]}
 ]},

  c:[["What were you doing when the lights went out?","I was reading in my room.","I read was in my room.","Lights were doing me."],["What happened while you were walking home?","It suddenly started to rain.","It suddenly start rain was.","Home was walking me."],["Were you sleeping when I called?","Yes, sorry. I was taking a nap.","Yes, I sleeping was nap.","Called was sleeping."],["What was everyone doing at eight o'clock?","Dad was cooking and the kids were doing homework.","Dad cooking kids homework were.","Eight o'clock was everyone."]],

const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

/* which of a lesson's words each letter game can use */
const wordsFor={
 unscramble:L=>V(L).filter(v=>/^[a-z]{3,11}$/i.test(v.en)),
 spell:L=>V(L).filter(v=>/^[a-z' ]+$/i.test(v.en)),
 balloons:L=>V(L).filter(v=>/^[a-z][a-z' -]*$/i.test(v.en)&&v.en.length<=14&&v.en.replace(/[^a-z]/gi,'').length>=3),
 search:L=>V(L).filter(v=>/^[a-z]{3,8}$/i.test(v.en))
};
const sentFor=L=>{const all=(L.c||[]).map(c=>c[1]).filter(x=>x.split(' ').length<=14),good=all.filter(x=>x.split(' ').length>=3);return good.length>=2?good:all};
/* Missing-word items: a sentence of the lesson with one word taken out. A lesson word is taken when the
   sentence has one; otherwise its longest ordinary word. `opts` are wrong choices that are not in the sentence. */
const STOP=new Set("the a an and or but is are am was were be been to of in on at for with from by it its this that these those he she we they you i my your his her our their not no yes do does did have has had can will would could should very too so as if then than there here what when where who why how me him them us about into after before because every some many much more most also just only still even".split(' '));
function gapItems(L){
 if(!L.c||!L.l||!L.r)return[];
 const vs=V(L),pool=[...new Set([...L.c.map(c=>c[1]),...splitS(L.l),...splitS(L.r)])].filter(s=>{const n=s.split(' ').length;return n>=4&&n<=16&&!/['"]$/.test(s)});
 const strong=[...new Set(pool.flatMap(s=>(s.match(/[A-Za-z]+/g)||[]).slice(1)).filter(w=>w.length>=4&&w===w.toLowerCase()&&!STOP.has(w)))];
 const voc=[],rest=[];
 for(const s of pool){
  let it=null;
  for(const v of vs){const m=new RegExp('(^|[^A-Za-z])('+escRe(v.en)+')(?![A-Za-z])','i').exec(s);if(!m)continue;
   const opts=vs.filter(x=>x!==v&&!hasWord(s,x.en)).map(x=>x.en);
   if(opts.length>=3){it={s,at:m.index+m[1].length,word:m[2],opts,voc:v.en};break}}
  if(it){voc.push(it);continue}
  const cand=[...s.matchAll(/[A-Za-z]+/g)].filter(m=>m.index>0&&m[0].length>=4&&m[0]===m[0].toLowerCase()&&!STOP.has(m[0])&&s[m.index-1]!=="'"&&s[m.index+m[0].length]!=="'").sort((a,b)=>b[0].length-a[0].length)[0];
  if(!cand)continue;
  const w=cand[0],opts=strong.filter(x=>x!==w&&!hasWord(s,x)&&Math.abs(x.length-w.length)<=3);
  if(opts.length>=3)rest.push({s,at:cand.index,word:w,opts});
 }
 return [...voc,...rest];
}
wordsFor.letter=L=>V(L).filter(v=>/^[a-z]{3,10}$/i.test(v.en));
/* sentences of a lesson that a child can tell apart by ear: its answers and the sentences of its two texts */
/* quotation marks in a piece of text (apostrophes inside words are not counted): an odd number means it was cut inside a quotation */
const quoteMarks=s=>(s.match(/(^|[^A-Za-z])'|'(?![A-Za-z])|"/g)||[]).length;
const hearPool=L=>!L.c||!L.l||!L.r?[]:[...new Set([...L.c.map(c=>c[1]),...splitS(L.l),...splitS(L.r)])].filter(s=>{const n=s.split(' ').length;return n>=3&&n<=14&&quoteMarks(s)%2===0});
/* the lesson's story (then its listening text) cut into runs of four sentences in a row, two runs at most */
const orderSets=L=>{const out=[];for(const t of [L.r,L.l]){const ss=splitS(t||'');
 for(let k=0;k+4<=ss.length&&out.length<2;){const run=ss.slice(k,k+4);if(new Set(run).size===4&&run.every(s=>s.split(' ').length<=20&&quoteMarks(s)%2===0)){out.push(run);k+=4}else k++}}return out};

 case'unscramble':case'spell':case'balloons':case'search':case'letter':return wordsFor[g](L).length>=3;
 case'sentence':return sentFor(L).length>=2;
 case'gap':return gapItems(L).length>=4;
 case'hear':return hearPool(L).length>=5;
 case'order':return orderSets(L).length>=1;
 case'bingo':return V(L).length>=5;
 default:return V(L).length>=4}}

const VDIR='ollie/voices';
const VO={ctx:null,man:null,load:null,buf:new Map(),tok:0,src:null,done:null,end:null,noise:null,warned:0};
const SPEECH=!!(window.AudioContext||window.webkitAudioContext);
function loadMan(){
 if(VO.man)return Promise.resolve(VO.man);
 if(location.protocol==='file:')return Promise.resolve(null);
 return VO.load||(VO.load=fetch(VDIR+'/part'+PART+'.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(m=>VO.man=m).catch(()=>{VO.load=null;return null}));
}
loadMan();
function unlockSpeech(){
 if(!SPEECH)return;
 try{
  if(!VO.ctx){VO.ctx=new(window.AudioContext||window.webkitAudioContext)();
   /* iPhone: play like a video does, so the silent switch does not mute Ollie */
   try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}}
  if(VO.ctx.state!=='running'&&VO.ctx.state!=='closed')VO.ctx.resume();
 }catch(e){}
}
['pointerdown','touchend','keydown'].forEach(ev=>document.addEventListener(ev,unlockSpeech,{capture:true,passive:true}));
function clipFor(t,slow){const m=VO.man;if(!m)return null;let id=m.s[t]||m.w[t.toLowerCase()]||m.w[t.replace(/[^A-Za-z0-9' -]/g,'').trim().toLowerCase()];

function clipBuf(id){
 const hit=VO.buf.get(id);if(hit){VO.buf.delete(id);VO.buf.set(id,hit);return hit}

  .then(a=>new Promise((ok,no)=>{const q=VO.ctx.decodeAudioData(a,ok,no);if(q&&q.then)q.then(ok,no)}));

}

/* say(text) plays the text sentence by sentence and resolves when it ends or is interrupted.
   o.rate<.8 picks the slow recording where there is one; o.onPart(k) fires as sentence k starts; o.onEnd() always fires once. */
function say(text,o={}){
 if(!SPEECH){toast('الصوت غير مدعوم في هذا المتصفح. جرّب Safari أو Chrome.');return Promise.resolve(false)}
 unlockSpeech();stopVoice();const tok=VO.tok;VO.end=o.onEnd||null;
 const fin=ok=>{if(tok===VO.tok&&VO.end){const e=VO.end;VO.end=null;e()}return ok};
 return (async()=>{
  const m=await loadMan();if(tok!==VO.tok)return false;
  if(!m||!VO.ctx){voiceWarn();return fin(false)}
  const slow=(o.rate||1)<.8,ids=splitS(text).map(t=>clipFor(t,slow));
  const bufs=ids.map(id=>id?clipBuf(id).catch(()=>null):null);
  let any=false,bad=false;
  for(let k=0;k<ids.length;k++){
   const b=await bufs[k];if(tok!==VO.tok)return false;
   if(!b){if(ids[k])bad=true;continue}
   if(any)await wait(180);if(tok!==VO.tok)return false;
   any=true;if(o.onPart)o.onPart(k);
   await playBuf(b);if(tok!==VO.tok)return false;
  }
  if(!any&&bad)voiceWarn();
  return fin(any);
 })();
}

/* ---------- sound effects: short noise bursts (no notes, no tunes) ---------- */
function burst(at,dur,type,freq,q,vol){
 const c=VO.ctx;if(!VO.noise){const n=c.createBuffer(1,c.sampleRate*.5|0,c.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;VO.noise=n}
 const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
 s.buffer=VO.noise;f.type=type;f.frequency.value=freq;f.Q.value=q;
 g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(vol,at+.008);g.gain.exponentialRampToValueAtTime(.0001,at+dur);
 s.connect(f);f.connect(g);g.connect(c.destination);s.start(at,Math.random()*.3);s.stop(at+dur+.02);
}
function sfx(kind){
 if(!SPEECH)return;
 try{unlockSpeech();const c=VO.ctx;if(!c||c.state!=='running')return;const t=c.currentTime+.01;
  if(kind==='ok'){burst(t,.045,'bandpass',1500,1.4,1.5);burst(t+.08,.07,'bandpass',2300,1.4,1.3)}   /* two soft clicks */
  else if(kind==='no')burst(t,.2,'lowpass',240,.7,2.8);                                          /* a low thud */
  else if(kind==='tap')burst(t,.035,'bandpass',1700,1,.6);
  else if(kind==='pop')burst(t,.08,'bandpass',800,1.6,2.6);
  else if(kind==='win')for(let k=0;k<14;k++)burst(t+k*.055+Math.random()*.03,.05,'bandpass',1200+Math.random()*1800,1,.7);   /* like clapping */
 }catch(e){}
}

/* ---------- microphone: the child says the reply and the browser writes down what it heard ----------
   The browser's own speech recognition, only on a tap of the mic button; nothing is kept or sent by this page. */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let MIC=null;
function micOff(){if(MIC){const m=MIC;MIC=null;try{m.onresult=m.onerror=m.onend=null;m.abort()}catch(e){}}}
const spokenWords=t=>t.toLowerCase().replace(/[^a-z0-9' ]/g,' ').split(/\s+/).filter(Boolean);
/* how much of the wanted sentence was heard, 0 to 1 */
const heardScore=(said,want)=>{const w=spokenWords(want),s=spokenWords(said);return w.length?w.filter(x=>s.includes(x)).length/w.length:0};
/* listens once; calls back with ('ok'|'again'|'silent'|'blocked'|'error', what was heard) */
function micListen(want,done){
 micOff();stopVoice();let got=false;const rec=new SR();MIC=rec;rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=4;
 rec.onresult=e=>{got=true;const alts=[...e.results[0]].map(a=>a.transcript),best=alts.sort((a,b)=>heardScore(b,want)-heardScore(a,want))[0]||'';
  done(heardScore(best,want)>=.6?'ok':'again',best)};
 rec.onerror=e=>{if(got)return;got=true;done(e.error==='not-allowed'||e.error==='service-not-allowed'?'blocked':e.error==='no-speech'?'silent':'error','')};
 rec.onend=()=>{if(MIC===rec)MIC=null;if(!got)done('silent','')};
 try{rec.start()}catch(e){MIC=null;done('error','')}
}

  if(qd.classList.contains('ok'))return;
  if(b.dataset.k==='0'){b.classList.add('right');qd.classList.add('ok');ding();if(!--left)onAll(mis)}
  else if(!b.classList.contains('wrong')){b.classList.add('wrong');mis++;buzz()}
 }));

/* read a passage aloud and light up the sentence being read; `box` holds one .sn span per sentence */
function readAloud(text,box,slow,btn){
 const sn=[...box.querySelectorAll('.sn')];
 if(btn)btn.classList.add('speaking');
 return say(text,{rate:slow?.6:1,onPart:k=>sn.forEach((x,j)=>x.classList.toggle('on',j===k)),
  onEnd:()=>{sn.forEach(x=>x.classList.remove('on'));if(btn)btn.classList.remove('speaking')}});
}

/* hide and seek: pictures peek out of the bushes; tap the one Ollie names */
function gHide(L,done,token){

 G(`<p class="tip">الصور تلعب الغميضة! اسمع الكلمة واضغط صورتها حين تطلّ من الشجيرة.</p><div class="target" id="tg"></div>

 const down=c=>{c.v=null;clearTimeout(c.t);c.b.classList.remove('up','glow')};
 function up(c,v){c.v=v;c.p.textContent=v.em;c.b.classList.add('up');clearTimeout(c.t);
  if(v===target&&lost>=2){c.b.classList.add('glow');return}   /* missed twice: it waits for you */
  c.t=setTimeout(()=>{if(token!==RUN)return;if(c.v===target&&live)lost++;down(c)},upMs)}
 function tick(){if(token!==RUN)return clearInterval(iv);if(!live)return;
  const free=cells.filter(c=>!c.v);if(free.length<4)return;
  const shown=cells.some(c=>c.v===target),others=all.filter(x=>x!==target&&!cells.some(c=>c.v===x));

 cells.forEach(c=>c.b.onclick=()=>{if(!live||!c.v)return;
  if(c.v===target){live=false;clearTimeout(c.t);c.b.classList.add('got');ding();hit(target.en);
   setTimeout(()=>{if(token!==RUN)return;cells.forEach(x=>{down(x);x.b.classList.remove('got')});if(++r<rounds.length)round();else{clearInterval(iv);done(starsFrom(mis,0,2))}},800)}
  else{mis++;miss(target.en);buzz();c.b.classList.add('shake');setTimeout(()=>{c.b.classList.remove('shake');if(c.v!==target)down(c)},350)}});

/* word search: the lesson's words hidden in a letter grid, left to right or top to bottom */
function gSearch(L,done,token){
 const N=8,ws=shuffle(wordsFor.search(L)).slice(0,5),hard=hardMode();let grid,put;
 for(let tryN=0;tryN<60;tryN++){grid=Array.from({length:N},()=>Array(N).fill(''));put=[];let ok=true;
  for(const v of [...ws].sort((a,b)=>b.en.length-a.en.length)){const w=v.en.toUpperCase();let placed=false;
   for(let t=0;t<80&&!placed;t++){const hz=Math.random()<.5,r0=Math.random()*(hz?N:N-w.length+1)|0,c0=Math.random()*(hz?N-w.length+1:N)|0;
    const cs=[...w].map((_,k)=>({r:r0+(hz?0:k),c:c0+(hz?k:0)}));
    if(cs.every((p,k)=>!grid[p.r][p.c]||grid[p.r][p.c]===w[k])){cs.forEach((p,k)=>grid[p.r][p.c]=w[k]);put.push({v,w,cs,found:false});placed=true}}
   if(!placed){ok=false;break}}
  if(ok)break}
 const AB='AAEEIIOOUULNRSTMDCPBGHKWY';
 for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!grid[r][c])grid[r][c]=AB[Math.random()*AB.length|0];
 let mis=0,a=null,drag=false,moved=false,armed=false,sel=[],over=false;
 G(`<p class="tip">ابحث عن كلمات الدرس بين الحروف: اسحب إصبعك فوق الكلمة، أو اضغط أول حرف ثم آخر حرف.</p>
  <div class="wlist" id="wl"></div><div class="wgrid" id="wg" dir="ltr">${grid.map((row,r)=>row.map((ch,c)=>`<span class="wc" data-r="${r}" data-c="${c}">${ch}</span>`).join('')).join('')}</div>
  <div class="btns"><button class="ghost" id="hb">💡 تلميح</button></div>`);
 const wg=$('#wg'),cell=p=>wg.children[p.r*N+p.c];
 const list=()=>{$('#wl').innerHTML=put.map(p=>`<span class="wi${p.found?' ok':''}"><span>${p.v.em}</span>${p.found||!hard?`<b dir="ltr">${esc(p.v.en)}</b>`:`<small>${esc(p.v.ar)}</small>`}</span>`).join('')};
 const at=e=>{const el=document.elementFromPoint(e.clientX,e.clientY),b=el&&el.closest?el.closest('.wc'):null;return b&&wg.contains(b)?{r:+b.dataset.r,c:+b.dataset.c}:null};
 const line=(p,q)=>{const dr=q.r-p.r,dc=q.c-p.c;if(dr&&dc)return[p];const n=Math.abs(dr||dc),sr=Math.sign(dr),sc=Math.sign(dc);return Array.from({length:n+1},(_,k)=>({r:p.r+sr*k,c:p.c+sc*k}))};
 const paint=()=>{$$('#wg .sel').forEach(x=>x.classList.remove('sel'));sel.forEach(p=>cell(p).classList.add('sel'))};
 const same=(x,y)=>x.length===y.length&&x.every((p,k)=>p.r===y[k].r&&p.c===y[k].c);
 function commit(){const str=sel.map(p=>grid[p.r][p.c]).join(''),rev=[...str].reverse().join('');
  /* a word counts wherever its letters are found, also inside a longer one (AGREE in DISAGREE) or spelled by chance */
  const got=put.find(p=>!p.found&&(same(p.cs,sel)||same(p.cs,[...sel].reverse())))||put.find(p=>!p.found&&(p.w===str||p.w===rev));
  if(got){got.found=true;got.cs=[...sel];got.cs.forEach(p=>cell(p).classList.add('fd','f'+put.indexOf(got)));ding();hit(got.v.en);say(got.v.en);list();
   if(put.every(p=>p.found)){over=true;setTimeout(()=>{if(token===RUN)done(starsFrom(mis,1,4))},1100)}}
  else if(sel.length>1){mis++;buzz();wg.classList.add('shake');setTimeout(()=>wg.classList.remove('shake'),400)}
  sel=[];a=null;armed=false;paint()}
 wg.onpointerdown=e=>{if(over)return;const p=at(e);if(!p)return;e.preventDefault();
  if(armed&&a){sel=line(a,p);paint();if(sel.length>1)return setTimeout(commit,120);}
  a=p;drag=true;moved=false;armed=false;sel=[p];paint();sfx('tap');try{wg.setPointerCapture(e.pointerId)}catch(x){}};
 wg.onpointermove=e=>{if(!drag||over)return;const p=at(e);if(!p)return;if(p.r!==a.r||p.c!==a.c)moved=true;sel=line(a,p);paint()};
 wg.onpointerup=()=>{if(!drag)return;drag=false;if(moved&&sel.length>1)commit();else{armed=true;sel=[a];paint()}};
 wg.onpointercancel=()=>{drag=false;armed=false;a=null;sel=[];paint()};
 $('#hb').onclick=()=>{if(over)return;const p=put.find(x=>!x.found);if(!p)return;mis+=.5;const c=cell(p.cs[0]);c.classList.add('hint');setTimeout(()=>c.classList.remove('hint'),1600)};
 list();
}

/* Ollie's flight: move Ollie under the cloud that carries the right word */
function gFly(L,done,token){
 const all=V(L),rounds=shuffle([...all,...shuffle(all).slice(0,2)]),speed=(hardMode()?54:42)+ctx.l*5;let r=0,mis=0,lane=1,boost=false;
 G(`<p class="tip">حرّك أولي إلى الغيمة التي تحمل اسم الصورة. اضغط على المسار، واضغطه مرة ثانية للإسراع.</p><div class="target" id="tg"></div>
  <div class="sky" id="sky" dir="ltr"><i class="ln"></i><i class="ln"></i><div class="flyer" id="fl">${BIRD(54)}</div></div>
  <div class="btns fbtn" dir="ltr"><button class="ghost" id="fL" aria-label="إلى اليسار">◀</button><span class="muted" id="pr"></span><button class="ghost" id="fR" aria-label="إلى اليمين">▶</button></div>`);
 const sky=$('#sky'),fl=$('#fl'),W=()=>sky.clientWidth;
 const go=n=>{n=Math.max(0,Math.min(2,n));if(n===lane)boost=true;lane=n;fl.style.transform=`translateX(${(lane+.5)*W()/3-27}px)`};
 sky.onpointerdown=e=>{e.preventDefault();go(Math.floor((e.clientX-sky.getBoundingClientRect().left)/(W()/3)))};
 $('#fL').onclick=()=>{lane>0?go(lane-1):0};$('#fR').onclick=()=>{lane<2?go(lane+1):0};
 lane=-1;go(1);boost=false;
 function round(){if(token!==RUN)return;const v=rounds[r];boost=false;
  $('#tg').innerHTML=`<span class="big-em">${v.em}</span><span>${esc(v.ar)}</span>`;$('#pr').textContent=`${r+1} / ${rounds.length}`;
  $$('#sky .cloud').forEach(c=>c.remove());
  const w=W()/3,cs=shuffle([v,...shuffle(all.filter(x=>x.en!==v.en)).slice(0,2)]).map((o,n)=>{const c=document.createElement('div');c.className='cloud';c.textContent=o.en;c.style.width=(w-10)+'px';c.style.left=(n*w+5)+'px';sky.appendChild(c);return{c,o}});
  const ch=Math.max(...cs.map(z=>z.c.offsetHeight)),stopY=sky.clientHeight-66-ch;let y=-ch-6,last=performance.now(),over=false;
  (function step(now){if(token!==RUN||over)return;const dt=Math.min(.05,(now-last)/1000);last=now;y+=speed*(boost?6:1)*dt;
   if(y>=stopY){y=stopY;over=true}
   cs.forEach(z=>z.c.style.transform=`translateY(${y}px)`);
   if(over){const mine=cs[lane],good=mine.o.en===v.en;
    if(good){mine.c.classList.add('right');ding();hit(v.en);say(v.en)}else{mine.c.classList.add('wrong');cs.find(z=>z.o.en===v.en).c.classList.add('right');mis++;miss(v.en);buzz()}
    setTimeout(()=>{if(token!==RUN)return;++r<rounds.length?round():done(starsFrom(mis,0,2))},good?800:1500);return}
   requestAnimationFrame(step)})(last);}
 round();
}
/* remember the order: Ollie says a few words, then you tap their pictures in the same order */
function gSeq(L,done,token){
 const all=V(L),lens=(hardMode()?[2,3,3,4,4]:[2,2,3,3,4]).map(n=>Math.min(n,all.length-1));let r=0,mis=0;
 function round(){if(token!==RUN)return;const seq=shuffle(all).slice(0,lens[r]),cells=shuffle(all);let at=0,fails=0,busy=true,over=false;
  G(`<p class="tip">اسمع كلمات أولي، ثم اضغط صورها بالترتيب نفسه. (${r+1} من ${lens.length})</p>
   <div class="seqbar"><button class="play" id="sq">${icon('spk')}<span>اسمع</span></button><div class="seqdots" id="sd" dir="ltr"></div></div>
   <div class="grid3 wait" id="sg">${cells.map((v,k)=>`<button class="tile em big" data-k="${k}">${v.em}</button>`).join('')}</div><p class="fixline" id="sm" dir="ltr"></p>`);
  const sg=$('#sg'),sq=$('#sq'),words=()=>{$('#sm').textContent=seq.map(x=>x.en).join('  →  ')};
  const dots=()=>{$('#sd').innerHTML=seq.map((v,k)=>`<span class="sdot${k<at?' on':''}">${k<at?v.em:k+1}</span>`).join('')};
  async function tell(){busy=true;sg.classList.add('wait');sq.classList.add('speaking');let heard=false;
   for(const v of seq){if(await say(v.en))heard=true;if(token!==RUN||!sg.isConnected)return;await wait(240);if(token!==RUN||!sg.isConnected)return}
   sq.classList.remove('speaking');sg.classList.remove('wait');busy=false;if(!heard)words()}   /* no sound: the words are shown instead */
  $$('#sg .tile').forEach(b=>b.onclick=()=>{if(busy||over)return;
   if(cells[+b.dataset.k]===seq[at]){at++;sfx('tap');b.classList.add('pick');setTimeout(()=>b.classList.remove('pick'),260);dots();
    if(at===seq.length){over=true;ding();seq.forEach(x=>hit(x.en));setTimeout(()=>{if(token!==RUN)return;++r<lens.length?round():done(starsFrom(mis,0,2))},850)}}
   else{mis++;fails++;miss(seq[at].en);buzz();b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);at=0;dots();
    if(fails>=2)words();   /* missed twice: the words stay on the screen */
    busy=true;setTimeout(()=>{if(token===RUN&&!over&&sg.isConnected)tell()},750)}});
  sq.onclick=()=>{if(busy||over)return;at=0;dots();tell()};
  dots();setTimeout(()=>{if(token===RUN&&sg.isConnected)tell()},400);}
 round();
}

/* bingo: nine tiles, pictures and written words; tap what Ollie calls; two full lines win */
function gBingo(L,done,token){
 const all=V(L),hard=hardMode(),a=shuffle(all).map(v=>({v,w:hard?1:0})),b=shuffle(all).map(v=>({v,w:hard?0:1}));
 const tiles=shuffle([...a,...b.slice(0,9-a.length)]),LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let mis=0,now=null,lock=true,over=false;
 G(`<p class="tip">بنغو! اسمع الكلمة واضغط صورتها أو اسمها المكتوب. أكمل خطّين لتفوز.</p>
  <div class="target"><button class="play" id="bp">${icon('spk')}<span>اسمع الكلمة</span></button><span class="pill" id="bl"></span></div>
  <div class="bingo" id="bg">${tiles.map((t,k)=>`<button class="bt ${t.w?'wd':'em'}${t.w&&t.v.en.length>9?' sm':''}" data-k="${k}" ${t.w?'dir="ltr"':''}>${t.w?esc(t.v.en):t.v.em}</button>`).join('')}</div>`);
 const cells=$$('#bg .bt'),lines=()=>LINES.filter(l=>l.every(k=>tiles[k].on)),show=()=>{$('#bl').textContent=`⭐ ${Math.min(2,lines().length)} / 2`};
 function call(){if(token!==RUN||over)return;const left=tiles.filter(t=>!t.on),other=left.filter(t=>t.v!==now);
  now=pick(other.length?other:left).v;$('#bp').dataset.say=now.en;lock=false;say(now.en)}
 cells.forEach((c,k)=>c.onclick=()=>{if(lock||over||tiles[k].on)return;
  if(tiles[k].v===now){lock=true;tiles[k].on=1;c.classList.add('on');ding();hit(now.en);const ls=lines();ls.flat().forEach(i=>cells[i].classList.add('line'));show();
   if(ls.length>=2||tiles.every(t=>t.on)){over=true;return setTimeout(()=>{if(token===RUN)done(starsFrom(mis,0,2))},1000)}
   setTimeout(call,650)}
  else{mis++;miss(now.en);buzz();c.classList.add('shake');setTimeout(()=>c.classList.remove('shake'),400)}});
 show();setTimeout(call,400);
}

/* race: every right answer moves Ollie one step; the rabbit never stops running */
function gRace(L,done,token){
 const all=V(L),N=8,qs=[...shuffle(all),...shuffle(all)].slice(0,N),T=((hardMode()?52:66)-ctx.l*2)*1000,t0=performance.now()+1500;let n=0,mis=0,over=false;
 G(`<p class="tip">سابق الأرنب! كل إجابة صحيحة تدفع أولي خطوة نحو خط النهاية.</p>
  <div class="track" dir="ltr"><div class="lane"><span class="run" id="rb">${RABBIT}</span></div><div class="lane"><span class="run" id="ro">${BIRD(40)}</span></div><i class="flag">🏁</i></div>
  <div id="bq" class="pane"></div>`);
 const rb=$('#rb'),ro=$('#ro'),at=(el,p)=>{el.style.left=`calc(${p} * (100% - 46px))`};
 function end(win){over=true;if(!win){buzz();toast('وصل الأرنب أولًا! حاول مرة أخرى.')}
  setTimeout(()=>{if(token===RUN)done(win?(mis<=1?3:2):1)},win?700:1500)}
 function ask(){if(token!==RUN||over)return;const v=qs[n];let lock=false;
  askCard($('#bq'),v,all,n%2).forEach((b,_,btns)=>b.onclick=()=>{if(over||lock)return;
   if(b.dataset.en===v.en){lock=true;b.classList.add('right');ding();hit(v.en);at(ro,++n/N);if(n>=N)return end(true);setTimeout(ask,380)}
   else if(!b.classList.contains('wrong')){b.classList.add('wrong');mis++;miss(v.en);buzz()}});}
 (function step(now){if(token!==RUN||over)return;const p=Math.max(0,Math.min(1,(now-t0)/T));at(rb,p);if(p>=1)return end(false);requestAnimationFrame(step)})(performance.now());
 ask();
}

/* missing letter: one letter of the word is gone (two in the harder mode) */
function gLetter(L,done,token){
 const ws=shuffle(wordsFor.letter(L)).slice(0,6),hard=hardMode(),VOW='aeiou',CON='bcdfghjklmnprstvwy';let r=0,mis=0;
 function round(){if(token!==RUN)return;const v=ws[r],word=v.en.toLowerCase();
  const holes=shuffle(word.split('').map((_,k)=>k)).slice(0,hard&&word.length>=5?2:1).sort((x,y)=>x-y);let h=0,over=false;
  G(`<p class="tip">أي حرف ينقص الكلمة؟ (${r+1} من ${ws.length})</p><div class="clue"><span class="big-em">${v.em}</span><span>${esc(v.ar)}</span><button class="spk" aria-label="استمع" data-say="${esc(v.en)}">${icon('spk')}</button></div>
   <div class="slots" dir="ltr" id="sl"></div><div class="tiles" dir="ltr" id="tl"></div>`);
  $('#sl').classList.toggle('long',word.length>7);
  function draw(){const open=holes.slice(h),ok=word[open[0]];
   $('#sl').innerHTML=word.split('').map((ch,k)=>`<span class="slot${k===open[0]?' now':''}">${open.includes(k)?'':ch}</span>`).join('');
   if(over){$('#tl').innerHTML='';return}
   $('#tl').innerHTML=shuffle([ok,...shuffle((VOW.includes(ok)?VOW:CON).split('').filter(c=>c!==ok)).slice(0,3)]).map(c=>`<button class="ltr" data-c="${c}">${c}</button>`).join('');
   $$('#tl .ltr').forEach(b=>b.onclick=()=>{if(over||b.disabled)return;
    if(b.dataset.c===ok){h++;sfx('tap');
     if(h===holes.length){over=true;draw();ding();hit(v.en);say(v.en);$('#sl').classList.add('ok');setTimeout(()=>{if(token!==RUN)return;++r<ws.length?round():done(starsFrom(mis,0,2))},900)}else draw()}
    else{b.disabled=true;mis++;miss(v.en);buzz()}})}
  draw();if(!hard)setTimeout(()=>token===RUN&&!over&&say(v.en),300);}
 round();
}

/* which sentence did you hear? */
function gHear(L,done,token){
 const pool=hearPool(L),rounds=shuffle(pool).slice(0,5),hard=hardMode();let r=0,mis=0;
 function round(){if(token!==RUN)return;const s=rounds[r],len=x=>Math.abs(x.split(' ').length-s.split(' ').length);let over=false;
  const opts=shuffle([s,...shuffle(pool.filter(x=>x!==s)).sort((x,y)=>len(x)-len(y)).slice(0,hard?3:2)]);   /* wrong choices of about the same length */
  G(`<p class="tip">اسمع أولي جيدًا، ثم اختر الجملة التي قالها. (${r+1} من ${rounds.length})</p>
   <button class="play" data-say="${esc(s)}">${icon('spk')}<span>اسمع الجملة</span></button>
   <div class="q-o" dir="ltr">${opts.map(o=>`<button class="opt" data-ok="${o===s?1:0}">${esc(o)}</button>`).join('')}</div>`);
  setTimeout(()=>token===RUN&&!over&&say(s),300);
  $$('#g .opt').forEach(b=>b.onclick=()=>{if(over)return;
   if(b.dataset.ok==='1'){over=true;b.classList.add('right');ding();setTimeout(()=>{if(token!==RUN)return;++r<rounds.length?round():done(starsFrom(mis,0,2))},800)}
   else if(!b.classList.contains('wrong')){b.classList.add('wrong');mis++;buzz()}});}
 round();
}

/* story order: four sentences of the lesson's story, to put back in the order Ollie reads them */
function gOrder(L,done,token){
 const sets=orderSets(L),hard=hardMode();let r=0,mis=0;
 function round(){if(token!==RUN)return;const run=sets[r],text=run.join(' ');let order,tries=0,ans=[],over=false;
  do{order=shuffle(run.map((_,n)=>n))}while(order.every((n,k)=>n===k)&&++tries<8);
  G(`<p class="tip">${hard?'رتّب جمل القصة. إذا احترت فاسمعها.':'اسمع القصة جيدًا، ثم اضغط الجمل بترتيبها.'} (${r+1} من ${sets.length})</p>
   <button class="play" data-say="${esc(text)}">${icon('spk')}<span>اسمع القصة</span></button>
   <div class="ord" id="ol" dir="ltr"></div><div class="btns"><button class="ghost" id="clr">ابدأ من جديد</button></div>`);
  const ol=$('#ol');
  function draw(){ol.innerHTML=order.map(n=>{const p=ans.indexOf(n);return `<button class="oc${p>=0?' in':''}" data-n="${n}"><i>${p>=0?p+1:''}</i><span>${esc(run[n])}</span></button>`}).join('');
   $$('#ol .oc').forEach(b=>b.onclick=()=>{if(over)return;const n=+b.dataset.n,p=ans.indexOf(n);if(p>=0)ans.splice(p);else{ans.push(n);sfx('tap')}draw();if(ans.length===run.length)check()})}
  function check(){
   if(ans.every((n,k)=>n===k)){over=true;order=run.map((_,n)=>n);draw();ol.classList.add('ok');ding();setTimeout(()=>{if(token!==RUN)return;++r<sets.length?round():done(starsFrom(mis,0,2))},1300)}
   else{over=true;buzz();mis++;ol.classList.add('shake');setTimeout(()=>{if(token!==RUN||!ol.isConnected)return;ol.classList.remove('shake');let k=0;while(ans[k]===k)k++;ans=ans.slice(0,k);over=false;draw()},650)}}   /* the right start stays */
  $('#clr').onclick=()=>{if(over)return;ans=[];draw()};
  draw();if(!hard)setTimeout(()=>token===RUN&&!over&&say(text),350);}
 round();
}
const GFN={match:gMatch,memory:gMemory,listen:gListen,hide:gHide,tf:gTF,pop:gPop,fly:gFly,seq:gSeq,bingo:gBingo,race:gRace,unscramble:gUnscr,letter:gLetter,balloons:gBalloons,search:gSearch,gap:gGap,hear:gHear,order:gOrder,spell:gSpell,sentence:gSentence};
const NEWG=['seq','bingo','race','letter','hear','order'];

/* ---------- question card shared by the world challenge and the daily challenge ---------- */
/* type 0: picture → English word, 1: hear → picture, 2: Arabic → English word, 3: English word → Arabic */
function askCard(box,v,pool,type){
 const opts=shuffle([v,...shuffle(pool.filter(x=>x.en!==v.en&&x.em!==v.em&&x.ar!==v.ar)).slice(0,3)]);
 const enOpts=`<div class="q-o" dir="ltr">${opts.map(o=>`<button class="opt" data-en="${esc(o.en)}">${esc(o.en)}</button>`).join('')}</div>`;
 box.innerHTML=type===0?`<div class="bprompt"><span class="big-em">${v.em}</span><p>ما اسمها بالإنجليزية؟</p></div>${enOpts}`
  :type===1?`<div class="bprompt"><button class="play" data-say="${esc(v.en)}">${icon('spk')}<span>اسمع</span></button><p>اختر الصورة الصحيحة</p></div><div class="grid4">${opts.map(o=>`<button class="tile em big" data-en="${esc(o.en)}">${o.em}</button>`).join('')}</div>`
  :type===2?`<div class="bprompt"><span class="ar-word">${esc(v.ar)}</span><p>اختر الكلمة الإنجليزية</p></div>${enOpts}`
  :`<div class="bprompt"><span class="en-word" dir="ltr">${esc(v.en)}</span><button class="spk" data-say="${esc(v.en)}" aria-label="استمع">${icon('spk')}</button><p>ما معناها؟</p></div><div class="q-o">${opts.map(o=>`<button class="opt ar" data-en="${esc(o.en)}">${esc(o.ar)}</button>`).join('')}</div>`;
 if(type===1||type===3)setTimeout(()=>box.isConnected&&box.querySelector('[data-en]')&&say(v.en),250);
 return [...box.querySelectorAll('[data-en]')];
}

/* ---------- world challenge ---------- */
const bossT=()=>Math.max(5,12-ctx.l-Math.min(PART-1,3));
function bossIntro(){
 stopAll();const lv=LV[ctx.l],T=bossT();
 h(lv.boss,level,`<div class="pane"><div class="intro"><div class="boss-head"><span>${icon('crown')}</span><b style="flex:1">${lv.boss}</b></div>
 <ul><li>12 سؤالًا من كلمات العالم كله.</li><li>لكل سؤال ${T} ثوانٍ فقط.</li><li>أسئلة بالصورة، والصوت، والترجمة.</li><li>أجب عن 5 أسئلة على الأقل لتفتح العالم التالي، و11 لتأخذ 3 نجوم.</li></ul>
 <button class="go" id="bgo">أنا مستعد!</button></div></div>`);
 $('#bgo').onclick=boss;
 warm(shuffle(lv.lessons.flatMap(V)).map(v=>v.en));

function boss(){
