<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: one centered column; worlds stack like toy blocks, each world's lessons wind down a path */
:root{
  --bg:#EDF4F9; --paper:#FFFFFF; --ink:#172636; --muted:#5A6C7D; --line:#D4E1EB;
  --sun:#FFBE2E; --sun-deep:#B37600;
  --good:#1C9F5F; --good-soft:#DDF5E8; --bad:#DD444A; --bad-soft:#FCE4E5;
  --lv:#2E8BC9; --lv-deep:#1C5F8C; --lv-soft:#E0EEF8;
  --f-ui:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;
  --f-en:"Andika","Baloo Bhaijaan 2",Verdana,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
[dir="ltr"]{font-family:var(--f-en)}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.fill{fill:currentColor;stroke:none}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;gap:10px;padding-block:10px;background:var(--bg)}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--paper);box-shadow:0 3px 0 var(--line)}
.iconbtn.ph{visibility:hidden}
.bar-t{unicode-bidi:plaintext;flex:1;min-width:0;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.pill{display:flex;align-items:center;gap:4px;background:var(--paper);padding:6px 12px;border-radius:999px;box-shadow:0 3px 0 var(--line);color:var(--sun-deep);font-weight:800;font-variant-numeric:tabular-nums}
.pill .ico{color:var(--sun)}

/* home */
.hero{display:flex;gap:14px;align-items:center;padding-block:8px 18px}
.owl{font-size:58px;line-height:1;width:84px;height:84px;display:grid;place-items:center;background:var(--paper);border-radius:28px;box-shadow:0 5px 0 var(--line);flex:none}
.hello{font-weight:800;font-size:22px}
.hero h1{font-size:17px;font-weight:700;color:var(--lv-deep)}
.muted{color:var(--muted);font-size:14px}

to go?", "to the mountains in the north", "to the beach", "to another country"]]}, {"en": "Coral Reefs", "ar": "الشعاب المرجانية", "v": "coral|مرجان|🪸;reef|شعاب|🌊;colorful|ملوّن|🌈;shell|صدفة|🐚;creature|مخلوق|🐙;fragile|هش|⚠️", "c": [["Is coral a plant or an animal?", "It's actually a group of tiny animals.", "It's a type of rock that grows grass.", "Coral is a fish's hat."], ["Why are coral reefs important?", "Many sea creatures live and hide there.", "They give us chocolate.", "They are not important at all."], ["Can we touch the coral when we dive?", "No, we shouldn't. It's very fragile.", "Yes, we should break some pieces.", "Coral likes to be kicked."], ["What has happened to many reefs?", "Many have become white because the sea is too warm.", "They have become pizza.", "Nothing has ever happened to them."]], "l": "The Red Sea has some of the most beautiful coral reefs in the world. Scientists have discovered that its corals can survive in warmer water than most other corals. This makes them very special.", "lq": [["Where are the beautiful reefs in this text?", "in the Red Sea", "in the Arctic", "in a lake"], ["What have scientists discovered?", "Its corals survive in warmer water.", "The corals are dying fast.", "There are no fish."], ["Why are they special?", "They can survive warmer water.", "They are blue.", "They are very small."]], "r": "Coral reefs cover less than one percent of the ocean floor, but about a quarter of all sea creatures depend on them. Reefs are like underwater cities, full of fish, turtles, octopuses and sea stars. But reefs are in danger. When the ocean becomes too warm, corals lose the tiny plants that live inside them and give them color. They turn white, and this is called coral bleaching. If the water cools down quickly, the coral can recover. If it doesn't, the coral may die.", "rq": [["How much of the ocean floor do reefs cover?", "less than one percent", "half", "a quarter"], ["What are reefs compared to?", "underwater cities", "deserts", "forests"], ["What is coral bleaching?", "corals turning white", "corals growing bigger", "fish eating coral"], ["What happens if the water cools quickly?", "The coral can recover.", "The coral dies immediately.", "Nothing changes."]]}, {"en": "Diving", "ar": "الغوص", "v": "diver|غواص|🤿;mask|قناع|🥽;fins|زعانف|🦶;tank|أسطوانة|🛢️;depth|عمق|📏;surface|سطح|🌅", "c": [["What equipment does a diver need?", "A mask, fins and an air tank.", "A pillow and a sandwich.", "Only a pair of sunglasses."], ["What should you do if you feel scared underwater?", "Stay calm, breathe slowly and signal to your partner.", "Swim to the bottom quickly.", "Take off your mask."], ["Why should you never dive alone?", "Because a partner can help if there is a problem.", "Because fish don't like it.", "Because the sea is lonely."], ["How deep have you dived?", "I've only dived about five meters.", "I have dive deep five.", "Deep has dived me."]], "l": "Before you dive, you should always check your equipment. Make sure your tank is full and your mask fits well. Go down slowly, and never hold your breath with a tank.", "lq": [["What should you check before diving?", "your equipment", "the weather only", "your phone"], ["How should you go down?", "slowly", "very fast", "head first"], ["What should you never do with a tank?", "hold your breath", "breathe", "look around"]], "r": "Before oil was discovered, pearl diving was one of the most important jobs in the Gulf. Divers went to sea for four months in the hot summer. They had no tanks or masks. A diver held his breath for one or two minutes, went down to the seabed with a stone tied to his foot, and collected oysters. A rope connected him to a man on the boat, who pulled him up. The work was very hard and dangerous, but the pearls of the Gulf were famous around the world.", "rq": [["When did pearl divers go to sea?", "in the summer", "in the winter", "every evening"], ["How long did a diver hold his breath?", "one or two minutes", "ten minutes", "ten seconds"], ["Why was there a stone tied to his foot?", "to go down quickly", "to catch fish", "to sell it"], ["Who pulled the diver up?", "a man on the boat", "a dolphin", "nobody"]]}, {"en": "Sea Turtles", "ar": "السلاحف البحرية", "v": "hatch|يفقس|🐣;nest|عش|🪺;beach|شاطئ|🏖;journey|رحلة|🧭;survive|ينجو|🛟;plastic|بلاستيك|🛍️", "c": [["Where do sea turtles lay their eggs?", "On sandy beaches, in nests they dig.", "In the trees near the sea.", "Inside shells on the moon."], ["What happens when the babies hatch?", "They run to the sea as fast as they can.", "They stay on the beach for years.", "They fly to their mother."], ["If we leave plastic on the beach, what will happen?", "Turtles might eat it and get sick.", "Turtles will use it as a hat.", "Nothing will happen, plastic is food."], ["What should we do if we see a turtle nest?", "We should leave it alone and tell the rangers.", "We should dig it up.", "We should sit on it."]], "l": "A mother turtle comes to the beach at night. She digs a hole and lays about one hundred eggs. After about two months, the baby turtles hatch and walk to the sea.", "lq": [["When does the mother come to the beach?", "at night", "at noon", "in the morning"], ["How many eggs does she lay?", "about one hundred", "two", "one thousand"], ["When do the babies hatch?", "after about two months", "after one day", "after one year"]], "r": "Only about one in a thousand baby sea turtles survives to become an adult. The journey is dangerous from the very first minute. Crabs and birds wait on the beach, and fish wait in the water. But the turtles that survive can live for more than fifty years. Amazingly, many female turtles return to lay their eggs on the same beach where they hatched, even after swimming thousands of kilometers. Scientists believe they use the Earth's magnetic field like a map.", "rq": [["How many baby turtles survive to adulthood?", "about one in a thousand", "half of them", "all of them"], ["Who waits for them on the beach?", "crabs and birds", "sharks", "people"], ["Where do female turtles often lay eggs?", "on the same beach where they hatched", "on any beach", "in rivers"], ["What helps them find their way?", "the Earth's magnetic field", "the stars only", "signs"]]}, {"en": "Ocean Problems", "ar": "مشكلات المحيط", "v": "pollution|تلوث|🛢️;overfishing|الصيد الجائر|🎣;litter|نفايات|🗑️;oil spill|تسرب نفطي|⚫;clean-up|حملة تنظيف|🧹;reusable|قابل لإعادة الاستخدام|♻️", "c": [["What is the biggest problem for the ocean?", "Plastic pollution is one of the biggest.", "The ocean has too many colors.", "The ocean doesn't have any problems."], ["What does overfishing mean?", "Catching more fish than can be replaced.", "Fishing over the clouds.", "Eating fish every day."], ["If everyone uses reusable bags, what will happen?", "There will be less plastic in the sea.", "There will be more plastic.", "Bags will start swimming."], ["Have you ever joined a beach clean-up?", "Yes, I've joined two with my school.", "Yes, I have join it last year ago.", "Clean-up has joined me."]], "l": "Every year, about eleven million tons of plastic go into the ocean. Some scientists say that by 2050, there could be more plastic than fish in the sea, if we don't change our habits.", "lq": [["How much plastic goes into the ocean every year?", "about eleven million tons", "eleven tons", "one million tons"], ["What could happen by 2050?", "more plastic than fish", "no more plastic", "more fish than ever"], ["When could this happen?", "if we don't change our habits", "if we recycle", "never"]], "r": "In 2013, a young Dutch student named Boyan Slat had an idea. He wanted to use the ocean's own currents to collect floating plastic. Many experts said it wouldn't work. But Boyan didn't give up. He started a project called The Ocean Cleanup. His team built long floating barriers that catch plastic while letting fish swim underneath. Since then, they have removed huge amounts of plastic from the ocean and from rivers. His story shows that one young person's idea can make a real difference.", "rq": [["What was Boyan's idea?", "use ocean currents to collect plastic", "stop fishing", "build a boat"], ["What did many experts say?", "It wouldn't work.", "It was perfect.", "Nothing."], ["What do the barriers let fish do?", "swim underneath", "eat plastic", "jump over"], ["What does the story show?", "One young person's idea can make a difference.", "Experts are always right.", "Plastic can't be removed."]]}, {"en": "Pearls of the Gulf", "ar": "لؤلؤ الخليج", "v": "pearl|لؤلؤة|⚪;oyster|محار|🦪;merchant|تاجر|🧔;valuable|ثمين|💰;dhow|سفينة شراعية|⛵;tradition|تقليد|🏺", "c": [["How is a pearl made?", "A tiny piece of sand gets inside an oyster, and the oyster covers it layer by layer.", "Pearls grow on palm trees.", "A fish makes pearls in a factory."], ["Why were Gulf pearls so valuable?", "They were famous for their beauty and quality.", "They were very cheap.", "They were made of plastic."], ["What happened to pearl diving after the 1930s?", "It became less important when oil was discovered and cultured pearls appeared.", "It became the biggest job in the world.", "Nothing has changed since then."], ["Have you ever seen a real pearl?", "Yes, my grandmother has a pearl necklace.", "Yes, I have see a pearl yesterday.", "Pearl has seen me."]], "l": "In Bahrain, the old pearling path is now a UNESCO World Heritage Site. Visitors can walk past the old houses of pearl merchants and learn about the hard life of the divers.", "lq": [["Where is the old pearling path?", "in Bahrain", "in Egypt", "in India"], ["What is it now?", "a UNESCO World Heritage Site", "a shopping mall", "a beach"], ["What can visitors learn about?", "the hard life of the divers", "modern cars", "space"]], "r": "When a diver came back to the boat with a basket of oysters, the crew opened them one by one. Most were empty. Sometimes there was a small, plain pearl. Very rarely, a large, perfectly round, shining pearl appeared, and the whole crew celebrated. The captain, called the nokhada, sold the pearls to merchants, who sent them to India and later to Europe. Even though the divers worked hardest, they often earned the least money. Their songs, called fijiri, are still sung today to remember their courage.", "rq": [["What did the crew find in most oysters?", "nothing", "a large pearl", "a small fish"], ["Who sold the pearls to merchants?", "the captain, called the nokhada", "the divers", "the children"], ["Who earned the least money?", "the divers", "the merchants", "the captain"], ["What are the fijiri?", "the divers' songs", "a type of pearl", "the boats"]]}], "c": "#27A85A", "d": "#17733C", "s": "#DFF4E7", "rate": 0.88, "games": ["spell", "sentence", "memory", "pop", "sentence", "unscramble"]}, {"en": "History Castle", "ar": "قلعة التاريخ", "sub": "حضارات وعلماء وأحداث من الماضي", "icon": "🏰", "boss": "تحدي حارس القلعة", "lessons": [{"en": "Ancient Egypt", "ar": "مصر القديمة", "v": "pyramid|هرم|🔺;pharaoh|فرعون|👑;tomb|مقبرة|⚰️;ancient|قديم جدًا|🏺;hieroglyphs|الكتابة الهيروغليفية|𓂀;Nile|النيل|🏞️", "c": [["What were the pyramids built for?", "They were built as tombs for the pharaohs.", "They were built as shopping malls.", "They were built for camels to sleep in."], ["How did the ancient Egyptians write?", "They used pictures called hieroglyphs.", "They used computers.", "They didn't write anything."], ["Why was the Nile important?", "It gave water for farming and travel.", "It was a big desert.", "It was a famous pharaoh."], ["Have you ever visited Egypt?", "Not yet, but I'd love to see the pyramids.", "Yes, I have visit it tomorrow.", "Egypt has visited me."]], "l": "The Great Pyramid of Giza was built about four thousand five hundred years ago. It was the tallest building in the world for almost four thousand years. Thousands of workers built it.", "lq": [["When was the Great Pyramid built?", "about four thousand five hundred years ago", "five hundred years ago", "last century"], ["How long was it the tallest building?", "almost four thousand years", "forty years", "one year"], ["Who built it?", "thousands of workers", "one pharaoh alone", "aliens"]], "r": "For hundreds of years, nobody could read hieroglyphs. Then, in 1799, soldiers found a stone near the town of Rosetta in Egypt. The Rosetta Stone had the same text written in three scripts: hieroglyphs, another Egyptian script and ancient Greek. Because scholars could read Greek, they could compare the texts. In 1822, a French scholar named Champollion finally understood the hieroglyphs. Suddenly, the walls of temples and tombs could tell their stories again.", "rq": [["When was the Rosetta Stone found?", "in 1799", "in 1822", "in 2000"], ["How many scripts were on the stone?", "three", "one", "ten"], ["Why was Greek helpful?", "Scholars could read it.", "It was the easiest.", "It was the biggest."], ["Who understood the hieroglyphs?", "Champollion", "a soldier", "a pharaoh"]]}, {"en": "Golden Age Scholars", "ar": "علماء العصر الذهبي", "v": "scholar|عالِم|🧑‍🎓;library|مكتبة|📚;astronomy|علم الفلك|🔭;algebra|الجبر|➗;translate|يترجم|🔤;observe|يرصد|👀", "c": [["What was the House of Wisdom?", "A famous library and center of learning in Baghdad.", "A big palace for kings to sleep.", "A shop that sold houses."], ["Who is called the father of algebra?", "Al-Khwarizmi.", "Al-Khwarizmi's camel.", "Nobody knows anything about algebra."], ["Why did scholars translate books?", "To share knowledge from other cultures.", "To make the books heavier.", "Because they had nothing to do."], ["Which scholar would you like to meet?", "I'd like to meet Ibn Sina and ask him about medicine.", "I'd like meet he medicine.", "Scholar meets me."]], "l": "Ibn Sina was born more than a thousand years ago. He was a doctor and a writer. His book, The Canon of Medicine, was used in universities in Europe for hundreds of years.", "lq": [["What was Ibn Sina?", "a doctor and a writer", "a sailor", "a king"], ["What was his famous book?", "The Canon of Medicine", "The House of Wisdom", "The Rosetta Stone"], ["Where was his book used?", "in universities in Europe", "only in his home", "nowhere"]], "r": "About twelve hundred years ago, Baghdad was one of the greatest cities of learning in the world. Scholars came from many lands to study and work at the House of Wisdom. They translated books from Greek, Persian and Indian into Arabic, and then they added their own discoveries. Al-Khwarizmi wrote about algebra; his name gave us the word 'algorithm,' which computers use today. Other scholars studied the stars, built observatories and made more accurate maps. Their work later helped European scientists during the Renaissance.", "rq": [["What was Baghdad known for?", "learning", "fishing", "snow"], ["What languages were books translated from?", "Greek, Persian and Indian", "only English", "Chinese and Japanese"], ["What word comes from Al-Khwarizmi's name?", "algorithm", "algebra only", "alphabet"], ["Whom did their work later help?", "European scientists during the Renaissance", "pirates", "pharaohs"]]}, {"en": "The Silk Road", "ar": "طريق الحرير", "v": "trade|تجارة|🔄;silk|حرير|🧵;route|طريق|🗺️;merchant|تاجر|🧔;caravan|قافلة|🐫;goods|بضائع|📦", "c": [["What was the Silk Road?", "A network of trade routes between China and the Mediterranean.", "A road made of silk cloth.", "A river in Africa."], ["What did merchants trade?", "Silk, spices, paper, glass and many other goods.", "Only video games.", "They traded nothing."], ["How did merchants travel?", "In caravans with camels and horses.", "By plane and train.", "On skateboards."], ["Besides goods, what else traveled along the road?", "Ideas, languages, religions and inventions.", "Only the wind.", "Nothing at all."]], "l": "The Silk Road was not one road. It was a network of many routes over land and sea. It was used for more than one thousand five hundred years and connected East Asia with Europe and Africa.", "lq": [["Was the Silk Road one single road?", "No, it was a network of routes.", "Yes, one long road.", "It was a river."], ["How long was it used?", "more than one thousand five hundred years", "ten years", "one hundred years"], ["What did it connect?", "East Asia with Europe and Africa", "only two villages", "America and Australia"]], "r": "Paper was invented in China. For centuries, the Chinese kept the secret of how to make it. In the eighth century, papermaking reached the city of Samarkand, along the Silk Road, and soon after that, Baghdad opened its first paper mill. Paper was cheaper and lighter than the old writing materials, so books became easier to make. Libraries grew, and knowledge spread faster. Later, the technique traveled to Spain and the rest of Europe. A simple invention changed how the whole world learned.", "rq": [["Where was paper invented?", "China", "Spain", "Egypt"], ["Which city on the Silk Road learned papermaking?", "Samarkand", "Paris", "London"], ["Why did books become easier to make?", "Paper was cheaper and lighter.", "There were more trees.", "People stopped writing."], ["What does the text say about paper?", "It changed how the world learned.", "It was useless.", "Only kings used it."]]}, {"en": "Castles and Forts", "ar": "القلاع والحصون", "v": "fort|حصن|🏯;wall|سور|🧱;tower|برج|🗼;gate|بوابة|🚪;guard|حارس|💂;protect|يحمي|🛡️", "c": [["Why did people build forts?", "To protect their towns from enemies.", "To keep their cars clean.", "For birds to live in."], ["What did the guards do in the towers?", "They watched for danger.", "They slept and cooked.", "They played video games."], ["Have you ever visited Al Masmak Fort?", "Yes, I visited it on a school trip in Riyadh.", "Yes, I have visit it last week ago.", "The fort has visited me."], ["What were the walls made of?", "Mud bricks and stone.", "Glass and plastic.", "Chocolate and candy."]], "l": "Al Masmak Fort is in the center of Riyadh. It was built about one hundred and fifty years ago from mud and clay. Today, it is a museum that tells the story of the founding of the Kingdom.", "lq": [["Where is Al Masmak Fort?", "in the center of Riyadh", "in Jeddah", "in Abha"], ["What was it built from?", "mud and clay", "glass", "steel"], ["What is it today?", "a museum", "a hotel", "a school"]], "r": "In 1902, a young man named Abdulaziz Al Saud and a small group of his men arrived at Riyadh at night. At dawn, they captured Al Masmak Fort. This event was the beginning of a long journey to unite most of the Arabian Peninsula. Thirty years later, in 1932, the Kingdom of Saudi Arabia was officially established. Today, visitors to the fort can still see the spearhead stuck in the old wooden door, a reminder of that famous morning.", "rq": [["When did Abdulaziz capture the fort?", "in 1902", "in 1932", "in 2002"], ["When did they arrive at Riyadh?", "at night", "at noon", "in the afternoon"], ["When was the Kingdom officially established?", "in 1932", "in 1902", "in 1950"], ["What can visitors still see in the door?", "a spearhead", "a key", "a window"]]}, {"en": "Old Inventions", "ar": "اختراعات قديمة", "v": "compass|بوصلة|🧭;astrolabe|إسطرلاب|🌐;sundial|ساعة شمسية|☀️;windmill|طاحونة هواء|🌬️;lens|عدسة|🔎;design|يصمم|📐", "c": [["What was an astrolabe used for?", "To find the time and the position of the stars.", "To cook rice.", "To play music."], ["How did a sundial show the time?", "With the shadow from the sun.", "With a battery.", "By talking."], ["Who improved the astrolabe in the Islamic world?", "Many scholars, including Mariam al-Ijliya.", "Nobody ever improved it.", "A famous camel."], ["If you lived a thousand years ago, what would you miss most?", "I would miss electricity and the internet.", "I would miss the pyramids.", "I would miss nothing."]], "l": "A compass has a small magnet inside. The magnet always points north. Sailors used compasses to find their way across the sea, even when they couldn't see the stars.", "lq": [["What is inside a compass?", "a small magnet", "a battery", "a clock"], ["Which way does it point?", "north", "south", "up"], ["When was it especially useful?", "when sailors couldn't see the stars", "in the desert at noon", "only at home"]], "r": "Mariam al-Ijliya lived in the city of Aleppo more than one thousand years ago. Her father was an astrolabe maker, and she learned the craft from him. Her astrolabes were so accurate and beautifully made that the ruler of the city employed her at his court. An astrolabe could help people tell the time, find the direction of prayer and measure the height of mountains. In 1990, an asteroid was named '7060 Al-'Ijliya' in her honor.", "rq": [["Where did Mariam al-Ijliya live?", "Aleppo", "Cairo", "Riyadh"], ["Who taught her the craft?", "her father", "her teacher", "the ruler"], ["What could an astrolabe help people find?", "the direction of prayer", "lost keys", "oil"], ["What was named after her?", "an asteroid", "a city", "a ship"]]}, {"en": "Museums", "ar": "المتاحف", "v": "exhibit|معروض|🖼️;collection|مجموعة|🗃️;curator|أمين المتحف|🧑‍💼;display|يعرض|🪟;fossil|أحفورة|🦴;audio guide|دليل صوتي|🎧", "c": [["What's the most interesting exhibit you've seen?", "I've seen a dinosaur fossil that was ten meters long.", "I have seen a fossil it was long.", "Exhibit has seen me."], ["Why shouldn't we touch the exhibits?", "Because they are old and can be damaged easily.", "Because they bite.", "Because they are made of ice cream."], ["What does a curator do?", "A curator chooses and cares for the museum's collection.", "A curator sells tickets for buses.", "A curator cleans the street."], ["Would you rather visit a science museum or a history museum?", "I'd rather visit a science museum because I love experiments.", "I'd rather visiting museums to sleep.", "Rather is a museum."]], "l": "Welcome to the National Museum. Please don't take photos with flash, and don't touch the displays. You can borrow an audio guide at the information desk. Enjoy your visit!", "lq": [["What shouldn't visitors use?", "flash", "their eyes", "audio guides"], ["What shouldn't they touch?", "the displays", "the floor", "the doors"], ["Where can they borrow an audio guide?", "at the information desk", "at the café", "outside"]], "r": "Museums are not just places for old things. Modern museums use technology to make history come alive. In some museums, you can use virtual reality glasses to walk through an ancient city. In others, you can touch a screen to see how a vase looked before it broke. Children can join workshops to make pottery or write their names in ancient scripts. A good museum doesn't only show us the past; it helps us understand who we are today.", "rq": [["What do modern museums use?", "technology", "only old books", "nothing"], ["What can virtual reality glasses do?", "let you walk through an ancient city", "fix vases", "sell tickets"], ["What can children do in workshops?", "make pottery", "drive cars", "sleep"], ["What does a good museum help us understand?", "who we are today", "how to cook", "how to dive"]]}], "c": "#0F9488", "d": "#086158", "s": "#DBF3F0", "rate": 0.91, "games": ["sentence", "memory", "pop", "sentence", "unscramble", "spell"]}, {"en": "Health Heroes", "ar": "أبطال الصحة", "sub": "النصائح: should وshouldn't", "icon": "🏥", "boss": "تحدي طبيب المدينة", "lessons": [{"en": "Healthy Habits", "ar": "عادات صحية", "v": "habit|عادة|🔁;balanced|متوازن|⚖️;vitamin|فيتامين|🍊;junk food|الوجبات السريعة|🍟;sleep|نوم|😴;hydrated|مرتوٍ|💧", "c": [["I'm always tired in the morning. What should I do?", "You should go to bed earlier and avoid screens at night.", "You should drink more fizzy drinks.", "You should sleep in the bathroom."], ["Should I eat junk food every day?", "No, you shouldn't. It's fine only sometimes.", "Yes, you should eat it at every meal.", "Junk food should eat you."], ["How can I get more vitamins?", "You should eat more fruit and vegetables.", "You should eat more candy.", "You should eat vitamins from the floor."], ["Why should we drink water often?", "To stay hydrated, especially in hot weather.", "To make our hair blue.", "Water is bad for us."]], "l": "Doctors say that children aged six to twelve should sleep between nine and twelve hours every night. Sleep helps your brain remember what you learned and helps your body grow.", "lq": [["How long should children sleep?", "between nine and twelve hours", "four hours", "fifteen hours"], ["What does sleep help the brain do?", "remember what you learned", "forget everything", "stop working"], ["What else does sleep help?", "your body grow", "you get taller in one night", "nothing"]], "r": "Scientists say it takes about two months to build a new habit. The trick is to start small. If you want to read more, don't start with one hour a day; start with five minutes. If you want to drink more water, keep a bottle on your desk. Connect the new habit to something you already do, for example, read a page right after you brush your teeth at night. And don't worry if you miss one day. Just start again the next day. Small steps, repeated many times, lead to big changes.", "rq": [["How long does it take to build a habit?", "about two months", "one day", "ten years"], ["What is the trick?", "Start small.", "Start big.", "Never start."], ["What should you do if you miss a day?", "Start again the next day.", "Give up.", "Do double tomorrow."], ["What lead to big changes?", "small steps repeated many times", "one big step", "luck"]]}, {"en": "First Aid", "ar": "الإسعافات الأولية", "v": "bandage|ضمادة|🩹;cut|جرح|🩸;burn|حرق|🔥;emergency|طوارئ|🚨;ambulance|سيارة إسعاف|🚑;calm|هادئ|😌", "c": [["Your friend has cut his finger. What should you do?", "Wash it with clean water and put on a bandage.", "Put salt on it.", "Ignore it and keep playing."], ["What should you do if someone burns their hand?", "Put it under cool running water for several minutes.", "Put butter or ice on it.", "Rub it very hard."], ["What number do you call in an emergency in Saudi Arabia?", "997 for an ambulance, or 911 in some cities.", "123456789.", "You should never call anyone."], ["Why should you stay calm in an emergency?", "So you can think clearly and help better.", "Because emergencies are boring.", "Because calm is a bandage."]], "l": "If someone feels faint, help them sit or lie down. Raise their legs a little if they are lying down. Give them some fresh air, and if they don't feel better, call for help.", "lq": [["What should the person do first?", "sit or lie down", "run", "eat"], ["What can you raise a little?", "their legs", "their head", "their arms"], ["What should you do if they don't feel better?", "call for help", "go home", "laugh"]], "r": "Last month, Reem was in the kitchen with her grandmother when the old woman touched a hot pan and burned her hand. Reem remembered what she had learned at school. She stayed calm and quickly put her grandmother's hand under cool running water for ten minutes. She didn't put ice or toothpaste on it, because she knew that can make burns worse. Then she covered it loosely with a clean cloth and called her mother. The doctor later said that Reem's quick action helped a lot.", "rq": [["What happened to the grandmother?", "She burned her hand.", "She cut her finger.", "She fell down."], ["How long did Reem put the hand under water?", "ten minutes", "one minute", "one hour"], ["What did Reem NOT put on the burn?", "ice or toothpaste", "water", "a clean cloth"], ["What did the doctor say?", "Reem's quick action helped a lot.", "Reem made it worse.", "Nothing."]]}, {"en": "Germs", "ar": "الجراثيم", "v": "germ|جرثومة|🦠;virus|فيروس|🧫;spread|ينتشر|📢;soap|صابون|🧼;sneeze|يعطس|🤧;immune|مناعة|🛡️", "c": [["How do germs spread?", "Through coughs, sneezes and dirty hands.", "Through good books.", "Germs never spread."], ["How long should you wash your hands?", "For at least twenty seconds with soap.", "For one second without soap.", "For three hours."], ["What should you do when you sneeze?", "Sneeze into a tissue or your elbow.", "Sneeze on your friend's face.", "Sneeze into your food."], ["If you have a fever, should you go to school?", "No, you should stay home and rest so you don't spread it.", "Yes, you should hug everyone.", "Fever is a holiday at school."]], "l": "Germs are so small that you can't see them without a microscope. Some germs are harmful and make us sick, but many are helpful. For example, some live in our stomachs and help us digest food.", "lq": [["What do you need to see germs?", "a microscope", "glasses", "a torch"], ["Are all germs harmful?", "No, many are helpful.", "Yes, all of them.", "None are harmful."], ["Where do some helpful germs live?", "in our stomachs", "on the moon", "in books"]], "r": "In the 1840s, a doctor named Ignaz Semmelweis noticed something strange in his hospital in Vienna. Many mothers became very sick after giving birth. He realized that doctors were going from one patient to another without washing their hands. He told all the doctors to wash their hands before touching patients, and the number of sick mothers dropped dramatically. Sadly, many doctors laughed at him and didn't believe him. Years later, scientists proved that germs cause disease, and Semmelweis was finally recognized as a hero.", "rq": [["Where did Semmelweis work?", "in a hospital in Vienna", "in a school in London", "on a ship"], ["What were doctors not doing?", "washing their hands", "talking to patients", "writing notes"], ["What happened when doctors washed their hands?", "fewer mothers got sick", "more mothers got sick", "nothing changed"], ["How did other doctors react at first?", "They laughed at him.", "They thanked him.", "They gave him a prize."]]}, {"en": "Food and Energy", "ar": "الغذاء والطاقة", "v": "protein|بروتين|🍗;carbohydrates|نشويات|🍞;fat|دهون|🧈;calcium|كالسيوم|🥛;energy|طاقة|⚡;portion|حصة|🍽️", "c": [["Which foods give us protein?", "Eggs, fish, chicken and beans.", "Only candy and soda.", "Water and air."], ["What does calcium do for us?", "It makes our bones and teeth strong.", "It makes our hair green.", "It makes us sleepy."], ["What should a healthy plate look like?", "Half vegetables and fruit, a quarter protein and a quarter grains.", "All chips.", "Only meat and nothing else."], ["If you skip breakfast, how might you feel?", "I might feel tired and find it hard to focus.", "I will feel full of energy.", "I will become taller."]], "l": "Carbohydrates like bread, rice and potatoes give us energy. Protein helps our muscles grow and repair. We need a little fat too, from foods like nuts and olive oil.", "lq": [["What gives us energy?", "carbohydrates", "water", "salt"], ["What helps muscles grow?", "protein", "sugar", "fat only"], ["Where can we get healthy fat?", "nuts and olive oil", "candy", "soda"]], "r": "Have you ever felt very hungry and grumpy before lunch? Scientists even have a word for it: 'hangry,' a mix of hungry and angry. When your body runs low on energy, your brain doesn't work as well, so you might get annoyed more easily. That's why a good breakfast is important. Foods that release energy slowly, like oats, eggs and whole-grain bread, keep you full and focused for longer than sugary cereals, which give you quick energy that soon disappears.", "rq": [["What does 'hangry' mean?", "hungry and angry", "happy and hungry", "tired"], ["What happens when your body runs low on energy?", "Your brain doesn't work as well.", "You get stronger.", "You sleep better."], ["Which foods release energy slowly?", "oats, eggs and whole-grain bread", "sugary cereals", "candy"], ["What is the problem with sugary cereals?", "Their energy soon disappears.", "They are too slow.", "They are too healthy."]]}, {"en": "Sleep and the Brain", "ar": "النوم والدماغ", "v": "brain|دماغ|🧠;dream|حلم|💭;rest|راحة|🛌;memory|ذاكرة|🗂️;focus|يركّز|🎯;routine|روتين|📋", "c": [["Why do we need sleep?", "Our brain needs time to rest and store memories.", "Because the night is boring.", "We don't need sleep at all."], ["What happens if you don't sleep enough?", "It's hard to focus and you feel moody.", "You become a superhero.", "You grow faster."], ["What's a good bedtime routine?", "A shower, reading a book and sleeping at the same time every night.", "Playing video games until midnight.", "Eating a big meal and drinking soda."], ["Do you remember your dreams?", "Sometimes I remember them in the morning.", "I remember dream was it tomorrow.", "Dreams remember me."]], "l": "While you sleep, your brain is very busy. It sorts the things you learned during the day and stores the important ones as memories. That's why sleeping well before a test is better than staying up late.", "lq": [["Is the brain resting completely during sleep?", "No, it is very busy.", "Yes, it switches off.", "It sleeps more than the body."], ["What does the brain store as memories?", "the important things you learned", "everything you ate", "nothing"], ["What is better before a test?", "sleeping well", "staying up late", "drinking coffee"]], "r": "The blue light from phones and tablets tells your brain that it is still daytime. This makes it harder to fall asleep. Scientists recommend switching off screens at least one hour before bed. Instead, you can read a paper book, talk with your family, or listen to calm sounds. Keeping your room dark, quiet and cool also helps. A regular routine, going to bed and waking up at the same time every day, even on weekends, trains your body to sleep better.", "rq": [["What does blue light tell the brain?", "It is still daytime.", "It is time to sleep.", "It is winter."], ["When should you switch off screens?", "at least one hour before bed", "right before sleeping", "never"], ["What kind of room helps sleep?", "dark, quiet and cool", "bright and noisy", "hot"], ["What trains your body to sleep better?", "a regular routine", "sleeping late on weekends", "more screen time"]]}, {"en": "Talking About Feelings", "ar": "التعبير عن المشاعر", "v": "worried|قلق|😟;nervous|متوتر|😬;frustrated|محبط|😤;relieved|مرتاح|😮‍💨;lonely|وحيد|🥺;confident|واثق|😎", "c": [["You look worried. Is everything OK?", "I'm nervous about my presentation tomorrow.", "I'm worried a presentation was.", "Everything looks me."], ["What should I do when I feel nervous?", "You should take deep breaths and practice once more.", "You should shout at everyone.", "You should never practice."], ["How did you feel after the exam?", "I felt relieved because it went well.", "I felt relieve was it.", "The exam felt me."], ["What do you do when a friend feels lonely?", "I invite them to play or just sit and talk with them.", "I tell them to go away.", "I laugh at them."]], "l": "It's normal to feel frustrated when something is difficult. When this happens, take a short break, drink some water, and then try again. You can also ask someone for help.", "lq": [["Is it normal to feel frustrated?", "Yes, it is normal.", "No, never.", "Only for adults."], ["What should you take?", "a short break", "a long holiday", "a pill"], ["Who can you ask?", "someone for help", "nobody", "a stranger online"]], "r": "Dana had just moved to a new school, and for the first week she felt lonely. At break time, she sat alone and pretended to read. One day, a girl named Jood sat next to her and asked, 'What are you reading?' They started talking and discovered they both loved drawing. The next day, Jood introduced Dana to her friends. Dana later said, 'That small question changed my whole year.' Sometimes a simple act of kindness is all someone needs.", "rq": [["Why did Dana feel lonely?", "She moved to a new school.", "She lost her book.", "She was sick."], ["What did Dana do at break time?", "She sat alone and pretended to read.", "She played football.", "She went home."], ["What did Dana and Jood both love?", "drawing", "swimming", "cooking"], ["What is the message of the story?", "A simple act of kindness can help a lot.", "Reading is boring.", "New schools are bad."]]}], "c": "#E0702A", "d": "#9E4614", "s": "#FCE9DC", "rate": 0.94, "games": ["memory", "pop", "sentence", "unscramble", "spell", "sentence"]}, {"en": "Mystery Mansion", "ar": "القصر الغامض", "sub": "ماذا كان يحدث؟ والجمل الشرطية", "icon": "🕵️", "boss": "تحدي المحقق الكبير", "lessons": [{"en": "While I Was...", "ar": "بينما كنت...", "v": "while|بينما|⏳;suddenly|فجأة|⚡;noise|ضجيج|🔊;was doing|كان يفعل|🔄;interrupted|قاطع|✋;happened|حدث|❗", "c": [["What were you doing when the lights went out?", "I was reading in my room.", "I read was in my room.", "Lights were doing me."], ["What happened while you were walking home?", "It suddenly started to rain.", "It suddenly start rain was.", "Home was walking me."], ["Were you sleeping when I called?", "Yes, sorry. I was taking a nap.", "Yes, I sleeping was nap.", "Called was sleeping."], ["What was everyone doing at eight o'clock?", "Dad was cooking and the kids were doing homework.", "Dad cooking kids homework were.", "Eight o'clock was everyone."]], "l": "Yesterday at five o'clock, everyone was busy. Mom was talking on the phone. Grandpa was watering the plants. My sister was painting a picture. And I was trying to fix my bike.", "lq": [["Who was talking on the phone?", "Mom", "Grandpa", "the sister"], ["What was Grandpa doing?", "watering the plants", "painting", "fixing a bike"], ["What was the narrator trying to fix?", "a bike", "a phone", "a picture"]], "r": "It was a dark and windy night. Saud was reading a book in bed while the rest of the family were sleeping. Suddenly, he heard a strange noise from the kitchen: tap, tap, tap. His heart was beating fast. He took his torch and walked slowly down the stairs. While he was opening the kitchen door, the noise stopped. He turned on the light and saw... a branch of the lemon tree! The wind was blowing it against the window. Saud laughed quietly and went back to bed.", "rq": [["What was Saud doing when he heard the noise?", "reading a book in bed", "sleeping", "eating"], ["Where did the noise come from?", "the kitchen", "the garden", "the roof"], ["What did he take with him?", "his torch", "his phone", "a stick"], ["What was making the noise?", "a branch hitting the window", "a thief", "a cat"]]}, {"en": "Detective Words", "ar": "كلمات المحقق", "v": "clue|دليل|🔍;suspect|مشتبه به|🕴️;evidence|برهان|📁;footprint|أثر قدم|👣;witness|شاهد|👁️;solve|يحل|🧩", "c": [["What does a detective look for?", "Clues and evidence.", "Sweets and toys.", "A place to sleep."], ["The window is open and there are muddy footprints. What does that mean?", "Someone came in through the window.", "The window was hungry.", "It means it's Tuesday."], ["What did the witness say?", "She said she saw a man in a red hat.", "She saying saw was hat red.", "The witness was a hat."], ["How did you solve the mystery?", "I put all the clues together.", "I asked a parrot to solve it.", "I didn't solve anything ever."]], "l": "The cookies have disappeared from the kitchen! Clue one: there are crumbs on the floor. Clue two: the dog is sleeping under the table. Clue three: there are chocolate marks on the dog's nose.", "lq": [["What has disappeared?", "the cookies", "the dog", "the table"], ["Where is the dog sleeping?", "under the table", "in the garden", "on the bed"], ["Who probably took the cookies?", "the dog", "the cat", "Grandma"]], "r": "Detective Hala arrived at the school library. The librarian was upset: the library's rare old book had disappeared. Hala looked around carefully. She noticed that the book had been on the top shelf, which only a tall person could reach. On the floor, she found a small piece of blue paper from a ladder sticker. 'Who used the blue ladder today?' she asked. The librarian remembered that a cleaner had moved it to the storage room. In the storage room, Hala found the book on the ladder's step. It had simply fallen there. There was no thief after all!", "rq": [["What was missing?", "a rare old book", "a computer", "money"], ["What did Hala find on the floor?", "a piece of blue paper", "a footprint", "a key"], ["Where was the book?", "on the ladder's step in the storage room", "in a bag", "outside"], ["What was the solution?", "There was no thief; it had fallen.", "The librarian took it.", "A student stole it."]]}, {"en": "If It Rains...", "ar": "إذا أمطرت...", "v": "if|إذا|🔀;unless|ما لم|🚧;in case|تحسبًا|🎒;probably|على الأرجح|🤔;umbrella|مظلة|☂️;cancel|يلغي|❌", "c": [["What will you do if it rains tomorrow?", "If it rains, we'll stay home and play board games.", "If it rain, we stay will home.", "Tomorrow rains me."], ["What will happen if you don't study?", "If I don't study, I won't do well on the test.", "If I not study, I will do well.", "Study will happen me."], ["Should I take my umbrella?", "Yes, take it in case it rains.", "Yes, take it in case it is a cat.", "Umbrella should take you."], ["Will you come to the party?", "Yes, unless I have too much homework.", "Yes, unless party is me.", "Party will come me."]], "l": "If you heat ice, it melts. If you heat water to one hundred degrees, it boils. If you put water in the freezer, it turns into ice.", "lq": [["What happens if you heat ice?", "It melts.", "It freezes.", "Nothing."], ["At what temperature does water boil?", "one hundred degrees", "fifty degrees", "zero degrees"], ["What happens in the freezer?", "Water turns into ice.", "Water boils.", "Water disappears."]], "r": "Nawaf's class is planning a trip to the zoo on Thursday. The teacher has explained the plan: 'If the weather is good, we will have lunch in the picnic area. If it is too hot, we will eat inside the café. If anyone feels sick, they must tell a teacher immediately. And if everyone behaves well, we will visit the dolphin show at the end.' Nawaf hopes the weather will be good, because he loves picnics, and he will definitely behave well because he really wants to see the dolphins.", "rq": [["When is the trip?", "on Thursday", "on Friday", "on Monday"], ["Where will they eat if it is too hot?", "inside the café", "in the picnic area", "on the bus"], ["What will happen if everyone behaves well?", "They will visit the dolphin show.", "They will go home early.", "They will get homework."], ["Why will Nawaf behave well?", "He wants to see the dolphins.", "He is scared.", "His mother is there."]]}, {"en": "The Missing Cat", "ar": "القطة المفقودة", "v": "missing|مفقود|❓;poster|ملصق|🪧;neighbor|جار|🏠;search|يبحث|🔦;hide|يختبئ|🫣;reward|مكافأة|🎁", "c": [["When did you last see your cat?", "I saw her this morning before school.", "I see her this morning was.", "The cat saw last me."], ["What does she look like?", "She's gray with white paws and green eyes.", "She's a gray paws green was.", "She looks like a car."], ["Have you asked your neighbors?", "Yes, I've asked everyone on our street.", "Yes, I have ask everyone.", "Neighbors have asked me."], ["What will you do if you find her?", "I'll give her a big hug and her favorite food.", "I'll give her to a stranger.", "I will finding her yesterday."]], "l": "MISSING CAT! Her name is Lulu. She is small and gray with white paws. She has a pink collar. She was last seen on Palm Street on Monday evening. If you find her, please call 050-123-4567.", "lq": [["What color are Lulu's paws?", "white", "gray", "pink"], ["What color is her collar?", "pink", "blue", "red"], ["When was she last seen?", "on Monday evening", "on Sunday morning", "yesterday at noon"]], "r": "For two days, Abeer searched everywhere for her cat, Lulu. She put up posters, asked the neighbors and looked under every car on the street. On the third morning, while she was eating breakfast, she heard a soft meow. It was coming from inside the house! She followed the sound to the guest room, which nobody had opened for days. There was Lulu, sitting comfortably on the bed with three tiny kittens. Lulu hadn't been lost at all. She had found a quiet place to have her babies.", "rq": [["How long did Abeer search?", "two days", "two weeks", "two hours"], ["When did she hear the meow?", "while she was eating breakfast", "at night", "at school"], ["Where was Lulu?", "in the guest room", "under a car", "at the neighbor's"], ["Why was Lulu hiding?", "She was having kittens.", "She was scared of dogs.", "She was sick."]]}, {"en": "Riddles", "ar": "الألغاز", "v": "riddle|لغز|🤔;guess|يخمّن|💭;answer|إجابة|✅;tricky|صعب ومخادع|🌀;logic|منطق|🧠;hint|تلميح|💡", "c": [["I have keys but I can't open doors. What am I?", "A piano!", "A door that is sad.", "A key ate me."], ["What gets wetter the more it dries?", "A towel.", "The sun.", "A dry fish."], ["What has hands but can't clap?", "A clock.", "A tree with shoes.", "My hand is clapping."], ["Can you give me a hint?", "It's something you use every day in the bathroom.", "Hint is a riddle.", "No, hints are illegal."]], "l": "Here's a riddle: The more you take, the more you leave behind. What am I? Think about walking on a sandy beach. The answer is: footsteps!", "lq": [["What does the riddle say?", "The more you take, the more you leave behind.", "I have keys but no doors.", "What gets wetter?"], ["What is the hint?", "walking on a sandy beach", "reading a book", "eating dinner"], ["What is the answer?", "footsteps", "shells", "water"]], "r": "A farmer needs to take a fox, a chicken and a bag of grain across a river. His boat is small, so he can only carry one thing at a time. If he leaves the fox with the chicken, the fox will eat the chicken. If he leaves the chicken with the grain, the chicken will eat the grain. How can he do it? First, he takes the chicken across. Then he goes back and takes the fox, but he brings the chicken back with him. Next, he takes the grain across and leaves it with the fox. Finally, he goes back for the chicken. Everyone arrives safely!", "rq": [["What does the farmer take first?", "the chicken", "the fox", "the grain"], ["What happens if the fox stays with the chicken?", "The fox eats the chicken.", "They become friends.", "Nothing."], ["Which two can safely stay together?", "the fox and the grain", "the fox and the chicken", "the chicken and the grain"], ["What does he bring back on the second trip?", "the chicken", "the fox", "nothing"]]}, {"en": "Ghost Story?", "ar": "قصة شبح؟", "v": "shadow|ظل|👤;creak|صرير|🚪;spooky|مخيف|👻;flashlight|مصباح|🔦;imagine|يتخيل|💭;explain|يفسر|🗣️", "c": [["Do you believe in ghosts?", "No, I think there's always a logical explanation.", "Yes, ghosts do my homework.", "I believe ghost was yesterday."], ["What was that creaking sound?", "I think it was just the old door moving in the wind.", "It was creak a door was.", "Sound was creaking me."], ["Why do shadows look scary at night?", "Because our imagination makes them look like monsters.", "Because shadows are hungry at night.", "Shadows are not real objects."], ["If you hear a strange sound at night, what will you do?", "I'll stay calm and turn on the light.", "I'll scream and run outside.", "I will sound strange."]], "l": "Old houses often make strange sounds at night. When the air gets colder, wood shrinks a little and makes cracking noises. Pipes can also knock when water moves through them.", "lq": [["When does wood shrink?", "when the air gets colder", "when it is hot", "when it rains"], ["What sound does it make?", "cracking noises", "music", "words"], ["What can knock?", "pipes", "shoes", "windows only"]], "r": "Everyone in the village said the old house on the hill was haunted. At night, people saw a light moving in the windows. Two brave friends, Mansour and Bandar, decided to find out the truth. They went in the afternoon with a flashlight and a notebook. Inside, they found a broken window and a small mirror hanging on the wall. When car lights passed on the road below, the mirror reflected the light and made it move around the room. The 'ghost' was just a mirror! The boys wrote an article for the school newspaper, and the village stopped being afraid.", "rq": [["What did people see at night?", "a light moving in the windows", "a man in white", "a black cat"], ["When did the boys go to the house?", "in the afternoon function gUnscr(L,done){
 const ws=shuffle(V(L).filter(v=>/^[a-z]+$/i.test(v.en)&&v.en.length<=11)).slice(0,5);let r=0,mis=0;
 function round(){const v=ws[r],word=v.en.toLowerCase();let letters,tries=0;do{letters=shuffle(word.split(''))}while(letters.join('')===word&&++tries<8);let ans=[];
  G(`<p class="tip">رتّب الحروف لتكتب الكلمة (${r+1} من ${ws.length})</p><div class="clue"><span class="big-em">${v.em}</span><span>${esc(v.ar)}</span><button class="spk" aria-label="استمع" data-say="${esc(v.en)}">${icon('spk')}</button></div><div class="slots" dir="ltr" id="sl"></div><div class="tiles" dir="ltr" id="tl"></div><div class="btns"><button class="ghost" id="clr">امسح</button></div>`);
  function draw(){$('#sl').innerHTML=letters.map((_,n)=>`<span class="slot">${ans[n]!==undefined?letters[ans[n]]:''}</span>`).join('');
   $('#tl').innerHTML=letters.map((ch,n)=>`<button class="ltr" data-n="${n}" ${ans.includes(n)?'disabled':''}>${ch}</button>`).join('');
   $$('#tl .ltr').forEach(b=>b.onclick=()=>{ans.push(+b.dataset.n);draw();if(ans.length===letters.length)check()})}
  function check(){if(ans.map(n=>letters[n]).join('')===word){ding();say(v.en);$('#sl').classList.add('ok');setTimeout(()=>{++r<ws.length?round():done(starsFrom(mis,0,2))},900)}
   else{buzz();mis++;$('#sl').classList.add('shake');setTimeout(()=>{ans=[];draw();$('#sl').classList.remove('shake')},600)}}
  $('#clr').onclick=()=>{ans=[];draw()};draw();}
 round();
}

function gSpell(L,done){
 const ws=shuffle(V(L).filter(v=>/^[a-z' ]+$/i.test(v.en))).slice(0,5);let r=0,mis=0;
 function round(){const v=ws[r];let hint=0,wrong=0;
  G(`<p class="tip">اسمع الكلمة واكتبها بالإنجليزية (${r+1} من ${ws.length})</p><div class="clue"><span class="big-em">${v.em}</span><span>${esc(v.ar)}</span><button class="spk" aria-label="استمع" data-say="${esc(v.en)}">${icon('spk')}</button></div><input id="sp" class="inp" dir="ltr" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="type here"><p class="hintline" dir="ltr" id="hl"></p><div class="btns"><button class="ghost" id="hb">تلميح</button><button class="go" id="ck">تحقّق</button></div>`);
  setTimeout(()=>say(v.en),300);const inp=$('#sp');
  const showHint=()=>{$('#hl').textContent=v.en.slice(0,hint)+' _'.repeat(Math.max(0,v.en.length-hint))};
  $('#hb').onclick=()=>{if(hint<v.en.length){hint++;mis+=.5;showHint()}};
  const ck=()=>{if(inp.value.trim().toLowerCase()===v.en.toLowerCase()){ding();say(v.en);inp.classList.add('right');setTimeout(()=>{++r<ws.length?round():done(starsFrom(mis,0,2))},800)}
   else{buzz();mis++;wrong++;inp.classList.add('shake');setTimeout(()=>inp.classList.remove('shake'),400);if(wrong>=2){hint=v.en.length;showHint();toast('انظر للكلمة واكتبها')}}};

function gSentence(L,done){
 const ss=L.c.map(c=>c[1]).filter(x=>x.split(' ').length<=14);let r=0,mis=0;
 function round(){const s=ss[r],toks=s.split(' ');let order,tries=0;do{order=shuffle(toks.map((_,n)=>n))}while(order.every((n,k)=>n===k)&&++tries<8);let ans=[];
  G(`<p class="tip">رتّب الكلمات لتكوّن جملة صحيحة (${r+1} من ${ss.length})</p><button class="ghost" data-say="${esc(s)}">اسمع الجملة</button><div class="sent" dir="ltr" id="sa"></div><div class="tiles" dir="ltr" id="st"></div><div class="btns"><button class="ghost" id="clr">امسح</button></div>`);
  function draw(){$('#sa').innerHTML=ans.map((n,k)=>`<button class="tok" data-k="${k}">${esc(toks[n])}</button>`).join('');
   $('#st').innerHTML=order.map(n=>`<button class="tok" data-n="${n}" ${ans.includes(n)?'disabled':''}>${esc(toks[n])}</button>`).join('');
   $$('#sa .tok').forEach(b=>b.onclick=()=>{ans.splice(+b.dataset.k,1);draw()});
   $$('#st .tok').forEach(b=>b.onclick=()=>{ans.push(+b.dataset.n);draw();if(ans.length===toks.length)check()})}
  function check(){if(ans.map(n=>toks[n]).join(' ')===s){ding();say(s);$('#sa').classList.add('ok');setTimeout(()=>{++r<ss.length?round():done(starsFrom(mis,0,2))},1300)}
   else{buzz();mis++;$('#sa').classList.add('shake');setTimeout(()=>{$('#sa').classList.remove('shake')},500)}}
  $('#clr').onclick=()=>{ans=[];draw()};draw();}
 round();
}

function gPop(L,done,token){
 const all=V(L),rounds=shuffle([...all,...shuffle(all).slice(0,2)]);let r=0,mis=0;const speed=34+ctx.l*12,extra=(PART>1||ctx.l>=2)?3:2;
 G(`<p class="tip">اضغط الفقاعة التي تحمل اسم الصورة قبل أن تطير!</p><div class="target" id="tg"></div><div class="field" id="fd" dir="ltr"></div><p class="muted" id="pr" style="text-align:center"></p>`);
 const fd=$('#fd');
 function next(){++r<rounds.length?round():done(starsFrom(mis,0,2))}
 function round(){if(token!==RUN)return;const v=rounds[r];
  $('#tg').innerHTML=`<span class="big-em">${v.em}</span><span>${esc(v.ar)}</span>`;$('#pr').textContent=`${r+1} / ${rounds.length}`;
  fd.innerHTML='';const opts=shuffle([v,...shuffle(all.filter(x=>x.en!==v.en)).slice(0,extra)]);
  const W=fd.clientWidth,H=fd.clientHeight,lane=W/opts.length,lift=shuffle(opts.map((_,n)=>n));let over=false,last=performance.now();
  const bs=opts.map((o,n)=>{const b=document.createElement('button');b.className='bubble';b.textContent=o.en;fd.appendChild(b);const bw=b.offsetWidth;
   const z={b,o,x:Math.max(4,Math.min(W-bw-4,lane*n+(lane-bw)/2)),y:H+10+lift[n]*55,alive:true};
   b.onclick=()=>{if(over||!z.alive)return;if(o.en===v.en){over=true;b.classList.add('popped');ding();say(v.en);setTimeout(next,650)}else{z.alive=false;b.classList.add('miss');mis++;buzz()}};return z});
  function step(now){if(token!==RUN||over)return;const dt=Math.min(.05,(now-last)/1000);last=now;let gone=false;
   bs.forEach(z=>{z.y-=speed*dt;z.b.style.transform=`translate(${z.x}px,${z.y}px)`;if(z.o.en===v.en&&z.y<-60)gone=true});
   if(gone){over=true;mis++;buzz();toast(`الكلمة كانت: ${v.en}`);setTimeout(next,700);return}
   requestAnimationFrame(step)}
  requestAnimationFrame(step);}
 round();
}

function boss(){
 stopAll();const lv=LV[ctx.l],token=RUN,all=lv.lessons.flatMap(V),qs=shuffle(all).slice(0,12),T=Math.max(5,12-ctx.l-Math.min(PART-1,3));let n=0,score=0;
 h(lv.boss,level,`<div class="pane"><div class="boss-head"><b id="bn"></b><span id="bs" class="pill"></span></div><div class="timer"><span id="tb"></span></div><div id="bq" class="pane"></div></div>`);
 function q(){
  if(token!==RUN)return;
  if(n>=qs.length)return finish('boss',score>=11?3:score>=8?2:score>=5?1:0,score);
  const v=qs[n],type=n%3,opts=shuffle([v,...shuffle(all.filter(x=>x.en!==v.en&&x.em!==v.em&&x.ar!==v.ar)).slice(0,3)]);
  $('#bn').textContent=`سؤال ${n+1} من ${qs.length}`;$('#bs').textContent=`✔ ${score}`;
  const enOpts=`<div class="q-o" dir="ltr">${opts.map(o=>`<button class="opt" data-en="${esc(o.en)}">${esc(o.en)}</button>`).join('')}</div>`;
  $('#bq').innerHTML=type===0?`<div class="bprompt"><span class="big-em">${v.em}</span><p>ما اسمها بالإنجليزية؟</p></div>${enOpts}`
   :type===1?`<div class="bprompt"><button class="play" data-say="${esc(v.en)}">${icon('spk')}<span>اسمع</span></button><p>اختر الصورة الصحيحة</p></div><div class="grid4">${opts.map(o=>`<button class="tile em big" data-en="${esc(o.en)}">${o.em}</button>`).join('')}</div>`
   :`<div class="bprompt"><span class="ar-word">${esc(v.ar)}</span><p>اختر الكلمة الإنجليزية</p></div>${enOpts}`;
  if(type===1)setTimeout(()=>say(v.en),250);
  let over=false;const start=performance.now(),tb=$('#tb');
  const reveal=()=>$$('#bq [data-en]').forEach(b=>{if(b.dataset.en===v.en)b.classList.add('right')});
  (function tick(now){if(token!==RUN||over)return;const p=Math.max(0,1-(now-start)/(T*1000));tb.style.width=p*100+'%';
   if(p<=0){over=true;buzz();reveal();setTimeout(()=>{n++;q()},1000);return}requestAnimationFrame(tick)})(start);
  $$('#bq [data-en]').forEach(b=>b.onclick=()=>{if(over)return;over=true;
   if(b.dataset.en===v.en){b.classList.add('right');score++;ding()}else{b.classList.add('wrong');buzz();reveal()}
   setTimeout(()=>{n++;q()},850)});
 }
 q();
}

function finish(a,stars,score){
 stopAll();const k=a==='boss'?bossKey(ctx.l):`${ctx.l}-${ctx.i}-${a}`,prev=P.s[k]||0;
 const e0=earned();if(stars>prev){P.s[k]=stars;save()}const got=earned()-e0;
 const msg=[['حاول مرة أخرى','Try again!'],['أحسنت!','Good try!'],['رائع!','Great job!'],['ممتاز!','Excellent!']][stars];
 const order=['c','l','r','g'];let nextLbl,nextFn;
 if(a==='boss'){
  if(stars&&ctx.l<LV.length-1){nextLbl=`ادخل ${LV[ctx.l+1].ar}`;nextFn=()=>{ctx.l++;level()}}
  else if(stars){nextLbl='العودة إلى الخريطة';nextFn=home}
 }else{const ix=order.indexOf(a);
  if(ix<3){nextLbl='النشاط التالي';nextFn=()=>startAct(order[ix+1])}
  else if(ctx.i<5&&lessonUnlocked(ctx.l,ctx.i+1)){nextLbl='الدرس التالي';nextFn=()=>{ctx.i++;lesson()}}
  else if(ctx.i===5&&bossUnlocked(ctx.l)){nextLbl='إلى تحدي العالم';nextFn=bossIntro}
 }
 const back=a==='boss'?level:lesson;
 h(a==='boss'?LV[ctx.l].boss:esc(cur().en),back,`<div class="result">
  <div class="bigstars">${Array.from({length:3},(_,k)=>`<svg class="ico fill${k<stars?' on':''}" viewBox="0 0 24 24">${IC.star}</svg>`).join('')}</div>
  <h2>${msg[0]}</h2><p dir="ltr" style="font-size:20px;font-weight:700">${msg[1]}</p>
  ${a==='boss'?`<p class="muted">أجبت عن ${score} من 12</p>`:''}
  ${stars>prev&&prev?`<p class="muted">رقم قياسي جديد!</p>`:''}
  ${got?`<p class="gift">🎉 جمعت 10 نجوم! اطلب من أهلك نجمة في لوحة النجوم.</p>`:''}
  ${a==='boss'&&stars&&ctx.l===LV.length-1?`<p style="font-weight:800">أنهيت الجزء 4 كله. أنت بطل الإنجليزية! 🏆</p><a class="go" href="part5.html">انتقل إلى الجزء 5</a>`:''}
  <div class="btns">${nextFn?`<button class="go" id="nx">${nextLbl}</button>`:''}<button class="ghost" id="again">أعد المحاولة</button><button class="ghost" id="bk">رجوع</button></div></div>`);
 say(msg[1],{rate:.9,pitch:1.2});
 if(nextFn)$('#nx').onclick=()=>{stopAll();nextFn()};
 $('#again').onclick=()=>a==='boss'?boss():startAct(a);
 $('#bk').onclick=()=>{stopAll();back()};
 if(stars===3)confetti();
}

/* ---------- picture dictionary ---------- */
function words(){
 stopAll();setLv(null);
 h('قاموسي المصوّر',home,`<p class="tip" style="margin-block:6px 16px">اضغط على أي كلمة لتسمعها. الكلمات المقفلة تظهر عندما تفتح عالمها.</p>
 ${LV.map((lv,l)=>`<h2 style="font-size:20px;margin-bottom:10px">${lv.icon} ${lv.ar}</h2><div class="wl ${levelUnlocked(l)?'':'locked'}">${lv.lessons.flatMap(V).map(v=>levelUnlocked(l)?`<button class="vw" data-say="${esc(v.en)}"><span class="e">${v.em}</span><b>${esc(v.en)}</b><small>${esc(v.ar)}</small></button>`:`<span class="vw"><span class="e">${v.em}</span><small>؟؟؟</small></span>`).join('')}</div>`).join('')}`);
}

/* ---------- parents corner ---------- */
function parents(){
 stopAll();setLv(null);
 const allLessons=LV.reduce((t,lv,l)=>t+lv.lessons.filter((_,i)=>lessonDone(l,i)).length,0),bosses=LV.filter((_,l)=>P.s[bossKey(l)]>0).length;
 h('ركن الوالدين',home,`
 <div class="panel"><h3>التقدم</h3><p>${allLessons} من 30 درسًا مكتملة · ${bosses} من 5 تحديات · ${totalStars()} نجمة</p></div>
 <div class="panel"><h3>نجوم لوحة البطل</h3><p>كل 10 نجوم في أولي = نجمة تضعها أنت في لوحة النجوم.</p>
  <p style="font-size:20px;font-weight:800">جاهز الآن: <span style="color:var(--sun-deep)">${readyBoard()}</span> ${readyBoard()===1?'نجمة':'نجوم'}</p>
  <p class="muted">بعد أن تضعها في اللوحة (تبويب «مكافأة» ← «أولي: 10 نجوم في الإنجليزية»)، اضغط الزر هنا حتى يبدأ العد من جديد.</p>
  <div id="gvz">${readyBoard()?'<button class="ghost" id="gvb">أعطيته النجوم</button>':''}</div></div>
 <div class="panel"><h3>اختبار الصوت</h3><p>اضغط الزر. إذا سمعت أولي يتكلم فالصوت يعمل.</p><button class="go" id="tst">جرّب الصوت</button><p class="muted" id="tsm"></p></div>
 <div class="panel"><h3>اسم طفلك</h3><input type="text" id="nm" placeholder="مثال: سامي" value="${esc(P.name)}"><button class="go" id="svn">حفظ</button></div>
 <div class="panel"><h3>كيف تستخدمونه معًا</h3><ul>
  <li>جلسة قصيرة كل يوم (15–20 دقيقة) أنفع من جلسة طويلة مرة في الأسبوع.</li>
  <li>في المحادثة، اجلس بجانبه: اقرأ أنت سؤال أولي بصوتك، وهو يجيب ويردد الجملة.</li>
  <li>كل درس فيه 4 أنشطة. يُفتح الدرس التالي بعد إنهاء الأربعة، ويُفتح العالم التالي بعد الفوز بتحديه.</li>
  <li>النجوم: 3 بلا أخطاء، 2 لأخطاء قليلة، 1 للمحاولة. يمكن إعادة أي نشاط لرفع النجوم.</li>
  <li>في هذا الجزء التحديات مفعّلة من البداية: ساعة للعب، وإخفاء نص الاستماع، ووقت أقصر في تحدي كل عالم.</li><li>كل جزء من أولي مستقل، وتقدّمه محفوظ وحده على هذا الجهاز.</li>
  <li>يعتمد الصوت على متصفح الجهاز. إذا لم تسمع شيئًا على الآيفون، أطفئ الوضع الصامت وارفع الصوت.</li>
  <li>التقدم محفوظ على هذا الجهاز وهذا المتصفح فقط.</li></ul></div>
 <div class="panel"><div class="switch"><span>فتح كل العوالم والدروس</span><button class="ghost" id="ua">${P.all?'مفتوحة · أقفلها':'افتحها'}</button></div><p class="muted">مفيد إذا كان طفلك يعرف أول هذا الجزء ويريد البدء من عالم أعلى.</p></div>
 <div class="panel"><h3>البدء من جديد</h3><div id="rz"><button class="ghost danger" id="rs">مسح كل التقدم</button></div></div>`);
 $('#svn').onclick=()=>{P.name=$('#nm').value.trim().slice(0,24);save();toast('تم الحفظ')};
 $('#ua').onclick=()=>{P.all=!P.all;save();parents()};
 const gvb=$('#gvb');if(gvb)gvb.onclick=()=>{const n=readyBoard();if(gvb.dataset.armed){P.given=earned();save();toast(`سُجّلت ${n} ${n===1?'نجمة':'نجوم'} كمُعطاة`);parents()}else{gvb.dataset.armed='1';gvb.textContent=`تأكيد: أعطيته ${n}`;gvb.className='go'}};
 $('#tst').onclick=()=>{say("Hello! I am Ollie. Let's learn English together!",{rate:.9});const m=$('#tsm');
  if(!SPEECH){m.textContent='هذا المتصفح لا يدعم الصوت. افتح الرابط في Safari أو Chrome.';return}
  const en=(speechSynthesis.getVoices()||[]).filter(v=>/^en/i.test(v.lang)).length;
  m.textContent=en?'إذا لم تسمع شيئًا: أطفئ الوضع الصامت في الآيفون وارفع صوت الوسائط.':'لم أجد صوتًا إنجليزيًا في الجهاز بعد. انتظر ثواني وجرّب مرة ثانية، أو أضف صوتًا إنجليزيًا من إعدادات الجهاز (تسهيلات الاستخدام ← المحتوى المنطوق ← الأصوات).'};
 $('#rs').onclick=()=>{$('#rz').innerHTML=`<p>هل أنت متأكد؟ ستُمسح كل النجوم.</p><div class="btns"><button class="go" id="yes" style="background:var(--bad);box-shadow:0 5px 0 #8f2226">نعم، امسح</button><button class="ghost" id="no">إلغاء</button></div>`;
  $('#yes').onclick=()=>{P.s={};P.given=0;save();toast('تم مسح التقدم');parents()};$('#no').onclick=parents};
}

/* ---------- confetti ---------- */
function confetti(){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const cols=['#FFBE2E','#27A85A','#2B6FCC','#E0702A','#6447D1','#DD444A'];
 const ps=Array.from({length:110},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6.28,s:5+Math.random()*6,c:cols[Math.random()*6|0]}));
 const end=performance.now()+2600;
 (function f(now){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
  if(now<end)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})(performance.now());
}

document.documentElement.dir='rtl';document.documentElement.lang='ar';
home();
</script>
