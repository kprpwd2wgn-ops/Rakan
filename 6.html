<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: one centered column; worlds stack like toy blocks, each world's lessons wind down a path */
:root{
  --bg:#EDF4F9; --paper:#FFFFFF; --ink:#172636; --muted:#5A6C7D; --line:#D4E1EB;
  --sun:#FFBE2E; --sun-deep:#B37600;
  --good:#1C9F5F; --good-soft:#DDF5E8; --bad:#DD444A; --bad-soft:#FCE4E5;
  --lv:#2E8BC9; --lv-deep:#1C5F8C; --lv-soft:#E0EEF8;
  --f-ui:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;
  --f-en:"Andika","Baloo Bhaijaan 2",Verdana,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
[dir="ltr"]{font-family:var(--f-en)}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.fill{fill:currentColor;stroke:none}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;gap:10px;padding-block:10px;background:var(--bg)}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--paper);box-shadow:0 3px 0 var(--line)}
.iconbtn.ph{visibility:hidden}
.bar-t{unicode-bidi:plaintext;flex:1;min-width:0;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.pill{display:flex;align-items:center;gap:4px;background:var(--paper);padding:6px 12px;border-radius:999px;box-shadow:0 3px 0 var(--line);color:var(--sun-deep);font-weight:800;font-variant-numeric:tabular-nums}
.pill .ico{color:var(--sun)}

/* home */
.hero{display:flex;gap:14px;align-items:center;padding-block:8px 18px}
.owl{font-size:58px;line-height:1;width:84px;height:84px;display:grid;place-items:center;background:var(--paper);border-radius:28px;box-shadow:0 5px 0 var(--line);flex:none}
.hello{font-weight:800;font-size:22px}
.hero h1{font-size:17px;font-weight:700;color:var(--lv-deep)}
.muted{color:var(--muted);font-size:14px}
.worlds{display:flex;flex-direction:column;gap:16px}

owned a bicycle shop in the United States made history. Orville and Wilbur Wright had studied birds for years to understand how they controlled their flight. They built gliders and tested them hundreds of times. Many attempts ended in crashes. Finally, on December 17, 1903, their airplane, the Flyer, stayed in the air for twelve seconds and flew thirty-seven meters. It was the first controlled, powered flight in history. Today, millions of people fly every day, and it all started with two curious brothers who refused to give up.", "rq": [["What business did the brothers own?", "a bicycle shop", "a car factory", "a bakery"], ["What did they study to understand flight?", "birds", "fish", "clouds"], ["How long did the first flight last?", "twelve seconds", "twelve minutes", "one hour"], ["What does the story show?", "Curiosity and persistence lead to success.", "Flying is easy.", "Bicycles are better than planes."]]}, {"en": "Design a Product", "ar": "صمّم منتجًا", "v": "design|يصمم|✏️;customer|زبون|🧑‍🤝‍🧑;feature|ميزة|⭐;test|يختبر|🧪;feedback|ملاحظات|💬;improve|يحسّن|📈", "c": [["Who is your product for?", "It's for students who forget their homework.", "It's for product who is.", "Product is for me who."], ["What is the main feature?", "It reminds you with a light and a sound.", "It is feature main is.", "Feature is a customer."], ["What did people say when they tested it?", "They said it was useful, but the sound was too loud.", "They say it useful was.", "Tested people said me."], ["How will you improve it?", "I'll add a button to change the volume.", "I will improving it yesterday.", "Improve will me."]], "l": "Good designers start by asking questions. Who will use this product? What problem does it solve? Then they draw ideas, build a simple prototype and ask real people to test it.", "lq": [["How do good designers start?", "by asking questions", "by selling", "by building a factory"], ["What do they build after drawing?", "a simple prototype", "a shop", "a big machine"], ["Who tests the prototype?", "real people", "only the designer", "robots"]], "r": "A group of students in Jeddah noticed that their grandparents often forgot to take their medicine. They decided to design a solution. First, they interviewed ten elderly people to understand the problem. They learned that many of them didn't like using phones. So instead of an app, the students designed a simple box with seven compartments, one for each day. A light turns on at the right time, and the box makes a gentle sound. After testing it with their grandparents, they made the buttons bigger because some users had weak eyesight. Their project won first prize at the regional science fair.", "rq": [["What problem did the students notice?", "Grandparents forgot to take their medicine.", "Grandparents couldn't walk.", "Students forgot homework."], ["Why didn't they make an app?", "Many elderly people didn't like using phones.", "Apps are too cheap.", "They couldn't code."], ["What did they change after testing?", "They made the buttons bigger.", "They removed the light.", "They added a camera."], ["What did their project win?", "first prize at the regional science fair", "nothing", "a trip to space"]]}, {"en": "Happy Accidents", "ar": "اكتشافات بالصدفة", "v": "accident|صدفة|🎲;by chance|بالصدفة|🍀;notice|يلاحظ|👀;mold|عفن|🦠;sticky|لزج|🍯;discovery|اكتشاف|💡", "c": [["Was penicillin discovered on purpose?", "No, it was discovered by accident.", "Yes, it was discover on purpose.", "Penicillin discovered me."], ["What does 'by chance' mean?", "It means without planning it.", "It means very carefully.", "It means at night."], ["Why do some discoveries happen by accident?", "Because a scientist notices something unexpected.", "Because scientists never work.", "Because accidents are planned."], ["Have you ever discovered something by accident?", "Yes, I found out that mixing two colors makes a nice new one.", "Yes, I have discover by accident yesterday ago.", "Accident has discovered me."]], "l": "In 1945, an engineer named Percy Spencer was working near a radar machine when he noticed that the chocolate bar in his pocket had melted. This led to the invention of the microwave oven.", "lq": [["What was Percy Spencer working near?", "a radar machine", "an oven", "a fridge"], ["What did he notice?", "His chocolate bar had melted.", "His phone was broken.", "His shoes were wet."], ["What was invented because of this?", "the microwave oven", "the radio", "the refrigerator"]], "r": "In 1928, Alexander Fleming, a Scottish scientist, went on holiday and left some dishes of bacteria on his desk. When he came back, he noticed that a blue-green mold had grown on one of the dishes. Around the mold, the bacteria had died. Many people would have thrown the dish away, but Fleming was curious. He discovered that the mold produced a substance that killed bacteria. He called it penicillin. Years later, other scientists found a way to produce it in large quantities, and penicillin became the first antibiotic. It has saved millions of lives.", "rq": [["Why were the dishes left on his desk?", "He went on holiday.", "He was lazy.", "He forgot his job."], ["What had grown on one dish?", "a blue-green mold", "a flower", "a crystal"], ["What happened to the bacteria around the mold?", "They had died.", "They grew faster.", "They changed color."], ["Why is penicillin important?", "It was the first antibiotic and saved millions of lives.", "It is a type of food.", "It makes plants grow."]]}, {"en": "Smart Homes", "ar": "المنازل الذكية", "v": "sensor|حساس|📡;automatic|تلقائي|🔄;voice assistant|مساعد صوتي|🗣️;control|يتحكم|🎛️;security|أمان|🔒;efficient|موفّر|💡", "c": [["What is a smart home?", "It's a home where devices can be controlled automatically or by phone.", "It's a home that goes to school.", "It's a house made of brains."], ["How can sensors save energy?", "They turn off lights when nobody is in the room.", "They turn on every light all night.", "Sensors eat energy for breakfast."], ["Would you like to live in a smart home?", "Yes, but I'd still want to do some things myself.", "Yes, I would living smart.", "Smart home would like me."], ["What might be a problem with smart homes?", "If the internet stops, some devices might not work.", "They are always perfect.", "There are never any problems."]], "l": "In a smart home, the curtains open automatically when the sun rises. The air conditioner turns on before you arrive home. And if someone rings the doorbell, you can see who it is on your phone, even if you are not at home.", "lq": [["When do the curtains open?", "when the sun rises", "at midnight", "when you shout"], ["When does the air conditioner turn on?", "before you arrive home", "when you leave", "never"], ["What can you see on your phone?", "who rang the doorbell", "the weather in London", "your homework"]], "r": "Smart technology can be especially helpful for people who are elderly or have disabilities. For example, a person who cannot walk easily can turn on lights, lock doors and adjust the temperature using only their voice. Sensors can detect if an elderly person has fallen and automatically send a message to their family. However, experts warn that smart devices collect a lot of personal information. It is important to choose devices from trusted companies, use strong passwords and think carefully about what information we share.", "rq": [["Who can smart technology especially help?", "elderly people and people with disabilities", "only children", "only athletes"], ["What can sensors detect?", "if an elderly person has fallen", "the color of clothes", "bad dreams"], ["What do experts warn about?", "smart devices collect personal information", "they are too cheap", "they are too slow"], ["What advice is given?", "choose trusted companies and use strong passwords", "never use technology", "share all information"]]}], "c": "#27A85A", "d": "#17733C", "s": "#DFF4E7", "rate": 0.9, "games": ["sentence", "spell", "sentence", "memory", "spell", "sentence"]}, {"en": "World Explorers", "ar": "مستكشفو العالم", "sub": "ثقافات وقارات وأشخاص الذين...", "icon": "🧭", "boss": "تحدي الرحالة العظيم", "lessons": [{"en": "Continents and Oceans", "ar": "القارات والمحيطات", "v": "continent|قارة|🌍;ocean|محيط|🌊;equator|خط الاستواء|〰️;population|عدد السكان|👨‍👩‍👧‍👦;border|حدود|🚧;climate zone|منطقة مناخية|🌡️", "c": [["How many continents are there?", "There are seven continents.", "There are seven oceans continents.", "Continents are how many."], ["Which is the largest ocean?", "The Pacific Ocean, which covers about a third of the Earth.", "The Pacific, who is the big.", "Ocean largest is me."], ["Which continent is Saudi Arabia in?", "It's in Asia, in the region that is called the Middle East.", "It's in Europe, near the North Pole.", "Saudi Arabia is a continent."], ["What's the weather like near the equator?", "It's usually hot and often rainy.", "It's always snowy and frozen.", "The equator has no weather."]], "l": "Asia is the largest continent, and it has the biggest population. Antarctica is the coldest continent, and nobody lives there permanently, except scientists who stay for a few months.", "lq": [["Which is the largest continent?", "Asia", "Africa", "Europe"], ["Which is the coldest continent?", "Antarctica", "Asia", "Australia"], ["Who stays in Antarctica?", "scientists, for a few months", "millions of families", "nobody ever"]], "r": "The Arabian Peninsula is the largest peninsula in the world. A peninsula is land that is surrounded by water on three sides. To the west is the Red Sea, to the east is the Arabian Gulf, and to the south is the Arabian Sea. For thousands of years, its location, which connects Asia, Africa and Europe, made it an important center for trade. Spices, incense and textiles that came from India and Africa passed through its ports and deserts on their way to the Mediterranean.", "rq": [["What is a peninsula?", "land surrounded by water on three sides", "an island", "a mountain"], ["What is to the west of the Arabian Peninsula?", "the Red Sea", "the Arabian Gulf", "the Arabian Sea"], ["Why was it an important trade center?", "Its location connects three continents.", "It had many rivers.", "It was very cold."], ["What passed through its ports?", "spices, incense and textiles", "cars", "computers"]]}, {"en": "Ibn Battuta", "ar": "ابن بطوطة", "v": "traveler|رحالة|🎒;voyage|رحلة بحرية|⛵;pilgrimage|حج|🕋;record|يدوّن|📖;distance|مسافة|📏;foreign|أجنبي|🌐", "c": [["Who was Ibn Battuta?", "He was a traveler from Morocco who explored much of the known world.", "He was a pharaoh who built pyramids.", "He was a famous footballer."], ["Why did he start his journey?", "He left home to perform the Hajj in Makkah.", "He wanted to buy a car.", "He was looking for snow."], ["How do we know about his journeys?", "He told his story to a writer, who recorded it in a book.", "He posted videos online.", "Nobody knows anything about him."], ["If you could travel with him, which place would you visit?", "I would visit China, because he said it was amazing.", "I would visit where he was would.", "Him would travel me."]], "l": "Ibn Battuta left his home in Tangier in 1325, when he was twenty-one years old. He planned to be away for about two years, but he traveled for nearly thirty years.", "lq": [["Where was Ibn Battuta's home?", "Tangier", "Cairo", "Baghdad"], ["How old was he when he left?", "twenty-one", "twelve", "forty"], ["How long did he travel?", "nearly thirty years", "two years", "ten years"]], "r": "Ibn Battuta is often called one of the greatest travelers in history. Over three decades, he visited regions that are now more than forty countries, from West Africa to China. He traveled by camel, by horse, on foot and by ship. He survived storms, robbers and illness. In many places he worked as a judge, because he had studied Islamic law. When he finally returned home, the Sultan of Morocco asked a scholar named Ibn Juzayy to write down his stories. The book, known as the Rihla, which means 'The Journey,' is still read today.", "rq": [["How many modern countries did he visit?", "more than forty", "four", "more than four hundred"], ["What job did he do in many places?", "judge", "sailor", "merchant"], ["Who wrote down his stories?", "Ibn Juzayy", "the Sultan", "Ibn Battuta himself"], ["What does 'Rihla' mean?", "The Journey", "The King", "The Sea"]]}, {"en": "Customs and Cultures", "ar": "العادات والثقافات", "v": "custom|عادة|🎎;greet|يحيّي|👋;bow|ينحني|🙇;polite|مهذب|🤝;rude|غير مهذب|😠;tradition|تقليد|🏮", "c": [["How do people greet each other in Japan?", "They usually bow.", "They usually jump.", "Japan greets bow was."], ["Is it polite to arrive late to a dinner in your culture?", "No, it's considered rude to keep people waiting.", "Yes, everyone who arrives late is a hero.", "Dinner is late polite."], ["What is a custom that is special in your country?", "Serving Arabic coffee and dates to guests.", "Serving guests nothing at all.", "Customs are special me."], ["Why is it important to learn about other cultures?", "It helps us understand and respect people who are different from us.", "It's not important at all.", "Cultures are boring."]], "l": "In many Arab countries, guests are served coffee with the right hand. When a guest has had enough, they gently shake the small cup from side to side. This tells the host 'Thank you, no more.'", "lq": [["Which hand is used to serve coffee?", "the right hand", "the left hand", "both hands"], ["How does a guest show they've had enough?", "They shake the cup from side to side.", "They put the cup on their head.", "They leave."], ["What does this gesture mean?", "Thank you, no more.", "More please.", "I'm angry."]], "r": "A gesture that is polite in one country can be rude in another. In many Western countries, people look directly into each other's eyes to show honesty, while in some East Asian cultures, looking down shows respect for older people. In some countries, showing the bottom of your shoe is rude. In Japan, it is polite to slurp your noodles, which shows you are enjoying the food, but this would seem rude in many other places. Travelers who learn these customs before visiting usually find that people are warmer and more welcoming.", "rq": [["What shows honesty in many Western countries?", "looking into people's eyes", "looking down", "bowing"], ["What shows respect in some East Asian cultures?", "looking down", "shouting", "shaking hands"], ["What is polite in Japan?", "slurping noodles", "showing your shoe", "being late"], ["What happens when travelers learn customs?", "People are warmer and more welcoming.", "People ignore them.", "They get lost."]]}, {"en": "Languages of the World", "ar": "لغات العالم", "v": "native|أصلي|🏡;fluent|طليق|🗨️;accent|لهجة|🎙️;bilingual|ثنائي اللغة|🔁;dialect|لهجة محلية|🗺️;translate|يترجم|🔤", "c": [["How many languages are spoken in the world?", "More than seven thousand.", "More than seven.", "Languages speak world."], ["Which language has the most native speakers?", "Mandarin Chinese.", "Klingon.", "Languages that has most."], ["How did you become fluent in English?", "I practiced every day, read stories and wasn't afraid of mistakes.", "I became fluent by sleeping.", "English became me fluent."], ["What would you do if you couldn't understand the language of a country you visited?", "I'd use gestures, a translation app and a big smile.", "I'd shout louder in my language.", "I would language not."]], "l": "Arabic is spoken by more than four hundred million people and is one of the six official languages of the United Nations. It is written from right to left and has twenty-eight letters.", "lq": [["How many people speak Arabic?", "more than four hundred million", "forty thousand", "four billion"], ["What is Arabic one of?", "the six official languages of the UN", "the newest languages", "the only language in Asia"], ["How many letters does Arabic have?", "twenty-eight", "twenty-six", "thirty-two"]], "r": "Many English words actually came from Arabic. When scholars in Europe translated Arabic books on science and mathematics in the Middle Ages, they borrowed many words. 'Algebra' comes from 'al-jabr.' 'Coffee' comes from 'qahwa.' 'Sugar' comes from 'sukkar,' and 'cotton' from 'qutn.' Even 'zero' traveled from the Arabic 'sifr.' Languages are like rivers that mix as they flow. When you learn a new language, you often discover that it is more connected to your own than you thought.", "rq": [["When did English borrow many Arabic words?", "when scholars translated Arabic books", "last year", "in 2000"], ["Where does 'coffee' come from?", "qahwa", "café", "coffa"], ["Which Arabic word gave us 'zero'?", "sifr", "sukkar", "qutn"], ["What are languages compared to?", "rivers that mix as they flow", "walls", "mountains"]]}, {"en": "Wonders of the World", "ar": "عجائب الدنيا", "v": "wonder|عجيبة|🌟;monument|نصب تذكاري|🗽;ruins|أطلال|🏚️;carved|منحوت|🪨;architecture|عمارة|🏛️;visitor|زائر|📸", "c": [["Which wonder of the world would you most like to see?", "The Great Wall of China, which is thousands of kilometers long.", "The Great Wall, who is long.", "Wonder would see me."], ["Where is Petra?", "It's in Jordan; it's a city that was carved into pink rock.", "It's in the Arctic under the ice.", "Petra is a kind of cake."], ["Why should visitors not write on ancient monuments?", "Because it damages history that belongs to everyone.", "Because the monuments will write back.", "It's fine to write anywhere."], ["What makes a building a 'wonder'?", "Its beauty, its size or how difficult it was to build.", "Only its color.", "Nothing, every building is the same."]], "l": "Hegra, in AlUla, was Saudi Arabia's first UNESCO World Heritage Site. It has more than one hundred tombs that were carved into sandstone by the Nabataeans about two thousand years ago.", "lq": [["What was Hegra?", "Saudi Arabia's first UNESCO World Heritage Site", "a modern mall", "a mountain in Asir"], ["How many tombs does it have?", "more than one hundred", "five", "one thousand"], ["Who carved them?", "the Nabataeans", "the Romans", "the Egyptians"]], "r": "The Taj Mahal in India is one of the most famous buildings in the world. It was built in the seventeenth century by the emperor Shah Jahan in memory of his wife, Mumtaz Mahal. About twenty thousand workers built it over more than twenty years. It is made of white marble, which changes color during the day: pink in the morning, white at noon and golden in the moonlight. The building is perfectly symmetrical, and its gardens are divided into four parts, which represent the gardens of paradise.", "rq": [["Who built the Taj Mahal?", "the emperor Shah Jahan", "Mumtaz Mahal", "the British"], ["Why was it built?", "in memory of his wife", "as a palace for him", "as a school"], ["What is it made of?", "white marble", "red brick", "gold"], ["What color is it in the morning?", "pink", "golden", "blue"]]}, {"en": "Travel Problems", "ar": "مشكلات السفر", "v": "delayed|متأخر|⏰;cancelled|ملغى|❌;luggage|أمتعة|🧳;lost|مفقود|❓;complain|يشتكي|🗣️;refund|استرداد المال|💵", "c": [["Excuse me, my flight has been cancelled. What should I do?", "Please go to desk five, where they will rebook you.", "Please you go desk five to.", "Cancelled flight should me."], ["My suitcase hasn't arrived. Can you help me?", "Of course. Can you describe it, please?", "Of course. Suitcase arrive describe.", "Help suitcase me."], ["How long has the train been delayed?", "It's been delayed for forty minutes.", "It been delayed forty.", "The train delayed me forty."], ["What would you do if you lost your passport abroad?", "I'd contact my country's embassy immediately.", "I'd just stay there forever.", "Passport would lose me."]], "l": "Attention, please. Flight SV 412 to Cairo has been delayed by two hours because of bad weather. Passengers are asked to wait in the lounge. Free drinks are offered at the café.", "lq": [["Where is the flight going?", "to Cairo", "to London", "to Riyadh"], ["Why has it been delayed?", "because of bad weather", "because the pilot is late", "because of a strike"], ["What is offered at the café?", "free drinks", "free tickets", "free food"]], "r": "Dear Customer Service, I am writing to complain about my recent trip. My flight from Riyadh to Kuala Lumpur, which was supposed to leave at 9 a.m., was delayed for six hours. Nobody explained the reason, and we were not offered any food. When I arrived, I discovered that one of my bags had been lost. I have attached the reference number that was given to me at the airport. I would like my bag to be returned as soon as possible, and I would appreciate compensation for the delay. Yours faithfully, Hind Al-Harbi.", "rq": [["Why is Hind writing?", "to complain about her trip", "to thank the airline", "to book a flight"], ["How long was the flight delayed?", "six hours", "nine hours", "one hour"], ["What happened when she arrived?", "One of her bags had been lost.", "Her passport was taken.", "Her friend was waiting."], ["What does she want?", "her bag returned and compensation", "a new passport", "a free holiday"]]}], "c": "#0F9488", "d": "#086158", "s": "#DBF3F0", "rate": 0.93, "games": ["spell", "sentence", "memory", "spell", "pop", "sentence"]}, {"en": "News Studio", "ar": "استوديو الأخبار", "sub": "الكلام المنقول: قال إنّ...", "icon": "📰", "boss": "تحدي رئيس التحرير", "lessons": [{"en": "Reported Speech", "ar": "الكلام المنقول", "v": "said|قال|💬;told|أخبر|🗣️;asked|سأل|❓;explained|شرح|📋;promised|وعد|🤞;announced|أعلن|📢", "c": [["What did the teacher say?", "She said that the test would be on Monday.", "She said the test is be Monday.", "The teacher said me test."], ["What did your friend ask you?", "He asked me if I wanted to play chess.", "He asked me do you want chess.", "Friend asked chess me."], ["What did your father promise?", "He promised that he would take us to the beach.", "He promised he take us beach will.", "Promise was father."], ["What did the news announce?", "It announced that schools would be closed because of the storm.", "It announces schools closed was.", "News announced me."]], "l": "Yesterday, the coach told the team that they had played very well. He said that he was proud of them. He also explained that they needed to practice passing before the next match.", "lq": [["What did the coach tell the team?", "They had played very well.", "They had lost.", "They should stop."], ["How did he feel?", "proud", "angry", "bored"], ["What did they need to practice?", "passing", "running", "shooting"]], "r": "Last week, our class interviewed the school nurse for the school newspaper. Sara asked her how long she had worked at the school. She said she had worked there for eight years. Faisal asked what the most common problem was. She told us that most students who came to her had headaches because they didn't drink enough water. She explained that we should drink at least six glasses a day. At the end, she said she hoped our article would help students stay healthy. We promised that we would put her advice on the front page.", "rq": [["How long had the nurse worked at the school?", "eight years", "six years", "one year"], ["What was the most common problem?", "headaches from not drinking enough water", "broken legs", "colds"], ["How many glasses should students drink?", "at least six", "two", "twenty"], ["What did the students promise?", "to put her advice on the front page", "to visit her daily", "to become nurses"]]}, {"en": "Headlines", "ar": "العناوين الرئيسية", "v": "headline|عنوان رئيسي|🗞️;article|مقال|📄;reporter|مراسل|🎤;source|مصدر|🔗;breaking news|خبر عاجل|🚨;journalist|صحفي|✍️", "c": [["What is a headline?", "It's the title of a news story, usually short and catchy.", "It's a line on your head.", "It's the last page of a book."], ["Why are headlines often short?", "Because they need to grab the reader's attention quickly.", "Because reporters are lazy.", "Because paper is expensive."], ["What should a good journalist always check?", "That the information comes from reliable sources.", "That the story is as funny as possible.", "Nothing, just write anything."], ["If you were a reporter, what would you report on?", "I'd report on young people who do amazing things in our community.", "I would report on reporter.", "News would report me."]], "l": "Here are today's headlines. Local school wins national robotics competition. New metro line opens in Riyadh. Scientists discover new species of lizard in the Empty Quarter.", "lq": [["What did the local school win?", "a national robotics competition", "a football match", "a spelling bee"], ["What opened in Riyadh?", "a new metro line", "a new zoo", "a new airport"], ["What was discovered?", "a new species of lizard", "a dinosaur bone", "oil"]], "r": "A news article usually answers six important questions, often called the five Ws and one H: Who? What? Where? When? Why? and How? The most important information comes in the first paragraph, which is called the lead. Details come later. This structure is called the 'inverted pyramid,' because the biggest and most important part is at the top. Journalists use it because many readers only read the beginning of an article. A good article is also fair: it presents different points of view and separates facts from opinions.", "rq": [["What are the six questions called?", "the five Ws and one H", "the six secrets", "the news rules"], ["What is the first paragraph called?", "the lead", "the head", "the end"], ["Why do journalists use the inverted pyramid?", "Many readers only read the beginning.", "It looks nice.", "It is shorter."], ["What does a fair article do?", "presents different points of view", "only gives one opinion", "hides the facts"]]}, {"en": "Interviews", "ar": "المقابلات", "v": "interview|مقابلة|🎙️;question|سؤال|❔;guest|ضيف|🧑‍💼;opinion|رأي|💭;experience|خبرة|🧳;answer|يجيب|✅", "c": [["Good morning. Thank you for joining us. Could you introduce yourself?", "Good morning. My name is Dr. Lama, and I'm a marine biologist.", "Morning good. Me name Lama doctor biology.", "Introduce is yourself me."], ["What inspired you to study the ocean?", "I fell in love with the sea when I went diving as a child.", "I inspire ocean study is.", "The ocean studied inspired."], ["What advice would you give children who want to become scientists?", "Ask lots of questions and never stop being curious.", "Don't ask any questions.", "Become scientist advice would."], ["Thank you for your time!", "It was a pleasure. Thank you for having me.", "No, time is mine.", "Thank time you."]], "l": "In the interview, the astronaut said that the hardest part of being in space was sleeping, because there is no up or down. She said that the view of Earth was the most beautiful thing she had ever seen.", "lq": [["What was the hardest part for the astronaut?", "sleeping", "eating", "talking"], ["Why was it hard?", "There is no up or down.", "It was too noisy.", "It was too hot."], ["What was the most beautiful thing she had seen?", "the view of Earth", "the moon", "the stars"]], "r": "A good interviewer prepares carefully. Before the interview, they research the guest's life and work. They write open questions, which start with words like 'how,' 'why' or 'what,' because these encourage long, interesting answers. Closed questions, which can be answered with 'yes' or 'no,' give less information. During the interview, a good interviewer listens carefully and asks follow-up questions. For example, if the guest says, 'That was the hardest year of my life,' the interviewer might ask, 'Why was it so hard?' Listening is just as important as asking.", "rq": [["What does a good interviewer do before the interview?", "research the guest", "nothing", "buy a gift"], ["What are open questions?", "questions that start with how, why or what", "questions with yes or no answers", "questions about the weather"], ["What is a follow-up question?", "a question based on the guest's answer", "the first question", "a question for the audience"], ["What is as important as asking?", "listening", "talking loudly", "writing fast"]]}, {"en": "Fact or Opinion?", "ar": "حقيقة أم رأي؟", "v": "fact|حقيقة|📏;opinion|رأي|💭;prove|يثبت|✔️;believe|يعتقد|🤔;fake|مزيف|🎭;reliable|موثوق|🛡️", "c": [["Is 'Riyadh is the capital of Saudi Arabia' a fact or an opinion?", "It's a fact, because it can be proved.", "It's an opinion, because I believe it.", "Riyadh is a fact opinion."], ["Is 'Football is the best sport' a fact or an opinion?", "It's an opinion, because people feel differently.", "It's a fact that everyone agrees with.", "Football is a proven."], ["How can you check if news is fake?", "Check if reliable sources report the same story.", "Believe everything you see online.", "Share it first, then check."], ["What words often show an opinion?", "Words like 'I think,' 'best' and 'beautiful.'", "Words like 'two' and 'Monday.'", "Opinion words are facts."]], "l": "Fact: Water boils at one hundred degrees Celsius at sea level. Opinion: Hot chocolate is the most delicious drink in winter. Facts can be checked; opinions show how someone feels.", "lq": [["At what temperature does water boil at sea level?", "one hundred degrees Celsius", "fifty degrees", "zero degrees"], ["Which statement is an opinion?", "Hot chocolate is the most delicious drink.", "Water boils at one hundred degrees.", "Both are facts."], ["What can facts be?", "checked", "felt", "changed by feelings"]], "r": "Every day, false stories spread online, sometimes faster than true ones. A fake photo of a shark swimming on a flooded highway has appeared after almost every big storm for years. To avoid being tricked, ask yourself a few questions. Who wrote this? Is it from a trusted news source? Does the headline seem designed to make me angry or scared? Can I find the same story on other reliable websites? You can also do a reverse image search to see where a photo first appeared. Thinking before sharing is one of the most important skills in the digital age.", "rq": [["What does the text say about false stories?", "They sometimes spread faster than true ones.", "They never spread.", "They are always funny."], ["What fake photo appears after storms?", "a shark on a flooded highway", "a flying car", "a giant cat"], ["What can a reverse image search show?", "where a photo first appeared", "who is in your family", "the weather"], ["What is an important skill in the digital age?", "thinking before sharing", "sharing everything quickly", "never reading"]]}, {"en": "Weather Report", "ar": "النشرة الجوية", "v": "humid|رطب|💦;sandstorm|عاصفة رملية|🌪️;visibility|مدى الرؤية|👁️;warning|تحذير|⚠️;expected|متوقع|📅;rainfall|هطول الأمطار|🌧️", "c": [["What is the forecast for this weekend?", "Thunderstorms are expected in the south, with heavy rainfall.", "Thunderstorms is expect.", "Weekend forecasts me."], ["Why was a warning issued?", "Because a sandstorm will reduce visibility on the roads.", "Because the weather was too nice.", "Warnings are issued for fun."], ["What should drivers do in a sandstorm?", "Slow down, turn on their lights and keep their distance.", "Drive faster to escape it.", "Close their eyes."], ["What's it like in Jeddah in summer?", "It's very hot and humid.", "It's freezing and snowy.", "Jeddah is summer."]], "l": "Good evening. Tomorrow will be hot across most of the Kingdom, with temperatures reaching forty-six degrees in the east. Dust storms are expected in the north, reducing visibility. The Asir mountains will be cooler, with a chance of rain in the afternoon.", "lq": [["What temperature is expected in the east?", "forty-six degrees", "twenty-six degrees", "thirty degrees"], ["What is expected in the north?", "dust storms", "snow", "heavy rain"], ["Where will it be cooler?", "the Asir mountains", "the east", "the desert"]], "r": "Weather forecasting has changed enormously. Long ago, people predicted the weather by watching the sky, the wind and animals. Today, meteorologists use satellites that orbit the Earth, radars that detect rain, and thousands of weather stations that measure temperature, pressure and humidity. All this data is fed into supercomputers, which run complex models to predict how the atmosphere will change. A five-day forecast today is as accurate as a one-day forecast was forty years ago. Still, weather is chaotic, so forecasts always include some uncertainty.", "rq": [["How did people predict weather long ago?", "by watching the sky, wind and animals", "with satellites", "with phones"], ["What do radars detect?", "rain", "earthquakes", "animals"], ["How accurate is a five-day forecast today?", "as accurate as a one-day forecast forty years ago", "perfectly accurate", "not accurate at all"], ["Why do forecasts include uncertainty?", "Weather is chaotic.", "Meteorologists are lazy.", "Computers are slow."]]}, {"en": "Sports News", "ar": "الأخبار الرياضية", "v": "tournament|بطولة|🏆;champion|بطل|👑;defeat|يهزم|⚔️;draw|تعادل|🤝;record|رقم قياسي|📊;fans|المشجعون|📣", "c": [["What was the result of last night's match?", "It was a two-two draw.", "It was a two draw two was.", "Match resulted me."], ["Who won the tournament?", "Al Hilal won after defeating their rivals in the final.", "Al Hilal winned the final.", "Tournament won who."], ["Has anyone ever broken that record?", "No, it has stood for more than ten years.", "No, it has stand ten years.", "Record has broken me."], ["The reporter said the stadium was full. How many fans were there?", "She said there were about sixty thousand fans.", "She say there is sixty fans.", "Fans were reporter."]], "l": "In tennis news, the young champion won her third tournament this year. She defeated the world number two in straight sets. She told reporters that she was dedicating the win to her coach.", "lq": [["How many tournaments has she won this year?", "three", "two", "one"], ["Whom did she defeat?", "the world number two", "her coach", "the world number one"], ["To whom did she dedicate the win?", "her coach", "her family", "her fans"]], "r": "Sports reporting is not only about scores. The best sports stories are about people. When reporters write about a match, they describe the key moments, but they also explain what the result means for the team, the players and the fans. They interview players after the game to understand how they felt. Many famous sports stories are about comebacks: teams that were losing badly but never gave up. Readers love these stories because they teach lessons that go far beyond sport, such as determination, teamwork and respect.", "rq": [["What are the best sports stories about?", "people", "only scores", "the weather"], ["Why do reporters interview players?", "to understand how they felt", "to sell tickets", "to change the score"], ["What are comeback stories about?", "teams that were losing but never gave up", "teams that always win", "teams that quit"], ["Why do readers love these stories?", "They teach lessons beyond sport.", "They are short.", "They are about money."]]}], "c": "#E0702A", "d": "#9E4614", "s": "#FCE9DC", "rate": 0.96, "games": ["sentence", "memory", "spell", "pop", "sentence", "spell"]}, {"en": "Money Market", "ar": "سوق المال", "sub": "الادخار والإنفاق والتجارة الصغيرة", "icon": "💰", "boss": "تحدي رجل الأعمال الصغير", "lessons": [{"en": "Saving and Spending", "ar": "الادخار والإنفاق", "v": "save|يدخر|🐷;spend|ينفق|💸;budget|ميزانية|📊;goal|هدف|🎯;afford|يستطيع تحمل التكلفة|✅;pocket money|مصروف|🪙", "c": [["What do you do with your pocket money?", "I save half of it and spend the rest.", "I spend it yesterday tomorrow.", "Pocket money does me."], ["What are you saving for?", "I'm saving for a new bike that costs six hundred riyals.", "I saving bike for six.", "Saving is for me."], ["If you saved twenty riyals a week, how long would it take?", "It would take thirty weeks.", "It will take thirty weak.", "Twenty would take me."], ["Why is a budget useful?", "It helps you plan your money so you don't run out.", "It makes you spend everything quickly.", "A budget is a kind of bird."]], "l": "Yara gets fifty riyals a month. She puts ten riyals in her charity box, saves twenty riyals and spends twenty on things she needs. She calls this her 'three jars' plan.", "lq": [["How much does Yara get a month?", "fifty riyals", "twenty riyals", "one hundred riyals"], ["How much does she save?", "twenty riyals", "ten riyals", "fifty riyals"], ["What does she call her plan?", "the three jars plan", "the money tree", "the piggy bank"]], "r": "When Hamad got two hundred riyals for Eid, his first idea was to spend it all on a new video game. But his father suggested something different. 'What if you divided it?' he asked. 'Spend some now, save some for something bigger, and give some to people who need it.' Hamad thought about it. He spent eighty riyals on a book and a ball, saved one hundred riyals toward a tablet he wanted, and gave twenty riyals to a charity for orphans. Months later, when he finally bought the tablet, he said it felt much better than anything he had bought quickly.", "rq": [["How much did Hamad get for Eid?", "two hundred riyals", "eighty riyals", "one hundred riyals"], ["What did his father suggest?", "dividing the money", "spending all of it", "giving it all away"], ["What was Hamad saving for?", "a tablet", "a video game", "a bike"], ["How did he feel when he bought the tablet?", "much better than buying quickly", "sad", "nothing special"]]}, {"en": "Needs and Wants", "ar": "الحاجات والرغبات", "v": "need|حاجة|🍞;want|رغبة|🎮;necessary|ضروري|❗;luxury|رفاهية|💎;priority|أولوية|🥇;impulse|اندفاع|⚡", "c": [["Is a new phone a need or a want?", "Usually a want, unless your old one is broken.", "It's a need that I want need.", "Phone needs me."], ["What are basic needs?", "Food, water, shelter, clothes and health care.", "Video games and sweets.", "Needs are luxury."], ["What is impulse buying?", "Buying something suddenly without thinking.", "Buying something after planning for months.", "Buying with your feet."], ["What would you do if you had only fifty riyals for the week?", "I'd buy what I need first, then think about wants.", "I'd buy a luxury and nothing else.", "Fifty would need me."]], "l": "Before you buy something, ask yourself three questions: Do I really need it? Can I afford it? Will I still want it next week? If the answer to any question is no, wait.", "lq": [["How many questions should you ask?", "three", "five", "one"], ["What is the second question?", "Can I afford it?", "Is it red?", "Who has one?"], ["What should you do if any answer is no?", "wait", "buy it twice", "borrow money"]], "r": "Shops and advertisers use clever tricks to make us buy more. Sweets are often placed near the cash register, where children wait with their parents. Prices like 9.99 look much cheaper than 10, even though the difference is tiny. 'Limited time offer' messages make us feel we must buy immediately. Online, apps show us products that are similar to things we have already looked at. Knowing these tricks helps us become smarter shoppers who make decisions with our heads, not just our feelings.", "rq": [["Where are sweets often placed?", "near the cash register", "on the top shelf", "outside"], ["Why do prices like 9.99 work?", "They look cheaper than 10.", "They are much cheaper.", "They are lucky numbers."], ["What do 'limited time offer' messages make us feel?", "We must buy immediately.", "We should wait.", "We are not welcome."], ["What does knowing these tricks help us become?", "smarter shoppers", "sellers", "advertisers"]]}, {"en": "A Lemonade Stand", "ar": "كشك عصير الليمون", "v": "profit|ربح|📈;cost|تكلفة|🧾;customer|زبون|🙋;price|سعر|🏷️;sell|يبيع|🛒;loss|خسارة|📉", "c": [["How much does it cost to make one cup?", "About one riyal, including lemons, sugar and cups.", "It costs about cup one.", "Cost makes me."], ["How much will you sell each cup for?", "Three riyals, so we make a profit of two riyals.", "Three riyals, so we make a loss.", "Sell will cup me."], ["What would happen if nobody bought your lemonade?", "We would make a loss because we already spent money.", "We would make a lot of profit.", "Lemonade would buy us."], ["How can you attract more customers?", "Make a colorful sign and smile at people.", "Shout at them angrily.", "Hide the stand."]], "l": "Last Saturday, Jana and her brother sold lemonade in front of their house. They spent thirty riyals on supplies and sold forty cups for two riyals each. They made a profit of fifty riyals.", "lq": [["How much did they spend on supplies?", "thirty riyals", "forty riyals", "fifty riyals"], ["How many cups did they sell?", "forty", "thirty", "fifty"], ["What was their profit?", "fifty riyals", "eighty riyals", "thirty riyals"]], "r": "When Ziyad started his small business selling homemade cookies at school events, his first day was a disaster. He made one hundred cookies but sold only twenty, because he set the price too high and his table was in a corner where nobody walked. Instead of giving up, he asked his customers for feedback. They said the cookies were delicious but too expensive. The next time, he lowered the price, moved to the entrance and offered free tastes. He sold everything in an hour. Ziyad learned that mistakes are lessons, if you are willing to listen and change.", "rq": [["How many cookies did he sell on the first day?", "twenty", "one hundred", "eighty"], ["Why did he sell so few?", "The price was too high and the table was in a corner.", "The cookies were bad.", "It was raining."], ["What did his customers say?", "delicious but too expensive", "too small", "too sweet"], ["What did Ziyad learn?", "Mistakes are lessons if you listen and change.", "Business is impossible.", "Never ask customers."]]}, {"en": "Banks", "ar": "البنوك", "v": "account|حساب|🏦;deposit|يودع|📥;withdraw|يسحب|📤;interest|فائدة/عائد|➕;loan|قرض|🤝;card|بطاقة|💳", "c": [["Why do people keep money in a bank?", "Because it's safer than keeping it at home.", "Because banks eat money.", "Money keeps people in banks."], ["What does 'withdraw' mean?", "To take money out of your account.", "To draw a picture with money.", "To put money in."], ["Should you share your card PIN with anyone?", "No, never. It must stay private.", "Yes, share it with everyone online.", "PIN is sharing me."], ["What is a loan?", "Money that you borrow and must pay back.", "Money that you find on the street.", "A gift that you keep forever."]], "l": "When you deposit money in a bank, the bank keeps it safe. Banks use this money to give loans to other people and businesses. This helps people buy homes and start companies.", "lq": [["What does the bank do with deposited money?", "keeps it safe and gives loans", "spends it on parties", "throws it away"], ["Who gets loans?", "people and businesses", "only children", "nobody"], ["What do loans help people do?", "buy homes and start companies", "go to sleep", "play games"]], "r": "Thousands of years ago, there was no money. People traded goods directly: a farmer might exchange wheat for a pair of shoes. This is called barter. The problem was that the shoemaker might not want wheat! So people started using items that everyone valued, like salt, shells and later gold and silver coins. Paper money came much later, first in China. Today, much of our money is digital. We pay with cards and phones, and the money moves between bank accounts as numbers on computers. But the idea is the same: money is a tool that makes trading easier.", "rq": [["What is barter?", "exchanging goods directly", "using credit cards", "saving money"], ["What was the problem with barter?", "The other person might not want your goods.", "It was too fast.", "It was illegal."], ["Where did paper money first appear?", "China", "Egypt", "Spain"], ["What is money, according to the text?", "a tool that makes trading easier", "the most important thing in life", "a kind of paper art"]]}, {"en": "Advertisements", "ar": "الإعلانات", "v": "advert|إعلان|📺;slogan|شعار|💬;brand|علامة تجارية|🏷️;persuade|يقنع|🗣️;target|يستهدف|🎯;honest|صادق|✅", "c": [["What is the purpose of an advert?", "To persuade people to buy something.", "To teach math.", "To make people sleep."], ["What makes a slogan memorable?", "It's short, catchy and easy to repeat.", "It's very long and boring.", "It has no words at all."], ["Do adverts always tell the whole truth?", "Not always. They often show only the good side.", "Yes, always, every detail.", "Adverts are always lying cats."], ["If you made an advert for your school, what would your slogan be?", "'Where curious minds grow.'", "'School is school was.'", "Slogan would me."]], "l": "This new juice is made from one hundred percent fresh oranges. There is no added sugar. Buy two bottles and get the third one free! Offer ends Sunday.", "lq": [["What is the juice made from?", "fresh oranges", "apples", "sugar and water"], ["Is sugar added?", "No.", "Yes, a lot.", "Only a little."], ["What is the offer?", "Buy two, get the third free.", "Half price.", "Free delivery."]], "r": "Advertisers carefully choose their target audience. An advert for toys appears during children's programs, while an advert for cars appears during the evening news. Many adverts use famous people, because we tend to trust people we admire. Others use music and bright colors to create positive feelings. Some adverts even show a product being used by happy families, suggesting that buying it will make us happy too. Understanding these techniques doesn't mean we should never buy anything. It means we can make our own decisions instead of letting adverts decide for us.", "rq": [["When do toy adverts appear?", "during children's programs", "during the news", "at midnight"], ["Why do adverts use famous people?", "We tend to trust people we admire.", "They are cheap.", "They are funny."], ["What do music and bright colors create?", "positive feelings", "sadness", "fear"], ["What does understanding these techniques help us do?", "make our own decisions", "buy everything", "stop watching TV forever"]]}, {"en": "Giving and Charity", "ar": "العطاء والصدقة", "v": "donate|يتبرع|🎁;charity|جمعية خيرية|🤲;generous|كريم|💛;orphan|يتيم|🧒;volunteer|يتطوع|🙋;zakat|زكاة|🕌", "c": [["Why is giving important in Islam?", "Because it helps people in need and purifies our wealth.", "Because it makes us poorer forever.", "Giving is not important."], ["What is zakat?", "A required charity that Muslims give from their savings each year.", "A type of food that is eaten in Ramadan.", "A famous building in Makkah."], ["How can children help if they don't have much money?", "They can volunteer their time or donate clothes and books.", "They can't help at all.", "They can take money from others."], ["How did you feel when you helped someone?", "I felt happy and proud.", "I feel was helped.", "Helped felt me."]], "l": "Every Ramadan, Rayan's school organizes a food basket campaign. Students bring rice, oil, dates and sugar. Last year, they prepared two hundred baskets for families in need.", "lq": [["When is the campaign organized?", "every Ramadan", "every summer", "every week"], ["What do students bring?", "rice, oil, dates and sugar", "toys", "clothes only"], ["How many baskets did they prepare last year?", "two hundred", "twenty", "two thousand"]], "r": "Scientists have discovered something interesting: giving makes people happier. In one study, people were given some money. Half were told to spend it on themselves, and half were told to spend it on someone else. At the end of the day, those who spent money on others reported feeling happier. Other studies show that people who volunteer regularly often feel less stressed and more satisfied with life. This matches a lesson that many cultures and religions have taught for centuries: the hand that gives is better than the hand that takes.", "rq": [["What did scientists discover?", "Giving makes people happier.", "Saving makes people happier.", "Money doesn't matter."], ["Who felt happier in the study?", "those who spent money on others", "those who spent on themselves", "nobody"], ["How do regular volunteers often feel?", "less stressed and more satisfied", "more tired", "angry"], ["What old lesson does this match?", "The hand that gives is better than the hand that takes.", "Keep everything for yourself.", "Never trust strangers."]]}], "c": "#2B6FCC", "d": "#174788", "s": "#DFEAFA", "rate": 0.99, "games": ["memory", "spell", "pop", "sentence", "spell", "sentence"]}, {"en": "Brain Gym", "ar": "نادي العقول", "sub": "التفكير والنقاش وإبداء الرأي", "icon": "🧠", "boss": "تحدي العبقري", "lessons": [{"en": "How We Learn", "ar": "كيف نتعلم", "v": "practice|تمرين|🔁;review|يراجع|📖;mistake|خطأ|❌;understand|يفهم|💡;skill|مهارة|🛠️;improve|يتحسن|📈", "c": [["What's the best way to remember new words?", "Use them in sentences and review them over several days.", "Read them once and never again.", "Words remember me."], ["Is it bad to make mistakes when learning?", "No, mistakes show us what we need to improve.", "Yes, mistakes mean you are not smart.", "Mistakes are learning me."], ["Do you learn better by reading, listening or doing?", "I learn best by doing things myself.", "I learning doing by.", "Reading learns me."], ["What would you do if you didn't understand something in class?", "I'd ask the teacher to explain it in a different way.", "I'd pretend I understood.", "I would understand not class."]], "l": "Scientists say that we remember things better when we review them several times with breaks in between. This is called spaced repetition. Studying for ten minutes every day is better than studying for one hour once a week.", "lq": [["When do we remember things better?", "when we review them with breaks", "when we study once", "when we sleep in class"], ["What is this called?", "spaced repetition", "speed reading", "memory loss"], ["Which is better?", "ten minutes every day", "one hour once a week", "never studying"]], "r": "For a long time, people believed that intelligence was fixed: you were either smart or not. But scientists now know that the brain is like a muscle. When you learn something new and practice it, connections between brain cells become stronger. A psychologist named Carol Dweck called this idea a 'growth mindset.' Students with a growth mindset believe they can get better with effort. When they face a hard problem, they say 'I can't do this yet,' instead of 'I can't do this.' Research shows that this small change in thinking can make a big difference in how much students learn.", "rq": [["What did people believe for a long time?", "Intelligence was fixed.", "The brain was a muscle.", "Everyone was a genius."], ["What happens when you practice something?", "Connections between brain cells get stronger.", "The brain gets smaller.", "Nothing."], ["Who described the 'growth mindset'?", "Carol Dweck", "Ibn Sina", "Edison"], ["What do students with a growth mindset say?", "I can't do this yet.", "I'll never do this.", "This is too easy."]]}, {"en": "Problem Solving", "ar": "حل المشكلات", "v": "problem|مشكلة|🧩;solution|حل|🔑;option|خيار|🔀;step|خطوة|👣;decide|يقرر|⚖️;result|نتيجة|🏁", "c": [["What's the first step in solving a problem?", "Understand exactly what the problem is.", "Panic and give up.", "Solve it before understanding it."], ["Why should you think of several solutions?", "Because the first idea isn't always the best.", "Because one idea is always enough.", "Solutions think me."], ["How do you decide which solution is best?", "Compare the advantages and disadvantages of each one.", "Choose the longest one.", "Close your eyes and point."], ["What would you do if your solution didn't work?", "I'd learn from it and try another option.", "I'd blame someone else.", "I would solution not work."]], "l": "Our class had a problem: the classroom was too noisy during group work. We suggested three solutions: using quiet signals, making smaller groups, and working in the library. We tried quiet signals first, and it worked!", "lq": [["What was the problem?", "The classroom was too noisy.", "There were no books.", "It was too cold."], ["How many solutions did they suggest?", "three", "one", "five"], ["Which solution did they try first?", "quiet signals", "smaller groups", "the library"]], "r": "Engineers use a process called design thinking to solve problems. First, they empathize: they try to understand the people who have the problem. Second, they define the problem clearly. Third, they brainstorm many ideas without judging them. Fourth, they build a simple prototype of the best idea. Finally, they test it and use the results to improve it. Then the cycle often starts again. Design thinking has been used to create everything from better hospital beds to apps for farmers. The secret is to focus on people and not to be afraid of trying, failing and trying again.", "rq": [["What is the first step of design thinking?", "empathize", "test", "build"], ["What happens in the brainstorming step?", "They suggest many ideas without judging.", "They choose one idea immediately.", "They stop working."], ["What do they do after testing?", "use the results to improve it", "throw it away", "sell it"], ["What is the secret of design thinking?", "focus on people and keep trying", "work alone", "never fail"]]}, {"en": "Debates", "ar": "المناظرات", "v": "agree|يوافق|👍;disagree|يعارض|👎;argument|حجة|📌;point of view|وجهة نظر|👁️;evidence|دليل|📊;respect|يحترم|🤝", "c": [["Do you think homework should be banned?", "I disagree. I think some homework helps us practice, but it shouldn't be too much.", "I disagree is homework banned.", "Homework thinks me."], ["How do you politely disagree with someone?", "I'd say: 'I see your point, but I think...'", "I'd say: 'You are completely stupid.'", "Disagree polite me."], ["What makes an argument strong?", "Clear reasons and evidence that supports them.", "Shouting very loudly.", "Repeating the same sentence."], ["Why is it important to listen to other points of view?", "Because we might learn something and change our minds.", "Because others are always wrong.", "It isn't important."]], "l": "In today's debate, one team argued that school uniforms are good because they make everyone equal. The other team argued that students should be able to express themselves through their clothes. In the end, the judges said both teams had strong arguments.", "lq": [["What was the debate about?", "school uniforms", "homework", "video games"], ["Why did one team support uniforms?", "They make everyone equal.", "They are colorful.", "They are cheap."], ["What did the judges say?", "Both teams had strong arguments.", "One team was terrible.", "Nobody won."]], "r": "Should children have their own mobile phones? This is a popular debate topic. Those who agree say that phones keep children safe, because parents can contact them at any time. They add that phones can be useful for learning and that children need to learn how to use technology responsibly. Those who disagree argue that phones can be distracting, can reduce sleep and can expose children to online dangers. They suggest that children could use a simple phone without internet until they are older. Most experts say the answer depends on the child's age, maturity and the rules the family sets.", "rq": [["Why do some people think children should have phones?", "Phones keep them safe and are useful for learning.", "Phones are cheap.", "Phones are toys."], ["What problem with phones is mentioned?", "They can reduce sleep.", "They are too heavy.", "They are boring."], ["What alternative is suggested?", "a simple phone without internet", "no phone ever", "two phones"], ["What do most experts say?", "It depends on age, maturity and family rules.", "Every child needs one.", "Phones should be banned."]]}, {"en": "Teamwork", "ar": "العمل الجماعي", "v": "cooperate|يتعاون|🤝;role|دور|🎭;leader|قائد|⭐;responsible|مسؤول|✅;share ideas|يشارك الأفكار|💬;conflict|خلاف|⚡", "c": [["What role do you usually take in a team?", "I'm usually the one who organizes the tasks.", "I usually role team the.", "Team takes me role."], ["What should a team do when members disagree?", "Listen to each other and look for a solution together.", "Stop talking forever.", "Let the loudest person decide everything."], ["What makes a good leader?", "Someone who listens, encourages others and is responsible.", "Someone who shouts orders.", "Someone who does nothing."], ["Have you ever worked on a team project that went well?", "Yes, our group built a model volcano and won first place.", "Yes, I have work project went.", "Project worked me."]], "l": "Geese fly in a V shape. The bird at the front works the hardest. When it gets tired, it moves to the back, and another goose takes its place. By working together, geese can fly much farther than one goose alone.", "lq": [["What shape do geese fly in?", "a V shape", "a circle", "a straight line"], ["What happens when the front goose gets tired?", "It moves to the back.", "It lands.", "It flies faster."], ["What is the benefit of working together?", "They can fly much farther.", "They are faster alone.", "They get lost."]], "r": "In 2018, twelve boys from a football team and their coach were trapped in a flooded cave in Thailand. The rescue was one of the most difficult in history. More than ten thousand people helped: divers from many countries, engineers, doctors, soldiers and volunteers who cooked food for the rescuers. Some pumped water out of the cave; others searched for openings in the mountain. After eighteen days, all thirteen were brought out safely. The rescue showed the world what people can achieve when they work together for a common goal.", "rq": [["Where were the boys trapped?", "in a flooded cave", "on a mountain", "on a boat"], ["How many people helped?", "more than ten thousand", "twelve", "one hundred"], ["How long did the rescue take?", "eighteen days", "eighteen hours", "two months"], ["What did the rescue show?", "what people can achieve together", "that caves are fun", "that football is dangerous"]]}, {"en": "Memory Tricks", "ar": "حيل الذاكرة", "v": "remember|يتذكر|🧠;forget|ينسى|🫥;technique|أسلوب|🛠️;connect|يربط|🔗;visualize|يتخيل بصريًا|👁️;rhyme|قافية|🎶", "c": [["How can you remember a long list of things?", "Imagine putting each item in a different room of your house.", "Read it once very fast.", "Lists remember me."], ["What is a mnemonic?", "A trick that helps you remember information, like a rhyme or a sentence.", "A type of computer.", "A kind of animal."], ["Why do songs help us remember?", "Because rhythm and rhyme make words easier to recall.", "Because songs are louder than words.", "Songs don't help at all."], ["What do you do when you forget something important?", "I write reminders on sticky notes.", "I forgot what I do.", "Forget does me."]], "l": "To remember the order of the planets, you can use this sentence: My Very Excellent Mother Just Served Us Nachos. Each word starts with the same letter as a planet: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune.", "lq": [["What does the sentence help you remember?", "the order of the planets", "the days of the week", "the alphabet"], ["What does 'Mother' stand for?", "Mars", "Mercury", "Moon"], ["Which planet is last?", "Neptune", "Jupiter", "Earth"]], "r": "Memory champions can remember the order of a whole deck of fifty-two cards in less than a minute. How do they do it? Most of them use a technique called the 'memory palace,' which has been used since ancient Greece. They imagine walking through a place they know well, like their home. They place each piece of information at a specific spot, and they make the images funny or strange so they are easier to remember. To recall the information, they simply 'walk' through the palace again in their mind. The technique works because our brains are very good at remembering places and pictures.", "rq": [["How fast can memory champions remember a deck of cards?", "in less than a minute", "in one hour", "in one day"], ["What is the technique called?", "the memory palace", "the card game", "the quick look"], ["Why do they make the images funny or strange?", "They are easier to remember.", "They are prettier.", "They are shorter."], ["Why does the technique work?", "Our brains are good at remembering places and pictures.", "Cards are easy.", "It is magic."]]}, {"en": "Creative Thinking", "ar": "التفكير الإبداعي", "v": "creative|مبدع|🎨;original|أصيل|🆕;brainstorm|عصف ذهني|🌪️;curious|فضولي|🔍;perspective|منظور|🔭;combine|يدمج|➕", "c": [["How many uses can you think of for a paperclip?", "A bookmark, a phone stand, a zipper pull and a hook!", "Paperclip uses me.", "I can't think of anything, ever."], ["Where do creative ideas come from?", "Often from combining two ideas that already exist.", "Only from very rich people.", "Ideas fall from the sky every Tuesday."], ["What would you do if you got stuck on a creative project?", "I'd take a walk, then look at it from a different perspective.", "I'd quit forever.", "Stuck would project me."], ["Do you think anyone can be creative?", "Yes, creativity is a skill that grows with practice.", "No, only artists.", "Creative think me can."]], "l": "During a brainstorm, there are no bad ideas. Write down everything, even ideas that seem silly. Sometimes a silly idea leads to a brilliant one. Only after the brainstorm should you choose the best ideas.", "lq": [["Are there bad ideas during a brainstorm?", "No.", "Yes, many.", "Only one."], ["What can a silly idea lead to?", "a brilliant one", "nothing", "trouble"], ["When should you choose the best ideas?", "after the brainstorm", "before it starts", "never"]], "r": "George de Mestral, a Swiss engineer, went for a walk with his dog in 1941. When they came home, both his trousers and the dog's fur were covered in small, sticky seeds called burrs. Most people would have just pulled them off, but de Mestral was curious. He looked at a burr under a microscope and saw hundreds of tiny hooks that caught onto loops in fabric and fur. He spent years copying this design, and the result was Velcro. This kind of creativity, which takes ideas from nature, is called biomimicry. Today, engineers copy nature to design everything from fast trains to cool buildings.", "rq": [["What covered de Mestral's trousers?", "burrs", "mud", "snow"], ["What did he see under the microscope?", "tiny hooks", "tiny eyes", "tiny wings"], ["What did he invent?", "Velcro", "the zipper", "glue"], ["What is biomimicry?", "taking design ideas from nature", "making music", "growing plants"]]}], "c": "#6447D1", "d": "#3E2896", "s": "#ECE7FB", "rate": 1.0, "games": ["spell", "pop", "sentence", "spell", "sentence", "memory"]}];

function say(text,o={}){
 if(!SPEECH){toast('الصوت غير مدعوم في هذا المتصفح. جرّب Safari أو Chrome.');return}
 const S=speechSynthesis;if(!voice)pickVoice();
 const parts=(String(text).match(/[^.!?]+[.!?]*['"]?/g)||[String(text)]).map(x=>x.trim()).filter(Boolean);
 const rate=o.rate||(LV[ctx.l]&&LV[ctx.l].rate)||.9;
 const go=()=>{spkQ=parts.map(t=>{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=rate;u.pitch=o.pitch||1;u.volume=1;return u});
  spkQ.forEach(u=>{try{S.speak(u)}catch(e){}});try{if(S.paused)S.resume()}catch(e){}};
 clearTimeout(spkT);
 try{if(S.speaking||S.pending){S.cancel();spkT=setTimeout(go,120)}else go()}catch(e){}
}

/* ---------- conversation ---------- */
function actConv(){
 const L=cur(),token=RUN;let t=0,mis=0;
 h(actTitle('محادثة'),lesson,`<div class="pane"><p class="tip">استمع إلى أولي، اختر الرد الصحيح، ثم قله بصوتك.</p><div class="chat" id="chat" dir="ltr"></div><div class="opts" id="opts" dir="ltr"></div></div>`);
 const chat=$('#chat'),opts=$('#opts');
 function bubble(who,text){const d=document.createElement('div');d.className='bub '+who;
  d.innerHTML=`<span class="av">${who==='bot'?BIRD(36):'🧒'}</span><p>${esc(text)}</p><button class="spk sm" aria-label="استمع" data-say="${esc(text)}"${who==='kid'?' data-pitch="1.3"':''}>${icon('spk')}</button>`;
  chat.appendChild(d);}
 function turn(){
  if(token!==RUN)return;const[q,...o]=L.c[t];bubble('bot',q);say(q);
  opts.innerHTML=shuffle(o.map((x,k)=>({x,k}))).map(z=>`<button class="opt" data-k="${z.k}">${esc(z.x)}</button>`).join('');
  opts.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
   if(b.dataset.k==='0'){ding();bubble('kid',o[0]);say(o[0],{pitch:1.3});
    opts.innerHTML=`<div class="repeat" dir="rtl"><p>🎤 الآن قلها بصوتك:</p><p dir="ltr" style="font-size:19px;font-weight:700">${esc(o[0])}</p><div class="btns"><button class="ghost" data-say="${esc(o[0])}" data-pitch="1.3">اسمعها مرة أخرى</button><button class="go" id="nx">${t<L.c.length-1?'قلتها! التالي':'قلتها! إنهاء'}</button></div></div>`;
    opts.scrollIntoView({behavior:'smooth',block:'end'});
    $('#nx').onclick=()=>{t++;t<L.c.length?turn():finish('c',starsFrom(mis,0,1))};
   }else if(!b.classList.contains('wrong')){b.classList.add('wrong');mis++;buzz()}
  });
 }
 turn();
}

function gListen(L,done){

function gUnscr(L,done){
 const ws=shuffle(V(L).filter(v=>/^[a-z]+$/i.test(v.en)&&v.en.length<=11)).slice(0,5);let r=0,mis=0;
 function round(){const v=ws[r],word=v.en.toLowerCase();let letters,tries=0;do{letters=shuffle(word.split(''))}while(letters.join('')===word&&++tries<8);let ans=[];
  G(`<p class="tip">رتّب الحروف لتكتب الكلمة (${r+1} من ${ws.length})</p><div class="clue"><span class="big-em">${v.em}</span><span>${esc(v.ar)}</span><button class="spk" aria-label="استمع" data-say="${esc(v.en)}">${icon('spk')}</button></div><div class="slots" dir="ltr" id="sl"></div><div class="tiles" dir="ltr" id="tl"></div><div class="btns"><button class="ghost" id="clr">امسح</button></div>`);
  function draw(){$('#sl').innerHTML=letters.map((_,n)=>`<span class="slot">${ans[n]!==undefined?letters[ans[n]]:''}</span>`).join('');
   $('#tl').innerHTML=letters.map((ch,n)=>`<button class="ltr" data-n="${n}" ${ans.includes(n)?'disabled':''}>${ch}</button>`).join('');
   $$('#tl .ltr').forEach(b=>b.onclick=()=>{ans.push(+b.dataset.n);draw();if(ans.length===letters.length)check()})}
  function check(){if(ans.map(n=>letters[n]).join('')===word){ding();say(v.en);$('#sl').classList.add('ok');setTimeout(()=>{++r<ws.length?round():done(starsFrom(mis,0,2))},900)}
   else{buzz();mis++;$('#sl').classList.add('shake');setTimeout(()=>{ans=[];draw();$('#sl').classList.remove('shake')},600)}}
  $('#clr').onclick=()=>{ans=[];draw()};draw();}
 round();
}

function gSpell(L,done){
 const ws=shuffle(V(L).filter(v=>/^[a-z' ]+$/i.test(v.en))).slice(0,5);let r=0,mis=0;
 function round(){const v=ws[r];let hint=0,wrong=0;
  G(`<p class="tip">اسمع الكلمة واكتبها بالإنجليزية (${r+1} من ${ws.length})</p><div class="clue"><span class="big-em">${v.em}</span><span>${esc(v.ar)}</span><button class="spk" aria-label="استمع" data-say="${esc(v.en)}">${icon('spk')}</button></div><input id="sp" class="inp" dir="ltr" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="type here"><p class="hintline" dir="ltr" id="hl"></p><div class="btns"><button class="ghost" id="hb">تلميح</button><button class="go" id="ck">تحقّق</button></div>`);
  setTimeout(()=>say(v.en),300);const inp=$('#sp');
  const showHint=()=>{$('#hl').textContent=v.en.slice(0,hint)+' _'.repeat(Math.max(0,v.en.length-hint))};
  $('#hb').onclick=()=>{if(hint<v.en.length){hint++;mis+=.5;showHint()}};
  const ck=()=>{if(inp.value.trim().toLowerCase()===v.en.toLowerCase()){ding();say(v.en);inp.classList.add('right');setTimeout(()=>{++r<ws.length?round():done(starsFrom(mis,0,2))},800)}
   else{buzz();mis++;wrong++;inp.classList.add('shake');setTimeout(()=>inp.classList.remove('shake'),400);if(wrong>=2){hint=v.en.length;showHint();toast('انظر للكلمة واكتبها')}}};
  $('#ck').onclick=ck;inp.onkeydown=e=>{if(e.key==='Enter')ck()};}
 round();
}

function gSentence(L,done){
 const ss=L.c.map(c=>c[1]).filter(x=>x.split(' ').length<=14);let r=0,mis=0;
 function round(){const s=ss[r],toks=s.split(' ');let order,tries=0;do{order=shuffle(toks.map((_,n)=>n))}while(order.every((n,k)=>n===k)&&++tries<8);let ans=[];
  G(`<p class="tip">رتّب الكلمات لتكوّن جملة صحيحة (${r+1} من ${ss.length})</p><button class="ghost" data-say="${esc(s)}">اسمع الجملة</button><div class="sent" dir="ltr" id="sa"></div><div class="tiles" dir="ltr" id="st"></div><div class="btns"><button class="ghost" id="clr">امسح</button></div>`);
  function draw(){$('#sa').innerHTML=ans.map((n,k)=>`<button class="tok" data-k="${k}">${esc(toks[n])}</button>`).join('');
   $('#st').innerHTML=order.map(n=>`<button class="tok" data-n="${n}" ${ans.includes(n)?'disabled':''}>${esc(toks[n])}</button>`).join('');
   $$('#sa .tok').forEach(b=>b.onclick=()=>{ans.splice(+b.dataset.k,1);draw()});
   $$('#st .tok').forEach(b=>b.onclick=()=>{ans.push(+b.dataset.n);draw();if(ans.length===toks.length)check()})}
  function check(){if(ans.map(n=>toks[n]).join(' ')===s){ding();say(s);$('#sa').classList.add('ok');setTimeout(()=>{++r<ss.length?round():done(starsFrom(mis,0,2))},1300)}
   else{buzz();mis++;$('#sa').classList.add('shake');setTimeout(()=>{$('#sa').classList.remove('shake')},500)}}
  $('#clr').onclick=()=>{ans=[];draw()};draw();}
 round();
}

function gPop(L,done,token){
 const all=V(L),rounds=shuffle([...all,...shuffle(all).slice(0,2)]);let r=0,mis=0;const speed=34+ctx.l*12,extra=(PART>1||ctx.l>=2)?3:2;
 G(`<p class="tip">اضغط الفقاعة التي تحمل اسم الصورة قبل أن تطير!</p><div class="target" id="tg"></div><div class="field" id="fd" dir="ltr"></div><p class="muted" id="pr" style="text-align:center"></p>`);
 const fd=$('#fd');
 function next(){++r<rounds.length?round():done(starsFrom(mis,0,2))}
 function round(){if(token!==RUN)return;const v=rounds[r];
  $('#tg').innerHTML=`<span class="big-em">${v.em}</span><span>${esc(v.ar)}</span>`;$('#pr').textContent=`${r+1} / ${rounds.length}`;
  fd.innerHTML='';const opts=shuffle([v,...shuffle(all.filter(x=>x.en!==v.en)).slice(0,extra)]);
  const W=fd.clientWidth,H=fd.clientHeight,lane=W/opts.length,lift=shuffle(opts.map((_,n)=>n));let over=false,last=performance.now();
  const bs=opts.map((o,n)=>{const b=document.createElement('button');b.className='bubble';b.textContent=o.en;fd.appendChild(b);const bw=b.offsetWidth;
   const z={b,o,x:Math.max(4,Math.min(W-bw-4,lane*n+(lane-bw)/2)),y:H+10+lift[n]*55,alive:true};
   b.onclick=()=>{if(over||!z.alive)return;if(o.en===v.en){over=true;b.classList.add('popped');ding();say(v.en);setTimeout(next,650)}else{z.alive=false;b.classList.add('miss');mis++;buzz()}};return z});
  function step(now){if(token!==RUN||over)return;const dt=Math.min(.05,(now-last)/1000);last=now;let gone=false;
   bs.forEach(z=>{z.y-=speed*dt;z.b.style.transform=`translate(${z.x}px,${z.y}px)`;if(z.o.en===v.en&&z.y<-60)gone=true});
   if(gone){over=true;mis++;buzz();toast(`الكلمة كانت: ${v.en}`);setTimeout(next,700);return}
   requestAnimationFrame(step)}
  requestAnimationFrame(step);}
 round();
}
