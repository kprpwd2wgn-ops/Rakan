<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: one centered column; worlds stack like toy blocks, each world's lessons wind down a path */
:root{
  --bg:#EDF4F9; --paper:#FFFFFF; --ink:#172636; --muted:#5A6C7D; --line:#D4E1EB;
  --sun:#FFBE2E; --sun-deep:#B37600;
  --good:#1C9F5F; --good-soft:#DDF5E8; --bad:#DD444A; --bad-soft:#FCE4E5;
  --lv:#2E8BC9; --lv-deep:#1C5F8C; --lv-soft:#E0EEF8;
  --f-ui:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;
  --f-en:"Andika","Baloo Bhaijaan 2",Verdana,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
[dir="ltr"]{font-family:var(--f-en)}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.fill{fill:currentColor;stroke:none}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;gap:10px;padding-block:10px;background:var(--bg)}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--paper);box-shadow:0 3px 0 var(--line)}
.iconbtn.ph{visibility:hidden}
.bar-t{unicode-bidi:plaintext;flex:1;min-width:0;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.pill{display:flex;align-items:center;gap:4px;background:var(--paper);padding:6px 12px;border-radius:999px;box-shadow:0 3px 0 var(--line);color:var(--sun-deep);font-weight:800;font-variant-numeric:tabular-nums}
.pill .ico{color:var(--sun)}

/* home */
.hero{display:flex;gap:14px;align-items:center;padding-block:8px 18px}
.owl{font-size:58px;line-height:1;width:84px;height:84px;display:grid;place-items:center;background:var(--paper);border-radius:28px;box-shadow:0 5px 0 var(--line);flex:none}
.hello{font-weight:800;font-size:22px}
.hero h1{font-size:17px;font-weight:700;color:var(--lv-deep)}
.muted{color:var(--muted);font-size:14px}
.worlds{display:flex;flex-direction:column;gap:16px}
.world{display:flex;align-items:center;gap:14px;text-align:start;background:var(--paper);border-radius:22px;padding:14px;box-shadow:0 6px 0 var(--lv-deep);border:2px solid var(--lv);transition:transform .12s}
.world:active{transform:translateY(4px);box-shadow:0 2px 0 var(--lv-deep)}
.w-art{font-size:40px;width:66px;height:66px;border-radius:20px;background:var(--lv-soft);display:grid;place-items:center;flex:none}
.w-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.w-txt b{font-size:19px}
.w-txt i{font-style:normal;color:var(--lv-deep);font-weight:700;font-size:14px}
.w-txt small{color:var(--muted);font-size:13px}
.w-num{font-weight:800;color:var(--lv-deep);font-size:13px;position:absolute}
.prog{height:8px;background:var(--lv-soft);border-radius:9px;overflow:hidden;margin-block:4px 2px}
.prog span{display:block;height:100%;background:var(--lv);border-radius:9px}
.locked{filter:grayscale(1);opacity:.55}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.ghost{background:var(--paper);border-radius:14px;padding:10px 14px;font-weight:700;box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.ghost:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.go{background:var(--lv);color:#fff;border-radius:14px;padding:11px 18px;font-weight:800;box-shadow:0 5px 0 var(--lv-deep)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--lv-deep)}
.go:disabled{opacity:.45}

/* level path */
.lv-hero{display:flex;gap:14px;align-items:center;background:var(--lv);color:#fff;border-radius:24px;padding:16px;margin-block:4px 22px;box-shadow:0 6px 0 var(--lv-deep)}
.lv-art{font-size:46px;width:72px;height:72px;border-radius:22px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.04em;opacity:.9}
.lv-hero h1{font-size:24px}
.path{position:relative;display:flex;flex-direction:column;gap:18px;padding-block:6px}
.path::before{content:"";position:absolute;inset-block:30px;inset-inline-start:50%;border-inline-start:4px dashed var(--line)}
.node{position:relative;display:flex;align-items:center;gap:12px;text-align:start;width:min(100%,290px)}
.pos0{margin-inline-start:0}.pos1{margin-inline-start:18%}.pos2{margin-inline-start:34%}.pos3{margin-inline-start:12%}
.disc{width:72px;height:72px;border-radius:50%;background:var(--lv);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:800;box-shadow:0 6px 0 var(--lv-deep);flex:none;border:4px solid var(--paper)}
.node.done .disc{background:var(--sun);color:var(--ink);box-shadow:0 6px 0 var(--sun-deep)}
.node.locked .disc{background:#B8C4CE;box-shadow:0 6px 0 #8E9BA6}
.nlab{background:var(--paper);border-radius:16px;padding:8px 12px;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;min-width:0}
.nlab b{font-size:16px}
.nlab small{color:var(--muted)}
.nst{display:flex;align-items:center;gap:3px;color:var(--sun-deep);font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.nst .ico{width:15px;height:15px;color:var(--sun)}
.node.boss .disc{width:86px;height:86px;background:#1F2A37;color:var(--sun);box-shadow:0 6px 0 #000}
.node.boss .disc .ico{width:38px;height:38px}

/* lesson */
.les-h{padding-block:6px 14px}
.les-h h1{font-size:28px;color:var(--lv-deep)}
.vocab{display:flex;gap:10px;overflow-x:auto;padding-block:4px 12px;margin-bottom:10px;scrollbar-width:thin}
.vw{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--paper);border-radius:16px;padding:10px 12px;min-width:92px;box-shadow:0 4px 0 var(--line)}
.vw .e{font-size:30px;line-height:1.1}
.vw b{font-family:var(--f-en);font-size:15px}
.vw small{color:var(--muted);font-size:12px}
.sec-t{font-weight:800;font-size:15px;color:var(--muted);margin-block:6px 10px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:start;background:var(--paper);border-radius:20px;padding:14px;border:2px solid var(--lv-soft);box-shadow:0 5px 0 var(--lv-soft)}
.act:active{transform:translateY(3px)}
.act .ai{width:46px;height:46px;border-radius:14px;background:var(--lv-soft);color:var(--lv-deep);display:grid;place-items:center}
.act .ai .ico{width:26px;height:26px}
.act b{font-size:17px}
.act small{color:var(--muted);font-family:var(--f-en);font-size:13px}
.stars{display:flex;gap:2px}
.stars .ico{width:18px;height:18px;color:#D3DCE3}
.stars .on{color:var(--sun)}

/* activity panes */
.pane{display:flex;flex-direction:column;gap:14px}
.tip{background:var(--lv-soft);color:var(--lv-deep);border-radius:14px;padding:10px 14px;font-weight:600;font-size:15px}
.chat{display:flex;flex-direction:column;gap:10px;min-height:120px}
.bub{display:flex;align-items:flex-end;gap:8px;max-width:92%}
.bub p{background:var(--paper);border-radius:18px 18px 18px 4px;padding:10px 14px;font-size:18px;box-shadow:0 3px 0 var(--line);min-width:0}
.bub.kid{align-self:flex-end;flex-direction:row-reverse}
.bub.kid p{background:var(--lv);color:#fff;border-radius:18px 18px 4px 18px;box-shadow:0 3px 0 var(--lv-deep)}
.av{font-size:30px;line-height:1;flex:none}
.spk{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--lv-soft);color:var(--lv-deep);flex:none}
.spk.sm{width:34px;height:34px}
.spk.sm .ico{width:18px;height:18px}
.opts,.q-o{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-family:var(--f-en);font-size:17px;box-shadow:0 4px 0 var(--line)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.right{background:var(--good-soft)!important;border-color:var(--good)!important;box-shadow:0 4px 0 var(--good)!important}
.wrong{background:var(--bad-soft)!important;border-color:var(--bad)!important;box-shadow:0 4px 0 var(--bad)!important;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .4s}
.repeat{background:var(--paper);border:2px dashed var(--lv);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns>*{flex:1}
.player{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.play{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--lv);color:#fff;border-radius:18px;padding:14px 20px;font-weight:800;font-size:18px;box-shadow:0 5px 0 var(--lv-deep)}
.play .ico{width:28px;height:28px}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 var(--lv-deep)}
.text{background:var(--paper);border-radius:18px;padding:16px;font-size:20px;line-height:1.75;box-shadow:0 4px 0 var(--line);text-align:left}
.w{border-radius:6px;cursor:pointer}
.w:active{background:var(--sun)}
.q{background:var(--paper);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 0 var(--line)}
.q.ok{outline:2px solid var(--good)}
.q-h{display:flex;gap:10px;align-items:center;font-size:18px;font-weight:700}

/* games */
.g-head{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.g-head span{font-variant-numeric:tabular-nums;color:var(--muted)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{display:flex;flex-direction:column;gap:10px}
.tile{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:10px;font-size:17px;box-shadow:0 4px 0 var(--line);min-height:54px}
.tile.em{font-size:30px;line-height:1}
.tile.em.big{font-size:44px;min-height:92px}
.tile.sel{border-color:var(--lv);box-shadow:0 4px 0 var(--lv);background:var(--lv-soft)}
.tile.gone{visibility:hidden}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{aspect-ratio:3/4;max-width:100%;border-radius:14px;background:var(--lv);color:#fff;display:grid;place-items:center;box-shadow:0 4px 0 var(--lv-deep);font-size:28px;font-weight:800;padding:4px}
.card .front{display:none}
.card.up{background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.card.up .front{display:block}
.card.up .back{display:none}
.card .front.en{font-size:14px;word-break:break-word;line-height:1.2}
.card.got{background:var(--good-soft);border-color:var(--good)}
.clue{display:flex;align-items:center;justify-content:center;gap:14px;background:var(--paper);border-radius:18px;padding:12px;box-shadow:0 4px 0 var(--line);font-weight:700;font-size:18px}
.big-em{font-size:52px;line-height:1}
.slots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;min-height:52px}
.slot{width:40px;height:48px;border-radius:10px;background:var(--paper);border-bottom:4px solid var(--lv);display:grid;place-items:center;font-size:24px;font-weight:700;font-family:var(--f-en)}
.slots.ok .slot{border-color:var(--good);background:var(--good-soft)}
.tiles{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.ltr,.tok{min-width:46px;height:50px;padding:0 12px;border-radius:12px;background:var(--sun);color:var(--ink);font-family:var(--f-en);font-size:22px;font-weight:700;box-shadow:0 4px 0 var(--sun-deep)}
.tok{font-size:17px;height:44px}
.ltr:disabled,.tok:disabled{opacity:.2}
.sent{display:flex;flex-wrap:wrap;gap:8px;min-height:64px;background:var(--paper);border-radius:16px;padding:10px;border:2px dashed var(--line);align-content:flex-start}
.sent .tok{background:var(--lv);color:#fff;box-shadow:0 4px 0 var(--lv-deep)}
.sent.ok{border-color:var(--good);background:var(--good-soft)}
.inp{width:100%;font-family:var(--f-en);font-size:26px;text-align:center;padding:12px;border-radius:14px;border:3px solid var(--line);background:var(--paper);color:var(--ink)}
.hintline{text-align:center;font-size:22px;letter-spacing:.2em;color:var(--lv-deep);min-height:30px}
.target{display:flex;align-items:center;justify-content:center;gap:12px;font-weight:700;font-size:18px}
.field{position:relative;height:340px;border-radius:20px;overflow:hidden;background:linear-gradient(var(--lv-soft),var(--paper));border:2px solid var(--line)}
.bubble{position:absolute;left:0;top:0;padding:10px 14px;border-radius:999px;background:var(--paper);border:3px solid var(--lv);font-family:var(--f-en);font-size:15px;font-weight:700;white-space:nowrap;box-shadow:inset -4px -6px 0 var(--lv-soft)}
.bubble.popped{background:var(--good);color:#fff;border-color:var(--good);transition:opacity .5s;opacity:0}
.bubble.miss{background:var(--bad-soft);border-color:var(--bad);opacity:.5}

/* boss */
.boss-head{display:flex;align-items:center;gap:10px;justify-content:space-between;font-weight:800}
.boss-head .ico{color:var(--sun-deep);width:28px;height:28px}
.timer{height:12px;border-radius:9px;background:var(--line);overflow:hidden}
.timer span{display:block;height:100%;width:100%;background:var(--sun)}
.bprompt{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--paper);border-radius:20px;padding:16px;box-shadow:0 4px 0 var(--line);text-align:center;font-weight:700}
.ar-word{font-size:34px;font-weight:800;color:var(--lv-deep)}
.intro{background:var(--paper);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 5px 0 var(--line)}
.intro ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}

/* result */
.result{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding-block:24px}
.result .bigstars{display:flex;gap:8px}
.result .bigstars .ico{width:64px;height:64px;color:#D3DCE3;animation:pop .5s backwards}
.result .bigstars .on{color:var(--sun)}
.result .bigstars .ico:nth-child(2){animation-delay:.15s}.result .bigstars .ico:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(0)}}
.result h2{font-size:30px}
.result .btns{width:100%;flex-direction:column}

/* words + parents */
.wl{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-bottom:22px}
.wl .vw{min-width:0}
.panel{background:var(--paper);border-radius:20px;padding:16px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.panel h3{font-size:18px}
.panel ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.panel input[type=text]{font:inherit;font-size:18px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700}
.danger{color:var(--bad);border-color:var(--bad-soft)}
.link{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 var(--sun);border:2px solid var(--sun);margin-bottom:18px}
.link .big{font-size:30px;font-weight:800;color:var(--sun-deep);font-variant-numeric:tabular-nums;min-width:40px;text-align:center}
.link small{display:block;color:var(--muted);font-size:13px}
.prog.sun{background:#FFF1CC}.prog.sun span{background:var(--sun)}
a.go{display:inline-block;text-align:center;text-decoration:none}
.gift{background:var(--sun);color:var(--ink);font-weight:800;padding:10px 16px;border-radius:14px;box-shadow:0 4px 0 var(--sun-deep)}
.owl svg{display:block}
.partb{display:inline-block;background:var(--lv-soft);color:var(--lv-deep);font-weight:800;font-size:13px;padding:2px 10px;border-radius:999px;margin-block:2px}
.result a.go{width:100%}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;z-index:20;max-width:calc(100% - 32px);text-align:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:15}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.mem{grid-template-columns:repeat(3,1fr)}.pos2{margin-inline-start:22%}}

/* ===== added with the new games, the daily challenge and the sticker album ===== */
.owl{cursor:pointer}
.owl.hop{animation:hop .5s}
@keyframes hop{30%{transform:translateY(-10px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
/* something is being read aloud */
.speaking{outline:3px solid var(--sun);outline-offset:2px;animation:pulse 1s infinite}
@keyframes pulse{50%{outline-color:transparent}}
.sn{border-radius:6px;transition:background .2s;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sn.on{background:#FFE9A6;box-shadow:0 0 0 3px #FFE9A6}

/* home: daily challenge, shortcuts, parts */
.daily{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:linear-gradient(135deg,#F9813A,#E4532A);color:#fff;border-radius:22px;padding:14px;box-shadow:0 6px 0 #A63A19;margin-bottom:16px}
.daily:active{transform:translateY(4px);box-shadow:0 2px 0 #A63A19}
.daily.done{background:linear-gradient(135deg,#2DB866,#1C9F5F);box-shadow:0 6px 0 #14713F}
.daily.done:active{box-shadow:0 2px 0 #14713F}
.d-ic{font-size:32px;line-height:1;width:58px;height:58px;border-radius:18px;background:rgba(255,255,255,.24);display:grid;place-items:center;flex:none}
.d-t{flex:1;min-width:0;display:flex;flex-direction:column}
.d-t b{font-size:19px}
.d-t small{font-size:13px}
.d-n{display:flex;flex-direction:column;align-items:center;background:rgba(255,255,255,.24);border-radius:16px;padding:6px 10px;flex:none}
.d-n b{font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.d-n small{font-size:11px;white-space:nowrap}
.tiles4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.tile4{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;background:var(--paper);border-radius:16px;padding:10px 2px 8px;box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.tile4:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tile4 span{font-size:26px;line-height:1.15}
.tile4 b{font-size:13px;line-height:1.3}
.tile4 .dot{position:absolute;top:-7px;inset-inline-end:-5px;min-width:22px;height:22px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-style:normal;font-weight:800;font-size:12px;line-height:22px;font-variant-numeric:tabular-nums}
.parts{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:24px}
.parts span{flex-basis:100%;text-align:center;color:var(--muted);font-weight:700;font-size:14px}
.parts a,.parts b{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:800;text-decoration:none;background:var(--paper);color:var(--lv-deep);box-shadow:0 3px 0 var(--line);font-variant-numeric:tabular-nums}
.parts b{background:var(--lv);color:#fff;box-shadow:0 3px 0 var(--lv-deep)}

/* lesson: more games */
.acts+.sec-t{margin-top:24px}
.xg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.xb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;text-align:start;background:var(--paper);border-radius:14px;padding:8px 10px;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);min-height:54px}
.xb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.xb .xe{font-size:22px;line-height:1}
.xb b{font-size:14px;flex:1;min-width:0;line-height:1.3}
.xb .stars .ico{width:13px;height:13px}

/* letter boxes for long words */
.slots.long .slot{width:26px;height:40px;font-size:19px}
.slot.gap{background:none;border-bottom-color:transparent;width:12px}
.slots.words{gap:8px 18px}
.wgrp{display:flex;gap:6px}

/* true or false */
.tfc{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--paper);border-radius:22px;padding:18px;box-shadow:0 5px 0 var(--line);text-align:center}
.tfc .big-em{font-size:64px}
.tfw{font-family:var(--f-en);font-size:30px;line-height:1.2;color:var(--lv-deep)}
.tfb{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf{border-radius:18px;padding:16px 10px;font-size:20px;font-weight:800;color:#fff;border:2px solid transparent}
.tf.yes{background:var(--good);box-shadow:0 5px 0 #14713F}
.tf.no{background:var(--bad);box-shadow:0 5px 0 #8f2226}
.tf:active{transform:translateY(3px)}
.tf.right,.tf.wrong{color:var(--ink)}
.fixline{text-align:center;font-weight:700;min-height:28px;font-size:17px}
.fixline b{font-family:var(--f-en);color:var(--lv-deep)}

/* hide and seek */
.bushes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;background:linear-gradient(#CDEBFF,#E6F6DF 70%);border-radius:20px;padding:14px 10px 10px;border:2px solid var(--line)}
.bush{position:relative;height:116px;overflow:hidden;border-radius:14px}
.bush-art{position:absolute;left:0;right:0;bottom:0;width:100%;height:64px;z-index:1;pointer-events:none}

  l:"Metals such as copper are good conductors because electricity can flow through them easily. Rubber, plastic and wood are insulators. That's why electricians wear rubber gloves and use tools with plastic handles.",
  lq:[["Which metal is mentioned as a good conductor?","copper","gold","iron"],["Which materials are insulators?","rubber, plastic and wood","copper and silver","water and metal"],["Why do electricians wear rubber gloves?","Rubber is an insulator.","Rubber is warm.","Rubber is a conductor."]],
  r:"In the 1880s, two inventors had a famous rivalry that was later called the 'War of the Currents.' Thomas Edison promoted direct current, or DC, which flows in one direction. Nikola Tesla, together with businessman George Westinghouse, promoted alternating current, or AC, which changes direction many times per second. AC had a big advantage: it could be sent over long distances much more efficiently. Eventually, AC won, and it is still used to deliver electricity to our homes. However, DC has made a comeback: batteries, phones, laptops and solar panels all use direct current.",
  rq:[["What was the 'War of the Currents'?","a rivalry between Edison and Tesla","a real war","a battle between rivers"],["What is direct current?","current that flows in one direction","current that changes direction","current from the moon"],["What was the advantage of AC?","It could be sent over long distances efficiently.","It was cheaper to invent.","It was invented first."],["What uses direct current today?","batteries, phones and solar panels","nothing","only old radios"]]},
 {en:"Cells and DNA",ar:"الخلايا والحمض النووي",v:"cell|خلية|🦠;DNA|الحمض النووي|🧬;gene|جين|🔤;inherit|يرث|👪;organism|كائن حي|🐾;microscope|مجهر|🔬",
  c:[["What is a cell?","The smallest unit of life that can survive on its own.","A small room in a prison only.","A type of battery."],["Where is DNA found?","Inside the nucleus of most cells.","In the air around us only.","Only in plants."],["Why do children often look like their parents?","Because they inherit genes from both of them.","Because they copy their faces.","Because they eat the same food."],["What would you study if you became a biologist?","I'd study how cells repair themselves after injury.","I would study biology was.","Cells would study me."]],
  l:"The human body is made of about thirty trillion cells. There are more than two hundred types, such as blood cells, nerve cells and muscle cells. Each type has a special shape for its special job.",
  lq:[["How many cells are in the human body?","about thirty trillion","about thirty","about thirty thousand"],["How many types of cells are there?","more than two hundred","two","ten"],["Why do cells have different shapes?","Each type has a special job.","They are random.","They are all the same."]],
  r:"If you could stretch out the DNA inside just one of your cells, it would be about two meters long. Yet it fits inside a nucleus that is too small to see without a microscope, because it is tightly coiled. DNA is like an instruction manual, written in a code of only four chemical letters: A, T, C and G. The order of these letters determines everything from the color of your eyes to how tall you might grow. In 2003, scientists completed the Human Genome Project, reading the entire human genetic code for the first time. This has helped doctors understand and treat many diseases.",
  rq:[["How long is the DNA in one cell if stretched out?","about two meters","two centimeters","two kilometers"],["How does it fit in the nucleus?","It is tightly coiled.","It is cut into pieces.","It is very thin glass."],["How many chemical letters does the DNA code use?","four","twenty-six","two"],["What was completed in 2003?","the Human Genome Project","the first microscope","the first vaccine"]]}
 ]},

 {en:"Life on the Space Station",ar:"الحياة في محطة الفضاء",v:"orbit|مدار|🪐;gravity|الجاذبية|⬇️;weightless|عديم الوزن|🎈;crew|طاقم|👩‍🚀;experiment|تجربة|🧪;launch|إطلاق|🚀",
  c:[["How do astronauts sleep in space?","They sleep in sleeping bags that are attached to the wall.","They sleep floating freely and bump into things.","They never sleep in space."],["Why do astronauts exercise for two hours a day?","Because without gravity, their muscles and bones get weaker.","Because they are bored.","Because the station is too small."],["How many times does the station orbit the Earth each day?","About sixteen times.","Once a year.","Never, it stays still."],["Who were the first Saudi astronauts to visit the space station?","Rayyanah Barnawi and Ali AlQarni, in 2023.","Nobody has ever gone.","A famous falcon."]],
  l:"The International Space Station travels at about twenty-eight thousand kilometers per hour. Because it goes around the Earth so quickly, astronauts see about sixteen sunrises and sixteen sunsets every day.",
  lq:[["How fast does the station travel?","about twenty-eight thousand kilometers per hour","about two hundred kilometers per hour","it doesn't move"],["How many sunrises do astronauts see each day?","about sixteen","one","one hundred"],["Why do they see so many?","The station goes around the Earth quickly.","The sun moves faster.","They have special glasses."]],
  r:"In May 2023, Rayyanah Barnawi and Ali AlQarni became the first Saudi astronauts to travel to the International Space Station. Barnawi, a biomedical researcher, became the first Saudi woman, and among the first Arab women, to go to space. During their mission of about ten days, they carried out more than a dozen scientific experiments, including research on stem cells and on how the brain is affected by weightlessness. They also spoke by video to thousands of Saudi students, who watched them release a small kite to show how objects behave in microgravity. Their mission inspired a new generation to dream about careers in space science.",
  rq:[["When did they travel to the space station?","in May 2023","in 1985","in 2030"],["What was Rayyanah Barnawi's background?","biomedical research","football","cooking"],["What did they research?","stem cells and the brain in weightlessness","how to grow pizza","the color of Mars"],["What did they show students?","how objects behave in microgravity","how to drive","how to sleep"]]},
 {en:"Mission to Mars",ar:"مهمة إلى المريخ",v:"rover|مركبة جوالة|🚙;atmosphere|غلاف جوي|🌫️;surface|سطح|🪨;colony|مستعمرة|🏘️;signal delay|تأخر الإشارة|⏱️;sample|عينة|🧫",
  c:[["Why is Mars called the Red Planet?","Because its surface is covered in iron oxide, or rust.","Because it is very hot like fire.","Because it is angry."],["Could humans breathe on Mars?","No, the atmosphere is very thin and mostly carbon dioxide.","Yes, the air is fresher than on Earth.","Mars has no atmosphere at all."],["What did the Hope Probe study?","The Martian atmosphere and weather.","The bottom of the Pacific Ocean.","The Sun's football games."],["Would you volunteer to live on Mars?","Maybe, if I could come back after a few years.","I would living Mars.","Mars would volunteer me."]],
  l:"In 2021, the Hope Probe, sent by the United Arab Emirates, reached Mars. It was the first interplanetary mission by an Arab country. It studies the Martian atmosphere to understand how the planet lost most of its air and water.",
  lq:[["When did the Hope Probe reach Mars?","in 2021","in 2001","in 1969"],["Which country sent it?","the United Arab Emirates","Saudi Arabia","Egypt"],["What does it study?","the Martian atmosphere","Martian animals","Martian cities"]],
  r:"Sending humans to Mars would be the greatest journey in history, but the challenges are enormous. The trip would take about seven months each way. On Mars, temperatures can drop below minus one hundred degrees Celsius, and there are huge dust storms that can cover the entire planet. Because the atmosphere is thin, astronauts would be exposed to dangerous radiation. Communication is also difficult: a message from Mars can take up to twenty minutes to reach Earth, so astronauts would have to solve emergencies on their own. Scientists are working on solutions, such as producing oxygen from the Martian atmosphere, which a NASA experiment has already succeeded in doing on a small scale.",
  rq:[["How long would the trip take each way?","about seven months","seven days","seven years"],["How cold can Mars get?","below minus one hundred degrees Celsius","zero degrees","twenty degrees"],["Why would astronauts have to solve emergencies alone?","Messages can take up to twenty minutes.","There are no phones.","Earth doesn't care."],["What has a NASA experiment produced on Mars?","oxygen, on a small scale","water lakes","plants"]]},
 {en:"Stars and Galaxies",ar:"النجوم والمجرات",v:"galaxy|مجرة|🌌;light-year|سنة ضوئية|📏;telescope|تلسكوب|🔭;black hole|ثقب أسود|⚫;constellation|كوكبة نجمية|✨;universe|الكون|🌠",
  c:[["What is a light-year?","The distance light travels in one year.","A year that is very light.","A year without darkness."],["What galaxy do we live in?","The Milky Way.","The Chocolate Bar.","We don't live in any galaxy."],["Why can't we see stars during the day?","Because the sunlight is much brighter.","Because the stars go to sleep.","Because they move to the other side."],["What would happen if you fell into a black hole?","Gravity would stretch you so much that nothing, not even light, could escape.","You would bounce out like a ball.","You would land on a beach."]],
  l:"Many stars have Arabic names, because Arab astronomers studied and recorded them more than a thousand years ago. For example, the star Aldebaran comes from 'al-dabaran,' which means 'the follower,' and Betelgeuse also comes from an Arabic name.",
  lq:[["Why do many stars have Arabic names?","Arab astronomers studied and recorded them.","They were discovered last year.","Stars chose their names."],["What does 'al-dabaran' mean?","the follower","the leader","the brightest"],["Which other star is mentioned?","Betelgeuse","Sirius","Polaris"]],
  r:"When you look at a star, you are looking into the past. The light from the nearest star after the Sun, Proxima Centauri, takes more than four years to reach us. Light from some distant galaxies has been traveling for billions of years, which means we see them as they were long before the Earth existed. In 2022, the James Webb Space Telescope began sending back images of galaxies that formed not long after the universe began. By studying this ancient light, astronomers hope to answer some of the biggest questions: How did the first stars form? And are we alone in the universe?",
  rq:[["Why are we looking into the past when we look at stars?","Their light takes time to reach us.","Stars are old.","Telescopes are slow."],["How long does light from Proxima Centauri take to reach us?","more than four years","four minutes","four thousand years"],["What did the James Webb Space Telescope begin doing in 2022?","sending images of very old galaxies","landing on Mars","taking photos of Earth only"],["What is one of the big questions astronomers hope to answer?","Are we alone in the universe?","What is for lunch?","How tall is a giraffe?"]]},
 {en:"Satellites",ar:"الأقمار الصناعية",v:"satellite|قمر صناعي|🛰️;signal|إشارة|📶;GPS|نظام تحديد المواقع|📍;navigate|يتنقل/يوجّه|🧭;debris|حطام|🗑️;broadcast|يبث|📡",
  c:[["What are satellites used for?","Navigation, weather forecasting, communication and observing the Earth.","Only for decoration in the sky.","For aliens to sit on."],["How does GPS know where you are?","Your phone receives signals from several satellites and calculates its position.","The satellite looks at you through a window.","GPS guesses randomly."],["What is space debris?","Old satellites and broken pieces that are still orbiting the Earth.","Dust that falls from the Moon.","Trees that grow in space."],["Why is space debris a problem?","It can crash into working satellites and the space station.","It makes the sky prettier.","It is not a problem at all."]],
  l:"The first artificial satellite, Sputnik 1, was launched by the Soviet Union in 1957. It was about the size of a beach ball and sent a simple beeping signal. Today, there are thousands of active satellites orbiting the Earth.",
  lq:[["What was the first artificial satellite?","Sputnik 1","Hubble","the Moon"],["When was it launched?","in 1957","in 1997","in 1907"],["How big was it?","about the size of a beach ball","as big as a bus","as small as a coin"]],
  r:"In 1985, Prince Sultan bin Salman became the first Arab and the first Muslim to travel to space. He flew on the American space shuttle Discovery as part of a mission that launched an Arab communications satellite, Arabsat. During the seven-day mission, he took photographs of the Arabian Peninsula and conducted experiments. He later described how seeing the Earth from space changed his perspective: from space, he said, borders disappear, and you see one planet that all humans share. Decades later, Saudi Arabia established a national space agency to develop its space program further.",
  rq:[["When did Prince Sultan bin Salman travel to space?","in 1985","in 2023","in 1957"],["Which space shuttle did he fly on?","Discovery","Apollo","Sputnik"],["What satellite did the mission launch?","Arabsat","Hubble","GPS"],["What did seeing Earth from space make him realize?","We all share one planet.","Borders are very clear.","Space is boring."]]},
 {en:"Moon Landing",ar:"الهبوط على القمر",v:"lunar|قمري|🌕;module|وحدة|📦;footprint|أثر قدم|👣;crater|فوهة|🕳️;achievement|إنجاز|🏆;mankind|البشرية|🌍",
  c:[["Who was the first person to walk on the Moon?","Neil Armstrong, in 1969.","Ibn Battuta, in 1325.","Nobody has ever walked there."],["What did he say when he stepped on the Moon?","'That's one small step for man, one giant leap for mankind.'","'Hello, is anybody home?'","'I'm hungry.'"],["Why are the astronauts' footprints still there?","Because there is no wind or rain on the Moon to erase them.","Because someone guards them.","Because they were painted."],["How had the astronauts prepared for the mission?","They had trained for years and practiced every step many times.","They hadn't prepared at all.","They had prepared by watching cartoons."]],
  l:"On July 20, 1969, the Apollo 11 lunar module landed on the Moon. Neil Armstrong and Buzz Aldrin walked on the surface for about two and a half hours, while Michael Collins stayed in orbit.",
  lq:[["When did Apollo 11 land on the Moon?","July 20, 1969","July 4, 1776","January 1, 2000"],["How long did they walk on the surface?","about two and a half hours","two days","ten minutes"],["Who stayed in orbit?","Michael Collins","Neil Armstrong","Buzz Aldrin"]],
  r:"When Apollo 11 landed, the astronauts had only about twenty-five seconds of fuel left. The computer had been showing alarms because it was overloaded, and the planned landing site was full of large rocks. Armstrong took manual control and flew the lunar module over the boulders until he had found a safe, flat area. Back in Mission Control, people had been holding their breath. When Armstrong finally said, 'The Eagle has landed,' the room exploded with relief. The success depended not only on brave astronauts but also on around four hundred thousand engineers, scientists and workers who had built the rockets and the software.",
  rq:[["How much fuel was left when they landed?","about twenty-five seconds","twenty-five minutes","a full tank"],["Why did Armstrong take manual control?","The landing site was full of rocks.","He was bored.","The computer switched off forever."],["What did Armstrong say when they landed?","The Eagle has landed.","Help us!","We're lost."],["How many people worked on the program?","around four hundred thousand","around forty","only three"]]},
 {en:"The Future of Space",ar:"مستقبل الفضاء",v:"commercial|تجاري|💼;reusable|قابل لإعادة الاستخدام|♻️;tourism|سياحة|🧳;mining|التعدين|⛏️;explore|يستكشف|🧭;ethics|أخلاقيات|⚖️",
  c:[["Why are reusable rockets important?","They make space travel much cheaper.","They make rockets heavier.","They are just for fun."],["Would you go to space as a tourist?","Yes, if it became safe and affordable.","I would tourist space.","Space would go me tourist."],["Who should own the Moon's resources?","I think they should be shared by all humanity.","Only the first person who arrives.","Nobody should talk about it."],["What job in the space industry interests you?","I'd love to be an engineer who designs rovers.","I would interesting job space.","Job interests me space."]],
  l:"In the past, rockets were used only once and then lost in the ocean. Today, some companies land their rockets back on Earth and use them again. This has reduced the cost of launching satellites dramatically.",
  lq:[["What happened to rockets in the past?","They were used only once.","They were reused many times.","They stayed in space."],["What do some companies do today?","land their rockets and use them again","never launch rockets","build rockets from wood"],["What has this reduced?","the cost of launching satellites","the speed of rockets","the number of stars"]],
  r:"As space becomes more accessible, new questions arise. Should companies be allowed to mine asteroids for valuable metals? If humans build bases on the Moon, who will make the rules there? An international agreement from 1967, the Outer Space Treaty, says that no country can claim the Moon or other celestial bodies as its own, and that space should be used for peaceful purposes. However, the treaty was written long before private space companies existed. Many experts believe the world needs new agreements to make sure that space remains a place of cooperation, not competition and conflict.",
  rq:[["What is one new question about space?","Should companies mine asteroids?","Is the Moon made of cheese?","How old is the Sun?"],["What does the Outer Space Treaty say?","No country can claim the Moon.","Every country owns part of the Moon.","Only companies can use space."],["When was the treaty written?","in 1967","in 2020","in 1800"],["What do many experts believe?","The world needs new agreements.","The old treaty is perfect.","Space should be closed."]]}
 ]},

 {en:"Elements of a Story",ar:"عناصر القصة",v:"character|شخصية|🧑;setting|المكان والزمان|🏞️;plot|الحبكة|🧵;conflict|الصراع|⚔️;climax|الذروة|⛰️;resolution|الحل|🏁",
  c:[["What is the setting of a story?","The time and place where the story happens.","The person who wrote the story.","The price of the book."],["What is the climax?","The most exciting moment, when the conflict reaches its peak.","The first page of the book.","The list of characters."],["Who is your favorite character in a book, and why?","I like Sindbad because he's brave and curious.","I like character because book.","Favorite character is me."],["What usually happens in the resolution?","The conflict is solved and the story ends.","The story starts again from the beginning.","A new book begins."]],
  l:"Every good story has a problem. The main character wants something, but something stands in their way. This is called the conflict. Without conflict, a story would be boring because nothing interesting would happen.",
  lq:[["What does every good story have?","a problem","a dragon","a happy family"],["What is the conflict?","something that stands in the character's way","the ending","the title"],["What would a story without conflict be?","boring","exciting","funny"]],
  r:"The tales of Sindbad the Sailor, from the collection known as One Thousand and One Nights, follow a clear story structure. In each voyage, Sindbad, a merchant from Baghdad, sets sail in search of adventure and wealth. The setting changes from busy ports to mysterious islands. Soon, a conflict appears: a shipwreck, a giant bird called the roc, or a monstrous creature. The tension rises until the climax, when Sindbad must use his intelligence to escape. In the resolution, he returns home richer and wiser, only to feel restless again and begin another voyage.",
  rq:[["Where was Sindbad from?","Baghdad","Cairo","Damascus"],["What is the roc?","a giant bird","a ship","an island"],["How does Sindbad usually escape at the climax?","by using his intelligence","by fighting with a sword","by calling for help"],["What happens after he returns home?","He feels restless and begins another voyage.","He never travels again.","He becomes a king."]]},
 {en:"Idioms",ar:"التعابير الاصطلاحية",v:"piece of cake|سهل جدًا|🍰;break the ice|يكسر الجليد|🧊;under the weather|متوعك|🤒;hit the books|يذاكر بجد|📚;once in a blue moon|نادرًا جدًا|🌕;in hot water|في ورطة|♨️",
  c:[["How was the test?","It was a piece of cake! I finished early.","It was a cake piece of.","The test was a real cake that I ate."],["You look a bit under the weather. Are you OK?","I have a cold, so I'm staying home today.","I'm under the clouds literally.","Weather is under me."],["How often do you eat fast food?","Once in a blue moon. Maybe twice a year.","Every time the moon turns blue in color.","Blue moon eats me."],["Why is Fahad in hot water?","Because he forgot to do his project, and it's due today.","Because he is taking a bath.","Because the water is hot."]],
  l:"At the start of the new school year, our teacher played a game to break the ice. Everyone had to say one surprising fact about themselves. By the end of the lesson, we were laughing together like old friends.",
  lq:[["When did the teacher play the game?","at the start of the school year","at the end of the year","during the exam"],["What did 'break the ice' mean here?","make people feel comfortable together","break real ice","start a fight"],["What did everyone have to say?","one surprising fact about themselves","their phone number","their address"]],
  r:"Idioms are expressions whose meaning cannot be understood from the individual words. If someone says 'It's raining cats and dogs,' they don't mean animals are falling from the sky; they mean it's raining heavily. Every language has its own idioms, and they often reflect the culture. In Arabic, we might say that someone's 'eye is cold' to mean they feel relieved and happy, because in a hot climate, coolness is pleasant. In English, which developed in a cold climate, 'warm' is often used for positive feelings, as in 'a warm welcome.' Learning idioms helps you understand not only a language but also the way its speakers see the world.",
  rq:[["What is an idiom?","an expression whose meaning can't be understood from the individual words","a very long word","a grammar rule"],["What does 'raining cats and dogs' mean?","raining heavily","animals falling","a light rain"],["Why might 'cold eye' be positive in Arabic?","In a hot climate, coolness is pleasant.","Arabs like winter.","Eyes are always cold."],["What does learning idioms help you understand?","how speakers see the world","only grammar","math"]]},
 {en:"Poetry",ar:"الشعر",v:"poem|قصيدة|📜;verse|بيت شعري|🖋️;rhyme|قافية|🔁;metaphor|استعارة|🎭;rhythm|إيقاع|🌊;poet|شاعر|✍️",
  c:[["What is a metaphor?","Saying one thing is another to make a comparison, like 'Time is a river.'","A type of animal in poems.","A very long rhyme."],["Do all poems have to rhyme?","No, many modern poems don't rhyme at all.","Yes, every line must rhyme.","Poems rhyme me."],["Why was poetry so important in ancient Arabia?","Because poets recorded history and expressed the values of their tribes.","Because nobody could speak.","Because it was the only food."],["Have you ever written a poem?","Yes, I wrote one about the sea for my mother.","Yes, I have writing poem yesterday.","Poem has written me."]],
  l:"In ancient Arabia, the market of Ukaz was famous for its poetry competitions. Poets came from all over the peninsula to recite their best poems. The most admired poems were remembered and repeated for generations.",
  lq:[["What was Ukaz famous for?","poetry competitions","selling cars","football matches"],["Where did poets come from?","all over the peninsula","only one town","other planets"],["What happened to the most admired poems?","They were remembered for generations.","They were forgotten.","They were burned."]],
  r:"Al-Mutanabbi, who lived over a thousand years ago, is often considered one of the greatest poets in the Arabic language. Many of his verses have become proverbs that people still quote today, often without knowing who wrote them. He was famous for his confidence and for his powerful use of language.",
  rq:[["When did Al-Mutanabbi live?","over a thousand years ago","last century","in 2000"],["What has happened to many of his verses?","They have become proverbs.","They were lost.","Nobody reads them."]]},
 {en:"Fables and Wisdom",ar:"الحكايات والحكمة",v:"fable|حكاية رمزية|🦊;moral|العبرة|💡;wise|حكيم|🦉;greedy|جشع|🤑;trick|خدعة|🎩;lesson|درس|📜",
  c:[["What is a fable?","A short story, often with animals, that teaches a moral.","A long scientific report.","A type of sandwich."],["What is Kalila wa Dimna?","A famous collection of fables translated into Arabic by Ibn al-Muqaffa.","A football club.","A city in Spain."],["Why do fables often use animals as characters?","Because it lets writers criticize behavior without naming real people.","Because animals can read.","Because people are boring."],["What moral do you remember from a fable?","Don't trust someone just because they flatter you.","Moral was remember fable me.","Fables remember morals me."]],
  l:"Kalila wa Dimna was originally written in Sanskrit in India. It was translated into Persian and then, in the eighth century, into Arabic by Ibn al-Muqaffa. From Arabic, it spread to many other languages around the world.",
  lq:[["In which language was it originally written?","Sanskrit","Arabic","English"],["Who translated it into Arabic?","Ibn al-Muqaffa","Ibn Sina","Al-Mutanabbi"],["What happened after it was translated into Arabic?","It spread to many other languages.","It was forgotten.","It was banned."]],
  r:"In one of the fables of Kalila wa Dimna, a group of doves was caught in a hunter's net. Each dove tried to escape alone, flapping desperately, but the net only grew tighter. Then their wise leader told them: 'If we work together, we can lift the net.' On her signal, all the doves flew up at the same moment, carrying the net into the sky. They flew to their friend, a mouse, who chewed through the ropes and set them free. The moral is clear: unity gives strength, and true friends help each other in times of trouble.",
  rq:[["What happened to the doves?","They were caught in a net.","They lost their way.","They fell into water."],["Why did trying alone fail?","The net only grew tighter.","The net was too heavy.","The hunter came back."],["Who freed the doves?","a mouse","the hunter","a lion"],["What is the moral?","Unity gives strength.","Always fly alone.","Never trust mice."]]},
 {en:"Writing a Story",ar:"كتابة قصة",v:"draft|مسودة|📝;dialogue|حوار|💬;describe|يصف|🎨;edit|يحرّر/يعدّل|✂️;audience|الجمهور|👥;suspense|تشويق|😮",
  c:[["How should I start my story?","Start with an interesting moment that makes the reader curious.","Start with 'The end.'","Story should start me."],["What's the difference between showing and telling?","Instead of saying 'She was scared,' you describe her shaking hands.","There is no difference.","Showing is for films only."],["Why should you write more than one draft?","Because editing makes the story clearer and stronger.","Because the first draft is always perfect.","Because paper is cheap."],["How do you create suspense?","Give hints that something will happen, but don't reveal it too early.","Tell the ending in the first line.","Use very long boring descriptions."]],
  l:"Good writers use all five senses. Don't just describe what a place looks like. Describe how it sounds, smells, feels and even tastes. This helps readers feel as if they are really there.",
  lq:[["How many senses should writers use?","all five","only sight","two"],["What should you describe besides looks?","sounds, smells, feelings and tastes","only colors","prices"],["Why use the senses?","to help readers feel they are really there","to make stories longer","to confuse readers"]],
  r:"Compare these two openings. First: 'It was a scary night. Ali was afraid.' Second: 'The wind howled through the broken window. Ali pulled the blanket over his head, but he could still hear it: slow footsteps, coming up the stairs.' The second version is far more powerful. It shows rather than tells, it uses sound to create atmosphere, and it ends with a question in the reader's mind: who is coming? Professional writers rarely get their opening right the first time. Many rewrite their first page dozens of times, because they know that the first few lines decide whether a reader will keep going.",
  rq:[["Why is the second opening more powerful?","It shows rather than tells and creates suspense.","It is shorter.","It uses easier words."],["Which sense does the second opening use to create atmosphere?","sound","taste","smell"],["What question does the reader have?","Who is coming?","What is for dinner?","Where is the blanket?"],["Why do writers rewrite their first page many times?","The first lines decide whether readers keep going.","They forget it.","Editors force them."]]},
 {en:"Book Review",ar:"مراجعة كتاب",v:"review|مراجعة|⭐;recommend|يوصي|👍;author|مؤلف|✍️;genre|نوع أدبي|📚;plot twist|منعطف مفاجئ|🔄;page-turner|كتاب مشوّق|📖",
  c:[["What genre of books do you enjoy?","I enjoy mysteries, especially ones with plot twists.","I enjoy genre books do.","Genre enjoys me."],["Would you recommend the book you just finished?","Yes, it's a real page-turner. I couldn't put it down.","Yes, I would recommending it.","Book recommends me."],["What didn't you like about the book?","The ending felt rushed, and some characters weren't developed.","I didn't like it was book.","Like didn't book me."],["What should a good book review include?","A short summary, your opinion and reasons, without spoiling the ending.","The whole ending in detail.","Only the price."]],
  l:"I gave this book four stars out of five. The characters were very realistic, and the plot twist in chapter ten surprised me completely. However, the middle part was a little slow. I'd recommend it to anyone who loves adventure stories.",
  lq:[["How many stars did the reviewer give?","four","five","three"],["Where was the plot twist?","in chapter ten","in the first chapter","at the end"],["What was the weakness?","The middle part was a little slow.","The characters were unrealistic.","It was too short."]],
  r:"Book Review: 'The Lost Map of the Empty Quarter.' This exciting adventure novel follows two cousins, Lama and Saud, who discover an old map in their grandfather's house. The map leads them deep into the desert, where they must rely on traditional knowledge, like reading the stars and finding water, to survive. The author's descriptions of the desert are beautiful; you can almost feel the heat and see the endless dunes. The cousins' relationship, which begins with constant arguments, slowly turns into deep trust. My only criticism is that some chapters are a little predictable. Overall, I highly recommend it for readers aged ten and above.",
  rq:[["Who are the main characters?","two cousins, Lama and Saud","a grandfather and his son","two explorers from Europe"],["Where do they find the map?","in their grandfather's house","in a library","in the desert"],["How does the cousins' relationship change?","from arguments to deep trust","from friends to enemies","it doesn't change"],["What is the reviewer's criticism?","Some chapters are predictable.","The descriptions are bad.","It is too long."]]}
 ]},
{en:"Leaders' Council",ar:"مجلس القادة",sub:"القيادة والخطابة والإقناع",icon:"🏛️",c:"#2B6FCC",d:"#174788",s:"#DFEAFA",boss:"تحدي رئيس المجلس",

 {en:"Qualities of a Leader",ar:"صفات القائد",v:"vision|رؤية|🔭;integrity|نزاهة|🧭;empathy|تعاطف|🤗;delegate|يفوّض|📋;inspire|يلهم|✨;accountable|مسؤول|⚖️",
  c:[["What do you think is the most important quality of a leader?","Integrity, because people need to trust their leader.","Being the loudest person.","Leader quality important is."],["What does it mean to delegate?","To give tasks to others and trust them to do them.","To do every task yourself.","To cancel all the tasks."],["How should a leader react when the team fails?","Take responsibility and help the team learn from it.","Blame everyone else.","Pretend nothing happened."],["Have you ever led a group?","Yes, I led my class's charity campaign last year.","Yes, I have lead it last year ago.","Group has led me."]],
  l:"A good leader doesn't only give orders. A good leader listens to the team, explains the goal clearly and helps every member use their strengths. When the team succeeds, a good leader shares the credit.",
  lq:[["What does a good leader do besides giving orders?","listens to the team","shouts more","works alone"],["What does a good leader explain?","the goal","the jokes","nothing"],["What does a good leader do when the team succeeds?","shares the credit","takes all the credit","leaves"]],
  r:"There is an old saying: 'The leader of a people is their servant.' It reflects an idea that modern business experts call 'servant leadership.' In this approach, the leader's main job is to support the team, removing obstacles, providing resources and helping each person grow. Research suggests that teams with servant leaders are often more creative and more loyal, because people feel valued. This doesn't mean that the leader avoids making difficult decisions. It means the leader makes decisions with the team's well-being in mind, and is willing to be held accountable for them.",
  rq:[["What does the old saying mean?","A leader should serve their people.","Leaders should be served.","Leaders never work."],["What is the leader's main job in servant leadership?","to support the team","to give orders","to win prizes"],["Why are teams with servant leaders often more loyal?","People feel valued.","They are paid more.","They are afraid."],["Does a servant leader avoid difficult decisions?","No, they still make them.","Yes, always.","They let others decide everything."]]},
 {en:"Public Speaking",ar:"فن الإلقاء",v:"audience|جمهور|👥;eye contact|التواصل البصري|👀;pause|يتوقف قليلًا|⏸️;confidence|ثقة|💪;rehearse|يتدرب على الإلقاء|🔁;gesture|إيماءة|🙌",
  c:[["I'm terrified of speaking in front of the class. Any advice?","Rehearse several times and focus on your message, not your fear.","Speak as fast as possible to finish quickly.","Hide behind the board."],["Why is eye contact important?","It helps you connect with the audience and look confident.","It makes the audience sleepy.","It's rude in every culture."],["What should you do if you forget what to say?","Pause, breathe, check your notes and continue calmly.","Run out of the room.","Start crying loudly."],["How do you start a speech in an interesting way?","With a question, a surprising fact or a short story.","With 'Um, so, yeah.'","With a long apology."]],
  l:"Studies show that many people are more afraid of public speaking than of spiders or heights. But the fear can be reduced. Practicing in front of a mirror, recording yourself, and speaking to small groups first can all help build confidence.",
  lq:[["What are many people more afraid of than spiders?","public speaking","dogs","the dark"],["What is one way to practice?","in front of a mirror","only in your head","in the shower only"],["What do these methods help build?","confidence","fear","muscles"]],
  r:"Many great speeches are remembered for one powerful phrase. In 1963, Martin Luther King Jr. repeated 'I have a dream' to describe a future of equality, and the repetition made his message unforgettable. Skilled speakers use techniques like this deliberately. They use the 'rule of three,' grouping ideas in threes because the brain finds them easy to remember. They tell personal stories, because stories create emotion. And they use pauses, because a moment of silence before an important point makes the audience lean in. A speech is not just information; it is a performance that aims to move people.",
  rq:[["What phrase did Martin Luther King Jr. repeat?","I have a dream","Yes we can","Never give up"],["What is the 'rule of three'?","grouping ideas in threes","speaking for three minutes","using three languages"],["Why do speakers tell personal stories?","Stories create emotion.","Stories are shorter.","They forget facts."],["What does a pause before an important point do?","It makes the audience lean in.","It confuses the audience.","It ends the speech."]]},
 {en:"Negotiation",ar:"التفاوض",v:"negotiate|يتفاوض|🤝;compromise|حل وسط|⚖️;offer|عرض|📨;deal|اتفاق|✍️;win-win|مكسب للطرفين|🏅;interest|مصلحة|🎯",
  c:[["My brother and I both want the computer at the same time. What should we do?","Negotiate: maybe one uses it now and the other after an hour.","Fight until someone wins.","Break the computer."],["What is a compromise?","An agreement where each side gives up something.","When one side gets everything.","A type of computer."],["What is a win-win solution?","A solution where both sides benefit.","A solution where you win twice.","A game nobody wins."],["What should you do before negotiating?","Understand what you want and what the other person needs.","Prepare insults.","Nothing, just start shouting."]],
  l:"Two sisters were arguing over the last orange. Finally, they cut it in half. Later, they discovered that one sister wanted only the juice, and the other wanted only the peel for a cake. If they had asked each other why, they could both have had everything they needed.",
  lq:[["What were the sisters arguing about?","the last orange","a toy","the TV"],["What did one sister want?","only the juice","the whole orange","nothing"],["What could they have done?","asked each other why","thrown it away","bought another"]],
  r:"Experts say that successful negotiators focus on interests, not positions. A position is what someone says they want; an interest is why they want it. Imagine a student council negotiating with the principal about a longer break. The students' position is 'thirty minutes instead of twenty.' Their interest is having enough time to eat and play. The principal's position is 'no change,' but his interest is not losing lesson time. Once both sides understood each other's interests, they found a creative solution: the break stayed at twenty minutes, but students were allowed to eat their snacks during the first lesson's last five minutes. Both sides were satisfied.",
  rq:[["What do successful negotiators focus on?","interests, not positions","positions only","winning"],["What is an interest?","why someone wants something","what someone says","a type of money"],["What was the principal's interest?","not losing lesson time","longer breaks","more homework"],["What was the solution?","eating snacks during the last five minutes of the first lesson","a thirty-minute break","no break at all"]]},
 {en:"Rules and Laws",ar:"الأنظمة والقوانين",v:"law|قانون|📕;rights|حقوق|✊;duty|واجب|📌;justice|العدل|⚖️;citizen|مواطن|🧑;enforce|يطبّق|👮",
  c:[["Why do societies need laws?","To protect people's rights and keep order.","To make life boring.","Laws are not needed."],["What's the difference between a right and a duty?","A right is something you're entitled to; a duty is something you must do.","They are exactly the same.","Rights are for adults only."],["What would happen if there were no traffic laws?","There would be chaos and many more accidents.","Driving would be safer.","Cars would fly."],["Can you give an example of a duty that citizens have?","Respecting public property and other people's rights.","Throwing rubbish in the street.","Ignoring every rule."]],
  l:"Every child has rights. The United Nations Convention on the Rights of the Child, adopted in 1989, says that all children have the right to education, health care, play and protection from harm.",
  lq:[["When was the Convention adopted?","in 1989","in 1889","in 2009"],["Which right is mentioned?","education","driving","voting"],["What else do children have the right to?","play and protection from harm","a car","a job"]],
  r:"One of the oldest known written legal codes is the Code of Hammurabi, which was created in ancient Babylon almost four thousand years ago. It was carved on a large stone so that everyone could see the laws. Before written laws existed, rules could be changed by whoever was in power. Writing them down was an important step toward fairness, because the same rules applied to everyone and could be checked. Today, the idea that nobody is above the law, called the rule of law, is considered one of the foundations of a just society.",
  rq:[["Where was the Code of Hammurabi created?","in ancient Babylon","in ancient Egypt","in Rome"],["Why was it carved on a large stone?","so everyone could see the laws","to decorate the city","to hide the laws"],["Why was writing laws down important?","The same rules applied to everyone and could be checked.","It made laws longer.","It was cheaper."],["What is the 'rule of law'?","the idea that nobody is above the law","a rule about writing","a type of ruler"]]},
 {en:"Volunteering",ar:"العمل التطوعي",v:"volunteer|متطوع|🙋;initiative|مبادرة|🚀;contribute|يساهم|➕;elderly|كبار السن|👵;hospital|مستشفى|🏥;impact|أثر|💥",
  c:[["Why do people volunteer?","To help others, gain experience and feel part of their community.","To earn a lot of money.","Because they are forced."],["Where could a teenager volunteer?","At a library, an animal shelter, or a food bank.","At a bank vault.","Nowhere, it's not allowed."],["What did you gain from volunteering?","I learned to be patient and to work with different people.","I gained was volunteer.","Volunteering gained me."],["If you started an initiative, what would it be?","I'd start a reading club for younger children in my neighborhood.","I would initiative start would.","Initiative would start me."]],
  l:"During Hajj season, thousands of young Saudi volunteers help pilgrims. They give directions, distribute water, help elderly pilgrims and translate for people who speak other languages.",
  lq:[["When do the volunteers help?","during Hajj season","during summer holidays","at night only"],["What do they distribute?","water","money","books"],["Whom do they translate for?","people who speak other languages","their teachers","the police"]],
  r:"Saudi Arabia's Vision 2030 set a goal of reaching one million volunteers. Volunteering is seen not only as a way to help others but also as a way to build skills. A study of young volunteers found that they developed communication, leadership and problem-solving abilities, which later helped them at university and work. However, experts say that the best volunteering is based on real community needs. Before starting a project, it's important to ask people what they actually need, rather than assuming. A small, well-planned project often has more impact than a large one that doesn't match the community's needs.",
  rq:[["What volunteering goal did Vision 2030 set?","one million volunteers","one thousand volunteers","ten volunteers"],["What skills did young volunteers develop?","communication, leadership and problem-solving","cooking only","driving"],["What is the best volunteering based on?","real community needs","what looks good","what is easiest"],["Which project often has more impact?","a small, well-planned one","a large unplanned one","one with no plan"]]},
 {en:"Planning an Event",ar:"تخطيط فعالية",v:"schedule|جدول زمني|🗓️;venue|مكان الفعالية|📍;budget|ميزانية|💰;sponsor|راعٍ|🤝;deadline|موعد نهائي|⏰;checklist|قائمة مهام|✅",
  c:[["What's the first thing you need when planning an event?","A clear goal: why are we holding this event?","A huge cake.","A famous actor."],["How will we pay for the science fair?","We could ask local businesses to sponsor us.","We could print our own money.","Money will appear by itself."],["What should we do if a speaker cancels at the last minute?","Have a backup plan, like a short activity or another speaker.","Cancel the whole event.","Blame the audience."],["Why is a checklist useful?","It makes sure nothing important is forgotten.","It makes the event longer.","It's useless."]],
  l:"The school's Reading Day will be held next Thursday in the main hall. Activities will start at nine o'clock with a talk by a children's author. At eleven, students will act out scenes from their favorite books. The event will finish at one o'clock with a book exchange.",
  lq:[["Where will Reading Day be held?","in the main hall","in the playground","in a library outside"],["What happens at nine o'clock?","a talk by a children's author","a book exchange","lunch"],["How does the event finish?","with a book exchange","with a football match","with an exam"]],
  r:"When the student council of a girls' school in Riyadh decided to organize a charity bazaar, they divided the work carefully. One team handled the venue and the schedule. Another team contacted parents and local shops to donate items. A third team was in charge of advertising, designing posters and short videos. Every Sunday, the team leaders met to check their progress against a shared checklist. Two days before the event, they discovered that they didn't have enough tables. Because they had kept a small emergency budget, they could rent extra ones. The bazaar raised more than twelve thousand riyals for a children's hospital.",
  rq:[["What did the student council organize?","a charity bazaar","a sports day","a science fair"],["What did the third team do?","advertising","venue and schedule","contacting shops"],["What problem did they discover?","They didn't have enough tables.","Nobody came.","It rained."],["How much did the bazaar raise?","more than twelve thousand riyals","twelve riyals","one million riyals"]]}
 ]},
{en:"Future City",ar:"مدينة المستقبل",sub:"الذكاء الاصطناعي ومهن الغد والأخلاقيات",icon:"🌆",c:"#6447D1",d:"#3E2896",s:"#ECE7FB",boss:"التحدي الأخير: عمدة المستقبل",
 games:["sentence","spell","gap","balloons","tf","memory"],
