<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
/* Layout: a kid's tablet board — big star counter up top, time-of-day tabs, chunky tappable task tiles, shop and penalty below */
:root{
  --bg:#EAF3F1; --surface:#FFFFFF; --surface-2:#F4F9F8; --ink:#13302C; --muted:#5C7A75;
  --line:#D3E4E0; --primary:#14806B; --primary-ink:#FFFFFF; --primary-soft:#D6EFE8;
  --star:#F2B300; --star-soft:#FFF3C9; --star-ink:#6B4E00;
  --danger:#D2453A; --danger-soft:#FBE3E0;
  --done:#E3F4EE;
  --display:"Baloo Bhaijaan 2","Readex Pro",system-ui,sans-serif;
  --body:"Readex Pro",system-ui,"Segoe UI",Tahoma,sans-serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1C1A; --surface:#152926; --surface-2:#1A3330; --ink:#E6F3F0; --muted:#93B2AC;
  --line:#25433F; --primary:#3CC3A2; --primary-ink:#06231D; --primary-soft:#1E413A;
  --star:#FFC933; --star-soft:#3A3115; --star-ink:#FFE08A;
  --danger:#FF7A6E; --danger-soft:#3E211F; --done:#183A33; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1C1A; --surface:#152926; --surface-2:#1A3330; --ink:#E6F3F0; --muted:#93B2AC;
  --line:#25433F; --primary:#3CC3A2; --primary-ink:#06231D; --primary-soft:#1E413A;
  --star:#FFC933; --star-soft:#3A3115; --star-ink:#FFE08A;
  --danger:#FF7A6E; --danger-soft:#3E211F; --done:#183A33; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

/* Header */
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;background:var(--surface);border-radius:28px;padding:18px 20px}
.who{display:flex;align-items:center;gap:14px;min-width:0}
.avatar{width:64px;height:64px;flex:none;border-radius:18px;object-fit:cover;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-family:var(--display);font-size:32px;font-weight:800}
.who h1{font-size:clamp(26px,5vw,38px);font-weight:800}
.who .date{color:var(--muted);font-size:14px}
.rename{font-size:13px;color:var(--primary);text-decoration:underline;text-underline-offset:3px;padding:2px 0}
.bank{display:flex;align-items:center;gap:10px;background:var(--star-soft);color:var(--star-ink);border-radius:999px;padding:8px 20px 8px 10px}
.bank .s{width:52px;height:52px}
.bank b{font-family:var(--display);font-size:42px;font-weight:800;line-height:1}
.bank small{display:block;font-size:12px;opacity:.85}
.bank.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.12)}}
.bank.drop{animation:shake .45s ease}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

.progress{grid-column:1/-1;display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.bar{flex:1;height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .4s}

/* Tabs */
.tabs{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tab{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:84px}
.tab .ic{width:68px;height:68px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:34px;border:3px solid transparent;transition:transform .15s}
.tab span{font-family:var(--display);font-weight:700;font-size:17px;color:var(--muted)}
.tab[aria-selected="true"] .ic{border-color:var(--ink);transform:scale(1.04)}
.tab[aria-selected="true"] span{color:var(--ink)}
.tab .cnt{font-size:12px;font-family:var(--body);color:var(--muted);margin-top:-4px}

.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel-head h2{font-size:30px;font-weight:800}
.panel-head p{margin:0;color:var(--muted);font-size:14px}

/* Task tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.task{position:relative;text-align:start;background:var(--surface);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;column-gap:12px;align-items:center;min-height:104px;transition:background .2s,transform .1s}
.task:active{transform:scale(.98)}
.task .emo{grid-row:1/3;font-size:44px;line-height:1;width:56px;text-align:center}
.task .name{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.25;min-width:0}
.task .pts{grid-column:2;display:flex;align-items:center;gap:3px;color:var(--star-ink);font-size:14px;font-weight:600}
.task .pts svg{width:18px;height:18px}
.task .chk{grid-row:1/3;grid-column:3;width:40px;height:40px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;transition:.2s}
.task .chk svg{width:22px;height:22px;opacity:0;transition:.2s}
.task.done{background:var(--done)}
.task.done .chk{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.task.done .chk svg{opacity:1}
.task.done .name{opacity:.75}
.tag{position:absolute;top:10px;inset-inline-end:14px;font-size:11px;background:var(--star);color:#3A2A00;border-radius:99px;padding:1px 8px;font-weight:600}

/* Bathroom counter */
.counter{grid-column:1/-1;background:var(--surface);border-radius:var(--r);padding:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.counter .emo{font-size:44px;width:56px;text-align:center}
.counter .meta{flex:1;min-width:160px}
.counter .name{font-family:var(--display);font-weight:700;font-size:19px}
.counter .sub{font-size:13px;color:var(--muted)}
.drops{display:flex;gap:8px;flex-wrap:wrap}
.drop{width:46px;height:46px;border-radius:50%;border:3px dashed var(--line);display:grid;place-items:center;font-size:20px;color:var(--muted);font-weight:600}
.drop.on{border:3px solid var(--primary);background:var(--primary-soft);color:var(--primary)}

/* Shop */
.wallet-note{background:var(--surface);border-radius:var(--r);padding:14px 16px;font-size:14px;color:var(--muted)}
.tier{display:flex;flex-direction:column;gap:10px}
.tier h3{font-size:20px;font-weight:700;display:flex;gap:8px;align-items:center}
.tier h3 small{font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted)}
.reward{background:var(--surface);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center}
.reward .emo{grid-row:1/3;font-size:38px;width:48px;text-align:center}
.reward .name{font-family:var(--display);font-weight:700;font-size:18px}
.reward .cost{display:flex;align-items:center;gap:4px;color:var(--star-ink);font-weight:600;font-size:14px}
.reward .cost svg{width:16px;height:16px}
.reward .rbar{grid-column:2/4;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.reward .rbar i{display:block;height:100%;background:var(--star);border-radius:99px}
.reward .buy{grid-row:1;grid-column:3;padding:10px 16px;border-radius:14px;background:var(--star);color:#3A2A00;font-weight:600;font-size:15px;white-space:nowrap}
.reward .buy[disabled]{background:var(--surface-2);color:var(--muted);cursor:not-allowed}
.reward .buy.confirm{background:var(--primary);color:var(--primary-ink)}
.rewards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}

/* Penalty */
.penalty{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;border:2px solid var(--danger-soft)}
.penalty h3{font-size:20px;color:var(--danger)}
.penalty p{margin:0;font-size:14px;color:var(--muted)}
.reasons{display:flex;flex-wrap:wrap;gap:8px}
.reason{padding:10px 14px;border-radius:14px;background:var(--danger-soft);color:var(--danger);font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px}
.reason.confirm{background:var(--danger);color:#fff}

/* Bonus */
.bonus{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;border:2px solid var(--primary-soft)}
.bonus h3{font-size:20px;color:var(--primary)}
.bonus p{margin:0;font-size:14px;color:var(--muted)}
.amts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:600}
.amt{min-width:52px;padding:8px 12px;border-radius:14px;background:var(--surface-2);border:2px solid var(--line);font-weight:700;display:flex;align-items:center;gap:4px;justify-content:center}
.amt svg{width:16px;height:16px}
.amt[aria-pressed="true"]{background:var(--star-soft);border-color:var(--star);color:var(--star-ink)}
.goods{display:flex;flex-wrap:wrap;gap:8px}
.good{padding:10px 14px;border-radius:14px;background:var(--primary-soft);color:var(--primary);font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px}
.good.confirm{background:var(--primary);color:var(--primary-ink)}

/* Ollie (English) */
.tab .ic svg{width:46px;height:46px}
.tab.ollie .ic{background:#FFF3C9}
#ollie{position:fixed;inset:0;z-index:30;background:#EDF4F9;display:flex;flex-direction:column}
.ollie-bar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:#FFFFFF;color:#13302C;border-bottom:1px solid #D4E1EB}
.ollie-bar button{padding:8px 14px;border-radius:12px;background:#14806B;color:#fff;font-weight:600}
.ollie-bar .ob{flex:1;display:flex;align-items:center;gap:6px;justify-content:flex-end;font-weight:700;color:#6B4E00}
.ollie-bar .ob svg{width:22px;height:22px}
#ollie iframe{flex:1;width:100%;border:0;display:block}

/* Log */
.log{background:var(--surface);border-radius:var(--r);padding:6px 16px}
.log ol{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.log li:last-child{border-bottom:0}
.log .t{font-size:12px;color:var(--muted)}
.log .d{grid-row:1/3;grid-column:2;font-weight:700;font-family:var(--display);font-size:20px;align-self:center}
.log .plus{color:var(--primary)} .log .minus{color:var(--danger)} .log .spend{color:var(--star-ink)}
.empty{color:var(--muted);text-align:center;padding:20px 0;font-size:14px}

.section{display:flex;flex-direction:column;gap:14px}
.foot{font-size:12px;color:var(--muted);text-align:center}
.toast{position:fixed;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:500;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.namebox{display:flex;gap:8px;align-items:center}
.namebox input{font:inherit;font-family:var(--display);font-size:24px;font-weight:700;width:min(220px,50vw);padding:4px 10px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink)}
.namebox button{padding:8px 14px;border-radius:12px;background:var(--primary);color:var(--primary-ink);font-weight:600}

@media (max-width:560px){
  .hero{grid-template-columns:1fr}
  .bank{justify-self:start}
  .grid{grid-template-columns:1fr}
  .reward{grid-template-columns:auto 1fr}
  .reward .buy{grid-row:auto;grid-column:1/-1;justify-self:stretch}
  .reward .rbar{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<title>مغامرة الإنجليزية مع أولي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one centered column; worlds stack like toy blocks, each world's lessons wind down a path */
:root{
  --bg:#EDF4F9; --paper:#FFFFFF; --ink:#172636; --muted:#5A6C7D; --line:#D4E1EB;
  --sun:#FFBE2E; --sun-deep:#B37600;
  --good:#1C9F5F; --good-soft:#DDF5E8; --bad:#DD444A; --bad-soft:#FCE4E5;
  --lv:#2E8BC9; --lv-deep:#1C5F8C; --lv-soft:#E0EEF8;
  --f-ui:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;
  --f-en:"Andika","Baloo Bhaijaan 2",Verdana,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
[dir="ltr"]{font-family:var(--f-en)}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.fill{fill:currentColor;stroke:none}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;gap:10px;padding-block:10px;background:var(--bg)}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--paper);box-shadow:0 3px 0 var(--line)}
.iconbtn.ph{visibility:hidden}
.bar-t{unicode-bidi:plaintext;flex:1;min-width:0;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.pill{display:flex;align-items:center;gap:4px;background:var(--paper);padding:6px 12px;border-radius:999px;box-shadow:0 3px 0 var(--line);color:var(--sun-deep);font-weight:800;font-variant-numeric:tabular-nums}
.pill .ico{color:var(--sun)}

/* home */
.hero{display:flex;gap:14px;align-items:center;padding-block:8px 18px}
.owl{font-size:58px;line-height:1;width:84px;height:84px;display:grid;place-items:center;background:var(--paper);border-radius:28px;box-shadow:0 5px 0 var(--line);flex:none}
.hello{font-weight:800;font-size:22px}
.hero h1{font-size:17px;font-weight:700;color:var(--lv-deep)}
.muted{color:var(--muted);font-size:14px}
.worlds{display:flex;flex-direction:column;gap:16px}
.world{display:flex;align-items:center;gap:14px;text-align:start;background:var(--paper);border-radius:22px;padding:14px;box-shadow:0 6px 0 var(--lv-deep);border:2px solid var(--lv);transition:transform .12s}
.world:active{transform:translateY(4px);box-shadow:0 2px 0 var(--lv-deep)}
.w-art{font-size:40px;width:66px;height:66px;border-radius:20px;background:var(--lv-soft);display:grid;place-items:center;flex:none}
.w-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.w-txt b{font-size:19px}
.w-txt i{font-style:normal;color:var(--lv-deep);font-weight:700;font-size:14px}
.w-txt small{color:var(--muted);font-size:13px}
.w-num{font-weight:800;color:var(--lv-deep);font-size:13px;position:absolute}
.prog{height:8px;background:var(--lv-soft);border-radius:9px;overflow:hidden;margin-block:4px 2px}
.prog span{display:block;height:100%;background:var(--lv);border-radius:9px}
.locked{filter:grayscale(1);opacity:.55}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.ghost{background:var(--paper);border-radius:14px;padding:10px 14px;font-weight:700;box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.ghost:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.go{background:var(--lv);color:#fff;border-radius:14px;padding:11px 18px;font-weight:800;box-shadow:0 5px 0 var(--lv-deep)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--lv-deep)}
.go:disabled{opacity:.45}

/* level path */
.lv-hero{display:flex;gap:14px;align-items:center;background:var(--lv);color:#fff;border-radius:24px;padding:16px;margin-block:4px 22px;box-shadow:0 6px 0 var(--lv-deep)}
.lv-art{font-size:46px;width:72px;height:72px;border-radius:22px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.04em;opacity:.9}
.lv-hero h1{font-size:24px}
.path{position:relative;display:flex;flex-direction:column;gap:18px;padding-block:6px}
.path::before{content:"";position:absolute;inset-block:30px;inset-inline-start:50%;border-inline-start:4px dashed var(--line)}
.node{position:relative;display:flex;align-items:center;gap:12px;text-align:start;width:min(100%,290px)}
.pos0{margin-inline-start:0}.pos1{margin-inline-start:18%}.pos2{margin-inline-start:34%}.pos3{margin-inline-start:12%}
.disc{width:72px;height:72px;border-radius:50%;background:var(--lv);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:800;box-shadow:0 6px 0 var(--lv-deep);flex:none;border:4px solid var(--paper)}
.node.done .disc{background:var(--sun);color:var(--ink);box-shadow:0 6px 0 var(--sun-deep)}
.node.locked .disc{background:#B8C4CE;box-shadow:0 6px 0 #8E9BA6}
.nlab{background:var(--paper);border-radius:16px;padding:8px 12px;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;min-width:0}
.nlab b{font-size:16px}
.nlab small{color:var(--muted)}
.nst{display:flex;align-items:center;gap:3px;color:var(--sun-deep);font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.nst .ico{width:15px;height:15px;color:var(--sun)}
.node.boss .disc{width:86px;height:86px;background:#1F2A37;color:var(--sun);box-shadow:0 6px 0 #000}
.node.boss .disc .ico{width:38px;height:38px}

/* lesson */
.les-h{padding-block:6px 14px}
.les-h h1{font-size:28px;color:var(--lv-deep)}

/* ---------- conversation ---------- */
function actConv(){
 const L=cur(),token=RUN;let t=0,mis=0;
 h(actTitle('محادثة'),lesson,`<div class="pane"><p class="tip">استمع إلى أولي، اختر الرد الصحيح، ثم قله بصوتك.</p><div class="chat" id="chat" dir="ltr"></div><div class="opts" id="opts" dir="ltr"></div></div>`);
 const chat=$('#chat'),opts=$('#opts');
 function bubble(who,text){const d=document.createElement('div');d.className='bub '+who;
  d.innerHTML=`<span class="av">${who==='bot'?BIRD(36):'🧒'}</span><p>${esc(text)}</p><button class="spk sm" aria-label="استمع" data-say="${esc(text)}"${who==='kid'?' data-pitch="1.3"':''}>${icon('spk')}</button>`;
  chat.appendChild(d);}
 function turn(){
  if(token!==RUN)return;const[q,...o]=L.c[t];bubble('bot',q);say(q);
  opts.innerHTML=shuffle(o.map((x,k)=>({x,k}))).map(z=>`<button class="opt" data-k="${z.k}">${esc(z.x)}</button>`).join('');
  opts.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
   if(b.dataset.k==='0'){ding();bubble('kid',o[0]);say(o[0],{pitch:1.3});
    opts.innerHTML=`<div class="repeat" dir="rtl"><p>🎤 الآن قلها بصوتك:</p><p dir="ltr" style="font-size:19px;font-weight:700">${esc(o[0])}</p><div class="btns"><button class="ghost" data-say="${esc(o[0])}" data-pitch="1.3">اسمعها مرة أخرى</button><button class="go" id="nx">${t<L.c.length-1?'قلتها! التالي':'قلتها! إنهاء'}</button></div></div>`;
    opts.scrollIntoView({behavior:'smooth',block:'end'});
    $('#nx').onclick=()=>{t++;t<L.c.length?turn():finish('c',starsFrom(mis,0,1))};
   }else if(!b.classList.contains('wrong')){b.classList.add('wrong');mis++;buzz()}
  });
 }
 turn();
}

function quiz(box,qs,onAll){

 box.innerHTML=qs.map(q=>`<div class="q"><div class="q-h" dir="ltr"><button class="spk sm" aria-label="استمع للسؤال" data-say="${esc(q[0])}">${icon('spk')}</button><span>${esc(q[0])}</span></div><div class="q-o" dir="ltr">${shuffle(q.slice(1).map((t,k)=>({t,k}))).map(o=>`<button class="opt" data-k="${o.k}">${esc(o.t)}</button>`).join('')}</div></div>`).join('');
 box.querySelectorAll('.q').forEach(qd=>qd.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
  if(qd.classList.contains('ok'))return;
  if(b.dataset.k==='0'){b.classList.add('right');qd.classList.add('ok');ding();if(!--left)onAll(mis)}
  else if(!b.classList.contains('wrong')){b.classList.add('wrong');mis++;buzz()}
 }));
}

/* ---------- games ---------- */
function actGame(){
 const L=cur(),lv=LV[ctx.l],g=lv.games[ctx.i],token=RUN,t0=Date.now();
 h(actTitle('لعبة'),lesson,`<div class="pane"><div class="g-head"><b>${GN[g]}</b><span id="gs"></span></div><div id="g" class="pane"></div></div>`);

 const done=s=>{if(token===RUN)finish('g',s)};

const G=html=>{$('#g').innerHTML=html};

function gMatch(L,done){
 const vs=shuffle(V(L));let sel=null,mis=0,left=vs.length;
 G(`<p class="tip">اضغط على الكلمة ثم على صورتها.</p><div class="match"><div class="col" dir="ltr">${vs.map((v,k)=>`<button class="tile wd" data-k="${k}">${esc(v.en)}</button>`).join('')}</div><div class="col">${shuffle(vs.map((v,k)=>k)).map(k=>`<button class="tile em" data-k="${k}">${vs[k].em}</button>`).join('')}</div></div>`);
 $$('#g .wd').forEach(b=>b.onclick=()=>{$$('#g .wd').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b;say(vs[+b.dataset.k].en)});
 $$('#g .em').forEach(b=>b.onclick=()=>{if(!sel)return toast('اختر كلمة أولًا');
  if(sel.dataset.k===b.dataset.k){ding();sel.classList.add('gone');b.classList.add('gone');sel=null;if(!--left)setTimeout(()=>done(starsFrom(mis,0,2)),400)}
  else{buzz();mis++;b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400)}});
}

function gMemory(L,done){
 const vs=shuffle(V(L));const cards=shuffle(vs.flatMap((v,k)=>[{k,w:1,s:v.en},{k,w:0,s:v.em}]));let open=[],lock=false,mis=0,found=0;
 G(`<p class="tip">اقلب بطاقتين وابحث عن الكلمة وصورتها.</p><div class="mem">${cards.map((c,n)=>`<button class="card" data-n="${n}"><span class="front ${c.w?'en':''}" ${c.w?'dir="ltr"':''}>${esc(c.s)}</span><span class="back">?</span></button>`).join('')}</div>`);
 $$('#g .card').forEach(b=>b.onclick=()=>{if(lock||b.classList.contains('up'))return;const c=cards[+b.dataset.n];b.classList.add('up');if(c.w)say(c.s);open.push([b,c]);
  if(open.length===2){const[[b1,c1],[b2,c2]]=open;open=[];
   if(c1.k===c2.k){b1.classList.add('got');b2.classList.add('got');ding();say(vs[c1.k].en);if(++found===vs.length)setTimeout(()=>done(mis<=4?3:mis<=9?2:1),700)}
   else{lock=true;mis++;setTimeout(()=>{b1.classList.remove('up');b2.classList.remove('up');lock=false},900)}}});
}

function gListen(L,done){
 const all=V(L),rounds=shuffle(all);let r=0,mis=0;
 function round(){const v=rounds[r],opts=shuffle([v,...shuffle(all.filter(x=>x!==v)).slice(0,3)]);
  G(`<p class="tip">استمع واختر الصورة الصحيحة (${r+1} من ${rounds.length})</p><button class="play" data-say="${esc(v.en)}">${icon('spk')}<span>اسمع الكلمة</span></button><div class="grid4">${opts.map(o=>`<button class="tile em big" data-en="${esc(o.en)}">${o.em}</button>`).join('')}</div>`);
  setTimeout(()=>say(v.en),300);
  $$('#g .tile').forEach(b=>b.onclick=()=>{if(b.dataset.en===v.en){b.classList.add('right');ding();setTimeout(()=>{++r<rounds.length?round():done(starsFrom(mis,0,2))},700)}else if(!b.classList.contains('wrong')){b.classList.add('wrong');mis++;buzz()}});}
 round();
}

function gUnscr(L,done){
 const ws=shuffle(V(L).filter(v=>/^[a-z]+$/i.test(v.en)&&v.en.length<=11)).slice(0,5);let r=0,mis=0;
 function round(){const v=ws[r],word=v.en.toLowerCase();let letters,tries=0;do{letters=shuffle(word.split(''))}while(letters.join('')===word&&++tries<8);let ans=[];
  G(`<p class="tip">رتّب الحروف لتكتب الكلمة (${r+1} من ${ws.length})</p><div class="clue"><span class="big-em">${v.em}</span><span>${esc(v.ar)}</span><button class="spk" aria-label="استمع" data-say="${esc(v.en)}">${icon('spk')}</button></div><div class="slots" dir="ltr" id="sl"></div><div class="tiles" dir="ltr" id="tl"></div><div class="btns"><button class="ghost" id="clr">امسح</button></div>`);
  function draw(){$('#sl').innerHTML=letters.map((_,n)=>`<span class="slot">${ans[n]!==undefined?letters[ans[n]]:''}</span>`).join('');
   $('#tl').innerHTML=letters.map((ch,n)=>`<button class="ltr" data-n="${n}" ${ans.includes(n)?'disabled':''}>${ch}</button>`).join('');
   $$('#tl .ltr').forEach(b=>b.onclick=()=>{ans.push(+b.dataset.n);draw();if(ans.length===letters.length)check()})}
  function check(){if(ans.map(n=>letters[n]).join('')===word){ding();say(v.en);$('#sl').classList.add('ok');setTimeout(()=>{++r<ws.length?round():done(starsFrom(mis,0,2))},900)}
   else{buzz();mis++;$('#sl').classList.add('shake');setTimeout(()=>{ans=[];draw();$('#sl').classList.remove('shake')},600)}}
  $('#clr').onclick=()=>{ans=[];draw()};draw();}
 round();
}

function gSpell(L,done){
 const ws=shuffle(V(L).filter(v=>/^[a-z' ]+$/i.test(v.en))).slice(0,5);let r=0,mis=0;
 function round(){const v=ws[r];let hint=0,wrong=0;
  G(`<p class="tip">اسمع الكلمة واكتبها بالإنجليزية (${r+1} من ${ws.length})</p><div class="clue"><span class="big-em">${v.em}</span><span>${esc(v.ar)}</span><button class="spk" aria-label="استمع" data-say="${esc(v.en)}">${icon('spk')}</button></div><input id="sp" class="inp" dir="ltr" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="type here"><p class="hintline" dir="ltr" id="hl"></p><div class="btns"><button class="ghost" id="hb">تلميح</button><button class="go" id="ck">تحقّق</button></div>`);
  setTimeout(()=>say(v.en),300);const inp=$('#sp');
  const showHint=()=>{$('#hl').textContent=v.en.slice(0,hint)+' _'.repeat(Math.max(0,v.en.length-hint))};
  $('#hb').onclick=()=>{if(hint<v.en.length){hint++;mis+=.5;showHint()}};
  const ck=()=>{if(inp.value.trim().toLowerCase()===v.en.toLowerCase()){ding();say(v.en);inp.classList.add('right');setTimeout(()=>{++r<ws.length?round():done(starsFrom(mis,0,2))},800)}
   else{buzz();mis++;wrong++;inp.classList.add('shake');setTimeout(()=>inp.classList.remove('shake'),400);if(wrong>=2){hint=v.en.length;showHint();toast('انظر للكلمة واكتبها')}}};
  $('#ck').onclick=ck;inp.onkeydown=e=>{if(e.key==='Enter')ck()};}
 round();
}

function gSentence(L,done){
 const ss=L.c.map(c=>c[1]);let r=0,mis=0;
 function round(){const s=ss[r],toks=s.split(' ');let order,tries=0;do{order=shuffle(toks.map((_,n)=>n))}while(order.every((n,k)=>n===k)&&++tries<8);let ans=[];
  G(`<p class="tip">رتّب الكلمات لتكوّن جملة صحيحة (${r+1} من ${ss.length})</p><button class="ghost" data-say="${esc(s)}">اسمع الجملة</button><div class="sent" dir="ltr" id="sa"></div><div class="tiles" dir="ltr" id="st"></div><div class="btns"><button class="ghost" id="clr">امسح</button></div>`);
  function draw(){$('#sa').innerHTML=ans.map((n,k)=>`<button class="tok" data-k="${k}">${esc(toks[n])}</button>`).join('');
   $('#st').innerHTML=order.map(n=>`<button class="tok" data-n="${n}" ${ans.includes(n)?'disabled':''}>${esc(toks[n])}</button>`).join('');
   $$('#sa .tok').forEach(b=>b.onclick=()=>{ans.splice(+b.dataset.k,1);draw()});
   $$('#st .tok').forEach(b=>b.onclick=()=>{ans.push(+b.dataset.n);draw();if(ans.length===toks.length)check()})}
  function check(){if(ans.map(n=>toks[n]).join(' ')===s){ding();say(s);$('#sa').classList.add('ok');setTimeout(()=>{++r<ss.length?round():done(starsFrom(mis,0,2))},1300)}
   else{buzz();mis++;$('#sa').classList.add('shake');setTimeout(()=>{$('#sa').classList.remove('shake')},500)}}
  $('#clr').onclick=()=>{ans=[];draw()};draw();}
 round();
}

function gPop(L,done,token){
 const all=V(L),rounds=shuffle([...all,...shuffle(all).slice(0,2)]);let r=0,mis=0;const speed=34+ctx.l*12,extra=ctx.l>=2?3:2;
 G(`<p class="tip">اضغط الفقاعة التي تحمل اسم الصورة قبل أن تطير!</p><div class="target" id="tg"></div><div class="field" id="fd" dir="ltr"></div><p class="muted" id="pr" style="text-align:center"></p>`);
 const fd=$('#fd');
 function next(){++r<rounds.length?round():done(starsFrom(mis,0,2))}
 function round(){if(token!==RUN)return;const v=rounds[r];
  $('#tg').innerHTML=`<span class="big-em">${v.em}</span><span>${esc(v.ar)}</span>`;$('#pr').textContent=`${r+1} / ${rounds.length}`;
  fd.innerHTML='';const opts=shuffle([v,...shuffle(all.filter(x=>x.en!==v.en)).slice(0,extra)]);
  const W=fd.clientWidth,H=fd.clientHeight,lane=W/opts.length,lift=shuffle(opts.map((_,n)=>n));let over=false,last=performance.now();
  const bs=opts.map((o,n)=>{const b=document.createElement('button');b.className='bubble';b.textContent=o.en;fd.appendChild(b);const bw=b.offsetWidth;
   const z={b,o,x:Math.max(4,Math.min(W-bw-4,lane*n+(lane-bw)/2)),y:H+10+lift[n]*55,alive:true};
   b.onclick=()=>{if(over||!z.alive)return;if(o.en===v.en){over=true;b.classList.add('popped');ding();say(v.en);setTimeout(next,650)}else{z.alive=false;b.classList.add('miss');mis++;buzz()}};return z});
  function step(now){if(token!==RUN||over)return;const dt=Math.min(.05,(now-last)/1000);last=now;let gone=false;
   bs.forEach(z=>{z.y-=speed*dt;z.b.style.transform=`translate(${z.x}px,${z.y}px)`;if(z.o.en===v.en&&z.y<-60)gone=true});
   if(gone){over=true;mis++;buzz();toast(`الكلمة كانت: ${v.en}`);setTimeout(next,700);return}
   requestAnimationFrame(step)}
  requestAnimationFrame(step);}
 round();
}

/* ---------- boss challenge ---------- */
function bossIntro(){
 stopAll();const lv=LV[ctx.l],T=Math.max(7,12-ctx.l);
 h(lv.boss,level,`<div class="pane"><div class="intro"><div class="boss-head"><span>${icon('crown')}</span><b style="flex:1">${lv.boss}</b></div>
 <ul><li>12 سؤالًا من كلمات العالم كله.</li><li>لكل سؤال ${T} ثوانٍ فقط.</li><li>أسئلة بالصورة، والصوت، والترجمة.</li><li>أجب عن 5 أسئلة على الأقل لتفتح العالم التالي، و11 لتأخذ 3 نجوم.</li></ul>
 <button class="go" id="bgo">أنا مستعد!</button></div></div>`);
 $('#bgo').onclick=boss;
}
function boss(){
 stopAll();const lv=LV[ctx.l],token=RUN,all=lv.lessons.flatMap(V),qs=shuffle(all).slice(0,12),T=Math.max(7,12-ctx.l);let n=0,score=0;
 h(lv.boss,level,`<div class="pane"><div class="boss-head"><b id="bn"></b><span id="bs" class="pill"></span></div><div class="timer"><span id="tb"></span></div><div id="bq" class="pane"></div></div>`);
 function q(){
  if(token!==RUN)return;
  if(n>=qs.length)return finish('boss',score>=11?3:score>=8?2:score>=5?1:0,score);
  const v=qs[n],type=n%3,opts=shuffle([v,...shuffle(all.filter(x=>x.en!==v.en&&x.em!==v.em&&x.ar!==v.ar)).slice(0,3)]);
  $('#bn').textContent=`سؤال ${n+1} من ${qs.length}`;$('#bs').textContent=`✔ ${score}`;
  const enOpts=`<div class="q-o" dir="ltr">${opts.map(o=>`<button class="opt" data-en="${esc(o.en)}">${esc(o.en)}</button>`).join('')}</div>`;
  $('#bq').innerHTML=type===0?`<div class="bprompt"><span class="big-em">${v.em}</span><p>ما اسمها بالإنجليزية؟</p></div>${enOpts}`
   :type===1?`<div class="bprompt"><button class="play" data-say="${esc(v.en)}">${icon('spk')}<span>اسمع</span></button><p>اختر الصورة الصحيحة</p></div><div class="grid4">${opts.map(o=>`<button class="tile em big" data-en="${esc(o.en)}">${o.em}</button>`).join('')}</div>`
   :`<div class="bprompt"><span class="ar-word">${esc(v.ar)}</span><p>اختر الكلمة الإنجليزية</p></div>${enOpts}`;
  if(type===1)setTimeout(()=>say(v.en),250);
  let over=false;const start=performance.now(),tb=$('#tb');
  const reveal=()=>$$('#bq [data-en]').forEach(b=>{if(b.dataset.en===v.en)b.classList.add('right')});
  (function tick(now){if(token!==RUN||over)return;const p=Math.max(0,1-(now-start)/(T*1000));tb.style.width=p*100+'%';
   if(p<=0){over=true;buzz();reveal();setTimeout(()=>{n++;q()},1000);return}requestAnimationFrame(tick)})(start);
  $$('#bq [data-en]').forEach(b=>b.onclick=()=>{if(over)return;over=true;
   if(b.dataset.en===v.en){b.classList.add('right');score++;ding()}else{b.classList.add('wrong');buzz();reveal()}
   setTimeout(()=>{n++;q()},850)});
 }
 q();
}

/* ---------- results ---------- */
function finish(a,stars,score){
 stopAll();const k=a==='boss'?bossKey(ctx.l):`${ctx.l}-${ctx.i}-${a}`,prev=P.s[k]||0;
 let got=0;if(stars>prev){P.s[k]=stars;save();try{if(LINK)got=LINK.gain(stars-prev)||0}catch(e){}}
 const msg=[['حاول مرة أخرى','Try again!'],['أحسنت!','Good try!'],['رائع!','Great job!'],['ممتاز!','Excellent!']][stars];
 const order=['c','l','r','g'];let nextLbl,nextFn;
 if(a==='boss'){
  if(stars&&ctx.l<LV.length-1){nextLbl=`ادخل ${LV[ctx.l+1].ar}`;nextFn=()=>{ctx.l++;level()}}
  else if(stars){nextLbl='العودة إلى الخريطة';nextFn=home}
 }else{const ix=order.indexOf(a);
  if(ix<3){nextLbl='النشاط التالي';nextFn=()=>startAct(order[ix+1])}
  else if(ctx.i<5&&lessonUnlocked(ctx.l,ctx.i+1)){nextLbl='الدرس التالي';nextFn=()=>{ctx.i++;lesson()}}
  else if(ctx.i===5&&bossUnlocked(ctx.l)){nextLbl='إلى تحدي العالم';nextFn=bossIntro}
 }
 const back=a==='boss'?level:lesson;
 h(a==='boss'?LV[ctx.l].boss:esc(cur().en),back,`<div class="result">
  <div class="bigstars">${Array.from({length:3},(_,k)=>`<svg class="ico fill${k<stars?' on':''}" viewBox="0 0 24 24">${IC.star}</svg>`).join('')}</div>
  <h2>${msg[0]}</h2><p dir="ltr" style="font-size:20px;font-weight:700">${msg[1]}</p>
  ${a==='boss'?`<p class="muted">أجبت عن ${score} من 12</p>`:''}
  ${stars>prev&&prev?`<p class="muted">رقم قياسي جديد!</p>`:''}
  ${got?`<p class="gift">+${got} ${got===1?'نجمة أُضيفت':'نجوم أُضيفت'} إلى لوحة النجوم!</p>`:''}
  ${a==='boss'&&stars&&ctx.l===LV.length-1?`<p style="font-weight:800">أنهيت العوالم الخمسة كلها. أنت بطل الإنجليزية! 🏆</p>`:''}
  <div class="btns">${nextFn?`<button class="go" id="nx">${nextLbl}</button>`:''}<button class="ghost" id="again">أعد المحاولة</button><button class="ghost" id="bk">رجوع</button></div></div>`);
 say(msg[1],{rate:.9,pitch:1.2});
 if(nextFn)$('#nx').onclick=()=>{stopAll();nextFn()};
 $('#again').onclick=()=>a==='boss'?boss():startAct(a);
 $('#bk').onclick=()=>{stopAll();back()};
 if(stars===3)confetti();
}

  <li>يعتمد الصوت على متصفح الجهاز. إذا لم تسمع شيئًا على الآيفون، أطفئ الوضع الصامت وارفع الصوت.</li>
  <li>التقدم محفوظ على هذا الجهاز وهذا المتصفح فقط.</li></ul></div>
 <div class="panel"><div class="switch"><span>فتح كل العوالم والدروس</span><button class="ghost" id="ua">${P.all?'مفتوحة · أقفلها':'افتحها'}</button></div><p class="muted">مفيد إذا كان طفلك يعرف المستوى الأول ويريد البدء من مستوى أعلى.</p></div>
 <div class="panel"><h3>البدء من جديد</h3><div id="rz"><button class="ghost danger" id="rs">مسح كل التقدم</button></div></div>`);
 $('#svn').onclick=()=>{P.name=$('#nm').value.trim().slice(0,24);save();toast('تم الحفظ')};
 $('#ua').onclick=()=>{P.all=!P.all;save();parents()};
 $('#rs').onclick=()=>{$('#rz').innerHTML=`<p>هل أنت متأكد؟ ستُمسح كل النجوم.</p><div class="btns"><button class="go" id="yes" style="background:var(--bad);box-shadow:0 5px 0 #8f2226">نعم، امسح</button><button class="ghost" id="no">إلغاء</button></div>`;
  $('#yes').onclick=()=>{P.s={};save();toast('تم مسح التقدم');parents()};$('#no').onclick=parents};
}

/* ---------- confetti ---------- */
function confetti(){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const cols=['#FFBE2E','#27A85A','#2B6FCC','#E0702A','#6447D1','#DD444A'];
 const ps=Array.from({length:110},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6.28,s:5+Math.random()*6,c:cols[Math.random()*6|0]}));
 const end=performance.now()+2600;
 (function f(now){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
  if(now<end)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})(performance.now());
}

document.documentElement.dir='rtl';document.documentElement.lang='ar';
home();
</script>

</template>

<script>
const STAR='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="var(--star)" d="M12 2.3l2.95 6 6.6.96-4.78 4.65 1.13 6.57L12 17.38l-5.9 3.1 1.13-6.57L2.45 9.26l6.6-.96z"/></svg>';
const CHECK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const SECTIONS=[
 {id:'morning',name:'الصباح',ic:'🌤️',sub:'من الاستيقاظ حتى الخروج',tasks:[
  {id:'gm_mom',e:'👩',n:'صباح الخير يا أمي',p:1},
  {id:'gm_dad',e:'👨',n:'صباح الخير يا أبي',p:1},
  {id:'brush_am',e:'🪥',n:'تفريش الأسنان بعد الاستيقاظ',p:1},
  {id:'wudu_fajr',e:'💧',n:'وضوء الفجر',p:1},
  {id:'fajr',e:'🕌',n:'صلاة الفجر',p:2,pr:1},
  {id:'adhkar_am',e:'📿',n:'أذكار الصباح',p:1},
 ]},
 {id:'day',name:'النهار',ic:'☀️',sub:'الظهر والعصر والدراسة',tasks:[
  {id:'wudu_dhuhr',e:'💧',n:'وضوء الظهر',p:1},
  {id:'dhuhr',e:'🕌',n:'صلاة الظهر',p:2,pr:1},
  {id:'wudu_asr',e:'💧',n:'وضوء العصر',p:1},
  {id:'asr',e:'🕌',n:'صلاة العصر',p:2,pr:1},
  {id:'homework',e:'✏️',n:'حل الواجبات',p:1},
  {id:'quran',e:'📖',n:'حفظ ورد اليوم من القرآن',p:2,pr:1},
  {id:'toys',e:'🧸',n:'ترتيب الألعاب',p:1},
 ]},
 {id:'evening',name:'المساء',ic:'🌙',sub:'حتى موعد النوم',tasks:[
  {id:'adhkar_pm',e:'📿',n:'أذكار المساء',p:1},
  {id:'wudu_maghrib',e:'💧',n:'وضوء المغرب',p:1},
  {id:'maghrib',e:'🕌',n:'صلاة المغرب',p:2,pr:1},
  {id:'wudu_isha',e:'💧',n:'وضوء العشاء',p:1},
  {id:'isha',e:'🕌',n:'صلاة العشاء',p:2,pr:1},
  {id:'brush_pm',e:'🪥',n:'تفريش الأسنان قبل النوم',p:1},
 ]},
];
const BATH_MAX=6;
const REWARDS=[
 {tier:'مكافآت خفيفة',hint:'تُشترى في نفس اليوم',items:[
  {id:'choco',e:'🍫',n:'شوكولاتة',c:8},
  {id:'chips',e:'🥔',n:'شيبس',c:8},
  {id:'yt',e:'📺',n:'مشاهدة يوتيوب ٢٠ دقيقة',c:25},
  {id:'ps30',e:'🎮',n:'لعب بلايستيشن نصف ساعة',c:30},
 ]},
 {tier:'مكافآت متوسطة',hint:'تحتاج أسبوعًا تقريبًا',items:[
  {id:'meal',e:'🍔',n:'طلب وجبة من مطعم',c:60},
 ]},
 {tier:'مكافآت كبيرة',hint:'تحتاج صبرًا وجمعًا طويلًا',items:[
  {id:'toy',e:'🪀',n:'شراء لعبة من المتجر',c:200},
  {id:'psgame',e:'💿',n:'شراء لعبة بلايستيشن',c:400},
 ]},
];
const GOODS=['ساعد إخوته','ساعد في البيت','أدب ولطف مميز','صدق في كلامه','شارك ألعابه','تفوّق في الدراسة','عمل مميز آخر'];
const BIRD='<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M27 15c-1-6 3-10 8-9-3 2-4 5-3 8z" fill="#F29E1F"/><path d="M33 13c2-5 7-6 10-4-3 1-5 3-6 6z" fill="#F29E1F"/><ellipse cx="31" cy="37" rx="22" ry="20" fill="#FFC23B"/><ellipse cx="33" cy="44" rx="13" ry="10" fill="#FFE7A3"/><path d="M11 36c-6 1-9 6-9 10 6 1 12-2 15-6z" fill="#F29E1F"/><path d="M18 37c3 9 14 12 19 7-4-2-11-9-19-7z" fill="#E8901A"/><circle cx="40" cy="29" r="5" fill="#1A2A3A"/><circle cx="41.8" cy="27.2" r="1.7" fill="#fff"/><path d="M50 31l11 3.5L50 38z" fill="#F0702A"/><circle cx="45" cy="38" r="3.2" fill="#FF8A80" opacity=".55"/><path d="M26 56v5M34 56v5" stroke="#F0702A" stroke-width="2.6" stroke-linecap="round"/></svg>';
let bonusAmt=1;
const REASONS=['عدم سماع الكلام','كلام غير لائق','شجار مع الإخوة','عناد','تأخير الصلاة','خطأ آخر'];
const ALL=Object.fromEntries(SECTIONS.flatMap(s=>s.tasks.map(t=>[t.id,t])));
const DAY_TOTAL=SECTIONS.reduce((a,s)=>a+s.tasks.length,0);

const dayKey=()=>new Date().toLocaleDateString('en-CA');
let state={name:'بطلنا',stars:0,day:dayKey(),done:{},bath:0,log:[]};
let tab='morning', armed=null, armTimer=null;

function today(){ // daily tasks reset, stars stay
  if(state.day!==dayKey()){state.day=dayKey();state.done={};state.bath=0;}
}
function addLog(text,delta,kind){
  state.log.unshift({at:Date.now(),text,delta,kind});
  state.log=state.log.slice(0,60);
}

/* ---------- persistence: shared db when available, browser storage as backup ---------- */
let docRef=null, writing=false, again=false;
function local(save){try{if(save)localStorage.setItem('starboard',JSON.stringify(state));else{const s=localStorage.getItem('starboard');if(s)state=Object.assign(state,JSON.parse(s));}}catch(e){}}
async function persist(){
  local(true);
  if(!docRef)return;
  if(writing){again=true;return;}
  writing=true;
  try{await docRef.set(JSON.parse(JSON.stringify(state)));}catch(e){toast('تعذّر الحفظ على الخادم، حُفظ على هذا الجهاز');}
  writing=false;
  if(again){again=false;persist();}
}
(async()=>{
  try{
    const db=await window.claude?.use?.('db');
    if(!db)return;
    docRef=db.doc('board/main');
    docRef.onSnapshot(snap=>{
      if(writing||again||!snap.exists)return;
      state=Object.assign({name:'بطلنا',stars:0,day:dayKey(),done:{},bath:0,log:[]},snap.data());
      local(true);render();
    },()=>{});
  }catch(e){}
})();

/* ---------- actions ---------- */
function toggleTask(id){
  today();const t=ALL[id];
  if(state.done[id]){delete state.done[id];state.stars=Math.max(0,state.stars-t.p);addLog('إلغاء: '+t.n,-t.p,'minus');pulse('drop');}
  else{state.done[id]=Date.now();state.stars+=t.p;addLog(t.n,t.p,'plus');pulse('bump');toast('أحسنت! +'+t.p+(t.p>1?' نجمتان':' نجمة'));}
  persist();render();
}
function bath(i){
  today();
  if(i<state.bath){ if(i===state.bath-1){state.bath--;state.stars=Math.max(0,state.stars-1);addLog('إلغاء: دخول الحمام',-1,'minus');pulse('drop');} else return; }
  else{state.bath++;state.stars++;addLog('دخول الحمام (مرة '+state.bath+')',1,'plus');pulse('bump');toast('ممتاز! +1 نجمة');}
  persist();render();
}
function arm(key,fn){
  if(armed===key){clearTimeout(armTimer);armed=null;fn();return;}
  armed=key;clearTimeout(armTimer);armTimer=setTimeout(()=>{armed=null;render();},3500);render();
}
function buy(r){
  arm('buy:'+r.id,()=>{
    if(state.stars<r.c)return;
    state.stars-=r.c;addLog('استبدال: '+r.n,-r.c,'spend');pulse('drop');toast('مبروك! '+r.n);persist();render();
  });
}
function penalize(reason){
  arm('pen:'+reason,()=>{
    today();state.stars=Math.max(0,state.stars-1);addLog('خصم: '+reason,-1,'minus');pulse('drop');toast('خُصمت نجمة واحدة');persist();render();
  });
}
function bonus(reason){
  const n=bonusAmt;
  arm('bon:'+reason,()=>{
    today();state.stars+=n;addLog('مكافأة: '+reason,n,'plus');pulse('bump');toast('مكافأة! +'+n+(n===1?' نجمة':n===2?' نجمتان':' نجوم'));persist();render();
  });
}
/* ---------- Ollie link: English progress lives here, 10 English stars = 1 board star ---------- */
window.OLLIE_LINK={
  load(){return state.engP?JSON.parse(JSON.stringify(state.engP)):null;},
  save(p){state.engP=JSON.parse(JSON.stringify(p));persist();},
  gain(n){
    today();state.engPts=(state.engPts||0)+n;let got=0;
    while(state.engPts>=10){state.engPts-=10;state.stars++;got++;}
    if(got){addLog('أولي: 10 نجوم في الإنجليزية'+(got>1?' ×'+got:''),got,'plus');pulse('bump');}
    persist();render();return got;
  },
  status(){return {stars:state.stars,pts:state.engPts||0,name:state.name};}
};
function openOllie(){
  let ov=document.getElementById('ollie');
  if(!ov){
    ov=document.createElement('div');ov.id='ollie';
    ov.innerHTML=`<div class="ollie-bar"><button type="button" id="ollieClose">رجوع إلى لوحة النجوم</button><span class="ob num">${STAR}<span id="ollieStars"></span></span></div><iframe title="أولي لتعلم الإنجليزية"></iframe>`;
    document.body.appendChild(ov);
    ov.querySelector('iframe').srcdoc='<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>'+document.getElementById('ollieApp').innerHTML+'</body></html>';
    document.getElementById('ollieClose').onclick=closeOllie;
  }
  ov.hidden=false;document.body.style.overflow='hidden';render();
}
function closeOllie(){
  const ov=document.getElementById('ollie');if(!ov)return;
  try{ov.querySelector('iframe').contentWindow.speechSynthesis.cancel();}catch(e){}
  ov.hidden=true;document.body.style.overflow='';render();
}
function pulse(c){const b=document.getElementById('bank');b.classList.remove('bump','drop');void b.offsetWidth;b.classList.add(c);}
let tt;function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),1800);}

/* ---------- render ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function viewState(){ // show today's view without writing on load
  if(state.day!==dayKey())return {...state,done:{},bath:0};
  return state;
}
function render(){
  const v=viewState();
  document.getElementById('stars').textContent=v.stars;
  const os=document.getElementById('ollieStars');if(os)os.textContent=v.stars;
  document.getElementById('kidName').textContent=v.name;
    document.getElementById('today').textContent=new Date().toLocaleDateString('ar-SA-u-ca-gregory-nu-latn',{weekday:'long',day:'numeric',month:'long'});
  const doneCount=Object.keys(v.done).filter(k=>ALL[k]).length;
  document.getElementById('ptext').textContent=doneCount+'/'+DAY_TOTAL;
  document.getElementById('pbar').style.width=(doneCount/DAY_TOTAL*100)+'%';

  const tabs=[...SECTIONS.map(s=>({id:s.id,name:s.name,ic:s.ic,cnt:s.tasks.filter(t=>v.done[t.id]).length+'/'+s.tasks.length})),
    {id:'shop',name:'المتجر',ic:'🎁',cnt:'استبدل نجومك'},{id:'ollie',name:'أولي',ic:BIRD,cnt:'الإنجليزية · '+(v.engPts||0)+'/10'},{id:'bonus',name:'مكافأة',ic:'🏅',cnt:'لعمل مميز'},{id:'penalty',name:'الخصم',ic:'⚠️',cnt:'نجمة لكل خطأ'},{id:'log',name:'السجل',ic:'🗒️',cnt:'آخر الحركات'}];
  document.getElementById('tabs').innerHTML=tabs.map(t=>`<button class="tab${t.id==='ollie'?' ollie':''}" role="tab" aria-selected="${t.id===tab}" data-tab="${t.id}"><div class="ic">${t.ic}</div><span>${t.name}</span><small class="cnt num">${t.cnt}</small></button>`).join('');

  const P=document.getElementById('panel');
  const sec=SECTIONS.find(s=>s.id===tab);
  if(sec){
    let h=`<div class="panel-head"><h2>${sec.name}</h2><p>${sec.sub}</p></div><div class="grid">`;
    h+=sec.tasks.map(t=>`<button class="task ${v.done[t.id]?'done':''}" data-task="${t.id}" aria-pressed="${!!v.done[t.id]}">
      ${t.pr?'<span class="tag">نجمتان</span>':''}
      <span class="emo">${t.e}</span><span class="name">${t.n}</span>
      <span class="pts">${STAR.repeat(t.p)} ${t.p}</span><span class="chk">${CHECK}</span></button>`).join('');
    if(tab==='day'||tab==='morning'||tab==='evening'){
      h+=`<div class="counter"><span class="emo">🚽</span><div class="meta"><div class="name">الذهاب إلى الحمام</div><div class="sub num">نجمة لكل مرة · ${v.bath} من ${BATH_MAX} اليوم</div></div>
      <div class="drops">${Array.from({length:BATH_MAX},(_,i)=>`<button class="drop ${i<v.bath?'on':''} num" data-bath="${i}" aria-label="المرة ${i+1}">${i<v.bath?'✓':i+1}</button>`).join('')}</div></div>`;
    }
    P.innerHTML=h+'</div>';
  }else if(tab==='shop'){
    let h=`<div class="panel-head"><h2>متجر المكافآت</h2><p>اضغط مرتين للتأكيد</p></div>`;
    h+=REWARDS.map(g=>`<div class="tier"><h3>${g.tier} <small>${g.hint}</small></h3><div class="rewards">${g.items.map(r=>{
      const ok=v.stars>=r.c, pct=Math.min(100,v.stars/r.c*100), isArm=armed==='buy:'+r.id;
      return `<div class="reward"><span class="emo">${r.e}</span><span class="name">${r.n}</span>
        <button class="buy ${isArm?'confirm':''}" data-buy="${r.id}" ${ok?'':'disabled'}>${ok?(isArm?'تأكيد الاستبدال':'استبدال'):'باقي '+(r.c-v.stars)}</button>
        <span class="cost num">${STAR} ${r.c} نجمة</span><span class="rbar"><i style="width:${pct}%"></i></span></div>`;}).join('')}</div></div>`).join('');
    P.innerHTML=h;
  }else if(tab==='bonus'){
    P.innerHTML=`<div class="panel-head"><h2>مكافأة النجوم</h2><p>للوالدين فقط</p></div>
    <div class="bonus"><h3>عمل شيئًا مميزًا؟</h3><p>اختر عدد النجوم، ثم اضغط على السبب، ثم اضغط مرة ثانية للتأكيد.</p>
    <div class="amts">عدد النجوم: ${[1,2,3].map(n=>`<button class="amt num" data-amt="${n}" aria-pressed="${bonusAmt===n}">${STAR} ${n}</button>`).join('')}</div>
    <div class="goods">${GOODS.map(r=>`<button class="good ${armed==='bon:'+r?'confirm':''}" data-bon="${esc(r)}">${armed==='bon:'+r?'تأكيد +'+bonusAmt:'+ '+r}</button>`).join('')}</div></div>`;
  }else if(tab==='penalty'){
    P.innerHTML=`<div class="panel-head"><h2>خصم النجوم</h2><p>للوالدين فقط</p></div>
    <div class="penalty"><h3>اختر سبب الخطأ</h3><p>كل ضغطة تخصم نجمة واحدة فقط. اضغط على السبب ثم اضغط مرة ثانية للتأكيد.</p>
    <div class="reasons">${REASONS.map(r=>`<button class="reason ${armed==='pen:'+r?'confirm':''}" data-pen="${esc(r)}">${armed==='pen:'+r?'تأكيد خصم نجمة':'− '+r}</button>`).join('')}</div></div>`;
  }else{
    P.innerHTML=`<div class="panel-head"><h2>السجل</h2><p>آخر ٦٠ حركة</p></div><div class="log">${v.log.length?'<ol>'+v.log.map(l=>{
      const d=new Date(l.at);return `<li><span>${esc(l.text)}</span><span class="t num">${d.toLocaleDateString('ar-SA-u-ca-gregory-nu-latn',{weekday:'short',day:'numeric',month:'short'})} · ${d.toLocaleTimeString('ar-SA-u-nu-latn',{hour:'numeric',minute:'2-digit'})}</span><span class="d num ${l.kind}">${l.delta>0?'+':''}${l.delta}</span></li>`;}).join('')+'</ol>':'<p class="empty">لا توجد حركات بعد. أول مهمة يُنجزها ستظهر هنا.</p>'}</div>`;
  }
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab==='ollie'){openOllie();return;}
  if(b.dataset.tab){tab=b.dataset.tab;armed=null;render();return;}
  if(b.dataset.task){toggleTask(b.dataset.task);return;}
  if(b.dataset.bath!==undefined){bath(+b.dataset.bath);return;}
  if(b.dataset.buy){const r=REWARDS.flatMap(g=>g.items).find(x=>x.id===b.dataset.buy);if(r)buy(r);return;}
  if(b.dataset.pen){penalize(b.dataset.pen);return;}
  if(b.dataset.amt){bonusAmt=+b.dataset.amt;armed=null;render();return;}
  if(b.dataset.bon){bonus(b.dataset.bon);return;}
});
document.getElementById('renameBtn').onclick=()=>{nameView.hidden=true;nameEdit.hidden=false;nameInput.value=state.name;nameInput.focus();};
function saveName(){const n=nameInput.value.trim();if(n){state.name=n;persist();}nameView.hidden=false;nameEdit.hidden=true;render();}
document.getElementById('nameSave').onclick=saveName;
nameInput.addEventListener('keydown',e=>{if(e.key==='Enter')saveName();});

local(false);
const h=new Date().getHours(); tab=h<11?'morning':h<17?'day':'evening';
render();
setInterval(()=>{if(state.day!==dayKey())render();},60000);
if(location.hash==='#ollie')openOllie();
window.addEventListener('hashchange',()=>{if(location.hash==='#ollie')openOllie();});
</script>
