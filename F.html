const TAG = { F: 'الفهم', V: 'القيم', G: 'الأساليب والتراكيب', E: 'الإملاء', D: 'المعجم', J: 'المعجم', M: 'المعجم', N: 'المعجم', S: 'الصنف اللغوي', L: 'الإملاء' };
function build(r) {
  const [k] = r;
  if (k === 'F' || k === 'V' || k === 'G' || k === 'E') return { t: TAG[k], s: r[1] || null, q: r[2], c: r.slice(3) };
  if (k === 'D') return { t: TAG[k], q: `ضدُّ كلمةِ <b>${r[1]}</b>:`, c: r.slice(2) };
  if (k === 'J') return { t: TAG[k], q: `جمعُ كلمةِ <b>${r[1]}</b>:`, c: r.slice(2) };
  if (k === 'M') return { t: TAG[k], q: `مفردُ كلمةِ <b>${r[1]}</b>:`, c: r.slice(2) };
  if (k === 'N') return { t: TAG[k], q: `معنى <b>${r[1]}</b>:`, c: r.slice(2) };
  if (k === 'S') return { t: TAG[k], q: `كلمةُ <b>${r[1]}</b> نوعُها:`, c: [r[2], ...['اسم', 'فعل', 'حرف'].filter(x => x !== r[2])] };
  if (k === 'L') return { t: TAG[k], q: `اللامُ في كلمةِ <b>${r[1]}</b>:`, c: r[2] === 'ش' ? ['شمسية', 'قمرية'] : ['قمرية', 'شمسية'] };
}
UNITS.forEach(u => { u.q = u.rows.map(build); });

const KEY = 'lughati-g3-300-v1';
const fresh = () => UNITS.map(() => ({ i: 0, score: 0, wrong: [] }));
let prog = fresh();
try { const s = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(s) && s.length === UNITS.length) prog = s; } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(prog)); } catch (e) {} }

const ar = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const ORD = ['الأولى', 'الثانية', 'الثالثة', 'الرابعة'];
const TOTAL = UNITS.reduce((a, u) => a + u.q.length, 0);
const card = document.getElementById('card');
const fill = document.getElementById('fill');
const scoreEl = document.getElementById('score');
const foot = document.getElementById('foot');
let cur = -1, answered = false;

function shuffle(a) { const b = a.slice(); for (let k = b.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [b[k], b[j]] = [b[j], b[k]]; } return b; }

function overall() {
  const done = prog.reduce((a, p) => a + p.i, 0);
  const sc = prog.reduce((a, p) => a + p.score, 0);
  fill.style.width = (done / TOTAL * 100) + '%';
  scoreEl.textContent = `النقاط: ${ar(sc)} من ${ar(TOTAL)}`;
}

function home() {
  cur = -1;
  overall();
  card.className = 'card';
  card.innerHTML = `
    <p class="q">اختر الوحدة لتبدأ</p>
    <div class="units">
      ${UNITS.map((u, k) => {
        const p = prog[k], n = u.q.length, done = p.i >= n;
        return `<button class="unit${done ? ' done' : ''}" id="unit-${k}" data-k="${k}">
          <span class="top"><span class="n">الوحدة ${ORD[k]}</span><span class="meta">${done ? `انتهت · ${ar(p.score)} من ${ar(n)}` : p.i ? `أكمل من السؤال ${ar(p.i + 1)}` : `${ar(n)} سؤالًا`}</span></span>
          <span class="name">${u.name}</span>
          <span class="mini"><span style="width:${p.i / n * 100}%"></span></span>
        </button>`;
      }).join('')}
    </div>`;
  card.querySelectorAll('.unit').forEach(b => b.addEventListener('click', () => open(+b.dataset.k)));
  foot.innerHTML = `<span></span><button class="link" id="reset-all">مسح كل التقدّم</button>`;
  armed(document.getElementById('reset-all'), 'مسح كل التقدّم', () => { prog = fresh(); save(); home(); });
}

function open(k) { cur = k; prog[k].i >= UNITS[k].q.length ? finish() : show(); }

function show() {
  const u = UNITS[cur], p = prog[cur];
  answered = false;
  overall();
  const item = u.q[p.i];
  card.className = 'card';
  card.innerHTML = `
    <div class="tag"><span class="sec">الوحدة ${ORD[cur]} · ${item.t}</span><span class="num">السؤال ${ar(p.i + 1)} من ${ar(u.q.length)}</span></div>
    ${item.s ? `<p class="story">${u.stories[item.s]}</p>` : ''}
    <p class="q">${item.q}</p>
    <div class="choices">
      ${shuffle(item.c).map((c, k) => `<button class="choice" id="u${cur}-q${p.i}-c${k}" data-v="${encodeURIComponent(c)}"><span>${c}</span><span class="mark"></span></button>`).join('')}
    </div>
    <p class="feedback" id="fb" aria-live="polite"></p>`;
  card.querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => pick(b)));
  foot.innerHTML = `<button class="link" id="to-home">قائمة الوحدات</button><button class="link" id="reset-unit">أعد هذه الوحدة</button>`;
  document.getElementById('to-home').addEventListener('click', home);
  armed(document.getElementById('reset-unit'), 'أعد هذه الوحدة', () => { prog[cur] = { i: 0, score: 0, wrong: [] }; save(); show(); });
  window.scrollTo({ top: 0 });
}

function pick(btn) {
  if (answered) return;
  answered = true;
  const u = UNITS[cur], p = prog[cur], item = u.q[p.i];
  const right = decodeURIComponent(btn.dataset.v) === item.c[0];
  card.querySelectorAll('.choice').forEach(b => {
    b.disabled = true;
    if (decodeURIComponent(b.dataset.v) === item.c[0]) { b.classList.add('ok'); b.querySelector('.mark').textContent = '✓'; }
  });
  if (right) p.score++;
  else { btn.classList.add('bad'); btn.querySelector('.mark').textContent = '✗'; p.wrong.push(p.i); }
  const fb = document.getElementById('fb');
  fb.className = 'feedback ' + (right ? 'ok' : 'bad');
  fb.textContent = right ? 'أحسنت! إجابة صحيحة' : 'الإجابة الصحيحة باللون الأخضر';
  p.i++;
  save();
  overall();
  const next = document.createElement('button');
  next.className = 'btn';
  next.id = `next-u${cur}-${p.i}`;
  next.textContent = p.i < u.q.length ? 'السؤال التالي' : 'شاهد نتيجة الوحدة';
  next.addEventListener('click', () => p.i < u.q.length ? show() : finish());
  card.appendChild(next);
  next.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function finish() {
  overall();
  const u = UNITS[cur], p = prog[cur], n = u.q.length, s = p.score;
  const pct = s / n;
  const starsOn = pct >= 0.9 ? 3 : pct >= 0.7 ? 2 : pct >= 0.5 ? 1 : 0;
  const msg = pct >= 0.9 ? 'ممتاز يا بطل!' : pct >= 0.7 ? 'أحسنت، أداء رائع!' : 'جيد، راجع أخطاءك وحاول مرة أخرى';
  card.className = 'card result';
  card.innerHTML = `
    <div class="tag" style="justify-content:center"><span class="sec">الوحدة ${ORD[cur]} · ${u.name}</span></div>
    <div class="stars">${[0, 1, 2].map(k => `<span class="${k < starsOn ? '' : 'off'}">★</span>`).join('')}</div>
    <div class="big">${ar(s)} / ${ar(n)}</div>
    <p class="q">${msg}</p>
    <div class="row">
      <button class="btn" id="fin-home">قائمة الوحدات</button>
      <button class="btn alt" id="fin-again">أعد الوحدة</button>
    </div>
    ${p.wrong.length ? `<div class="review"><h2>مراجعة الأخطاء (${ar(p.wrong.length)})</h2>
      ${p.wrong.map(k => `<div class="rv">${u.q[k].q.replace(/<\/?b>/g, '')}<br>الإجابة: <span class="ans">${u.q[k].c[0]}</span></div>`).join('')}</div>` : ''}`;
  document.getElementById('fin-home').addEventListener('click', home);
  document.getElementById('fin-again').addEventListener('click', () => { prog[cur] = { i: 0, score: 0, wrong: [] }; save(); show(); });
  foot.innerHTML = '';
}

// two-tap confirmation so a child does not wipe progress by accident
function armed(el, label, action) {
  let on = false, t;
  el.addEventListener('click', () => {
    if (!on) { on = true; el.textContent = 'اضغط مرة أخرى للتأكيد'; t = setTimeout(() => { on = false; el.textContent = label; }, 3000); return; }
    clearTimeout(t); on = false; el.textContent = label; action();
  });
}

home();
</script>
