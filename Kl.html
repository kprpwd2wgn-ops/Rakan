<style>
/* Layout: one centred question column, like a page in a young scientist's notebook; each unit has its own colour (leaf, water, earth) */
:root{
  --bg:#F1F6F3; --surface:#FFFFFF; --ink:#1B2724; --muted:#5B6D67; --line:#D5E0DB; --soft:#E7EFEB;
  --u1:#2E8B4C; --u2:#18788A; --u3:#A86A12;
  --on-accent:#FFFFFF;
  --ok:#1C9455; --ok-bg:#E1F4E8; --bad:#C93A32; --bad-bg:#FBE6E4;
  --star:#E3A21A;
  --accent:var(--u1);
  --display:"Baloo Bhaijaan 2","Readex Pro",Tahoma,system-ui,sans-serif;
  --body:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1513; --surface:#17211E; --ink:#E4EEE9; --muted:#9AAFA8; --line:#2A3833; --soft:#1E2A26;
    --u1:#52C27C; --u2:#45B5C6; --u3:#E2AA4E; --on-accent:#0E1513;
    --ok:#4BCB84; --ok-bg:#15342A; --bad:#F2716A; --bad-bg:#3B1C1A; --star:#F2C14E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#17211E; --ink:#E4EEE9; --muted:#9AAFA8; --line:#2A3833; --soft:#1E2A26;
  --u1:#52C27C; --u2:#45B5C6; --u3:#E2AA4E; --on-accent:#0E1513;
  --ok:#4BCB84; --ok-bg:#15342A; --bad:#F2716A; --bad-bg:#3B1C1A; --star:#F2C14E;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
.app{max-width:640px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[data-u="1"]{--accent:var(--u1)} [data-u="2"]{--accent:var(--u2)} [data-u="3"]{--accent:var(--u3)}
h1,h2,h3{font-family:var(--display);line-height:1.25;margin:0;text-wrap:balance}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--accent);outline-offset:2px}

/* Home */
.hero{display:grid;gap:6px;padding-block:8px 18px}
.hero h1{font-size:2.1rem;font-weight:800}
.hero p{margin:0;color:var(--muted)}
.namebox{display:grid;gap:6px;margin-block:4px 18px}
.namebox label{font-weight:500}
.namebox input{font:inherit;font-size:1.05rem;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.units{display:grid;gap:12px}
.unit{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px}
.unit .badge{grid-row:span 2;width:52px;height:52px;border-radius:14px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.5rem}
.unit h2{font-size:1.25rem}
.unit .meta{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.unit .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:600;font-size:1rem;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.plain{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.toggle{display:flex;align-items:center;gap:10px;margin-top:16px;color:var(--muted);font-size:.95rem}
.toggle input{width:20px;height:20px;accent-color:var(--u1)}
.note{margin-top:20px;color:var(--muted);font-size:.85rem}

/* Quiz */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.bar .where{flex:1;min-width:0;font-weight:600}
.bar .where small{display:block;color:var(--muted);font-weight:400;font-size:.85rem;font-variant-numeric:tabular-nums}
.chip{background:var(--ok-bg);color:var(--ok);border-radius:999px;padding:4px 12px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.homebtn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:.9rem}
.track{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:16px}
.track span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:20px 18px;display:grid;gap:16px}
.kind{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.kind b{font-family:var(--display);font-weight:700;color:var(--accent);font-size:1.05rem}
.kind span{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.q{font-size:1.25rem;font-weight:500;line-height:1.7;margin:0}
.blank{display:inline-block;min-width:4.5em;border-bottom:3px dashed var(--accent);margin-inline:4px;color:var(--accent);font-weight:600;text-align:center}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;text-align:start;width:100%;min-height:54px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:1.05rem;line-height:1.5;transition:border-color .15s,background .15s}
.opt .mk{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-weight:600;font-size:.95rem}
.opts.two .opt{justify-content:center;font-family:var(--display);font-weight:700;font-size:1.3rem}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .mk{background:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .mk{background:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}

.ordzone{display:grid;gap:10px}
.ordzone .lbl{font-size:.85rem;color:var(--muted)}
.slots,.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;align-items:center}
.slots{border:2px dashed var(--line);border-radius:14px;padding:8px}
.slots .empty{color:var(--muted);font-size:.9rem;padding-inline:6px}
.pc{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-size:1rem;display:inline-flex;align-items:center;gap:8px}
.pc i{font-style:normal;font-variant-numeric:tabular-nums;background:var(--accent);color:var(--on-accent);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-size:.8rem;font-weight:600}
.pool .pc:hover{border-color:var(--accent)}
.slots.right{border-color:var(--ok);border-style:solid;background:var(--ok-bg)}
.slots.wrong{border-color:var(--bad);border-style:solid;background:var(--bad-bg)}

.fb{border-radius:14px;padding:12px 14px;display:grid;gap:2px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb strong{font-family:var(--display);font-size:1.3rem}
.fb p{margin:0;color:var(--ink)}
.next{width:100%;padding:14px;font-size:1.1rem;border-radius:14px}

/* Done */
.done{display:grid;gap:18px;text-align:center}
.score{font-family:var(--display);font-weight:800;font-size:3.4rem;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.stars{font-size:2.6rem;letter-spacing:6px;color:var(--line)}
.stars .on{color:var(--star)}
.done .msg{font-size:1.2rem;font-weight:500;margin:0}
.done .acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.review{text-align:start;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px}
.review summary{cursor:pointer;font-weight:600}
.review ol{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:10px}
.review li{display:grid;gap:2px;border-top:1px solid var(--line);padding-top:10px}
.review li span{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.review li b{color:var(--ok);font-weight:600}

.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.02)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.pop{animation:none}.track span{transition:none}}
@media (max-width:420px){.hero h1{font-size:1.8rem}.q{font-size:1.15rem}.score{font-size:2.8rem}}
</style>

<div class="app" id="app" dir="rtl" lang="ar">

  <section id="home">
    <div class="hero">
      <h1>اختبار العلوم</h1>
      <p>الصف الثالث الابتدائي – الفصل الدراسي الأول – ٣٠٠ سؤال</p>

  <section id="quiz" hidden>

    <div class="card" id="card"></div>
  </section>

  <section id="done" hidden>
    <div class="done" id="doneBox"></div>
  </section>
</div>

/* ---------- build question list ---------- */
const Q = {}; const ORDER = { u1:[], u2:[], u3:[] };
UNITS.forEach(u=>{
  let n = u.start;
  const matchBs = [];
  u.groups.forEach(([t,items])=>{ if(t==="match") items.forEach(it=>matchBs.push(it[1])); });
  u.groups.forEach(([t,items])=>{
    items.forEach(it=>{
      let q = {n, u:u.id, type:t};
      if(t==="tf"){ q.q=it[0]; q.ans=!!it[1]; }
      else if(t==="mc"){ q.q=it[0]; q.opts=it[1]; q.ans=it[2]; }
      else if(t==="fill"){ q.q=it[0]; q.word=it[1]; q.pool=u.bank; }
      else if(t==="match"){ q.a=it[0]; q.b=it[1]; q.pool=matchBs; }
      else if(t==="ord"){ q.q=it[0]; q.items=it[1]; }
      Q[n]=q; ORDER["u"+u.id].push(n); n++;
    });
  });
});
ORDER.all = [...ORDER.u1, ...ORDER.u2, ...ORDER.u3];
const MODES = [
  {key:"u1", u:1, name:"الوحدة الأولى", sub:"المخلوقات الحية", range:"الأسئلة 1–100"},
  {key:"u2", u:2, name:"الوحدة الثانية", sub:"النظام البيئي", range:"الأسئلة 101–200"},
  {key:"u3", u:3, name:"الوحدة الثالثة", sub:"الأرض ومواردها", range:"الأسئلة 201–300"},
  {key:"all", u:1, name:"الاختبار كاملاً", sub:"جميع الوحدات", range:"الأسئلة 1–300"}
];

/* ---------- helpers ---------- */
function rng(seed){ let a = seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffle(arr, r){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const LETTERS = ["أ","ب","ج","د"];
const $ = id=>document.getElementById(id);
function esc(s){ return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function store(k,v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,JSON.stringify(v)); }catch(e){ return null; } }

function optionsFor(q){
  const r = rng(q.n*7919+13);
  if(q.type==="tf") return [{t:"صح",ok:q.ans===true},{t:"خطأ",ok:q.ans===false}];
  if(q.type==="mc"){
    const list = q.opts.map((t,i)=>({t,ok:i===q.ans}));
    return q.opts.some(o=>o.includes("ما سبق")) ? list : shuffle(list,r);
  }
  const right = q.type==="fill" ? q.word : q.b;
  const others = shuffle(q.pool.filter(x=>x!==right), r).slice(0,3);
  return shuffle([right,...others], r).map(t=>({t, ok:t===right}));
}
function correctText(q){
  if(q.type==="tf") return q.ans ? "صح" : "خطأ";
  if(q.type==="mc") return q.opts[q.ans];
  if(q.type==="fill") return q.word;
  if(q.type==="match") return q.b;
  return q.items.join(" ← ");
}
function questionText(q){
  if(q.type==="match") return "«"+q.a+"»";
  return q.q;
}
const KIND = {tf:"صح أم خطأ؟", mc:"اختر الإجابة الصحيحة", fill:"أكمل الفراغ", match:"صِل الكلمة بما يناسبها", ord:"رتّب بالضغط على البطاقات بالترتيب"};

/* ---------- state ---------- */
let S = null; // {mode, order:[], i, ans:{}, saveKey}

function saved(key){ const s = store("sci3-"+key); return (s && Array.isArray(s.order) && s.i>0 && s.i<s.order.length) ? s : null; }

function renderHome(){
  const box = $("units"); box.innerHTML = "";
  MODES.forEach(m=>{
    const sv = saved(m.key);
    const div = document.createElement("div");
    div.className = "unit"; div.dataset.u = m.u;
    div.innerHTML =
      '<div class="badge">'+(m.key==="all"?"٣٠٠":"١٠٠")+'</div>'+
      '<h2>'+m.name+'</h2>'+
      '<div class="meta">'+m.sub+' · '+m.range+'</div>'+
      '<div class="acts"></div>';
    const acts = div.querySelector(".acts");
    if(sv){
      const c = document.createElement("button"); c.className="btn"; c.type="button";
      c.textContent = "متابعة من السؤال "+(sv.i+1)+" من "+sv.order.length;
      c.onclick = ()=>start(m.key, sv);
      const r = document.createElement("button"); r.className="btn ghost"; r.type="button";
      r.textContent = "البدء من جديد";
      r.onclick = ()=>start(m.key);
      acts.append(c,r);
    } else {
      const b = document.createElement("button"); b.className="btn"; b.type="button";
      b.textContent = "ابدأ";
      b.onclick = ()=>start(m.key);
      acts.append(b);
    }
    box.append(div);
  });
}

function start(key, resume, customOrder){
  let order;
  if(resume){ S = {...resume, mode:key}; }
  else {
    order = customOrder || ORDER[key].slice();
    if(!customOrder && $("shuffle").checked) order = shuffle(order, rng(Date.now()%100000));
    S = {mode:key, order, i:0, ans:{}};
  }
  show("quiz"); renderQ();
}

function persist(){ if(S.mode==="wrong") return; store("sci3-"+S.mode, S); }

function show(id){ ["home","quiz","done"].forEach(s=>$(s).hidden = s!==id); window.scrollTo(0,0); }

function score(){ return Object.values(S.ans).filter(a=>a.ok).length; }

function renderQ(){
  const n = S.order[S.i], q = Q[n], u = UNITS[q.u-1];
  $("quiz").dataset.u = q.u;
  $("unitName").textContent = S.mode==="wrong" ? "مراجعة الأخطاء" : u.name+": "+u.title;
  $("counter").textContent = "سؤال "+(S.i+1)+" من "+S.order.length;
  $("scoreChip").textContent = "✓ "+score();
  $("prog").style.width = (S.i/S.order.length*100)+"%";

  const card = $("card"); card.className="card"; card.innerHTML="";
  const kind = document.createElement("div"); kind.className="kind";
  kind.innerHTML = '<b>'+KIND[q.type]+'</b><span>رقم '+n+'</span>';
  card.append(kind);

  const p = document.createElement("p"); p.className="q";
  if(q.type==="fill") p.innerHTML = esc(q.q).replace("__",'<span class="blank" id="blank">؟</span>');
  else p.textContent = questionText(q);
  card.append(p);

  const prev = S.ans[n];
  if(q.type==="ord") renderOrd(q, card, prev); else renderOpts(q, card, prev);
}

function renderOpts(q, card, prev){
  const opts = optionsFor(q);
  const wrap = document.createElement("div"); wrap.className = "opts"+(q.type==="tf"?" two":"");
  opts.forEach((o,i)=>{
    const b = document.createElement("button"); b.type="button"; b.className="opt";
    b.innerHTML = (q.type==="tf"?"":'<span class="mk">'+LETTERS[i]+'</span>')+'<span>'+esc(o.t)+'</span>';
    b.onclick = ()=>answer(q, o.t, o.ok, wrap, card);
    b.dataset.ok = o.ok?"1":""; b.dataset.t = o.t;
    wrap.append(b);
  });
  card.append(wrap);
  if(prev) lockOpts(q, wrap, prev.pick, card, false);
}

function lockOpts(q, wrap, pick, card, fresh){
  [...wrap.children].forEach(b=>{
    b.disabled = true;
    if(b.dataset.ok) { b.classList.add("right"); if(q.type!=="tf") b.querySelector(".mk").textContent="✓"; }
    else if(b.dataset.t===pick){ b.classList.add("wrong"); if(q.type!=="tf") b.querySelector(".mk").textContent="✗"; }
    else b.classList.add("dim");
  });
  if(q.type==="fill"){ const bl=$("blank"); if(bl) bl.textContent=q.word; }
  feedback(q, pick===undefined ? false : S.ans[q.n].ok, card, fresh);
}

function answer(q, pick, ok, wrap, card){
  if(S.ans[q.n]) return;
  S.ans[q.n] = {ok, pick};
  persist();
  lockOpts(q, wrap, pick, card, true);
}

function renderOrd(q, card, prev){
  const zone = document.createElement("div"); zone.className="ordzone";
  zone.innerHTML = '<span class="lbl">ترتيبك:</span><div class="slots" id="slots"></div><span class="lbl">البطاقات:</span><div class="pool" id="pool"></div>';
  card.append(zone);
  let pool = shuffle(q.items, rng(q.n*31+7));
  if(pool.join()===q.items.join()) pool.reverse();
  let picked = [];
  const check = document.createElement("button"); check.type="button"; check.className="btn next"; check.textContent="تحقّق من الترتيب"; check.disabled=true;
  card.append(check);

  function draw(locked){
    const sl = zone.querySelector("#slots"), po = zone.querySelector("#pool");
    sl.innerHTML = ""; po.innerHTML = "";
    if(!picked.length) sl.innerHTML = '<span class="empty">اضغط على البطاقات بالترتيب الصحيح</span>';
    picked.forEach((t,i)=>{
      const b=document.createElement("button"); b.type="button"; b.className="pc";
      b.innerHTML='<i>'+(i+1)+'</i>'+esc(t);
      if(locked) b.disabled=true; else b.onclick=()=>{ picked.splice(i,1); draw(); };
      sl.append(b);
    });
    pool.filter(t=>!picked.includes(t)).forEach(t=>{
      const b=document.createElement("button"); b.type="button"; b.className="pc"; b.textContent=t;
      if(locked) b.disabled=true; else b.onclick=()=>{ picked.push(t); draw(); };
      po.append(b);
    });
    check.disabled = picked.length!==q.items.length;
  }
  function finish(fresh){
    const ok = picked.join("|")===q.items.join("|");
    draw(true);
    zone.querySelector("#slots").classList.add(ok?"right":"wrong");
    check.remove();
    feedback(q, ok, card, fresh);
  }
  check.onclick = ()=>{
    const ok = picked.join("|")===q.items.join("|");
    S.ans[q.n] = {ok, pick:picked.join(" ← ")};
    persist(); finish(true);
  };
  if(prev){ picked = prev.pick.split(" ← "); finish(false); } else draw();
}

function feedback(q, ok, card, fresh){
  const fb = document.createElement("div"); fb.className = "fb "+(ok?"ok":"no");
  fb.setAttribute("role","status");
  if(ok) fb.innerHTML = '<strong>'+PRAISE[q.n%PRAISE.length]+'</strong>';
  else fb.innerHTML = '<strong>حاول مرة أخرى في المراجعة</strong><p>الإجابة الصحيحة: <b>'+esc(correctText(q))+'</b></p>';
  card.append(fb);
  if(fresh && ok) card.classList.add("pop");
  const nx = document.createElement("button"); nx.type="button"; nx.className="btn next";
  const last = S.i===S.order.length-1;
  nx.textContent = last ? "عرض النتيجة" : "السؤال التالي";
  nx.onclick = ()=>{ if(last){ S.i=S.order.length; persist(); finishQuiz(); } else { S.i++; persist(); renderQ(); window.scrollTo(0,0); } };
  card.append(nx);
  $("scoreChip").textContent = "✓ "+score();
  if(fresh) nx.focus({preventScroll:true});
}

function finishQuiz(){
  const total = S.order.length, sc = S.order.filter(n=>S.ans[n]&&S.ans[n].ok).length;
  const pct = total ? sc/total : 0;
  const stars = pct>=0.9?3:pct>=0.7?2:pct>=0.5?1:0;
  const name = ($("kidname").value||"").trim();
  const msg = pct>=0.9 ? "ممتاز"+(name?" يا "+name:"")+"! أنت عالم صغير."
            : pct>=0.7 ? "أحسنت"+(name?" يا "+name:"")+"! راجع الأسئلة الخاطئة لتصل إلى العلامة الكاملة."
            : pct>=0.5 ? "جيد"+(name?" يا "+name:"")+"، تحتاج إلى مراجعة بعض الدروس."
            : "لا بأس"+(name?" يا "+name:"")+"، راجع الدروس ثم جرّب مرة أخرى.";
  const wrong = S.order.filter(n=>!(S.ans[n]&&S.ans[n].ok));
  const box = $("doneBox");
  $("done").dataset.u = S.mode==="wrong" ? Q[S.order[0]].u : (MODES.find(m=>m.key===S.mode)||{u:1}).u;
  box.innerHTML =
    '<h1>النتيجة</h1>'+
    '<div class="score">'+sc+' / '+total+'</div>'+
    '<div class="stars" aria-label="'+stars+' من 3 نجوم">'+[0,1,2].map(i=>'<span class="'+(i<stars?"on":"")+'">★</span>').join("")+'</div>'+
    '<p class="msg">'+esc(msg)+'</p>'+
    '<div class="acts" id="doneActs"></div>';
  const acts = box.querySelector("#doneActs");
  if(wrong.length){
    const rw = document.createElement("button"); rw.type="button"; rw.className="btn";
    rw.textContent = "أعد الأسئلة الخاطئة ("+wrong.length+")";
    rw.onclick = ()=>start("wrong", null, wrong);
    acts.append(rw);
  }
  const hm = document.createElement("button"); hm.type="button"; hm.className="btn plain";
  hm.textContent = "العودة إلى البداية";
  hm.onclick = ()=>{ if(S.mode!=="wrong") store("sci3-"+S.mode, null); renderHome(); show("home"); };
  acts.append(hm);
  if(wrong.length){
    const d = document.createElement("details"); d.className="review";
    d.innerHTML = '<summary>الأسئلة التي تحتاج إلى مراجعة ('+wrong.length+')</summary><ol>'+
      wrong.map(n=>{ const q=Q[n]; return '<li><span>رقم '+n+'</span>'+esc(q.type==="match"?"ما يناسب «"+q.a+"»":q.type==="fill"?q.q.replace("__","……"):q.q)+'<b>'+esc(correctText(q))+'</b></li>'; }).join("")+
      '</ol>';
    box.append(d);
  }
  if(S.mode!=="wrong") store("sci3-"+S.mode, null);
  show("done");
}

$("toHome").onclick = ()=>{ persist(); renderHome(); show("home"); };
$("kidname").addEventListener("input", e=>store("sci3-name", e.target.value));
(function(){ const nm = store("sci3-name"); if(typeof nm==="string") $("kidname").value = nm; })();
renderHome();
</script>

</body></html>
