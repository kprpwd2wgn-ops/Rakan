<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>

<style>
/* Layout: one-column app. Home = mountain scene with altitude + numbered stations from base to summit; each station opens as its own view. */
:root{
  --sky:#E5F0F7; --sky2:#CDE1EE; --card:#FFFFFF; --ink:#16273A; --muted:#4F6579;
  --rock:#5A7288; --rock2:#93AABD; --snow:#FFFFFF; --line:#C5D6E3;
  --sun:#FF9F1C; --sun-ink:#4A2600; --sun-soft:#FFE8C7;
  --rope:#E0502A; --go:#1F8F52; --go-bg:#DCF2E5; --stop:#C0392B; --stop-bg:#FBE2DE;
  --display:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --sky:#0D1925; --sky2:#14273A; --card:#172B3E; --ink:#E7EFF6; --muted:#A1B5C7;
  --rock:#3A5166; --rock2:#58718A; --snow:#D6E3EE; --line:#2B435A;
  --sun:#FFB04A; --sun-ink:#2B1600; --sun-soft:#3A2A14;
  --rope:#FF7B57; --go:#52C987; --go-bg:#153526; --stop:#F2826F; --stop-bg:#3B1E1A;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --sky:#0D1925; --sky2:#14273A; --card:#172B3E; --ink:#E7EFF6; --muted:#A1B5C7;
  --rock:#3A5166; --rock2:#58718A; --snow:#D6E3EE; --line:#2B435A;
  --sun:#FFB04A; --sun-ink:#2B1600; --sun-soft:#3A2A14;
  --rope:#FF7B57; --go:#52C987; --go-bg:#153526; --stop:#F2826F; --stop-bg:#3B1E1A;
  color-scheme:dark; }

html,body{background:var(--sky);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.75;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.app{max-width:720px;margin-inline:auto}
h1,h2,h3{font-family:var(--display);line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:2.1rem;font-weight:800}
h2{font-size:1.6rem;font-weight:800}
h3{font-size:1.2rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:12px}
.view{display:flex;flex-direction:column;gap:18px}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 22px;border-radius:999px;
  font-family:var(--display);font-weight:700;font-size:1.15rem;background:var(--sun);color:var(--sun-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--sun) 55%,#000);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--sun) 55%,#000)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 0 0 2px var(--line) inset}
.btn[disabled]{opacity:.45;pointer-events:none}
.card{background:var(--card);border-radius:var(--r);padding:20px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:1.05rem;padding:8px 14px;border-radius:999px;background:var(--card)}
.alt-pill{font-family:var(--display);font-weight:700;background:var(--card);padding:6px 14px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
.alt-pill b{color:var(--rope)}

/* home */
.hero{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.hero .kicker{font-family:var(--display);font-weight:700;color:var(--rope);letter-spacing:.02em}
.scene{position:relative;border-radius:24px;overflow:hidden;background:linear-gradient(to bottom,var(--sky2),var(--sky))}
.scene svg{display:block;width:100%;height:auto}
.meter{display:flex;align-items:center;gap:12px}
.meter .track{flex:1;height:14px;border-radius:999px;background:var(--card);overflow:hidden;box-shadow:0 0 0 2px var(--line) inset}
.meter .fill{height:100%;background:var(--rope);border-radius:999px;transition:width .8s ease}
.meter span{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.stations{display:flex;flex-direction:column;gap:12px;list-style:none;margin:0;padding:0}
.station{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;width:100%;text-align:right;background:var(--card);border-radius:var(--r);padding:14px 16px}
.station .num{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.3rem;background:var(--sky2);color:var(--ink)}
.station.done .num{background:var(--go);color:var(--card)}
.station .txt{min-width:0}
.station .txt h3{font-size:1.15rem}
.station .txt p{font-size:.92rem;color:var(--muted);line-height:1.5}
.station .gain{font-family:var(--display);font-weight:700;font-size:.9rem;color:var(--rope);white-space:nowrap}
.station.done .gain{color:var(--go)}
.station.mom{background:var(--sun-soft)}
.station.mom .num{background:var(--sun);color:var(--sun-ink)}
.camp-label{font-family:var(--display);font-weight:700;color:var(--muted);font-size:.95rem;padding-inline:4px}

/* story */
.story-alt{display:flex;gap:6px}
.story-alt i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.story-alt i.on{background:var(--rope)}
.story-text{font-size:1.2rem;line-height:1.9}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{text-align:right;background:var(--card);border-radius:16px;padding:14px 18px;font-size:1.08rem;font-weight:500;box-shadow:0 0 0 2px var(--line) inset;line-height:1.6}
.choice:hover{box-shadow:0 0 0 2px var(--rope) inset}
.feedback{border-radius:16px;padding:14px 18px;font-weight:500;line-height:1.7}
.feedback.good{background:var(--go-bg);color:var(--ink);box-shadow:inset -6px 0 0 var(--go)}
.feedback.bad{background:var(--stop-bg);color:var(--ink);box-shadow:inset -6px 0 0 var(--stop)}
.lessons{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.lesson{background:var(--sky2);border-radius:14px;padding:12px 14px;font-weight:600;line-height:1.5}

/* sort game */
.sentence{font-family:var(--display);font-weight:700;font-size:1.45rem;line-height:1.5;text-align:center;padding:26px 18px;background:var(--card);border-radius:var(--r);min-height:120px;display:grid;place-items:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{border-radius:16px;padding:14px 10px;font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.4}
.pick.stop{background:var(--stop-bg);color:var(--stop)}
.pick.go{background:var(--go-bg);color:var(--go)}
.count{font-family:var(--display);font-weight:700;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.magic{display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-radius:16px;padding:12px 16px;flex-wrap:wrap}
.mrow .s{font-size:1.1rem;font-weight:600;min-width:0}
.mrow .yet{font-family:var(--display);font-weight:800;color:var(--rope);display:inline-block;animation:pop .5s ease}
.mbtn{font-family:var(--display);font-weight:700;background:var(--sun-soft);color:var(--ink);border-radius:999px;padding:6px 16px;white-space:nowrap}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}

/* hand plan */
.hand{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:end}
.finger{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;border-radius:999px 999px 18px 18px;background:var(--card);box-shadow:0 0 0 2px var(--line) inset;padding:12px 4px;font-family:var(--display);font-weight:800;font-size:1.4rem}
.finger small{font-family:var(--body);font-size:.72rem;font-weight:600;color:var(--muted);line-height:1.3;text-align:center}
.finger.seen{background:var(--sun-soft);box-shadow:0 0 0 2px var(--sun) inset}
.finger.active{background:var(--sun);color:var(--sun-ink)}
.finger.active small{color:var(--sun-ink)}
.palm{height:34px;border-radius:0 0 40px 40px;background:var(--card);box-shadow:0 0 0 2px var(--line) inset;margin-top:-8px}
.step-card{display:flex;flex-direction:column;gap:6px}
.step-card h3{color:var(--rope)}
.opts{display:flex;flex-direction:column;gap:8px}

/* breathe */
.balloon-wrap{display:grid;place-items:center;padding:24px 0;min-height:290px}
.balloon{width:110px;height:130px;border-radius:50% 50% 48% 48%;background:var(--rope);transform:scale(.7);transition:transform 4s ease-in-out;position:relative}
.balloon::after{content:"";position:absolute;bottom:-14px;left:50%;width:2px;height:40px;background:var(--muted);transform:translateX(-50%)}
.balloon.big{transform:scale(1.6)}
.breath-text{font-family:var(--display);font-weight:800;font-size:1.6rem;text-align:center;min-height:2.4em}

/* puzzle */
.levels{display:flex;gap:8px;flex-wrap:wrap}
.lvl{font-family:var(--display);font-weight:700;padding:8px 16px;border-radius:999px;background:var(--card);box-shadow:0 0 0 2px var(--line) inset}
.lvl.on{background:var(--ink);color:var(--card);box-shadow:none}
.lvl.won::after{content:" ✓";color:var(--go)}
.lvl.on.won::after{color:var(--go-bg)}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(100%,340px);margin-inline:auto;aspect-ratio:1;max-width:100%;background:var(--rock);padding:8px;border-radius:20px}
.tile{border-radius:14px;background:var(--card);font-family:var(--display);font-weight:800;font-size:2.2rem;display:grid;place-items:center;box-shadow:0 4px 0 var(--rock2);transition:background .2s}
.tile.blank{background:transparent;box-shadow:none;pointer-events:none}
.tile.hint{background:var(--sun);color:var(--sun-ink)}
.tile.right{color:var(--go)}
.pstats{display:flex;justify-content:space-between;gap:10px;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.coach{text-align:center;font-weight:600;min-height:1.8em;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* missions */
.missions{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.mission{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:12px 16px;width:100%;text-align:right}
.mission .box{width:36px;height:36px;border-radius:10px;box-shadow:0 0 0 2.5px var(--line) inset;display:grid;place-items:center;font-weight:800;color:var(--card)}
.mission.on .box{background:var(--go);box-shadow:none}
.mission .day{font-family:var(--display);font-weight:700;color:var(--rope);font-size:.9rem;display:block;line-height:1.3}
.mission .m{font-weight:600;line-height:1.5}
.mission.on .m{color:var(--muted)}
.jar-wrap{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.jar-wrap svg{width:120px;height:auto}

/* parent guide */
.guide{display:flex;flex-direction:column;gap:12px}
details{background:var(--card);border-radius:var(--r);padding:4px 18px}
summary{font-family:var(--display);font-weight:700;font-size:1.15rem;padding:12px 0;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--rope);font-size:1.4rem;line-height:1}
details[open] summary::after{content:"−"}
details .in{padding-bottom:16px;display:flex;flex-direction:column;gap:10px;max-width:65ch}
details ul,details ol{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
.say{width:100%;border-collapse:separate;border-spacing:0 8px}
.say td{padding:10px 12px;vertical-align:top;line-height:1.55;font-size:.98rem}
.say td:first-child{background:var(--stop-bg);border-radius:0 12px 12px 0;width:50%}
.say td:last-child{background:var(--go-bg);border-radius:12px 0 0 12px}
.say th{font-family:var(--display);text-align:right;padding:0 12px;font-size:.95rem}
.say th:first-child{color:var(--stop)} .say th:last-child{color:var(--go)}

.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translate(-50%,-150%);background:var(--ink);color:var(--card);font-family:var(--display);font-weight:800;font-size:1.15rem;padding:12px 22px;border-radius:999px;z-index:20;transition:transform .35s cubic-bezier(.3,1.5,.6,1);white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.show{transform:translate(-50%,0)}
.star-modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 55%,transparent);
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.star-box{background:var(--card);border-radius:28px;padding:28px 22px;max-width:420px;width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;animation:pop .6s ease}
.big-star{width:130px;animation:spin 2.4s ease-in-out infinite}
@keyframes spin{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.08)}}
.star-banner{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;width:100%;text-align:right;background:var(--sun-soft);border-radius:var(--r);padding:12px 16px;box-shadow:0 0 0 2px var(--sun) inset}
.star-banner svg{width:56px}
.star-banner b{font-family:var(--display);font-size:1.15rem;display:block;line-height:1.3}
.star-banner span{font-size:.92rem;color:var(--muted);line-height:1.5}
.star-goal{font-size:.92rem;color:var(--muted)}
.reset{font-size:.85rem;color:var(--muted);text-decoration:underline;align-self:center;padding:8px}

@media (max-width:420px){
  h1{font-size:1.8rem}
  .finger{font-size:1.15rem;padding:10px 2px}
  .finger small{font-size:.62rem}
  .sentence{font-size:1.25rem}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  .balloon{transition:transform 4s linear!important}
}
</style>

<body>

<div class="app" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="star-modal" id="starModal" hidden></div>

<script>
(function(){
const AR = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const $ = (s, r=document) => r.querySelector(s);
const app = $('#app');
const KEY = 'sanad-mountain-v1';
const fresh = () => ({story:false, yet:false, plan:false, breathe:false, puzzle:[false,false,false], missions:[false,false,false,false,false,false,false], jar:0, jarsFull:0, star1000:0});
let S = fresh();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };

const PTS = {story:200, yet:150, plan:150, breathe:50, puzzle:100, mission:100};
const TOTAL = PTS.story + PTS.yet + PTS.plan + PTS.breathe + PTS.puzzle*3 + PTS.mission*7;
function altitude(){
  let a = 0;
  if (S.story) a += PTS.story; if (S.yet) a += PTS.yet; if (S.plan) a += PTS.plan; if (S.breathe) a += PTS.breathe;
  a += S.puzzle.filter(Boolean).length * PTS.puzzle;
  a += S.missions.filter(Boolean).length * PTS.mission;
  return a;
}
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 2600); }
function award(key, pts, label){
  if (S[key] === true) return;
  S[key] = true; save();
  toast('+' + AR(pts) + ' متر! ' + (label||'ارتفعت أكثر'));
  checkStar();
}
const STAR_AT = 1000;
const STAR_SVG = `<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,6 62,38 96,38 68,58 79,92 50,72 21,92 32,58 4,38 38,38" fill="var(--sun)" stroke="var(--sun-ink)" stroke-width="3" stroke-linejoin="round"/></svg>`;
function checkStar(){
  if (S.star1000 === 0 && altitude() >= STAR_AT){ S.star1000 = 1; save(); setTimeout(showStar, 900); }
}
function showStar(){
  const m = $('#starModal');
  m.innerHTML = `<div class="star-box" role="dialog" aria-modal="true" aria-labelledby="starTitle">
    <div class="big-star">${STAR_SVG}</div>
    <span class="kicker" style="font-family:var(--display);font-weight:700;color:var(--rope)">وصلت إلى ${AR(STAR_AT)} متر!</span>
    <h2 id="starTitle">نجمة من ماما!</h2>
    <p>صعدت ألف متر ولم تستسلم. اذهب إلى ماما الآن وأرِها هذه الشاشة، لتضع لك <b>نجمة في لوحة النجوم</b>.</p>
    <div class="row"><button class="btn" id="starGiven">ماما أعطتني النجمة ✓</button><button class="btn ghost" id="starLater">لاحقاً</button></div>
  </div>`;
  m.hidden = false;
  const b = $('#starGiven'); if (b) b.focus();
}
document.getElementById('starModal').addEventListener('click', e => {
  const t = e.target.closest('button'); if(!t) return;
  if (t.id==='starGiven'){ S.star1000 = 2; save(); $('#starModal').hidden = true; toast('مبروك النجمة! أكمل إلى القمة'); if(view==='home') home(); }
  if (t.id==='starLater'){ $('#starModal').hidden = true; if(view==='home') home(); }
});

function bar(){
  return `<div class="bar"><button class="back" data-go="home">→ الجبل</button><span class="alt-pill">ارتفاعي <b>${AR(altitude())}</b> م</span></div>`;
}

/* ---------------- HOME ---------------- */
const STATIONS = [
  {id:'story', t:'قصة سند والجبل', d:'رحلة فيها صخرة وحبل ودرجة عالية. أنت تختار.', pts:PTS.story, done:()=>S.story},
  {id:'yet', t:'الكلمة السحرية: «بعد»', d:'كلام يوقفني وكلام يرفعني للأعلى.', pts:PTS.yet, done:()=>S.yet},
  {id:'plan', t:'خطة اليد الخماسية', d:'خمس أصابع، خمس خطوات للبطل حين يصعب الشيء.', pts:PTS.plan, done:()=>S.plan},
  {id:'breathe', t:'بالون الهدوء', d:'تنفّس مع البالون عندما تغضب أو تتضايق.', pts:PTS.breathe, done:()=>S.breathe},
  {id:'puzzle', t:'تحدي اللغز', d:'لغز صعب قليلاً. المهم ألا تتركه!', pts:PTS.puzzle*3, done:()=>S.puzzle.every(Boolean), part:()=>AR(S.puzzle.filter(Boolean).length)+'/٣'},

function runBreath(){

/* ---------------- PUZZLE ---------------- */
const GOAL = [1,2,3,4,5,6,7,8,0];
const SCR = [8,18,32];
let pz = {lvl:0, start:null, cur:null, moves:0, hint:-1, won:false};
const nbrs = b => { const r=[], x=b%3, y=(b/3)|0; if(y>0)r.push(b-3); if(y<2)r.push(b+3); if(x>0)r.push(b-1); if(x<2)r.push(b+1); return r; };
function scramble(n){
  let s = GOAL.slice(), prev=-1;
  for(let k=0;k<n;k++){ const b=s.indexOf(0); const opts=nbrs(b).filter(v=>v!==prev); const m=opts[(Math.random()*opts.length)|0]; s[b]=s[m]; s[m]=0; prev=b; }
  if (s.join()===GOAL.join()) return scramble(n);
  return s;
}
function newPuzzle(lvl){ pz.lvl=lvl; pz.start=scramble(SCR[lvl]); pz.cur=pz.start.slice(); pz.moves=0; pz.hint=-1; pz.won=false; }
function hman(s){ let d=0; for(let i=0;i<9;i++){const v=s[i]; if(v){const g=v-1; d+=Math.abs(((i/3)|0)-((g/3)|0))+Math.abs(i%3-g%3);}} return d; }
function nextMove(start){
  const goal=GOAL.join(','), sk=start.join(','); if(sk===goal) return -1;
  const heap=[], push=(n)=>{heap.push(n);let i=heap.length-1;while(i>0){const p=(i-1)>>1;if(heap[p].f<=heap[i].f)break;[heap[p],heap[i]]=[heap[i],heap[p]];i=p;}};
  const pop=()=>{const top=heap[0],last=heap.pop();if(heap.length){heap[0]=last;let i=0;for(;;){let l=2*i+1,r=l+1,m=i;if(l<heap.length&&heap[l].f<heap[m].f)m=l;if(r<heap.length&&heap[r].f<heap[m].f)m=r;if(m===i)break;[heap[m],heap[i]]=[heap[i],heap[m]];i=m;}}return top;};
  const seen=new Map(); seen.set(sk,0);
  push({s:start,g:0,f:hman(start),first:-1});
  let guard=0;
  while(heap.length && guard++<200000){
    const n=pop(); const k=n.s.join(',');
    if(k===goal) return n.first;
    const b=n.s.indexOf(0);
    for(const m of nbrs(b)){
      const t=n.s.slice(); t[b]=t[m]; t[m]=0; const tk=t.join(','); const g=n.g+1;
      if(seen.has(tk)&&seen.get(tk)<=g) continue; seen.set(tk,g);
      push({s:t,g,f:g+hman(t),first:n.first===-1?m:n.first});
    }
  }
  return -1;
}
const COACH = [[0,''],[12,'أنت تحاول، وهذا أهم شيء.'],[25,'إذا تضايقت، خذ نفَساً من بالون الهدوء ثم أكمل.'],[40,'جرّب طريقة ثانية: رتّب السطر الأول أولاً (١ ٢ ٣).'],[60,'البطل يطلب المساعدة بعد أن يحاول: اضغط «تلميح».']];
function puzzle(){
  if(!pz.cur) newPuzzle(S.puzzle.findIndex(v=>!v) < 0 ? 0 : S.puzzle.findIndex(v=>!v));
  let coach=''; for(const [m,t] of COACH){ if(pz.moves>=m) coach=t; }
  if(pz.won) coach='';
  app.innerHTML = `<div class="view">${bar()}
    <h2>تحدي اللغز</h2>
    <p class="muted">رتّب الأرقام من ١ إلى ٨، والمربع الفارغ في الآخر. اضغط على رقم بجانب الفراغ لتحرّكه.</p>
    <div class="levels">${['سهل','متوسط','صعب'].map((n,i)=>`<button class="lvl ${i===pz.lvl?'on':''} ${S.puzzle[i]?'won':''}" data-lvl="${i}">${n}</button>`).join('')}</div>
    <div class="pstats"><span>حركاتي: ${AR(pz.moves)}</span><span>${S.puzzle[pz.lvl]?'حللت هذا المستوى ✓':'+'+AR(PTS.puzzle)+' م عند الحل'}</span></div>
    <div class="board" id="board">${pz.cur.map((v,i)=>`<button class="tile ${v===0?'blank':''} ${i===pz.hint?'hint':''} ${v&&v===GOAL[i]?'right':''}" data-t="${i}" ${v===0?'aria-hidden="true" tabindex="-1"':'aria-label="'+v+'"'}>${v?AR(v):''}</button>`).join('')}</div>
    ${pz.won?`<div class="feedback good"><b>حللته!</b> في ${AR(pz.moves)} حركة. ${pz.lvl<2?'جاهز للمستوى التالي؟':'أنت بطل الألغاز!'}</div>`:`<p class="coach">${coach}</p>`}
    <div class="row">
      ${pz.won?(pz.lvl<2?`<button class="btn" data-lvl="${pz.lvl+1}">المستوى التالي ←</button>`:`<button class="btn" data-go="home">ارجع إلى الجبل</button>`):`<button class="btn ghost" id="hintBtn">تلميح</button><button class="btn ghost" id="restart">أبدأ من جديد</button>`}
      <button class="btn ghost" data-lvl="${pz.lvl}" data-newp>لغز جديد</button>
    </div>
  </div>`;
}
function tapTile(i){
  if(pz.won) return;
  const b = pz.cur.indexOf(0); if(!nbrs(b).includes(i)) return;
  pz.cur[b]=pz.cur[i]; pz.cur[i]=0; pz.moves++; pz.hint=-1;
  if(pz.cur.join()===GOAL.join()){ pz.won=true; if(!S.puzzle[pz.lvl]){ S.puzzle[pz.lvl]=true; save(); toast('+'+AR(PTS.puzzle)+' متر! لم تستسلم'); checkStar(); } }
  puzzle();
}

const JAR_MAX = 20;
function jarSVG(n){
  const pos=[]; for(let k=0;k<n&&k<JAR_MAX;k++){ const row=(k/4)|0, col=k%4; pos.push([30+col*20+(row%2?10:0), 138-row*19]); }
  const fills=['var(--rope)','var(--sun)','var(--go)','var(--rock)'];
  return `<svg viewBox="0 0 120 160" aria-hidden="true">
    <rect x="34" y="6" width="52" height="14" rx="4" fill="var(--rock)"/>
    <path d="M30 20 h60 q12 8 12 24 v96 q0 14 -14 14 h-56 q-14 0 -14 -14 v-96 q0 -16 12 -24z" fill="var(--sky2)" stroke="var(--line)" stroke-width="3"/>
    ${pos.map(([x,y],k)=>`<circle cx="${Math.min(x,94)}" cy="${y}" r="8.5" fill="${fills[k%4]}"/>`).join('')}
  </svg>`;
}

    <button class="reset" id="resetAll">مسح كل التقدم والبدء من المخيّم</button>

/* ---------------- ROUTER ---------------- */
let view = 'home';
const VIEWS = {home, story, yet, plan, breathe, puzzle, missions, parent};
function go(v){
  if (bTimer){ clearTimeout(bTimer); bTimer=null; bRunning=false; }
  view = v;
  if (v==='story'){ sc = 0; scState = null; }
  if (v==='yet'){ yIdx=0; yAns=null; yOrder=null; magicOn=[]; }
  if (v==='plan'){ fSel=0; fSeen=new Set([0]); qIdx=0; qAns=null; }
  VIEWS[v](); window.scrollTo(0,0);
}

app.addEventListener('click', e => {
  const t = e.target.closest('button'); if(!t) return;
  const d = t.dataset;
  if (d.go){ go(d.go); return; }
  // story
  if (d.ch!==undefined){ const c = SCENES[sc].choices[+d.ch]; scState = {ok:c.ok, r:c.r}; story(); return; }
  if (d.snext!==undefined){ sc++; scState=null; story(); window.scrollTo(0,0); return; }
  if (d.sdone!==undefined){ award('story',PTS.story,'وصلت مع سند'); go('home'); return; }
  // yet
  if (d.y!==undefined){ yAns = d.y==='1'; yet(); return; }
  if (d.ynext!==undefined){ yIdx++; yAns=null; yet(); return; }
  if (d.yretry!==undefined){ yAns=null; yet(); return; }
  if (d.mg!==undefined){ magicOn.push(+d.mg); yet(); return; }
  if (d.ydone!==undefined){ award('yet',PTS.yet,'كلمة «بعد» معك'); go('home'); return; }
  // plan
  if (d.f!==undefined){ fSel=+d.f; fSeen.add(fSel); plan(); return; }
  if (d.q!==undefined){ qAns=+d.q; plan(); return; }
  if (d.qnext!==undefined){ qIdx++; qAns=null; plan(); return; }
  if (d.pdone!==undefined){ award('plan',PTS.plan,'خطة اليد معك'); go('home'); return; }
  // breathe
  if (t.id==='bstart'){ runBreath(); return; }
  // puzzle
  if (d.t!==undefined){ tapTile(+d.t); return; }
  if (d.lvl!==undefined){ newPuzzle(+d.lvl); puzzle(); return; }
  if (t.id==='restart'){ pz.cur=pz.start.slice(); pz.moves=0; pz.hint=-1; puzzle(); return; }
  if (t.id==='hintBtn'){ t.disabled=true; t.textContent='أفكّر…'; setTimeout(()=>{ pz.hint=nextMove(pz.cur); puzzle(); },30); return; }
  // missions
  if (d.m!==undefined){ const i=+d.m; S.missions[i]=!S.missions[i]; save(); if(S.missions[i]) toast('+'+AR(PTS.mission)+' متر! مهمة '+DAYS[i]); missions(); checkStar(); return; }
  if (t.id==='starOpen'){ showStar(); return; }
  if (t.id==='jarAdd'){ S.jar=Math.min(JAR_MAX,S.jar+1); save(); if(S.jar===JAR_MAX) toast('امتلأت الجرّة!'); missions(); return; }
  if (t.id==='jarNew'){ S.jar=0; S.jarsFull++; save(); missions(); return; }
  if (t.id==='resetAll'){ t.outerHTML = `<div class="card" style="display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center"><p>متأكد؟ سيرجع سند إلى المخيّم وتُمسح كل المهام.</p><div class="row"><button class="btn ghost" id="resetNo">لا، تراجع</button><button class="btn" id="resetYes">نعم، امسح</button></div></div>`; return; }
  if (t.id==='resetNo'){ missions(); return; }
  if (t.id==='resetYes'){ S=fresh(); save(); pz.cur=null; go('home'); return; }
});

home();
checkStar();
})();
