<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>مرسمي الصغير</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: a crayon-box studio — one tab bar, level path as crayon chips, lesson cards on paper, full-screen drawing board. */
:root{
  --bg:#EEF2FA; --surface:#FFFFFF; --sunk:#E3E9F5; --ink:#1B2140; --muted:#59627F; --line:#D5DCEB;
  --accent:#2F5FD0; --accent-ink:#FFFFFF; --star:#F2AE00; --star-soft:#FFF3CC; --ok:#178A5E; --ok-soft:#DDF4EA; --warn:#B86A00; --warn-soft:#FFEFD6;
  --guide:#93A0C2;
  --l1:#E0413F; --l2:#EC7A12; --l3:#22995A; --l4:#2A72D8; --l5:#8A47C2;
  --display:"Baloo Bhaijaan 2","Tajawal","Segoe UI",Tahoma,sans-serif;
  --body:"Tajawal","Segoe UI",Tahoma,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10142A; --surface:#1A2042; --sunk:#141A36; --ink:#EEF1FA; --muted:#A5ADCB; --line:#2D355C;
  --accent:#86A6FF; --accent-ink:#0D1330; --star:#FFC933; --star-soft:#3A3216; --ok:#4CCB94; --ok-soft:#173A2D; --warn:#F2A541; --warn-soft:#3D2C14;
  --guide:#5E6A98;
  --l1:#FF6B66; --l2:#FF9A45; --l3:#4CC985; --l4:#64A0FF; --l5:#B987EC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10142A; --surface:#1A2042; --sunk:#141A36; --ink:#EEF1FA; --muted:#A5ADCB; --line:#2D355C;
  --accent:#86A6FF; --accent-ink:#0D1330; --star:#FFC933; --star-soft:#3A3216; --ok:#4CCB94; --ok-soft:#173A2D; --warn:#F2A541; --warn-soft:#3D2C14;
  --guide:#5E6A98;
  --l1:#FF6B66; --l2:#FF9A45; --l3:#4CC985; --l4:#64A0FF; --l5:#B987EC; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);line-height:1.25;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:1.7rem;font-weight:800}
.crayons{display:flex;gap:3px}
.crayons i{width:7px;height:26px;border-radius:3px 3px 2px 2px;display:block}
.tabs{display:flex;gap:6px;background:var(--sunk);padding:5px;border-radius:999px}
.tab{padding:8px 16px;border-radius:999px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tab svg{width:16px;height:16px}

/* star summary */
.stars{background:var(--surface);border-radius:var(--r);padding:16px 18px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center}
.bigstar{grid-row:span 2;width:64px;height:64px}
.stars .count{font-family:var(--display);font-size:2.1rem;font-weight:800;line-height:1}
.stars .count small{font-size:1rem;font-weight:700;color:var(--muted);margin-inline-start:6px}
.meter{display:flex;gap:4px}
.meter span{flex:1;height:12px;border-radius:4px;background:var(--sunk)}
.meter span.on{background:var(--star)}
.stars .note{grid-column:1/-1;font-size:.95rem}

/* levels */
.levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.lvl{background:var(--surface);border-radius:14px;padding:10px 8px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;border:3px solid transparent;position:relative;overflow:hidden}
.lvl::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:var(--lc)}
.lvl .num{font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--lc);line-height:1.2;margin-top:4px}
.lvl .nm{font-size:.82rem;font-weight:700;line-height:1.3}
.lvl .pr{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.lvl[aria-current="true"]{border-color:var(--lc)}
.lvl.locked{opacity:.55}
.lvl.locked .num{color:var(--muted)}
.lvl .lock{width:16px;height:16px;color:var(--muted)}
@media (max-width:560px){.levels{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.lvl .nm{font-size:.7rem}.lvl{padding:8px 3px}}

.panel{display:flex;flex-direction:column;gap:12px}
.panel-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel-head h2{font-size:1.45rem}
.panel-head .wk{font-size:.9rem;color:var(--muted)}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:start;min-width:0;border:2px solid transparent}
.card:hover{border-color:var(--line)}
.card .thumb{width:54px;height:54px;flex:none;border-radius:12px;background:var(--sunk);display:grid;place-items:center;overflow:hidden}
.card .thumb svg{width:46px;height:46px}
.card .t{font-weight:700;line-height:1.35}
.card .meta{display:flex;flex-direction:column;gap:4px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:700;padding:1px 9px;border-radius:999px;width:max-content}
.chip.new{background:var(--sunk);color:var(--muted)}
.chip.pending{background:var(--warn-soft);color:var(--warn)}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.chip svg{width:12px;height:12px}
.task{background:var(--star-soft);border-radius:var(--r);padding:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;text-align:start;border:2px dashed var(--star)}
.task .tx{flex:1 1 240px;min-width:0}
.task h3{font-size:1.15rem;display:flex;align-items:center;gap:8px}
.task h3 svg{width:22px;height:22px}
.locked-msg{background:var(--surface);border-radius:var(--r);padding:20px;text-align:center}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:12px;font-weight:700;background:var(--sunk);color:var(--ink);min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);color:var(--surface)}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn.danger{color:var(--l1);border:2px solid var(--line);background:transparent}
.btn svg{width:18px;height:18px}
.btn[disabled]{opacity:.5;cursor:default}

/* sheet */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(10,14,35,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:22px}}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet .lbl{font-size:.85rem;font-weight:700;color:var(--lc)}
.sheet h2{font-size:1.6rem}
.ill{background:var(--sunk);border-radius:var(--r);padding:12px;display:grid;place-items:center}
.ill svg{width:100%;max-width:300px;height:auto}
.steps{margin:0;padding-inline-start:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:st}
.steps li{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start;counter-increment:st}
.steps li::before{content:counter(st);width:32px;height:32px;border-radius:50%;background:var(--lc);color:var(--surface);font-family:var(--display);font-weight:800;display:grid;place-items:center;font-size:1rem}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap}
.sheet .row .btn{flex:1 1 160px}
.x{width:40px;height:40px;border-radius:50%;background:var(--sunk);display:grid;place-items:center}
.x svg{width:18px;height:18px}

/* svg strokes */
.s{stroke:var(--ink);fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.c{stroke:var(--lc);fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.g{stroke:var(--guide);fill:none;stroke-width:2.5;stroke-dasharray:6 6;stroke-linecap:round}
.f{fill:var(--ink)}
.lc-fill{fill:var(--lc)}
svg text{fill:var(--ink);font-family:var(--display);font-weight:700}

/* studio */
.studio{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));gap:8px}
.studio-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.studio-bar h2{font-size:1.15rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paper{flex:1;min-height:0;border-radius:14px;overflow:hidden;background:#FFFFFF;box-shadow:0 1px 4px rgba(0,0,0,.15);position:relative}
#cv{display:block;touch-action:none;cursor:crosshair}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.swatches{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.sizes{display:flex;gap:4px;background:var(--surface);border-radius:999px;padding:4px}
.sz{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.sz i{display:block;border-radius:50%;background:var(--ink)}
.sz[aria-pressed="true"]{background:var(--sunk)}
.tool{width:44px;height:44px;border-radius:12px;background:var(--surface);display:grid;place-items:center}
.tool svg{width:22px;height:22px}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pic{background:var(--surface);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pic .im{aspect-ratio:4/3;max-width:100%;background:#fff;border-radius:8px;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:contain;display:block}
.pic .cap{font-size:.85rem;font-weight:700;line-height:1.3}
.pic .dt{font-size:.75rem;color:var(--muted)}
.empty{background:var(--surface);border-radius:var(--r);padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty svg{width:72px;height:72px}

/* parent */
.pin{background:var(--surface);border-radius:var(--r);padding:24px 18px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:380px;margin:0 auto;width:100%}
.dots{display:flex;gap:12px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.dots i.on{background:var(--ink);border-color:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(3,64px);gap:10px;direction:ltr}
.key{height:56px;border-radius:14px;background:var(--sunk);font-family:var(--display);font-size:1.4rem;font-weight:700}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;align-items:start}
.box{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.box h3{font-size:1.15rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--sunk);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.78rem;color:var(--muted)}
.stat.hl{background:var(--star-soft)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--sunk);flex-wrap:wrap}
.item .tx{flex:1 1 150px;min-width:0;line-height:1.35}
.item .tx small{display:block;color:var(--muted)}
.item .btn{min-height:38px;padding:6px 12px}
.log{display:flex;flex-direction:column;font-size:.9rem}
.log div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.log div:last-child{border-bottom:0}
.log b{font-variant-numeric:tabular-nums;white-space:nowrap}
.log .plus{color:var(--ok)} .log .minus{color:var(--l1)}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick .btn{flex:1 1 140px}
.prog{display:flex;flex-direction:column;gap:6px}
.prog div{display:grid;grid-template-columns:1fr 90px 40px;gap:8px;align-items:center;font-size:.9rem}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lc)}
.prog .n{font-variant-numeric:tabular-nums;color:var(--muted);text-align:end}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<div class="wrap" dir="rtl" lang="ar">
  <header class="top">
    <div class="brand">
      <div class="crayons" aria-hidden="true"><i style="background:var(--l1)"></i><i style="background:var(--l2)"></i><i style="background:var(--l3)"></i><i style="background:var(--l4)"></i><i style="background:var(--l5)"></i></div>
      <h1>مرسمي الصغير</h1>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-kid" aria-selected="true" data-v="kid">دروسي</button>
      <button class="tab" role="tab" id="tab-gal" aria-selected="false" data-v="gal">المعرض</button>
      <button class="tab" role="tab" id="tab-mom" aria-selected="false" data-v="mom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>ركن ماما</button>
    </nav>
  </header>

  <section id="v-kid" class="panel"></section>
  <section id="v-gal" class="panel" hidden></section>
  <section id="v-mom" class="panel" hidden></section>
</div>

<div id="sheetWrap" class="overlay" hidden dir="rtl" lang="ar"></div>

<div id="studio" class="studio" hidden dir="rtl" lang="ar">
  <div class="studio-bar">
    <button class="x" id="stClose" aria-label="إغلاق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <h2 id="stTitle">لوحة الرسم</h2>
    <button class="btn primary" id="stSave"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.6"/></svg>علّقها في المعرض</button>
  </div>
  <div class="paper" id="paper"><canvas id="cv" aria-label="لوحة الرسم"></canvas></div>
  <div class="tools">
    <div class="swatches" id="swatches"></div>
    <div class="sizes" id="sizes"></div>
    <button class="tool" id="tEraser" aria-pressed="false" aria-label="ممحاة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M15 4l5 5-9 9H6l-3-3z"/><path d="M10 9l5 5M6 18h14"/></svg></button>
    <button class="tool" id="tUndo" aria-label="تراجع"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7H9a5 5 0 0 0 0 10h6"/><path d="M12 4l3 3-3 3"/></svg></button>
    <button class="btn danger" id="tClear">امسح الورقة</button>
  </div>
</div>

<div id="toast" class="toast" hidden role="status"></div>

<script>
(function(){
document.documentElement.lang='ar'; document.documentElement.dir='rtl';

/* ---------- illustrations ---------- */
function palm(x,y,k){return `<path class="s" d="M${x} ${y} q${3*k} ${-25*k} ${0} ${-50*k}"/><path class="c" d="M${x} ${y-50*k} q${-18*k} ${-8*k} ${-26*k} ${6*k} M${x} ${y-50*k} q${18*k} ${-8*k} ${26*k} ${6*k} M${x} ${y-50*k} q${-10*k} ${-16*k} ${-20*k} ${-10*k} M${x} ${y-50*k} q${10*k} ${-16*k} ${20*k} ${-10*k}"/>`}
function wedge(cx,cy,r,a0,a1,col){const p=a=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)];const [x0,y0]=p(a0),[x1,y1]=p(a1);return `<path d="M${cx} ${cy} L${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)} Z" fill="${col}"/>`}
function face(x,y,m){const mouths={happy:`M${x-12} ${y+8} q12 12 24 0`,sad:`M${x-12} ${y+14} q12 -12 24 0`,angry:`M${x-12} ${y+12} h24`,wow:''};const brows={happy:'',sad:`M${x-17} ${y-12} l9 -4 M${x+17} ${y-12} l-9 -4`,angry:`M${x-17} ${y-16} l10 5 M${x+17} ${y-16} l-10 5`,wow:`M${x-17} ${y-17} q5 -5 10 0 M${x+7} ${y-17} q5 -5 10 0`};return `<circle class="c" cx="${x}" cy="${y}" r="28"/><circle class="f" cx="${x-10}" cy="${y-5}" r="3.5"/><circle class="f" cx="${x+10}" cy="${y-5}" r="3.5"/>${m==='wow'?`<circle class="s" cx="${x}" cy="${y+12}" r="6"/>`:`<path class="s" d="${mouths[m]}"/>`}${brows[m]?`<path class="s" d="${brows[m]}"/>`:''}`}
const ILL={
 lines:`<svg viewBox="0 0 240 160"><path class="c" d="M20 25 H220"/><path class="c" d="M20 62 l20 -15 l20 15 l20 -15 l20 15 l20 -15 l20 15 l20 -15 l20 15 l20 -15 l20 15"/><path class="c" d="M20 100 q25 -22 50 0 t50 0 t50 0 t50 0"/><path class="c" d="M20 138 H125" style="stroke-dasharray:1 12"/><path class="c" d="M185 138 a5 5 0 1 1 5 5 a11 11 0 1 1 -11 -11 a17 17 0 1 1 17 17"/></svg>`,

const STAR_LESSON=1, STAR_TASK=3, STAR_FINISH=5;
const ALL={}; LEVELS.forEach(L=>{L.lessons.forEach(x=>{x.L=L;x.stars=STAR_LESSON;ALL[x.id]=x});L.task.L=L;L.task.stars=STAR_TASK;L.task.isTask=true;ALL[L.task.id]=L.task});

/* ---------- state ---------- */
const KEY='marsami-state-v1', GKEY='marsami-gallery-v1';
const blank=()=>({status:{},stars:0,transferred:0,log:[],pin:''});
let state=blank();
try{const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s) state=Object.assign(blank(),s)}catch(e){}
let ref=null, db=null, assets=null, gallery=[], localGallery=[];
try{localGallery=JSON.parse(localStorage.getItem(GKEY)||'[]')}catch(e){localGallery=[]}
let writing=false, dirty=false, momOpen=false, view='kid', curLevel=null;

function clone(o){return JSON.parse(JSON.stringify(o))}
async function persist(){
  if(!ref){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}return}
  if(writing){dirty=true;return}
  writing=true;
  try{await ref.set(clone(state))}catch(e){toast('لم يُحفظ التغيير. تأكدي من الاتصال وحاولي مرة أخرى.')}
  writing=false;
  if(dirty){dirty=false;persist()}
}
function isDefault(s){return !s.stars && !s.pin && !Object.keys(s.status).length}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function st(id){return state.status[id]||'new'}
function unlocked(i){return i===0 || st(LEVELS[i-1].task.id)==='done'}
function lvlDone(L){return L.lessons.filter(x=>st(x.id)==='done').length + (st(L.task.id)==='done'?1:0)}
function chip(s){
  if(s==='done') return '<span class="chip done"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>تمّ</span>';
  if(s==='pending') return '<span class="chip pending">بانتظار ماما</span>';
  return '<span class="chip new">جديد</span>';
}
const fmt=new Intl.DateTimeFormat('ar',{day:'numeric',month:'long',numberingSystem:'latn'});
let tTimer; function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tTimer);tTimer=setTimeout(()=>t.hidden=true,2600)}
function addLog(text,n){state.log.unshift({at:Date.now(),text,n});state.log=state.log.slice(0,40)}
const lockIco='<svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';

/* ---------- kid view ---------- */

  const toNext=10-(state.stars%10), mainEarned=Math.floor(state.stars/10);
  let meter=''; for(let i=0;i<10;i++) meter+=`<span class="${i<state.stars%10?'on':''}"></span>`;
  let lv=LEVELS.map((x,i)=>{const lk=!unlocked(i);return `<button class="lvl ${lk?'locked':''}" style="--lc:${x.color}" data-lvl="${i}" aria-current="${i===curLevel}" ${lk?'aria-disabled="true"':''}><span class="num">${x.n}</span><span class="nm">${x.name}</span>${lk?lockIco:`<span class="pr">${lvlDone(x)}/${x.lessons.length+1}</span>`}</button>`}).join('');
  let cards=L.lessons.map(x=>`<button class="card" data-les="${x.id}" style="--lc:${L.color}"><span class="thumb">${ILL[x.ill]||''}</span><span class="meta"><span class="t">${x.t}</span>${chip(st(x.id))}</span></button>`).join('');

   <div class="stars">${ILL.star.replace('<svg','<svg class="bigstar"')}
     <div class="count">${state.stars}<small>نجمة رسم</small></div>
     <div class="meter" aria-label="${state.stars%10} من 10">${meter}</div>
     <div class="note muted">${mainEarned?`ربحت ${nStars(mainEarned)} في جدولك الكبير. `:''}باقي ${nStars(toNext)} لتربح نجمة جديدة في جدولك الكبير.</div>
   </div>
   <div class="levels">${lv}</div>
   <div class="panel" style="--lc:${L.color}">
     <div class="panel-head"><h2 style="color:var(--lc)">المستوى ${L.n}: ${L.name}</h2><span class="wk">${L.weeks}</span></div>
     <p class="muted" style="margin:0">${L.goal}</p>
     <div class="lessons">${cards}</div>
     <button class="task" data-les="${T.id}"><span class="thumb" style="width:64px;height:64px;border-radius:12px;background:var(--surface);display:grid;place-items:center;flex:none">${(ILL[T.ill]||'').replace('<svg','<svg style="width:54px;height:54px"')}</span><span class="tx"><h3>${ILL.star}مهمة الإنجاز: ${T.t}</h3><span class="muted">تربح 3 نجوم${L.n<5?' وتفتح المستوى '+(L.n+1):' وتنهي البرنامج (+5 نجوم)'}</span></span>${chip(ts)}</button>
   </div>`;
}

function openLesson(id){
  const x=ALL[id], s=st(id), L=x.L;

  w.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${x.t}" style="--lc:${L.color}">
    <div class="sheet-top"><span class="lbl">المستوى ${L.n} · ${x.isTask?'مهمة الإنجاز':'درس'}</span><button class="x" data-close aria-label="إغلاق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <h2>${x.t}</h2>
    ${ILL[x.ill]?`<div class="ill">${ILL[x.ill]}</div>`:''}
    <ol class="steps">${x.steps.map(t=>`<li><span>${t}</span></li>`).join('')}</ol>
    <div>${chip(s)} <span class="muted" style="font-size:.9rem">${nStars(x.stars)} عند موافقة ماما</span></div>
    <div class="row">
      <button class="btn primary" data-draw="${id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1L19 8l-3-3L5 16z"/><path d="M14 7l3 3"/></svg>ارسم الآن</button>
      ${s==='new'?`<button class="btn ok" data-finish="${id}">أنهيت ${x.isTask?'المهمة':'الدرس'}</button>`:s==='pending'?`<button class="btn" disabled>أرسلته لماما</button>`:`<button class="btn" disabled>تمّ، أحسنت</button>`}

function closeSheet(){$('#sheetWrap').hidden=true;$('#sheetWrap').innerHTML=''}

/* ---------- gallery ---------- */
function galleryItems(){
  const a=gallery.map(d=>({src:'/_blob/'+d.asset,title:d.title,at:d.at}));
  const b=localGallery.map(d=>({src:d.data,title:d.title,at:d.at}));
  return a.concat(b).sort((x,y)=>(y.at||0)-(x.at||0));
}
function nStars(n){return n===1?'نجمة واحدة':n===2?'نجمتان':(n>=3&&n<=10)?n+' نجوم':n+' نجمة'}
function renderGal(){
  const items=galleryItems(), v=$('#v-gal');
  if(!items.length){v.innerHTML=`<div class="empty"><svg viewBox="0 0 80 80"><rect x="8" y="14" width="64" height="52" rx="6" fill="none" stroke="var(--guide)" stroke-width="3" stroke-dasharray="6 6"/><circle cx="54" cy="32" r="6" fill="var(--star)"/><path d="M14 58l18-18 12 12 8-8 14 14" fill="none" stroke="var(--l2)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><h2 style="font-size:1.3rem">جدار المعرض فارغ</h2><p class="muted" style="margin:0">ارسم في لوحة الرسم واضغط "علّقها في المعرض"، وستظهر رسماتك هنا بالتاريخ.</p><button class="btn primary" data-draw="">ارسم الآن</button></div>`;return}
  v.innerHTML=`<div class="panel-head"><h2>المعرض</h2><span class="wk">${items.length} رسمة</span></div><div class="gal"></div>`;
  const g=v.querySelector('.gal');
  items.forEach(it=>{const d=document.createElement('figure');d.className='pic';d.style.margin='0';
    const im=document.createElement('div');im.className='im';const img=document.createElement('img');img.alt=it.title||'رسمة';img.loading='lazy';img.src=it.src;img.onerror=()=>{im.style.background='var(--sunk)';img.remove()};im.appendChild(img);
    const c=document.createElement('figcaption');const t=document.createElement('div');t.className='cap';t.textContent=it.title||'رسم حر';const dt=document.createElement('div');dt.className='dt';dt.textContent=it.at?fmt.format(new Date(it.at)):'';c.append(t,dt);d.append(im,c);g.appendChild(d)});
}

/* ---------- mom view ---------- */
let pinBuf='', pinFirst='';

  const v=$('#v-mom');
  if(!momOpen){
    const setting=!state.pin;
    const prompt=setting?(pinFirst?'أعيدي كتابة الرمز للتأكيد':'اختاري رمزاً من 4 أرقام لركن ماما'):'اكتبي رمز ركن ماما';
    let dots='';for(let i=0;i<4;i++)dots+=`<i class="${i<pinBuf.length?'on':''}"></i>`;
    v.innerHTML=`<div class="pin"><h2 style="font-size:1.35rem">ركن ماما</h2><p class="muted" style="margin:0">${prompt}</p><div class="dots">${dots}</div><div class="keys">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button class="key" data-key="${k}" aria-label="${k==='⌫'?'حذف':k}">${k}</button>`).join('')}</div>${setting?'':'<p class="muted" style="margin:0;font-size:.85rem">نسيتِ الرمز؟ اطلبي من Claude في المحادثة أن يمسحه.</p>'}</div>`;
    return;
  }
  const pend=Object.keys(state.status).filter(k=>state.status[k]==='pending'&&ALL[k]);

  v.innerHTML=`
   <div class="panel-head" style="justify-content:space-between"><h2>ركن ماما</h2><button class="btn ghost" data-lockmom>قفل</button></div>
   <div class="pgrid">
    <div class="box">
      <h3>النجوم</h3>
      <div class="stats"><div class="stat"><b>${state.stars}</b><span>نجوم الرسم</span></div><div class="stat"><b>${earned}</b><span>نجوم الجدول الكبير</span></div><div class="stat hl"><b>${owed}</b><span>لم تُسلَّم بعد</span></div></div>
      ${owed>0?`<button class="btn primary" data-transfer>وضعتُ ${nStars(owed)} في جدوله الكبير</button>`:`<p class="muted" style="margin:0">كل 10 نجوم رسم = نجمة في جدول النجوم الرئيسي. باقي ${10-(state.stars%10)} للنجمة القادمة.</p>`}
    </div>
    <div class="box">
      <h3>بانتظار موافقتك ${pend.length?`(${pend.length})`:''}</h3>
      <div class="list">${pend.length?pend.map(k=>{const x=ALL[k];return `<div class="item" style="--lc:${x.L.color}"><span class="tx">${x.isTask?'مهمة الإنجاز: ':''}${x.t}<small>المستوى ${x.L.n} · ${nStars(x.stars)}${k==='l5t'?' + 5 لإنهاء البرنامج':''}</small></span><button class="btn ok" data-approve="${k}">موافقة</button><button class="btn ghost" data-reject="${k}">يعيدها</button></div>`}).join(''):'<p class="muted" style="margin:0">لا شيء الآن. عندما يضغط ابنك "أنهيت الدرس" يظهر هنا لتراجعي رسمته وتوافقي.</p>'}</div>
    </div>
    <div class="box">
      <h3>نجوم سريعة</h3>
      <div class="quick"><button class="btn" data-quick="session">+1 حضر جلسة كاملة</button><button class="btn" data-quick="free">+1 رسمة حرة من نفسه</button><button class="btn ghost" data-quick="minus">−1 تصحيح</button></div>

   </div>`;
}

/* ---------- actions ---------- */
function approve(k){const x=ALL[k];if(!x||state.status[k]!=='pending')return;state.status[k]='done';state.stars+=x.stars;addLog((x.isTask?'مهمة الإنجاز: ':'')+x.t,x.stars);
  if(k==='l5t'){state.stars+=STAR_FINISH;addLog('أنهى البرنامج كاملاً',STAR_FINISH)}
  if(x.isTask&&x.L.n<5)toast('انفتح المستوى '+(x.L.n+1));else toast('أُضيفت '+nStars(x.stars));
  persist();renderAll()}
function reject(k){delete state.status[k];persist();renderAll();toast('رجع الدرس إلى قائمته ليعيده')}
function quick(t){if(t==='session'){state.stars+=1;addLog('حضر جلسة كاملة',1)}else if(t==='free'){state.stars+=1;addLog('رسمة حرة من نفسه',1)}else{if(state.stars<=0)return;state.stars-=1;addLog('تصحيح',-1)}persist();renderAll()}
let resetArm=0;
function resetAll(btn){if(Date.now()-resetArm>4000){resetArm=Date.now();btn.textContent='اضغطي مرة أخرى للتأكيد';setTimeout(()=>{if(btn.isConnected)btn.textContent='مسح كل التقدّم'},4000);return}
  const pin=state.pin;state=blank();state.pin=pin;curLevel=null;persist();renderAll();toast('مُسح التقدّم')}
function pinKey(k){
  if(k==='⌫'){pinBuf=pinBuf.slice(0,-1);renderMom();return}
  if(pinBuf.length>=4)return; pinBuf+=k; renderMom();
  if(pinBuf.length<4)return;
  setTimeout(()=>{
    if(!state.pin){
      if(!pinFirst){pinFirst=pinBuf;pinBuf='';renderMom();return}
      if(pinFirst===pinBuf){state.pin=pinBuf;persist();momOpen=true;toast('حُفظ الرمز')}else{toast('الرمزان مختلفان، جرّبي مرة أخرى')}
      pinFirst='';pinBuf='';renderMom();return}
    if(pinBuf===state.pin){momOpen=true}else toast('الرمز غير صحيح');
    pinBuf='';renderMom();
  },150);
}

function renderAll(){renderKid();renderGal();renderMom()}
function setView(v){view=v;['kid','gal','mom'].forEach(x=>{$('#v-'+x).hidden=x!==v;$('#tab-'+x).setAttribute('aria-selected',x===v)});if(v!=='mom'){momOpen=false;pinBuf='';pinFirst=''}renderAll()}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(!b){if(e.target.id==='sheetWrap')closeSheet();return}
  const d=b.dataset;
  if(d.v) setView(d.v);
  else if(d.lvl!==undefined){const i=+d.lvl;if(unlocked(i)){curLevel=i;renderKid()}else toast('أنهِ مهمة إنجاز المستوى '+i+' ليفتح هذا المستوى')}
  else if(d.les) openLesson(d.les);
  else if(d.close!==undefined) closeSheet();
  else if(d.finish){state.status[d.finish]='pending';persist();closeSheet();renderAll();toast('أرسلته لماما لتوافق')}
  else if(d.draw!==undefined){const x=ALL[d.draw];closeSheet();openStudio(x?x.t:'رسم حر')}
  else if(d.key!==undefined) pinKey(d.key);
  else if(d.approve) approve(d.approve);
  else if(d.reject) reject(d.reject);
  else if(d.quick) quick(d.quick);
  else if(d.transfer!==undefined){const owed=Math.floor(state.stars/10)-state.transferred;if(owed>0){state.transferred+=owed;addLog('سُلّمت للجدول الكبير: '+owed,0);persist();renderAll()}}
  else if(d.lockmom!==undefined){momOpen=false;renderMom()}
  else if(d.newpin!==undefined){state.pin='';momOpen=false;pinBuf='';pinFirst='';renderMom()}
  else if(d.reset!==undefined) resetAll(b);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheetWrap').hidden)closeSheet()});

/* ---------- studio ---------- */
const COLORS=['#1B1B1B','#8A8A8A','#E53935','#FB8C00','#FDD835','#43A047','#1B5E20','#4FC3F7','#1E88E5','#8E24AA','#F06292','#795548'];
const SIZES=[4,10,22];

let strokes=[], cur=null, color=COLORS[0], size=SIZES[1], erase=false, W=0, H=0, saved=true, closeArm=0, clearArm=0, drawTitle='';
$('#swatches').innerHTML=COLORS.map((c,i)=>`<button class="sw" style="background:${c}" data-sw="${c}" aria-label="لون ${i+1}" aria-pressed="${i===0}"></button>`).join('');
$('#sizes').innerHTML=SIZES.map((s,i)=>`<button class="sz" data-sz="${s}" aria-label="حجم ${i+1}" aria-pressed="${s===size}"><i style="width:${[6,12,20][i]}px;height:${[6,12,20][i]}px"></i></button>`).join('');
$('#swatches').addEventListener('click',e=>{const b=e.target.closest('[data-sw]');if(!b)return;color=b.dataset.sw;erase=false;$('#tEraser').setAttribute('aria-pressed','false');document.querySelectorAll('.sw').forEach(x=>x.setAttribute('aria-pressed',x===b))});
$('#sizes').addEventListener('click',e=>{const b=e.target.closest('[data-sz]');if(!b)return;size=+b.dataset.sz;document.querySelectorAll('.sz').forEach(x=>x.setAttribute('aria-pressed',x===b))});
$('#tEraser').addEventListener('click',()=>{erase=!erase;$('#tEraser').setAttribute('aria-pressed',erase)});
$('#tUndo').addEventListener('click',()=>{strokes.pop();redraw()});
$('#tClear').addEventListener('click',e=>{if(!strokes.length)return;if(Date.now()-clearArm>3000){clearArm=Date.now();e.currentTarget.textContent='اضغط مرة أخرى للمسح';const btn=e.currentTarget;setTimeout(()=>btn.textContent='امسح الورقة',3000);return}strokes=[];redraw();e.currentTarget.textContent='امسح الورقة'});
$('#stClose').addEventListener('click',()=>{if(!saved&&strokes.length&&Date.now()-closeArm>3000){closeArm=Date.now();toast('رسمتك لم تُعلَّق في المعرض. اضغط × مرة أخرى للخروج');return}closeStudio()});
$('#stSave').addEventListener('click',saveDrawing);

function fit(){const r=$('#paper').getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);const dpr=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);redraw()}
function lw(s){return s.size*Math.max(W,H)/900}
function drawSeg(s,a,b){ctx.strokeStyle=s.erase?'#FFFFFF':s.color;ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=lw(s);ctx.lineCap='round';ctx.lineJoin='round';
  if(!b){ctx.beginPath();ctx.arc(a[0]*W,a[1]*H,lw(s)/2,0,Math.PI*2);ctx.fill();return}
  ctx.beginPath();ctx.moveTo(a[0]*W,a[1]*H);ctx.lineTo(b[0]*W,b[1]*H);ctx.stroke()}
function redraw(){ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,W,H);strokes.forEach(s=>{const p=s.pts;if(p.length===1)drawSeg(s,p[0]);for(let i=1;i<p.length;i++)drawSeg(s,p[i-1],p[i])})}
function pt(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/W,(e.clientY-r.top)/H]}
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);cur={color,size,erase,pts:[pt(e)]};strokes.push(cur);saved=false;drawSeg(cur,cur.pts[0])});
cv.addEventListener('pointermove',e=>{if(!cur)return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];evs.forEach(ev=>{const p=pt(ev);drawSeg(cur,cur.pts[cur.pts.length-1],p);cur.pts.push(p)})});
['pointerup','pointercancel','pointerleave'].forEach(t=>cv.addEventListener(t,()=>{cur=null}));
window.addEventListener('resize',()=>{if(!$('#studio').hidden)fit()});

function openStudio(title){drawTitle=title;$('#stTitle').textContent=title;strokes=[];saved=true;$('#studio').hidden=false;document.body.style.overflow='hidden';requestAnimationFrame(fit)}
function closeStudio(){$('#studio').hidden=true;document.body.style.overflow='';strokes=[]}

async function saveDrawing(){
  if(!strokes.length){toast('ارسم شيئاً أولاً');return}
  const btn=$('#stSave');btn.disabled=true;
  try{
    if(db&&assets){
      const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
      const up=await assets.upload(blob,{type:'image/png'});
      await db.collection('gallery').add({asset:up.id,title:drawTitle,at:Date.now()});
    }else{
      const sc=document.createElement('canvas');const k=Math.min(1,700/W);sc.width=Math.round(W*k);sc.height=Math.round(H*k);sc.getContext('2d').drawImage(cv,0,0,sc.width,sc.height);
      localGallery.unshift({data:sc.toDataURL('image/jpeg',0.8),title:drawTitle,at:Date.now()});
      let ok=false;while(!ok&&localGallery.length){try{localStorage.setItem(GKEY,JSON.stringify(localGallery));ok=true}catch(e){localGallery.pop()}}
    }
    saved=true;toast('عُلّقت في المعرض');renderGal();
  }catch(e){toast(e&&e.code==='quota_or_state'?'المعرض ممتلئ، احذفي بعض الرسمات القديمة.':'لم تُحفظ الرسمة، حاول مرة أخرى.')}
  btn.disabled=false;
}

/* ---------- boot ---------- */
renderAll();
const C=window.claude;
if(C&&C.use){
  C.use('db').then(d=>{
    if(!d)return; db=d; ref=db.doc('state/main');
    let first=true;
    ref.onSnapshot(snap=>{
      if(snap.exists){state=Object.assign(blank(),clone(snap.data()));if(!state.status)state.status={};if(!Array.isArray(state.log))state.log=[]}
      else if(first&&!isDefault(state)){persist()}
      first=false; renderAll();
    },()=>{});
    db.collection('gallery').orderBy('at','desc').limit(120).onSnapshot(s=>{gallery=s.docs.map(x=>x.data()).filter(x=>x&&typeof x.asset==='string'&&/^[0-9a-f]{32}$/.test(x.asset));renderGal()},()=>{});
  }).catch(()=>{});
  C.use('assets').then(a=>{assets=a||null}).catch(()=>{});
}
})();
</script>

</body></html>
