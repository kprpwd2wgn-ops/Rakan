<title>اختبار لغتي للصف الثالث</title>

<style>
/* Layout: one question card per screen with a progress bar, big tap targets for iPad, right-to-left */
:root {
  --bg: #EEF5F2;
  --surface: #FFFFFF;
  --ink: #12332D;
  --muted: #5B7A73;
  --brand: #0E6B5C;
  --sun: #F2B705;
  --line: #CFE0DA;
  --ok: #1E8E4E;
  --ok-bg: #E2F5EA;
  --bad: #C2413A;
  --bad-bg: #FBE7E5;
  --display: "Baloo Bhaijaan 2", "Noto Naskh Arabic", "Geeza Pro", Tahoma, sans-serif;
  --read: "Noto Naskh Arabic", "Geeza Pro", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1917; --surface: #172623; --ink: #E6F2EE; --muted: #9DB8B1;
    --brand: #4FC2AA; --sun: #F5C842; --line: #2A3F3B;
    --ok: #5BD08C; --ok-bg: #173A28; --bad: #F08A82; --bad-bg: #3E1E1C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1917; --surface: #172623; --ink: #E6F2EE; --muted: #9DB8B1;
  --brand: #4FC2AA; --sun: #F5C842; --line: #2A3F3B;
  --ok: #5BD08C; --ok-bg: #173A28; --bad: #F08A82; --bad-bg: #3E1E1C;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--display);
  direction: rtl; text-align: right;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 660px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 1.9rem; font-weight: 800; color: var(--brand); }
.sub { color: var(--muted); font-size: 1rem; }
.score { font-size: 1.15rem; font-weight: 700; color: var(--brand); font-variant-numeric: tabular-nums; }
.bar { height: 14px; background: var(--line); border-radius: 99px; overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--sun); border-radius: 99px; transition: width .3s ease; }
.card {
  background: var(--surface); border: 2px solid var(--line); border-radius: 22px;
  padding: 22px; display: flex; flex-direction: column; gap: 16px;
}
.tag { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 1rem; font-weight: 700; }
.tag .sec { color: var(--surface); background: var(--brand); border-radius: 99px; padding: 2px 14px; }
.tag .num { color: var(--muted); font-variant-numeric: tabular-nums; }
.story {
  font-family: var(--read); font-size: 1.3rem; line-height: 2.1;
  background: var(--bg); border-radius: 14px; padding: 12px 16px; margin: 0;
}
.q { font-size: 1.6rem; font-weight: 700; line-height: 1.6; margin: 0; }
.q b { color: var(--brand); }
.choices { display: grid; gap: 12px; }
.choice {
  font-family: var(--read); font-size: 1.4rem; font-weight: 700;
  min-height: 68px; padding: 12px 18px; border-radius: 16px;
  border: 2px solid var(--line); background: var(--surface); color: var(--ink);
  text-align: right; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  transition: transform .12s ease;
}
.choice:active { transform: scale(.98); }
.choice:focus-visible, .btn:focus-visible, .link:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.choice.ok { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
.choice.bad { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.choice[disabled] { cursor: default; }
.mark { font-family: var(--display); font-size: 1.5rem; }
.feedback { font-size: 1.3rem; font-weight: 700; min-height: 1.6em; margin: 0; }
.feedback.ok { color: var(--ok); }
.feedback.bad { color: var(--bad); }
.btn {
  font-family: var(--display); font-size: 1.4rem; font-weight: 800;
  min-height: 62px; border: 0; border-radius: 16px; cursor: pointer;
  background: var(--brand); color: var(--surface); padding: 10px 24px;
}
.btn.alt { background: var(--sun); color: #2A2200; }
.link { background: none; border: 0; color: var(--muted); font-family: var(--display); font-size: 1rem; cursor: pointer; text-decoration: underline; padding: 6px 0; align-self: flex-start; }
.result { text-align: center; align-items: center; }
.big { font-size: 4rem; font-weight: 800; color: var(--brand); line-height: 1; font-variant-numeric: tabular-nums; }
.stars { font-size: 2.6rem; letter-spacing: 6px; color: var(--sun); }
.stars .off { color: var(--line); }
.review { width: 100%; text-align: right; display: grid; gap: 10px; }
.review h2 { font-size: 1.3rem; margin: 6px 0 0; }
.rv { font-family: var(--read); background: var(--bg); border-radius: 12px; padding: 10px 14px; line-height: 1.8; font-size: 1.05rem; }
.rv .ans { color: var(--ok); font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .choice, .fill { transition: none; } }
</style>

  { t: 'ترتيب الكلمات', q: 'أرتّبُ: (الكبيرَ – أحترمُ – أنا)', c: ['أنا أحترمُ الكبيرَ.', 'الكبيرَ أنا أحترمُ.', 'أحترمُ أنا الكبيرَ.'] },

  // الإملاء
  { t: 'الإملاء', q: 'اللامُ في كلمةِ <b>الشَّمْس</b>:', c: ['شمسية', 'قمرية'] },
  { t: 'الإملاء', q: 'اللامُ في كلمةِ <b>القَمَر</b>:', c: ['قمرية', 'شمسية'] },
  { t: 'الإملاء', q: 'اللامُ في كلمةِ <b>الطّائِرة</b>:', c: ['شمسية', 'قمرية'] },
  { t: 'الإملاء', q: 'اللامُ في كلمةِ <b>الجِبال</b>:', c: ['قمرية', 'شمسية'] },
  { t: 'الإملاء', q: 'اللامُ في كلمةِ <b>السَّحاب</b>:', c: ['شمسية', 'قمرية'] },
  { t: 'الإملاء', q: 'اللامُ في كلمةِ <b>المَطار</b>:', c: ['قمرية', 'شمسية'] },
  { t: 'الإملاء', q: 'أكملُ: مدرسـ…', c: ['ة', 'ت', 'ه'] },
  { t: 'الإملاء', q: 'أكملُ: بنـ… (ابنة)', c: ['ت', 'ة', 'ه'] },
  { t: 'الإملاء', q: 'أكملُ: بيـ… (المنزل)', c: ['ت', 'ة', 'ه'] },
  { t: 'الإملاء', q: 'أكملُ: حديقـ…', c: ['ة', 'ت', 'ه'] },
  { t: 'الإملاء', q: 'أكملُ: وجـ… (الوجه)', c: ['ه', 'ة', 'ت'] },
  { t: 'الإملاء', q: 'رأيتُ حديقةً …', c: ['جميلةً', 'جميلةٌ', 'جميلةٍ'] },
  { t: 'الإملاء', q: 'قرأتُ …', c: ['كتابًا', 'كتابٌ', 'كتابٍ'] },
  { t: 'الإملاء', q: 'هذا …', c: ['قلمٌ', 'قلمًا', 'قلمٍ'] }
];

const KEY = 'lughati-g3-80-v1';
let state = { i: 0, score: 0, wrong: [], answered: false };
try { const saved = JSON.parse(localStorage.getItem(KEY)); if (saved && typeof saved.i === 'number') state = saved; } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

const ar = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const card = document.getElementById('card');
const fill = document.getElementById('fill');
const scoreEl = document.getElementById('score');

function shuffle(a) { const b = a.slice(); for (let k = b.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [b[k], b[j]] = [b[j], b[k]]; } return b; }

function header() {
  fill.style.width = (state.i / Q.length * 100) + '%';
  scoreEl.textContent = 'النقاط: ' + ar(state.score);
}

function show() {
  if (state.i >= Q.length) return finish();
  state.answered = false; save();
  header();
  const item = Q[state.i];
  const opts = shuffle(item.c);
  card.className = 'card';
  card.innerHTML = `
    <div class="tag"><span class="sec">${item.t}</span><span class="num">السؤال ${ar(state.i + 1)} من ${ar(Q.length)}</span></div>
    ${item.s ? `<p class="story">${STORIES[item.s]}</p>` : ''}
    <p class="q">${item.q}</p>
    <div class="choices">
      ${opts.map((c, k) => `<button class="choice" id="q${state.i}-c${k}" data-v="${encodeURIComponent(c)}"><span>${c}</span><span class="mark"></span></button>`).join('')}
    </div>
    <p class="feedback" id="fb" aria-live="polite"></p>
  `;
  card.querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => pick(b)));
  window.scrollTo({ top: 0 });
}

function pick(btn) {
  if (state.answered) return;
  state.answered = true;
  const item = Q[state.i];
  const val = decodeURIComponent(btn.dataset.v);
  const right = val === item.c[0];
  const btns = card.querySelectorAll('.choice');
  btns.forEach(b => {
    b.disabled = true;
    if (decodeURIComponent(b.dataset.v) === item.c[0]) { b.classList.add('ok'); b.querySelector('.mark').textContent = '✓'; }
  });
  if (right) state.score++;
  else { btn.classList.add('bad'); btn.querySelector('.mark').textContent = '✗'; state.wrong.push(state.i); }
  const fb = document.getElementById('fb');
  fb.className = 'feedback ' + (right ? 'ok' : 'bad');
  fb.textContent = right ? 'أحسنت! إجابة صحيحة' : 'الإجابة الصحيحة باللون الأخضر';
  state.i++;
  save();
  scoreEl.textContent = 'النقاط: ' + ar(state.score);
  fill.style.width = (state.i / Q.length * 100) + '%';
  const next = document.createElement('button');
  next.className = 'btn';
  next.id = 'next-' + state.i;
  next.textContent = state.i < Q.length ? 'السؤال التالي' : 'شاهد النتيجة';
  next.addEventListener('click', show);
  card.appendChild(next);
  next.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function finish() {
  header();
  const n = Q.length, s = state.score;
  const starsOn = s >= 72 ? 3 : s >= 56 ? 2 : s >= 40 ? 1 : 0;
  const msg = s >= 72 ? 'ممتاز يا بطل!' : s >= 56 ? 'أحسنت، أداء رائع!' : 'جيد، راجع أخطاءك وحاول مرة أخرى';
  card.className = 'card result';
  card.innerHTML = `
    <div class="stars">${[0, 1, 2].map(k => `<span class="${k < starsOn ? '' : 'off'}">★</span>`).join('')}</div>
    <div class="big">${ar(s)} / ${ar(n)}</div>
    <p class="q">${msg}</p>
    <button class="btn alt" id="again">أعد الاختبار</button>
    ${state.wrong.length ? `<div class="review"><h2>مراجعة الأخطاء (${ar(state.wrong.length)})</h2>
      ${state.wrong.map(k => `<div class="rv">${Q[k].q.replace(/<\/?b>/g, '')}<br>الإجابة: <span class="ans">${Q[k].c[0]}</span></div>`).join('')}</div>` : ''}
  `;
  document.getElementById('again').addEventListener('click', reset);
}

function reset() { state = { i: 0, score: 0, wrong: [], answered: false }; save(); show(); }

const restart = document.getElementById('restart');
let armed = false;
restart.addEventListener('click', () => {
  if (!armed) { armed = true; restart.textContent = 'اضغط مرة أخرى للتأكيد'; setTimeout(() => { armed = false; restart.textContent = 'ابدأ من جديد'; }, 3000); return; }
  armed = false; restart.textContent = 'ابدأ من جديد'; reset();
});

show();
</script>

</body></html>
