<style>
/* Layout: game app. Map = 4 world cards with level nodes; game = full-width canvas + tap zone + fixed overlays; tent/badges/missions/mom are simple card pages. */
:root{
  --sky:#E5F0F7; --sky2:#CDE1EE; --card:#FFFFFF; --ink:#16273A; --muted:#4F6579;
  --rock:#5A7288; --rock2:#93AABD; --line:#C5D6E3;
  --sun:#FF9F1C; --sun-ink:#4A2600; --sun-soft:#FFE8C7;
  --rope:#E0502A; --go:#1F8F52; --go-bg:#DCF2E5;
  --display:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --sky:#0D1925; --sky2:#14273A; --card:#172B3E; --ink:#E7EFF6; --muted:#A1B5C7;
  --rock:#3A5166; --rock2:#58718A; --line:#2B435A;
  --sun:#FFB04A; --sun-ink:#2B1600; --sun-soft:#3A2A14;
  --rope:#FF7B57; --go:#52C987; --go-bg:#153526; color-scheme:dark; } }
:root[data-theme="dark"]{
  --sky:#0D1925; --sky2:#14273A; --card:#172B3E; --ink:#E7EFF6; --muted:#A1B5C7;
  --rock:#3A5166; --rock2:#58718A; --line:#2B435A;
  --sun:#FFB04A; --sun-ink:#2B1600; --sun-soft:#3A2A14;
  --rope:#FF7B57; --go:#52C987; --go-bg:#153526; color-scheme:dark; }

[hidden]{display:none!important}
html,body{background:var(--sky);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.7;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.app{max-width:760px;margin-inline:auto}
.app.wide{max-width:1100px}
h1,h2,h3{font-family:var(--display);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:2.2rem;font-weight:800}
h2{font-size:1.55rem;font-weight:800}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:12px}
.view{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
.kicker{font-family:var(--display);font-weight:700;color:var(--rope)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 22px;border-radius:999px;
  font-family:var(--display);font-weight:800;font-size:1.15rem;background:var(--sun);color:var(--sun-ink);box-shadow:0 5px 0 color-mix(in srgb,var(--sun) 55%,#000);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--sun) 55%,#000)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 0 0 2px var(--line) inset}
.btn.green{background:var(--go);color:var(--card);box-shadow:0 5px 0 color-mix(in srgb,var(--go) 55%,#000)}
.btn.big{font-size:1.5rem;min-height:62px;padding:10px 40px}
.btn[disabled]{opacity:.45;pointer-events:none}
.card{background:var(--card);border-radius:var(--r);padding:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;background:var(--card);padding:6px 14px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap;min-height:40px}
.hud{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:1.05rem;padding:8px 14px;border-radius:999px;background:var(--card);min-height:40px}

/* map */
.mhead{display:flex;align-items:center;gap:12px}
.mhead canvas{width:84px;height:92px;flex:none}
.stars-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border-radius:var(--r);padding:12px 16px}
.stars-row .lbl{font-family:var(--display);font-weight:700}
.mini-star{width:34px;opacity:.22;display:block}
.mini-star.got{opacity:1}
.mini-star.wait{opacity:1;animation:spin 2s ease-in-out infinite}
.star-goal{font-size:.92rem;color:var(--muted);flex-basis:100%}
.world{border-radius:24px;padding:16px 16px 20px;color:#FFFFFF;position:relative;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.world::after{content:"";position:absolute;inset:auto -10% -40% -10%;height:70%;background:radial-gradient(closest-side,rgba(255,255,255,.18),transparent);pointer-events:none}
.world .wtop{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.world .wnum{font-family:var(--display);font-weight:700;opacity:.85}
.world.locked{filter:saturate(.35) brightness(.85)}
.wlock{font-weight:700;margin-top:8px;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.nodes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-items:start;padding-top:14px;position:relative;z-index:1}
.ncell{display:flex;flex-direction:column;align-items:center;gap:6px}
.ncell:nth-child(even){transform:translateY(20px)}
.node{width:min(66px,15vw);aspect-ratio:1;border-radius:50%;background:#FFFFFF;color:#16273A;font-family:var(--display);font-weight:800;font-size:1.5rem;display:grid;place-items:center;box-shadow:0 5px 0 rgba(0,0,0,.28);max-width:100%}
.node.done{background:#FFC93C}
.node.boss{background:#3D1F5C;color:#FFFFFF;font-size:1.7rem}
.node.boss.done{background:#FFC93C;color:#16273A}
.node.locked{background:rgba(255,255,255,.22);color:#FFFFFF;box-shadow:none;font-size:1.1rem}
.node.cur{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 5px 0 rgba(0,0,0,.28),0 0 0 0 rgba(255,255,255,.7)}50%{box-shadow:0 5px 0 rgba(0,0,0,.28),0 0 0 10px rgba(255,255,255,0)}}
.nm{display:flex;gap:3px;justify-content:center}
.nm i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.3)}
.nm i.on{background:#FFE27A}
.navgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.navb{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:right;background:var(--card);border-radius:var(--r);padding:14px 16px;font-size:1.8rem;line-height:1.2;min-width:0}
.navb b{font-family:var(--display);font-size:1.15rem}
.navb span{font-size:.85rem;color:var(--muted);line-height:1.4}
.navb.mom{background:var(--sun-soft)}

/* game */
.gwrap{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#cv{display:block;width:100%;border-radius:18px 18px 0 0;background:#8ED0F5}
.tapzone{display:grid;place-items:center;min-height:96px;border-radius:0 0 18px 18px;background:var(--card);font-family:var(--display);font-weight:800;font-size:1.2rem;color:var(--muted);box-shadow:0 0 0 2px var(--line) inset;text-align:center;padding:8px}
.tapzone b{color:var(--rope);font-size:1.5rem;display:block}
.iconbtn{min-width:44px;min-height:40px;border-radius:999px;background:var(--card);font-size:1.2rem}
.ov{position:fixed;inset:0;z-index:15;display:grid;place-items:center;background:rgba(8,16,28,.55);
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px))}
.ovc{background:var(--card);border-radius:26px;padding:22px 20px;max-width:440px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;max-height:100%;overflow:auto;animation:pop .35s ease}
.ovicon{font-size:3.4rem;line-height:1}
.ovc h2{font-size:2rem}
.ovc .hint{font-size:.95rem;color:var(--muted)}
.ovc .row{width:100%}
.medals{display:flex;gap:10px;justify-content:center}
.medal{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:1.9rem;background:var(--sky2);opacity:.35}
.medal.on{opacity:1;background:var(--sun-soft);box-shadow:0 0 0 3px var(--sun) inset;animation:pop .5s ease backwards}
.medal.on:nth-child(2){animation-delay:.15s}.medal.on:nth-child(3){animation-delay:.3s}
.gain{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.saad{display:flex;gap:10px;align-items:center;background:var(--go-bg);border-radius:18px;padding:10px 14px;text-align:right;width:100%}
.saad .face{font-size:2rem}
.tipline{font-weight:700;color:var(--rope)}
.bal{width:90px;height:108px;border-radius:50% 50% 48% 48%;background:var(--rope);transform:scale(.6);transition:transform 3s ease-in-out;margin:24px auto}
.bal.big{transform:scale(1.35)}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes spin{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.08)}}

/* tent */
.preview{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.preview canvas{width:140px;height:150px;background:var(--sky2);border-radius:20px;flex:none}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.sitem{background:var(--card);border-radius:16px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:inset 0 0 0 2px var(--line);min-width:0;text-align:center}
.sitem.sel{box-shadow:inset 0 0 0 3px var(--sun);background:var(--sun-soft)}
.sitem canvas{width:72px;height:78px}
.swatch{width:50px;height:50px;border-radius:50%;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.sitem .ic{font-size:2rem;line-height:1}
.sitem b{font-family:var(--display);font-size:1.02rem}
.sitem small{font-size:.8rem;color:var(--muted);line-height:1.35}
.price{font-family:var(--display);font-weight:800;font-size:.95rem}
.price.own{color:var(--go)}
.castle{width:min(100%,360px);display:block;margin-inline:auto}
.castle .ghost{fill:none;stroke:var(--rock2);stroke-width:2;stroke-dasharray:5 5}
.fw circle{transform-box:fill-box;transform-origin:center;animation:fw 1.6s ease-out infinite}
.fw circle:nth-child(2){animation-delay:.5s}.fw circle:nth-child(3){animation-delay:1s}
@keyframes fw{0%{transform:scale(.1);opacity:1}100%{transform:scale(1.4);opacity:0}}
.powers{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.powers li{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;background:var(--sky2);border-radius:14px;padding:8px 12px}
.powers .f{width:36px;height:36px;border-radius:50%;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800}
.powers b{font-family:var(--display)}

/* badges / missions */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.badge{background:var(--card);border-radius:18px;padding:14px 10px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.badge .ic{font-size:2.4rem;line-height:1.1}
.badge b{font-family:var(--display)}
.badge small{color:var(--muted);font-size:.82rem;line-height:1.4}
.badge.off .ic{filter:grayscale(1);opacity:.3}
.badge.off b{color:var(--muted)}
.mlist{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.mitem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--card);border-radius:16px;padding:12px 16px}
.mitem span{font-weight:600;line-height:1.5;min-width:0}
.mitem.done span{color:var(--muted)}
.mbtn{font-family:var(--display);font-weight:700;background:var(--sun-soft);color:var(--ink);border-radius:999px;padding:6px 14px;white-space:nowrap}
.mitem.done .mbtn{background:var(--go-bg);color:var(--go)}

/* parent */
.guide{display:flex;flex-direction:column;gap:12px}
details{background:var(--card);border-radius:var(--r);padding:4px 18px}
summary{font-family:var(--display);font-weight:700;font-size:1.15rem;padding:12px 0;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--rope);font-size:1.4rem;line-height:1}
details[open] summary::after{content:"−"}
details .in{padding-bottom:16px;display:flex;flex-direction:column;gap:10px;max-width:65ch}
details ul,details ol{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
.say{width:100%;border-collapse:separate;border-spacing:0 8px}
.say td{padding:10px 12px;vertical-align:top;line-height:1.55;font-size:.98rem}
.say td:first-child{background:color-mix(in srgb,var(--rope) 14%,var(--card));border-radius:0 12px 12px 0;width:50%}
.say td:last-child{background:var(--go-bg);border-radius:12px 0 0 12px}
.say th{font-family:var(--display);text-align:right;padding:0 12px;font-size:.95rem}
.say th:first-child{color:var(--rope)} .say th:last-child{color:var(--go)}

.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translate(-50%,-170%);background:var(--ink);color:var(--card);font-family:var(--display);font-weight:800;font-size:1.1rem;padding:12px 22px;border-radius:999px;z-index:40;transition:transform .35s cubic-bezier(.3,1.5,.6,1);white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.show{transform:translate(-50%,0)}
.star-modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(8,16,28,.6);
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.star-box{background:var(--card);border-radius:28px;padding:28px 22px;max-width:420px;width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;animation:pop .6s ease}
.big-star{width:130px;animation:spin 2.4s ease-in-out infinite}
.star-banner{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;width:100%;text-align:right;background:var(--sun-soft);border-radius:var(--r);padding:12px 16px;box-shadow:0 0 0 2px var(--sun) inset}
.star-banner svg{width:56px}
.star-banner b{font-family:var(--display);font-size:1.15rem;display:block;line-height:1.3}
.star-banner span{font-size:.92rem;color:var(--muted);line-height:1.5}

@media (max-width:440px){
  h1{font-size:1.8rem}
  .node{font-size:1.2rem}
  .ncell:nth-child(even){transform:translateY(14px)}
  .tapzone{min-height:110px}
}
@media (prefers-reduced-motion:reduce){ .node.cur,.mini-star.wait,.big-star{animation:none} }
</style>

<body>

<div class="app" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="star-modal" id="starModal" hidden></div>

<script>
(function(){
const AR = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const $ = (s, r=document) => r.querySelector(s);
const app = $('#app');
const pick = a => a[(Math.random()*a.length)|0];

/* ================= WORLD DATA ================= */
const PXM = 50, GY = 300, H = 360;
const THEMES = [
 {name:'جبل الصقر', sky:['#7CC6F2','#DDF2FF'], far:'#8FB0CC', snow:'#F4F9FF', mid:'#6FAE5E', ground:'#6B4F3A', top:'#5DBB4F', obs:'#8A8F99', obs2:'#6A6F78', fly:'eagle', ceil:false, card:['#2F6FA8','#5FA3D8']},
 {name:'كهف الكنز', sky:['#1A1430','#3A2C5A'], far:'#2E2452', snow:'#4A3D7A', mid:'#3F3366', ground:'#46392F', top:'#6E5E4B', obs:'#B57BFF', obs2:'#7D4AD6', fly:'bat', ceil:true, card:['#2E2452','#6A4FA3']},
 {name:'صحراء الرمال', sky:['#FFBF66','#FFF0CF'], far:'#F2B866', snow:'#FFD89A', mid:'#E2A04F', ground:'#C68C45', top:'#E8BE73', obs:'#3E9B4F', obs2:'#2B7339', fly:'vulture', ceil:false, card:['#B8661F','#E8A64A']},
 {name:'قلعة الوحش', sky:['#24101E','#5E2633'], far:'#3A1C2A', snow:'#FF8A3D', mid:'#4E2434', ground:'#3B3B47', top:'#62626F', obs:'#FF6B2C', obs2:'#C93A14', fly:'fireball', ceil:true, card:['#4A1C2A','#9A3B45']},
];
const LEN = [120,150,180,210];
const LEVELS = [];
THEMES.forEach((th,w)=>{ for(let k=0;k<4;k++) LEVELS.push({id:`w${w}l${k}`, w, k, type:k===2?'race':'run', m:LEN[w]}); LEVELS.push({id:`w${w}b`, w, k:4, type:'boss', m:150}); });
const TOTAL = LEVELS.reduce((a,l)=>a+l.m,0);
const runNum = l => l.k<2 ? l.k+1 : 3;
const levelTitle = l => l.type==='boss' ? 'وحش «مستحيل»' : l.type==='race' ? 'سباق سعد' : 'المرحلة '+AR(runNum(l));

/* ================= SHOP / BADGES / MISSIONS ================= */
const CAPES = [{id:'red',n:'أحمر',c:'#E0502A',p:0},{id:'blue',n:'أزرق',c:'#2F80ED',p:150},{id:'green',n:'أخضر',c:'#27AE60',p:150},{id:'purple',n:'بنفسجي',c:'#8E44AD',p:250},{id:'black',n:'أسود',c:'#2C2C34',p:300},{id:'gold',n:'ذهبي',c:'#F2C230',p:600}];
const HATS = [{id:'none',n:'بدون',p:0},{id:'cap',n:'كاب',p:100},{id:'helmet',n:'خوذة',p:200},{id:'shemagh',n:'شماغ',p:300},{id:'crown',n:'تاج',p:800}];
const ABILS = [{id:'dj',n:'قفزة مزدوجة',d:'اضغط مرة ثانية في الهواء',p:400,ic:'⏫'},{id:'mag',n:'مغناطيس',d:'يجذب العملات القريبة',p:300,ic:'🧲'},{id:'heart',n:'قلب رابع',d:'٤ قلوب بدل ٣',p:500,ic:'❤️'}];
const CASTLE = [{n:'الأساس',p:100},{n:'الجدران',p:150},{n:'الباب',p:200},{n:'النوافذ',p:200},{n:'البرج',p:300},{n:'السطح',p:300},{n:'الراية',p:400},{n:'الألعاب النارية',p:500}];
const BADGES = [
 {id:'fall1',ic:'🩹',n:'أول سقطة',d:'سقطت وقمت من جديد'},

function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for (const ch of s){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function gen(L, sp, end){
  const r=rng(hashStr(L.id+'v3')), R=(a,b)=>a+r()*(b-a), P=a=>a[(r()*a.length)|0];
  const d=L.w*4+L.k, race=L.type==='race';

  let pats = race ? ['rock','rock','pit','flyer','boost','coins','double'] : ['rock','rock','tall','double','pit','pit','flyer','coins','plat'];
  if (!race && THEMES[L.w].ceil) pats.push('ceil','ceil');
  if (!race && L.w>=2) pats.push('flyer','tall','plat','double');
  const arc=(cx,h)=>{ if (r()<.6) for(let i=0;i<5;i++){ const t=i/4; coins.push({x:cx-56+t*112, y:GY-h-34-Math.sin(t*Math.PI)*56}); } };
  let x=700, lastP='';
  while (x < end-600){
    let p=P(pats); if (p===lastP && (p==='pit'||p==='plat'||p==='ceil')) p='rock'; lastP=p;
    if (p==='rock'){ const h=28+((r()*10)|0); obs.push({x,w:32,h}); arc(x+16,h); x+=32; }
    else if (p==='tall'){ obs.push({x,w:30,h:50}); arc(x+15,50); x+=30; }
    else if (p==='double'){ const g=sp*1.0; obs.push({x,w:30,h:28}); obs.push({x:x+g,w:30,h:28}); x+=g+30; }
    else if (p==='pit'){ const w=Math.min(sp*.58, R(84,104+d*5)); pits.push([x,x+w]); arc(x+w/2,4); x+=w; }
    else if (p==='plat'){ const w=sp*1.25+40, pw=130, px=x+w/2-pw/2; pits.push([x,x+w]); plats.push({x:px,y:GY-78,w:pw}); for(let i=0;i<4;i++) coins.push({x:px+20+i*30,y:GY-100}); x+=w; }
    else if (p==='flyer'){ fly.push({x:x+30,y:GY-70}); if (r()<.5) for(let i=0;i<4;i++) coins.push({x:x+i*20,y:GY-18}); x+=70; }
    else if (p==='coins'){ const hy=r()<.5?GY-18:GY-112; for(let i=0;i<6;i++) coins.push({x:x+i*28,y:hy}); x+=170; }
    else if (p==='ceil'){ ceils.push({x:x-20,w:80,b:GY-160}); obs.push({x:x+5,w:30,h:24}); x+=60; }

    if (!isBoss && !isRace){ c.fillStyle=cp?'#FFC93C':'#2FBF60'; c.beginPath(); c.arc(bx0+bw*(D.cpX/end),21,5,0,7); c.fill(); }

    if (isRace){ c.fillStyle='#2FA36B'; c.beginPath(); c.arc(bx0+bw*Math.min(1,R.saadX/end),21,7,0,7); c.fill(); c.fillStyle='#E0502A'; c.beginPath(); c.arc(bx0+bw*prog(),21,7,0,7); c.fill(); }

    if (state==='count'){ const n=Math.ceil(R.cT); const s=n>0?AR(n):'انطلق!'; c.font='800 74px "Baloo Bhaijaan 2",sans-serif'; c.lineWidth=8; c.strokeStyle='rgba(0,0,0,.45)'; c.strokeText(s,W/2,H/2); c.fillStyle='#FFC93C'; c.fillText(s,W/2,H/2); }
  }
  function loop(ts){ raf=requestAnimationFrame(loop); const dt=Math.min(.033,((ts-(last||ts))/1000)); last=ts; if (state!=='pause') step(dt); render(); }

  function endRun(won){
    const reached = (won?1:prog())*L.m, prevBest=ls.best, improved = attempts>1 && reached>prevBest+3;
    ls.best=Math.max(ls.best,reached); ls.tries=(ls.tries||0)+1;
    const firstWin = won && !ls.done;
    const bonus = won ? (firstWin?(isBoss?150:50):10) : 0;
    S.coins+=R.coins+bonus; S.earned+=R.coins+bonus;
    if (!won){ sessFails++; award('fall1'); SFX.fail(); }
    if (S.tries>=10) award('try10'); if (S.tries>=50) award('try50'); if (improved) award('better');
    if (won){ ls.done=1; if (!isRace&&!isBoss){ if (gemsGot.size>=3){ ls.gems=1; award('gems'); } if (!R.hit) ls.nohit=1; }
      if (isRace) award('race'); if (isBoss) award('boss1'); if (isBoss&&L.w===3) award('champ'); if (attempts>=5) award('comeback'); }
    if (S.earned>=500) award('coins500');
    save();
    const info={won, coins:R.coins+bonus, mGain:Math.round(ls.best-prevBest), improved, pct:Math.round(prog()*100)};
    won ? winOv(info) : failOv(info);
    checkStar();
  }
  function startOv(){
    const icon=isBoss?'👹':isRace?'🏁':'🏃';
    const line=isBoss?'اقفز فوق كلمات الوحش، واجمع كرات «بعد» ⚡ لتضربه!':isRace?'سعد سريع! اجمع الأسهم الخضراء لتسبقه إلى العلم.':'اقفز فوق العوائق، واجمع العملات والجواهر الثلاث 💎';
    ov.innerHTML=`<div class="ovc"><span class="kicker">${th.name}</span><div class="ovicon">${icon}</div><h2>${levelTitle(L)}</h2><p>${line}</p>
      ${ls.best>0&&!ls.done?`<p class="tipline">أبعد نقطة وصلتها: ${AR(Math.round(ls.best))} متر. هل تتجاوزها؟</p>`:''}

  function failOv(i){
    const saadWon = R.saadWon;
    ov.innerHTML=`<div class="ovc"><div class="ovicon">${saadWon?'🏃‍♂️':'💪'}</div><h2>${saadWon?'سعد سبقك!':'حاول مرة ثانية!'}</h2>
      <p class="muted">المحاولة رقم ${AR(attempts)} · وصلت إلى ${AR(i.pct)}٪</p>
      ${i.improved?`<p class="tipline">📈 أبعد من قبل! +${AR(i.mGain)} متر</p>`:`<p class="tipline">${saadWon?'كنت قريباً! الأسهم الخضراء تجعلك أسرع.':pick(TIPS)}</p>`}
      ${i.coins?`<div class="gain"><span class="pill">🪙 +${AR(i.coins)}</span></div>`:''}
      ${sessFails>=3&&!helpUsed&&!isRace?`<div class="saad"><span class="face">🧢</span><span><b>سعد:</b> «تبي مساعدة؟ خذ درعي، يعطيك قلباً إضافياً.»</span></div>`:''}
      <div class="row"><button class="btn big" data-a="go">مرة ثانية ↻</button></div>
      <div class="row">${sessFails>=3&&!helpUsed&&!isRace?`<button class="btn green" data-a="help">نعم يا سعد 🛡️</button>`:''}<button class="btn ghost" data-a="breath">🎈 تنفّس أولاً</button><button class="btn ghost" data-a="nav" data-v="map">الخريطة</button></div></div>`;
    ov.hidden=false;
  }
  function winOv(i){
    const nx=LEVELS[idx+1];
    const med = !isRace&&!isBoss ? `<div class="medals"><span class="medal on" title="وصلت">🏁</span><span class="medal ${gemsGot.size>=3?'on':''}" title="الجواهر">💎</span><span class="medal ${!R.hit?'on':''}" title="بلا إصابة">❤️</span></div>` : `<div class="medals"><span class="medal on">${isBoss?'⚔️':'🏆'}</span></div>`;
    ov.innerHTML=`<div class="ovc"><h2>${isBoss?'هزمت الوحش!':isRace?'سبقت سعد!':'أحسنت!'}</h2>${med}
      ${isBoss?'<p class="tipline">وحش «مستحيل» صار «ممكن»!</p>':''}
      ${attempts>=5?`<p class="tipline">🔥 أنهيتها بعد ${AR(attempts)} محاولات. هذا هو البطل الذي لا يستسلم!</p>`:''}
      <div class="gain"><span class="pill">🪙 +${AR(i.coins)}</span>${i.mGain>0?`<span class="pill">📏 +${AR(i.mGain)} متر</span>`:''}</div>
      <div class="row">${nx?`<button class="btn big" data-a="next">التالي ←</button>`:''}</div>
      <div class="row"><button class="btn ghost" data-a="again">أعد المرحلة</button><button class="btn ghost" data-a="nav" data-v="map">الخريطة</button></div></div>`;
    ov.hidden=false;
  }
  function start(){ ov.hidden=true; attempts++; S.tries++; save(); newRun(); state='count'; }
  function breathe(){
    award('breath'); let n=0;
    ov.innerHTML=`<div class="ovc"><div class="bal" id="bal"></div><h2 id="bt">شهيق…</h2><p class="muted">شمّ الوردة من أنفك… وانفخ الشمعة ببطء</p><button class="btn ghost" data-a="breathDone" id="bskip" hidden>جاهز!</button></div>`;
    const bal=$('#bal'), bt=$('#bt');
    const cyc=()=>{ if (!bal.isConnected) return; if (n>=4){ slowNext=true; start(); return; } const inh=n%2===0; bal.classList.toggle('big',inh); bt.textContent=inh?'شهيق…':'زفير…'; n++; if (n===2) $('#bskip').hidden=false; tmr=setTimeout(cyc,3000); };
    requestAnimationFrame(cyc);
  }
  const press=e=>{ if (state!=='run') return; if (e.cancelable) e.preventDefault(); holding=true; jump(); };
  const release=()=>{ holding=false; };
  const kd=e=>{ if (e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){ e.preventDefault(); if (!e.repeat) press(e); } };
  const ku=e=>{ if (e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW') release(); };
  wrap.addEventListener('pointerdown',press); window.addEventListener('pointerup',release); window.addEventListener('pointercancel',release);
  document.addEventListener('keydown',kd); document.addEventListener('keyup',ku); window.addEventListener('resize',resize);
  resize(); startOv(); raf=requestAnimationFrame(loop);
  return {
    on(a,v){
      if (a==='go'){ start(); return true; }
      if (a==='help'){ helpNext=true; helpUsed=true; award('help'); start(); return true; }
      if (a==='breath'){ breathe(); return true; }
      if (a==='breathDone'){ clearTimeout(tmr); slowNext=true; start(); return true; }
      if (a==='next'){ go('game',idx+1); return true; }
      if (a==='again'){ go('game',idx); return true; }

      if (a==='resume'){ ov.hidden=true; state=v||'run'; last=0; return true; }
      return false;
    },
    stop(){ cancelAnimationFrame(raf); clearTimeout(tmr); wrap.removeEventListener('pointerdown',press); window.removeEventListener('pointerup',release); window.removeEventListener('pointercancel',release);
      document.removeEventListener('keydown',kd); document.removeEventListener('keyup',ku); window.removeEventListener('resize',resize); }
  };
}

function buy(key,p,after){ if (S.owned[key]){ after(); return; } if (S.coins<p){ toast('تحتاج '+AR(p-S.coins)+' عملة أخرى 🪙'); return; } S.coins-=p; S.owned[key]=1; SFX.buy(); toast('اشتريتها! 🎉'); after(); }
function tentOn(a,v){
  if (a==='cape'){ const x=CAPES.find(c=>c.id===v); buy('cape:'+v,x.p,()=>{ S.cape=v; }); }
  if (a==='hat'){ const x=HATS.find(c=>c.id===v); buy('hat:'+v,x.p,()=>{ S.hat=v; }); }
  if (a==='abil'){ const x=ABILS.find(c=>c.id===v); if (S.coins<x.p){ toast('تحتاج '+AR(x.p-S.coins)+' عملة أخرى 🪙'); return; } S.coins-=x.p; S.abil[v]=1; SFX.buy(); toast(x.n+' صارت لك! '+x.ic); }
  if (a==='build'){ const x=CASTLE[S.castle]; if (!x||S.coins<x.p) return; S.coins-=x.p; S.castle++; SFX.buy(); toast('بنيت '+x.n+'! 🧱'); if (S.castle>=CASTLE.length) award('castle'); }
  save(); tentView();
}

function missionsView(){
  app.innerHTML=`<div class="view">${backBar()}<div><span class="kicker">مهام مع ماما</span><h2>مهام في الحياة الحقيقية</h2><p class="muted">أنجز المهمة، ثم تضغط ماما عليها، فتأخذ ${AR(MCOIN)} عملة.</p></div>
    <ul class="mlist">${MISS.map((m,i)=>`<li class="mitem ${S.missions[i]?'done':''}"><span>${m}</span><button class="mbtn" data-a="ms" data-v="${i}" ${S.missions[i]?'disabled':''}>${S.missions[i]?'✓ تمّت':'ماما: تمّت 🪙'}</button></li>`).join('')}</ul></div>`;
}
function missionsOn(a,v){ if (a==='ms' && !S.missions[v]){ S.missions[v]=1; S.coins+=MCOIN; S.earned+=MCOIN; SFX.buy(); toast('+'+AR(MCOIN)+' عملة! 🪙'); if (S.earned>=500) award('coins500'); save(); missionsView(); } }

        <li><b>ذكّريه بتقدّمه:</b> «شف علامة أبعد نقطة، وصلت أبعد من أول.»</li>

        <li>إن طال الغضب، أوقفا اللعب واتفقا على العودة بعد استراحة. الاستراحة ليست استسلاماً.</li></ol></div></details>
      <details><summary>قولي… وتجنّبي</summary><div class="in">
        <div style="overflow-x:auto"><table class="say"><thead><tr><th>بدلاً من</th><th>قولي</th></tr></thead><tbody>

          <tr><td>«خلاص، هاتها أسويها عنك.»</td><td>«ما أول خطوة تقدر تسويها بنفسك؟»</td></tr>
          <tr><td>«ليش تركتها؟ دائماً كذا!»</td><td>«وين وقفت؟ خلّنا نشوف المكان الصعب.»</td></tr>
          <tr><td>«شوف أخوك سعد يعرفها.»</td><td>«أنت أحسن من أمس في كذا… تذكر؟»</td></tr>
        </tbody></table></div></div></details>

      <details><summary>متى أطلب رأي مختص؟</summary><div class="in"><p>الترك عند الصعوبة طبيعي في هذا العمر. لكن إن رافقه غضب شديد متكرر، أو حزن واضح، أو قول مثل «أنا غبي» باستمرار، أو أثّر بوضوح على دراسته رغم المحاولة لأسابيع، فالحديث مع مرشد المدرسة أو طبيب الأطفال خطوة جيدة.</p></div></details>
    </div>
    <p class="muted" style="font-size:.85rem">التقدّم محفوظ على هذا الجهاز فقط، فافتحيه دائماً من الأيقونة نفسها.</p></div>`;

/* ================= EVENTS ================= */
app.addEventListener('click', e => {
  const t=e.target.closest('[data-a]'); if (!t || t.disabled) return;
  const a=t.dataset.a, v=t.dataset.v; au();
  if (a==='nav'){ go(v); return; }
  if (a==='play'){ go('game',+v); return; }
  if (a==='sound'){ S.sound=!S.sound; save(); t.textContent=S.sound?'🔊':'🔇'; return; }
  if (a==='star'){ showStar(); return; }
  if (G && G.on(a,v)) return;
  if (view==='tent') tentOn(a,v);
  if (view==='missions') missionsOn(a,v);
});

go('map');
checkStar();
})();
</script>
