<style>
/* Layout: a night-sky map of 12 planets; each planet opens a 4-stage lesson (learn, review, quiz, meteor game). Single deliberate dark "space" look. */
:root{
  --sky:#191241; --sky-2:#241a5a; --panel:#2e2473; --panel-2:#3a2f8f; --line:#4c41a8;
  --ink:#fff7e8; --muted:#beb5ef; --sun:#ffc93c; --coral:#ff6b6b; --mint:#3ee6b0; --blue:#5cc8ff; --lilac:#c39bff;
  --font:"Baloo Bhaijaan 2","Geeza Pro","Tahoma",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--sky)}
body{
  color:var(--ink); font-family:var(--font); font-size:18px; line-height:1.6;
  background:
    radial-gradient(1.5px 1.5px at 12% 18%,#fff9 50%,transparent 51%),
    radial-gradient(1px 1px at 78% 8%,#fff8 50%,transparent 51%),
    radial-gradient(2px 2px at 64% 42%,#fff5 50%,transparent 51%),
    radial-gradient(1px 1px at 30% 70%,#fff7 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 90% 80%,#fff6 50%,transparent 51%),
    radial-gradient(1px 1px at 46% 92%,#fff6 50%,transparent 51%),
    radial-gradient(ellipse at 85% -10%,#4a2f9b 0,transparent 55%),
    radial-gradient(ellipse at -10% 110%,#2b4aa8 0,transparent 50%),
    var(--sky);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.app{max-width:940px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
.eq{direction:rtl;unicode-bidi:isolate;display:inline-block;white-space:normal;font-variant-numeric:tabular-nums}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px}
.brand .rocket{width:30px;height:38px}
.bar-actions{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:700}
.pill .st{color:var(--sun)}
.iconbtn{width:44px;height:44px;border-radius:50%;background:var(--panel);border:2px solid var(--line);font-size:20px;display:grid;place-items:center}
.backbtn{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:700}

/* hero */
.hero{display:flex;align-items:center;gap:18px;padding-block:8px 18px}
.hero .rocket{width:78px;height:98px;flex:none;animation:bob 3s ease-in-out infinite}
.hero h1{margin:0;font-size:clamp(30px,6vw,46px);line-height:1.15;font-weight:800;text-wrap:balance}
.hero h1 span{color:var(--sun)}
.hero p{margin:4px 0 10px;color:var(--muted);max-width:52ch}
.prog{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
.prog .track{flex:1;max-width:260px;height:12px;border-radius:99px;background:var(--panel);overflow:hidden;border:2px solid var(--line)}
.prog .fill{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--sun));border-radius:99px;transition:width .6s}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}

/* planets */
.planets{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:18px 12px;padding-top:6px}
.planet{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;border-radius:20px;position:relative}
.planet .orb{position:relative;width:min(84px,100%);aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.6),transparent 34%),var(--p);
  box-shadow:inset -10px -12px 0 rgba(0,0,0,.2),0 0 0 4px rgba(255,255,255,.06),0 10px 24px rgba(0,0,0,.35);
  transition:transform .25s}
.planet .orb b{font-size:34px;font-weight:800;color:#1b1340;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.planet.ring .orb::after{content:"";position:absolute;inset:38% -16%;border:4px solid rgba(255,247,232,.55);border-radius:50%;transform:rotate(-18deg);pointer-events:none}
.planet:hover .orb{transform:scale(1.07) rotate(-4deg)}
.planet .pname{font-weight:700;font-size:16px}
.planet .pstars{font-size:15px;letter-spacing:2px;color:var(--sun);line-height:1}
.planet .pstars i{color:#5d53a8;font-style:normal}
.planet.locked .orb{filter:grayscale(1) brightness(.55)}
.planet.locked .pname{color:var(--muted)}
.planet .lock{position:absolute;top:36%;font-size:24px}
.planet .flag{position:absolute;top:0;inset-inline-start:8px;font-size:20px}
.planet.next .orb{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset -10px -12px 0 rgba(0,0,0,.2),0 0 0 10px rgba(255,201,60,.25),0 10px 24px rgba(0,0,0,.35)}}

/* table screen */
.thead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.thead .orb{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:24px;color:#1b1340;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.6),transparent 34%),var(--p);box-shadow:inset -6px -7px 0 rgba(0,0,0,.2)}
.thead h2{margin:0;font-size:28px;line-height:1.2}
.thead small{display:block;color:var(--muted);font-size:15px;font-weight:500}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.step{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:0;font-weight:700;font-size:15px;line-height:1.3}
.step .ic{font-size:24px}
.step.on{background:var(--sun);border-color:var(--sun);color:#1b1340;transform:translateY(-2px);box-shadow:0 6px 0 #b98a14}
.stage{animation:rise .35s ease-out}
@keyframes rise{from{transform:translateY(12px);opacity:.4}}

.mascot{display:flex;align-items:flex-end;gap:10px;margin-bottom:14px}
.mascot .rocket{width:46px;height:58px;flex:none;animation:bob 3s ease-in-out infinite}
.bubble{background:var(--ink);color:#1b1340;border-radius:20px;border-bottom-right-radius:6px;padding:10px 16px;font-weight:600;font-size:17px;line-height:1.5}
.card{background:var(--panel);border:2px solid var(--line);border-radius:24px;padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.cta{display:block;width:100%;background:var(--mint);color:#10303a;font-weight:800;font-size:21px;border-radius:20px;padding:14px;box-shadow:0 6px 0 #1f9c78;transition:transform .1s}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 #1f9c78}
.cta.sun{background:var(--sun);color:#1b1340;box-shadow:0 6px 0 #b98a14}
.ghost{background:var(--panel-2);border:2px solid var(--line);border-radius:16px;padding:10px 16px;font-weight:700}

/* learn */
.eqbig{font-size:clamp(40px,10vw,64px);font-weight:800;text-align:center;line-height:1.1}
.eqbig .ans{color:var(--sun)}
.meaning{text-align:center;color:var(--muted);font-size:18px}
.meaning b{color:var(--ink)}
.dots{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;background:var(--sky-2);border-radius:18px;overflow-x:auto}
.drow{display:flex;align-items:center;gap:6px}
.drow .dd{display:flex;gap:var(--g,5px);direction:ltr}
.drow i{width:var(--d,20px);height:var(--d,20px);border-radius:50%;background:var(--c);box-shadow:inset -2px -3px 0 rgba(0,0,0,.18)}
.drow em{font-style:normal;font-weight:800;font-size:15px;min-width:34px;text-align:center;color:var(--c);background:rgba(255,255,255,.07);border-radius:10px}
.drow.new{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.adds{text-align:center;font-weight:700;font-size:20px;color:var(--blue)}
.kctl{display:flex;align-items:center;gap:8px}
.kctl .nav{flex:none;background:var(--sun);color:#1b1340;font-weight:800;border-radius:16px;padding:10px 14px;box-shadow:0 4px 0 #b98a14}
.kctl .nav:disabled{opacity:.35}
.kchips{flex:1;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.kchip{width:38px;height:38px;border-radius:50%;background:var(--sky-2);border:2px solid var(--line);font-weight:700;font-size:17px}
.kchip.seen{border-color:var(--mint)}
.kchip.on{background:var(--sun);color:#1b1340;border-color:var(--sun);transform:scale(1.12)}
.tip h3,.known h3{margin:0 0 6px;font-size:20px;color:var(--sun)}
.tip p,.known p{margin:0}
.tip .eq{background:var(--sky-2);border-radius:10px;padding:0 8px;margin-inline:2px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:var(--sky-2);border-radius:12px;padding:4px 10px;font-weight:700;font-size:16px;border:2px solid #3e9e86}
.chip small{color:var(--muted);font-weight:500;font-size:13px;margin-inline-start:4px}
.newcount{margin-top:10px;font-weight:700;color:var(--mint)}

/* review */
.revbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.revgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.flip{perspective:700px;height:92px;padding:0}
.flip .in{position:relative;display:block;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.open .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;border-radius:18px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-weight:800;font-size:28px}
.flip .f{background:var(--panel);border:2px solid var(--line)}
.flip .f::after{content:"؟";position:absolute;top:4px;inset-inline-end:12px;font-size:16px;color:var(--muted)}
.flip .b{background:var(--sun);color:#1b1340;transform:rotateY(180deg)}
.flip.seen .f{border-color:var(--mint)}

/* quiz */
.qtop{display:flex;align-items:center;gap:10px;justify-content:space-between;font-weight:700;color:var(--muted);font-size:16px}
.segs{display:flex;gap:4px;flex:1;max-width:340px}
.segs span{flex:1;height:10px;border-radius:6px;background:var(--panel-2)}
.segs .ok{background:var(--mint)}.segs .no{background:var(--coral)}.segs .cur{background:var(--sun)}
.qcard{text-align:center;padding:24px 14px;position:relative}
.qcard .tag{display:inline-block;background:var(--lilac);color:#1b1340;font-weight:700;font-size:14px;border-radius:99px;padding:2px 12px;margin-bottom:8px}
.qcard .tag.cur{background:var(--blue)}
.qeq{font-size:clamp(42px,11vw,70px);font-weight:800;line-height:1.15}
.blank{display:inline-block;min-width:1.6em;padding:0 .2em;border-radius:16px;background:var(--sky-2);border:3px dashed var(--muted);color:var(--sun)}
.blank.good{border:3px solid var(--mint);background:var(--mint);color:#10303a}
.blank.bad{border:3px solid var(--coral);background:var(--coral);color:#fff}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{background:var(--panel-2);border:3px solid var(--line);border-radius:20px;padding:14px;font-size:34px;font-weight:800;box-shadow:0 5px 0 #1d165a}
.choice:active{transform:translateY(3px);box-shadow:0 2px 0 #1d165a}
.choice.good{background:var(--mint);border-color:var(--mint);color:#10303a}
.choice.bad{background:var(--coral);border-color:var(--coral)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;direction:ltr;max-width:380px;margin:0 auto;width:100%}
.key{background:var(--panel-2);border:2px solid var(--line);border-radius:18px;height:62px;font-size:30px;font-weight:800;box-shadow:0 4px 0 #1d165a}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 #1d165a}
.key.go{background:var(--mint);color:#10303a;border-color:var(--mint);box-shadow:0 4px 0 #1f9c78}
.key.del{background:var(--sky-2);font-size:24px}
.fb{min-height:54px;text-align:center;font-weight:700;font-size:20px}
.fb .yay{color:var(--mint);font-size:26px;display:inline-block;animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.fb .oops{color:var(--coral)}
.fb .streak{display:block;color:var(--sun);font-size:17px}
.fb .ghost{margin-top:8px}
.result{text-align:center;padding:28px 18px}
.bigstars{font-size:56px;letter-spacing:6px;line-height:1.2}
.bigstars span{display:inline-block;animation:pop .5s cubic-bezier(.3,1.6,.5,1) backwards}
.bigstars .off{filter:grayscale(1) brightness(.4)}
.result h3{font-size:30px;margin:6px 0 2px}
.result p{color:var(--muted);margin:0 0 16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* game */
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.hearts{font-size:26px;letter-spacing:2px;min-width:92px}
.hearts .lost{filter:grayscale(1) opacity(.3)}
.gq{font-size:clamp(30px,8vw,44px);font-weight:800;background:var(--ink);color:#1b1340;border-radius:18px;padding:0 16px;line-height:1.4}
.gq .blank{background:#ece3ff;border-color:#8b7fcf;color:#1b1340}
.gscore{min-width:92px;text-align:left;font-weight:800;font-size:22px;color:var(--sun)}
.gbar{height:12px;background:var(--panel);border-radius:99px;overflow:hidden;margin-bottom:8px;border:2px solid var(--line)}
.gbar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sun),var(--coral));transition:width .4s}
.arena{--msz:84px;position:relative;height:min(62vh,540px);min-height:380px;border-radius:24px;overflow:hidden;border:2px solid var(--line);
  background:radial-gradient(1.5px 1.5px at 20% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 70% 15%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 85% 55%,#fffa 50%,transparent 51%),radial-gradient(1px 1px at 40% 60%,#fff 50%,transparent 51%),linear-gradient(#0f0a2e,#2a1f6b);
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
.ground{position:absolute;inset:auto -10% -60px;height:110px;border-radius:50% 50% 0 0;background:radial-gradient(circle at 50% 0,#4b3fb0,#2b2270 70%);box-shadow:0 -4px 0 #6a5cd6}
.base{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:44px;height:56px}
.base .rocket{width:100%;height:100%}
.meteor{position:absolute;top:0;width:var(--msz);height:var(--msz);display:grid;place-items:center;will-change:transform;z-index:2}
.meteor::before{content:"";position:absolute;inset:0;border-radius:46% 54% 50% 50%/52% 46% 54% 48%;
  background:radial-gradient(circle at 30% 30%,#a08670,#6c5443 60%,#4a3829);box-shadow:inset -6px -8px 0 rgba(0,0,0,.25),0 0 0 3px #ffb35c55,0 -14px 22px #ff8a3c55;
  animation:spin 6s linear infinite}
.meteor::after{content:"";position:absolute;width:26%;height:22%;border-radius:50%;background:#5a4434;top:58%;left:22%;box-shadow:28px -26px 0 -3px #5a4434;pointer-events:none}
.meteor span{position:relative;z-index:1;font-size:32px;font-weight:800;color:#fff;text-shadow:0 2px 0 #00000088,0 0 8px #000a}
.meteor.crack{animation:crack .45s forwards}
.meteor.fade{transition:opacity .35s;opacity:0;pointer-events:none}
.meteor.crash{opacity:.9;pointer-events:none}
.meteor.crash::before{background:radial-gradient(circle,#ffd36b,#ff6b6b)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes crack{30%{filter:hue-rotate(-40deg) saturate(3)}100%{transform:scale(.4) rotate(40deg);opacity:0}}
.boom{position:absolute;width:var(--msz);height:var(--msz);pointer-events:none;z-index:3}
.boom::before{content:"";position:absolute;inset:-20%;border-radius:50%;background:radial-gradient(circle,#fff 0,var(--sun) 30%,var(--coral) 55%,transparent 70%);animation:boom .55s ease-out forwards}
.boom b{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:800;color:var(--mint);animation:float .8s ease-out forwards;text-shadow:0 2px 0 #000a}
@keyframes boom{from{transform:scale(.3);opacity:1}to{transform:scale(1.6);opacity:0}}
@keyframes float{to{transform:translateY(-60px);opacity:0}}
.shout{position:absolute;top:38%;left:0;right:0;text-align:center;font-size:36px;font-weight:800;color:var(--sun);z-index:4;pointer-events:none;animation:shout 1s ease-out forwards;text-shadow:0 3px 0 #000a}
@keyframes shout{0%{transform:scale(.4);opacity:0}25%{transform:scale(1.15);opacity:1}100%{transform:translateY(-30px);opacity:0}}
.over{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:rgba(15,10,46,.78);padding:16px;text-align:center}
.over .box{background:var(--panel);border:3px solid var(--line);border-radius:26px;padding:22px 18px;max-width:360px;width:100%}
.over h3{margin:0;font-size:30px;line-height:1.3}
.over p{color:var(--muted);margin:6px 0 14px}
.over .stack{gap:10px}
.intro .big{font-size:64px;text-align:center;line-height:1}
.intro ul{margin:8px 0 0;padding-inline-start:22px;display:flex;flex-direction:column;gap:4px}

.rocket .flame{transform-origin:32px 56px;animation:flick .18s ease-in-out infinite alternate}
@keyframes flick{to{transform:scaleY(.75)}}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,6,32,.7);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--panel);border:3px solid var(--line);border-radius:26px;padding:20px;max-width:420px;width:100%}
.modal h3{margin:0 0 12px;font-size:24px}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;border-bottom:1px solid var(--line)}
.seg{display:flex;background:var(--sky-2);border-radius:14px;padding:3px}
.seg button{padding:4px 14px;border-radius:11px;font-weight:700}
.seg button.on{background:var(--sun);color:#1b1340}
.warn{color:var(--coral);font-weight:700}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:30;background:var(--ink);color:#1b1340;font-weight:700;padding:10px 18px;border-radius:16px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px #0008}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}

@media (max-width:480px){
  body{font-size:17px}
  .step{font-size:13px}.step .ic{font-size:21px}
  .arena{--msz:74px}
  .meteor span{font-size:28px}
  .kchip{width:34px;height:34px;font-size:16px}
  .flip{height:80px}.flip .f,.flip .b{font-size:24px}
  .hearts,.gscore{min-width:72px;font-size:20px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

<script>
document.documentElement.lang='ar';document.documentElement.dir='rtl';
const DIG='٠١٢٣٤٥٦٧٨٩', KEY='mtj-progress-v1';
const DEF={unlocked:1,stars:{},done:{},digits:'ar',sound:true};
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');return Object.assign({},DEF,s||{});}catch(e){return JSON.parse(JSON.stringify(DEF));}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let S=load();
const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const D=x=>String(x).replace(/\d/g,d=>S.digits==='ar'?DIG[d]:d);
const E=x=>`<span class="eq" dir="rtl">${D(x)}</span>`;
const PC=['','#ff8a5c','#ffc93c','#3ee6b0','#5cc8ff','#c39bff','#ff7aa8','#8ee06a','#ffa94d','#4fd6e8','#ff7a7a','#a8b4ff','#f2d15c'];
const ROWC=['#ffc93c','#3ee6b0','#5cc8ff','#ff8a9a','#c39bff','#ffa94d'];
const YAY=['ممتاز!','بطل!','رائع!','أحسنت!','عبقري!','صح عليك!','يا سلام!','نجم!'];
const ROCKET=`<svg class="rocket" viewBox="0 0 64 80" aria-hidden="true"><path d="M20 48 L7 62 L8 47 L20 38Z" fill="#ff6b6b"/><path d="M44 48 L57 62 L56 47 L44 38Z" fill="#ff6b6b"/><path class="flame" d="M23 56 Q32 82 41 56Z" fill="#ffc93c"/><path d="M32 3 C46 14 48 32 46 57 L18 57 C16 32 18 14 32 3Z" fill="#fff7e8"/><path d="M32 3 C40 9 44 17 45 25 L19 25 C20 17 24 9 32 3Z" fill="#ff6b6b"/><circle cx="32" cy="37" r="9.5" fill="#5cc8ff" stroke="#2e2473" stroke-width="3"/><circle cx="28.8" cy="35.5" r="1.9" fill="#191241"/><circle cx="35.2" cy="35.5" r="1.9" fill="#191241"/><path d="M28.5 40 q3.5 3 7 0" stroke="#191241" stroke-width="1.7" fill="none" stroke-linecap="round"/></svg>`;

const TIPS={
 1:()=>`أي عدد تضربه في ${D(1)} يبقى كما هو تماماً! ${E('1 × 7 = 7')}`,
 2:()=>`الضرب في ${D(2)} يعني <b>ضاعِف العدد</b>، أي اجمعه مع نفسه: ${E('2 × 7 = 7 + 7 = 14')}`,
 3:()=>`عُدّ بالقفز ثلاث خطوات ثلاث خطوات: ${D('3، 6، 9، 12، 15، 18')} ...`,
 4:()=>`الضرب في ${D(4)} = <b>ضاعِف مرتين</b>! مثال ${E('4 × 6')}: ضاعِف ${D(6)} ← ${D(12)}، ثم ضاعِف ${D(12)} ← ${D(24)}`,
 5:()=>`نتائج جدول ${D(5)} تنتهي دائماً بـ ${D(0)} أو ${D(5)}، مثل دقائق الساعة: ${D('5، 10، 15، 20، 25')}`,
 6:()=>`جدول ${D(6)} = جدول ${D(5)} + مجموعة واحدة زيادة: ${E('6 × 4 = 5 × 4 + 4 = 24')}`,
 7:()=>`جدول ${D(7)} يبدو صعباً، لكنك تعرف أغلبه من الجداول السابقة! ركّز على الجديد مثل ${E('7 × 7 = 49')} و ${E('7 × 8 = 56')}`,
 8:()=>`الضرب في ${D(8)} = <b>ضاعِف ثلاث مرات</b>! مثال ${E('8 × 3')}: ${D(3)} ← ${D(6)} ← ${D(12)} ← ${D(24)}`,
 9:()=>`سرّ جدول ${D(9)}: اجمع رقمَي الناتج فيعطيك ${D(9)} دائماً! ${E('9 × 4 = 36')} و ${E('3 + 6 = 9')}. وحيلة أخرى: ${E('9 × 6 = 10 × 6 − 6 = 54')}`,
 10:()=>`الضرب في ${D(10)} سهل جداً: ضع صفراً بجانب العدد! ${E('10 × 7 = 70')}`,
 11:()=>`من ${D(1)} إلى ${D(9)}: كرّر الرقم مرتين! ${E('11 × 4 = 44')}. وبعدها احفظ: ${E('11 × 10 = 110')} ، ${E('11 × 11 = 121')} ، ${E('11 × 12 = 132')}`,
 12:()=>`جدول ${D(12)} = جدول ${D(10)} + جدول ${D(2)}: ${E('12 × 3 = 30 + 6 = 36')}`
};

/* ---------- sound ---------- */
let AC=null;
function tone(f,dur,type='sine',vol=.18,when=0,f2){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02);}catch(e){}}
const sfx={
 tap(){tone(520,.06,'sine',.07)},
 good(){tone(660,.12,'triangle',.2);tone(990,.22,'triangle',.2,.09)},
 bad(){tone(220,.28,'sawtooth',.07,0,140)},
 boom(){tone(300,.25,'square',.08,0,60);tone(900,.15,'triangle',.12,0,1500)},
 flip(){tone(700,.08,'triangle',.08,0,1100)},
 win(){[523,659,784,1046,1318].forEach((f,i)=>tone(f,.32,'triangle',.18,i*.11))},
 lose(){[392,330,262].forEach((f,i)=>tone(f,.3,'triangle',.14,i*.16))}
};

/* ---------- helpers ---------- */
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2400);}
function totalStars(){return Object.values(S.stars).reduce((a,b)=>a+b,0);}
function starStr(n){return '★'.repeat(n)+'<i>'+'★'.repeat(3-n)+'</i>';}
function confetti(){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const c=document.createElement('canvas');c.className='confetti';document.body.appendChild(c);
 const dpr=window.devicePixelRatio||1,W=c.width=innerWidth*dpr,H=c.height=innerHeight*dpr,ctx=c.getContext('2d');
 const cols=['#ffc93c','#3ee6b0','#5cc8ff','#ff6b6b','#c39bff','#fff7e8'];
 const ps=Array.from({length:170},()=>({x:Math.random()*W,y:-Math.random()*H*.6,vx:(Math.random()-.5)*4*dpr,vy:(2+Math.random()*4)*dpr,r:Math.random()*6.3,vr:(Math.random()-.5)*.3,s:(7+Math.random()*9)*dpr,c:cols[rnd(cols.length)]}));
 const st=performance.now();
 (function f(t){ctx.clearRect(0,0,W,H);for(const p of ps){p.x+=p.vx;p.y+=p.vy;p.vy+=.04*dpr;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();}
  if(t-st<3400)requestAnimationFrame(f);else c.remove();})(st);
}

/* ---------- facts ---------- */
function pickPrev(n){let tot=0;const w=i=>i===1?.3:i;for(let i=1;i<n;i++)tot+=w(i);let r=Math.random()*tot;for(let i=1;i<n;i++){r-=w(i);if(r<=0)return i;}return n-1;}
function makeFact(n,mode,used){
 for(let tries=0;tries<40;tries++){
  let t=n;
  if(n>1&&(mode==='prev'||(mode==='mix'&&Math.random()<.4)))t=pickPrev(n);
  const k=1+rnd(12),key=Math.min(t,k)+'x'+Math.max(t,k);
  if(used&&used.has(key))continue;
  if(used)used.add(key);
  return Math.random()<.25?{a:k,b:t,t,review:t!==n}:{a:t,b:k,t,review:t!==n};
 }
 return {a:n,b:1+rnd(12),t:n,review:false};
}
function distract(f,count){
 const a=f.a,b=f.b,p=a*b,c=new Set();
 for(const v of shuffle([a*(b+1),a*(b-1),(a+1)*b,(a-1)*b,p+1,p-1,p+10,p-10,p+2,a*(b+2),(a+2)*b])){if(v>0&&v!==p)c.add(v);if(c.size>=count)break;}
 let x=1;while(c.size<count){c.add(p+x*3);x++;}
 return [...c].slice(0,count);
}
function distractK(b,count){
 const c=new Set();for(const v of shuffle([b+1,b-1,b+2,b-2,b+3,b-3]))if(v>=1&&v<=12&&v!==b&&c.size<count)c.add(v);
 while(c.size<count){const v=1+rnd(12);if(v!==b)c.add(v);}
 return [...c];
}

function newQuiz(n){
 const used=new Set(), list=[];
 const modes=n>1?shuffle(['cur','cur','cur','cur','cur','cur','prev','prev','prev','prev']):Array(10).fill('cur');
 const types=shuffle(['choice','choice','choice','choice','input','input','input','input','missing','missing']);
 modes.forEach((m,i)=>{const f=makeFact(n,m,used);f.type=types[i];list.push(f);});
 return {n,list,i:0,score:0,res:[],retries:0,streak:0,typed:'',locked:false,finished:false};
}
function renderQuiz(){

 if(Q.i>=Q.list.length)return renderResult();

 Q.typed='';Q.locked=false;
 const segs=Array.from({length:10},(_,i)=>`<span class="${Q.res[i]===true?'ok':Q.res[i]===false?'no':i===Q.i?'cur':''}"></span>`).join('');

 const tag=f.review?`<span class="tag">مراجعة جدول ${D(f.t)}</span>`:`<span class="tag cur">جدول ${D(f.t)}</span>`;
 const eqh=f.type==='missing'
  ?`<span class="eq" dir="rtl">${D(f.a)} × <span class="blank" id="blank">؟</span> = ${D(p)}</span>`
  :`<span class="eq" dir="rtl">${D(f.a)} × ${D(f.b)} = <span class="blank" id="blank">؟</span></span>`;
 let ans='';
 if(f.type==='input'){
  ans=`<div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button class="key" data-d="${d}">${D(d)}</button>`).join('')}<button class="key del" data-x="del" aria-label="مسح">⌫</button><button class="key" data-d="0">${D(0)}</button><button class="key go" data-x="go" aria-label="تأكيد">✓</button></div>`;
 }else{
  const right=f.type==='missing'?f.b:p;
  const opts=shuffle([right,...(f.type==='missing'?distractK(f.b,3):distract(f,3))]);
  ans=`<div class="choices">${opts.map(v=>`<button class="choice" data-v="${v}">${D(v)}</button>`).join('')}</div>`;
 }
 $('#stage').innerHTML=`<div class="stack">
   <div class="qtop"><span>${label}</span><div class="segs">${segs}</div><span style="color:var(--sun)">★ ${D(Q.score)}</span></div>

   ${ans}
   <div class="fb" id="fb" aria-live="polite"></div>
  </div>`;
 if(f.type==='input'){
  document.querySelectorAll('.key').forEach(b=>b.onclick=()=>padPress(b.dataset.d??b.dataset.x));
 }else{
  document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(Q.locked)return;const ok=answer(+b.dataset.v);b.classList.add(ok?'good':'bad');if(!ok){const right=f.type==='missing'?f.b:p;const r=document.querySelector(`.choice[data-v="${right}"]`);if(r)r.classList.add('good');}});
 }
}
function padPress(x){
 if(Q.locked)return;
 if(x==='del')Q.typed=Q.typed.slice(0,-1);
 else if(x==='go'){if(Q.typed)answer(+Q.typed);return;}
 else if(Q.typed.length<3)Q.typed+=x;
 sfx.tap();
 const bl=$('#blank');if(bl)bl.textContent=Q.typed?D(Q.typed):'؟';
}
function answer(v){
 const f=Q.list[Q.i],p=f.a*f.b,right=f.type==='missing'?f.b:p,ok=v===right;
 Q.locked=true;
 const bl=$('#blank');bl.textContent=D(f.type==='input'?v:right);bl.classList.add(ok?'good':'bad');
 const fb=$('#fb');
 if(ok){
  sfx.good();Q.streak++;
  if(!f.retry){Q.score++;Q.res[Q.i]=true;}
  fb.innerHTML=`<span class="yay">${YAY[rnd(YAY.length)]} ✨</span>${Q.streak>=3?`<span class="streak">🔥 ${D(Q.streak)} إجابات صحيحة متتالية!</span>`:''}`;
  setTimeout(()=>{Q.i++;renderQuiz();},Q.streak>=3?1200:900);
 }else{
  sfx.bad();Q.streak=0;
  if(!f.retry){Q.res[Q.i]=false;if(Q.retries<3){Q.retries++;Q.list.push({...f,retry:true});}}
  const qc=$('#qcard');qc.classList.add('shake');
  fb.innerHTML=`<div class="oops">قريب! الجواب الصحيح: ${E(`${f.a} × ${f.b} = ${p}`)}</div><button class="ghost" id="fbnext">فهمت، التالي ←</button>`;
  $('#fbnext').onclick=()=>{sfx.tap();Q.i++;renderQuiz();};
 }
 return ok;
}

function startGame(){
 stopGame();
 $('#stage').innerHTML=`<div class="hud"><div class="hearts" id="hearts"></div><div class="gq" id="gq"></div><div class="gscore" id="gscore"></div></div>
  <div class="gbar"><span id="gbar"></span></div>
  <div class="arena" id="arena"><div class="ground"></div><div class="base">${ROCKET}</div></div>`;
 G={n:cur.n,hearts:3,score:0,goal:12,ms:[],q:null,paused:true,raf:0,last:0,over:false,combo:0};
 updHud();nextRound();
 G.raf=requestAnimationFrame(loop);
 const ar=$('#arena');if(ar)ar.scrollIntoView({behavior:'smooth',block:'center'});
}
function updHud(){
 if(!G)return;
 $('#hearts').innerHTML=[0,1,2].map(i=>`<span class="${i<G.hearts?'':'lost'}">❤️</span>`).join('');
 $('#gscore').innerHTML=`☄️ ${D(G.score)}/${D(G.goal)}`;
 $('#gbar').style.width=(G.score/G.goal*100)+'%';
}
function nextRound(){
 const ar=$('#arena');if(!ar||!G||G.over)return;
 G.ms.forEach(m=>m.el.remove());G.ms=[];
 const f=makeFact(G.n,'mix');G.q=f;const p=f.a*f.b;
 $('#gq').innerHTML=`<span class="eq" dir="rtl">${D(f.a)} × ${D(f.b)} = <span class="blank" id="gblank">؟</span></span>`;
 const cnt=G.score<5?3:4;
 const vals=shuffle([p,...distract(f,cnt-1)]), lanes=shuffle([...Array(cnt).keys()]);
 vals.forEach((v,i)=>{
  const el=document.createElement('button');el.type='button';el.className='meteor';el.innerHTML=`<span>${D(v)}</span>`;
  el.style.left=`calc(${(lanes[i]+.5)/cnt*100}% - var(--msz) / 2)`;
  const m={el,v,y:-110-Math.random()*90,alive:true,ok:v===p};
  el.style.transform=`translateY(${m.y}px)`;
  el.addEventListener('pointerdown',e=>{e.preventDefault();hit(m);});
  ar.appendChild(el);G.ms.push(m);
 });
 G.paused=false;
}
function loop(t){
 if(!G||G.over)return;
 const dt=Math.min(.05,(t-(G.last||t))/1000);G.last=t;
 if(!G.paused){
  const ar=$('#arena');const H=ar?ar.clientHeight:420;
  const speed=(H/10)*(1+G.score*.07+(G.n>6?.12:0));
  const limit=H-(ar?parseFloat(getComputedStyle(ar).getPropertyValue('--msz')):84)-30;
  for(const m of G.ms){
   if(!m.alive)continue;
   m.y+=speed*dt;m.el.style.transform=`translateY(${m.y}px)`;
   if(m.y>limit){if(m.ok){miss(m);break;}m.alive=false;m.el.classList.add('fade');}
  }
 }
 G.raf=requestAnimationFrame(loop);
}
function shout(txt){const ar=$('#arena');if(!ar)return;const s=document.createElement('div');s.className='shout';s.textContent=txt;ar.appendChild(s);setTimeout(()=>s.remove(),1000);}
function hit(m){
 if(!G||G.over||G.paused||!m.alive)return;
 if(m.ok){
  G.paused=true;m.alive=false;G.score++;G.combo++;
  const ar=$('#arena'),b=document.createElement('div');b.className='boom';b.style.left=m.el.style.left;b.style.top=m.y+'px';b.innerHTML=`<b>+${D(1)}</b>`;ar.appendChild(b);setTimeout(()=>b.remove(),800);
  m.el.remove();sfx.boom();setTimeout(()=>sfx.good(),60);
  G.ms.forEach(o=>{if(o.alive){o.alive=false;o.el.classList.add('fade');}});
  const bl=$('#gblank');if(bl){bl.textContent=D(m.v);bl.classList.add('good');}
  if(G.combo===3||G.combo===6||G.combo===9)shout(`🔥 ${D(G.combo)} متتالية!`);
  updHud();
  if(G.score>=G.goal)setTimeout(win,600);else setTimeout(nextRound,650);
 }else{
  m.alive=false;m.el.classList.add('crack');G.combo=0;sfx.bad();loseHeart();
 }
}
function miss(m){
 G.paused=true;m.alive=false;m.el.classList.add('crash');G.combo=0;
 const bl=$('#gblank');if(bl){bl.textContent=D(m.v);bl.classList.add('bad');}
 sfx.bad();shout('فاتك! 😮');loseHeart();
 if(G&&!G.over&&G.hearts>0)setTimeout(()=>{if(G&&!G.over)nextRound();},1300);
}
function loseHeart(){
 G.hearts--;updHud();const h=$('#hearts');h.classList.remove('shake');void h.offsetWidth;h.classList.add('shake');
 if(G.hearts<=0){G.paused=true;setTimeout(lose,700);}
}
function overlay(html){const ar=$('#arena');if(!ar)return;const o=document.createElement('div');o.className='over';o.innerHTML=`<div class="box">${html}</div>`;ar.appendChild(o);}
function lose(){
 if(!G)return;G.over=true;cancelAnimationFrame(G.raf);sfx.lose();
 const sc=G.score;
 overlay(`<h3>انتهت القلوب 💔</h3><p>أصبت ${D(sc)} من ${D(12)}. أنت قريب، حاول مرة ثانية!</p><div class="stack"><button class="cta sun" id="gre">العب مرة أخرى 🔄</button><button class="ghost" id="grev">راجع البطاقات أولاً</button></div>`);
 $('#gre').onclick=()=>{sfx.tap();startGame();};
 $('#grev').onclick=()=>{sfx.tap();setStage(1);};
}
function win(){
 if(!G)return;G.over=true;cancelAnimationFrame(G.raf);
 const n=G.n,perfect=G.hearts===3,first=!S.done[n];
 S.done[n]=true;S.unlocked=Math.max(S.unlocked,Math.min(12,n+1));save();renderBar();
 sfx.win();confetti();
 const nxt=n<12;
 overlay(`<h3>${nxt?'فزت! 🎉':'أكملت الرحلة كلها! 🏆'}</h3>
  <p>${perfect?'بدون أي خطأ! أنت حارس الكوكب الأسطوري. ':''}${nxt?(first?`فتحت كوكب جدول ${D(n+1)} 🪐`:'حميت الكوكب مرة ثانية!'):'تعلّمت جداول الضرب من '+D(1)+' إلى '+D(12)+'. فخورون بك!'}</p>
  <div class="stack">${nxt?`<button class="cta sun" id="gnext">إلى جدول ${D(n+1)} 🚀</button>`:''}<button class="ghost" id="gre">العب مرة أخرى</button><button class="ghost" id="gmap">الخريطة</button></div>`);
 if(nxt)$('#gnext').onclick=()=>{sfx.tap();openTable(n+1,0);scrollTo(0,0);};
 $('#gre').onclick=()=>{sfx.tap();startGame();};
 $('#gmap').onclick=()=>{sfx.tap();goHome();};
}

/* ---------- settings ---------- */
function openSettings(){
 sfx.tap();const md=$('#modal');md.hidden=false;
 const draw=(confirmReset)=>{
  md.innerHTML=`<div class="box" role="dialog" aria-label="الإعدادات"><h3>الإعدادات</h3>
   <div class="set"><span>شكل الأرقام</span><div class="seg"><button data-dg="ar" class="${S.digits==='ar'?'on':''}">١٢٣</button><button data-dg="en" class="${S.digits==='en'?'on':''}">123</button></div></div>
   <div class="set"><span>الأصوات</span><div class="seg"><button data-sd="1" class="${S.sound?'on':''}">تشغيل</button><button data-sd="0" class="${!S.sound?'on':''}">إيقاف</button></div></div>
   <div class="set"><span>للوالدين: فتح كل الكواكب</span><button class="ghost" id="unl">فتح الكل</button></div>
   <div class="set" style="border:0">${confirmReset?`<span class="warn">متأكد؟ ستُمسح كل النجوم.</span><div style="display:flex;gap:6px"><button class="ghost" id="rsyes" style="background:var(--coral)">نعم امسح</button><button class="ghost" id="rsno">لا</button></div>`:`<span>بدء الرحلة من جديد</span><button class="ghost" id="rs">مسح التقدم</button>`}</div>
   <button class="cta" id="close" style="margin-top:14px">تم</button></div>`;
  md.querySelectorAll('[data-dg]').forEach(b=>b.onclick=()=>{S.digits=b.dataset.dg;save();draw();refresh();});
  md.querySelectorAll('[data-sd]').forEach(b=>b.onclick=()=>{S.sound=b.dataset.sd==='1';save();draw();sfx.tap();});
  $('#unl').onclick=()=>{S.unlocked=12;save();toast('فُتحت كل الكواكب 🔓');refresh();};
  const rs=$('#rs');if(rs)rs.onclick=()=>draw(true);
  const ry=$('#rsyes');if(ry)ry.onclick=()=>{const keep={digits:S.digits,sound:S.sound};S=Object.assign(JSON.parse(JSON.stringify(DEF)),keep);save();md.hidden=true;goHome();toast('بدأت رحلة جديدة 🚀');};
  const rn=$('#rsno');if(rn)rn.onclick=()=>draw(false);
  $('#close').onclick=()=>{md.hidden=true;};
 };
 draw(false);
 md.onclick=e=>{if(e.target===md)md.hidden=true;};
}
function refresh(){renderBar();if(cur.screen==='home')renderHome();else if(cur.stage!==3)renderTable();}

renderBar();renderHome();
</script>

</body></html>
