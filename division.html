<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>أبطال القسمة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="apple-touch-icon" sizes="180x180" href="https://kprpwd2wgn-ops.github.io/Rakan/division-icon-v2.png">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="https://kprpwd2wgn-ops.github.io/Rakan/division-icon-v2.png">
<link rel="icon" type="image/png" sizes="32x32" href="https://kprpwd2wgn-ops.github.io/Rakan/division-icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="https://kprpwd2wgn-ops.github.io/Rakan/division-icon-192.png">
<link rel="manifest" href="https://kprpwd2wgn-ops.github.io/Rakan/division.webmanifest">
<meta property="og:title" content="أبطال القسمة">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kprpwd2wgn-ops.github.io/Rakan/division.html">
<meta property="og:image" content="https://kprpwd2wgn-ops.github.io/Rakan/division-icon-v2.png">
<meta name="twitter:card" content="summary">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="القسمة">
<meta name="theme-color" content="#e8505b">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&family=Lalezar&display=swap">
<style>/* Layout: a bakery counter. Striped awning header, plates of cookies as the main motif, one centered column. Single committed light look. */
:root{
  --bg:#e8f6f0; --card:#ffffff; --ink:#173b39; --ink-2:#4e6f6b; --line:#cde6dc;
  --jam:#e8505b; --cookie:#d08a3c; --cookie-2:#8e5a24; --sun:#ffc53d; --ok:#2fa86b; --bad:#e8505b; --plate:#f5fbf8;
  --f-display:"Lalezar","Baloo Bhaijaan 2",Tahoma,"Segoe UI",sans-serif;
  --f-body:"Baloo Bhaijaan 2",Tahoma,"Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;direction:rtl;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px;
  background-image:radial-gradient(circle at 1px 1px,rgba(23,59,57,.07) 1.2px,transparent 1.6px);background-size:22px 22px;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--jam)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.25}
p{margin:0}
.wrap{max-width:760px;margin:0 auto}
[hidden]{display:none!important}
.muted{color:var(--ink-2)}

/* awning header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 26px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
  background:repeating-linear-gradient(90deg,var(--jam) 0 30px,#fff6f0 30px 60px)}
.hdr::after{content:"";position:absolute;left:0;right:0;top:100%;height:14px;
  background:radial-gradient(circle at 15px 0,var(--jam) 14px,transparent 15px) 0 0/60px 14px repeat-x,radial-gradient(circle at 45px 0,#fff6f0 14px,transparent 15px) 0 0/60px 14px repeat-x;
  filter:drop-shadow(0 3px 0 rgba(23,59,57,.12))}
.hdr-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px}
.back{width:44px;height:44px;border-radius:14px;background:var(--card);display:grid;place-items:center;flex:none;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.back svg{width:22px;height:22px}
.ttl{flex:1;min-width:0;font-family:var(--f-display);font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--card);border-radius:14px;padding:4px 12px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.hud{display:flex;gap:6px;flex:none}
.pill{display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:14px;background:var(--card);font-weight:800;font-size:15px;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.15)}

/* common */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:8px 22px;border-radius:18px;
  background:var(--jam);color:#fff;font-weight:800;font-size:18px;box-shadow:0 5px 0 #b83640;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b83640}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 5px 0 #c9951a}
.btn.ok{background:var(--ok);box-shadow:0 5px 0 #1f7a4c}
.btn.ghost{background:var(--card);color:var(--ink);border:2.5px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.sm{min-height:40px;font-size:15px;padding:4px 14px}
.btn.wide{width:100%}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 4px 0 var(--line)}
.sec{font-size:24px;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:3px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--cookie) 0 8px,transparent 8px 16px);opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stars{letter-spacing:2px;color:var(--sun);font-size:17px;line-height:1;text-shadow:0 1px 0 #c9951a}
.stars .off{color:#d5e6df;text-shadow:none}

/* home */
.hello{display:flex;gap:14px;align-items:center}
.av{font-size:44px;width:74px;height:74px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--card);border:4px solid var(--cookie);box-shadow:0 4px 0 var(--line)}
.hello h1{font-size:30px}
.lvl{font-weight:800;color:var(--cookie-2)}
.bar{height:12px;border-radius:99px;background:var(--card);overflow:hidden;margin:6px 0 2px;box-shadow:inset 0 0 0 2px var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--cookie));border-radius:99px;transition:width .6s}
.sub{font-size:14px;color:var(--ink-2)}
.suggest{margin-top:18px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--card);border:3px dashed var(--cookie);border-radius:20px;padding:12px 16px}
.suggest p{font-weight:600;min-width:0;flex:1 1 200px}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px 12px;background:var(--card);border-radius:22px;box-shadow:0 4px 0 var(--line);transition:transform .15s}
.tile:hover{transform:translateY(-3px)}
.tile:active{transform:scale(.96)}
.plate{width:78px;aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--plate);display:grid;place-items:center;
  box-shadow:inset 0 0 0 6px #fff,inset 0 0 0 8px var(--c),0 3px 0 var(--line)}
.plate .tn{font-family:var(--f-display);font-size:34px;line-height:1;color:var(--c)}
.tile .tl{font-size:13px;color:var(--ink-2);font-weight:600}
.tile .mb{width:76%;height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:3px}
.tile .mb i{display:block;height:100%;background:var(--c)}
.tile .crown{position:absolute;top:6px;left:8px;font-size:16px}

.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:640px){.modes{grid-template-columns:repeat(3,1fr)}}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:start;padding:16px;border-radius:22px;background:var(--card);box-shadow:0 4px 0 var(--line);transition:transform .15s}
.mode:hover{transform:translateY(-3px)}
.mode .mi{font-size:34px;line-height:1}
.mode h3{font-size:21px}
.mode p{font-size:14px;color:var(--ink-2);line-height:1.45}
.mode.feature{grid-column:1/-1;background:linear-gradient(135deg,#fff 0%,#fff3e3 100%);border:3px solid var(--cookie)}

/* lessons */
.lessons{display:grid;gap:10px}
.lesson{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:20px;background:var(--card);box-shadow:0 4px 0 var(--line);text-align:start}
.lesson .ln{width:46px;height:46px;flex:none;border-radius:50%;background:var(--cookie);color:#fff;font-family:var(--f-display);font-size:24px;display:grid;place-items:center}
.lesson.done .ln{background:var(--ok)}
.lesson h3{font-size:20px}
.lesson p{font-size:14px;color:var(--ink-2)}
.explain{font-size:18px;font-weight:600;margin-bottom:12px}
.explain b{color:var(--jam)}
.stepper{display:flex;align-items:center;gap:8px;background:var(--plate);border-radius:16px;padding:6px 10px;box-shadow:inset 0 0 0 2px var(--line)}
.stepper button{width:40px;height:40px;border-radius:12px;background:var(--card);box-shadow:0 3px 0 var(--line);font-size:22px;font-weight:800}
.stepper output{min-width:2.2em;text-align:center;font-family:var(--f-display);font-size:28px}
.stepper label{font-weight:800;font-size:15px}
.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:12px}

/* cookies and plates (distributor) */
.pile{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:30px;padding:8px;border-radius:16px;background:#fff3e3;margin-bottom:12px;direction:ltr}
.ck{width:24px;height:24px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 30% 35%,var(--cookie-2) 0 2.4px,transparent 3px),radial-gradient(circle at 65% 30%,var(--cookie-2) 0 2px,transparent 2.6px),radial-gradient(circle at 55% 68%,var(--cookie-2) 0 2.4px,transparent 3px),radial-gradient(circle at 28% 70%,var(--cookie-2) 0 1.8px,transparent 2.4px),var(--cookie);
  box-shadow:inset -2px -3px 0 rgba(0,0,0,.15)}
.ck.in{animation:ckin .3s}
@keyframes ckin{from{transform:translateY(-24px) scale(.4);opacity:0}}
.plates{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;direction:rtl}
.pl{display:flex;flex-direction:column;align-items:center;gap:4px}
.pl .disk{width:100%;max-width:110px;aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 5px var(--plate),inset 0 0 0 7px var(--c,var(--cookie)),0 3px 0 var(--line);
  display:flex;flex-wrap:wrap;gap:3px;align-content:center;justify-content:center;padding:16px;direction:ltr}
.pl .disk .ck{width:16px;height:16px}
.pl .who{font-size:13px;font-weight:800;color:var(--ink-2)}
.pl .cnt{font-family:var(--f-display);font-size:20px;color:var(--c,var(--cookie-2));line-height:1}
.box .disk{border-radius:16px}
.leftover{margin-top:12px;padding:10px;border-radius:16px;border:3px dashed var(--jam);text-align:center}
.leftover .row{justify-content:center;direction:ltr;gap:4px;min-height:24px}
.answer{margin-top:14px;text-align:center;font-weight:800;font-size:19px}
.answer .eq{font-size:44px}

/* fact family */
.tri{position:relative;width:min(280px,80vw);aspect-ratio:1.1;margin:8px auto 4px}
.tri svg{position:absolute;inset:0;width:100%;height:100%}
.tri .n{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:38px;line-height:1}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.fact{padding:10px;border-radius:14px;background:var(--plate);font-family:var(--f-display);font-size:26px;text-align:center;box-shadow:inset 0 0 0 2px var(--line);direction:rtl}
.fact.div{background:#fff3e3;box-shadow:inset 0 0 0 2px #f4d3a8}
.parts{display:flex;justify-content:center;gap:clamp(4px,2vw,14px);direction:rtl;margin:14px 0;flex-wrap:wrap}
.part{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:62px}
.part .big{font-family:var(--f-display);font-size:clamp(40px,12vw,60px);line-height:1.1}
.part .lab{font-size:13px;font-weight:800;padding:2px 8px;border-radius:9px;background:var(--plate);text-align:center}
.part.pick .big{cursor:pointer;border-radius:14px;padding:0 8px;box-shadow:0 3px 0 var(--line);background:#fff}
.rules{display:grid;gap:10px}
.rule{padding:14px 16px;border-radius:18px;background:var(--card);box-shadow:0 4px 0 var(--line);border-inline-start:7px solid var(--c)}
.rule h3{font-size:20px;color:var(--c)}
.rule .ex{display:inline-block;margin-top:6px;padding:4px 12px;border-radius:10px;background:var(--plate);font-weight:800}

/* divisor screen */
.thead{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.thead .plate{width:96px}
.thead .plate .tn{font-size:42px}
.thead h1{font-size:26px;color:var(--c)}
.tabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:18px;margin-bottom:16px;box-shadow:0 4px 0 var(--line)}
.tab{flex:1;min-height:46px;border-radius:14px;font-weight:800;font-size:16px;color:var(--ink-2)}
.tab.on{background:var(--c);color:#fff}
.trows{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (max-width:420px){.trows{grid-template-columns:1fr}}
.trow{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-radius:16px;background:var(--card);box-shadow:0 3px 0 var(--line);font-family:var(--f-display);font-size:23px;direction:rtl;border:2.5px solid transparent}
.trow.on{border-color:var(--c)}
.trow .p{color:var(--c);min-width:2em;text-align:center;border-radius:10px}
.trow .p.hid{background:var(--line);color:transparent}
.secret{border-inline-start:7px solid var(--c);padding:14px 16px;border-radius:18px;background:var(--card);margin-bottom:12px;box-shadow:0 4px 0 var(--line)}
.secret h3{font-size:21px;color:var(--c);margin-bottom:4px}
.secret .ex{margin-top:8px;padding:6px 12px;background:var(--plate);border-radius:10px;font-weight:800;display:inline-block;font-size:18px}
.nick{display:inline-block;background:var(--c);color:#fff;border-radius:10px;padding:2px 12px;font-weight:800;margin-bottom:12px}
.didyou{border:3px dashed var(--c);border-radius:18px;padding:14px 16px;margin-top:6px;background:var(--card)}
.didyou h3{font-size:19px;margin-bottom:4px}
.acts{display:grid;gap:10px}
.act{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:20px;background:var(--card);box-shadow:0 4px 0 var(--line);text-align:start;border-inline-start:7px solid var(--c,var(--cookie))}
.act .ai{font-size:34px;flex:none;width:48px;text-align:center}
.act h3{font-size:20px}
.act p{font-size:14px;color:var(--ink-2)}
.act .best{margin-inline-start:auto;flex:none;font-size:13px;font-weight:800;color:var(--cookie-2);text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-width:46px;height:44px;border-radius:12px;border:2.5px solid var(--c,var(--line));font-family:var(--f-display);font-size:19px;color:var(--c,var(--ink));background:var(--card);opacity:.45}
.chip.on{opacity:1;background:color-mix(in srgb,var(--c) 12%,#fff)}
.chip.txt{font-family:var(--f-body);font-size:14px;font-weight:800;padding:0 12px;opacity:1;--c:var(--ink-2)}

/* quiz */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;font-weight:800}
.qlives{font-size:20px;letter-spacing:2px}
.tbar{height:10px;border-radius:99px;background:var(--card);overflow:hidden;margin-bottom:12px;box-shadow:inset 0 0 0 2px var(--line)}
.tbar i{display:block;height:100%;background:var(--c);width:100%;transition:width .1s linear}
.tbar.low i{background:var(--bad)}
.eqcard{text-align:center;padding:18px 10px 12px;border-radius:26px;background:var(--card);box-shadow:0 5px 0 var(--line);border:3px solid var(--c);position:relative}
.eq{display:flex;justify-content:center;align-items:center;gap:.28em;direction:rtl;font-family:var(--f-display);line-height:1.2}
.eq.big{font-size:clamp(44px,13vw,70px)}
.eq .op{color:var(--ink-2);font-size:.7em}
.eq .ans{min-width:1.6em;border-bottom:4px dashed var(--c);color:var(--c)}
.eq .ans.empty{color:#c6dcd4}
.fb{min-height:30px;font-weight:800;font-size:18px}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.eqcard.ok{animation:okglow .5s}.eqcard.bad{animation:shake .45s}
@keyframes okglow{40%{background:#e3f7ec;transform:scale(1.03)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.hintrow{display:flex;justify-content:center;margin:10px 0 0}
.hintbox{margin-top:10px;padding:10px 14px;border-radius:14px;background:#fff3e3;border:2.5px dashed var(--cookie);text-align:center;font-weight:600}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px auto 0;max-width:380px}
.k{height:60px;border-radius:16px;background:var(--card);font-family:var(--f-display);font-size:30px;box-shadow:0 4px 0 var(--line);transition:transform .06s}
.k:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.k.go{background:var(--ok);color:#fff;box-shadow:0 4px 0 #1f7a4c}
.k.del{font-size:24px}

/* overlay */
.ov{position:fixed;inset:0;z-index:50;background:rgba(23,59,57,.5);display:grid;place-items:center;animation:fade .25s;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@keyframes fade{from{opacity:0}}
.res{width:min(420px,100%);background:var(--card);border-radius:28px;padding:24px 20px;text-align:center;box-shadow:0 8px 0 var(--line);animation:bounce .5s;border-top:10px solid var(--jam);max-height:100%;overflow:auto}
@keyframes bounce{0%{transform:scale(.6)}60%{transform:scale(1.05)}}
.res h2{font-size:30px;color:var(--jam)}
.res .bigs{font-size:46px;letter-spacing:6px;margin:4px 0}
.res .bigs span{display:inline-block;animation:starin .5s backwards}
.res .bigs span:nth-child(2){animation-delay:.25s}.res .bigs span:nth-child(3){animation-delay:.5s}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}}
.res .score{font-family:var(--f-display);font-size:56px;line-height:1.1}
.res ul{list-style:none;padding:0;margin:8px 0 16px;display:grid;gap:4px;font-weight:600}
.res .btns{display:grid;gap:10px}
.toasts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;z-index:60;display:grid;justify-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--ink);color:#fff;font-weight:800;padding:10px 18px;border-radius:16px;animation:toastin .35s;max-width:100%}
@keyframes toastin{from{transform:translateY(30px);opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}

/* balloons -> floating cookies jars: reuse balloon mechanic */
.sky{position:relative;height:min(62vh,520px);border-radius:26px;overflow:hidden;background:linear-gradient(180deg,#bfe9ff 0%,#e3f6ff 70%,#d7f2e4 100%);box-shadow:0 5px 0 var(--line)}
.sky .cloud{position:absolute;background:#fff;border-radius:99px;opacity:.85}
.qbubble{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:3;background:var(--card);border-radius:18px;padding:4px 18px;font-family:var(--f-display);font-size:32px;box-shadow:0 5px 0 var(--line);white-space:nowrap}
.balloon{position:absolute;bottom:-120px;width:78px;height:96px;margin-left:-39px;z-index:2;border-radius:50% 50% 48% 52% / 58% 58% 42% 42%;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.7) 0 10%,transparent 26%),var(--c);box-shadow:inset -8px -10px 0 rgba(0,0,0,.12);
  font-family:var(--f-display);font-size:30px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2);animation:rise var(--dur) linear forwards,sway 1.6s ease-in-out infinite alternate}
.balloon::after{content:"";position:absolute;top:100%;left:50%;width:2px;height:46px;background:rgba(23,59,57,.35)}
@keyframes rise{from{bottom:-120px}to{bottom:110%}}
@keyframes sway{from{margin-left:-46px}to{margin-left:-32px}}
.balloon.popped{animation:popb .25s forwards;pointer-events:none}
@keyframes popb{to{transform:scale(1.7);opacity:0}}
.balloon.wrong{animation:popb .3s forwards;filter:grayscale(1)}

function record(d,q,ok,coin=1){
  const k=fk(d,q),f=S.stats[k]||{c:0,w:0,s:0};
  if(ok){f.c++;f.s++;S.streak++;S.correct++;if(S.streak>S.bestStreak)S.bestStreak=S.streak;addCoins(coin);if(S.streak%10===0)toast(`🔥 ${D(S.streak)} إجابات صحيحة متتالية!`);}

}

function distractQ(q,d,n=3){const set=new Set();const c=shuffle([q+1,q-1,q+2,q-2,d!==q?d:q+3,q+10,q*2]);
  for(const x of c){if(x>0&&x!==q&&!set.has(x))set.add(x);if(set.size>=n)break;}while(set.size<n){const x=rint(1,13);if(x!==q)set.add(x);}return[...set];}

function seeded(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
  return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return(h>>>0)/4294967296;};}

const ck=(cls='')=>`<i class="ck ${cls}"></i>`;
function distribute(box,{total,groups,mode='share',speed=140,onDone}){
  // mode share: groups = عدد الأطفال، نوزّع واحدة واحدة. mode group: groups = حجم العلبة
  distTimers.forEach(clearTimeout);distTimers=[];const timers=distTimers;
  let plates,each,rem,count;
  if(mode==='share'){count=groups;each=Math.floor(total/groups);rem=total%groups;}else{count=Math.floor(total/groups);each=groups;rem=total%groups;}
  box.innerHTML=`<div class="pile" id="pile">${ck().repeat(total)}</div>
   <div class="plates ${mode==='group'?'box':''}">${[...Array(Math.max(count,0))].map((_,i)=>`<div class="pl" style="--c:${COLORS[(i%12)+1]}"><div class="disk" data-p="${i}"></div><span class="cnt" data-c="${i}">${D(0)}</span><span class="who">${mode==='share'?`طفل ${D(i+1)}`:`علبة ${D(i+1)}`}</span></div>`).join('')}</div>
   <div class="leftover" ${rem?'':'hidden'} id="left"><b>الباقي 🍪</b><div class="row" id="lrow"></div></div>`;
  const pile=$('#pile',box),cnt=new Array(count).fill(0);
  const seq=[];
  if(mode==='share'){for(let r=0;r<each;r++)for(let p=0;p<count;p++)seq.push(p);}else{for(let p=0;p<count;p++)for(let r=0;r<each;r++)seq.push(p);}
  for(let r=0;r<rem;r++)seq.push(-1);
  seq.forEach((p,i)=>timers.push(setTimeout(()=>{
    const first=pile.querySelector('.ck');if(first)first.remove();
    if(p<0){$('#lrow',box).insertAdjacentHTML('beforeend',ck('in'));}
    else{$(`.disk[data-p="${p}"]`,box).insertAdjacentHTML('beforeend',ck('in'));cnt[p]++;$(`[data-c="${p}"]`,box).textContent=D(cnt[p]);}
    if(i===seq.length-1&&onDone)setTimeout(onDone,250);
  },i*speed)));
  if(!seq.length&&onDone)onDone();
  return{each,rem,count};
}

SCREENS.quiz=(o)=>{
  setTitle(o.title);
  let i=0,score=0,wrong=0,hints=0,lives=o.lives||0,q=null,locked=false,hinted=false,t0=Date.now(),done=false;
  view.innerHTML=`<div style="--c:${o.color||'var(--jam)'}"><div class="qtop"><span id="qp"></span><span class="qlives" id="ql"></span><span id="qs"></span></div>
    <div class="tbar" id="tbar" ${o.totalTime?'':'hidden'}><i id="tf"></i></div>
    <div class="eqcard" id="card"><div id="eq"></div><div class="fb" id="fb"></div></div><div class="hintbox" id="hb" hidden></div>
    ${o.hint?'<div class="hintrow"><button class="btn ghost sm" id="hbtn">💡 تلميح</button></div>':''}${keypadHTML()}</div>`;
  const kp=bindKeypad(view,{onChange:v=>{if(!locked)$('#eq').innerHTML=eqHTML(q.D,q.d,v===''?'':D(v),'big');},onSubmit:submit});
  const top=()=>{$('#qp').textContent=o.total?`${D(Math.min(i+1,o.total))} / ${D(o.total)}`:'';$('#ql').innerHTML=o.lives?[...Array(o.lives)].map((_,k)=>k<lives?'❤️':'🤍').join(''):'';$('#qs').textContent=`✅ ${D(score)}`;};
  function next(){if(done)return;if(o.total&&i>=o.total)return end(true);q=o.gen(i);locked=false;hinted=false;
    $('#eq').innerHTML=eqHTML(q.D,q.d,'','big');$('#fb').textContent='';$('#fb').className='fb';$('#hb').hidden=true;kp.reset();top();}
  function submit(v){if(locked||done)return;locked=true;const ok=v===q.q,card=$('#card');card.classList.remove('ok','bad');void card.offsetWidth;
    $('#eq').innerHTML=eqHTML(q.D,q.d,D(q.q),'big');
    if(ok){score+=hinted?.5:1;card.classList.add('ok');$('#fb').className='fb ok';$('#fb').textContent=pick(['ممتاز! 🌟','رائع! 👏','أحسنت! 💪','عبقري! 🧠','صح! 🎯']);record(q.d,q.q,true,hinted?0:1);i++;top();setTimeout(next,o.fast?300:650);}
    else{wrong++;card.classList.add('bad');record(q.d,q.q,false);$('#fb').className='fb bad';$('#fb').innerHTML=`الصواب ${D(q.q)}، لأن ${D(q.d)} × ${D(q.q)} = ${D(q.D)}`;
      if(o.lives){lives--;top();if(lives<=0){setTimeout(()=>end(false),1500);return;}}
      if(o.suddenDeath){setTimeout(()=>end(false),1500);return;}i++;setTimeout(next,1800);}}
  function end(complete){if(done)return;done=true;keyHandler=null;o.onEnd({score,wrong,hints,count:i,time:Math.round((Date.now()-t0)/1000),complete});}
  if(o.hint)$('#hbtn').onclick=()=>{if(locked||hinted)return;hinted=true;hints++;$('#hb').hidden=false;$('#hb').innerHTML='💡 '+D(hintFor(q.D,q.d));};
  if(o.totalTime){const iv=setInterval(()=>{if(done)return;const left=Math.max(0,o.totalTime-(Date.now()-t0)/1000);$('#tf').style.width=(left/o.totalTime*100)+'%';$('#tbar').classList.toggle('low',left<10);if(left<=0)end(true);},100);onClean(()=>clearInterval(iv));}
  onClean(()=>{done=true;});
  next();
};
function startStar(n){const qs=shuffle(ALL.slice()).slice(0,10);
  go('quiz',{title:`اختبار نجوم ÷${D(n)}`,color:COLORS[n],total:10,hint:true,gen:i=>Q(n,qs[i]),onEnd:r=>{const st=r.score>=9?3:r.score>=7?2:r.score>=5?1:0,old=S.stars[n]||0;
    if(st>old){S.stars[n]=st;addCoins((st-old)*10);save();checkBadges();}
    result({title:st===3?'مذهل! 🏆':st>0?'أحسنت!':'حاول مرة أخرى 💪',stars:st,score:`${D(r.score)} / ${D(10)}`,good:st>0,
      lines:[st>old?`نجوم جديدة! +${D((st-old)*10)} 🍪`:`أفضل نتيجة لك: ${D(old)} نجوم`,r.hints?`استخدمت ${D(r.hints)} تلميح (نصف درجة للسؤال)`:'بدون أي تلميح 👑',st<3?`تحتاج ${D(9)} صحيحة للنجمة الثالثة`:'']});}});}
function startSmart(){
  const pool=[];ALL.forEach(d=>ALL.forEach(q=>{const f=S.stats[fk(d,q)]||{c:0,w:0,s:0};pool.push({d,q,w:Math.max(.2,1+f.w*3-Math.min(f.c,6)*.4-f.s*.5+(f.c+f.w===0?1.5:0)+(d>=6&&q>=6?1:0))});}));
  const qs=[];for(let k=0;k<15;k++){const tot=pool.reduce((s,x)=>s+x.w,0);let r=Math.random()*tot,ch=pool[0];for(const x of pool){r-=x.w;if(r<=0){ch=x;break;}}qs.push(Q(ch.d,ch.q));ch.w*=.15;}
  go('quiz',{title:'المراجعة الذكية',total:15,hint:true,gen:i=>qs[i],onEnd:r=>result({title:'راجعت نقاط ضعفك! 🧠',score:`${D(r.score)} / ${D(15)}`,good:r.score>=10,lines:['تختار المراجعة الذكية الأسئلة التي تخطئ فيها أكثر']})});}

  view.innerHTML=`<div class="acts"><button class="act" id="r1"><span class="ai">🧠</span><div><h3>المراجعة الذكية</h3><p>${D(15)} سؤالاً من الأسئلة التي تخطئ فيها أكثر</p></div></button>
    <button class="act" id="r2"><span class="ai">🧩</span><div><h3>شبكة الإنجاز</h3><p>كل حقائق القسمة الـ ${D(144)} ملوّنة حسب إتقانك</p></div></button>
    <button class="act" id="r3"><span class="ai">🎓</span><div><h3>دروس الفهم</h3><p>أعد مشاهدة دروس التوزيع والباقي</p></div></button></div>
   <h2 class="sec">بطاقات الحفظ</h2><div class="chips">${ALL.map(n=>`<button class="chip on" style="--c:${COLORS[n]}" data-c="${n}">÷${D(n)}</button>`).join('')}<button class="chip txt" data-c="weak">الضعيفة فقط</button></div>
   <h2 class="sec">تحتاج إلى تقوية</h2><div class="card">${weak.length?`<p>${weak.slice(0,30).join(' · ')}</p>`:'<p class="muted">لا توجد أسئلة ضعيفة حالياً. استمر! 🌟</p>'}</div>`;
  $('#r1').onclick=startSmart;$('#r2').onclick=()=>go('grid');$('#r3').onclick=()=>go('lessons');
  $$('[data-c]').forEach(b=>b.onclick=()=>{const v=b.dataset.c;if(v==='weak'&&!weak.length){toast('لا توجد أسئلة ضعيفة 🌟');return;}go('cards',v==='weak'?'weak':+v);});
};
SCREENS.cards=(n)=>{
  let deck;if(n==='weak'){deck=[];ALL.forEach(d=>ALL.forEach(q=>{if(mastery(d,q)===1)deck.push(Q(d,q));}));shuffle(deck);setTitle('بطاقات الأسئلة الضعيفة');}
  else{deck=shuffle(ALL.map(q=>Q(n,q)));setTitle(`بطاقات ÷${D(n)}`);}
  let i=0,know=0,again=[];
  view.innerHTML=`<div style="--c:${n==='weak'?'var(--jam)':COLORS[n]}"><div class="gstat"><span id="cp"></span><span>✅ <span id="ck">${D(0)}</span></span></div>
    <div class="fc" id="fc"><div class="fcin"><div class="fcf" id="ff"></div><div class="fcb" id="fb2"></div></div></div><p class="muted" style="text-align:center;font-size:14px">اضغط على البطاقة لتقلبها</p>
    <div class="tfbtns"><button class="btn ok" id="kn">✔ عرفتها</button><button class="btn" id="ag">↻ أعدها لي</button></div></div>`;
  function show(){if(i>=deck.length){if(again.length){deck=deck.concat(shuffle(again));again=[];}else{addCoins(3);return result({title:'أنهيت البطاقات! 🃏',score:D(know),lines:['عرفت كل البطاقات في النهاية 💪']});}}
    const c=deck[i];$('#fc').classList.remove('flip');$('#cp').textContent=`${D(i+1)} / ${D(deck.length)}`;$('#ff').innerHTML=`<div>${D(c.D)} ÷ ${D(c.d)}<small>ما الناتج؟</small></div>`;
    setTimeout(()=>{$('#fb2').innerHTML=`<div>${D(c.q)}<small>لأن ${D(c.d)} × ${D(c.q)} = ${D(c.D)}</small></div>`;},200);}
  $('#fc').onclick=()=>$('#fc').classList.toggle('flip');
  $('#kn').onclick=()=>{const c=deck[i];record(c.d,c.q,true,0);know++;$('#ck').textContent=D(know);i++;show();};
  $('#ag').onclick=()=>{const c=deck[i];record(c.d,c.q,false);again.push(c);i++;show();};
  show();
};
SCREENS.grid=()=>{
  setTitle('شبكة الإنجاز 🧩');const mc=masteredCount();
  view.innerHTML=`<p style="font-weight:800">أتقنت <span style="color:var(--ok);font-family:var(--f-display);font-size:24px;font-weight:400">${D(mc)}</span> من ${D(144)} حقيقة</p>
   <div class="bar" style="margin:6px 0 10px"><i style="width:${Math.round(mc/144*100)}%"></i></div>
   <div class="legend"><span><i style="background:#a9e5c4"></i>متقنة</span><span><i style="background:#ffe7a6"></i>في الطريق</span><span><i style="background:#f9c9cd"></i>تحتاج تدريب</span><span><i style="background:var(--plate);box-shadow:inset 0 0 0 1px var(--line)"></i>لم تجربها</span></div>
   <p class="muted" style="font-size:14px;margin-bottom:8px">كل صف قسمة على عدد. الخانة تعرض المقسوم، واضغطها لترى المسألة.</p>
   <div class="gridwrap"><table class="mgrid"><thead><tr><th>÷</th>${ALL.map(q=>`<th style="color:var(--ink-2)">${D(q)}</th>`).join('')}</tr></thead>
   <tbody>${ALL.map(d=>`<tr><th style="color:${COLORS[d]}">÷${D(d)}</th>${ALL.map(q=>`<td class="m${mastery(d,q)}" data-d="${d}" data-q="${q}">${D(d*q)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
   <div class="gridinfo" id="gi"></div><div class="row" style="justify-content:center"><button class="btn" id="gs">🧠 درّب الضعيفة</button></div>`;
  $$('.mgrid td').forEach(td=>td.onclick=()=>{const d=+td.dataset.d,q=+td.dataset.q;$$('.mgrid td').forEach(x=>x.classList.remove('sel','hl'));$$(`.mgrid td[data-d="${d}"]`).forEach(x=>x.classList.add('hl'));td.classList.add('sel');
    $('#gi').innerHTML=`${D(d*q)} ÷ <span style="color:${COLORS[d]}">${D(d)}</span> = ${D(q)} <span style="font-family:var(--f-body);font-size:15px">${['· لم تجربها','· تحتاج تدريب','· في الطريق','· متقنة ✅'][mastery(d,q)]}</span>`;speak(`${d*q} تقسيم ${d} يساوي ${q}`);});
  $('#gs').onclick=startSmart;
};

/* ---------- الأوسمة والإعدادات ---------- */
SCREENS.rewards=()=>{
  setTitle('الأوسمة 🏆');const lv=level();
  view.innerHTML=`<div class="card" style="display:flex;gap:14px;align-items:center;margin-bottom:14px"><div class="av">${S.avatar}</div><div style="flex:1;min-width:0"><h2 style="font-size:26px">${esc(S.name)}</h2><p class="lvl">🏅 ${lv.name}</p><div class="bar"><i style="width:${lv.pct}%"></i></div></div></div>
   <div class="statg"><div class="stat"><b>${D(S.coins)}</b><span>🍪 كعكة</span></div><div class="stat"><b>${D(starsTotal())}/${D(36)}</b><span>⭐ نجمة</span></div>
    <div class="stat"><b>${D(Object.keys(S.lessons).length)}/${D(6)}</b><span>🎓 دروس</span></div><div class="stat"><b>${D(S.correct)}</b><span>✅ إجابة صحيحة</span></div>
    <div class="stat"><b>${D(Object.keys(S.bosses).length)}/${D(12)}</b><span>👾 وحش مهزوم</span></div><div class="stat"><b>${D(masteredCount())}/${D(144)}</b><span>🧩 حقيقة متقنة</span></div></div>
   <h2 class="sec">الأوسمة ${D(Object.keys(S.badges).length)}/${D(BADGES.length)}</h2>
   <div class="badges">${BADGES.map(b=>`<div class="badge ${S.badges[b.id]?'got':''}"><span class="bi">${b.i}</span><h3>${b.t}</h3><p>${D(b.d)}</p></div>`).join('')}</div>
   <h2 class="sec">المستويات</h2><div class="acts">${LEVELS.map((l,k)=>`<div class="act" style="${k===lv.idx?'--c:var(--jam)':''}"><span class="ai">${k<=lv.idx?'🏅':'🔒'}</span><div><h3>${l[1]}</h3><p>${D(l[0])} كعكة</p></div></div>`).join('')}</div>`;
};
SCREENS.settings=()=>{
  setTitle('الإعدادات ⚙️');
  view.innerHTML=`<div class="card"><div class="field"><label for="nm">الاسم</label><input class="inp" id="nm" maxlength="20" value="${esc(S.name)}"></div>
    <div class="field"><label>الشخصية</label><div class="avs">${AVATARS.map(a=>`<button class="avb ${a===S.avatar?'on':''}" data-a="${a}">${a}</button>`).join('')}</div></div>
    <div class="field"><label>شكل الأرقام</label><div class="seg"><button data-d="ar" class="${S.digits==='ar'?'on':''}">١٢٣</button><button data-d="en" class="${S.digits==='en'?'on':''}">123</button></div></div>
    <div class="field"><label>نطق المسائل بصوت مسموع</label><div class="seg"><button data-s="1" class="${S.speech?'on':''}">🔊 تشغيل</button><button data-s="0" class="${!S.speech?'on':''}">🔇 إيقاف</button></div></div>
    <button class="btn wide" id="sv">💾 حفظ</button></div>
   <h2 class="sec">إعادة البدء</h2><div class="card"><p class="muted" style="margin-bottom:10px">يمسح كل النجوم والكعكات والأوسمة من هذا الجهاز.</p><button class="btn ghost" id="rs">🗑️ مسح التقدم</button>
    <div id="cf" hidden style="margin-top:12px"><p style="font-weight:800;margin-bottom:8px">هل أنت متأكد؟</p><div class="row"><button class="btn sm" id="yes">نعم، امسح</button><button class="btn ghost sm" id="no">إلغاء</button></div></div></div>`;
  $$('.avb').forEach(b=>b.onclick=()=>{S.avatar=b.dataset.a;save();$$('.avb').forEach(x=>x.classList.toggle('on',x===b));});
  $$('[data-d]').forEach(b=>b.onclick=()=>{S.digits=b.dataset.d;save();rerender();});
  $$('[data-s]').forEach(b=>b.onclick=()=>{S.speech=b.dataset.s==='1';save();rerender();});
  $('#sv').onclick=()=>{S.name=$('#nm').value.trim()||S.name;save();toast('تم الحفظ ✅');};
  $('#rs').onclick=()=>{$('#cf').hidden=false;};$('#no').onclick=()=>{$('#cf').hidden=true;};
  $('#yes').onclick=()=>{const k={name:S.name,avatar:S.avatar,digits:S.digits,speech:S.speech};S=Object.assign(defaults(),k);save();toast('بدأنا من جديد 🌱');home();};
};

hud();if(!S.name){cur={name:'welcome'};SCREENS.welcome();}else home();
})();
</script>
</body></html>
