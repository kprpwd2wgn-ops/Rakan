<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تحدي العباقرة</title>
<meta name="theme-color" content="#101a45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="تحدي العباقرة">
<style>
:root { color-scheme:dark; --bg:#101a45; --bg2:#1c2a6b; --card:#24357f; --card2:#1a2766; --gold:#ffd23f; --ink:#fff8ec;
  --ok:#3ddc84; --bad:#ff6b6b; --v:#2f8cff; --l:#ff8a1c; --m:#ff4d6d; --paper:#fffdf6; --line:#2b2f55; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
html,body { margin:0; height:100%; background:radial-gradient(circle at 50% -10%,#33489e,var(--bg) 62%); color:var(--ink);
  font-family:"Noto Naskh Arabic","Geeza Pro","Segoe UI",Tahoma,sans-serif; overflow:hidden; }
button { font:inherit; color:inherit; border:0; cursor:pointer; background:none; }
[hidden] { display:none !important; }
.scr { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; max-width:560px; margin:0 auto;
  padding:calc(10px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); overflow-y:auto; overflow-x:hidden; }
.scr.on { display:flex; }
h1 { margin:4px 0 0; font-size:clamp(30px,9vw,42px); color:var(--gold); text-align:center; text-shadow:0 0 18px #ffd23f55; line-height:1.45; }
.sub { font-size:18px; opacity:.92; text-align:center; margin:6px 0 14px; line-height:1.7; }
.sub.small { font-size:15px; opacity:.75; }
.big { background:var(--gold); color:#4a3200; font-size:25px; font-weight:bold; padding:12px 38px; border-radius:30px; box-shadow:0 6px 0 #b88a00; }
.big:active { transform:translateY(4px); box-shadow:0 2px 0 #b88a00; }
.soft { background:#ffffff1c; border-radius:22px; padding:10px 20px; font-size:19px; }
.soft:active { background:#ffffff33; }
.row { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:12px; }
.brain { width:150px; height:150px; flex:none; }
.brain.small { width:92px; height:92px; margin:-4px 0 2px; }
.brain.tiny { width:58px; height:58px; }
.hop { animation:hop .6s; } @keyframes hop { 30%{transform:translateY(-16px) rotate(-6deg)} 60%{transform:translateY(0) rotate(4deg)} }
.shake { animation:shake .5s; } @keyframes shake { 25%{transform:translateX(-8px)} 50%{transform:translateX(8px)} 75%{transform:translateX(-5px)} }
.think .eyes { animation:look 2.4s infinite; } @keyframes look { 0%,40%{transform:none} 50%,90%{transform:translate(2px,-3px)} }
.trio { display:flex; gap:10px; justify-content:center; margin:4px 0 22px; flex-wrap:wrap; }
.trio div { display:flex; flex-direction:column; align-items:center; gap:4px; width:100px; font-size:15px; text-align:center; }
.ico { width:62px; height:62px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:32px; box-shadow:0 4px 0 #0004, inset 0 -4px 0 #0002; }
.bar { width:100%; display:flex; align-items:center; gap:10px; min-height:46px; font-size:18px; }
.bar b { flex:1; text-align:center; font-size:21px; }
.ib { background:#ffffff1c; border-radius:14px; width:48px; height:44px; font-size:21px; flex:none; }
#rank { flex:1; font-size:17px; color:var(--gold); }
#worlds { width:100%; }
/* home */
.test { width:100%; display:flex; align-items:center; gap:14px; background:linear-gradient(135deg,#ffd23f,#ff9f1c); color:#4a2600; border-radius:24px;
  padding:14px 16px; margin:6px 0 10px; box-shadow:0 6px 0 #a85d00; text-align:right; }
.test:active { transform:translateY(3px); box-shadow:0 3px 0 #a85d00; }
.test .tico { font-size:44px; }
.test b { font-size:26px; display:block; } .test small { display:block; font-size:15px; }
.world { width:100%; display:flex; align-items:center; gap:14px; background:var(--card); border-radius:22px; padding:12px 14px; margin:7px 0;
  box-shadow:0 5px 0 #0c1440; text-align:right; }
.world:active { transform:translateY(3px); box-shadow:0 2px 0 #0c1440; }
.world b { font-size:22px; display:block; } .world small { font-size:15px; opacity:.85; display:block; }
.world .ico { flex:none; }
.prog { height:8px; border-radius:6px; background:#ffffff22; margin-top:6px; overflow:hidden; }
.prog i { display:block; height:100%; background:var(--gold); border-radius:6px; }
/* world: kinds */
.mix { width:100%; background:#ffffff14; border:2px dashed #ffffff44; border-radius:20px; padding:10px; font-size:19px; margin:6px 0 4px; }
#kinds { width:100%; display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px; }
.kind { background:var(--card); border-radius:20px; padding:12px 8px 10px; box-shadow:0 5px 0 #0c1440; display:flex; flex-direction:column; align-items:center; gap:2px; }
.kind:active { transform:translateY(3px); box-shadow:0 2px 0 #0c1440; }
.kind .k { font-size:38px; line-height:1.2; }
.kind b { font-size:18px; text-align:center; line-height:1.4; }
.kind small { font-size:13px; opacity:.8; }
.kind .prog { width:85%; }
/* play */
#dots { flex:1; display:flex; justify-content:center; gap:5px; flex-wrap:wrap; }
#dots i { width:11px; height:11px; border-radius:50%; background:#ffffff2a; }
#dots i.ok { background:var(--ok); } #dots i.no { background:var(--bad); } #dots i.now { background:#fff; transform:scale(1.3); }
#pHead { width:100%; display:flex; justify-content:space-between; font-size:15px; opacity:.8; margin:2px 0 0; }
#timer { position:relative; width:52px; height:52px; margin:2px 0 -4px; }
#timer svg { width:52px; height:52px; transform:rotate(-90deg); }
#timer .tb { fill:none; stroke:#ffffff22; stroke-width:5; }
#timer .tf { fill:none; stroke:var(--gold); stroke-width:5; stroke-linecap:round; stroke-dasharray:119.4; transition:stroke-dashoffset .25s linear, stroke .3s; }
#timer.low .tf { stroke:var(--bad); }
#timer span { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:19px; font-weight:bold; }
#qText { font-size:21px; text-align:center; margin:6px 0 8px; line-height:1.65; min-height:34px; }
#board { width:100%; background:var(--paper); color:var(--line); border-radius:22px; padding:8px; box-shadow:0 5px 0 #c9c3a8;
  display:flex; align-items:center; justify-content:center; min-height:120px; position:relative; }
#board svg { width:100%; height:auto; display:block; max-height:48vh; }
#board .txt { font-size:24px; line-height:1.8; padding:10px 8px; text-align:center; color:#2b2f55; }
#board [data-k] { cursor:pointer; }
#board .pick { animation:pulse .9s infinite alternate; }
@keyframes pulse { to { opacity:.35; } }
#opts { width:100%; display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
#opts.three { grid-template-columns:1fr 1fr 1fr; }
#opts.one { grid-template-columns:1fr; }
#opts button { background:var(--card); border-radius:18px; font-size:28px; padding:10px 6px; box-shadow:0 5px 0 #0c1440; font-weight:bold; min-height:64px;
  display:flex; align-items:center; justify-content:center; line-height:1.3; }
#opts button.w { font-size:21px; }
#opts button svg { width:100%; max-width:120px; height:auto; }
#opts button.pic { background:var(--paper); box-shadow:0 5px 0 #c9c3a8; padding:6px; }
#opts button:active { transform:translateY(3px); box-shadow:0 2px 0 #0c1440; }
#opts button.ok { background:var(--ok); color:#06381c; box-shadow:0 5px 0 #1f9c57; }
#opts button.no { background:var(--bad); opacity:.55; }
#opts button.pic.ok { outline:5px solid var(--ok); background:#eafff2; }
#opts button.pic.no { outline:5px solid var(--bad); background:#ffecec; opacity:.6; }
#pFoot { width:100%; display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:8px; }
/* answer panel */
#panel { position:fixed; inset:0; background:#060b26cc; display:none; align-items:center; justify-content:center; z-index:5; padding:14px; }
#panel.on { display:flex; }
#panel .box { background:linear-gradient(#2c3f92,#1b2869); border-radius:26px; padding:16px 16px 18px; width:100%; max-width:460px; text-align:center;
  box-shadow:0 0 0 4px #ffd23f55; animation:pop .3s; max-height:94vh; overflow-y:auto; }
@keyframes pop { from{transform:scale(.75);opacity:0} }
#okTitle { font-size:27px; font-weight:bold; }
#okTitle.no { color:#ffb3b3; }
#exBoard { background:var(--paper); color:var(--line); border-radius:18px; margin:10px 0 4px; padding:6px; }
#exBoard:empty { display:none; }
#exBoard svg { width:100%; height:auto; max-height:34vh; display:block; }
#exBoard .txt { font-size:22px; line-height:1.8; padding:6px; }
#exText { font-size:20px; line-height:1.75; margin:8px 0; }
#pStars { font-size:36px; letter-spacing:4px; margin:2px 0 12px; }
/* done + result */
.stars { font-size:40px; margin:8px 0; }
#score { font-size:64px; font-weight:bold; color:var(--gold); margin:6px 0 4px; direction:rtl; }
#tiers { width:100%; display:flex; flex-direction:column; gap:8px; margin:6px 0 12px; }
.tier { display:flex; align-items:center; gap:10px; border-radius:18px; padding:10px 14px; font-size:20px; font-weight:bold; opacity:.38; transform:scale(.96); }
.tier.on { opacity:1; transform:scale(1.03); box-shadow:0 0 0 4px #fff8, 0 8px 18px #0006; animation:pop .4s; }
.tier .cr { margin-inline-start:auto; font-size:30px; }
#parts { width:100%; display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
#parts div { background:var(--card); border-radius:16px; padding:8px 4px; text-align:center; font-size:15px; }
#parts b { display:block; font-size:24px; }
#confetti { position:fixed; inset:0; pointer-events:none; z-index:6; }
/* puzzle pieces */
.top { font-size:30px; vertical-align:middle; }
.story { font-size:22px !important; line-height:1.9 !important; text-align:center; }
.det { width:100%; }
.det ul { list-style:none; margin:2px 0 6px; padding:0 4px; font-size:18px; line-height:1.7; text-align:right; color:#2b2f55; }
.ana { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px 14px; padding:14px 4px; color:#2b2f55; }
.ana .pair { display:inline-flex; align-items:center; gap:6px; background:#f2eee0; border-radius:16px; padding:6px 10px; }
.ana .ae { font-size:44px; line-height:1.2; } .ana .aw { font-size:26px; font-weight:bold; }
.ana i { font-style:normal; font-size:22px; color:#e63946; } .ana b { font-size:20px; color:#8a7d5a; }
.qm { color:#e0a800; font-size:40px; font-weight:bold; }
.eqs { width:100%; display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px 0; color:#2b2f55; }
.eq { display:flex; direction:rtl; align-items:center; justify-content:center; gap:8px; font-size:34px; font-weight:bold; line-height:1.3; }
.eqs.lg .eq { font-size:42px; }
.vals { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; direction:rtl; }
.vals span { background:#f2eee0; border-radius:12px; padding:2px 10px; font-size:26px; font-weight:bold; white-space:nowrap; }
.note { font-size:18px; color:#e63946; text-align:center; margin-top:-4px; padding-bottom:6px; }
.memobar { position:absolute; left:14px; right:14px; bottom:6px; height:6px; border-radius:4px; background:#0001; overflow:hidden; }
.memobar i { display:block; height:100%; background:#6c5ce7; animation:memo linear forwards; transform-origin:right; }
@keyframes memo { from { transform:scaleX(1); } to { transform:scaleX(0); } }
#exBoard { position:relative; }
.cnt { position:absolute; top:8px; left:12px; background:#e63946; color:#fff; border-radius:14px; min-width:38px; padding:0 8px; font-size:24px; font-weight:bold; }
.cnt:empty { display:none; }

</style>
</head>

<script>
// ---------- core: random numbers, puzzle registry, drawing helpers, common lines ----------
// Every puzzle is made from its kind and number with a fixed seed, so puzzle 7 of a kind is the same
// puzzle every time (stars are kept per puzzle). d is its difficulty, 0 (easy) to 3 (genius).
const AR = '٠١٢٣٤٥٦٧٨٩';
const dg = s => String(s).replace(/[0-9]/g, d => AR[d]);
function RNG(seed){ let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const ri = (r, a, b) => a + Math.floor(r() * (b - a + 1));
const pk = (r, a) => a[Math.floor(r() * a.length)];
const shuf = (r, a) => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const range = n => [...Array(n).keys()];
function hash(s){ let h = 2166136261; for (const c of s) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

const WORLDS = {
  v: { name:'تَرْكِيزٌ بَصَرِيٌّ', icon:'👁️', color:'var(--v)', note:'عَيْنُ الصَّقْرِ لَا يَفُوتُهَا شَيْءٌ' },
  l: { name:'مَنْطِقٌ وَتَحْقِيقٌ', icon:'🔍', color:'var(--l)', note:'فَكِّرْ مِثْلَ الْمُحَقِّقِ' },
  m: { name:'حِسَابَاتٌ ذِهْنِيَّةٌ', icon:'🧮', color:'var(--m)', note:'احْسُبْ فِي عَقْلِكَ' },
};
const TYPES = {}, ORDER = { v:[], l:[], m:[] };
// T(id, {w: world, name, icon, n: how many puzzles, gen(r, d, i) -> puzzle, lines(): extra spoken lines})
function T(id, o){ o.id = id; TYPES[id] = o; ORDER[o.w].push(id); }
function make(id, i){
  const t = TYPES[id], r = RNG(hash(id + ':' + i)), d = Math.min(3, Math.floor(i * 4 / t.n));
  const p = t.gen(r, d, i);
  p.type = id; p.i = i; p.d = d;
  return p;
}

// ---------- answers ----------
// number choices: the answer and three near misses, never below zero
function numOpts(r, ans, near){
  const c = new Set();
  const tries = near || [1, -1, 2, -2, 10, -10, 3, -3, 5, -5];
  for (const k of shuf(r, tries)) { const v = ans + k; if (v >= 0 && v !== ans) c.add(v); if (c.size >= 3) break; }
  let k = 4; while (c.size < 3) { if (ans + k !== ans) c.add(ans + k); k++; }
  return shuf(r, [ans, ...[...c].slice(0, 3)]).map(v => ({ h: dg(v), ok: v === ans, v }));
}

      const true_ = shuf(r, DET_CLUES.filter(c => c.ok(mons[culprit])));

function numRow(vals, hole, ops){

  const x0 = (W - (per * S + (per - 1) * gap)) / 2, rh = S + (ops ? 26 : 0) + 10;
  let b = '';
  vals.forEach((v, i) => {
    const col = i % per, row = Math.floor(i / per), x = W - x0 - col * (S + gap) - S / 2, y = 8 + row * rh + S / 2, q = i === hole;
    b += `<rect x="${f1(x - S / 2)}" y="${f1(y - S / 2)}" width="${f1(S)}" height="${f1(S)}" rx="14" fill="${q ? '#fff7d6' : '#fff'}" stroke="${q ? '#ffc21a' : '#3d7dff'}" stroke-width="4" ${q ? 'stroke-dasharray="8 6"' : ''}/>` +
      txt(x, y, q ? '؟' : dg(v), String(v).length > 2 ? 23 : 28, q ? '#e0a800' : '#2b2f55');
    if (ops && i < n - 1 && col < per - 1) b += txt(x - S / 2 - gap / 2, y + S / 2 + 14, ops[i], 15, '#e63946');
  });
  return SV(W, 16 + rows * rh - (rows ? 10 : 0) + (ops ? 0 : 0), b);
}

    if (this.ctx.state === 'suspended') this.ctx.resume();
    if (location.protocol === 'file:') return this.ready = Promise.resolve(); // opened as a file: no voice files to fetch
    return this.ready = fetch(this.dir + '/packs.json').then(r => r.json()).then(j => { this.idx = j; this.pack('core'); }).catch(e => console.warn('voices not loaded', e));
  },
  pack(name){
    if (!this.idx || !this.idx.packs[name]) return Promise.resolve(null);
    return this.packs[name] || (this.packs[name] = fetch(this.dir + '/' + this.idx.packs[name]).then(r => r.ok ? r.arrayBuffer() : null).catch(() => null));
  },
  clip(id){
    if (this.bufs[id]) return this.bufs[id];
    const e = this.idx && this.idx.c[id];
    if (!e || !SAY[id] || e[3] !== hash(SAY[id]).toString(36)) return Promise.resolve(null);
    return this.bufs[id] = this.pack(e[0]).then(ab => ab ? new Promise(res => {
      try { const p = this.ctx.decodeAudioData(ab.slice(e[1], e[1] + e[2]), res, () => res(null)); if (p && p.catch) p.catch(() => res(null)); } catch(err){ res(null); }
    }) : null);
  },
  pre(ids){ if (this.idx) ids.forEach(id => this.clip(id)); },
  stop(){ this.tok++; if (this.src) { try { this.src.onended = null; this.src.stop(); } catch(e){} this.src = null; } },
  async play(id, tok){
    if (!this.ctx) return;
    await this.ready;
    const b = await this.clip(id);
    if (!b || tok !== this.tok) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return new Promise(res => { const s = this.ctx.createBufferSource(); s.buffer = b; s.connect(this.ctx.destination);
      s.onended = () => { if (this.src === s) this.src = null; res(); }; this.src = s; s.start(); });
  },
  async say(ids){ this.stop(); const tok = this.tok; for (const id of [].concat(ids)) { if (tok !== this.tok) return; await this.play(id, tok); } },
};

window.VO = VO; // for the test bot

// sound effects: short noise bursts only, no notes or tunes
const SFX = {
  on:true,
  noise(dur, from, to, vol = .35, type = 'bandpass'){
    const c = VO.ctx; if (!c || !this.on) return;
    const n = Math.floor(c.sampleRate * dur), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const s = c.createBufferSource(); s.buffer = b; const f = c.createBiquadFilter(); f.type = type; f.Q.value = 1.2;
    f.frequency.setValueAtTime(from, c.currentTime); f.frequency.exponentialRampToValueAtTime(to, c.currentTime + dur);
    const g = c.createGain(); g.gain.value = vol; s.connect(f); f.connect(g); g.connect(c.destination); s.start();
  },
  tap(){ this.noise(.05, 2500, 1800, .25); },
  tick(){ this.noise(.03, 3500, 3000, .18, 'highpass'); },
  good(){ this.noise(.35, 800, 5000, .3); },
  bad(){ this.noise(.25, 400, 150, .45, 'lowpass'); },
  win(){ [0, 120, 240].forEach(t => setTimeout(() => this.noise(.3, 1200, 6000, .25), t)); },
};

// progress kept in this browser
const KEY = 'rakan-genius-v1';
let save = { b:{}, best:-1, tests:0, sfx:true };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.b) save = Object.assign(save, s); } catch(e){}
const store = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch(e){} };
SFX.on = save.sfx !== false;
const starsOf = id => (save.b[id] || []).reduce((a, b) => a + (b || 0), 0);
const solvedOf = id => (save.b[id] || []).filter(Boolean).length;
const ALL = Object.keys(TYPES).reduce((a, id) => a + TYPES[id].n, 0);
const totalStars = () => Object.keys(TYPES).reduce((a, id) => a + starsOf(id), 0);
const RANKS = [[0, '🌱 مُبْتَدِئٌ'], [30, '⭐ ذَكِيٌّ'], [120, '💡 لَامِعٌ'], [300, '🧠 عَبْقَرِيٌّ'], [700, '🚀 عَبْقَرِيٌّ خَارِقٌ'], [1500, '👑 أُسْطُورَةُ الذَّكَاءِ']];
const rankName = s => RANKS.filter(r => s >= r[0]).pop()[1];

function show(id){ document.querySelectorAll('.scr').forEach(s => s.classList.toggle('on', s.id === id)); window.scrollTo(0, 0); }
function brainDo(el, cls){ el.classList.remove('hop', 'shake'); void el.getBoundingClientRect(); el.classList.add(cls); }

// ---------- home ----------
function home(speak){
  show('homeScr'); stopTimer();
  const ts = totalStars();
  $('rank').textContent = 'رُتْبَتُكَ: ' + rankName(ts) + '  ⭐ ' + dg(ts);
  $('snd').textContent = SFX.on ? '🔊' : '🔇';
  $('testBest').textContent = save.best >= 0 ? `🏆 أَفْضَلُ نَتِيجَةٍ: ${dg(save.best)} مِنْ ${dg(15)}` : '';
  $('worlds').innerHTML = '';
  for (const w of ['v', 'l', 'm']) {
    const W = WORLDS[w], ids = ORDER[w], n = ids.reduce((a, id) => a + TYPES[id].n, 0), s = ids.reduce((a, id) => a + solvedOf(id), 0);
    const b = document.createElement('button'); b.className = 'world';
    b.innerHTML = `<span class="ico" style="background:${W.color}">${W.icon}</span><span style="flex:1"><b>${W.name}</b><small>${W.note}</small>` +
      `<small>🧩 ${dg(s)} مِنْ ${dg(n)} لُغْزًا</small><div class="prog"><i style="width:${Math.round(s * 100 / n)}%"></i></div></span>`;
    b.onclick = () => { SFX.tap(); world(w, true); };
    $('worlds').appendChild(b);
  }
  $('totalLine').textContent = `فِي اللُّعْبَةِ ${dg(ALL)} لُغْزًا وَأَكْثَرُ مِنْ ${dg(Object.keys(TYPES).length)} نَوْعًا مِنَ الْأَلْغَازِ`;
  if (speak) VO.say('home');
}
$('snd').onclick = () => { SFX.on = !SFX.on; save.sfx = SFX.on; store(); $('snd').textContent = SFX.on ? '🔊' : '🔇'; SFX.tap(); };

// ---------- a world: its kinds of puzzles ----------
let curW = 'v';
function world(w, speak){
  curW = w; show('worldScr'); stopTimer();
  const W = WORLDS[w];
  $('wTitle').innerHTML = W.icon + ' ' + W.name;
  $('wStars').textContent = '⭐ ' + dg(ORDER[w].reduce((a, id) => a + starsOf(id), 0));
  $('kinds').innerHTML = '';
  ORDER[w].forEach(id => {
    const t = TYPES[id], s = solvedOf(id), b = document.createElement('button'); b.className = 'kind';
    b.innerHTML = `<span class="k">${t.icon}</span><b>${t.name}</b><small>${dg(s)} / ${dg(t.n)}</small><div class="prog"><i style="width:${Math.round(s * 100 / t.n)}%"></i></div>`;
    b.onclick = () => { SFX.tap(); startKind(id); };
    $('kinds').appendChild(b);
  });
  if (speak) VO.say('w-' + w);
}
$('wBack').onclick = () => { SFX.tap(); VO.stop(); home(false); };
$('mixBtn').onclick = () => { SFX.tap(); startMix(curW); };

// ---------- rounds ----------
// mode: 'kind' (ten of one kind, the first unsolved ones), 'mix' (ten of one world), 'test' (fifteen, timed)
let R = null;
const ROUND = 10, TEST_SEC = 15;
function firstUnsolved(id, k, avoid = []){
  const b = save.b[id] || [], n = TYPES[id].n, out = [];
  for (let i = 0; i < n && out.length < k; i++) if (!b[i] && !avoid.includes(i)) out.push(i);
  if (out.length < k) mix(range(n).filter(i => !out.includes(i) && !avoid.includes(i))).slice(0, k - out.length).forEach(i => out.push(i));
  return out;
}
function startKind(id){
  R = { mode:'kind', id, w:TYPES[id].w, list:firstUnsolved(id, ROUND).map(i => [id, i]), at:0, got:[] };
  VO.pack(id); begin(['h-' + id]);
}
function startMix(w){
  const kinds = mix(ORDER[w]), list = [];
  for (let k = 0; list.length < ROUND; k++) { const id = kinds[k % kinds.length]; const i = firstUnsolved(id, 1, list.filter(x => x[0] === id).map(x => x[1]))[0]; list.push([id, i]); }
  R = { mode:'mix', w, list, at:0, got:[] };
  begin(['mix']);
}
function startTest(){
  const list = [];
  for (const w of ['v', 'l', 'm']) mix(ORDER[w]).slice(0, 5).forEach(id => { const n = TYPES[id].n; list.push([id, Math.floor(n / 4) + Math.floor(Math.random() * Math.max(1, n / 2))]); });
  R = { mode:'test', list, at:0, got:[] };
  list.forEach(([id]) => VO.pack(id));
  begin(['test']);
}
$('testBtn').onclick = () => { SFX.tap(); startTest(); };
function begin(intro){ show('playScr'); R.intro = intro; puzzle(); }

// ---------- one puzzle ----------
let P = null, tries = 0, locked = false, memoT = 0, asking = false;
window.puzzleNow = () => P; // lets the test bot see the puzzle on screen
window.showPuzzle = (id, i) => { R = { mode:'kind', id, w:TYPES[id].w, list:[[id, i]], at:0, got:[] }; begin([]); }; // and open any puzzle
function puzzle(){
  const [id, i] = R.list[R.at];
  P = make(id, i); tries = 0; locked = false; asking = false; clearTimeout(memoT); stopTimer();
  const t = TYPES[id];
  $('pKind').textContent = t.icon + ' ' + t.name;
  $('pNum').textContent = dg(R.at + 1) + ' / ' + dg(R.list.length);
  $('dots').innerHTML = R.list.map((_, k) => `<i class="${k < R.at ? (R.got[k] ? 'ok' : 'no') : k === R.at ? 'now' : ''}"></i>`).join('');
  $('timer').hidden = R.mode !== 'test';
  const intro = [];
  if (R.intro) { intro.push(...R.intro); R.intro = null; }
  if (R.mode === 'test' && R.at % 5 === 0) intro.push('test-' + ['v', 'l', 'm'][R.at / 5]);
  // the next puzzle's lines start loading now
  const nx = R.list[R.at + 1]; if (nx) { try { const q = make(nx[0], nx[1]); VO.pre([...(q.say || []), ...(q.exSay || [])]); } catch(e){} }
  if (P.memo) {
    // the pictures show only after any opening words, so the child gets the whole time to look
    const me = P;
    $('qText').innerHTML = P.memo.q; $('opts').innerHTML = ''; $('opts').className = '';
    $('board').innerHTML = '<div class="txt" style="font-size:54px">⏳</div>';
    (intro.length ? VO.say(intro) : Promise.resolve()).then(() => {
      if (P !== me) return;
      $('board').innerHTML = P.memo.board + `<div class="memobar"><i style="animation-duration:${P.memo.ms}ms"></i></div>`;
      VO.say(P.memo.say);
      memoT = setTimeout(() => { if (P === me) ask(); }, P.memo.ms);
    });
    return;
  }
  ask(intro);
}
function ask(intro = []){
  $('qText').innerHTML = P.q + (P.top ? ` <span class="top">${P.top}</span>` : '');
  $('board').innerHTML = P.board;
  const o = $('opts'); o.innerHTML = '';
  if (P.opts) {
    const n = P.opts.length, cols = P.cols || (n === 3 ? 3 : 2);
    o.className = cols === 3 ? 'three' : cols === 1 ? 'one' : '';
    P.opts.forEach(op => { const b = document.createElement('button'); b.innerHTML = op.h; if (op.pic) b.classList.add('pic'); if (op.w) b.classList.add('w');
      b.onclick = () => choose(b, op); o.appendChild(b); });
  } else o.className = '';
  asking = true;
  if (R.mode !== 'test') { VO.say([...intro, ...P.say]); return; }
  // the test: the clock starts once the opening words are over
  left = TEST_SEC; drawTimer();
  const me = P;
  (intro.length ? VO.say(intro) : Promise.resolve()).then(() => { if (P !== me || locked) return; VO.say(P.say); startTimer(); });
}
$('board').addEventListener('click', e => {
  if (!P || !P.tap || locked || !asking) return;
  const g = e.target.closest('[data-k]'); if (!g) return;
  if (g.dataset.k === P.k) right();
  else { g.classList.add('pick'); setTimeout(() => g.classList.remove('pick'), 900); wrong(); }
});
$('replay').onclick = () => { if (P) VO.say(!asking && P.memo ? P.memo.say : P.say); };
$('pBack').onclick = () => { SFX.tap(); VO.stop(); stopTimer(); clearTimeout(memoT); P = null; $('panel').classList.remove('on'); R.mode === 'test' ? home(false) : world(R.w || curW, false); };

function choose(b, op){
  if (locked || b.classList.contains('no')) return;
  if (op.ok) { b.classList.add('ok'); right(); } else { b.classList.add('no'); wrong(); }
}
function right(){
  locked = true; stopTimer();
  const st = R.mode === 'test' ? 3 : tries === 0 ? 3 : tries === 1 ? 2 : 1;
  R.got[R.at] = st; record(st);
  SFX.good(); brainDo($('brainP'), 'hop'); confetti(36);
  setTimeout(() => panel(true, st), 420);
}
function wrong(){
  tries++; SFX.bad(); brainDo($('brainP'), 'shake');
  const left = P.opts ? P.opts.length - 1 - tries : 3 - tries;
  if (R.mode === 'test' || left <= 0) { locked = true; stopTimer(); R.got[R.at] = 0; markRight(); setTimeout(() => panel(false, 0), 700); return; }
  VO.say('no-' + Math.min(tries - 1, 2));
}
function markRight(){ if (P.opts) [...$('opts').children].forEach((b, k) => { if (P.opts[k].ok) b.classList.add('ok'); }); }
function record(st){ const [id, i] = R.list[R.at]; const b = save.b[id] || (save.b[id] = []); b[i] = Math.max(b[i] || 0, st); store(); }

// ---------- the answer panel ----------
let animT = 0;
function panel(ok, st, late){
  clearInterval(animT);
  $('okTitle').textContent = ok ? rnd(['أَحْسَنْتَ! 🎉', 'مُمْتَازٌ! 🌟', 'رَائِعٌ! 🎉', 'عَبْقَرِيٌّ! 🧠']) : late ? 'انْتَهَى الْوَقْتُ ⏰' : 'هَذَا هُوَ الْحَلُّ 👇';
  $('okTitle').className = ok ? '' : 'no';
  $('exText').innerHTML = (P.ex || '').replace(/\n/g, '<br>');
  $('pStars').textContent = R.mode === 'test' ? (ok ? '✅' : '❌') : '⭐'.repeat(st) + '☆'.repeat(3 - st);
  const eb = $('exBoard');
  if (P.anim) {
    eb.innerHTML = P.anim.base.replace('</svg>', '<g id="hl"></g></svg>') + `<div class="cnt" id="hlN"></div>`;
    let k = 0; const L = P.anim.list, every = Math.max(260, Math.min(700, 9000 / L.length));
    animT = setInterval(() => { if (k >= L.length) { clearInterval(animT); return; } $('hl').innerHTML = L[k]; k++; $('hlN').textContent = dg(k); SFX.tick(); }, every);
  } else eb.innerHTML = P.exBoard || '';
  $('panel').classList.add('on');
  $('nextQ').textContent = R.at + 1 < R.list.length ? 'التَّالِي ◀︎' : 'النَّتِيجَةُ 🏁';
  VO.say([ok ? 'ok-' + Math.floor(Math.random() * 6) : late ? 'late' : R.mode === 'test' ? 'miss' : 'show', ...(P.exSay || [])]);
}
$('nextQ').onclick = () => {
  SFX.tap(); clearInterval(animT); $('panel').classList.remove('on');
  R.at++; if (R.at < R.list.length) puzzle(); else R.mode === 'test' ? result() : done();
};

// ---------- the 15-second timer (the test) ----------
let timerT = 0, left = 0;
function startTimer(){
  stopTimer(); left = TEST_SEC; drawTimer();
  timerT = setInterval(() => { left--; drawTimer(); if (left <= 5 && left > 0) SFX.tick();
    if (left <= 0) { stopTimer(); if (locked) return; locked = true; R.got[R.at] = 0; SFX.bad(); markRight(); setTimeout(() => panel(false, 0, true), 500); } }, 1000);
}
function stopTimer(){ clearInterval(timerT); timerT = 0; }
function drawTimer(){ $('tNum').textContent = dg(Math.max(0, left)); $('tArc').style.strokeDashoffset = 119.4 * (1 - left / TEST_SEC); $('timer').classList.toggle('low', left <= 5); }

// ---------- end of a round ----------
function done(){
  show('doneScr'); SFX.win(); confetti(110);
  const got = R.got.reduce((a, b) => a + (b || 0), 0), max = R.list.length * 3;
  $('doneStars').textContent = '⭐ ' + dg(got) + ' / ' + dg(max);
  const id = R.id, all = id && solvedOf(id) >= TYPES[id].n;
  $('doneTitle').textContent = all ? 'حَلَلْتَ كُلَّ الْأَلْغَازِ! 🏆' : got >= max * .8 ? 'عَقْلٌ لَامِعٌ! 🌟' : 'أَحْسَنْتَ! 🎉';
  $('doneText').textContent = id ? `حَلَلْتَ ${dg(solvedOf(id))} مِنْ ${dg(TYPES[id].n)} لُغْزًا فِي «${TYPES[id].name}».` : 'جَوْلَةٌ مُنَوَّعَةٌ رَائِعَةٌ!';
  VO.say(all ? 'alldone' : 'done');
}
$('againBtn').onclick = () => { SFX.tap(); R.mode === 'kind' ? startKind(R.id) : startMix(R.w); };
$('toWorld').onclick = () => { SFX.tap(); world(R.w || curW, false); };
$('toHome').onclick = () => { SFX.tap(); home(false); };

// ---------- the IQ test result ----------
function result(){
  show('resScr'); SFX.win();
  const sc = R.got.filter(Boolean).length, tier = sc >= 11 ? 2 : sc >= 7 ? 1 : 0;
  save.tests = (save.tests || 0) + 1; if (sc > save.best) save.best = sc; store();
  $('score').textContent = dg(sc) + ' / ' + dg(15);
  const T3 = [['#e63946', '٠–٦', 'عَقْلٌ يَتَدَرَّبُ', '🌱'], ['#f4b400', '٧–١٠', 'ذَكِيٌّ جِدًّا', '⭐'], ['#2fbf71', '١١–١٥', 'عَبْقَرِيٌّ', '👑']];
  $('tiers').innerHTML = T3.map((t, k) => `<div class="tier${k === tier ? ' on' : ''}" style="background:${t[0]}"><span>${t[1]}: ${t[2]}</span><span class="cr">${t[3]}</span></div>`).join('');
  $('parts').innerHTML = ['v', 'l', 'm'].map((w, k) => `<div>${WORLDS[w].icon}<b>${dg(R.got.slice(k * 5, k * 5 + 5).filter(Boolean).length)}/${dg(5)}</b>${WORLDS[w].name}</div>`).join('');
  confetti(tier === 2 ? 160 : 70);
  VO.say('res-' + tier);
}
$('testAgain').onclick = () => { SFX.tap(); startTest(); };
$('resHome').onclick = () => { SFX.tap(); home(false); };

// ---------- start ----------
$('go').onclick = () => {
  $('go').hidden = true; $('loading').hidden = false;
  VO.start().then(() => { home(false); VO.say('intro'); });
  setTimeout(() => { if ($('startScr').classList.contains('on')) { home(false); } }, 4000);
};

// confetti
const cv = $('confetti'), cx = cv.getContext('2d'); let bits = [];
function confetti(n){ cv.width = innerWidth; cv.height = innerHeight;
  for (let i = 0; i < n; i++) bits.push({ x:innerWidth / 2, y:innerHeight * .45, vx:(Math.random() - .5) * 12, vy:-Math.random() * 12 - 3, r:Math.random() * 6 + 4,
    c:rnd(['#ffd23f', '#3ddc84', '#59c3ff', '#ff8a5c', '#ff6bd6']), a:Math.random() * 6, life:90 });
  if (bits.length === n) requestAnimationFrame(tick); }
function tick(){ cx.clearRect(0, 0, cv.width, cv.height);
  bits.forEach(b => { b.x += b.vx; b.y += b.vy; b.vy += .35; b.a += .2; b.life--; cx.save(); cx.translate(b.x, b.y); cx.rotate(b.a); cx.fillStyle = b.c; cx.fillRect(-b.r / 2, -b.r / 4, b.r, b.r / 2); cx.restore(); });
  bits = bits.filter(b => b.life > 0 && b.y < cv.height + 20); if (bits.length) requestAnimationFrame(tick); else cx.clearRect(0, 0, cv.width, cv.height); }
})();
