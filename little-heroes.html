<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>عالم الأبطال الصغار</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>document.documentElement.lang='ar';document.documentElement.dir='rtl';</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&family=Lalezar&display=swap">
<style>
/* Layout: sticker-book app shell — sticky top bar with the child's counters, one column of tactile cards (max 980px), floating six-room dock. */
:root{
  --sky:#E7F3FF; --sky-dots:#CFE5FC;
  --paper:#FFFFFF; --paper-2:#F3F7FE; --paper-3:#E7EEFA;
  --ink:#1D2748; --ink-2:#4A5576; --ink-3:#6E7898;
  --line:#D9E3F3;
  --sun:#FFC22E; --sun-deep:#C98500; --sun-tint:#FFF3D3;
  --orange:#EE5D12; --orange-deep:#B4430A; --orange-tint:#FFE8DA;
  --grass:#16934D; --grass-deep:#0D6E38; --grass-tint:#DDF5E6;
  --berry:#E23C78; --berry-deep:#A92455; --berry-tint:#FFE2ED;
  --grape:#6C4CF1; --grape-deep:#4D30C6; --grape-tint:#ECE7FF;
  --ocean:#1F78E0; --ocean-deep:#1659AE; --ocean-tint:#DDEBFF;
  --mint:#0E9688; --mint-deep:#096D63; --mint-tint:#D6F3EF;
  --danger:#E5484D; --danger-deep:#B0282D; --danger-tint:#FFE3E3;
  --gem:#16B5D8; --on-color:#FFFFFF;
  --scrim:rgba(18,26,52,.55);
  --shadow-1:0 2px 0 rgba(29,39,72,.05),0 8px 22px rgba(29,39,72,.08);
  --shadow-2:0 4px 0 rgba(29,39,72,.06),0 18px 44px rgba(29,39,72,.16);
  --scene-sky1:#BEE5FF; --scene-sky2:#EAF7FF; --scene-hill:#8FD98B; --scene-hill2:#6CC46A; --scene-sun:#FFD447;
  --font:"Baloo Bhaijaan 2","Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --display:"Lalezar","Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --r-xl:28px; --r-lg:22px; --r-md:16px; --r-sm:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sky:#0E1531; --sky-dots:#18224A;
  --paper:#18224B; --paper-2:#1F2B5B; --paper-3:#28366C;
  --ink:#F2F5FF; --ink-2:#C6CDEA; --ink-3:#97A1C8;
  --line:#2D3B72;
  --sun:#FFCC47; --sun-deep:#FFB21F; --sun-tint:#3A3220;
  --orange:#F26B26; --orange-deep:#A4430D; --orange-tint:#40291F;
  --grass:#24A65E; --grass-deep:#116B3A; --grass-tint:#183B33;
  --berry:#E8508A; --berry-deep:#A2275A; --berry-tint:#3F2142;
  --grape:#8065F7; --grape-deep:#5034C2; --grape-tint:#2C2A63;
  --ocean:#3D89EE; --ocean-deep:#1E5BB0; --ocean-tint:#1C3263;
  --mint:#19AA99; --mint-deep:#0C6F66; --mint-tint:#163E47;
  --danger:#FF666C; --danger-deep:#B23037; --danger-tint:#4A2231;
  --gem:#3CCDEB; --on-color:#FFFFFF;
  --scrim:rgba(3,7,20,.72);
  --shadow-1:0 2px 0 rgba(0,0,0,.22),0 8px 22px rgba(0,0,0,.28);
  --shadow-2:0 4px 0 rgba(0,0,0,.3),0 18px 44px rgba(0,0,0,.45);
  --scene-sky1:#1A2967; --scene-sky2:#34468F; --scene-hill:#2E6A4E; --scene-hill2:#245640; --scene-sun:#F4F0C9;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --sky:#0E1531; --sky-dots:#18224A;
  --paper:#18224B; --paper-2:#1F2B5B; --paper-3:#28366C;
  --ink:#F2F5FF; --ink-2:#C6CDEA; --ink-3:#97A1C8;
  --line:#2D3B72;
  --sun:#FFCC47; --sun-deep:#FFB21F; --sun-tint:#3A3220;
  --orange:#F26B26; --orange-deep:#A4430D; --orange-tint:#40291F;
  --grass:#24A65E; --grass-deep:#116B3A; --grass-tint:#183B33;
  --berry:#E8508A; --berry-deep:#A2275A; --berry-tint:#3F2142;
  --grape:#8065F7; --grape-deep:#5034C2; --grape-tint:#2C2A63;
  --ocean:#3D89EE; --ocean-deep:#1E5BB0; --ocean-tint:#1C3263;
  --mint:#19AA99; --mint-deep:#0C6F66; --mint-tint:#163E47;
  --danger:#FF666C; --danger-deep:#B23037; --danger-tint:#4A2231;
  --gem:#3CCDEB; --on-color:#FFFFFF;
  --scrim:rgba(3,7,20,.72);
  --shadow-1:0 2px 0 rgba(0,0,0,.22),0 8px 22px rgba(0,0,0,.28);
  --shadow-2:0 4px 0 rgba(0,0,0,.3),0 18px 44px rgba(0,0,0,.45);
  --scene-sky1:#1A2967; --scene-sky2:#34468F; --scene-hill:#2E6A4E; --scene-hill2:#245640; --scene-sun:#F4F0C9;
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
  background-image:radial-gradient(var(--sky-dots) 1.7px,transparent 1.8px);background-size:24px 24px;min-height:100%;
  -webkit-tap-highlight-color:transparent;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--paper)}
body.bare::before{background:var(--sky)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ocean);outline-offset:2px;border-radius:10px}
b,strong{font-weight:700}
.h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,6.4vw,40px);line-height:1.25;margin:0;text-wrap:balance;letter-spacing:0}
.h2{font-family:var(--display);font-weight:400;font-size:clamp(21px,4.6vw,26px);line-height:1.3;margin:0;text-wrap:balance}
.h3{font-weight:800;font-size:18px;line-height:1.35;margin:0;display:block}
.sec-title{margin-top:8px}
.eyebrow{margin:0;font-size:13px;font-weight:700;color:var(--ink-3);letter-spacing:.2px}
.muted{color:var(--ink-2);margin:0}
.fine{font-size:13px;color:var(--ink-3);margin:0}
.center{text-align:center;justify-content:center}
.grow{flex:1;min-width:0}
p{margin:0}
.big-line{font-size:18px;font-weight:600;margin:0}
.big-emoji{font-family:var(--emoji);font-size:40px;line-height:1;flex:none}
.big-emoji.dim{filter:grayscale(1);opacity:.45}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.stack{display:flex;flex-direction:column;gap:18px}
.stack-s{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.center{justify-content:center}
.row.wrap{flex-wrap:wrap}
.spacer{width:44px;flex:none}

/* ---- shell ---- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 3px 0 rgba(29,39,72,.04)}
.topbar-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:8px;min-height:60px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.kid-chip{display:flex;align-items:center;gap:8px;background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:3px 3px 3px 12px;min-width:0;flex:0 1 auto}
.kid-meta{display:flex;flex-direction:column;line-height:1.15;text-align:start;min-width:0}
.kid-meta b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:9.5em}
.kid-meta small{font-size:11.5px;color:var(--ink-3);font-weight:600}
.pet-mini{width:38px;height:38px;border-radius:50%;background:var(--paper-3);display:grid;place-items:center;overflow:hidden;flex:none}
.pet-mini svg{width:46px;height:46px;margin-top:6px}
.counters{display:flex;gap:6px;margin-inline-start:auto}
.counter{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 10px;font-weight:800;font-size:15px;background:var(--sun-tint);color:var(--ink);font-variant-numeric:tabular-nums}
.counter i{font-style:normal;font-family:var(--emoji);font-size:15px}
.counter.gem{background:var(--ocean-tint)}
.top-actions{display:flex;gap:4px}
.icon-btn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--paper-2);display:grid;place-items:center;color:var(--ink-2);flex:none}
.icon-btn .ico-svg{width:22px;height:22px}
.icon-btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.main{max-width:980px;margin:0 auto;padding-block:18px 128px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));outline:none}
body.bare .main{padding-block:28px 48px}
.dock{position:fixed;bottom:0;left:0;right:0;z-index:50;pointer-events:none;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.dock-in{pointer-events:auto;max-width:640px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow-2);display:flex;padding:6px;gap:2px}
.dock-btn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px 5px;border-radius:19px;border:0;background:transparent;color:var(--ink-3);font-size:12px;font-weight:700;transition:background .2s,color .2s}
.dock-btn .ico-svg{width:25px;height:25px}
.dock-btn span{white-space:nowrap}
.dock-btn[aria-current="page"]{background:var(--ct);color:var(--c)}
.dock-btn:active .ico-svg{transform:scale(.88)}

/* ---- buttons & chips ---- */
.btn{--b:var(--orange);--bd:var(--orange-deep);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:9px 20px;border:0;border-radius:16px;background:var(--b);color:var(--on-color);font-weight:800;font-size:17px;line-height:1.2;box-shadow:0 5px 0 var(--bd);transition:transform .08s,box-shadow .08s,filter .15s;text-decoration:none;white-space:nowrap}
.btn .ico-svg{width:20px;height:20px}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--bd)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:0 5px 0 var(--bd)}
.btn.big{min-height:56px;font-size:19px;padding:12px 26px;border-radius:18px}
.btn.small{min-height:40px;font-size:15px;padding:6px 14px;border-radius:13px;box-shadow:0 4px 0 var(--bd)}
.btn.small:active{transform:translateY(3px);box-shadow:0 1px 0 var(--bd)}
.btn.wide{width:100%}
.btn.ghost{--b:var(--paper-2);--bd:var(--line);color:var(--ink);border:1px solid var(--line)}
.btn.green{--b:var(--grass);--bd:var(--grass-deep)}
.btn.berry{--b:var(--berry);--bd:var(--berry-deep)}
.btn.grape{--b:var(--grape);--bd:var(--grape-deep)}
.btn.mint{--b:var(--mint);--bd:var(--mint-deep)}
.btn.ocean{--b:var(--ocean);--bd:var(--ocean-deep)}
.btn.red{--b:var(--danger);--bd:var(--danger-deep)}
.mini-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--paper-2);display:inline-grid;place-items:center;color:var(--ink-2);flex:none;font-size:17px;font-family:var(--emoji)}
.mini-btn .ico-svg{width:19px;height:19px}
.mini-btn.ok{color:var(--grass);background:var(--grass-tint);border-color:transparent}
.mini-btn.no{color:var(--danger)}
.mini-btn.add{color:var(--on-color);background:var(--grass);border-color:transparent}
.mini-btn.on{background:var(--berry-tint);border-color:var(--berry)}
.mini-btn.read-btn{width:auto;padding:0 12px;gap:6px;display:inline-flex;font-family:var(--font);font-weight:700;font-size:14px}
.tts-only{display:none!important}
body.has-tts .tts-only{display:inline-grid!important}
body.has-tts .tts-only.read-btn{display:inline-flex!important}
.link-btn{background:none;border:0;color:var(--ocean);font-weight:700;font-size:14px;padding:6px 4px;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 13px;font-size:14px;font-weight:700;color:var(--ink-2);line-height:1.4;white-space:nowrap}
.chip .ico-svg{width:15px;height:15px}
.chip.big{font-size:16px;padding:9px 16px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.ok{background:var(--grass-tint);color:var(--grass);border-color:transparent}
.chip.warn{background:var(--sun-tint);color:var(--ink);border-color:transparent}
button.chip:hover{border-color:var(--ink-3)}
.choice-row{display:flex;flex-wrap:wrap;gap:10px}
.choice{flex:1 1 120px;min-height:60px;border:2px solid var(--line);background:var(--paper);border-radius:var(--r-md);padding:10px 12px;font-weight:800;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 4px 0 var(--line);transition:transform .08s}
.choice small{font-size:13px;color:var(--ink-3);font-weight:600}
.choice .em{font-family:var(--emoji);font-size:34px;line-height:1.1}
.choice.small{flex:1 1 90px;min-height:48px;font-size:15px}
.choice.on{border-color:var(--grape);background:var(--grape-tint);box-shadow:0 4px 0 var(--grape)}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.seg{display:flex;background:var(--paper-3);border-radius:18px;padding:5px;gap:4px}
.seg button{flex:1;min-width:0;border:0;background:transparent;border-radius:14px;padding:10px 8px;font-weight:800;font-size:15px;color:var(--ink-2)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:var(--shadow-1)}

/* ---- cards ---- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1);padding:16px;min-width:0}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--ocean-tint);border-radius:var(--r-md);padding:12px 14px}
.note>span{font-family:var(--emoji);font-size:22px;line-height:1.3}
.note p{margin:0;font-weight:600}
.note.warn{background:var(--sun-tint)}
.demo-note{background:var(--grape-tint)}
.empty-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:28px 18px}
.intro-card{display:flex;gap:14px;align-items:flex-start;background:var(--grape-tint);border-color:transparent;box-shadow:none}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.page-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.page-top .h2{text-align:center;flex:1;min-width:0}
.bar{position:relative;height:12px;border-radius:999px;background:var(--paper-3);overflow:visible}
.bar>i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:999px;background:var(--grass);transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.bar.gold>i{background:var(--sun)}
.bar.thin{height:8px}
.bar.big{height:18px}
.list{display:flex;flex-direction:column;gap:8px}
.list-row{display:flex;align-items:center;gap:10px;background:var(--paper-2);border-radius:var(--r-md);padding:9px 12px;min-width:0;border:1px solid transparent;text-align:start;width:100%}
.list-row b{display:block;font-size:15.5px;line-height:1.35}
.list-row small{display:block;font-size:13px}
.list.compact .list-row{padding:6px 10px;font-size:14px}
.list-row.as-btn{border-color:var(--line);background:var(--paper)}
.list-row.as-btn.on{border-color:var(--grape);background:var(--grape-tint)}
.row-ico{font-family:var(--emoji);font-size:26px;width:38px;text-align:center;flex:none;line-height:1.2}
.row-ico.small{font-size:18px;width:26px}
.spinner{display:inline-block;width:18px;height:18px;border-radius:50%;border:3px solid currentColor;border-top-color:transparent;animation:spin .8s linear infinite;vertical-align:-3px}
.spinner.big{width:38px;height:38px;border-width:4px;color:var(--grape)}

/* ---- welcome & onboarding ---- */
.welcome{max-width:760px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px}
.welcome-art{position:relative;width:min(240px,62vw);aspect-ratio:1;max-width:100%}
.sun-burst{position:absolute;inset:-6%;border-radius:50%;background:repeating-conic-gradient(var(--sun-tint) 0 12deg,transparent 12deg 24deg);animation:spin 40s linear infinite;opacity:.9}
.egg-stage{position:relative;width:100%;height:100%;display:grid;place-items:center}
.egg-stage svg{width:82%;height:auto;transform-origin:50% 90%}
.egg-stage.wobble svg{animation:wobble 2.6s ease-in-out infinite}
.egg-stage.small{width:90px;height:90px;flex:none}
.egg-stage.shaking svg{animation:shake-egg .35s ease-in-out infinite}
.egg-stage .crack{opacity:0;transition:opacity .2s}
.egg-stage.cracking .crack{opacity:1}
.egg-stage.cracking svg{animation:shake-egg .18s ease-in-out infinite}
.pet-svg .crack{opacity:0}
.w-spark{position:absolute;font-family:var(--emoji);font-size:28px;animation:floaty 3.4s ease-in-out infinite}
.w-spark.s1{top:4%;inset-inline-start:2%}.w-spark.s2{top:12%;inset-inline-end:0;animation-delay:.6s}.w-spark.s3{bottom:14%;inset-inline-start:-4%;animation-delay:1.1s}.w-spark.s4{bottom:6%;inset-inline-end:2%;animation-delay:1.7s}
.logo{font-family:var(--display);font-weight:400;font-size:clamp(38px,10vw,64px);line-height:1.15;margin:0;color:var(--orange);text-shadow:0 4px 0 var(--sun-tint);text-wrap:balance}
.lede{font-size:18px;color:var(--ink-2);max-width:56ch;margin:0}
.feature-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.feature{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--shadow-1)}
.feature span{font-family:var(--emoji);font-size:34px;width:60px;height:60px;border-radius:20px;display:grid;place-items:center;background:var(--ct)}
.feature b{font-size:16px}
.feature small{font-size:13px;color:var(--ink-3);line-height:1.4}
.welcome-cta{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.ob{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.ob-top{display:flex;align-items:center;justify-content:space-between}
.ob-steps{display:flex;gap:6px}
.ob-steps span{width:34px;height:8px;border-radius:99px;background:var(--paper-3)}
.ob-steps span.on{background:var(--grape)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-weight:700;font-size:15px;color:var(--ink-2)}
.field input,.field select,.field textarea{width:100%;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:11px 14px;font-size:17px;min-height:50px}
.field textarea{resize:vertical;min-height:90px;line-height:1.6}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--grape);box-shadow:0 0 0 4px var(--grape-tint)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.egg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.egg-pick{aspect-ratio:1;border:3px solid var(--line);background:var(--paper);border-radius:var(--r-lg);padding:8px;display:grid;place-items:center;box-shadow:0 4px 0 var(--line);max-width:100%}
.egg-pick svg{width:78%;height:auto}
.egg-pick.on{border-color:var(--grape);background:var(--grape-tint);box-shadow:0 4px 0 var(--grape)}
.egg-pick.on svg{animation:wobble 1.8s ease-in-out infinite;transform-origin:50% 90%}
.ready-card{display:flex;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;box-shadow:var(--shadow-1)}

/* ---- home ---- */
.hello{display:flex;flex-direction:column;gap:2px}
.pet-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow-1);overflow:hidden}
.scene{position:relative;aspect-ratio:4/3;max-width:100%;overflow:hidden;background:linear-gradient(var(--scene-sky1),var(--scene-sky2));container-type:inline-size}
.scene .ground{position:absolute;left:-15%;right:-15%;bottom:-38%;height:62%;border-radius:50%;background:var(--scene-hill);box-shadow:inset 0 14px 0 var(--scene-hill2)}
.scene::before{content:"";position:absolute;width:min(15%,96px);aspect-ratio:1;inset-inline-end:7%;top:8%;border-radius:50%;background:var(--scene-sun);box-shadow:0 0 0 10px color-mix(in srgb,var(--scene-sun) 30%,transparent)}
.deco{position:absolute;font-family:var(--emoji);line-height:1;pointer-events:none;transform:translate(-50%,0);animation:floaty 5s ease-in-out infinite}
.deco:nth-child(2n){animation-delay:1.3s}.deco:nth-child(3n){animation-delay:2.4s}
.scene-beach{background:linear-gradient(#9DDCFF 0 52%,#3FB8E8 52% 64%,#F7DC9A 64%)}
.scene-beach .ground{background:#F3D488;box-shadow:inset 0 12px 0 #E9C46A}
.scene-desert{background:linear-gradient(#FFD9A8,#FFF0D6)}
.scene-desert .ground{background:#F0B866;box-shadow:inset 0 14px 0 #E2A04C}
.scene-forest{background:linear-gradient(#A9E3B4,#E3F7E6)}
.scene-forest .ground{background:#4FA65A;box-shadow:inset 0 14px 0 #3E8E49}
.scene-rainbow{background:linear-gradient(#FFD6EC,#E4F1FF)}
.scene-rainbow .ground{background:#B8E986;box-shadow:inset 0 14px 0 #9BD66B}
.scene-sea{background:linear-gradient(#2BA6DD,#0E5B9E)}
.scene-sea .ground{background:#E8CF8E;box-shadow:inset 0 14px 0 #D3B66E}
.scene-sea::before,.scene-space::before,.scene-castle::before,.scene-rainbow::before,.scene-forest::before{display:none}
.scene-space{background:radial-gradient(circle at 30% 20%,#3C3A8F,#151638 70%)}
.scene-space .ground{background:#8E92B8;box-shadow:inset 0 14px 0 #74789F}
.scene-castle{background:linear-gradient(#FFC4DA,#FFE8F1)}
.scene-castle .ground{background:#9ADB9A;box-shadow:inset 0 14px 0 #7FC67F}
.bubble{position:absolute;top:6%;inset-inline-start:5%;max-width:min(54%,330px);background:#FFFFFF;color:#1D2748;border-radius:20px;padding:9px 14px;font-weight:700;font-size:clamp(14px,3.7cqw,18px);line-height:1.45;box-shadow:0 4px 0 rgba(29,39,72,.12);z-index:3}
.bubble::after{content:"";position:absolute;bottom:-9px;inset-inline-end:26px;border:10px solid transparent;border-top-color:#FFFFFF;border-bottom:0}
.bubble.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.pet-wrap{position:absolute;bottom:4%;left:40%;width:min(50%,300px);aspect-ratio:1;translate:-50% 0;scale:var(--ps,1);transform-origin:50% 100%;border:0;padding:0;background:transparent;z-index:2;display:block;container-type:inline-size}
.pet-wrap.stage-0{--ps:.86}.pet-wrap.stage-1{--ps:.8}.pet-wrap.stage-2{--ps:.88}.pet-wrap.stage-3{--ps:.94}.pet-wrap.stage-4{--ps:1}.pet-wrap.stage-5{--ps:1.04}
.pet-body{position:absolute;inset:0;display:block;animation:bob 3.2s ease-in-out infinite;transform-origin:50% 100%}
.pet-body.jump{animation:jump .7s cubic-bezier(.3,1.5,.5,1)}
.pet-body.wobble-now{animation:wobble .6s ease-in-out 2}
.pet-svg{width:100%;height:100%;display:block;overflow:visible}
.pet-svg .eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.pet-svg.egg{transform-origin:50% 90%;animation:wobble 3s ease-in-out infinite}
.acc{position:absolute;font-family:var(--emoji);line-height:1;pointer-events:none;translate:-50% 0;left:50%}
.acc-hat{top:-7%;font-size:31cqw}
.acc-eyes{top:37%;font-size:27cqw}
.acc-hand{top:50%;left:90%;font-size:19cqw}
.aura{position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(circle,rgba(255,206,64,.55),rgba(255,206,64,0) 65%);z-index:-1;animation:pulse-glow 2.4s ease-in-out infinite}
.rain-cloud{position:absolute;top:-24%;left:50%;translate:-50% 0;font-family:var(--emoji);font-size:28cqw;animation:floaty 3s ease-in-out infinite;z-index:3}
.pet-info{padding:12px 16px 16px;display:flex;flex-direction:column;gap:8px}
.pet-name{display:flex;align-items:center;gap:8px}
.pet-name b{font-family:var(--display);font-weight:400;font-size:24px}
.tag{font-size:13px;font-weight:800;background:var(--grape-tint);color:var(--grape);padding:2px 10px;border-radius:999px}
.lvl{display:flex;flex-direction:column;gap:6px}
.lvl-top{display:flex;justify-content:space-between;font-weight:800;font-size:15px;gap:8px}
.home-grid{display:grid;grid-template-columns:1fr;gap:14px}
.today-card{display:flex;gap:16px;align-items:center}
.today-card .grow{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.pending-note{font-size:14px;font-weight:700;color:var(--ink);background:var(--sun-tint);padding:2px 10px;border-radius:99px;margin:0}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--paper-3);stroke-width:11}
.ring-fg{fill:none;stroke:var(--c);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.3,1.3,.5,1)}
.ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring-txt b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.ring-txt small{font-size:11.5px;color:var(--ink-3);font-weight:700}
.spin-card,.goal-card,.repair-card,.locked-card{display:flex;align-items:center;gap:12px}
.spin-card b,.goal-card b,.repair-card b{display:block;font-size:16.5px;line-height:1.35}
.spin-card small,.goal-card small,.repair-card small{display:block;font-size:13.5px;color:var(--ink-2)}
.spin-card.ready{background:var(--berry-tint);border-color:transparent}
.goal-card .grow{display:flex;flex-direction:column;gap:4px}
.repair-card{background:var(--mint-tint);border-color:transparent}
.wiggle{animation:wiggle 1.6s ease-in-out infinite}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start;border:0;border-radius:var(--r-lg);padding:14px;background:var(--ct);color:var(--ink);box-shadow:inset 0 -5px 0 color-mix(in srgb,var(--c) 30%,transparent);min-width:0}
.tile-ico{font-family:var(--emoji);font-size:34px;line-height:1.2;margin-bottom:2px}
.tile b{font-size:16px}
.tile small{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.tile:active{transform:translateY(2px)}

/* ---- missions ---- */
.progress-card{display:flex;flex-direction:column;gap:10px}
.goal-mark{position:absolute;top:-8px;bottom:-8px;width:3px;background:var(--ink);border-radius:3px;translate:50% 0}
.goal-mark em{position:absolute;top:-22px;left:50%;translate:-50% 0;font-style:normal;font-family:var(--emoji);font-size:16px}
.task-group{display:flex;flex-direction:column;gap:10px}
.group-title{margin:0;font-size:17px;font-weight:800;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.group-title span{font-family:var(--emoji)}
.task-list{display:grid;grid-template-columns:1fr;gap:10px}
.task{position:relative;display:flex;align-items:stretch;gap:6px;background:var(--paper);border:2px solid var(--line);border-radius:20px;box-shadow:0 4px 0 var(--line);min-width:0}
.task-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:10px 12px;text-align:start;border-radius:18px}
.t-ico{width:56px;height:56px;flex:none;border-radius:16px;display:grid;place-items:center;font-family:var(--emoji);font-size:31px;background:var(--ct)}
.t-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.t-body b{font-size:17px;line-height:1.35}
.t-body small{font-size:13.5px;color:var(--ink-2)}
.t-stars{font-weight:800;color:var(--ink)}
.t-state{flex:none;width:46px;height:46px;display:grid;place-items:center}
.t-check{width:36px;height:36px;border-radius:12px;border:3px dashed var(--line)}
.stamp{font-family:var(--emoji);font-size:34px;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--sun-tint);transform:rotate(-12deg);box-shadow:0 0 0 3px var(--paper),0 3px 8px rgba(0,0,0,.15)}
.hourglass{font-family:var(--emoji);font-size:28px;animation:wiggle 2s ease-in-out infinite}
.t-tools{display:flex;flex-direction:column;justify-content:center;gap:6px;padding-inline-end:8px}
.task.done{background:var(--grass-tint);border-color:var(--grass);box-shadow:0 4px 0 var(--grass)}
.task.done .t-body b{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:color-mix(in srgb,var(--grass) 60%,transparent)}
.task.pending{border-style:dashed;border-color:var(--sun-deep);background:var(--sun-tint)}
.task.just .stamp{animation:stamp .55s cubic-bezier(.3,1.6,.5,1)}
.task.just{animation:pop .4s ease-out}
.task:active{transform:translateY(2px)}
.countdown{display:grid;place-items:center}
.countdown .ring{width:150px;height:150px}
.countdown .ring-txt b{font-size:30px}
.runner{width:110px;height:110px;position:relative;margin:0 auto}
.runner .pet-wrap{left:50%;width:100%;bottom:0}
.running .pet-body{animation:run .5s ease-in-out infinite}

/* ---- wheel ---- */
.wheel-box{position:relative;width:min(320px,78vw);aspect-ratio:1;margin:8px auto 0}
.wheel{width:100%;height:100%;transition:transform 4.6s cubic-bezier(.12,.67,.1,1);transform-origin:50% 50%;filter:drop-shadow(0 6px 0 rgba(0,0,0,.12))}
.wheel text{font-family:var(--emoji)}
.wheel .wheel-lbl{font-family:var(--font);font-size:9.5px;font-weight:800;fill:#FFFFFF}
.wheel-pointer{position:absolute;top:-6px;left:50%;translate:-50% 0;width:0;height:0;border-inline:16px solid transparent;border-top:28px solid var(--ink);z-index:2;filter:drop-shadow(0 2px 0 var(--paper))}
.wheel-hub{position:absolute;inset:36%;border-radius:50%;border:5px solid var(--paper);background:var(--ink);color:var(--paper);font-family:var(--display);font-size:clamp(18px,5vw,24px);box-shadow:0 5px 0 rgba(0,0,0,.25)}
.wheel-hub:disabled{opacity:1;cursor:default}
.spin-result{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:20px}
.spin-result b{font-size:20px}

/* ---- store, shop ---- */
.reward-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.reward{background:var(--paper);border:2px solid var(--line);border-radius:var(--r-lg);padding:14px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;box-shadow:0 4px 0 var(--line);min-width:0}
.reward b{font-size:15.5px;line-height:1.35}
.reward-ico{font-family:var(--emoji);font-size:44px;line-height:1.15}
.reward.can{border-color:var(--berry);box-shadow:0 4px 0 var(--berry)}
.reward.is-goal{background:var(--berry-tint)}
.reward .bar{width:100%}
.reward-actions{display:flex;gap:6px;align-items:center;margin-top:auto;padding-top:4px}
.price{font-weight:800;font-size:15px;background:var(--sun-tint);border-radius:999px;padding:1px 10px;font-variant-numeric:tabular-nums}
.price.own{background:var(--grass-tint);color:var(--grass)}
.price.short{opacity:.6}
.shop-top{display:flex;flex-direction:column;gap:12px}
.shop-stage{border-radius:var(--r-xl);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow-1)}
.shop-stage .scene{aspect-ratio:16/9}
.shop-stage .pet-wrap{left:50%;width:min(40%,240px)}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.shop-item{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid var(--line);background:var(--paper);border-radius:var(--r-md);padding:10px 6px;box-shadow:0 4px 0 var(--line);min-width:0}
.shop-item b{font-size:14px;line-height:1.3}
.shop-e{font-family:var(--emoji);font-size:38px;line-height:1.2}
.shop-item.owned{border-color:var(--grass)}
.shop-item.on{background:var(--grass-tint);box-shadow:0 4px 0 var(--grass)}
.scene-swatch{width:100%;max-width:100%;aspect-ratio:16/10;border-radius:10px;display:grid;place-items:center;font-family:var(--emoji);font-size:26px;position:relative;overflow:hidden;background:linear-gradient(var(--scene-sky1),var(--scene-hill))}
.scene-swatch.scene-meadow{background:linear-gradient(var(--scene-sky1) 55%,var(--scene-hill) 55%)}

/* ---- stickers & badges ---- */
.sticker{display:inline-grid;place-items:center;font-family:var(--emoji);font-size:30px;width:58px;height:58px;border-radius:50%;background:var(--sun-tint);border:4px solid var(--paper);box-shadow:0 4px 12px rgba(29,39,72,.18);transform:rotate(-6deg);line-height:1}
.sticker.xl{font-size:64px;width:120px;height:120px;border-width:6px}
.sticker.locked{filter:grayscale(1);opacity:.35;background:var(--paper-3)}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 8px;box-shadow:var(--shadow-1);min-width:0}
.badge b{font-size:14.5px;line-height:1.3}
.badge small{font-size:12px;color:var(--ink-2);line-height:1.45}
.badge .date{color:var(--ink-3);font-weight:700}
.badge.on:nth-child(3n) .sticker{transform:rotate(5deg)}
.badge.on:nth-child(3n+1) .sticker{background:var(--ocean-tint)}
.badge.on:nth-child(3n+2) .sticker{background:var(--berry-tint)}
.badge.off{background:var(--paper-2);box-shadow:none}
.cert-img{width:100%;height:auto;border-radius:12px;box-shadow:var(--shadow-1)}

/* ---- calm ---- */
.feel-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.feel{display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--line);background:var(--paper);border-radius:var(--r-md);padding:10px 4px;box-shadow:0 4px 0 var(--line);min-width:0}
.feel span{font-family:var(--emoji);font-size:38px;line-height:1.15}
.feel b{font-size:14.5px}
.feel:hover{border-color:var(--c)}
.breath-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.breath-card{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:var(--mint-tint);border-radius:var(--r-lg);padding:16px 8px;box-shadow:inset 0 -5px 0 color-mix(in srgb,var(--mint) 30%,transparent);min-width:0}
.breath-card b{font-size:16px}
.breath-card small{font-size:12.5px;color:var(--ink-2)}
.strat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.strat{display:flex;align-items:center;gap:8px;text-align:start;border:1px solid var(--line);background:var(--paper);border-radius:var(--r-md);padding:10px 12px;font-weight:700;font-size:14.5px;line-height:1.4;min-width:0}
.strat span{font-family:var(--emoji);font-size:24px;flex:none}
.repair-big{display:flex;gap:14px;align-items:center;background:var(--mint-tint);border-color:transparent}
.mini-scene{position:relative;width:110px;height:110px;flex:none}
.mini-scene .pet-wrap{left:50%;width:100%;bottom:0}
.act-list{text-align:start;margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:4px;font-weight:600}
.count-num{font-family:var(--display);font-size:120px;line-height:1.1;color:var(--mint)}
.count-num.pulse{animation:pop .5s ease-out}
.breath-page{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.breath-page .page-top{width:100%}
.breath-stage{position:relative;width:min(300px,76vw);aspect-ratio:1;display:grid;place-items:center}
.breath-shape{--dur:4000ms;width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-family:var(--emoji);font-size:min(110px,26vw);background:radial-gradient(circle at 35% 30%,var(--mint-tint),color-mix(in srgb,var(--mint) 40%,var(--mint-tint)));transform:scale(.5);transition:transform var(--dur) ease-in-out;box-shadow:0 0 0 12px color-mix(in srgb,var(--mint) 12%,transparent)}
.breath-shape.grow{transform:scale(1)}
.breath-shape.shrink{transform:scale(.5)}
.mode-flower .breath-shape{background:radial-gradient(circle at 35% 30%,var(--berry-tint),color-mix(in srgb,var(--berry) 35%,var(--berry-tint)))}
.mode-square .breath-shape{border-radius:24px;background:var(--ocean-tint);transform:scale(.9)!important;box-shadow:none}
.sq-path{position:absolute;inset:5%;border:4px dashed var(--ocean);border-radius:20px}
.sq-dot{--dur:4000ms;position:absolute;width:30px;height:30px;border-radius:50%;background:var(--ocean);box-shadow:0 0 0 6px var(--ocean-tint);top:calc(95% - 15px);left:calc(5% - 15px);transition:top var(--dur) linear,left var(--dur) linear}
.sq-dot.p0{top:calc(5% - 15px);left:calc(5% - 15px)}
.sq-dot.p1{top:calc(5% - 15px);left:calc(95% - 15px)}
.sq-dot.p2{top:calc(95% - 15px);left:calc(95% - 15px)}
.sq-dot.p3{top:calc(95% - 15px);left:calc(5% - 15px)}
.breath-label{font-size:clamp(20px,5vw,26px);font-weight:800;min-height:1.6em;margin:0}
.breath-dots{display:flex;gap:8px}
.breath-dots span{width:14px;height:14px;border-radius:50%;background:var(--paper-3)}
.breath-dots span.on{background:var(--mint)}
.breath-end{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:420px}
.breath-end b{font-size:19px}

/* ---- games ---- */
.stat-strip{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14.5px;color:var(--ink-2);font-weight:600}
.stat-strip b{color:var(--ink)}
.game-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.game-grid>.game-card:first-child,.story-grid.built>.story-cover:first-child{grid-column:span 2}
.game-grid>.game-card:first-child{display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-items:center}
.game-grid>.game-card:first-child .game-ico{grid-row:span 4;font-size:56px}
.game-grid>.game-card:first-child .game-stat{justify-self:start}
.game-card{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:start;border:0;border-radius:var(--r-lg);padding:16px;background:var(--ct);color:var(--ink);box-shadow:inset 0 -6px 0 color-mix(in srgb,var(--c) 35%,transparent);min-width:0}
.game-card b{font-size:18px}
.game-card small{font-size:13.5px;color:var(--ink-2);line-height:1.45}
.game-ico{font-family:var(--emoji);font-size:42px;line-height:1.2}
.game-stat{margin-top:6px;font-size:12.5px;font-weight:800;color:var(--c);background:var(--paper);padding:2px 10px;border-radius:99px}
.game-card.is-locked{filter:grayscale(.8);opacity:.6}
.locked-card{background:var(--grape-tint);border-color:transparent}
.game-body{display:flex;flex-direction:column;gap:14px}
.q-card{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.q-dots{display:flex;gap:6px;justify-content:center}
.q-dots span{width:26px;height:8px;border-radius:99px;background:var(--paper-3)}
.q-dots span.ok{background:var(--grass)}.q-dots span.no{background:var(--orange)}.q-dots span.cur{background:var(--ink-3)}
.q-emoji{font-family:var(--emoji);font-size:66px;text-align:center;line-height:1.15}
.q-face{font-family:var(--emoji);font-size:110px;text-align:center;line-height:1.1;animation:pop .4s ease-out}
.q-text{font-size:clamp(19px,4.6vw,23px);font-weight:700;text-align:center;line-height:1.55;margin:0}
.q-text .mini-btn{vertical-align:middle}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
.opt{border:2px solid var(--line);background:var(--paper);border-radius:var(--r-md);padding:13px 16px;font-size:17px;font-weight:700;text-align:start;box-shadow:0 4px 0 var(--line);line-height:1.45;display:flex;align-items:center;gap:10px;transition:transform .08s}
.opt span{font-family:var(--emoji);font-size:26px}
.opt:active{transform:translateY(3px)}
.opt.right{border-color:var(--grass);background:var(--grass-tint);box-shadow:0 4px 0 var(--grass)}
.opt.wrong{border-color:var(--orange);background:var(--orange-tint);box-shadow:0 4px 0 var(--orange);animation:shake .4s}
.opt:disabled{cursor:default;color:var(--ink)}
.emo-opts{grid-template-columns:1fr 1fr}
.feedback{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.feedback p{font-size:17px;font-weight:600;padding:10px 14px;border-radius:var(--r-md);margin:0}
.feedback p.ok{background:var(--grass-tint)}
.feedback p.no{background:var(--orange-tint)}
.game-over{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:24px 16px}
.gem-won{font-size:26px;font-weight:800;color:var(--ocean);margin:0}
.lesson{background:var(--sun-tint);border-radius:var(--r-md);padding:10px 14px;font-weight:600;max-width:460px}
.sort-wrap{display:flex;flex-direction:column;gap:14px}
.sort-hud,.mem-hud,.catch-hud{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-size:16px;flex-wrap:wrap}
.combo{color:var(--orange);font-weight:800}
.sort-stage{display:grid;place-items:center;min-height:220px;overflow:hidden}
.sort-card{width:min(260px,70vw);aspect-ratio:1.15;border-radius:var(--r-xl);background:var(--paper-2);border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:12px}
.sort-card .sc-e{font-family:var(--emoji);font-size:76px;line-height:1.1}
.sort-card b{font-size:20px}
.sort-card.enter{animation:pop .3s ease-out}
.sort-card.fly-good{animation:fly-start .3s ease-in forwards}
.sort-card.fly-bad{animation:fly-end .3s ease-in forwards}
.sort-card.shake{animation:shake .45s}
.sort-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sort-btn{min-height:76px;border:0;border-radius:var(--r-lg);font-size:20px;font-weight:800;color:var(--on-color);box-shadow:0 6px 0 var(--bd)}
.sort-btn.good{background:var(--grass);--bd:var(--grass-deep)}
.sort-btn.bad{background:var(--danger);--bd:var(--danger-deep)}
.sort-btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--bd)}
.sort-btn:disabled{opacity:.45}
.catch-box{position:relative;border-radius:var(--r-lg);overflow:hidden;border:2px solid var(--line);touch-action:none;background:var(--scene-sky2)}
.catch-box canvas{display:block;width:100%;touch-action:none;cursor:grab}
.catch-ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:18px;background:color-mix(in srgb,var(--paper) 88%,transparent);overflow:auto}
.catch-ov .game-over{background:transparent;border:0;box-shadow:none;padding:0}
.mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;perspective:900px}
.mem-grid.cols-5{grid-template-columns:repeat(5,1fr)}
.mcard{aspect-ratio:3/3.6;border:0;background:transparent;padding:0;max-width:100%}
.mc-in{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
.mcard.up .mc-in{transform:rotateY(180deg)}
.mc-front,.mc-back{position:absolute;inset:0;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;gap:2px;padding:4px}
.mc-front{background:var(--grape);color:var(--on-color);font-family:var(--emoji);font-size:30px;box-shadow:inset 0 -5px 0 var(--grape-deep);background-image:radial-gradient(rgba(255,255,255,.18) 2px,transparent 2.5px);background-size:14px 14px}
.mc-back{background:var(--paper);border:2px solid var(--line);transform:rotateY(180deg)}
.mc-back span{font-family:var(--emoji);font-size:clamp(26px,7vw,40px);line-height:1.1}
.mc-back small{font-size:11.5px;font-weight:700;line-height:1.25;text-align:center;color:var(--ink-2)}
.mcard.matched .mc-back{border-color:var(--grass);background:var(--grass-tint)}
.traffic{display:flex;flex-direction:column;gap:16px}
.tl-row{display:flex;align-items:center;gap:16px}
.tl-light{display:flex;flex-direction:column;gap:8px;background:#20263F;padding:10px;border-radius:20px;flex:none}
.tl-light span{width:38px;height:38px;border-radius:50%;background:#3A4060;transition:background .15s,box-shadow .15s}
.tl-light.r .r{background:#FF4D4F;box-shadow:0 0 18px #FF4D4F}
.tl-light.y .y{background:#FFC22E;box-shadow:0 0 18px #FFC22E}
.tl-light.g .g{background:#2BD46E;box-shadow:0 0 18px #2BD46E}
.tl-msg{font-size:clamp(18px,4.6vw,22px);font-weight:800;line-height:1.45}
.track{position:relative;height:96px;border-radius:var(--r-lg);background:repeating-linear-gradient(90deg,var(--paper-3) 0 26px,var(--paper-2) 26px 52px);border:2px solid var(--line);overflow:hidden}
.finish{position:absolute;inset-inline-end:8px;top:50%;translate:0 -50%;font-family:var(--emoji);font-size:42px}
.runner#runner{position:absolute;bottom:10px;inset-inline-start:calc((100% - 76px) * var(--p,0));width:66px;height:66px;margin:0;transition:inset-inline-start .2s ease-out}
.runner#runner .pet-mini{width:66px;height:66px;background:transparent}
.runner#runner .pet-mini svg{width:76px;height:76px;margin-top:0}
.runner.oops{animation:shake .4s}
.go-btn{min-height:72px;font-size:24px}
.tl-foot{font-weight:700;color:var(--ink-2)}
.routine-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.slots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.slots li{display:flex;align-items:center;gap:10px;border:2px dashed var(--line);border-radius:14px;padding:6px 10px;min-height:46px;font-weight:700}
.slots li.filled{border-style:solid;border-color:var(--mint);background:var(--mint-tint);animation:pop .3s ease-out}
.slots .num{width:28px;height:28px;border-radius:50%;background:var(--paper-3);display:grid;place-items:center;font-size:14px;font-weight:800;flex:none}
.slots li.filled .num{background:var(--mint);color:var(--on-color)}
.slots .ph{color:var(--ink-3)}
.step-pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.step-btn{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:10px;font-weight:700;font-size:15px;text-align:start;box-shadow:0 4px 0 var(--line)}
.step-btn span{font-family:var(--emoji);font-size:26px}
.step-btn.shake{animation:shake .4s;border-color:var(--orange)}

/* ---- stories ---- */
.ai-card{display:flex;align-items:center;gap:12px;border:2px dashed var(--grape);background:var(--grape-tint);border-radius:var(--r-lg);padding:14px;text-align:start;color:var(--ink)}
.ai-card b{display:block;font-size:17px}
.ai-card small{display:block;color:var(--ink-2);font-size:13.5px}
.ai-ico{font-family:var(--emoji);font-size:38px}
.story-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.story-cover{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:start;border:0;border-radius:22px;border-start-start-radius:6px;border-end-start-radius:6px;padding:16px 14px 14px;background:var(--ct);color:var(--ink);box-shadow:inset -10px 0 0 color-mix(in srgb,var(--c) 45%,transparent),var(--shadow-1);min-width:0;min-height:170px}
.story-cover b{font-size:16.5px;line-height:1.4}
.cover-art{font-family:var(--emoji);font-size:52px;line-height:1.15}
.story-cover .chip{margin-top:auto;background:var(--paper);font-size:12.5px;padding:2px 10px}
.done-badge,.new-badge{position:absolute;top:10px;inset-inline-end:12px;font-weight:800;font-size:13px;border-radius:99px;padding:1px 9px}
.done-badge{background:var(--grass);color:var(--on-color)}
.new-badge{background:var(--paper);color:var(--ocean)}
.story-page{display:flex;flex-direction:column}
.story-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow-1);overflow:hidden;display:flex;flex-direction:column;gap:14px;padding-bottom:18px}
.story-scene{background:var(--ct);min-height:150px;display:flex;align-items:center;justify-content:center;gap:clamp(4px,2vw,14px);padding:18px 12px;flex-wrap:wrap}
.story-scene span{font-family:var(--emoji);font-size:clamp(46px,12vw,72px);line-height:1.1;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.story-prog{height:6px;background:var(--paper-3);margin-top:-14px}
.story-prog i{display:block;height:100%;background:var(--c);transition:width .4s}
.story-text{font-size:clamp(19px,4.6vw,23px);line-height:1.8;font-weight:600;padding-inline:18px;margin:0}
.read-btn{align-self:flex-start;margin-inline-start:18px}
.story-actions{display:flex;flex-direction:column;gap:12px;padding-inline:18px}
.story-actions .btn.big{align-self:flex-start}
.choose-label{font-weight:800;color:var(--ink-2);margin:0}
.moral{display:flex;gap:10px;align-items:flex-start;background:var(--sun-tint);border-radius:var(--r-md);padding:12px 14px}
.moral span{font-family:var(--emoji);font-size:26px}
.moral p{margin:0;font-size:17px;font-weight:600}
.moral.soft{background:var(--orange-tint)}
.writing{position:relative;width:140px;height:140px;margin:0 auto}
.writing .pet-wrap{left:50%;width:100%;bottom:0}
.pen{position:absolute;inset-inline-start:-6px;bottom:8px;font-family:var(--emoji);font-size:40px;animation:write 0.9s ease-in-out infinite}

/* ---- parent ---- */
.parent{display:flex;flex-direction:column;gap:14px}
.parent-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.kid-pills{display:flex;gap:6px;flex-wrap:wrap}
.kid-pill{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 12px 3px 3px;font-weight:700;font-size:14px}
.kid-pill .pet-mini{width:30px;height:30px}
.kid-pill .pet-mini svg{width:36px;height:36px;margin-top:5px}
.kid-pill.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ptabs{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin;position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);z-index:5;background:var(--sky);margin-inline:-4px;padding-inline:4px}
.ptab{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:8px 13px;font-weight:700;font-size:14.5px;color:var(--ink-2)}
.ptab .ico-svg{width:18px;height:18px}
.ptab.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stat-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat small{font-size:12.5px;color:var(--ink-3);font-weight:700}
.stat b{font-size:24px;font-weight:800;line-height:1.3}
.delta{font-size:12.5px;font-weight:700}
.delta.good{color:var(--grass)}
.delta.bad{color:var(--danger)}
.delta.flat{color:var(--ink-3)}
.p-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.action-tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start;border:0;border-radius:var(--r-lg);padding:14px;background:var(--ct);color:var(--ink);box-shadow:inset 0 -5px 0 color-mix(in srgb,var(--c) 35%,transparent)}
.action-tile span{font-family:var(--emoji);font-size:30px}
.action-tile b{font-size:17px}
.action-tile small{font-size:13px;color:var(--ink-2)}
.p-section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.p-section-head .muted{font-size:14px}
.toggle-pill{border:2px solid var(--line);background:var(--paper);border-radius:99px;padding:4px 12px;font-weight:700;font-size:13.5px;white-space:nowrap;flex:none}
.toggle-pill.done{background:var(--grass);color:var(--on-color);border-color:var(--grass)}
.toggle-pill.pending{background:var(--sun-tint);border-color:var(--sun-deep)}
.tip-card{display:flex;gap:12px;align-items:flex-start;background:var(--sun-tint);border-color:transparent;box-shadow:none}
.tip-card b{display:block;font-size:17px}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.lib-item{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 10px;min-width:0}
.lib-item b{display:block;font-size:14.5px;line-height:1.35}
.lib-item small{display:block;font-size:12.5px}
.lib-item.added{background:var(--paper-2)}
.emoji-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;max-height:156px;overflow-y:auto;padding:4px;border:1px solid var(--line);border-radius:14px}
.emoji-pick label,.seg-radio label,.day-pick label{position:relative;cursor:pointer}
.emoji-pick input,.seg-radio input,.day-pick input{position:absolute;opacity:0;width:1px;height:1px}
.emoji-pick span{display:grid;place-items:center;height:44px;border-radius:12px;font-family:var(--emoji);font-size:24px;border:2px solid transparent}
.emoji-pick input:checked+span{border-color:var(--grape);background:var(--grape-tint)}
.emoji-pick input:focus-visible+span,.seg-radio input:focus-visible+span,.day-pick input:focus-visible+span{outline:3px solid var(--ocean)}
.seg-radio,.day-pick{display:flex;flex-wrap:wrap;gap:6px}
.seg-radio span,.day-pick span{display:inline-flex;align-items:center;justify-content:center;min-width:52px;min-height:42px;padding:4px 10px;border:2px solid var(--line);border-radius:12px;font-weight:700;font-size:14.5px;background:var(--paper)}
.seg-radio input:checked+span,.day-pick input:checked+span{border-color:var(--grape);background:var(--grape-tint);color:var(--ink)}
.beh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.beh{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:var(--r-md);padding:10px;font-weight:700;font-size:14.5px;text-align:start;line-height:1.35}
.beh span{font-family:var(--emoji);font-size:24px;flex:none}
.beh.tracked{border-color:var(--orange);background:var(--orange-tint)}
.beh-card{display:flex;flex-direction:column;gap:10px}
.beh-top{display:flex;align-items:center;gap:12px}
.beh-top small{display:block;font-size:13px}
.beh-card details{background:var(--paper-2);border-radius:var(--r-md);padding:8px 12px}
.beh-card summary{cursor:pointer;font-weight:800;color:var(--ocean)}
.advice{border-radius:var(--r-md);padding:10px 12px;margin-top:8px}
.advice b{display:block;font-size:14px}
.advice p{margin:0;line-height:1.6}
.advice.now{background:var(--orange-tint)}
.advice.later{background:var(--ocean-tint)}
.advice.alt{background:var(--grass-tint)}
.alt-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:15px}
.rule-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.rule{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:4px}
.rule span{font-family:var(--emoji);font-size:28px}
.rule b{font-size:16px}
.rule p{font-size:14.5px;color:var(--ink-2);margin:0;line-height:1.65}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;position:relative}
.timeline li{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tl-w{font-size:12.5px;font-weight:800;color:var(--grape)}
.timeline p{margin:0;color:var(--ink-2);font-size:14.5px;line-height:1.65}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.clean-list{margin:8px 0 0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;line-height:1.65}
.clean-list.bad li::marker{color:var(--danger)}
.clean-list.num{list-style:decimal}
.switch-row{display:flex;align-items:center;gap:12px;cursor:pointer}
.switch-row b{display:block}
.switch-row small{display:block;font-size:13px}
.switch{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:99px;background:var(--paper-3);border:1px solid var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:inset-inline-start .2s}
.switch:checked{background:var(--grass)}
.switch:checked::after{inset-inline-start:26px}
.file-btn{position:relative;cursor:pointer}
.insights{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.insights li{display:flex;gap:10px;align-items:flex-start;background:var(--paper-2);border-radius:var(--r-md);padding:10px 12px}
.insights span{font-family:var(--emoji);font-size:22px}
.insights p{margin:0;line-height:1.65}
.chart{width:100%;min-height:200px;overflow:hidden}
.chart svg{display:block;max-width:100%}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--ink-3);stroke-width:1}
.chart .tick,.chart .xl{fill:var(--ink-3);font-size:12px;font-family:var(--font);font-variant-numeric:tabular-nums}
.chart .val{fill:var(--ink);font-size:12.5px;font-weight:800;font-family:var(--font)}
.chart .hit{cursor:default}
.chart .hit:focus{outline:none}
.chart .hit:focus-visible{stroke:var(--ocean);stroke-width:2}
.hbars{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.hbar{display:grid;grid-template-columns:minmax(0,9.5em) 1fr 3.4em;align-items:center;gap:8px;font-size:14px}
.hb-label{display:flex;align-items:center;gap:6px;font-weight:700;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.hb-label i{font-style:normal;font-family:var(--emoji)}
.hb-track{height:14px;background:var(--paper-3);border-radius:99px;overflow:hidden}
.hb-fill{display:block;height:100%;border-radius:99px}
.hb-val{font-weight:800;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:start}
.tbl th{color:var(--ink-3);font-weight:700}
.tbl td:last-child{font-variant-numeric:tabular-nums;font-weight:700}
.quote{background:var(--paper-2);border-inline-start:4px solid var(--grape);border-radius:8px;padding:8px 12px;margin:6px 0 10px;font-weight:600}

/* ---- modal, celebration, gate, toast ---- */
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal-back{position:absolute;inset:0;background:var(--scrim);animation:fade .2s ease-out}
.modal-card{position:relative;width:min(520px,100%);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;background:var(--paper);border-radius:26px;padding:24px 20px 20px;box-shadow:var(--shadow-2);animation:rise .3s cubic-bezier(.3,1.4,.5,1);display:flex;flex-direction:column;gap:14px}
.modal-card.wide{width:min(760px,100%)}
.modal-x{position:absolute;top:12px;inset-inline-end:12px;width:38px;height:38px;border-radius:12px;border:0;background:var(--paper-2);display:grid;place-items:center;color:var(--ink-2);z-index:2}
.modal-x .ico-svg{width:20px;height:20px}
body.modal-open{overflow:hidden}
.kid-list{display:flex;flex-direction:column;gap:8px}
.kid-row{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--paper);border-radius:var(--r-md);padding:8px 12px;text-align:start}
.kid-row b{display:block}.kid-row small{display:block;color:var(--ink-3);font-size:13px}
.kid-row.on{border-color:var(--grape);background:var(--grape-tint)}
.cele-card{overflow:hidden}
.celebrate{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-top:6px}
.celebrate>*{position:relative}
.rays{position:absolute!important;top:-60px;left:50%;width:520px;height:520px;translate:-50% 0;background:repeating-conic-gradient(var(--sun-tint) 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:spin 18s linear infinite;opacity:.9;pointer-events:none}
.cele-art{position:relative;width:170px;height:170px;display:grid;place-items:center}
.cele-art .pet-wrap{left:50%;width:100%;bottom:0}
.cele-art .egg-stage svg{width:100%}
.pop-in{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.gate{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.gate-ico{width:58px;height:58px;border-radius:18px;background:var(--grape-tint);color:var(--grape);display:grid;place-items:center}
.gate-ico .ico-svg{width:30px;height:30px}
.eq{font-size:22px;font-weight:800;color:var(--ink);white-space:nowrap}
.gate-display{min-height:56px;min-width:180px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:32px;font-weight:800;border-bottom:3px solid var(--line);padding:4px 16px;font-variant-numeric:tabular-nums}
.gate-display .ph{color:var(--ink-3)}
.gate-display .dot{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink-3)}
.gate-display .dot.on{background:var(--ink);border-color:var(--ink)}
.gate-display.shake{animation:shake .4s}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;direction:ltr}
.key{height:60px;border-radius:18px;border:1px solid var(--line);background:var(--paper-2);font-size:24px;font-weight:800;box-shadow:0 4px 0 var(--line)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.key.fn{font-size:20px}
.key.ok{background:var(--grass);color:var(--on-color);border-color:var(--grass);box-shadow:0 4px 0 var(--grass-deep);display:grid;place-items:center}
.key.ok .ico-svg{width:26px;height:26px}
.toasts{position:fixed;left:0;right:0;bottom:calc(98px + env(safe-area-inset-bottom,0px));z-index:120;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-inline:16px}
body.bare .toasts,.parent-mode .toasts{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.toast{max-width:min(520px,100%);background:var(--ink);color:var(--paper);border-radius:16px;padding:10px 16px;font-weight:700;font-size:15.5px;box-shadow:var(--shadow-2);animation:rise .3s cubic-bezier(.3,1.4,.5,1);text-align:center}
.toast.gold{background:var(--sun);color:#1D2748}
.toast.out{opacity:0;transform:translateY(8px);transition:all .3s}
.tip{position:fixed;z-index:130;background:var(--ink);color:var(--paper);border-radius:10px;padding:5px 10px;font-size:13px;font-weight:700;pointer-events:none;max-width:260px;box-shadow:var(--shadow-1)}
.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:140}
.flyer{position:fixed;z-index:150;font-family:var(--emoji);font-size:30px;pointer-events:none;line-height:1}
.flyer.small{font-size:22px}
.float-text{position:fixed;z-index:150;transform:translateX(-50%);font-weight:800;font-size:20px;color:var(--orange);pointer-events:none;animation:float-up 1.2s ease-out forwards}
.bump{animation:bump .35s cubic-bezier(.3,1.8,.5,1)}

/* ---- motion ---- */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4%)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes wobble{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
@keyframes shake-egg{0%,100%{transform:rotate(0) translateX(0)}25%{transform:rotate(-9deg) translateX(-3px)}75%{transform:rotate(9deg) translateX(3px)}}
@keyframes jump{0%{transform:translateY(0) scale(1,1)}25%{transform:translateY(0) scale(1.12,.86)}55%{transform:translateY(-26%) scale(.94,1.08)}80%{transform:translateY(0) scale(1.08,.92)}100%{transform:translateY(0) scale(1,1)}}
@keyframes run{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10%) rotate(4deg)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes stamp{0%{transform:scale(2.4) rotate(-30deg);opacity:0}60%{transform:scale(.9) rotate(-8deg);opacity:1}100%{transform:scale(1) rotate(-12deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes floaty{0%,100%{translate:0 0}50%{translate:0 -8px}}
@keyframes pulse-glow{0%,100%{opacity:.6;transform:scale(.95)}50%{opacity:1;transform:scale(1.05)}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(24px) scale(.96);opacity:0}}
@keyframes bump{0%{transform:scale(1)}50%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes float-up{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-60px)}}
@keyframes fly-start{to{transform:translateX(70vw) rotate(20deg);opacity:0}}
@keyframes fly-end{to{transform:translateX(-70vw) rotate(-20deg);opacity:0}}
@keyframes write{0%,100%{transform:rotate(-10deg) translate(0,0)}50%{transform:rotate(8deg) translate(-6px,-4px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}.breath-shape,.sq-dot{transition-duration:var(--dur)!important}}

/* ---- responsive ---- */
@media (min-width:700px){
  .scene{aspect-ratio:21/9}

}

}
@media (max-width:420px){

}

  burst(el, glyphs = ['⭐', '✨', '💛'], n = 10) {

    setTimeout(() => s.remove(), 1300);

};

});

/* ---- parent gate: PIN, or a multiplication question when no PIN is set ---- */
const Gate = {
  entry: '', answer: '', pin: false, q: '', onPass: null,
  open(onPass) {
    if (Date.now() < App.parentUntil) { onPass(); return; }
    this.onPass = onPass; this.entry = ''; this.pin = !!S.settings.pin;
    if (this.pin) this.answer = String(S.settings.pin);
    else { const a = rnd(12, 19); const b = rnd(3, 9); this.q = `${ar(a)} × ${ar(b)}`; this.answer = String(a * b); }
    Modal.open(this.html(), { cls: 'gate-card', label: 'دخول الوالدين' });
  },
  html() {
    return `<div class="gate"><span class="gate-ico">${ICON.lock}</span><h2 class="h2">للوالدين فقط</h2>
      <p class="muted">${this.pin ? 'أدخل الرمز السري المكوّن من ٤ أرقام' : `اكتب ناتج <b class="eq" dir="ltr">${this.q}</b> للدخول`}</p>

      <div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => `<button class="key" data-act="gate-key" data-k="${n}">${ar(n)}</button>`).join('')}<button class="key fn" data-act="gate-key" data-k="del" aria-label="حذف">⌫</button><button class="key" data-act="gate-key" data-k="0">${ar(0)}</button><button class="key ok" data-act="gate-key" data-k="ok" aria-label="تأكيد">${ICON.check}</button></div>
      ${this.pin ? '' : '<p class="fine">اضبط رمزًا سريًا من الإعدادات لحماية أفضل.</p>'}</div>`;
  },
  disp() { return this.pin ? [0, 1, 2, 3].map((i) => `<span class="dot ${i < this.entry.length ? 'on' : ''}"></span>`).join('') : (this.entry ? ar(this.entry) : '<span class="ph">؟</span>'); },
  key(k) {
    if (k === 'del') this.entry = this.entry.slice(0, -1);

};

const Celebrate = {
  q: [], showing: false,
  push(kid, item, front = false) {
    if (!App.booting && App.isKidMode() && App.kid() === kid) { if (front) this.q.unshift(item); else this.q.push(item); setTimeout(() => this.next(), 500); }
    else { if (front) kid.unseen.unshift(item); else kid.unseen.push(item); if (kid.unseen.length > 12) kid.unseen.length = 12; }
  },
  flushUnseen(kid) { if (!kid || !kid.unseen.length) return; this.q.push(...kid.unseen); kid.unseen = []; save(kid); setTimeout(() => this.next(), 650); },
  next() {
    if (this.showing || !this.q.length) return;
    if (!App.isKidMode()) { const k = App.kid(); if (k) { k.unseen.push(...this.q); this.q = []; save(k); } return; }
    if (Modal.isOpen()) { setTimeout(() => this.next(), 900); return; }

/* Demo child with two weeks of believable history, clearly labelled as an example. */
function makeDemoKid() {
  const kid = createKid({ name: 'سارة', gender: 'f', age: '6-8', color: 'pink', petName: 'توتة' });
  kid.demo = true; kid.createdAt = addDays(new Date(), -16).getTime(); kid.pet.hatched = true;
  kid.targets = ['shout', 'sibling'];
  const saved = Celebrate.push; Celebrate.push = () => {};
  for (let i = 16; i >= 1; i--) {
    const k = dkey(addDays(new Date(), -i)); const list = tasksFor(kid, k); const rate = 0.42 + (16 - i) * 0.035;
    const day = getDay(kid, k);
    day.s = 0;
    list.forEach((t) => { if (Math.random() < rate) { day.d.push(t.id); day.s += t.stars; kid.stars += t.stars; kid.lifetime += t.stars; kid.stats.tasks++; kid.stats.cat[t.cat] = (kid.stats.cat[t.cat] || 0) + 1; } });
    evalDay(kid, k);
    if (day.d.length === list.length && list.length) { day.pf = 1; kid.stats.perfect++; kid.stars += 2; kid.lifetime += 2; day.s += 2; }
  }
  /* incidents trend down over the two weeks so the reports show what improvement looks like */
  [16, 16, 15, 14, 14, 12, 10, 9, 4].forEach((d, j) => { const t = addDays(new Date(), -d); t.setHours(17 + (j % 3), 10 * j, 0, 0); kid.incidents.push({ id: uid(), b: kid.targets[j % 2], ts: t.getTime(), r: t.getTime() + 3600000, ded: 0, note: '' }); });
  ['happy', 'calm', 'tired', 'happy', 'angry', 'excited', 'happy', 'sad', 'calm', 'happy'].forEach((e, j) => { const t = addDays(new Date(), -(1 + j * 1.4)); t.setHours(19, 0, 0, 0); kid.moods.push({ e, ts: t.getTime() }); });
  kid.incidents.sort((a, b) => b.ts - a.ts); kid.moods.sort((a, b) => b.ts - a.ts);
  const t0 = tasksFor(kid, today()); const day = getDay(kid);
  day.s = 0;
  t0.slice(0, 2).forEach((t) => { day.d.push(t.id); day.s += t.stars; kid.stars += t.stars; kid.lifetime += t.stars; kid.stats.tasks++; kid.stats.cat[t.cat] = (kid.stats.cat[t.cat] || 0) + 1; });
  evalDay(kid);
  const park = kid.rewards.find((r) => r.k === 'park');
  if (park && kid.stars >= park.cost) { kid.stars -= park.cost; kid.redeemed.push({ id: uid(), rid: park.id, icon: park.icon, title: park.title, cost: park.cost, ts: addDays(new Date(), -3).getTime(), done: 1 }); }
  kid.goal = (kid.rewards.find((r) => r.k === 'movie') || {}).id || null;
  kid.gems = 46; kid.pet.owned.push('hat:bow', 'bg:beach'); kid.pet.acc.hat = 'hat:bow'; kid.pet.acc.bg = 'bg:beach';
  kid.stats.choice = 9; kid.stats.emo = 6; kid.stats.calm = 3; kid.stats.feel = kid.moods.length; kid.stats.stories = ['share', 'honesty']; kid.stats.spins = 4; kid.stats.memory = 1;

/* ============ HOME & DAILY MISSIONS ============ */
function dayStats(kid, k = today()) {
  const list = tasksFor(kid, k); const d = kid.days[k] || { d: [], p: [] };
  const ids = new Set(list.map((t) => t.id));
  const done = d.d.filter((id) => ids.has(id)).length; const pending = d.p.filter((id) => ids.has(id)).length;
  const goal = list.length ? Math.max(1, Math.ceil(list.length * 0.6)) : 0;
  return { list, day: d, done, pending, total: list.length, goal, met: goal > 0 && done >= goal };
}
const canSpin = (kid) => dayStats(kid).met && !(kid.spin && kid.spin.k === today());
function ring(pct, big, small, color = 'grass') {
  const r = 42; const c = 2 * Math.PI * r;
  return `<div class="ring" style="--c:var(--${color})"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="${r}" class="ring-bg"/><circle cx="50" cy="50" r="${r}" class="ring-fg" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c * (1 - clamp(pct, 0, 1))).toFixed(1)}"/></svg><div class="ring-txt"><b>${big}</b><small>${small}</small></div></div>`;
}
function petMood(kid, st) {
  if (openIncident(kid)) return 'sad';
  const h = new Date().getHours();
  if (st.total && st.done >= st.total) return 'excited';
  if (h >= 21 || h < 6) return 'sleepy';
  return 'happy';
}
function petLine(kid, st) {
  if (!kid.pet.hatched) return gx('أنا داخل البيضة! {أنجز|أنجزي} أول مهمة لأخرج وأقابلك 🥚');
  if (openIncident(kid)) return gx('أشعر ببعض الحزن… هل {تساعدني|تساعدينني} لأعود سعيدًا؟ 🌧️');
  if (canSpin(kid)) return gx('{حققت|حققتِ} هدف اليوم! عجلة الحظ تنتظرك 🎡');
  if (st.total && st.done >= st.total) return gx('{أنجزت|أنجزتِ} كل شيء اليوم! {أنت مذهل|أنتِ مذهلة} 🏆');
  const h = new Date().getHours();
  if (h >= 20 && st.total) return gx('اقترب وقت النوم… هل {نظفت|نظفتِ} أسنانك؟ 🌙');
  if (st.goal > st.done) return `باقي ${tTasks(st.goal - st.done)} لتحقيق هدف اليوم!`;
  if (h < 11) return 'صباح النور! يوم جديد مليء بالنجوم ☀️';
  return gx(pick(PET_IDLE));
}

function wheelSVG() {
  const cols = ['sun', 'ocean', 'berry', 'grass', 'grape', 'orange', 'mint', 'berry'];
  const pt = (a, r) => [100 + r * Math.sin((a * Math.PI) / 180), 100 - r * Math.cos((a * Math.PI) / 180)];
  return WHEEL.map((w, i) => {
    const a0 = i * 45 - 22.5; const a1 = i * 45 + 22.5; const [x0, y0] = pt(a0, 96); const [x1, y1] = pt(a1, 96);
    return `<path d="M100 100 L${x0.toFixed(2)} ${y0.toFixed(2)} A96 96 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z" style="fill:var(--${cols[i]})" stroke="var(--paper)" stroke-width="2"/><g transform="rotate(${i * 45} 100 100)"><text x="100" y="36" text-anchor="middle" font-size="17">${w.icon}</text><text x="100" y="53" text-anchor="middle" class="wheel-lbl" style="fill:${cols[i] === 'sun' ? '#1D2748' : '#FFFFFF'}">${w.label}</text></g>`;
  }).join('') + '<circle cx="100" cy="100" r="96" fill="none" stroke="var(--paper)" stroke-width="4"/>';
}

ACT['spin-go'] = (el) => {
  const kid = App.kid(); if (!canSpin(kid)) return;
  el.disabled = true; const i = rnd(0, WHEEL.length - 1);
  kid.spin = { k: today(), i }; save(kid);
  Modal.dismissible = false; const mx = $('.modal-x'); if (mx) mx.remove(); const mb = $('.modal-back'); if (mb) mb.removeAttribute('data-act');
  const wheel = $('#wheel'); const R = 360 * 6 - i * 45 + rnd(-14, 14);
  let last = 0; let ticks = 0;
  const watch = () => {
    const w = $('#wheel'); if (!w) return;
    const m = getComputedStyle(w).transform; let ang = 0;
    if (m && m !== 'none') { const v = m.match(/matrix\(([^)]+)\)/); if (v) { const [a, b] = v[1].split(',').map(parseFloat); ang = (Math.atan2(b, a) * 180) / Math.PI; } }
    const seg = Math.floor(((ang + 360 + 22.5) % 360) / 45);
    if (seg !== last) { last = seg; ticks++; Sound.play('tick'); }
    if (ticks < 80) requestAnimationFrame(watch);
  };
  if (!reduceMotion()) requestAnimationFrame(watch);
  Sound.play('whoosh');
  requestAnimationFrame(() => { wheel.style.transform = `rotate(${R}deg)`; });
  setTimeout(() => {
    ticks = 999;
    const w = WHEEL[i]; kid.stats.spins++;
    if (w.stars) giveStars(kid, w.stars, 'عجلة الحظ', 'spin');
    if (w.gems) giveGems(kid, w.gems, 'عجلة الحظ', 'spin');
    checkBadges(kid); save(kid);
    const res = $('#spin-result');
    if (res) res.innerHTML = `<span class="sticker">${w.icon}</span><b>${gx('{ربحت|ربحتِ}')}: ${w.label}${w.stars && w.gems ? '' : ''}</b>${w.action ? `<p>${gx(w.action)} (+${ar(w.gems)} 💎)</p>` : ''}<button class="btn" data-act="spin-close">رائع!</button>`;
    Sound.play('fanfare'); FX.confetti({ n: 120 }); App.renderTop();
  }, reduceMotion() ? 600 : 4900);
};

const Caps = {
  cache: {},
  get(name) {

  },
};

/* Certificate drawn on a canvas so it can be shown and saved as an image. */
async function drawCertificate(kid) {
  const W = 1400; const H = 990; const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const c = cv.getContext('2d');
  try { await Promise.all([document.fonts.load('90px "Lalezar"'), document.fonts.load('700 40px "Baloo Bhaijaan 2"'), document.fonts.load('500 34px "Baloo Bhaijaan 2"')]); } catch (e) { /* fallback fonts */ }
  const g = c.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#FFF6DA'); g.addColorStop(1, '#FFE3EC'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.strokeStyle = '#EE5D12'; c.lineWidth = 14; c.strokeRect(36, 36, W - 72, H - 72);
  c.strokeStyle = '#6C4CF1'; c.lineWidth = 4; c.strokeRect(62, 62, W - 124, H - 124);
  const starAt = (x, y, R, col) => { c.fillStyle = col; drawStar(c, x, y, R, R * 0.45); c.fill(); };
  [[110, 110], [W - 110, 110], [110, H - 110], [W - 110, H - 110]].forEach(([x, y]) => starAt(x, y, 34, '#FFC22E'));
  for (let i = 0; i < 26; i++) starAt(rnd(140, W - 140), rnd(120, 230), rnd(5, 11), ['#FFC22E', '#1F78E0', '#E23C78', '#16934D'][i % 4]);
  c.direction = 'rtl'; c.textAlign = 'center'; c.fillStyle = '#1D2748';
  const disp = '"Lalezar","Baloo Bhaijaan 2",Tahoma,sans-serif'; const body = '"Baloo Bhaijaan 2",Tahoma,sans-serif';
  c.font = `96px ${disp}`; c.fillStyle = '#EE5D12'; c.fillText('شهادة تقدير', W / 2, 250);
  c.font = `500 38px ${body}`; c.fillStyle = '#4B5677'; c.fillText(gx('تُمنح هذه الشهادة {للبطل|للبطلة}', kid), W / 2, 330);
  c.font = `120px ${disp}`; c.fillStyle = '#6C4CF1'; c.fillText(kid.name, W / 2, 470);
  const nb = Object.keys(kid.badges).length;
  const line1 = gx('{لإنجازه|لإنجازها}', kid) + ` ${tTasks(kid.stats.tasks)} و{جمعه|جمعها} ${tStars(kid.lifetime)}`;
  c.font = `700 40px ${body}`; c.fillStyle = '#1D2748'; c.fillText(gx(line1, kid), W / 2, 560);
  c.font = `500 34px ${body}`; c.fillStyle = '#4B5677'; c.fillText(`${gx('{وحصوله|وحصولها}', kid)} على ${tBadges(nb)} والوصول إلى المستوى ${ar(levelOf(kid.lifetime))}`, W / 2, 615);
  c.fillText('نحن فخورون بك جدًا!', W / 2, 665);
  try {
    const svg = petSVG(kid, { mood: 'excited' }).replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" ');
    const img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    await new Promise((r) => { img.onload = r; img.onerror = r; });
    c.drawImage(img, W / 2 - 110, 690, 220, 220);
  } catch (e) { /* skip pet */ }
  c.font = `500 30px ${body}`; c.fillStyle = '#4B5677';
  c.fillText(fmtDate(new Date()), 300, 860); c.fillText('توقيع الوالدين: ____________', W - 330, 860);
  return cv;
}

const Breath = {
  tm: [], done: false,
  stop() { this.tm.forEach(clearTimeout); this.tm = []; },
  run(modeKey, repairFlag) {
    this.stop(); this.done = false;
    const mode = BREATH[modeKey] || BREATH.balloon; const shape = $('#br-shape'); const label = $('#br-label'); const dots = $$('#br-dots span'); const sq = $('#sq-dot');
    let t = 1500; let cycle = 0;
    const at = (fn, ms) => this.tm.push(setTimeout(fn, ms));
    for (cycle = 0; cycle < mode.cycles; cycle++) {
      mode.phases.forEach(([ph, txt, ms], pi) => {
        at(() => {
          if (!$('#br-shape')) return;
          shape.style.setProperty('--dur', ms + 'ms'); label.textContent = gx(txt);
          if (ph === 'in') shape.className = 'breath-shape grow'; else if (ph === 'out') shape.className = 'breath-shape shrink';
          if (sq) { sq.style.setProperty('--dur', ms + 'ms'); sq.className = 'sq-dot p' + pi; }
          if (ph === 'in') Sound.play('in'); if (ph === 'out') Sound.play('out');
        }, t);
        t += ms;
      });
      const c = cycle; at(() => { if (dots[c]) dots[c].classList.add('on'); }, t - 200);
    }
    at(() => this.finish(repairFlag), t + 300);
  },
  finish(repairFlag) {
    const kid = App.kid(); if (!kid || !$('#br-shape')) return;
    kid.stats.calm++;
    const k = today(); if (!kid.calmDay || kid.calmDay.k !== k) kid.calmDay = { k, n: 0 };
    let gems = 0; if (kid.calmDay.n < 3) { kid.calmDay.n++; gems = 2; giveGems(kid, 2, 'تمرين تنفس', 'gem'); }
    const repaired = (repairFlag || openIncident(kid)) ? repair(kid, 'تمرين تنفس') : false;
    checkBadges(kid); save(kid); App.renderTop();
    const box = $('#breath-end'); if (box) { box.hidden = false; box.innerHTML = `<span class="sticker">😌</span><b>${gx('{أحسنت|أحسنتِ}! جسمك الآن أهدأ')}</b>${gems ? `<small>+${ar(gems)} 💎</small>` : ''}${repaired ? `<small>☀️ ${esc(kid.pet.name)} عاد سعيدًا!</small>` : ''}<div class="row center"><button class="btn mint" data-act="nav" data-v="breath" data-p='${JSON.stringify({ mode: App.params.mode || 'balloon' })}'>مرة أخرى</button><button class="btn ghost" data-act="nav" data-v="calm">رجوع</button></div>`; }
    $('#br-label').textContent = '';
    Sound.play('success'); if (repaired) FX.confetti({ n: 100 });
  },
};

const PlayClock = {
  iv: null, ticks: 0, over: false,
  start() {
    this.stop(); this.ticks = 0; this.over = playLeft(App.kid()) <= 0;
    this.iv = setInterval(() => {
      const kid = App.kid(); if (!kid || document.visibilityState !== 'visible') return;
      const k = today(); kid.play[k] = (kid.play[k] || 0) + 1; this.ticks++;
      if (this.ticks % 20 === 0) save(kid);

  },
  stop() { if (this.iv) { clearInterval(this.iv); this.iv = null; const kid = App.kid(); if (kid && this.ticks) save(kid); } },
};
