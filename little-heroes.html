const progDots = (n, i, res) => `<div class="q-dots" aria-hidden="true">${Array.from({ length: n }, (_, j) => `<span class="${j < i ? (res[j] ? 'ok' : 'no') : j === i ? 'cur' : ''}"></span>`).join('')}</div>`;

const GAME_IMPL = {};

/* 1) Right choice */
GAME_IMPL.choice = {
  start(root) { this.root = root; this.qs = shuffle(SCENARIOS).slice(0, 6); this.i = 0; this.score = 0; this.res = []; this.lock = false; this.show(); },
  show() {
    const q = this.qs[this.i]; const order = shuffle(q.a.map((_, j) => j)); const text = gx(q.q);
    this.root.innerHTML = `<div class="q-card card">${progDots(this.qs.length, this.i, this.res)}<span class="q-emoji" aria-hidden="true">${q.e}</span>
      <p class="q-text">${esc(text)} <button class="mini-btn tts-only" data-act="speak" data-say="${esc(text)}" aria-label="اقرأ السؤال">${ICON.speak}</button></p>
      <div class="opts">${order.map((j) => `<button class="opt" data-act="g" data-a="pick" data-j="${j}">${esc(gx(q.a[j].t))}</button>`).join('')}</div><div class="feedback" id="fb" aria-live="polite"></div></div>`;
    this.lock = false;
  },
  act(a, el) {
    if (a === 'pick' && !this.lock) {
      this.lock = true; const q = this.qs[this.i]; const o = q.a[+el.dataset.j];
      $$('.opt', this.root).forEach((b) => { b.disabled = true; if (q.a[+b.dataset.j].ok) b.classList.add('right'); });
      if (o.ok) { this.score++; Sound.play('right'); FX.burst(el, ['⭐', '✨'], 8); } else { el.classList.add('wrong'); Sound.play('wrong'); }
      this.res.push(!!o.ok);
      $('#fb').innerHTML = `<p class="${o.ok ? 'ok' : 'no'}"><b>${o.ok ? esc(gx(pick(PRAISE))) : 'لنفكّر معًا 🤔'}</b> ${esc(gx(o.f))}</p><button class="btn" data-act="g" data-a="next">${this.i < this.qs.length - 1 ? 'التالي' : 'النتيجة'}</button>`;
    } else if (a === 'next') {
      this.i++; if (this.i < this.qs.length) { this.show(); return; }
      const kid = App.kid(); kid.stats.choice += this.score;
      const r = finishGame(this.score, 'لعبة الاختيار الصحيح');
      this.root.innerHTML = overHTML({ art: this.score >= 5 ? '🏆' : this.score >= 3 ? '🌟' : '💪', title: this.score >= 5 ? gx('{أنت حكيم|أنتِ حكيمة} جدًا!') : this.score >= 3 ? 'عمل جميل!' : 'نتعلّم مع كل محاولة!', lines: [`${ar(this.score)} من ${ar(this.qs.length)} اختيارات صحيحة`], ...r });
      Sound.play(this.score >= 4 ? 'fanfare' : 'success'); if (this.score >= 4) FX.confetti();
    }
  },
};

/* 2) Emotions */
GAME_IMPL.emotions = {
  start(root) {
    this.root = root; this.i = 0; this.score = 0; this.res = [];
    const scenes = shuffle(EMO_SCENES).slice(0, 4).map((s) => ({ type: 'scene', ans: s.a, text: s.t }));
    const faces = shuffle(EMOTIONS).slice(0, 4).map((e) => ({ type: 'face', ans: e.id }));
    this.qs = shuffle([...scenes, ...faces]); this.show();
  },
  options(ans) { const bad = new Set([ans, ...(EMO_CONFUSE[ans] || [])]); return shuffle([ans, ...shuffle(EMOTIONS.filter((e) => !bad.has(e.id))).slice(0, 3).map((e) => e.id)]); },
  show() {
    const q = this.qs[this.i]; const opts = this.options(q.ans); this.lock = false;
    const head = q.type === 'face' ? `<span class="q-face" aria-hidden="true">${EMO[q.ans].e}</span><p class="q-text">ما اسم هذا الشعور؟</p>` : `<span class="q-emoji" aria-hidden="true">💭</span><p class="q-text">${esc(q.text)} <button class="mini-btn tts-only" data-act="speak" data-say="${esc(q.text)}" aria-label="اقرأ">${ICON.speak}</button></p><p class="muted center">ما الشعور المناسب لهذا الموقف؟</p>`;
    this.root.innerHTML = `<div class="q-card card">${progDots(this.qs.length, this.i, this.res)}${head}<div class="opts emo-opts">${opts.map((id) => `<button class="opt emo-opt" data-act="g" data-a="pick" data-id="${id}" style="--c:var(--${EMO[id].c})">${q.type === 'scene' ? `<span aria-hidden="true">${EMO[id].e}</span>` : ''}${EMO[id].n}</button>`).join('')}</div><div class="feedback" id="fb" aria-live="polite"></div></div>`;
  },
  act(a, el) {
    if (a === 'pick' && !this.lock) {
      this.lock = true; const q = this.qs[this.i]; const ok = el.dataset.id === q.ans; const e = EMO[q.ans];
      $$('.opt', this.root).forEach((b) => { b.disabled = true; if (b.dataset.id === q.ans) b.classList.add('right'); });
      if (ok) { this.score++; Sound.play('right'); FX.burst(el, ['💛', '✨'], 8); } else { el.classList.add('wrong'); Sound.play('wrong'); }
      this.res.push(ok);
      $('#fb').innerHTML = `<p class="${ok ? 'ok' : 'no'}"><b>${ok ? 'صحيح!' : `هذا شعور ${e.n} ${e.e}`}</b> ${esc(gx(e.tip))}</p><button class="btn" data-act="g" data-a="next">${this.i < this.qs.length - 1 ? 'التالي' : 'النتيجة'}</button>`;
    } else if (a === 'next') {
      this.i++; if (this.i < this.qs.length) { this.show(); return; }
      const kid = App.kid(); kid.stats.emo += this.score;
      const r = finishGame(this.score, 'لعبة المشاعر');
      this.root.innerHTML = overHTML({ art: '🎭', title: this.score >= 6 ? gx('{خبير|خبيرة} مشاعر!') : 'أحسنت المحاولة!', lines: [`${ar(this.score)} من ${ar(this.qs.length)} إجابات صحيحة`, 'فهم المشاعر يساعدنا على التعامل معها بهدوء 💛'], ...r });
      Sound.play('fanfare'); if (this.score >= 6) FX.confetti();
    }
  },
};

/* 3) Habit sort (timed) */
GAME_IMPL.sort = {
  start(root) {
    this.root = root; this.score = 0; this.combo = 0; this.time = 40; this.item = null; this.prev = '';
    root.innerHTML = `<div class="sort-wrap card"><div class="sort-hud"><span>النقاط: <b id="s-score">٠</b></span><span id="s-combo" class="combo"></span><span>⏱️ <b id="s-time">${ar(this.time)}</b></span></div>
      <div class="bar thin"><i id="s-bar" style="width:100%"></i></div>
      <div class="sort-stage"><div class="sort-card" id="s-card"><span class="sc-e">🗂️</span><b>${gx('{هل أنت جاهز|هل أنتِ جاهزة}؟')}</b><small>عادة جيدة أم سيئة؟</small></div></div>
      <div class="sort-btns"><button class="sort-btn good" data-act="g" data-a="ans" data-v="good" disabled>👍 عادة جيدة</button><button class="sort-btn bad" data-act="g" data-a="ans" data-v="bad" disabled>👎 عادة سيئة</button></div>
      <div class="center" id="s-start"><button class="btn big" data-act="g" data-a="go">ابدأ!</button><p class="fine">على الحاسوب: السهم الأيمن = جيدة، السهم الأيسر = سيئة</p></div></div>`;
  },
  nextItem() {
    let it; do { const good = Math.random() < 0.5; const p = pick(good ? HABITS_GOOD : HABITS_BAD); it = { e: p[0], t: p[1], good }; } while (it.t === this.prev);
    this.prev = it.t; this.item = it;
    const c = $('#s-card'); if (!c) return;
    c.className = 'sort-card enter'; c.innerHTML = `<span class="sc-e" aria-hidden="true">${it.e}</span><b>${it.t}</b>`;
  },
  act(a, el) {
    if (a === 'go') {
      $('#s-start').remove(); $$('.sort-btn', this.root).forEach((b) => { b.disabled = false; }); this.running = true; this.nextItem(); Sound.play('go');
      const t0 = Date.now();
      this.iv = Timers.every(() => {
        const left = Math.max(0, 40 - (Date.now() - t0) / 1000); const tEl = $('#s-time'); if (!tEl) return;
        tEl.textContent = ar(Math.ceil(left)); $('#s-bar').style.width = (left / 40) * 100 + '%';
        if (left <= 0) this.end();
      }, 200);
    } else if (a === 'ans' && this.running && this.item) {
      const ok = (el.dataset.v === 'good') === this.item.good; const c = $('#s-card');
      if (ok) { this.combo++; this.score += 1 + (this.combo % 5 === 0 ? 2 : 0); Sound.play(this.combo % 5 === 0 ? 'gem' : 'right'); c.className = 'sort-card fly-' + el.dataset.v; }
      else { this.combo = 0; Sound.play('wrong'); c.className = 'sort-card shake'; toast(`«${this.item.t}» ${this.item.good ? 'عادة جيدة 👍' : 'عادة سيئة 👎'}`); }
      $('#s-score').textContent = ar(this.score); $('#s-combo').textContent = this.combo >= 3 ? `🔥 ×${ar(this.combo)}` : '';
      this.item = null; setTimeout(() => { if (this.running) this.nextItem(); }, ok ? 260 : 650);
    }
  },
  key(ev) { if (!this.running) return; if (ev.key === 'ArrowRight') { ev.preventDefault(); this.act('ans', { dataset: { v: 'good' } }); } if (ev.key === 'ArrowLeft') { ev.preventDefault(); this.act('ans', { dataset: { v: 'bad' } }); } },
  end() {
    if (!this.running) return; this.running = false; Timers.clear(this.iv);
    const kid = App.kid(); const best = this.score > kid.stats.sortBest; if (best) kid.stats.sortBest = this.score;
    const r = finishGame(Math.floor(this.score / 3), 'سلة العادات');
    this.root.innerHTML = overHTML({ art: '🗂️', title: best ? 'رقم قياسي جديد!' : 'انتهى الوقت!', lines: [`${gx('{جمعت|جمعتِ}')} ${ar(this.score)} نقطة`], ...r });

const niceMax = (v) => { if (v <= 2) return 2; const mag = Math.pow(10, Math.floor(Math.log10(v))); for (const s of [1, 2, 4, 6, 8, 10]) if (s * mag >= v && (s * mag) % 2 === 0) return s * mag; return 10 * mag; };

/* Column chart in SVG: oldest on the right (reading start in RTL), today on the left. */
function colChart(el, data, { color = 'grape', unit = '' } = {}) {
  if (!el) return;
  const W = Math.max(260, Math.round(el.clientWidth)); const H = 200; const padT = 22; const padB = 30; const padR = 34; const padL = 8;
  const vals = data.map((d) => d.v); const max = niceMax(Math.max(1, ...vals));
  const plotW = W - padL - padR; const plotH = H - padT - padB; const base = padT + plotH; const n = data.length; const band = plotW / n; const bw = Math.min(24, band * 0.62);
  const y = (v) => base - (v / max) * plotH;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" direction="ltr" role="img" aria-label="${esc(el.dataset.label || '')}">`;
  [0, max / 2, max].forEach((t) => { s += `<line x1="${padL}" x2="${W - padR}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" class="grid"/><text x="${W - padR + 6}" y="${(y(t) + 4).toFixed(1)}" class="tick">${ar(t)}</text>`; });
  const maxV = Math.max(...vals); let maxShown = false;
  const every = n > 10 ? 2 : 1;
  data.forEach((d, i) => {
    const cx = W - padR - (i + 0.5) * band; const x0 = cx - bw / 2; const x1 = cx + bw / 2; const h = (d.v / max) * plotH; const top = base - h; const r = Math.min(4, h);
    if (d.v > 0) s += `<path d="M${x0.toFixed(1)} ${base} L${x0.toFixed(1)} ${(top + r).toFixed(1)} Q${x0.toFixed(1)} ${top.toFixed(1)} ${(x0 + r).toFixed(1)} ${top.toFixed(1)} L${(x1 - r).toFixed(1)} ${top.toFixed(1)} Q${x1.toFixed(1)} ${top.toFixed(1)} ${x1.toFixed(1)} ${(top + r).toFixed(1)} L${x1.toFixed(1)} ${base} Z" style="fill:var(--${color})" class="bar ${i === n - 1 ? 'last' : ''}"/>`;
    const showVal = d.v > 0 && ((d.v === maxV && !maxShown) || i === n - 1);
    if (d.v === maxV && d.v > 0) maxShown = true;
    if (showVal) s += `<text x="${cx.toFixed(1)}" y="${(top - 6).toFixed(1)}" class="val" text-anchor="middle">${ar(d.v)}</text>`;
    if ((n - 1 - i) % every === 0) s += `<text x="${cx.toFixed(1)}" y="${base + 18}" class="xl" text-anchor="middle">${esc(d.label)}</text>`;
    s += `<rect x="${(cx - band / 2).toFixed(1)}" y="${padT}" width="${band.toFixed(1)}" height="${plotH + padB}" fill="transparent" data-tip="${esc(d.tip || `${d.label}: ${ar(d.v)} ${unit}`)}" tabindex="0" class="hit"/>`;
  });
  s += `<line x1="${padL}" x2="${W - padR}" y1="${base}" y2="${base}" class="axis"/></svg>`;
  el.innerHTML = s;
}

}

function reportData(kid) {
  const created = dkey(new Date(kid.createdAt || Date.now()));
  const days14 = Array.from({ length: 14 }, (_, i) => dkey(addDays(new Date(), -(13 - i))));
  const stars = days14.map((k) => { const d = parseKey(k); return { k, v: (kid.days[k] && kid.days[k].s) || 0, label: ar(d.getDate()), tip: `${WEEKDAYS[d.getDay()]} ${fmtShort(d)}: ${tStars((kid.days[k] && kid.days[k].s) || 0)}` }; });
  let sched = 0; let done = 0;
  const taskRates = kid.tasks.map((t) => ({ t, s: 0, d: 0 }));
  days14.forEach((k) => {
    if (k < created) return; const wd = parseKey(k).getDay(); const rec = kid.days[k];
    taskRates.forEach((r) => { if (!r.t.days || r.t.days.includes(wd)) { r.s++; sched++; if (rec && rec.d.includes(r.t.id)) { r.d++; done++; } } });
  });
  const weeks = Array.from({ length: 8 }, (_, i) => { const w = 7 - i; const from = addDays(new Date(), -(w * 7 + 6)); return { v: incCount(kid, w * 7 + 6, w * 7), label: w === 0 ? 'هذا' : `−${ar(w)}`, tip: w === 0 ? `هذا الأسبوع: ${tTimes(incCount(kid, 6, 0))}` : `أسبوع ${fmtShort(from)}: ${tTimes(incCount(kid, w * 7 + 6, w * 7))}` }; });
  const cat = {}; const taskCat = new Map(kid.tasks.map((t) => [t.id, t.cat]));
  for (let i = 0; i < 30; i++) { const rec = kid.days[dkey(addDays(new Date(), -i))]; if (rec) rec.d.forEach((id) => { const c = taskCat.get(id); if (c) cat[c] = (cat[c] || 0) + 1; }); }

/* ---- AI advisor ---- */
const Advisor = { q: '', ctl: null, openId: null };
function advisorPrompt(kid, q) {

الطفل: ${kid.gender === 'f' ? 'بنت' : 'ولد'}، العمر ${AGES[kid.age] || ''}.
وصف الوالدين للسلوك:
"""${q}"""
اكتب بالعربية الفصحى البسيطة، وكل بند جملة واحدة واضحة وعملية، وخاطب الوالدين مباشرة.
أعد JSON فقط بهذا الشكل:
{"summary":"جملتان تلخصان فهمك للسلوك وما قد يكون وراءه","reasons":["سبب محتمل","سبب محتمل","سبب محتمل"],"replacements":[{"title":"سلوك بديل قصير يصلح مهمة يومية، أقل من ٦ كلمات","icon":"إيموجي واحد","stars":2}],"inTheMoment":["ماذا تفعل لحظة حدوث السلوك"],"prevention":["خطوة وقائية"],"avoid":["خطأ نتجنبه"],"rewards":["فكرة مكافأة مناسبة"],"seekHelp":"متى يُنصح باستشارة مختص، في جملة واحدة"}
اجعل replacements من ٢ إلى ٣ عناصر، وinTheMoment وprevention من ٣ إلى ٥، وavoid وrewards من ٢ إلى ٤.`;
}
function validatePlan(d) {

  const plan = { summary: String(d.summary || '').slice(0, 500), reasons: arr(d.reasons, 4), replacements: reps, inTheMoment: arr(d.inTheMoment, 6), prevention: arr(d.prevention, 6), avoid: arr(d.avoid, 5), rewards: arr(d.rewards, 5), seekHelp: String(d.seekHelp || '').slice(0, 300) };

}

BIND['adv-q'] = (el) => { Advisor.q = el.value; };

/* ============ BOOT ============ */
async function boot(hotData) {
  Store.init();
  S = normalizeState(Store.readLocal() || {});
  const act = Store.getActive();
  App.activeId = S.kids.find((k) => k.id === act) ? act : (S.kids[0] && S.kids[0].id) || null;
  if (hotData && hotData.view && VIEWS[hotData.view] && hotData.view !== 'parent') { App.view = hotData.view; App.params = hotData.params || {}; }
  App.booting = true;
  Speech.init();
  App.render();
  Caps.get('downloads').then((d) => { App.hasDownloads = !!d; });
  Caps.get('sample').then((s) => { App.sampleOK = !!s; if (s && !Modal.isOpen() && (App.view === 'stories' || (App.view === 'parent' && App.params.tab === 'advisor'))) App.render(); });
  let ok = false;
  try { ok = await withTimeout(Store.connect(), 11000, false); } catch (e) { ok = false; }
  if (ok) {
    let docs = null;
    try { docs = await withTimeout(Store.pull(), 10000, null); } catch (e) { docs = null; }
    if (docs) { Store.reconcile(docs); Store.subscribe(); App.cloud = 'cloud'; }
    else { Store.db = null; App.cloud = Store.localOK ? 'local' : 'memory'; }
  } else App.cloud = Store.localOK ? 'local' : 'memory';
  App.booting = false;
  if (!S.kids.find((k) => k.id === App.activeId)) App.activeId = (S.kids[0] && S.kids[0].id) || null;
  const v = VIEWS[App.view];
  if (!(v && v.live && S.kids.length) && !Modal.isOpen()) App.render(); else App.renderTop();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Store.flushNow(); });
window.addEventListener('pagehide', () => Store.writeLocalNow());
let lastDay = today();
setInterval(() => {
  if (today() === lastDay) return; lastDay = today();
  const v = VIEWS[App.view]; if (S && S.kids.length && !(v && v.live) && !Modal.isOpen()) App.render();
}, 60000);
(function start() {
  const hot = window.claude && window.claude.hot;
  try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ view: App.view, params: App.params })); } catch (e) { /* optional */ }
  try { if (hot && typeof hot.ready === 'function') { hot.ready((data) => boot(data || {})); return; } } catch (e) { /* fall through */ }
  boot((hot && hot.data) || {});
})();
