<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My English Gap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&family=Readex+Pro:wght@500;700&display=swap">
<style>
/* Layout: one-screen chat. Header, topic rail, scrolling thread, composer with a real mic.
   Tutor turns are "marked slips" (highlighter on the fix); learner turns are ink bubbles. */
:root{
  --paper:#EDF0F4; --surface:#FFFFFF; --ink:#13213A; --muted:#5A6678; --line:#D7DDE6;
  --accent:#0D5C63; --accent-ink:#FFFFFF; --accent-soft:#DCECED;
  --marker:#FFE15A; --marker-ink:#13213A;
  --strike:#B5392C; --strike-soft:#F7E4E1;
  --good:#1C7A4A; --good-soft:#DFF2E6;
  --bubble:#13213A; --bubble-ink:#F3F6FA;
  --rec:#D23A2B; --rec-ink:#FFFFFF;
  --scrim:rgba(9,14,22,.5);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-en:"Literata",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0D131B; --surface:#151D28; --ink:#E6EBF2; --muted:#93A0B3; --line:#263141;
    --accent:#4CBFB4; --accent-ink:#05201E; --accent-soft:#163130;
    --marker:rgba(255,214,64,.30); --marker-ink:#FFE891;
    --strike:#F2897B; --strike-soft:#3A201C;
    --good:#6CD39C; --good-soft:#14301F;
    --bubble:#2A3A55; --bubble-ink:#F3F6FA;
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
p{margin:0}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto}
.app > *{min-width:0}
.wrap{max-width:720px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
.top{background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px}
.brand{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.wordmark{font-family:var(--f-display);font-weight:700;font-size:1.3rem;letter-spacing:-.01em;line-height:1.2}
.wordmark mark{background:linear-gradient(transparent 16%,var(--marker) 16%,var(--marker) 90%,transparent 90%);color:var(--marker-ink);padding:0 .14em;border-radius:2px}
.tag{font-size:.8rem;color:var(--muted);line-height:1.4}
.top-actions{display:flex;gap:8px;align-items:center;flex:none}
.ghost-btn{font-size:.875rem;font-weight:500;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;display:inline-flex;gap:8px;align-items:center;cursor:pointer;flex:none;white-space:nowrap}
.ghost-btn:hover{border-color:var(--muted)}
.count{font-variant-numeric:tabular-nums;background:var(--marker);color:var(--marker-ink);border-radius:999px;padding:0 7px;font-weight:600;min-width:1.6em;text-align:center;line-height:1.5}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;cursor:pointer;flex:none}

/* Topic rail */
.rail{background:var(--surface);border-bottom:1px solid var(--line)}
.rail-row{display:flex;gap:8px;align-items:center;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.rail-row::-webkit-scrollbar{display:none}
.level{display:inline-flex;align-items:center;gap:6px;flex:none;font-size:.8rem;color:var(--muted)}
.level select{font:inherit;font-size:.875rem;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 10px}
.sep{width:1px;height:22px;background:var(--line);flex:none}
.chip{flex:none;font-size:.875rem;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* Thread */
.thread{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.thread-inner{display:flex;flex-direction:column;gap:14px;padding-block:18px 28px}
.intro{display:grid;gap:4px;font-size:.92rem;color:var(--muted);max-width:60ch}
.intro strong{font-family:var(--f-display);font-weight:500;color:var(--ink);font-size:1rem}
.setup{display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:.92rem}
.primary-btn{font-weight:600;font-size:.92rem;border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 16px;cursor:pointer}
.ex-tag,.divider{align-self:center;font-size:.75rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 12px}
.ex-tag{border-style:dashed}
.sys{align-self:center;font-size:.82rem;color:var(--muted);text-align:center;max-width:46ch}

.user{align-self:flex-end;max-width:85%;background:var(--bubble);color:var(--bubble-ink);border-radius:18px;border-end-end-radius:4px;padding:9px 14px;font-family:var(--f-en);font-size:1.02rem;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap}

.tutor{align-self:flex-start;width:100%;max-width:600px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;border-start-start-radius:4px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px}
.tutor-head{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);font-weight:500}
.avatar{width:22px;height:22px;border-radius:6px;background:var(--marker);color:var(--marker-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.75rem}

.fix{background:var(--paper);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.verdict{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;border-radius:999px;padding:2px 10px;margin-bottom:2px}
.verdict.good{background:var(--good-soft);color:var(--good)}
.verdict.wrong{background:var(--strike-soft);color:var(--strike)}
.verdict.phrase{background:var(--accent-soft);color:var(--accent)}
.lab{font-size:.74rem;color:var(--muted);font-weight:500;margin-top:2px}
.en-row{display:flex;align-items:center;gap:8px;min-width:0}
.en{flex:1;min-width:0;font-family:var(--f-en);font-size:1.04rem;line-height:1.55;overflow-wrap:anywhere}
.del{text-decoration:line-through;text-decoration-color:var(--strike);text-decoration-thickness:2px;color:var(--strike)}
.add{background:var(--marker);color:var(--marker-ink);border-radius:3px;padding:0 .16em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.notes{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:4px;font-size:.9rem;line-height:1.55}
.notes li{position:relative;padding-inline-start:14px}
.notes li::before{content:"";position:absolute;inset-inline-start:2px;top:.68em;width:5px;height:5px;border-radius:50%;background:var(--accent)}

.reaction{font-size:.98rem;line-height:1.7;color:var(--muted);white-space:pre-wrap}
.task{display:flex;align-items:flex-start;gap:8px;border-inline-start:3px solid var(--accent);padding-inline-start:12px}
.task-body{flex:1;min-width:0;display:grid;gap:4px}
.task-lab{font-size:.74rem;font-weight:600;color:var(--accent)}
.task-body p{font-family:var(--f-display);font-weight:500;font-size:1.12rem;line-height:1.7;white-space:pre-wrap}
.hint-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hint-btn{font-size:.8rem;border:1px dashed var(--line);background:transparent;border-radius:999px;padding:3px 12px;cursor:pointer;color:var(--muted)}
.hint-btn:hover{border-color:var(--accent);color:var(--accent)}
.hint-en{font-family:var(--f-en);font-style:italic;color:var(--muted);font-size:.96rem}

.say{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);display:grid;place-items:center;cursor:pointer}
.say:hover{border-color:var(--accent)}

.typing{width:auto;flex-direction:row;align-items:center;gap:10px;font-size:.82rem;color:var(--muted)}
.dots{display:inline-flex;gap:4px}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:.35;animation:blink 1.1s infinite}
.dots span:nth-child(2){animation-delay:.18s}
.dots span:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

.err{align-self:flex-start;max-width:600px;background:var(--strike-soft);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;font-size:.92rem}

/* Composer */
.composer{background:var(--surface);border-top:1px solid var(--line)}
.composer .wrap{padding-top:10px;padding-bottom:max(8px,env(safe-area-inset-bottom,0px));display:grid;gap:6px}
.mic-status{font-size:.85rem;border-radius:10px;padding:8px 12px;background:var(--accent-soft)}
.mic-status.bad{background:var(--strike-soft)}
.compose-row{display:flex;gap:8px;align-items:flex-end}
.compose-row textarea{flex:1;min-width:0;resize:none;font:inherit;font-size:16px;line-height:1.45;padding:10px 14px;border-radius:22px;border:1px solid var(--line);background:var(--paper);color:var(--ink);max-height:140px}
.compose-row textarea::placeholder{color:var(--muted)}
.send{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer}
.mic{flex:none;width:48px;height:48px;border-radius:50%;border:2px solid var(--accent);background:var(--surface);color:var(--accent);display:grid;place-items:center;cursor:pointer;position:relative}
.mic.on{background:var(--rec);border-color:var(--rec);color:var(--rec-ink)}
.mic.on::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--rec);animation:pulse 1.2s ease-out infinite}
@keyframes pulse{0%{opacity:.8;transform:scale(.9)}100%{opacity:0;transform:scale(1.25)}}
.hint{font-size:.76rem;color:var(--muted);text-align:center}

/* Sheets */
.sheet{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet-panel{background:var(--surface);color:var(--ink);width:100%;max-width:720px;max-height:88%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 8px}
.sheet-head h2{margin:0;font-family:var(--f-display);font-weight:500;font-size:1.15rem}
.sheet-summary{font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-block:0 10px}
.sheet-body{overflow-y:auto;border-top:1px solid var(--line)}
.m-list{display:flex;flex-direction:column;padding-block:6px 10px}
.m-item{display:flex;flex-direction:column;gap:4px;padding-block:12px;border-bottom:1px solid var(--line)}
.m-item:last-child{border-bottom:0}
.m-ar{font-size:.95rem;color:var(--muted)}
.empty{font-size:.92rem;color:var(--muted);padding-block:18px}
.sheet-foot{padding-block:10px 14px;border-top:1px solid var(--line);display:flex;justify-content:flex-start;gap:8px}

.form{display:flex;flex-direction:column;gap:16px;padding-block:14px 18px}
.field{display:grid;gap:6px}
.field label,.field .flab{font-size:.85rem;font-weight:600}
.field small{font-size:.8rem;color:var(--muted);line-height:1.5}
.field input[type="password"],.field input[type="text"],.field select{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.check{display:flex;align-items:center;gap:10px;font-size:.92rem}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.form-msg{font-size:.85rem;color:var(--strike)}
.link{color:var(--accent);word-break:break-all}

@media (prefers-reduced-motion: reduce){.dots span{animation:none;opacity:.7}.mic.on::after{animation:none;opacity:.5}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="wrap top-row">
      <div class="brand">
        <div class="wordmark" dir="ltr" lang="en">My English <mark>Gap</mark></div>
        <div class="tag">يسألك بالعربي · وترد بالإنجليزي</div>
      </div>
      <div class="top-actions">
        <button id="mistakesBtn" class="ghost-btn" type="button">أخطائي <span id="mistakesCount" class="count">0</span></button>
        <button id="settingsBtn" class="icon-btn" type="button" aria-label="الإعدادات"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      </div>
    </div>
  </header>

  <nav class="rail" aria-label="المستوى والمواضيع">
    <div class="wrap rail-row">
      <label class="level" for="level">المستوى
        <select id="level">
          <option value="beginner">مبتدئ</option>
          <option value="intermediate">متوسط</option>
          <option value="advanced">متقدم</option>
        </select>
      </label>
      <span class="sep" aria-hidden="true"></span>
      <div id="chips" style="display:contents"></div>
    </div>
  </nav>

  <main class="thread" id="thread">
    <div class="wrap thread-inner" id="threadInner" aria-live="polite"></div>
  </main>

  <footer class="composer">
    <div class="wrap">
      <div id="micStatus" class="mic-status" hidden></div>
      <form id="form" class="compose-row" autocomplete="off">
        <button id="mic" class="mic" type="button" aria-label="تكلّم بالإنجليزي"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg></button>
        <textarea id="msg" rows="1" dir="auto" placeholder="اضغط المايك وتكلّم، أو اكتب هنا" aria-label="ردك بالإنجليزي"></textarea>
        <button id="send" class="send" type="submit" aria-label="إرسال"></button>
      </form>
      <div class="hint">ما عرفت تقولها؟ اكتبها بالعربي ويعلمك كيف تنقال.</div>
    </div>
  </footer>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="wrap sheet-head">
      <h2 id="sheetTitle">أخطائي</h2>
      <button class="icon-btn js-close" type="button" aria-label="إغلاق"></button>
    </div>
    <div class="wrap sheet-summary" id="sheetSummary"></div>
    <div class="sheet-body"><div class="wrap m-list" id="mList"></div></div>
    <div class="wrap sheet-foot"><button id="clearBtn" class="ghost-btn" type="button">مسح السجل</button></div>
  </div>
</div>

<div id="settings" class="sheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <div class="wrap sheet-head">
      <h2 id="setTitle">الإعدادات</h2>
      <button class="icon-btn js-close" type="button" aria-label="إغلاق"></button>
    </div>
    <div class="sheet-body">
      <form id="setForm" class="wrap form" autocomplete="off">
        <div class="field">
          <label for="apiKey">مفتاح Claude API</label>
          <input id="apiKey" type="password" dir="ltr" placeholder="sk-ant-..." spellcheck="false" autocapitalize="off">
          <small>تطلعه من <span class="link" dir="ltr">console.anthropic.com</span> ← API Keys. المفتاح ينحفظ في جوالك بس، وما يروح لأي مكان غير Anthropic. الاستخدام عليه رسوم منفصلة عن اشتراك Claude.</small>
        </div>
        <div class="field">
          <label for="model">النموذج</label>
          <select id="model" dir="ltr">
            <option value="claude-haiku-5-5">Claude Haiku 5.5 (أسرع وأرخص)</option>
            <option value="claude-sonnet-5-5">Claude Sonnet 5.5 (أدق)</option>
          </select>
        </div>
        <label class="check"><input id="autoSend" type="checkbox"> أرسل تلقائيًا أول ما أخلص كلام</label>
        <p id="setMsg" class="form-msg" hidden></p>
        <div><button class="primary-btn" type="submit">حفظ</button></div>
      </form>
    </div>
  </div>
</div>

<script>

  "use strict";

  var TOPICS = [
    {id:"free",    ar:"سوالف حرة",   en:"free conversation about the learner's daily life"},

    stop:'<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>',

  var COPY = {
    no_key:"أضف مفتاح Claude API من الإعدادات عشان يبدأ المدرّس.",
    bad_key:"المفتاح غير صحيح. افتح الإعدادات وتأكد إنك نسخته كامل.",

      + "Reply with only one JSON object and no other text:\n"

    run(null);
  }

  form.addEventListener("submit", function(ev){
    ev.preventDefault();
    if (state.pending){ state.pending.abort(); return; }
    if (listening) stopListen();
    var text = msg.value.trim();
    if (!text || needKey()) return;
    if (!state.started){
      begin();
      state.topic = state.topic || TOPICS[0]; renderChips();
      threadInner.append(el("div","divider","موضوع: " + state.topic.ar));
    }
    document.querySelectorAll(".retry").forEach(function(b){ b.remove(); });
    msg.value = ""; autosize(); showMic("", false);
    threadInner.append(renderUser(text));
    state.turns.push({role:"user", content:text});
    run(text);
  });
  msg.addEventListener("keydown", function(e){
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing){
      e.preventDefault();
      if (!state.pending) form.requestSubmit();
    }
  });
  function autosize(){ msg.style.height = "auto"; msg.style.height = Math.min(msg.scrollHeight, 140) + "px"; }
  msg.addEventListener("input", autosize);

  levelSel.value = state.level;
  levelSel.addEventListener("change", function(){
    state.level = levelSel.value; store.set("meg.level", state.level);
    if (state.started){
      threadInner.append(el("div","sys","صار المستوى: " + LEVEL_AR[state.level] + ". الطلبات الجاية بتكون على هذا المستوى."));
      scrollEnd();
    }
  });

  /* ---------- sheets ---------- */
  var lastFocus = null;
  function openSheetEl(s){ lastFocus = document.activeElement; s.hidden = false; var c = s.querySelector(".js-close"); if (c) c.focus(); }
  function closeSheetEl(s){ s.hidden = true; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
  document.querySelectorAll(".js-close").forEach(function(b){
    b.innerHTML = ICON.close;
    b.addEventListener("click", function(){ closeSheetEl(b.closest(".sheet")); });
  });
  [sheet, settingsSheet].forEach(function(s){
    s.addEventListener("click", function(e){ if (e.target === s) closeSheetEl(s); });
  });
  document.addEventListener("keydown", function(e){
    if (e.key !== "Escape") return;
    if (!settingsSheet.hidden) closeSheetEl(settingsSheet);
    else if (!sheet.hidden) closeSheetEl(sheet);
  });

  function renderMistakes(){
    var s = state.stats;
    sheetSummary.textContent = s.sent ? "جمل صحيحة من أول مرة: " + s.correct + " من " + s.sent : "ما أرسلت جمل للتصحيح لسه.";
    mList.replaceChildren();
    if (!state.mistakes.length){
      mList.append(el("p","empty","أي جملة يصححها المدرّس بتنحفظ هنا عشان ترجع لها وتراجعها."));
      clearBtn.hidden = true;
      return;
    }
    clearBtn.hidden = false;
    state.mistakes.forEach(function(m){
      var item = el("div","m-item");
      if (m.ar){ item.append(el("p","m-ar", String(m.o)), enLine(String(m.c), String(m.c))); }
      else { var d = diffNodes(m.o, m.c); item.append(enLine(d.a, null), enLine(d.b, String(m.c))); }
      if (Array.isArray(m.n) && m.n.length) item.append(notesList(m.n));
      mList.append(item);
    });
  }
  function disarm(){ delete clearBtn.dataset.armed; clearBtn.textContent = "مسح السجل"; }
  $("mistakesBtn").addEventListener("click", function(){ disarm(); renderMistakes(); openSheetEl(sheet); });
  clearBtn.addEventListener("click", function(){
    if (clearBtn.dataset.armed){
      state.mistakes = []; state.stats = {sent:0, correct:0};
      store.set("meg.mistakes", state.mistakes); store.set("meg.stats", state.stats);
      disarm(); renderMistakes(); updateCount();
    } else { clearBtn.dataset.armed = "1"; clearBtn.textContent = "اضغط مرة ثانية للتأكيد"; }
  });

  function openSettings(){
    $("apiKey").value = settings.key;
    $("model").value = settings.model;
    $("autoSend").checked = settings.autoSend;
    setMsg.hidden = true;
    openSheetEl(settingsSheet);
  }
  $("settingsBtn").addEventListener("click", openSettings);
  setForm.addEventListener("submit", function(e){
    e.preventDefault();
    var key = $("apiKey").value.trim();
    if (key && key.indexOf("sk-ant-") !== 0){
      setMsg.textContent = "المفتاح لازم يبدأ بـ sk-ant-. انسخه كامل من console.anthropic.com."; setMsg.hidden = false;
      return;
    }
    settings.key = key;
    settings.model = $("model").value;
    settings.autoSend = $("autoSend").checked;
    store.set("meg.settings", settings);
    closeSheetEl(settingsSheet);
    var setup = document.querySelector(".setup");
    if (setup && settings.key) setup.remove();
  });

  /* ---------- boot ---------- */
  setSendMode(false);
  renderChips();
  updateCount();
  renderIntro();
  if (canSpeak){ try{ window.speechSynthesis.getVoices(); }catch(e){} }
})();
</script>
</body>
</html>
