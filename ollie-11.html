<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: one centered column; worlds stack like toy blocks, each world's lessons wind down a path */
:root{
  --bg:#EDF4F9; --paper:#FFFFFF; --ink:#172636; --muted:#5A6C7D; --line:#D4E1EB;
  --sun:#FFBE2E; --sun-deep:#B37600;
  --good:#1C9F5F; --good-soft:#DDF5E8; --bad:#DD444A; --bad-soft:#FCE4E5;
  --lv:#2E8BC9; --lv-deep:#1C5F8C; --lv-soft:#E0EEF8;
  --f-ui:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;
  --f-en:"Andika","Baloo Bhaijaan 2",Verdana,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
[dir="ltr"]{font-family:var(--f-en)}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.fill{fill:currentColor;stroke:none}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;gap:10px;padding-block:10px;background:var(--bg)}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--paper);box-shadow:0 3px 0 var(--line)}
.iconbtn.ph{visibility:hidden}
.bar-t{unicode-bidi:plaintext;flex:1;min-width:0;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.pill{display:flex;align-items:center;gap:4px;background:var(--paper);padding:6px 12px;border-radius:999px;box-shadow:0 3px 0 var(--line);color:var(--sun-deep);font-weight:800;font-variant-numeric:tabular-nums}
.pill .ico{color:var(--sun)}

/* home */
.hero{display:flex;gap:14px;align-items:center;padding-block:8px 18px}
.owl{font-size:58px;line-height:1;width:84px;height:84px;display:grid;place-items:center;background:var(--paper);border-radius:28px;box-shadow:0 5px 0 var(--line);flex:none}
.hello{font-weight:800;font-size:22px}
.hero h1{font-size:17px;font-weight:700;color:var(--lv-deep)}
.muted{color:var(--muted);font-size:14px}
.worlds{display:flex;flex-direction:column;gap:16px}
.world{display:flex;align-items:center;gap:14px;text-align:start;background:var(--paper);border-radius:22px;padding:14px;box-shadow:0 6px 0 var(--lv-deep);border:2px solid var(--lv);transition:transform .12s}
.world:active{transform:translateY(4px);box-shadow:0 2px 0 var(--lv-deep)}
.w-art{font-size:40px;width:66px;height:66px;border-radius:20px;background:var(--lv-soft);display:grid;place-items:center;flex:none}
.w-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.w-txt b{font-size:19px}
.w-txt i{font-style:normal;color:var(--lv-deep);font-weight:700;font-size:14px}
.w-txt small{color:var(--muted);font-size:13px}
.w-num{font-weight:800;color:var(--lv-deep);font-size:13px;position:absolute}
.prog{height:8px;background:var(--lv-soft);border-radius:9px;overflow:hidden;margin-block:4px 2px}
.prog span{display:block;height:100%;background:var(--lv);border-radius:9px}
.locked{filter:grayscale(1);opacity:.55}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.ghost{background:var(--paper);border-radius:14px;padding:10px 14px;font-weight:700;box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.ghost:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.go{background:var(--lv);color:#fff;border-radius:14px;padding:11px 18px;font-weight:800;box-shadow:0 5px 0 var(--lv-deep)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--lv-deep)}
.go:disabled{opacity:.45}

/* level path */
.lv-hero{display:flex;gap:14px;align-items:center;background:var(--lv);color:#fff;border-radius:24px;padding:16px;margin-block:4px 22px;box-shadow:0 6px 0 var(--lv-deep)}
.lv-art{font-size:46px;width:72px;height:72px;border-radius:22px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.04em;opacity:.9}
.lv-hero h1{font-size:24px}
.path{position:relative;display:flex;flex-direction:column;gap:18px;padding-block:6px}
.path::before{content:"";position:absolute;inset-block:30px;inset-inline-start:50%;border-inline-start:4px dashed var(--line)}
.node{position:relative;display:flex;align-items:center;gap:12px;text-align:start;width:min(100%,290px)}
.pos0{margin-inline-start:0}.pos1{margin-inline-start:18%}.pos2{margin-inline-start:34%}.pos3{margin-inline-start:12%}
.disc{width:72px;height:72px;border-radius:50%;background:var(--lv);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:800;box-shadow:0 6px 0 var(--lv-deep);flex:none;border:4px solid var(--paper)}
.node.done .disc{background:var(--sun);color:var(--ink);box-shadow:0 6px 0 var(--sun-deep)}
.node.locked .disc{background:#B8C4CE;box-shadow:0 6px 0 #8E9BA6}
.nlab{background:var(--paper);border-radius:16px;padding:8px 12px;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;min-width:0}
.nlab b{font-size:16px}
.nlab small{color:var(--muted)}
.nst{display:flex;align-items:center;gap:3px;color:var(--sun-deep);font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.nst .ico{width:15px;height:15px;color:var(--sun)}
.node.boss .disc{width:86px;height:86px;background:#1F2A37;color:var(--sun);box-shadow:0 6px 0 #000}
.node.boss .disc .ico{width:38px;height:38px}

/* lesson */
.les-h{padding-block:6px 14px}
.les-h h1{font-size:28px;color:var(--lv-deep)}
.vocab{display:flex;gap:10px;overflow-x:auto;padding-block:4px 12px;margin-bottom:10px;scrollbar-width:thin}
.vw{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--paper);border-radius:16px;padding:10px 12px;min-width:92px;box-shadow:0 4px 0 var(--line)}
.vw .e{font-size:30px;line-height:1.1}
.vw b{font-family:var(--f-en);font-size:15px}
.vw small{color:var(--muted);font-size:12px}
.sec-t{font-weight:800;font-size:15px;color:var(--muted);margin-block:6px 10px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:start;background:var(--paper);border-radius:20px;padding:14px;border:2px solid var(--lv-soft);box-shadow:0 5px 0 var(--lv-soft)}
.act:active{transform:translateY(3px)}
.act .ai{width:46px;height:46px;border-radius:14px;background:var(--lv-soft);color:var(--lv-deep);display:grid;place-items:center}
.act .ai .ico{width:26px;height:26px}
.act b{font-size:17px}
.act small{color:var(--muted);font-family:var(--f-en);font-size:13px}
.stars{display:flex;gap:2px}
.stars .ico{width:18px;height:18px;color:#D3DCE3}
.stars .on{color:var(--sun)}

/* activity panes */
.pane{display:flex;flex-direction:column;gap:14px}
.tip{background:var(--lv-soft);color:var(--lv-deep);border-radius:14px;padding:10px 14px;font-weight:600;font-size:15px}
.chat{display:flex;flex-direction:column;gap:10px;min-height:120px}
.bub{display:flex;align-items:flex-end;gap:8px;max-width:92%}
.bub p{background:var(--paper);border-radius:18px 18px 18px 4px;padding:10px 14px;font-size:18px;box-shadow:0 3px 0 var(--line);min-width:0}
.bub.kid{align-self:flex-end;flex-direction:row-reverse}
.bub.kid p{background:var(--lv);color:#fff;border-radius:18px 18px 4px 18px;box-shadow:0 3px 0 var(--lv-deep)}
.av{font-size:30px;line-height:1;flex:none}
.spk{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--lv-soft);color:var(--lv-deep);flex:none}
.spk.sm{width:34px;height:34px}
.spk.sm .ico{width:18px;height:18px}
.opts,.q-o{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-family:var(--f-en);font-size:17px;box-shadow:0 4px 0 var(--line)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.right{background:var(--good-soft)!important;border-color:var(--good)!important;box-shadow:0 4px 0 var(--good)!important}
.wrong{background:var(--bad-soft)!important;border-color:var(--bad)!important;box-shadow:0 4px 0 var(--bad)!important;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .4s}
.repeat{background:var(--paper);border:2px dashed var(--lv);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns>*{flex:1}
.player{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.play{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--lv);color:#fff;border-radius:18px;padding:14px 20px;font-weight:800;font-size:18px;box-shadow:0 5px 0 var(--lv-deep)}
.play .ico{width:28px;height:28px}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 var(--lv-deep)}
.text{background:var(--paper);border-radius:18px;padding:16px;font-size:20px;line-height:1.75;box-shadow:0 4px 0 var(--line);text-align:left}
.w{border-radius:6px;cursor:pointer}
.w:active{background:var(--sun)}
.q{background:var(--paper);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 0 var(--line)}
.q.ok{outline:2px solid var(--good)}
.q-h{display:flex;gap:10px;align-items:center;font-size:18px;font-weight:700}

/* games */
.g-head{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.g-head span{font-variant-numeric:tabular-nums;color:var(--muted)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{display:flex;flex-direction:column;gap:10px}
.tile{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:10px;font-size:17px;box-shadow:0 4px 0 var(--line);min-height:54px}
.tile.em{font-size:30px;line-height:1}
.tile.em.big{font-size:44px;min-height:92px}
.tile.sel{border-color:var(--lv);box-shadow:0 4px 0 var(--lv);background:var(--lv-soft)}
.tile.gone{visibility:hidden}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{aspect-ratio:3/4;max-width:100%;border-radius:14px;background:var(--lv);color:#fff;display:grid;place-items:center;box-shadow:0 4px 0 var(--lv-deep);font-size:28px;font-weight:800;padding:4px}
.card .front{display:none}
.card.up{background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.card.up .front{display:block}
.card.up .back{display:none}
.card .front.en{font-size:14px;word-break:break-word;line-height:1.2}
.card.got{background:var(--good-soft);border-color:var(--good)}
.clue{display:flex;align-items:center;justify-content:center;gap:14px;background:var(--paper);border-radius:18px;padding:12px;box-shadow:0 4px 0 var(--line);font-weight:700;font-size:18px}
.big-em{font-size:52px;line-height:1}
.slots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;min-height:52px}
.slot{width:40px;height:48px;border-radius:10px;background:var(--paper);border-bottom:4px solid var(--lv);display:grid;place-items:center;font-size:24px;font-weight:700;font-family:var(--f-en)}
.slots.ok .slot{border-color:var(--good);background:var(--good-soft)}
.tiles{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.ltr,.tok{min-width:46px;height:50px;padding:0 12px;border-radius:12px;background:var(--sun);color:var(--ink);font-family:var(--f-en);font-size:22px;font-weight:700;box-shadow:0 4px 0 var(--sun-deep)}
.tok{font-size:17px;height:44px}
.ltr:disabled,.tok:disabled{opacity:.2}
.sent{display:flex;flex-wrap:wrap;gap:8px;min-height:64px;background:var(--paper);border-radius:16px;padding:10px;border:2px dashed var(--line);align-content:flex-start}
.sent .tok{background:var(--lv);color:#fff;box-shadow:0 4px 0 var(--lv-deep)}
.sent.ok{border-color:var(--good);background:var(--good-soft)}
.inp{width:100%;font-family:var(--f-en);font-size:26px;text-align:center;padding:12px;border-radius:14px;border:3px solid var(--line);background:var(--paper);color:var(--ink)}
.hintline{text-align:center;font-size:22px;letter-spacing:.2em;color:var(--lv-deep);min-height:30px}
.target{display:flex;align-items:center;justify-content:center;gap:12px;font-weight:700;font-size:18px}
.field{position:relative;height:340px;border-radius:20px;overflow:hidden;background:linear-gradient(var(--lv-soft),var(--paper));border:2px solid var(--line)}
.bubble{position:absolute;left:0;top:0;padding:10px 14px;border-radius:999px;background:var(--paper);border:3px solid var(--lv);font-family:var(--f-en);font-size:15px;font-weight:700;white-space:nowrap;box-shadow:inset -4px -6px 0 var(--lv-soft)}
.bubble.popped{background:var(--good);color:#fff;border-color:var(--good);transition:opacity .5s;opacity:0}
.bubble.miss{background:var(--bad-soft);border-color:var(--bad);opacity:.5}

/* boss */
.boss-head{display:flex;align-items:center;gap:10px;justify-content:space-between;font-weight:800}
.boss-head .ico{color:var(--sun-deep);width:28px;height:28px}
.timer{height:12px;border-radius:9px;background:var(--line);overflow:hidden}
.timer span{display:block;height:100%;width:100%;background:var(--sun)}
.bprompt{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--paper);border-radius:20px;padding:16px;box-shadow:0 4px 0 var(--line);text-align:center;font-weight:700}
.ar-word{font-size:34px;font-weight:800;color:var(--lv-deep)}
.intro{background:var(--paper);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 5px 0 var(--line)}
.intro ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}

/* result */
.result{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding-block:24px}
.result .bigstars{display:flex;gap:8px}
.result .bigstars .ico{width:64px;height:64px;color:#D3DCE3;animation:pop .5s backwards}
.result .bigstars .on{color:var(--sun)}
.result .bigstars .ico:nth-child(2){animation-delay:.15s}.result .bigstars .ico:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(0)}}
.result h2{font-size:30px}
.result .btns{width:100%;flex-direction:column}

/* words + parents */
.wl{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-bottom:22px}
.wl .vw{min-width:0}
.panel{background:var(--paper);border-radius:20px;padding:16px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.panel h3{font-size:18px}
.panel ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.panel input[type=text]{font:inherit;font-size:18px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700}
.danger{color:var(--bad);border-color:var(--bad-soft)}
.link{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 var(--sun);border:2px solid var(--sun);margin-bottom:18px}
.link .big{font-size:30px;font-weight:800;color:var(--sun-deep);font-variant-numeric:tabular-nums;min-width:40px;text-align:center}
.link small{display:block;color:var(--muted);font-size:13px}
.prog.sun{background:#FFF1CC}.prog.sun span{background:var(--sun)}
a.go{display:inline-block;text-align:center;text-decoration:none}
.gift{background:var(--sun);color:var(--ink);font-weight:800;padding:10px 16px;border-radius:14px;box-shadow:0 4px 0 var(--sun-deep)}
.owl svg{display:block}
.partb{display:inline-block;background:var(--lv-soft);color:var(--lv-deep);font-weight:800;font-size:13px;padding:2px 10px;border-radius:999px;margin-block:2px}
.result a.go{width:100%}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;z-index:20;max-width:calc(100% - 32px);text-align:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:15}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.mem{grid-template-columns:repeat(3,1fr)}.pos2{margin-inline-start:22%}}

/* ===== added with the new games, the daily challenge and the sticker album ===== */
.owl{cursor:pointer}
.owl.hop{animation:hop .5s}
@keyframes hop{30%{transform:translateY(-10px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
/* something is being read aloud */
.speaking{outline:3px solid var(--sun);outline-offset:2px;animation:pulse 1s infinite}
@keyframes pulse{50%{outline-color:transparent}}
.sn{border-radius:6px;transition:background .2s;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sn.on{background:#FFE9A6;box-shadow:0 0 0 3px #FFE9A6}

/* home: daily challenge, shortcuts, parts */
.daily{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:linear-gradient(135deg,#F9813A,#E4532A);color:#fff;border-radius:22px;padding:14px;box-shadow:0 6px 0 #A63A19;margin-bottom:16px}
.daily:active{transform:translateY(4px);box-shadow:0 2px 0 #A63A19}
.daily.done{background:linear-gradient(135deg,#2DB866,#1C9F5F);box-shadow:0 6px 0 #14713F}
.daily.done:active{box-shadow:0 2px 0 #14713F}
.d-ic{font-size:32px;line-height:1;width:58px;height:58px;border-radius:18px;background:rgba(255,255,255,.24);display:grid;place-items:center;flex:none}
.d-t{flex:1;min-width:0;display:flex;flex-direction:column}
.d-t b{font-size:19px}
.d-t small{font-size:13px}
.d-n{display:flex;flex-direction:column;align-items:center;background:rgba(255,255,255,.24);border-radius:16px;padding:6px 10px;flex:none}
.d-n b{font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.d-n small{font-size:11px;white-space:nowrap}
.tiles4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.tile4{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;background:var(--paper);border-radius:16px;padding:10px 2px 8px;box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.tile4:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tile4 span{font-size:26px;line-height:1.15}
.tile4 b{font-size:13px;line-height:1.3}
.tile4 .dot{position:absolute;top:-7px;inset-inline-end:-5px;min-width:22px;height:22px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-style:normal;font-weight:800;font-size:12px;line-height:22px;font-variant-numeric:tabular-nums}
.parts{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:24px}
.parts span{flex-basis:100%;text-align:center;color:var(--muted);font-weight:700;font-size:14px}
.parts a,.parts b{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:800;text-decoration:none;background:var(--paper);color:var(--lv-deep);box-shadow:0 3px 0 var(--line);font-variant-numeric:tabular-nums}
.parts b{background:var(--lv);color:#fff;box-shadow:0 3px 0 var(--lv-deep)}

/* lesson: more games */
.acts+.sec-t{margin-top:24px}
.xg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.xb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;text-align:start;background:var(--paper);border-radius:14px;padding:8px 10px;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);min-height:54px}
.xb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.xb .xe{font-size:22px;line-height:1}
.xb b{font-size:14px;flex:1;min-width:0;line-height:1.3}
.xb .stars .ico{width:13px;height:13px}

/* letter boxes for long words */
.slots.long .slot{width:26px;height:40px;font-size:19px}
.slot.gap{background:none;border-bottom-color:transparent;width:12px}
.slots.words{gap:8px 18px}
.wgrp{display:flex;gap:6px}

/* true or false */
.tfc{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--paper);border-radius:22px;padding:18px;box-shadow:0 5px 0 var(--line);text-align:center}
.tfc .big-em{font-size:64px}
.tfw{font-family:var(--f-en);font-size:30px;line-height:1.2;color:var(--lv-deep)}
.tfb{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf{border-radius:18px;padding:16px 10px;font-size:20px;font-weight:800;color:#fff;border:2px solid transparent}
.tf.yes{background:var(--good);box-shadow:0 5px 0 #14713F}
.tf.no{background:var(--bad);box-shadow:0 5px 0 #8f2226}
.tf:active{transform:translateY(3px)}
.tf.right,.tf.wrong{color:var(--ink)}
.fixline{text-align:center;font-weight:700;min-height:28px;font-size:17px}
.fixline b{font-family:var(--f-en);color:var(--lv-deep)}

/* hide and seek */
.bushes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;background:linear-gradient(#CDEBFF,#E6F6DF 70%);border-radius:20px;padding:14px 10px 10px;border:2px solid var(--line)}
.bush{position:relative;height:116px;overflow:hidden;border-radius:14px}
.bush-art{position:absolute;left:0;right:0;bottom:0;width:100%;height:64px;z-index:1;pointer-events:none}
.peek{position:absolute;left:50%;bottom:46px;font-size:46px;line-height:1.15;transform:translate(-50%,84px);transition:transform .2s cubic-bezier(.3,1.4,.6,1)}
.bush.up .peek{transform:translate(-50%,0)}
.bush.glow .peek{filter:drop-shadow(0 0 7px var(--sun-deep))}
.bush.got .peek{transform:translate(-50%,-4px) scale(1.15)}
.tgw{font-family:var(--f-en);font-size:24px;color:var(--lv-deep)}

/* missing word */
.gapc{display:flex;gap:10px;align-items:flex-start;background:var(--paper);border-radius:18px;padding:14px;box-shadow:0 4px 0 var(--line);text-align:left}
.gapc p{font-family:var(--f-en);font-size:21px;line-height:1.75;flex:1;min-width:0}
.blank{display:inline-block;min-width:76px;border-bottom:4px solid var(--lv);border-radius:6px 6px 0 0;background:var(--lv-soft);text-align:center;padding:0 8px;font-weight:700;line-height:1.35}
.blank.ok{background:var(--good-soft);border-color:var(--good);color:#11663C}
.opt.c{text-align:center;font-weight:700}

/* Ollie's balloons */
.bal{display:flex;flex-direction:column;align-items:center;background:linear-gradient(#CDEBFF,#F3FBFF);border-radius:20px;padding:10px 10px 4px;border:2px solid var(--line)}
.bal-row{display:flex;gap:2px;justify-content:center;height:62px;direction:ltr}
.ball{width:32px;transition:transform .5s,opacity .5s}
.ball svg{display:block;width:32px;height:60px}
.ball.gone{transform:translateY(-70px) rotate(12deg);opacity:0}
.bal-o{margin-top:-6px}
.kb{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.key{height:44px;border-radius:10px;background:var(--paper);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-family:var(--f-en);font-size:20px;font-weight:700}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.key:disabled{opacity:.6}
.key.wrong{animation:none}

/* word search */
.wlist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wi{display:flex;align-items:center;gap:6px;background:var(--paper);border-radius:999px;padding:4px 12px;box-shadow:0 3px 0 var(--line);font-size:15px}
.wi b{font-family:var(--f-en)}
.wi small{color:var(--muted);font-size:13px}
.wi.ok{background:var(--good-soft);box-shadow:0 3px 0 var(--good)}
.wgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;background:var(--paper);border-radius:18px;padding:8px;box-shadow:0 4px 0 var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.wc{aspect-ratio:1;display:grid;place-items:center;border-radius:9px;background:var(--bg);font-family:var(--f-en);font-weight:700;font-size:19px;cursor:pointer}
.wc.fd{color:#fff}
.wc.f0{background:#2B6FCC}.wc.f1{background:#1C8F56}.wc.f2{background:#C75B1B}.wc.f3{background:#6447D1}.wc.f4{background:#B8327F}
.wc.sel,.wc.hint{background:var(--sun);color:var(--ink)}
.wc.hint{animation:pulse 0.5s 3;outline:3px solid var(--sun-deep)}

/* Ollie's flight */
.sky{position:relative;height:330px;border-radius:20px;overflow:hidden;background:linear-gradient(#BCE4FF,#EAF7FF);border:2px solid var(--line);touch-action:manipulation;cursor:pointer}
.sky .ln{position:absolute;top:0;bottom:0;border-left:2px dashed rgba(255,255,255,.95)}
.sky .ln:nth-child(1){left:33.33%}.sky .ln:nth-child(2){left:66.66%}
.flyer{position:absolute;left:0;bottom:6px;transition:transform .18s ease-out;pointer-events:none}
.cloud{position:absolute;top:0;background:#fff;border:2px solid #fff;border-radius:22px;padding:9px 4px;text-align:center;font-family:var(--f-en);font-weight:700;font-size:14px;line-height:1.2;box-shadow:0 4px 0 #A5D0EC;overflow-wrap:anywhere;pointer-events:none}
.cloud.wrong{animation:none}
.fbtn{align-items:center}
.fbtn .ghost{font-size:22px;padding:8px 14px}
.fbtn .muted{flex:0 0 auto;min-width:58px;text-align:center;font-weight:700}

/* challenge cards */
.en-word{font-family:var(--f-en);font-size:30px;font-weight:700;color:var(--lv-deep)}
.opt.ar{font-family:var(--f-ui);text-align:right;font-weight:600}

/* sticker album */
.alb-t{font-size:18px;margin-block:20px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.alb-t small{color:var(--muted);font-size:13px;font-weight:700}
.alb{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px}
.stk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--paper);border-radius:16px;padding:8px 4px;min-height:86px;border:2px dashed var(--line);text-align:center}
.stk .e{font-size:30px;line-height:1.15;opacity:.35}
.stk small{font-size:11px;color:var(--muted);line-height:1.25}
.stk.on{border-style:solid;box-shadow:0 4px 0 var(--line)}
.stk.on .e{opacity:1}
.stk.gold{border-color:var(--sun);box-shadow:0 4px 0 var(--sun-deep);background:#FFF8E1}
.newst{display:flex;align-items:center;gap:10px;background:var(--paper);border:2px solid var(--sun);border-radius:16px;padding:8px 14px;box-shadow:0 4px 0 var(--sun);animation:pop .5s .3s backwards}
.newst span{font-size:34px;line-height:1.1}

/* ===== second round, 10 Nov 2026: six more games, wardrobe, library, flashcards, one-minute rush ===== */
/* Ollie's hats may reach above his own box */
.owl svg,.av svg,.flyer svg,.bal-o svg,.stage-o svg,.we svg,.run svg{overflow:visible}

/* home: what is new */
.news{background:var(--paper);border:2px solid var(--lv);border-radius:20px;padding:14px;box-shadow:0 5px 0 var(--lv-deep);display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.news>b{font-size:18px}
.news ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:3px;font-size:15px}
.tile4 .dot.best{background:var(--sun);color:var(--ink)}

/* lesson: flashcards */
.sec-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.sec-row .sec-t{margin:0}
.mini{font-size:14px;padding:6px 12px;white-space:nowrap}
.flash{display:block;width:100%;border-radius:24px;background:var(--paper);border:3px solid var(--lv);box-shadow:0 6px 0 var(--lv-deep);padding:18px}
.flash:active{transform:translateY(3px);box-shadow:0 3px 0 var(--lv-deep)}
.flash>span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:220px}
.flash .big-em{font-size:88px}
.flash b{font-size:30px;line-height:1.3}

  r:"Disagreeing is a normal part of life. Friends, families and even scientists disagree all the time. What matters is how we do it. A polite disagreement focuses on the idea, not on the person. Phrases like I understand what you mean, but, or I'm not sure I agree because, help keep the conversation friendly. It is also important to listen carefully before answering. Sometimes we discover that we actually agree more than we thought. In many cultures, including ours, respecting other people's opinions is a sign of good manners.",

 {en:"Telling a Story Well",ar:"رواية قصة جميلة",v:"storyteller|راوي القصص|📖;beginning|بداية|▶️;ending|نهاية|⏹️;character|شخصية|🧙;plot|أحداث القصة|📈;suspense|تشويق|😮",
  c:[["What makes a story exciting?","Suspense and an unexpected ending.","Suspense and an unexpected toothbrush.","Exciting is story making."],["Who is the main character?","A brave girl who lives by the sea.","A brave fridge who lives by the sea.","Character is main who."],["How should a story begin?","It should grab the reader's attention.","It should grab the reader's sandwich.","Begin is story how."],["Can you tell me the story again?","Of course! Once upon a time.","Of course! Once upon a soup.","Again is telling story."]],
  l:"Grandma is the best storyteller in our family. She changes her voice for every character. She always stops at the most exciting moment and says: the rest tomorrow! We can't wait.",
  lq:[["Who is the best storyteller?","Grandma","Dad","the teacher"],["What does she change for every character?","her voice","her clothes","her glasses"],["When does she stop?","at the most exciting moment","at the beginning","after the ending"]],
  r:"The Arabian tradition of storytelling is famous around the world. In One Thousand and One Nights, the clever Shahrazad tells the king a new story every night and stops at the most exciting moment, so he wants to hear more. Good storytellers know the secret: a story needs a character we care about, a problem to solve and a satisfying ending. They use interesting details, so listeners can imagine the scene. They also use pauses and change their voices. You can practise by telling a short story to your family at dinner tonight.",
  rq:[["What does Shahrazad do every night?","tells the king a new story","cooks dinner","writes a letter"],["What does a story need?","a character, a problem and a satisfying ending","only a happy ending","lots of pages"],["How can you practise?","tell a short story to your family","read silently","watch television"]]},
 {en:"Explaining a Plan",ar:"شرح خطة",v:"step|خطوة|👣;first|أولًا|1️⃣;next|بعد ذلك|2️⃣;finally|أخيرًا|3️⃣;goal|هدف|🎯;schedule|جدول مواعيد|📅",
  c:[["What's the plan for the class trip?","First we'll visit the museum, then we'll have lunch.","First we'll visit the moon, then we'll have shoes.","Plan is trip what."],["Who is responsible for the tickets?","Ahmed has offered to book them.","Ahmed has offered to eat them.","Tickets is responsible who."],["What time do we need to leave?","We need to leave at eight sharp.","We need to leave at banana o'clock.","Leave is time what."],["What will we do if it rains?","We'll move the activities indoors.","We'll move the rain indoors.","Rains is doing if."]],
  l:"Our group is planning a charity sale. First, we will ask families to donate books and toys. Next, we will set up tables in the school hall. Finally, we will give all the money to the children's hospital.",
  lq:[["What is the group planning?","a charity sale","a party","a trip"],["What will families donate?","books and toys","food","money"],["Where will the money go?","to the children's hospital","to the school","to the group"]],
  r:"A good plan answers five important questions: what, who, when, where and how. When you explain a plan to others, start with the goal so everyone understands why it matters. Then describe the steps in order, using words like first, next, after that and finally. Make sure every person knows their role. It also helps to think about what could go wrong and prepare a backup plan. Planning may seem boring, but it saves time and prevents problems later. As the saying goes, failing to plan is planning to fail.",
  rq:[["What questions does a good plan answer?","what, who, when, where and how","only when","only who"],["How should you start explaining a plan?","with the goal","with the problems","with a joke"],["What does the saying say?","Failing to plan is planning to fail.","Plans are boring.","Never plan anything."]]},
 {en:"Saying Sorry",ar:"الاعتذار",v:"apology|اعتذار|💐;mistake|خطأ|✏️;forgive|يسامح|🕊️;fault|ذنب|👆;promise|يَعِد|🤞;feelings|مشاعر|💗",
  c:[["Why are you apologising?","Because I broke your pencil by accident.","Because I broke the moon by accident.","Apologising is why."],["Will you forgive me?","Of course, everyone makes mistakes.","Of course, everyone makes pancakes on Mars.","Forgive is me will."],["What makes a good apology?","Saying sorry and trying to fix the problem.","Saying sorry and running away quickly.","Apology is good what."],["Do you promise not to do it again?","Yes, I promise I'll be more careful.","Yes, I promise I'll be more purple.","Promise is doing again."]],
  l:"Sara laughed when Lina fell in the playground. Later, she felt bad. She went to Lina and said: I'm sorry I laughed. That wasn't kind. Lina smiled and said it was okay.",
  lq:[["What did Sara do?","laughed when Lina fell","pushed Lina","ignored Lina"],["How did Sara feel later?","bad","happy","bored"],["What did Lina do?","smiled and said it was okay","cried","told the teacher"]],
  r:"Saying sorry is not always easy, but it is one of the most important social skills. A real apology has three parts. First, you say clearly what you did wrong. Second, you show that you understand how the other person felt. Third, you try to make things right, for example by repairing something or promising to act differently. An apology that includes the word but, as in I'm sorry, but you started it, is not a real apology. When someone apologises to you sincerely, try to forgive them. Holding on to anger only hurts you.",
  rq:[["How many parts does a real apology have?","three","one","ten"],["What is not a real apology?","one that includes but","one that is short","one that is written"],["What does holding on to anger do?","only hurts you","makes you stronger","fixes the problem"]]}

 {en:"Saving for Something",ar:"الادخار لشيء تريده",v:"piggy bank|حصّالة|🐷;pocket money|مصروف|💵;spend|ينفق|🛍️;patience|صبر|⏳;afford|يقدر على شرائه|💰;wish list|قائمة الأمنيات|📝",
  c:[["What are you saving for?","I'm saving for a new bicycle.","I'm saving for a new cloud.","Saving is for what."],["How much pocket money do you get?","I get twenty riyals a week.","I get twenty dinosaurs a week.","Pocket is money much."],["How long will it take to save enough?","About three months if I don't spend anything.","About three months if I eat my piggy bank.","Enough is saving long."],["Isn't it hard to wait?","Yes, but it'll feel great when I can afford it.","Yes, but it'll feel great when I become a bus.","Wait is hard it."]],
  l:"Hamad wants a telescope that costs three hundred riyals. He gets thirty riyals a week. He has decided to save half of his pocket money. He has drawn a chart to track his savings.",
  lq:[["What does Hamad want?","a telescope","a bicycle","a phone"],["How much does he get a week?","thirty riyals","three hundred riyals","three riyals"],["What has he drawn?","a chart to track his savings","a picture of the moon","a map"]],
  r:"Saving money teaches an important lesson: good things are often worth waiting for. Experts suggest a simple rule for children. Divide your money into three jars: one for spending, one for saving and one for giving. When you want something expensive, write down its price and calculate how many weeks you need to save. Seeing your savings grow is very motivating. You might also find that, after waiting a few weeks, you no longer want the thing as much as before. That is another useful lesson about money.",
  rq:[["What do experts suggest?","dividing money into three jars","spending everything quickly","never spending"],["What is very motivating?","seeing your savings grow","spending money","losing money"],["What might you find after waiting?","You no longer want the thing as much.","The price is zero.","You have no money."]]},
 {en:"A Fair Price",ar:"سعر عادل",v:"discount|خصم|🔖;seller|بائع|🧑‍💼;compare|يقارن|⚖️;bargain|صفقة رابحة|🏷️;receipt|إيصال|🧾;value|قيمة|💎",
  c:[["Is this a good price?","It's cheaper than in the other shop.","It's cheaper than in the volcano.","Price is good this."],["Can you give me a discount?","I can give you ten percent off.","I can give you ten penguins off.","Discount is giving me."],["Why did you keep the receipt?","In case I need to return the item.","In case I need to eat the item.","Receipt is keeping why."],["How do you know if something is good value?","Compare the price and the quality.","Compare the smell and the moon.","Value is good knowing."]],
  l:"At the old market in Jeddah, Faris wanted to buy a wooden box. The seller asked for one hundred riyals. Faris's father smiled and offered seventy. In the end, they agreed on eighty riyals.",
  lq:[["Where were they?","at the old market in Jeddah","at a mall","online"],["How much did the seller ask for?","one hundred riyals","seventy riyals","eighty riyals"],["What price did they agree on?","eighty riyals","seventy riyals","one hundred riyals"]],
  r:"In traditional markets, prices are often not fixed, and buyers and sellers discuss the price together. This is called bargaining. It can be fun, but it should always be polite and fair. In big shops and online stores, prices are usually fixed, but you can still save money by comparing different shops and waiting for sales. A fair price is one that is good for both sides: the buyer gets something useful, and the seller makes a reasonable profit. Remember that the cheapest option is not always the best value.",
  rq:[["What is bargaining?","discussing the price together","stealing","paying twice"],["How can you save money in big shops?","compare shops and wait for sales","shout at the seller","pay more"],["What is a fair price?","one that is good for both sides","the highest price","zero"]]},
 {en:"Borrowing and Lending",ar:"الاستعارة والإعارة",v:"borrow|يستعير|📥;lend|يُعير|📤;return|يُرجِع|↩️;owe|يدين بـ|💳;debt|دَين|📉;responsible|مسؤول|🧑‍⚖️",
  c:[["Can I borrow your ruler?","Sure, but please give it back after class.","Sure, but please give it back after Jupiter.","Ruler is borrowing me."],["Did you return the book to the library?","Yes, I returned it yesterday.","Yes, I returned it to the ocean.","Library is returning book."],["How much do I owe you?","You owe me five riyals for the juice.","You owe me five clouds for the juice.","Owe is how much."],["Why should you be careful about borrowing money?","Because you have to pay it back.","Because money gets tired.","Careful is borrowing why."]],
  l:"Majid lent his football to his neighbour Ziyad. Ziyad promised to return it on Thursday. On Thursday, Ziyad knocked on the door with the ball and a packet of sweets to say thank you.",
  lq:[["What did Majid lend?","his football","his bike","his book"],["When did Ziyad promise to return it?","on Thursday","on Monday","next month"],["What did Ziyad bring with the ball?","a packet of sweets","a letter","nothing"]],
  r:"Borrowing and lending are based on trust. When you borrow something, you are responsible for taking care of it and returning it on time and in good condition. If you damage it, you should tell the owner honestly and offer to repair or replace it. Adults sometimes borrow large amounts of money from banks to buy houses or start businesses. This is called a loan, and they usually have to pay back more than they borrowed. That is why people say it is wise to borrow only what you really need.",
  rq:[["What are borrowing and lending based on?","trust","luck","speed"],["What should you do if you damage something you borrowed?","tell the owner honestly and offer to repair it","hide it","keep it"],["What is it wise to do?","borrow only what you really need","borrow as much as possible","never return things"]]},
 {en:"A Small Business",ar:"مشروع صغير",v:"business|مشروع تجاري|💼;customer|زبون|🛍️;profit|ربح|📈;product|منتج|📦;advertise|يعلن|📢;lemonade|عصير ليمون|🍋",
  c:[["What does your business sell?","We sell homemade lemonade and cookies.","We sell homemade clouds and bricks.","Business is selling what."],["How did you advertise it?","We made posters and told our neighbours.","We made posters and told our toothbrushes.","Advertise is how."],["Did you make a profit?","Yes, we made fifty riyals after paying for the lemons.","Yes, we made fifty elephants after paying for the lemons.","Profit is making did."],["What will you do with the money?","We'll buy better cups and give some to charity.","We'll buy better clouds and give some to the moon.","Money is doing what."]],
  l:"During the school fair, Reem and her friends opened a small cookie stand. They spent forty riyals on ingredients. By the end of the day, they had sold everything and earned one hundred and twenty riyals.",
  lq:[["What did they sell?","cookies","toys","books"],["How much did they spend on ingredients?","forty riyals","one hundred and twenty riyals","ten riyals"],["How much did they earn?","one hundred and twenty riyals","forty riyals","two hundred riyals"]],
  r:"Many successful companies started as tiny businesses. Running even a small stand teaches valuable lessons. First, you need a product that people want. Then you must calculate your costs carefully, because profit is what is left after you pay for everything. You also need to treat customers kindly, because happy customers come back and tell their friends. Young entrepreneurs in Saudi Arabia can join competitions and programmes that help them turn good ideas into real projects. Who knows? Your lemonade stand might be the start of something big.",
  rq:[["What is profit?","what is left after you pay for everything","all the money you receive","the price of the product"],["Why should you treat customers kindly?","Happy customers come back and tell friends.","It is a law.","They will pay double."],["What can young entrepreneurs join?","competitions and programmes","only clubs for adults","nothing"]]},
 {en:"Giving",ar:"العطاء",v:"charity|جمعية خيرية|💝;donate|يتبرع|🎁;generous|كريم|🤲;share|يشارك|🫂;need|حاجة|🙏;kindness|لطف|💛",
  c:[["Why do you give part of your money to charity?","Because it helps people who need it.","Because money is too heavy for my pocket.","Charity is giving why."],["What did your class donate?","We donated warm clothes for winter.","We donated warm clouds for winter.","Donate is class what."],["Is giving only about money?","No, you can also give your time and help.","No, you can also give your homework to the moon.","Giving is only money."],["How do you feel after helping someone?","I feel really happy inside.","I feel really square inside.","Feel is helping how."]],
  l:"Every Ramadan, Lulu's family prepares food boxes for families in need. Lulu helps to pack rice, dates and oil. Her father says that giving is a duty, but also a joy.",
  lq:[["When does the family prepare food boxes?","every Ramadan","every Friday","on birthdays"],["What does Lulu pack?","rice, dates and oil","toys","clothes"],["What does her father say giving is?","a duty and a joy","a waste","boring"]],
  r:"Giving is an important value in Islam and in many cultures around the world. It can take many forms. You can donate money, but you can also donate your time by volunteering, your skills by teaching someone, or simply your kindness by listening to a friend. Research has shown that people who give regularly tend to be happier and healthier. Giving also builds stronger communities, because people know they can rely on each other. Even a small act, like sharing your lunch with a hungry classmate, can make a big difference.",
  rq:[["What can you donate besides money?","your time, your skills and your kindness","only old toys","nothing"],["What has research shown?","People who give regularly tend to be happier.","Giving makes people poor.","Giving is tiring."],["What does giving build?","stronger communities","bigger houses","more shops"]]},
 {en:"Planning a Budget",ar:"وضع ميزانية",v:"budget|ميزانية|📊;income|دخل|💵;expenses|مصاريف|🧾;essential|ضروري|❗;luxury|كماليات|👑;spreadsheet|جدول حسابات|🧮",
  c:[["What is a budget?","It's a plan for how to use your money.","It's a plan for how to use your shoes.","Budget is what."],["What are your biggest expenses?","Snacks at school and books.","Snacks at school and volcanoes.","Expenses is biggest."],["What's the difference between needs and wants?","Needs are essential, wants are extras.","Needs are purple, wants are Tuesday.","Difference is what."],["How can we cut our expenses?","Bring a snack from home instead of buying one.","Bring the school from home instead of buying one.","Cut is expenses how."]],
  l:"Our family made a budget for the summer holiday. We wrote down how much we could spend on travel, food and activities. When the holiday ended, we had spent less than we planned!",
  lq:[["What did the family make a budget for?","the summer holiday","a new car","school"],["What did they write down?","how much they could spend","their favorite food","the weather"],["What happened at the end?","They had spent less than they planned.","They had no money.","They spent double."]],
  r:"A budget is simply a plan for your money. First, write down your income, which is the money you receive. Next, list your expenses, starting with the essential ones. Then decide how much to save before you spend on extras. Many families use a simple rule: about half for needs, part for wants and a part for savings. Keeping track of small expenses is important, because they add up quickly. A budget isn't about stopping all fun; it's about making sure your money goes where it matters most to you.",
  rq:[["What is income?","the money you receive","the money you spend","a bank"],["Why is tracking small expenses important?","They add up quickly.","They are not important.","They disappear."],["What is a budget about?","making sure your money goes where it matters most","stopping all fun","spending everything"]]}

 {en:"Ibn Sina",ar:"ابن سينا",v:"physician|طبيب|👨‍⚕️;medicine|طب|💊;heal|يشفي|🩹;scholar|عالِم|🎓;encyclopedia|موسوعة|📖;disease|مرض|🤒",
  c:[["Who was Ibn Sina?","He was a famous physician and scholar.","He was a famous pilot and baker.","Ibn Sina is who."],["What is his most famous book?","The Canon of Medicine.","The Canon of Sandwiches.","Book is famous his."],["How long was his book used in universities?","It was used for about six hundred years.","It was used for about six minutes.","Book is used long."],["What can we learn from his life?","That curiosity and hard work lead to great things.","That curiosity and hard work lead to purple things.","Learn is life his."]],
  l:"Ibn Sina was born more than a thousand years ago near Bukhara. By the age of ten, he had memorised the Quran. By eighteen, he was already a respected doctor.",
  lq:[["Where was Ibn Sina born?","near Bukhara","in Cairo","in Baghdad"],["What had he done by the age of ten?","memorised the Quran","written a book","become a doctor"],["What was he by eighteen?","a respected doctor","a king","a sailor"]],
  r:"Ibn Sina, known in Europe as Avicenna, was one of the greatest scientists of the Islamic golden age. He wrote more than two hundred books on medicine, philosophy, astronomy and mathematics. His most famous work, The Canon of Medicine, collected everything that was known about medicine at that time. He described how diseases could spread through water and soil and stressed the importance of testing medicines carefully. The book was translated into Latin and used in European universities until the seventeenth century. Today, many hospitals and schools are named after him.",
  rq:[["What was Ibn Sina known as in Europe?","Avicenna","Ibn Sandwich","Al-Kindi"],["How many books did he write?","more than two hundred","two","twenty"],["Until when was his book used in Europe?","until the seventeenth century","until last year","only one year"]]},
 {en:"Al-Khwarizmi",ar:"الخوارزمي",v:"algebra|الجبر|➗;algorithm|خوارزمية|🔁;zero|صفر|0️⃣;digits|أرقام|🔢;calculate|يحسب|🧮;mathematician|عالم رياضيات|🧑‍🏫",
  c:[["Who was Al-Khwarizmi?","He was a great mathematician from Baghdad.","He was a great mathematician from Jupiter.","Al-Khwarizmi is who."],["Which word comes from his name?","The word algorithm comes from his name.","The word sandwich comes from his name.","Word is name his."],["What does algebra help us do?","It helps us find unknown numbers.","It helps us find unknown socks.","Algebra is helping what."],["Do you like mathematics?","Yes, solving problems is like a puzzle.","Yes, solving problems is like a pillow.","Mathematics is liking."]],
  l:"Al-Khwarizmi worked in the House of Wisdom in Baghdad about twelve hundred years ago. He wrote a book that gave algebra its name. His work helped bring Arabic numerals to Europe.",
  lq:[["Where did Al-Khwarizmi work?","in the House of Wisdom in Baghdad","in a hospital in Cairo","on a ship"],["What did his book give its name to?","algebra","geometry","astronomy"],["What did his work help bring to Europe?","Arabic numerals","coffee","paper"]],
  r:"Imagine trying to multiply large numbers using Roman numerals like MCMXCIV. It would be extremely difficult. The number system we use today, with ten digits and a zero, came from India and was spread to the world largely through the work of Al-Khwarizmi. His book on calculation explained how to use these numbers. Another book introduced algebra, a way of solving problems with unknown values. Centuries later, the step-by-step methods he described inspired the word algorithm. Every time you use a computer, you are benefiting from ideas that go back to him.",
  rq:[["Why would Roman numerals be difficult?","Multiplying large numbers would be extremely difficult.","They are too small.","They have no letters."],["Where did the number system come from originally?","India","Rome","Greece"],["What word did his methods inspire?","algorithm","algebra only","alphabet"]]},
 {en:"Ibn Battuta",ar:"ابن بطوطة",v:"traveller|رحّالة|🧳;kingdom|مملكة|🏰;diary|مذكرات|📔;adventure|مغامرة|🗺️;pilgrimage|حج|🕋;continent|قارة|🌏",
  c:[["Who was Ibn Battuta?","He was one of the greatest travellers in history.","He was one of the greatest bananas in history.","Ibn Battuta is who."],["Why did he start his journey?","He set out to perform the pilgrimage to Makkah.","He set out to find the best pizza.","Journey is starting why."],["How long did he travel?","He travelled for almost thirty years.","He travelled for almost thirty minutes.","Travel is long how."],["Which places did he visit?","He visited Africa, India, China and many other lands.","He visited Mars, Jupiter and the fridge.","Places is visiting which."]],
  l:"In thirteen twenty-five, a young man from Tangier left home to go to Makkah. His name was Ibn Battuta. He did not return for almost thirty years. He travelled about one hundred and twenty thousand kilometres.",
  lq:[["Where was Ibn Battuta from?","Tangier","Cairo","Damascus"],["Where was he going?","to Makkah","to China","to London"],["How far did he travel?","about one hundred and twenty thousand kilometres","about one thousand kilometres","about twelve kilometres"]],
  r:"Ibn Battuta's journeys took him further than any other known traveller before modern times. He crossed deserts with caravans, sailed on ships across the Indian Ocean and worked as a judge in the Maldives and in India. Everywhere he went, he observed the customs, food and clothes of local people. When he finally returned to Morocco, the sultan asked him to tell his story to a writer. The result was a famous book known as the Rihla, which means The Journey. It is still read today and gives historians a precious picture of the world seven hundred years ago.",
  rq:[["What did he work as in the Maldives?","a judge","a fisherman","a teacher"],["What did he observe everywhere?","customs, food and clothes","only buildings","the weather"],["What does Rihla mean?","The Journey","The King","The Sea"]]},
 {en:"Fatima al-Fihri",ar:"فاطمة الفهرية",v:"university|جامعة|🎓;found|يؤسس|🧱;education|تعليم|📚;oldest|الأقدم|🏛️;inheritance|ميراث|💰;students|طلاب|👩‍🎓",
  c:[["Who founded the oldest university in the world?","Fatima al-Fihri founded it in Fez.","Fatima al-Fihri founded it in my backpack.","University is founding who."],["When was it founded?","It was founded in the year eight hundred and fifty-nine.","It was founded in the year banana.","Founded is when it."],["How did she pay for it?","She used the money she inherited from her father.","She used the money she found in the clouds.","Pay is how she."],["Is the university still open today?","Yes, students still study there today.","Yes, penguins still study there today.","Open is university still."]],
  l:"Fatima al-Fihri moved with her family from Tunisia to Fez in Morocco. When her father died, she inherited a lot of money. She decided to use it to build a mosque and a place of learning for her community.",
  lq:[["Where did her family move from?","Tunisia","Egypt","Spain"],["What did she inherit?","a lot of money","a ship","a palace"],["What did she decide to build?","a mosque and a place of learning","a market","a palace"]],
  r:"The University of al-Qarawiyyin in Fez is recognised as the oldest existing university in the world that is still teaching students. It was founded in eight hundred and fifty-nine by Fatima al-Fihri, a well-educated woman who believed that knowledge should be available to everyone. At first, it was a mosque where people studied religion. Over time, subjects such as mathematics, medicine, astronomy and grammar were added. Scholars travelled from far away to study there. Fatima's story reminds us that one person's vision can benefit people for more than a thousand years.",

  r:"Marie Curie was the first woman to win a Nobel Prize and the only person to win Nobel Prizes in two different sciences, physics and chemistry. Working with her husband Pierre in a small, cold laboratory, she discovered two new elements, polonium and radium. Her research on radioactivity led to new ways of treating illnesses. During the First World War, she created mobile X-ray units to help doctors treat injured soldiers. At that time, scientists did not know how dangerous radiation was, and her health suffered. Her notebooks are still kept in special boxes today.",

 {en:"Fact or Opinion",ar:"حقيقة أم رأي",v:"fact|حقيقة|📏;opinion|رأي|💭;prove|يُثبت|✔️;evidence|دليل|🔍;source|مصدر|📰;check|يتحقق|☑️",
  c:[["Is that a fact or an opinion?","It's an opinion, because people can disagree.","It's an opinion, because it is a sandwich.","Fact is opinion that."],["How can you check if something is a fact?","Look for evidence from reliable sources.","Look for evidence under your pillow.","Check is fact how."],["Is it a fact that Riyadh is the capital?","Yes, that can be proved.","Yes, that can be eaten.","Capital is fact Riyadh."],["Is chocolate ice cream the best flavour?","That's just your opinion!","That's just your volcano!","Flavour is best opinion."]],
  l:"The teacher wrote two sentences on the board. Water boils at one hundred degrees. Summer is the best season. She asked: which one is a fact and which one is an opinion?",
  lq:[["What did the teacher write?","two sentences","a poem","a list of words"],["Which sentence is a fact?","Water boils at one hundred degrees.","Summer is the best season.","both sentences"],["What did she ask?","which one is a fact and which one is an opinion","what the weather is","who is the best"]],
  r:"Every day, we read and hear thousands of statements. Some are facts, which can be checked and proved, like the Earth goes around the sun. Others are opinions, which express feelings or beliefs, like football is the most exciting sport. Problems start when opinions are presented as if they were facts. Advertisements often do this, for example by saying that a product is the best in the world. A clear thinker asks: how do you know? Who says so? What is the evidence? Learning to separate facts from opinions helps us make better decisions.",
  rq:[["What is a fact?","something that can be checked and proved","a feeling","a belief"],["What do advertisements often do?","present opinions as facts","tell only facts","say nothing"],["What questions does a clear thinker ask?","How do you know? What is the evidence?","Where is the shop?","What time is it?"]]},
 {en:"Cause and Effect",ar:"السبب والنتيجة",v:"cause|سبب|➡️;effect|أثر|💥;result|نتيجة|🎯;reason|سبب|🧠;chain|سلسلة|⛓️;consequence|عاقبة|⚠️",
  c:[["Why is the floor wet?","Because the window was open when it rained.","Because the floor was thirsty.","Floor is wet why."],["What was the effect of the storm?","Many trees fell and roads were closed.","Many trees laughed and roads were purple.","Effect is storm what."],["What happens if you don't water plants?","As a result, they dry up and die.","As a result, they start playing chess.","Plants is watering what."],["Can one small cause have big effects?","Yes, it can start a chain of events.","Yes, it can start a chain of sandwiches.","Cause is small big."]],
  l:"Faisal forgot to set his alarm. As a result, he woke up late. Because he was late, he missed the bus. So his father had to drive him to school.",
  lq:[["What did Faisal forget?","to set his alarm","his lunch","his homework"],["What was the result?","He woke up late.","He woke up early.","He slept at school."],["Who drove him to school?","his father","his mother","a taxi driver"]],
  r:"Understanding cause and effect is one of the most powerful thinking tools. A cause is why something happens, and an effect is what happens as a result. Sometimes one cause has many effects. For example, heavy rain can cause floods, closed roads and late buses. Other times, many causes work together to produce one effect. Scientists, doctors and detectives all look for causes. But be careful: just because two things happen together does not mean that one caused the other. Thinking carefully about causes helps us solve problems at their roots.",
  rq:[["What is an effect?","what happens as a result","why something happens","a type of weather"],["What can heavy rain cause?","floods, closed roads and late buses","sunshine","snow"],["What should we be careful about?","Two things happening together does not mean one caused the other.","Effects never have causes.","Rain is always good."]]},
 {en:"Spotting a Trick",ar:"اكتشاف الخدعة",v:"fake|مزيّف|🃏;scam|احتيال|🚫;suspicious|مثير للشك|🤨;advert|إعلان|📺;headline|عنوان خبر|🗞️;careful|حذر|⚠️",
  c:[["Is this message real or fake?","It looks fake. It asks for your password.","It looks fake. It asks for your banana.","Message is fake real."],["Why do adverts use famous people?","To make us trust the product more.","To make the product taste like stars.","Adverts is using why."],["What should you do if something sounds too good to be true?","Be suspicious and ask an adult.","Click on it immediately and share it.","True is too good."],["How can you check if a photo is real?","Search for it online to see where it came from.","Search for it in the fridge to see where it came from.","Photo is real checking."]],
  l:"Reem received a message saying she had won a new phone. She only had to click a link and enter her parents' bank details. Reem showed the message to her mother. It was a scam.",
  lq:[["What did the message say?","She had won a new phone.","Her school was closed.","Her friend was coming."],["What did she have to enter?","her parents' bank details","her favourite colour","her age"],["What was it?","a scam","a real prize","a joke from her brother"]],
  r:"Tricks to fool people are not new, but the internet has made them easier to spread. Fake news stories often have shocking headlines designed to make you angry or excited, so that you share them quickly without thinking. Scam messages try to rush you with phrases like act now or only today. Clever adverts may show only the good side of a product. To protect yourself, slow down. Check who wrote the information, look for the same news on trusted websites and never share personal details with strangers. Being careful is not the same as being afraid; it is being smart.",

 {en:"Changing Your Mind",ar:"تغيير رأيك",v:"open-minded|منفتح|🔓;admit|يعترف|🙋;wrong|مخطئ|❌;flexible|مرن|🧘;reconsider|يعيد النظر|🔄;stubborn|عنيد|🐂",
  c:[["Why did you change your mind?","Because I learned some new information.","Because my mind was too heavy.","Mind is changing why."],["Is it weak to admit you were wrong?","No, it takes courage to admit mistakes.","No, it takes bananas to admit mistakes.","Wrong is admitting weak."],["What does open-minded mean?","It means being ready to consider new ideas.","It means having a door in your head.","Open is minded what."],["Have you ever changed your opinion about a food?","Yes, I used to hate olives, but now I love them.","Yes, I used to hate olives, but now I am them.","Food is opinion changed."]],
  l:"At first, Ahmed thought that bats were scary. Then he read a book about them. He learned that bats eat insects and help plants grow. Now he thinks bats are amazing.",

  r:"Many people find it hard to change their minds, even when they meet good evidence. Psychologists say that we often look only for information that agrees with what we already believe. Great thinkers, however, are willing to update their ideas. Scientists change their theories when new experiments give different results. In fact, that is how science moves forward. Changing your mind is not a sign of weakness; it shows that you are learning. A good habit is to ask yourself sometimes: what would make me think differently?",
  rq:[["What do we often look for?","information that agrees with what we believe","new ideas only","nothing"],["When do scientists change their theories?","when new experiments give different results","every week","never"],["What does changing your mind show?","that you are learning","weakness","anger"]]},
 {en:"Two Sides",ar:"وجهتا نظر",v:"debate|مناظرة|🎙️;pros|إيجابيات|➕;cons|سلبيات|➖;balance|توازن|⚖️;side|جانب|↔️;conclusion|استنتاج|🏁",
  c:[["What are the pros of homework?","It helps us practise what we learned.","It helps us practise flying.","Pros is homework what."],["And what are the cons?","It can take time away from play and family.","It can take time away from the moon.","Cons is what and."],["Why should we listen to both sides?","So we understand the whole picture.","So we can sleep during the debate.","Sides is listening why."],["What's your conclusion?","A little homework is useful, but not too much.","A little homework is useful, but not too purple.","Conclusion is what."]],
  l:"In the debate club, the topic was: should children have phones? Sara spoke about safety and staying in touch. Omar spoke about screen time and sleep. In the end, the class agreed that rules are important.",

  r:"Most important questions have more than one side. Should cities build more roads or more train lines? Should students wear uniforms? A fair thinker explores the arguments on both sides before reaching a conclusion. One useful method is to draw two columns and list the pros and cons. Then try to explain the other side's view so well that they would agree with your summary. This shows that you truly understand it. Sometimes the best answer is a balance that takes the strongest points from both sides.",

 {en:"A Good Decision",ar:"قرار حكيم",v:"option|خيار|🔀;risk|مخاطرة|🎲;regret|يندم|😔;wise|حكيم|🦉;consequences|عواقب|⚠️;weigh|يوازن|⚖️",

  l:"Nora had to choose between the science club and the art club. She made a list of what she liked about each one. She asked her older sister for advice. Finally, she chose science, but she still draws at home.",

  r:"Good decisions rarely happen by luck. A simple method can help. First, define the decision clearly. Second, list your options, even ones that seem unusual. Third, think about the likely consequences of each option, for you and for others. Fourth, ask for advice from people you trust. Finally, make your choice and act on it. Even with a good method, some decisions will turn out badly, because the future is uncertain. That is okay. What matters is that you thought carefully, and that you learn from the result for next time.",

/* No page needed for these: tools/ollie-check.js runs them over every lesson. */
const V=L=>L.vs||(L.vs=L.v.split(';').map(s=>{const[en,ar,em]=s.split('|');return{en,ar,em}}));
const splitS=text=>(String(text).match(/[^.!?]+[.!?]*['"]?/g)||[String(text)]).map(x=>x.trim()).filter(Boolean);
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const hasWord=(s,w)=>new RegExp('(^|[^A-Za-z])'+escRe(w)+'(?![A-Za-z])','i').test(s);
/* which of a lesson's words each letter game can use */
const wordsFor={
 unscramble:L=>V(L).filter(v=>/^[a-z]{3,11}$/i.test(v.en)),
 spell:L=>V(L).filter(v=>/^[a-z' ]+$/i.test(v.en)),
 balloons:L=>V(L).filter(v=>/^[a-z][a-z' -]*$/i.test(v.en)&&v.en.length<=14&&v.en.replace(/[^a-z]/gi,'').length>=3),
 search:L=>V(L).filter(v=>/^[a-z]{3,8}$/i.test(v.en))
};
const sentFor=L=>{const all=(L.c||[]).map(c=>c[1]).filter(x=>x.split(' ').length<=14),good=all.filter(x=>x.split(' ').length>=3);return good.length>=2?good:all};
/* Missing-word items: a sentence of the lesson with one word taken out. A lesson word is taken when the
   sentence has one; otherwise its longest ordinary word. `opts` are wrong choices that are not in the sentence. */
const STOP=new Set("the a an and or but is are am was were be been to of in on at for with from by it its this that these those he she we they you i my your his her our their not no yes do does did have has had can will would could should very too so as if then than there here what when where who why how me him them us about into after before because every some many much more most also just only still even".split(' '));
function gapItems(L){
 if(!L.c||!L.l||!L.r)return[];
 const vs=V(L),pool=[...new Set([...L.c.map(c=>c[1]),...splitS(L.l),...splitS(L.r)])].filter(s=>{const n=s.split(' ').length;return n>=4&&n<=16&&!/['"]$/.test(s)});
 const strong=[...new Set(pool.flatMap(s=>(s.match(/[A-Za-z]+/g)||[]).slice(1)).filter(w=>w.length>=4&&w===w.toLowerCase()&&!STOP.has(w)))];
 const voc=[],rest=[];
 for(const s of pool){
  let it=null;
  for(const v of vs){const m=new RegExp('(^|[^A-Za-z])('+escRe(v.en)+')(?![A-Za-z])','i').exec(s);if(!m)continue;
   const opts=vs.filter(x=>x!==v&&!hasWord(s,x.en)).map(x=>x.en);
   if(opts.length>=3){it={s,at:m.index+m[1].length,word:m[2],opts,voc:v.en};break}}
  if(it){voc.push(it);continue}
  const cand=[...s.matchAll(/[A-Za-z]+/g)].filter(m=>m.index>0&&m[0].length>=4&&m[0]===m[0].toLowerCase()&&!STOP.has(m[0])&&s[m.index-1]!=="'"&&s[m.index+m[0].length]!=="'").sort((a,b)=>b[0].length-a[0].length)[0];
  if(!cand)continue;
  const w=cand[0],opts=strong.filter(x=>x!==w&&!hasWord(s,x)&&Math.abs(x.length-w.length)<=3);
  if(opts.length>=3)rest.push({s,at:cand.index,word:w,opts});
 }
 return [...voc,...rest];
}
wordsFor.letter=L=>V(L).filter(v=>/^[a-z]{3,10}$/i.test(v.en));
/* sentences of a lesson that a child can tell apart by ear: its answers and the sentences of its two texts */
/* quotation marks in a piece of text (apostrophes inside words are not counted): an odd number means it was cut inside a quotation */
const quoteMarks=s=>(s.match(/(^|[^A-Za-z])'|'(?![A-Za-z])|"/g)||[]).length;
const hearPool=L=>!L.c||!L.l||!L.r?[]:[...new Set([...L.c.map(c=>c[1]),...splitS(L.l),...splitS(L.r)])].filter(s=>{const n=s.split(' ').length;return n>=3&&n<=14&&quoteMarks(s)%2===0});
/* the lesson's story (then its listening text) cut into runs of four sentences in a row, two runs at most */
const orderSets=L=>{const out=[];for(const t of [L.r,L.l]){const ss=splitS(t||'');
 for(let k=0;k+4<=ss.length&&out.length<2;){const run=ss.slice(k,k+4);if(new Set(run).size===4&&run.every(s=>s.split(' ').length<=20&&quoteMarks(s)%2===0)){out.push(run);k+=4}else k++}}return out};
function canPlay(g,L){switch(g){
 case'unscramble':case'spell':case'balloons':case'search':case'letter':return wordsFor[g](L).length>=3;
 case'sentence':return sentFor(L).length>=2;
 case'gap':return gapItems(L).length>=4;
 case'hear':return hearPool(L).length>=5;
 case'order':return orderSets(L).length>=1;
 case'bingo':return V(L).length>=5;
 default:return V(L).length>=4}}
/*PURE-END*/

const VDIR='ollie/voices';
const VO={ctx:null,man:null,load:null,buf:new Map(),tok:0,src:null,done:null,end:null,noise:null,warned:0};
const SPEECH=!!(window.AudioContext||window.webkitAudioContext);
function loadMan(){
 if(VO.man)return Promise.resolve(VO.man);
 if(location.protocol==='file:')return Promise.resolve(null);
 return VO.load||(VO.load=fetch(VDIR+'/part'+PART+'.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(m=>VO.man=m).catch(()=>{VO.load=null;return null}));
}
loadMan();
function unlockSpeech(){
 if(!SPEECH)return;
 try{
  if(!VO.ctx){VO.ctx=new(window.AudioContext||window.webkitAudioContext)();
   /* iPhone: play like a video does, so the silent switch does not mute Ollie */
   try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}}
  if(VO.ctx.state!=='running'&&VO.ctx.state!=='closed')VO.ctx.resume();
 }catch(e){}
}
['pointerdown','touchend','keydown'].forEach(ev=>document.addEventListener(ev,unlockSpeech,{capture:true,passive:true}));
function clipFor(t,slow){const m=VO.man;if(!m)return null;let id=m.s[t]||m.w[t.toLowerCase()]||m.w[t.replace(/[^A-Za-z0-9' -]/g,'').trim().toLowerCase()];
 if(!id)return null;return slow&&m.slow.includes(id)?id+'-slow':id}
function clipBuf(id){
 const hit=VO.buf.get(id);if(hit){VO.buf.delete(id);VO.buf.set(id,hit);return hit}
 const p=fetch(VDIR+'/'+id+'.mp3').then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()})
  .then(a=>new Promise((ok,no)=>{const q=VO.ctx.decodeAudioData(a,ok,no);if(q&&q.then)q.then(ok,no)}));
 p.catch(()=>VO.buf.delete(id));
 VO.buf.set(id,p);
 if(VO.buf.size>70)VO.buf.delete(VO.buf.keys().next().value);   /* keep the newest clips only */
 return p;
}
/* fetch a lesson's clips before they are needed, so Ollie answers at once */
function warm(texts){
 if(!SPEECH)return;
 loadMan().then(m=>{if(!m||!VO.ctx)return;texts.flatMap(splitS).slice(0,40).forEach(t=>{const id=clipFor(t);if(id)clipBuf(id).catch(()=>{})})});
}
function stopVoice(){
 VO.tok++;const s=VO.src,d=VO.done,e=VO.end;VO.src=VO.done=VO.end=null;
 if(s){s.onended=null;try{s.stop()}catch(x){}}
 if(d)d();if(e)e();
}
function playBuf(b){return new Promise(done=>{const s=VO.ctx.createBufferSource();s.buffer=b;s.connect(VO.ctx.destination);
 VO.src=s;VO.done=done;s.onended=()=>{if(VO.src===s){VO.src=null;VO.done=null}done()};s.start()})}
function voiceWarn(){const now=Date.now();if(now-VO.warned<6000)return;VO.warned=now;
 toast(location.protocol==='file:'?'الصوت يعمل عند فتح الصفحة من رابطها على الإنترنت.':'تعذّر تحميل صوت أولي. تأكد من الإنترنت ثم حاول مرة أخرى.')}
/* say(text) plays the text sentence by sentence and resolves when it ends or is interrupted.
   o.rate<.8 picks the slow recording where there is one; o.onPart(k) fires as sentence k starts; o.onEnd() always fires once. */
function say(text,o={}){
 if(!SPEECH){toast('الصوت غير مدعوم في هذا المتصفح. جرّب Safari أو Chrome.');return Promise.resolve(false)}
 unlockSpeech();stopVoice();const tok=VO.tok;VO.end=o.onEnd||null;
 const fin=ok=>{if(tok===VO.tok&&VO.end){const e=VO.end;VO.end=null;e()}return ok};
 return (async()=>{
  const m=await loadMan();if(tok!==VO.tok)return false;
  if(!m||!VO.ctx){voiceWarn();return fin(false)}
  const slow=(o.rate||1)<.8,ids=splitS(text).map(t=>clipFor(t,slow));
  const bufs=ids.map(id=>id?clipBuf(id).catch(()=>null):null);
  let any=false,bad=false;
  for(let k=0;k<ids.length;k++){
   const b=await bufs[k];if(tok!==VO.tok)return false;
   if(!b){if(ids[k])bad=true;continue}
   if(any)await wait(180);if(tok!==VO.tok)return false;
   any=true;if(o.onPart)o.onPart(k);
   await playBuf(b);if(tok!==VO.tok)return false;
  }
  if(!any&&bad)voiceWarn();
  return fin(any);
 })();
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-say]');if(!t)return;
 t.classList.add('speaking');say(t.dataset.say).then(()=>t.classList.remove('speaking'))});

/* ---------- sound effects: short noise bursts (no notes, no tunes) ---------- */
function burst(at,dur,type,freq,q,vol){
 const c=VO.ctx;if(!VO.noise){const n=c.createBuffer(1,c.sampleRate*.5|0,c.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;VO.noise=n}
 const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
 s.buffer=VO.noise;f.type=type;f.frequency.value=freq;f.Q.value=q;
 g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(vol,at+.008);g.gain.exponentialRampToValueAtTime(.0001,at+dur);
 s.connect(f);f.connect(g);g.connect(c.destination);s.start(at,Math.random()*.3);s.stop(at+dur+.02);
}
function sfx(kind){
 if(!SPEECH)return;
 try{unlockSpeech();const c=VO.ctx;if(!c||c.state!=='running')return;const t=c.currentTime+.01;
  if(kind==='ok'){burst(t,.045,'bandpass',1500,1.4,1.5);burst(t+.08,.07,'bandpass',2300,1.4,1.3)}   /* two soft clicks */
  else if(kind==='no')burst(t,.2,'lowpass',240,.7,2.8);                                          /* a low thud */
  else if(kind==='tap')burst(t,.035,'bandpass',1700,1,.6);
  else if(kind==='pop')burst(t,.08,'bandpass',800,1.6,2.6);
  else if(kind==='win')for(let k=0;k<14;k++)burst(t+k*.055+Math.random()*.03,.05,'bandpass',1200+Math.random()*1800,1,.7);   /* like clapping */
 }catch(e){}
}

/* ---------- microphone: the child says the reply and the browser writes down what it heard ----------
   The browser's own speech recognition, only on a tap of the mic button; nothing is kept or sent by this page. */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let MIC=null;
function micOff(){if(MIC){const m=MIC;MIC=null;try{m.onresult=m.onerror=m.onend=null;m.abort()}catch(e){}}}
const spokenWords=t=>t.toLowerCase().replace(/[^a-z0-9' ]/g,' ').split(/\s+/).filter(Boolean);
/* how much of the wanted sentence was heard, 0 to 1 */
const heardScore=(said,want)=>{const w=spokenWords(want),s=spokenWords(said);return w.length?w.filter(x=>s.includes(x)).length/w.length:0};
/* listens once; calls back with ('ok'|'again'|'silent'|'blocked'|'error', what was heard) */
function micListen(want,done){
 micOff();stopVoice();let got=false;const rec=new SR();MIC=rec;rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=4;
 rec.onresult=e=>{got=true;const alts=[...e.results[0]].map(a=>a.transcript),best=alts.sort((a,b)=>heardScore(b,want)-heardScore(a,want))[0]||'';
  done(heardScore(best,want)>=.6?'ok':'again',best)};
 rec.onerror=e=>{if(got)return;got=true;done(e.error==='not-allowed'||e.error==='service-not-allowed'?'blocked':e.error==='no-speech'?'silent':'error','')};
 rec.onend=()=>{if(MIC===rec)MIC=null;if(!got)done('silent','')};
 try{rec.start()}catch(e){MIC=null;done('error','')}
}

 for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!grid[r][c])grid[r][c]=AB[Math.random()*AB.length|0];
 let mis=0,a=null,drag=false,moved=false,armed=false,sel=[],over=false;
 G(`<p class="tip">ابحث عن كلمات الدرس بين الحروف: اسحب إصبعك فوق الكلمة، أو اضغط أول حرف ثم آخر حرف.</p>

function rush(){
 stopAll();const token=RUN,pool=openWords(),T=60000,t0=performance.now();let score=0,n=0,over=false,bag=[];
 h('تحدي الدقيقة',home,`<div class="pane"><div class="boss-head"><b id="bn"></b><span id="bs" class="pill">✔ 0</span></div><div class="timer"><span id="tb"></span></div><div id="bq" class="pane"></div></div>`);
 say(pick(SAY.go));
 function q(){
  if(token!==RUN||over)return;if(!bag.length)bag=shuffle(pool);const v=bag.pop();let lock=false;
  const btns=askCard($('#bq'),v,pool,[0,2,0,3][n++%4]);
  btns.forEach(b=>b.onclick=()=>{if(over||lock)return;lock=true;
   if(b.dataset.en===v.en){b.classList.add('right');$('#bs').textContent=`✔ ${++score}`;ding();hit(v.en);setTimeout(q,230)}
   else{b.classList.add('wrong');buzz();miss(v.en);btns.forEach(x=>{if(x.dataset.en===v.en)x.classList.add('right')});setTimeout(q,1100)}});
 }

}

  if(token!==RUN)return;if(k>=deck.length)return end();const v=deck[k];
  h(title,lesson,`<div class="pane"><p class="tip">انظر إلى الصورة وقل اسمها بالإنجليزية، ثم اقلب البطاقة لتتأكد. (${k+1} من ${deck.length})</p>
   <button class="flash" id="fc"><span class="ff"><span class="big-em">${v.em}</span><b>${esc(v.ar)}</b><small>اضغط لتقلب البطاقة</small></span><span class="fb"><span class="big-em">${v.em}</span><b dir="ltr">${esc(v.en)}</b><small>${esc(v.ar)} · اضغط لتسمعها مرة أخرى</small></span></button>
   <div class="btns" id="fbt" hidden><button class="ghost" id="fno">↻ أحتاج تدريبًا</button><button class="go" id="fok">✔ أعرفها</button></div></div>`);
  $('#fc').onclick=()=>{$('#fc').classList.add('up');$('#fbt').hidden=false;say(v.en)};
  $('#fok').onclick=()=>{hit(v.en);k++;card()};
  $('#fno').onclick=()=>{miss(v.en);again++;if(deck.length<n0*2)deck.push(v);k++;card()};
 }
 function end(){
  h(title,lesson,`<div class="result"><div class="rushn">🃏</div><h2>أنهيت البطاقات!</h2>
   <p class="muted">${again?'الكلمات التي احتاجت تدريبًا تنتظرك في «قاموسي» لتتدرب عليها.':'عرفت كل الكلمات من أول مرة. رائع!'}</p>
   <div class="btns"><button class="go" id="bk">العب بكلمات الدرس</button><button class="ghost" id="again">البطاقات مرة أخرى</button></div></div>`);
  say(pick(SAY.cards));$('#bk').onclick=lesson;$('#again').onclick=flash;
 }
 card();
}

 <p class="muted" style="text-align:center;margin-top:14px">خزانة واحدة لأجزاء أولي كلها.</p>`);
 $$('.wr').forEach(b=>b.onclick=()=>{const w=WEAR.find(x=>x.id===b.dataset.id);

  if(put){sfx('pop');say(pick(w.slot==='head'?SAY.hat:SAY.look))}});
}

/* ---------- confetti ---------- */
function confetti(){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const cols=['#FFBE2E','#27A85A','#2B6FCC','#E0702A','#6447D1','#DD444A'];
 const ps=Array.from({length:110},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6.28,s:5+Math.random()*6,c:cols[Math.random()*6|0]}));
 const end=performance.now()+2600,run=RUN;
 (function f(now){x.clearRect(0,0,c.width,c.height);if(run!==RUN)return;ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
  if(now<end)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})(performance.now());
}
