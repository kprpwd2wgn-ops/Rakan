<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: one centered column; worlds stack like toy blocks, each world's lessons wind down a path */
:root{
  --bg:#EDF4F9; --paper:#FFFFFF; --ink:#172636; --muted:#5A6C7D; --line:#D4E1EB;
  --sun:#FFBE2E; --sun-deep:#B37600;
  --good:#1C9F5F; --good-soft:#DDF5E8; --bad:#DD444A; --bad-soft:#FCE4E5;
  --lv:#2E8BC9; --lv-deep:#1C5F8C; --lv-soft:#E0EEF8;
  --f-ui:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;
  --f-en:"Andika","Baloo Bhaijaan 2",Verdana,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
[dir="ltr"]{font-family:var(--f-en)}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.fill{fill:currentColor;stroke:none}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;gap:10px;padding-block:10px;background:var(--bg)}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--paper);box-shadow:0 3px 0 var(--line)}
.iconbtn.ph{visibility:hidden}
.bar-t{unicode-bidi:plaintext;flex:1;min-width:0;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.pill{display:flex;align-items:center;gap:4px;background:var(--paper);padding:6px 12px;border-radius:999px;box-shadow:0 3px 0 var(--line);color:var(--sun-deep);font-weight:800;font-variant-numeric:tabular-nums}
.pill .ico{color:var(--sun)}

/* home */
.hero{display:flex;gap:14px;align-items:center;padding-block:8px 18px}
.owl{font-size:58px;line-height:1;width:84px;height:84px;display:grid;place-items:center;background:var(--paper);border-radius:28px;box-shadow:0 5px 0 var(--line);flex:none}
.hello{font-weight:800;font-size:22px}
.hero h1{font-size:17px;font-weight:700;color:var(--lv-deep)}
.muted{color:var(--muted);font-size:14px}
.worlds{display:flex;flex-direction:column;gap:16px}
.world{display:flex;align-items:center;gap:14px;text-align:start;background:var(--paper);border-radius:22px;padding:14px;box-shadow:0 6px 0 var(--lv-deep);border:2px solid var(--lv);transition:transform .12s}
.world:active{transform:translateY(4px);box-shadow:0 2px 0 var(--lv-deep)}
.w-art{font-size:40px;width:66px;height:66px;border-radius:20px;background:var(--lv-soft);display:grid;place-items:center;flex:none}
.w-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.w-txt b{font-size:19px}
.w-txt i{font-style:normal;color:var(--lv-deep);font-weight:700;font-size:14px}
.w-txt small{color:var(--muted);font-size:13px}
.w-num{font-weight:800;color:var(--lv-deep);font-size:13px;position:absolute}
.prog{height:8px;background:var(--lv-soft);border-radius:9px;overflow:hidden;margin-block:4px 2px}
.prog span{display:block;height:100%;background:var(--lv);border-radius:9px}
.locked{filter:grayscale(1);opacity:.55}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.ghost{background:var(--paper);border-radius:14px;padding:10px 14px;font-weight:700;box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.ghost:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.go{background:var(--lv);color:#fff;border-radius:14px;padding:11px 18px;font-weight:800;box-shadow:0 5px 0 var(--lv-deep)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--lv-deep)}
.go:disabled{opacity:.45}

/* level path */
.lv-hero{display:flex;gap:14px;align-items:center;background:var(--lv);color:#fff;border-radius:24px;padding:16px;margin-block:4px 22px;box-shadow:0 6px 0 var(--lv-deep)}
.lv-art{font-size:46px;width:72px;height:72px;border-radius:22px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.04em;opacity:.9}
.lv-hero h1{font-size:24px}
.path{position:relative;display:flex;flex-direction:column;gap:18px;padding-block:6px}
.path::before{content:"";position:absolute;inset-block:30px;inset-inline-start:50%;border-inline-start:4px dashed var(--line)}
.node{position:relative;display:flex;align-items:center;gap:12px;text-align:start;width:min(100%,290px)}
.pos0{margin-inline-start:0}.pos1{margin-inline-start:18%}.pos2{margin-inline-start:34%}.pos3{margin-inline-start:12%}
.disc{width:72px;height:72px;border-radius:50%;background:var(--lv);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:800;box-shadow:0 6px 0 var(--lv-deep);flex:none;border:4px solid var(--paper)}
.node.done .disc{background:var(--sun);color:var(--ink);box-shadow:0 6px 0 var(--sun-deep)}
.node.locked .disc{background:#B8C4CE;box-shadow:0 6px 0 #8E9BA6}
.nlab{background:var(--paper);border-radius:16px;padding:8px 12px;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;min-width:0}
.nlab b{font-size:16px}
.nlab small{color:var(--muted)}
.nst{display:flex;align-items:center;gap:3px;color:var(--sun-deep);font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.nst .ico{width:15px;height:15px;color:var(--sun)}
.node.boss .disc{width:86px;height:86px;background:#1F2A37;color:var(--sun);box-shadow:0 6px 0 #000}
.node.boss .disc .ico{width:38px;height:38px}

/* lesson */
.les-h{padding-block:6px 14px}
.les-h h1{font-size:28px;color:var(--lv-deep)}
.vocab{display:flex;gap:10px;overflow-x:auto;padding-block:4px 12px;margin-bottom:10px;scrollbar-width:thin}
.vw{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--paper);border-radius:16px;padding:10px 12px;min-width:92px;box-shadow:0 4px 0 var(--line)}
.vw .e{font-size:30px;line-height:1.1}
.vw b{font-family:var(--f-en);font-size:15px}
.vw small{color:var(--muted);font-size:12px}
.sec-t{font-weight:800;font-size:15px;color:var(--muted);margin-block:6px 10px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:start;background:var(--paper);border-radius:20px;padding:14px;border:2px solid var(--lv-soft);box-shadow:0 5px 0 var(--lv-soft)}
.act:active{transform:translateY(3px)}
.act .ai{width:46px;height:46px;border-radius:14px;background:var(--lv-soft);color:var(--lv-deep);display:grid;place-items:center}
.act .ai .ico{width:26px;height:26px}
.act b{font-size:17px}
.act small{color:var(--muted);font-family:var(--f-en);font-size:13px}
.stars{display:flex;gap:2px}
.stars .ico{width:18px;height:18px;color:#D3DCE3}
.stars .on{color:var(--sun)}

/* activity panes */
.pane{display:flex;flex-direction:column;gap:14px}
.tip{background:var(--lv-soft);color:var(--lv-deep);border-radius:14px;padding:10px 14px;font-weight:600;font-size:15px}
.chat{display:flex;flex-direction:column;gap:10px;min-height:120px}
.bub{display:flex;align-items:flex-end;gap:8px;max-width:92%}
.bub p{background:var(--paper);border-radius:18px 18px 18px 4px;padding:10px 14px;font-size:18px;box-shadow:0 3px 0 var(--line);min-width:0}
.bub.kid{align-self:flex-end;flex-direction:row-reverse}
.bub.kid p{background:var(--lv);color:#fff;border-radius:18px 18px 4px 18px;box-shadow:0 3px 0 var(--lv-deep)}
.av{font-size:30px;line-height:1;flex:none}
.spk{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--lv-soft);color:var(--lv-deep);flex:none}
.spk.sm{width:34px;height:34px}
.spk.sm .ico{width:18px;height:18px}
.opts,.q-o{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-family:var(--f-en);font-size:17px;box-shadow:0 4px 0 var(--line)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.right{background:var(--good-soft)!important;border-color:var(--good)!important;box-shadow:0 4px 0 var(--good)!important}
.wrong{background:var(--bad-soft)!important;border-color:var(--bad)!important;box-shadow:0 4px 0 var(--bad)!important;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .4s}
.repeat{background:var(--paper);border:2px dashed var(--lv);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns>*{flex:1}
.player{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.play{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--lv);color:#fff;border-radius:18px;padding:14px 20px;font-weight:800;font-size:18px;box-shadow:0 5px 0 var(--lv-deep)}
.play .ico{width:28px;height:28px}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 var(--lv-deep)}
.text{background:var(--paper);border-radius:18px;padding:16px;font-size:20px;line-height:1.75;box-shadow:0 4px 0 var(--line);text-align:left}
.w{border-radius:6px;cursor:pointer}
.w:active{background:var(--sun)}
.q{background:var(--paper);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 0 var(--line)}
.q.ok{outline:2px solid var(--good)}
.q-h{display:flex;gap:10px;align-items:center;font-size:18px;font-weight:700}

/* games */
.g-head{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.g-head span{font-variant-numeric:tabular-nums;color:var(--muted)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{display:flex;flex-direction:column;gap:10px}
.tile{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:10px;font-size:17px;box-shadow:0 4px 0 var(--line);min-height:54px}
.tile.em{font-size:30px;line-height:1}
.tile.em.big{font-size:44px;min-height:92px}
.tile.sel{border-color:var(--lv);box-shadow:0 4px 0 var(--lv);background:var(--lv-soft)}
.tile.gone{visibility:hidden}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{aspect-ratio:3/4;max-width:100%;border-radius:14px;background:var(--lv);color:#fff;display:grid;place-items:center;box-shadow:0 4px 0 var(--lv-deep);font-size:28px;font-weight:800;padding:4px}
.card .front{display:none}
.card.up{background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.card.up .front{display:block}
.card.up .back{display:none}
.card .front.en{font-size:14px;word-break:break-word;line-height:1.2}
.card.got{background:var(--good-soft);border-color:var(--good)}
.clue{display:flex;align-items:center;justify-content:center;gap:14px;background:var(--paper);border-radius:18px;padding:12px;box-shadow:0 4px 0 var(--line);font-weight:700;font-size:18px}
.big-em{font-size:52px;line-height:1}
.slots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;min-height:52px}
.slot{width:40px;height:48px;border-radius:10px;background:var(--paper);border-bottom:4px solid var(--lv);display:grid;place-items:center;font-size:24px;font-weight:700;font-family:var(--f-en)}
.slots.ok .slot{border-color:var(--good);background:var(--good-soft)}
.tiles{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.ltr,.tok{min-width:46px;height:50px;padding:0 12px;border-radius:12px;background:var(--sun);color:var(--ink);font-family:var(--f-en);font-size:22px;font-weight:700;box-shadow:0 4px 0 var(--sun-deep)}
.tok{font-size:17px;height:44px}
.ltr:disabled,.tok:disabled{opacity:.2}
.sent{display:flex;flex-wrap:wrap;gap:8px;min-height:64px;background:var(--paper);border-radius:16px;padding:10px;border:2px dashed var(--line);align-content:flex-start}
.sent .tok{background:var(--lv);color:#fff;box-shadow:0 4px 0 var(--lv-deep)}
.sent.ok{border-color:var(--good);background:var(--good-soft)}
.inp{width:100%;font-family:var(--f-en);font-size:26px;text-align:center;padding:12px;border-radius:14px;border:3px solid var(--line);background:var(--paper);color:var(--ink)}
.hintline{text-align:center;font-size:22px;letter-spacing:.2em;color:var(--lv-deep);min-height:30px}
.target{display:flex;align-items:center;justify-content:center;gap:12px;font-weight:700;font-size:18px}
.field{position:relative;height:340px;border-radius:20px;overflow:hidden;background:linear-gradient(var(--lv-soft),var(--paper));border:2px solid var(--line)}
.bubble{position:absolute;left:0;top:0;padding:10px 14px;border-radius:999px;background:var(--paper);border:3px solid var(--lv);font-family:var(--f-en);font-size:15px;font-weight:700;white-space:nowrap;box-shadow:inset -4px -6px 0 var(--lv-soft)}
.bubble.popped{background:var(--good);color:#fff;border-color:var(--good);transition:opacity .5s;opacity:0}
.bubble.miss{background:var(--bad-soft);border-color:var(--bad);opacity:.5}

/* boss */
.boss-head{display:flex;align-items:center;gap:10px;justify-content:space-between;font-weight:800}
.boss-head .ico{color:var(--sun-deep);width:28px;height:28px}
.timer{height:12px;border-radius:9px;background:var(--line);overflow:hidden}
.timer span{display:block;height:100%;width:100%;background:var(--sun)}
.bprompt{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--paper);border-radius:20px;padding:16px;box-shadow:0 4px 0 var(--line);text-align:center;font-weight:700}
.ar-word{font-size:34px;font-weight:800;color:var(--lv-deep)}
.intro{background:var(--paper);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 5px 0 var(--line)}
.intro ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}

/* result */
.result{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding-block:24px}
.result .bigstars{display:flex;gap:8px}
.result .bigstars .ico{width:64px;height:64px;color:#D3DCE3;animation:pop .5s backwards}
.result .bigstars .on{color:var(--sun)}
.result .bigstars .ico:nth-child(2){animation-delay:.15s}.result .bigstars .ico:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(0)}}
.result h2{font-size:30px}
.result .btns{width:100%;flex-direction:column}

/* words + parents */
.wl{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-bottom:22px}
.wl .vw{min-width:0}
.panel{background:var(--paper);border-radius:20px;padding:16px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.panel h3{font-size:18px}
.panel ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.panel input[type=text]{font:inherit;font-size:18px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700}
.danger{color:var(--bad);border-color:var(--bad-soft)}
.link{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 var(--sun);border:2px solid var(--sun);margin-bottom:18px}
.link .big{font-size:30px;font-weight:800;color:var(--sun-deep);font-variant-numeric:tabular-nums;min-width:40px;text-align:center}
.link small{display:block;color:var(--muted);font-size:13px}
.prog.sun{background:#FFF1CC}.prog.sun span{background:var(--sun)}
a.go{display:inline-block;text-align:center;text-decoration:none}
.gift{background:var(--sun);color:var(--ink);font-weight:800;padding:10px 16px;border-radius:14px;box-shadow:0 4px 0 var(--sun-deep)}
.owl svg{display:block}
.partb{display:inline-block;background:var(--lv-soft);color:var(--lv-deep);font-weight:800;font-size:13px;padding:2px 10px;border-radius:999px;margin-block:2px}
.result a.go{width:100%}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;z-index:20;max-width:calc(100% - 32px);text-align:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:15}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.mem{grid-template-columns:repeat(3,1fr)}.pos2{margin-inline-start:22%}}

/* ===== added with the new games, the daily challenge and the sticker album ===== */
.owl{cursor:pointer}
.owl.hop{animation:hop .5s}
@keyframes hop{30%{transform:translateY(-10px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
/* something is being read aloud */
.speaking{outline:3px solid var(--sun);outline-offset:2px;animation:pulse 1s infinite}
@keyframes pulse{50%{outline-color:transparent}}
.sn{border-radius:6px;transition:background .2s;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sn.on{background:#FFE9A6;box-shadow:0 0 0 3px #FFE9A6}

/* home: daily challenge, shortcuts, parts */
.daily{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:linear-gradient(135deg,#F9813A,#E4532A);color:#fff;border-radius:22px;padding:14px;box-shadow:0 6px 0 #A63A19;margin-bottom:16px}
.daily:active{transform:translateY(4px);box-shadow:0 2px 0 #A63A19}
.daily.done{background:linear-gradient(135deg,#2DB866,#1C9F5F);box-shadow:0 6px 0 #14713F}
.daily.done:active{box-shadow:0 2px 0 #14713F}
.d-ic{font-size:32px;line-height:1;width:58px;height:58px;border-radius:18px;background:rgba(255,255,255,.24);display:grid;place-items:center;flex:none}
.d-t{flex:1;min-width:0;display:flex;flex-direction:column}
.d-t b{font-size:19px}
.d-t small{font-size:13px}
.d-n{display:flex;flex-direction:column;align-items:center;background:rgba(255,255,255,.24);border-radius:16px;padding:6px 10px;flex:none}
.d-n b{font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.d-n small{font-size:11px;white-space:nowrap}
.tiles4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.tile4{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;background:var(--paper);border-radius:16px;padding:10px 2px 8px;box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.tile4:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tile4 span{font-size:26px;line-height:1.15}
.tile4 b{font-size:13px;line-height:1.3}
.tile4 .dot{position:absolute;top:-7px;inset-inline-end:-5px;min-width:22px;height:22px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-style:normal;font-weight:800;font-size:12px;line-height:22px;font-variant-numeric:tabular-nums}
.parts{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:24px}
.parts span{flex-basis:100%;text-align:center;color:var(--muted);font-weight:700;font-size:14px}
.parts a,.parts b{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:800;text-decoration:none;background:var(--paper);color:var(--lv-deep);box-shadow:0 3px 0 var(--line);font-variant-numeric:tabular-nums}
.parts b{background:var(--lv);color:#fff;box-shadow:0 3px 0 var(--lv-deep)}

/* lesson: more games */
.acts+.sec-t{margin-top:24px}
.xg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.xb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;text-align:start;background:var(--paper);border-radius:14px;padding:8px 10px;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);min-height:54px}
.xb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.xb .xe{font-size:22px;line-height:1}
.xb b{font-size:14px;flex:1;min-width:0;line-height:1.3}
.xb .stars .ico{width:13px;height:13px}

/* letter boxes for long words */
.slots.long .slot{width:26px;height:40px;font-size:19px}
.slot.gap{background:none;border-bottom-color:transparent;width:12px}
.slots.words{gap:8px 18px}
.wgrp{display:flex;gap:6px}

/* true or false */
.tfc{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--paper);border-radius:22px;padding:18px;box-shadow:0 5px 0 var(--line);text-align:center}
.tfc .big-em{font-size:64px}
.tfw{font-family:var(--f-en);font-size:30px;line-height:1.2;color:var(--lv-deep)}
.tfb{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf{border-radius:18px;padding:16px 10px;font-size:20px;font-weight:800;color:#fff;border:2px solid transparent}
.tf.yes{background:var(--good);box-shadow:0 5px 0 #14713F}
.tf.no{background:var(--bad);box-shadow:0 5px 0 #8f2226}
.tf:active{transform:translateY(3px)}
.tf.right,.tf.wrong{color:var(--ink)}
.fixline{text-align:center;font-weight:700;min-height:28px;font-size:17px}
.fixline b{font-family:var(--f-en);color:var(--lv-deep)}

/* hide and seek */
.bushes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;background:linear-gradient(#CDEBFF,#E6F6DF 70%);border-radius:20px;padding:14px 10px 10px;border:2px solid var(--line)}
.bush{position:relative;height:116px;overflow:hidden;border-radius:14px}
.bush-art{position:absolute;left:0;right:0;bottom:0;width:100%;height:64px;z-index:1;pointer-events:none}
.peek{position:absolute;left:50%;bottom:46px;font-size:46px;line-height:1.15;transform:translate(-50%,84px);transition:transform .2s cubic-bezier(.3,1.4,.6,1)}
.bush.up .peek{transform:translate(-50%,0)}
.bush.glow .peek{filter:drop-shadow(0 0 7px var(--sun-deep))}
.bush.got .peek{transform:translate(-50%,-4px) scale(1.15)}
.tgw{font-family:var(--f-en);font-size:24px;color:var(--lv-deep)}

/* missing word */
.gapc{display:flex;gap:10px;align-items:flex-start;background:var(--paper);border-radius:18px;padding:14px;box-shadow:0 4px 0 var(--line);text-align:left}
.gapc p{font-family:var(--f-en);font-size:21px;line-height:1.75;flex:1;min-width:0}
.blank{display:inline-block;min-width:76px;border-bottom:4px solid var(--lv);border-radius:6px 6px 0 0;background:var(--lv-soft);text-align:center;padding:0 8px;font-weight:700;line-height:1.35}
.blank.ok{background:var(--good-soft);border-color:var(--good);color:#11663C}
.opt.c{text-align:center;font-weight:700}

/* Ollie's balloons */

  c:[["Is science ever completely certain?","Not always; new evidence can change our ideas.","Not always; new sandwiches can change our ideas.","Certain is science ever."],["What's the difference between a theory and a guess?","A theory is supported by lots of evidence.","A theory is supported by lots of shoes.","Theory is guess difference."],["Is it good to be sceptical?","Yes, as long as you also listen to the evidence.","Yes, as long as you also eat the evidence.","Sceptical is good it."],["Can you name a myth that science has corrected?","People once believed the Earth was flat.","People once believed that clouds were made of cotton candy.","Myth is naming you."]],
  l:"For a long time, people believed that the Earth was the centre of the universe. Careful observations by astronomers showed that the Earth goes around the sun. Science changed its mind because of new evidence.",
  lq:[["What did people believe for a long time?","The Earth was the centre of the universe.","The moon was made of cheese.","The sun was cold."],["What did observations show?","The Earth goes around the sun.","The sun goes around the moon.","The Earth is flat."],["Why did science change its mind?","because of new evidence","because of a king","because of a vote"]],
  r:"Some people think that science is a collection of fixed facts, but it is better described as a method for reducing doubt. Scientists hold their ideas with different levels of confidence. Some ideas, like the Earth orbiting the sun, are supported by so much evidence that they are almost certain. Others are still being tested. Healthy scepticism means asking for evidence before accepting a claim, but it does not mean rejecting everything. When the evidence is strong, a good thinker accepts it, while remaining open to new information. This balance between doubt and trust is what makes science so powerful.",
  rq:[["How is science better described?","a method for reducing doubt","a list of fixed facts","a set of opinions"],["What does healthy scepticism mean?","asking for evidence before accepting a claim","rejecting everything","believing everything"],["What makes science so powerful?","the balance between doubt and trust","its old books","its expensive equipment"]]}

 {en:"Water in the Desert",ar:"الماء في الصحراء",v:"seawater|ماء البحر|🌊;salt|ملح|🧂;pipes|أنابيب|🚰;reuse|يعيد الاستخدام|🔁;plant|محطة|🏭;desalination|تحلية المياه|💧",
  c:[["Where does most of our drinking water come from?","Most of it comes from desalination plants.","Most of it comes from the moon's fridge.","Water is coming where."],["How does desalination work?","Salt is removed from seawater.","Salt is added to the clouds.","Desalination is working how."],["Why is it expensive?","Because it uses a lot of energy.","Because the water wears gold shoes.","Expensive is why it."],["How can cities reuse water?","They can clean waste water and use it for gardens.","They can clean waste water and use it for cakes.","Reuse is cities how."]],
  l:"Saudi Arabia is one of the largest producers of desalinated water in the world. Huge plants on the coasts remove salt from seawater. The fresh water is then pumped through long pipes to cities far inland.",
  lq:[["What is Saudi Arabia one of the largest producers of?","desalinated water","snow","rice"],["Where are the plants?","on the coasts","in the mountains","in the middle of cities"],["How does the water reach cities far inland?","through long pipes","by plane","in bottles"]],
  r:"In a country with very little rain, providing water for millions of people is a remarkable achievement. Desalination plants use either heat or high pressure to separate salt from seawater. The process requires a lot of energy, so engineers are now building plants powered by solar energy to reduce costs and pollution. Cities are also treating used water so that it can irrigate parks and farms. Smart meters help families see how much water they use. Experts agree that technology alone is not enough; every citizen's habits matter too.",

 {en:"Homes That Stay Cool",ar:"بيوت تبقى باردة",v:"courtyard|فناء|🏡;walls|جدران|🧱;roof|سقف|🏠;shade|ظل|🌴;windows|نوافذ|🪟;cool|منعش|❄️",
  c:[["How did old houses stay cool without air conditioning?","They had thick walls, courtyards and wind towers.","They had thick sandwiches and flying carpets.","Houses is cool how."],["What is a wind tower?","A tower that catches the breeze and sends it inside.","A tower that catches the moon and eats it.","Tower is wind what."],["Why are many traditional windows small?","To keep out the strong sun.","To keep out the strong penguins.","Windows is small why."],["Would you like to live in a traditional house?","Yes, I love the cool courtyard with a fountain.","Yes, I love the cool courtyard with a volcano.","House is traditional living."]],
  l:"In old Jeddah, the houses have tall wooden windows called rawashin. They let the sea breeze in while keeping out the sun. People could look outside without being seen.",
  lq:[["What are rawashin?","tall wooden windows","doors","roofs"],["What do they let in?","the sea breeze","the sun","the rain"],["What could people do?","look outside without being seen","fly","see the stars"]],
  r:"Long before electricity, builders in the Gulf designed homes that stayed comfortable in extreme heat. Thick walls made of stone and coral absorbed heat during the day and released it slowly at night. Narrow streets created shade, and inner courtyards with plants cooled the air. Wind towers caught breezes from above and pushed them down into the rooms. Today, architects are rediscovering these ideas. Combined with modern materials, such as reflective roofs and better insulation, they can reduce the need for air conditioning, which uses a large share of electricity in hot countries.",
  rq:[["What did thick walls do?","absorbed heat during the day and released it at night","made noise","kept animals out"],["What did wind towers do?","caught breezes and pushed them into rooms","stored water","held flags"],["Why are architects rediscovering these ideas?","to reduce the need for air conditioning","because they are cheaper to paint","to attract tourists only"]]},
 {en:"Moving Without Cars",ar:"التنقل بلا سيارات",v:"metro|مترو|🚇;scooter|سكوتر|🛴;traffic|ازدحام مروري|🚗;cycle|يركب الدراجة|🚲;pollution|تلوث|🏭;public transport|النقل العام|🚌",
  c:[["How do you get to school?","I take the metro and then walk.","I take the metro and then fly.","School is getting how."],["Why is public transport good for the city?","It reduces traffic and pollution.","It increases traffic and penguins.","Transport is good why."],["Is it safe to cycle in your neighbourhood?","Yes, there are new bike lanes.","Yes, there are new cake lanes.","Cycle is safe."],["What would make you leave the car at home?","Fast and comfortable trains.","Fast and comfortable volcanoes.","Car is leaving what."]],
  l:"The Riyadh Metro has six lines and more than eighty stations. The trains have no drivers; they are controlled by computers. Many people now use it to travel to work and university.",
  lq:[["How many lines does the Riyadh Metro have?","six","two","twenty"],["Who drives the trains?","nobody; computers control them","robots with hats","the passengers"],["Where do many people travel to?","work and university","the beach","the moon"]],
  r:"As cities grow, traffic jams become a serious problem. They waste time, increase pollution and make people stressed. Many cities are responding by investing in public transport, such as metros and rapid bus lines, and by making streets safer for walking and cycling. Some new city designs place schools, shops and parks within a short walk of every home, so that a car is rarely needed. Electric scooters and bike-sharing schemes also help with short journeys. Of course, changing habits takes time, and transport must be reliable and affordable for people to use it.",
  rq:[["What problems do traffic jams cause?","wasted time, pollution and stress","more parks","cheaper food"],["What do some new city designs do?","place schools, shops and parks within a short walk of every home","build more highways","ban walking"],["What must transport be for people to use it?","reliable and affordable","expensive","slow"]]},
 {en:"Farming Indoors",ar:"الزراعة داخل المباني",v:"lettuce|خس|🥬;harvest|حصاد|🧺;greenhouse|بيت محمي|🌿;lights|أضواء|💡;shelves|رفوف|🗄️;sensors|حسّاسات|📡",
  c:[["Can vegetables grow without soil?","Yes, their roots can grow in water with nutrients.","Yes, their roots can grow in chocolate milk.","Vegetables is growing soil."],["Why build farms inside buildings?","To grow food near cities using less water.","To grow food near the moon using more sand.","Farms is building why."],["What replaces the sun in an indoor farm?","Special LED lights.","Special banana lights.","Sun is replacing what."],["Would you eat lettuce from an indoor farm?","Of course, it's fresh and clean.","Of course, it's purple and loud.","Lettuce is eating would."]],
  l:"Near Riyadh, there is a farm inside a large building. Lettuce and herbs grow on tall shelves under pink lights. Sensors check the water and temperature all the time. The farm uses ninety percent less water than a normal farm.",
  lq:[["Where do the plants grow?","on tall shelves inside a building","in a field","on the roof"],["What do sensors check?","the water and temperature","the weather on the moon","the visitors"],["How much less water does the farm use?","ninety percent less","ten percent less","the same"]],
  r:"Vertical farms grow crops in stacked layers inside buildings, often without soil. The plants' roots sit in water mixed with nutrients, and LED lights provide exactly the colours of light they need. Because the environment is controlled, crops can grow all year round without pesticides, and harvests are predictable. These farms use far less water and land than traditional farming, which makes them attractive in desert countries. However, they need a lot of electricity, so the most sustainable ones are powered by renewable energy. Fresh food grown near the city also travels shorter distances, which reduces waste.",
  rq:[["Where do the plants' roots sit in vertical farms?","in water mixed with nutrients","in sand","in air only"],["Why are harvests predictable?","because the environment is controlled","because of luck","because the plants are small"],["What do vertical farms need a lot of?","electricity","land","rain"]]},
 {en:"Waste as a Resource",ar:"النفايات مورد",v:"compost|سماد عضوي|🍂;landfill|مكب نفايات|🚛;metal|معدن|🥫;sort|يفرز|🗂️;resource|مورد|💎;biogas|غاز حيوي|🔥",
  c:[["What happens to our rubbish after the truck takes it?","Much of it goes to a landfill, but some is recycled.","Much of it goes to the moon, but some is eaten.","Rubbish is happening what."],["How can food waste be useful?","It can be turned into compost or biogas.","It can be turned into homework or socks.","Waste is useful how."],["Why should we sort our rubbish?","So that materials can be recycled more easily.","So that rubbish can sleep more easily.","Sort is rubbish why."],["Is waste really a resource?","Yes, many materials can be used again and again.","Yes, many materials can fly again and again.","Resource is waste really."]],
  l:"In our neighbourhood, there are coloured bins for paper, plastic, metal and food waste. The food waste is taken to a plant where it becomes compost for farms. Last year, the neighbourhood recycled half of its rubbish.",
  lq:[["What are the coloured bins for?","paper, plastic, metal and food waste","toys","clothes only"],["What does food waste become?","compost for farms","plastic","fuel for cars"],["How much rubbish did the neighbourhood recycle?","half","all of it","none"]],
  r:"Every year, the world produces more than two billion tonnes of rubbish, and much of it ends up in landfills, where it can pollute soil and water. A circular economy aims to change this by designing products that can be repaired, reused and recycled, so that materials stay in use for as long as possible. Food waste can produce biogas for cooking or electricity, and old electronics contain valuable metals like gold and copper. Some companies now rent products instead of selling them, so they have a reason to make them last. In a circular economy, waste is not the end of a product's life but the beginning of a new one.",
  rq:[["How much rubbish does the world produce each year?","more than two billion tonnes","two thousand tonnes","two tonnes"],["What does a circular economy aim to do?","keep materials in use for as long as possible","produce more rubbish","close all factories"],["What valuable metals do old electronics contain?","gold and copper","iron only","no metals"]]},
 {en:"A City for Everyone",ar:"مدينة للجميع",v:"accessible|سهل الوصول|♿;ramp|منحدر|↗️;elderly|كبار السن|👵;community|مجتمع|🏘️;include|يشمل الجميع|👐;design|يصمم|✏️",
  c:[["What makes a city good for everyone?","Places that are easy to reach for all people, including wheelchair users.","Places that are only open on the moon.","City is everyone good."],["Why are ramps important?","They help people with wheelchairs and pushchairs.","They help people with sandwiches and pillows.","Ramps is important why."],["What can young people do for their community?","Share ideas with the city council and volunteer.","Share ideas with the volcano and sleep.","Community is doing what."],["Is there a park near your house?","Yes, and it has benches in the shade for older people.","Yes, and it has penguins in the oven.","Park is near house."]],
  l:"When the new park opened, the designers had thought of everyone. There were smooth paths for wheelchairs, shaded benches for older people and a playground where children of all abilities could play together.",
  lq:[["Who had the designers thought of?","everyone","only children","only athletes"],["What were the paths like?","smooth for wheelchairs","rocky","made of sand"],["Who could play in the playground?","children of all abilities","only older children","no one"]],
  r:"A truly great city is not measured only by its tall towers but by how well it serves all of its people. Inclusive design means thinking about children, older adults, people with disabilities and visitors who don't speak the local language. Simple features like ramps, clear signs with pictures, shaded seating and safe crossings make a huge difference. Some cities invite residents, including young people, to share ideas about their neighbourhoods. Research shows that when people feel that public spaces belong to them, they look after them better and the whole community becomes stronger.",
  rq:[["How should a great city be measured?","by how well it serves all of its people","by its tall towers only","by its number of cars"],["What does inclusive design mean?","thinking about everyone who uses a place","designing for rich people","designing only for tourists"],["What happens when people feel public spaces belong to them?","They look after them better.","They stop using them.","They move away."]]}

 {en:"Proverbs",ar:"الأمثال",v:"proverb|مَثَل|📜;wisdom|حكمة|🦉;meaning|معنى|💬;saying|قول مأثور|🗣️;lesson|درس|📖;generation|جيل|👪",
  c:[["Do you know any English proverbs?","Yes, actions speak louder than words.","Yes, sandwiches speak louder than Tuesdays.","Proverbs is knowing."],["What does that proverb mean?","It means what you do matters more than what you say.","It means what you eat matters more than the moon.","Proverb is meaning what."],["Is there a similar proverb in Arabic?","Yes, there are many with the same idea.","Yes, there are many with the same banana.","Arabic is proverb similar."],["Why do proverbs last so long?","Because they express wisdom in a few words.","Because they are written on very strong paper.","Proverbs is lasting why."]],
  l:"My grandmother loves proverbs. When I rush, she says: haste makes waste. When I give up, she says: practice makes perfect. Her proverbs always seem to fit the situation.",
  lq:[["Who loves proverbs?","the grandmother","the teacher","the father"],["What does she say when the writer rushes?","haste makes waste","practice makes perfect","time is money"],["What do her proverbs always seem to do?","fit the situation","make people laugh","confuse people"]],
  r:"Proverbs are short sayings that carry the wisdom of many generations. They often use images from everyday life to teach a lesson. For example, the English proverb don't put all your eggs in one basket warns against risking everything on one choice. Arabic has thousands of proverbs, many of them about patience, generosity and friendship. Interestingly, very different cultures often have proverbs with similar meanings, which suggests that people everywhere face similar challenges. Learning proverbs in a new language can help you understand how its speakers think and what they value.",
  rq:[["What do proverbs carry?","the wisdom of many generations","recipes","news"],["What does don't put all your eggs in one basket warn against?","risking everything on one choice","buying eggs","carrying baskets"],["What does it suggest when cultures have similar proverbs?","People everywhere face similar challenges.","Cultures copy each other.","Proverbs are new."]]},
 {en:"Translation",ar:"الترجمة",v:"translate|يترجم|🔤;translator|مترجم|🧑‍💻;dictionary|قاموس|📕;context|سياق|🧩;phrase|عبارة|🗨️;fluent|يتحدث بطلاقة|🎓",
  c:[["Can a computer translate perfectly?","Not always; it often misses the meaning of jokes and idioms.","Not always; it often eats the dictionary.","Computer is translating perfectly."],["Why is context important in translation?","Because the same word can mean different things.","Because the same word can taste different things.","Context is important why."],["How many languages do you speak?","I speak Arabic and English, and I'm learning French.","I speak Arabic and Penguin.","Languages is speaking many."],["What would you like to translate one day?","I'd like to translate children's books.","I'd like to translate my socks.","Translate is liking what."]],
  l:"During the Islamic golden age, the House of Wisdom in Baghdad was full of translators. They translated books of science and philosophy from Greek, Persian and Indian languages into Arabic. Later, many of these books were translated from Arabic into Latin.",
  lq:[["Where were the translators?","in the House of Wisdom in Baghdad","in a castle in Spain","in a ship"],["What did they translate?","books of science and philosophy","only poems","menus"],["What happened later?","Many books were translated from Arabic into Latin.","The books were lost forever.","The books were burned."]],
  r:"Translation is much more than replacing words with other words. A good translator must understand the context, the tone and the culture behind a text. Idioms are especially tricky: the English phrase it's raining cats and dogs simply means it's raining heavily, so translating it word for word would be confusing. Machine translation has improved enormously, but it can still make strange errors, particularly with humour and poetry. Professional translators often say that their job is to make the reader forget that they are reading a translation. Throughout history, translators have built bridges between civilisations.",
  rq:[["What must a good translator understand?","the context, the tone and the culture","only grammar","only vocabulary"],["What does it's raining cats and dogs mean?","It's raining heavily.","Animals are falling.","It's sunny."],["What have translators built throughout history?","bridges between civilisations","walls","cities"]]},
 {en:"Words That Travel",ar:"كلمات مسافرة",v:"coffee|قهوة|☕;sofa|كنبة|🛋️;safari|رحلة سفاري|🦒;cotton|قطن|🧵;magazine|مجلة|📰;lemon|ليمون|🍋",
  c:[["Did you know that coffee is an Arabic word?","Yes, it comes from the Arabic word qahwa.","Yes, it comes from the Arabic word for spaceship.","Coffee is Arabic knowing."],["Which other English words come from Arabic?","Sofa, cotton, magazine and algebra.","Pizza, igloo, kangaroo and snow.","Words is coming which."],["How do words travel between languages?","Through trade, travel and science.","Through clouds, rainbows and soup.","Words is travelling how."],["Are there English words in Arabic too?","Yes, like television and computer.","Yes, like falafel and hummus.","English is words Arabic."]],
  l:"When Arab traders sailed to Europe, they brought goods like sugar, coffee and cotton. The names of these goods travelled with them. Today, English speakers use these Arabic words every day without knowing it.",
  lq:[["Who sailed to Europe?","Arab traders","English kings","Chinese farmers"],["What travelled with the goods?","their names","their colours","their smells"],["How do English speakers use these words?","every day without knowing it","only in books","never"]],
  r:"Languages are like rivers that constantly receive water from other streams. English has borrowed words from more than three hundred and fifty languages. From Arabic alone, it has taken hundreds of words, including algebra, alchemy, admiral, cotton, magazine and sofa. Many of these words arrived through Spain and Italy during the Middle Ages, when Arab scholars and merchants were leading in science and trade. Arabic, in turn, has borrowed words from Persian, Turkish, French and English. Looking at a word's history, called its etymology, is like opening a small window onto the past.",
  rq:[["How many languages has English borrowed words from?","more than three hundred and fifty","three","ten"],["How did many Arabic words reach English?","through Spain and Italy","through the internet","through China"],["What is etymology?","the history of a word","a type of grammar","a dictionary of pictures"]]},
 {en:"Metaphor",ar:"الاستعارة",v:"metaphor|استعارة|🌈;simile|تشبيه|🔗;poem|قصيدة|🖋️;image|صورة|🖼️;describe|يصف|✍️;imagination|خيال|💭",
  c:[["What is a metaphor?","It describes something by calling it something else.","It describes a sandwich by calling it Tuesday.","Metaphor is what."],["What's the difference between a metaphor and a simile?","A simile uses like or as.","A simile uses like a banana.","Difference is simile."],["Can you give me an example of a metaphor?","Time is a thief.","Time is a Thursday.","Example is metaphor."],["Why do poets use metaphors?","To create strong pictures in the reader's mind.","To create strong sandwiches in the reader's bag.","Poets is using why."]],
  l:"Our teacher read a line from a poem: the moon is a silver coin in the sky. She asked us what it meant. Sara said it means the moon is round, shiny and precious.",
  lq:[["What did the teacher read?","a line from a poem","a story","a newspaper"],["What was the moon compared to?","a silver coin","a ball","a lamp"],["What did Sara say it means?","the moon is round, shiny and precious","the moon is money","the moon is small"]],
  r:"We use metaphors far more often than we realise. When we say that someone has a heart of gold, we don't mean that their heart is made of metal; we mean that they are very kind. Metaphors help us understand difficult ideas by connecting them to familiar ones. Scientists use them too: they describe the heart as a pump and DNA as a code. Classical Arabic poetry is famous for its rich imagery, comparing a brave warrior to a lion or a beautiful face to the full moon. Learning to notice metaphors makes us better readers and more creative writers.",
  rq:[["What does someone has a heart of gold mean?","They are very kind.","They are rich.","Their heart is metal."],["How do metaphors help us?","by connecting difficult ideas to familiar ones","by making texts longer","by confusing readers"],["What is classical Arabic poetry famous for?","its rich imagery","its short length","its numbers"]]},
 {en:"Persuasion",ar:"الإقناع",v:"persuade|يقنع|📣;argument|حجة|🧱;convince|يُقنِع تمامًا|🤝;emotion|عاطفة|😢;logic|منطق|🧠;slogan|شعار|🏷️",
  c:[["How can you persuade people to recycle?","Show them facts and explain how it helps everyone.","Show them a dragon and explain how it eats bottles.","Persuade is recycle how."],["What makes an argument strong?","Clear reasons and good evidence.","Loud shouting and long sentences.","Argument is strong what."],["Do adverts use emotions to persuade us?","Yes, they often make us feel happy or worried.","Yes, they often make us feel purple or square.","Adverts is emotions."],["What's a good slogan for saving water?","Every drop counts.","Every drop is a cupcake.","Slogan is good what."]],
  l:"Yousef wanted his school to have a longer break. He collected signatures from one hundred students. He also found research showing that short breaks help students concentrate. The head teacher agreed to try it for a month.",
  lq:[["What did Yousef want?","a longer break","less homework","a new playground"],["How many signatures did he collect?","one hundred","ten","one thousand"],["What did the head teacher agree to?","try it for a month","cancel breaks","give a prize"]],
  r:"Ancient Greek thinkers described three ways to persuade an audience. The first is by showing that you are trustworthy and knowledgeable. The second is by appealing to emotions, for example with a moving story. The third is by using logic, with clear reasons and evidence. The most persuasive speakers combine all three. However, persuasion can be used for good or bad purposes. Advertisers and politicians sometimes appeal to emotions to hide weak arguments. A wise listener enjoys a good speech but still asks: what is the evidence, and who benefits if I agree?",
  rq:[["How many ways to persuade did the Greek thinkers describe?","three","two","ten"],["What do the most persuasive speakers do?","combine all three ways","only use emotion","speak very fast"],["What does a wise listener ask?","What is the evidence, and who benefits?","How long is the speech?","What is the speaker wearing?"]]},
 {en:"Saying It Simply",ar:"قلها ببساطة",v:"simple|بسيط|⚪;clear|واضح|💎;jargon|مصطلحات معقدة|🤯;summary|ملخص|📑;short|قصير|✂️;plain|سهل الفهم|📄",
  c:[["Why is it hard to explain things simply?","Because you need to understand them really well.","Because simple words are too heavy to carry.","Simply is explaining why."],["What is jargon?","Special words that only experts understand.","Special sandwiches that only experts eat.","Jargon is what."],["Can you summarise the story in one sentence?","A lost falcon finds its way home with a boy's help.","A lost sandwich finds its way to the moon.","Summarise is story me."],["Who explains things most clearly in your life?","My older sister, who uses lots of examples.","My older pillow, who uses lots of examples.","Clearly is explaining who."]],
  l:"The scientist was asked to explain her research to a class of nine-year-olds. Instead of using difficult words, she brought a balloon and a glass of water. By the end, every student understood her idea.",
  lq:[["Who was the scientist explaining to?","a class of nine-year-olds","other scientists","the news"],["What did she bring?","a balloon and a glass of water","a computer","a microscope"],["Did the students understand?","Yes, every student understood.","No, nobody understood.","Only the teacher understood."]],
  r:"The physicist Richard Feynman believed that if you cannot explain something simply, you do not really understand it. Explaining clearly is a powerful skill in every job, from medicine to engineering. Start by knowing who your audience is and what they already know. Use short sentences and everyday words, and replace jargon with plain language whenever possible. Examples and comparisons help people connect new ideas to familiar experiences. Finally, check understanding by asking questions. Simple does not mean childish; it means respecting your listener's time and making ideas available to everyone.",
  rq:[["What did Feynman believe?","If you cannot explain something simply, you do not really understand it.","Simple explanations are wrong.","Only experts should explain science."],["What should you replace jargon with?","plain language","more jargon","pictures only"],["What does simple mean, according to the text?","respecting your listener and making ideas available to everyone","childish","short and boring"]]}
 ]},

  l:"When Hessa became captain of the robotics team, she gave everyone a role. Noor was in charge of building, Faisal wrote the code and Dana prepared the presentation. Hessa checked on everyone and helped when they were stuck.",
  lq:[["What team was Hessa captain of?","the robotics team","the football team","the chess team"],["What was Faisal responsible for?","writing the code","building","the presentation"],["What did Hessa do?","checked on everyone and helped","did all the work","went home"]],
  r:"Leadership is not about being the boss; it is about helping a group achieve something together. Research on successful teams shows that the best leaders listen more than they speak, give clear goals and trust their team members to do their jobs. They admit their mistakes, which makes others feel safe to take risks and share ideas. Good leaders also recognise each person's strengths and give them roles where they can shine. Anyone can practise leadership, whether by organising a class project, helping a younger sibling or starting a club at school.",
  rq:[["What is leadership about?","helping a group achieve something together","being the boss","giving orders"],["What do the best leaders do more?","listen more than they speak","speak more","work alone"],["Who can practise leadership?","anyone","only adults","only teachers"]]},
 {en:"Listening",ar:"الاستماع",v:"listen|يستمع|👂;attention|انتباه|🎯;interrupt|يقاطع|✋;nod|يومئ برأسه|🙂;empathy|تعاطف|💗;summarise|يلخص|📝",
  c:[["How can you show that you are listening?","Look at the speaker, nod and ask questions.","Look at the ceiling, yawn and eat.","Listening is showing how."],["Is it polite to interrupt?","No, it's better to wait until the person finishes.","No, it's better to wait until the moon finishes.","Interrupt is polite."],["Why is listening sometimes difficult?","Because we are busy thinking about our answer.","Because our ears are on holiday.","Listening is difficult why."],["What is empathy?","Understanding how another person feels.","Understanding how a fridge feels.","Empathy is what."]],
  l:"When Ali's friend talked about his problem, Ali put down his phone. He listened carefully and didn't interrupt. At the end, he said: so you feel left out. His friend smiled and said: exactly.",
  lq:[["What did Ali put down?","his phone","his bag","his book"],["Did Ali interrupt?","No, he didn't.","Yes, many times.","Only once."],["What did his friend say at the end?","exactly","goodbye","I don't know"]],
  r:"Most of us spend more time listening than speaking, reading or writing, yet very few people are taught how to listen well. Active listening means giving the speaker your full attention, showing interest with your face and body, and checking that you have understood by summarising what you heard. It also means not judging too quickly. Studies show that people who feel listened to are more likely to trust others and to cooperate. In teams, good listening prevents misunderstandings and helps the quietest members share their ideas, which are often valuable.",
  rq:[["What does active listening mean?","giving full attention and checking understanding","talking a lot","thinking about your answer"],["What are people who feel listened to more likely to do?","trust others and cooperate","leave the team","talk louder"],["What does good listening help the quietest members do?","share their ideas","stay silent","leave early"]]},
 {en:"Dividing the Work",ar:"تقسيم العمل",v:"task|مهمة|📌;share|يتقاسم|🍰;skills|مهارات|🛠️;fair|عادل|⚖️;divide|يقسم|➗;effort|جهد|💦",
  c:[["How should we divide the work?","Let's give each person a task that matches their skills.","Let's give each person a cake that matches their shoes.","Work is dividing how."],["Is it fair if one person does everything?","No, everyone should share the effort.","No, everyone should share the volcano.","Fair is everything."],["What's your part of the project?","I'm collecting the pictures.","I'm collecting the clouds.","Part is project what."],["What if someone doesn't do their task?","We should talk to them kindly and find out why.","We should send them to the moon.","Task is doing what."]],
  l:"For their project about the Red Sea, the four friends divided the work. Ahmed researched the fish, Lulu wrote the text, Sami drew the maps and Nada prepared the slides. They met every Tuesday to check their progress.",
  lq:[["What was the project about?","the Red Sea","the desert","space"],["What did Sami do?","drew the maps","wrote the text","researched the fish"],["When did they meet?","every Tuesday","every day","once a month"]],
  r:"Group projects can be wonderful or frustrating, and the difference often comes down to how the work is divided. Experts recommend starting by listing all the tasks and estimating how long each will take. Then match tasks to people's skills and interests, while making sure that everyone has a fair share. It helps to write down who is doing what and by when, so there are no misunderstandings. Regular short meetings allow the team to spot problems early. If someone is struggling, the team should offer help rather than blame, because the project succeeds or fails together.",
  rq:[["What do experts recommend starting with?","listing all the tasks","choosing a leader","buying materials"],["Why write down who is doing what?","so there are no misunderstandings","to punish people","to make it longer"],["What should the team do if someone is struggling?","offer help rather than blame","complain","replace them"]]},
 {en:"Solving a Disagreement",ar:"حل الخلاف",v:"conflict|خلاف|⚡;compromise|حل وسط|🤝;calm|هادئ|😌;solution|حل|🔑;mediator|وسيط|🧑‍⚖️;perspective|وجهة نظر|👓",
  c:[["What should you do when your team disagrees?","Stay calm and let everyone explain their view.","Stay loud and let nobody explain their view.","Disagree is team what."],["What is a compromise?","When each side gives up a little to agree.","When each side gives up a little sandwich.","Compromise is what."],["Who can help when two people can't agree?","A fair person who listens to both sides.","A fair penguin who eats both sides.","Help is agreeing who."],["Did you solve the problem in the end?","Yes, we combined both ideas.","Yes, we combined both volcanoes.","Problem is solving end."]],
  l:"Mona wanted to make a poster, but Reem wanted to make a video. They argued for ten minutes. Then their teacher suggested a compromise: a short video that ends with a poster. Both girls were happy.",
  lq:[["What did Mona want to make?","a poster","a video","a model"],["How long did they argue?","for ten minutes","for an hour","for one minute"],["What did the teacher suggest?","a short video that ends with a poster","only a poster","only a video"]],
  r:"Disagreements are natural in any team, and they can even be useful because they bring different ideas to the surface. Problems start when disagreements become personal or when people stop listening. A helpful approach is to focus on interests rather than positions: instead of arguing about what each person wants, ask why they want it. Often, both sides share the same goal. Using I statements, such as I feel worried when deadlines are missed, is better than blaming. When a team cannot agree, a neutral mediator can help. The aim is not to win but to find a solution everyone can accept.",
  rq:[["Why can disagreements be useful?","They bring different ideas to the surface.","They end friendships.","They waste time."],["What does focusing on interests mean?","asking why people want something","arguing about what they want","ignoring the problem"],["What is the aim?","to find a solution everyone can accept","to win","to stop talking"]]},
 {en:"Deadlines",ar:"المواعيد النهائية",v:"deadline|موعد نهائي|⏰;priority|أولوية|🔝;progress|تقدّم|📈;calendar|تقويم|🗓️;reminder|تذكير|📲;manage|يدير|🗂️",
  c:[["When is the deadline for the project?","It's next Thursday at noon.","It's next banana at noon.","Deadline is when."],["What's your top priority today?","Finishing the introduction.","Finishing the moon.","Priority is top."],["How do you avoid leaving everything to the last minute?","I break big tasks into small steps with dates.","I break big tasks into small sandwiches.","Last minute is avoiding."],["What will you do if you can't finish on time?","Tell the teacher early and explain why.","Hide the project in the oven.","Finish is time what."]],
  l:"Faris had two weeks to write his report, but he left it until the last night. He stayed up late and felt very stressed. Next time, he says, he will write a page every day.",
  lq:[["How long did Faris have?","two weeks","two days","two months"],["When did he do the work?","on the last night","on the first day","every day"],["What will he do next time?","write a page every day","not do it","ask his brother to write it"]],
  r:"Deadlines can feel stressful, but they also help us focus and finish what we start. One reason people miss deadlines is that they underestimate how long tasks will take. A good strategy is to work backwards from the deadline, deciding when each part must be completed. Putting these mini-deadlines in a calendar and setting reminders makes them harder to forget. It is also wise to start with the most important or most difficult task, while your energy is high. Finally, leave some extra time for surprises, because something unexpected almost always happens.",
  rq:[["Why do people miss deadlines?","They underestimate how long tasks will take.","They work too fast.","They have too much time."],["What is a good strategy?","work backwards from the deadline","start the night before","ignore the deadline"],["Why leave extra time?","because something unexpected almost always happens","to relax","because teachers are late"]]},
 {en:"Celebrating Success",ar:"الاحتفال بالنجاح",v:"celebrate|يحتفل|🎊;achievement|إنجاز|🏆;grateful|ممتن|🙏;proud|فخور|😊;certificate|شهادة|🎖️;teamwork|عمل جماعي|👏",
  c:[["How did your team celebrate?","We had a small party and thanked everyone.","We had a small volcano and ate everyone.","Celebrate is team how."],["Who deserves the most credit?","Everyone, because we worked together.","Nobody, because the sandwich did it.","Credit is deserving who."],["What did you learn from the project?","I learned that teamwork makes hard things possible.","I learned that teamwork makes sandwiches fly.","Learn is project what."],["What's your next goal?","To enter the national competition next year.","To enter the fridge next year.","Goal is next what."]],
  l:"After months of hard work, the school's robotics team won second place in the national competition. The head teacher organised a celebration. Each team member received a certificate, and they thanked the parents who had helped.",
  lq:[["What place did the team win?","second place","first place","tenth place"],["Who organised a celebration?","the head teacher","the students","the parents"],["Who did they thank?","the parents who had helped","the other teams","nobody"]],
  r:"Celebrating success is not just about having fun; it plays an important role in keeping teams motivated. When people's efforts are noticed and appreciated, they feel valued and are more likely to work hard in the future. Good leaders celebrate not only big achievements but also small steps along the way. They thank people specifically, for example by saying what exactly someone did well. It is also worth reflecting on what made the success possible, so that the team can repeat it. And when things don't go well, a team that celebrates together is also better at supporting each other.",
  rq:[["Why is celebrating success important?","It keeps teams motivated.","It is only fun.","It wastes time."],["How should people be thanked?","specifically, saying what exactly they did well","quickly","with money only"],["What else is worth doing?","reflecting on what made the success possible","forgetting the project","complaining"]]}

 {en:"What Is Fair?",ar:"ما العدل؟",v:"fairness|العدل|⚖️;equal|متساوٍ|🍰;need|حاجة|🙏;deserve|يستحق|🏅;rule|قاعدة|📏;justice|عدالة|🏛️",
  c:[["Is it fair if everyone gets the same?","Not always; sometimes people have different needs.","Not always; sometimes people have different moons.","Fair is same everyone."],["What would you do if a rule seemed unfair?","I would explain my reasons politely to the person in charge.","I would break everything and run away.","Rule is unfair seemed."],["Do people deserve rewards for effort or for results?","I think both matter.","I think both are sandwiches.","Deserve is rewards people."],["Why is fairness important in games?","Because otherwise nobody wants to play.","Because otherwise the ball gets angry.","Fairness is important why."]],
  l:"Three children had to share twelve cookies. One child had not eaten lunch and was very hungry. They decided to give him a little more. Was that fair? The class discussed it for twenty minutes.",
  lq:[["How many cookies were there?","twelve","three","twenty"],["Why did one child get more?","He had not eaten lunch and was very hungry.","He was the oldest.","He shouted."],["How long did the class discuss it?","for twenty minutes","for two minutes","for two hours"]],
  r:"Fairness seems simple until you try to define it. Is it fair to give everyone exactly the same, which is called equality? Or is it fairer to give each person what they need, which is called equity? Imagine three people of different heights trying to watch a game over a fence. Giving each one the same box may not help the shortest person see. Philosophers have argued about fairness for thousands of years, and different societies answer the question in different ways. What most people agree on is that fair rules should be clear, apply to everyone and be explained openly.",
  rq:[["What is equality?","giving everyone exactly the same","giving each person what they need","giving nothing"],["What is equity?","giving each person what they need","giving everyone the same","giving to the rich"],["What do most people agree fair rules should be?","clear, applied to everyone and explained openly","secret","only for adults"]]},
 {en:"What Makes a Friend?",ar:"ما الذي يصنع الصديق؟",v:"friendship|صداقة|💞;loyal|وفيّ|🐕;support|يساند|🫂;kind|لطيف|💛;honest|صادق|🙂;laugh|يضحك|😂",
  c:[["What makes someone a true friend?","They support you when things are difficult.","They support you when things are sandwiches.","Friend is true what."],["Can friends disagree and stay friends?","Yes, real friends respect different opinions.","Yes, real friends respect different volcanoes.","Friends is disagree."],["How do you make new friends?","Be kind, ask questions and join in activities.","Be rude, ignore everyone and stay home.","Friends is making how."],["What do you do with your best friend?","We build models and laugh a lot.","We build clouds and cry a lot.","Best is friend do."]],
  l:"When Majid moved to a new school, he didn't know anyone. On the first day, a boy called Talal sat next to him at lunch and asked about his old school. Ten years later, they are still best friends.",
  lq:[["Why didn't Majid know anyone?","He moved to a new school.","He was new in the country.","He was sick."],["Who sat next to him?","Talal","his teacher","his cousin"],["Are they still friends?","Yes, after ten years.","No, they argued.","Only sometimes."]],
  r:"Philosophers have been writing about friendship for thousands of years. Aristotle described three kinds of friendship: friendships based on usefulness, friendships based on fun and, the rarest kind, friendships based on admiring each other's character. Arab poets also praised loyal friends, and a well-known saying advises: a friend is known in times of need. Modern research shows that close friendships make people happier and even healthier. Good friendships require effort: listening, keeping promises, forgiving small mistakes and celebrating each other's successes. Quality matters more than the number of friends you have.",
  rq:[["How many kinds of friendship did Aristotle describe?","three","one","ten"],["What does the saying advise?","A friend is known in times of need.","Friends are always busy.","Never trust anyone."],["What matters more than the number of friends?","quality","money","age"]]},
 {en:"Humans and Machines",ar:"البشر والآلات",v:"human|إنسان|🧑;machine|آلة|⚙️;creativity|إبداع|🎨;ethics|أخلاقيات|🧭;chatbot|روبوت محادثة|💬;replace|يستبدل|🔄",
  c:[["Can machines think like humans?","Some can solve problems, but they don't feel like us.","Some can solve problems, and they eat breakfast like us.","Machines is thinking."],["What can computers do better than people?","They can calculate very fast and remember huge amounts of data.","They can calculate very slowly and forget their names.","Computers is better what."],["What can people do better than machines?","Show empathy, be creative and make moral choices.","Calculate a million numbers per second.","People is better what."],["Should we trust everything a chatbot says?","No, we should check important information.","No, we should feed the chatbot first.","Chatbot is trusting."]],
  l:"In our class, we tested a chatbot. It wrote a poem in five seconds and answered maths questions correctly. But when we asked about a local story, it made up facts that were not true.",

  r:"Artificial intelligence, or AI, refers to computer programs that can perform tasks that normally require human intelligence, such as recognising faces, translating languages or recommending films. These systems learn patterns from huge amounts of data. They can be extremely useful, for example by helping doctors spot diseases in X-rays. However, AI can also make mistakes, repeat unfair patterns hidden in its data or produce information that sounds confident but is false. That is why humans must remain responsible for important decisions. The big question is not whether machines will become clever, but how we will choose to use them.",

  l:"Lina wanted to post a photo from her birthday party. Her mother reminded her to ask her friends first. Two friends said yes, but one said no. Lina cropped the photo so that friend wasn't in it.",

  r:"Every time we use the internet, we leave a trail of information, sometimes called a digital footprint. Websites and apps may record what we search for, where we are and what we like. This data can be used to improve services, but it can also be sold or misused. Privacy means having control over who knows what about you. Simple habits help protect it: using strong passwords, checking app permissions, not sharing your address or school publicly and thinking before you post. Remember that once something is online, it can be very difficult to remove completely.",

  r:"Many of the choices we make today will affect people who are not yet born. The roads, schools and hospitals our grandparents built are still used by us, and the way we treat water, soil and air will shape the lives of future generations. Sustainable development means meeting our present needs without reducing the ability of future generations to meet theirs. This idea is reflected in long-term projects such as planting forests or protecting rare animals. It is also present in our traditions, which encourage people to do good deeds that continue to benefit others after they are gone.",

  r:"People have always asked what makes a life good. Some say happiness, others say success, and many religious and philosophical traditions point to character, purpose and service to others. Research on happiness suggests that, beyond having our basic needs met, strong relationships and a sense of meaning matter far more than money or fame. Practising gratitude, learning continuously and helping others are linked to greater wellbeing. There is no single answer to the question, and that is part of its beauty. Each of us writes our own story, one choice at a time. Thank you for learning with Ollie, and good luck on your journey!",

const V=L=>L.vs||(L.vs=L.v.split(';').map(s=>{const[en,ar,em]=s.split('|');return{en,ar,em}}));
const splitS=text=>(String(text).match(/[^.!?]+[.!?]*['"]?/g)||[String(text)]).map(x=>x.trim()).filter(Boolean);
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const hasWord=(s,w)=>new RegExp('(^|[^A-Za-z])'+escRe(w)+'(?![A-Za-z])','i').test(s);
/* which of a lesson's words each letter game can use */
const wordsFor={
 unscramble:L=>V(L).filter(v=>/^[a-z]{3,11}$/i.test(v.en)),
 spell:L=>V(L).filter(v=>/^[a-z' ]+$/i.test(v.en)),
 balloons:L=>V(L).filter(v=>/^[a-z][a-z' -]*$/i.test(v.en)&&v.en.length<=14&&v.en.replace(/[^a-z]/gi,'').length>=3),
 search:L=>V(L).filter(v=>/^[a-z]{3,8}$/i.test(v.en))
};
const sentFor=L=>{const all=(L.c||[]).map(c=>c[1]).filter(x=>x.split(' ').length<=14),good=all.filter(x=>x.split(' ').length>=3);return good.length>=2?good:all};
/* Missing-word items: a sentence of the lesson with one word taken out. A lesson word is taken when the
   sentence has one; otherwise its longest ordinary word. `opts` are wrong choices that are not in the sentence. */
const STOP=new Set("the a an and or but is are am was were be been to of in on at for with from by it its this that these those he she we they you i my your his her our their not no yes do does did have has had can will would could should very too so as if then than there here what when where who why how me him them us about into after before because every some many much more most also just only still even".split(' '));
function gapItems(L){
 if(!L.c||!L.l||!L.r)return[];
 const vs=V(L),pool=[...new Set([...L.c.map(c=>c[1]),...splitS(L.l),...splitS(L.r)])].filter(s=>{const n=s.split(' ').length;return n>=4&&n<=16&&!/['"]$/.test(s)});
 const strong=[...new Set(pool.flatMap(s=>(s.match(/[A-Za-z]+/g)||[]).slice(1)).filter(w=>w.length>=4&&w===w.toLowerCase()&&!STOP.has(w)))];
 const voc=[],rest=[];
 for(const s of pool){
  let it=null;
  for(const v of vs){const m=new RegExp('(^|[^A-Za-z])('+escRe(v.en)+')(?![A-Za-z])','i').exec(s);if(!m)continue;
   const opts=vs.filter(x=>x!==v&&!hasWord(s,x.en)).map(x=>x.en);
   if(opts.length>=3){it={s,at:m.index+m[1].length,word:m[2],opts,voc:v.en};break}}
  if(it){voc.push(it);continue}
  const cand=[...s.matchAll(/[A-Za-z]+/g)].filter(m=>m.index>0&&m[0].length>=4&&m[0]===m[0].toLowerCase()&&!STOP.has(m[0])&&s[m.index-1]!=="'"&&s[m.index+m[0].length]!=="'").sort((a,b)=>b[0].length-a[0].length)[0];
  if(!cand)continue;
  const w=cand[0],opts=strong.filter(x=>x!==w&&!hasWord(s,x)&&Math.abs(x.length-w.length)<=3);
  if(opts.length>=3)rest.push({s,at:cand.index,word:w,opts});
 }
 return [...voc,...rest];
}
wordsFor.letter=L=>V(L).filter(v=>/^[a-z]{3,10}$/i.test(v.en));
/* sentences of a lesson that a child can tell apart by ear: its answers and the sentences of its two texts */
/* quotation marks in a piece of text (apostrophes inside words are not counted): an odd number means it was cut inside a quotation */
const quoteMarks=s=>(s.match(/(^|[^A-Za-z])'|'(?![A-Za-z])|"/g)||[]).length;
const hearPool=L=>!L.c||!L.l||!L.r?[]:[...new Set([...L.c.map(c=>c[1]),...splitS(L.l),...splitS(L.r)])].filter(s=>{const n=s.split(' ').length;return n>=3&&n<=14&&quoteMarks(s)%2===0});
/* the lesson's story (then its listening text) cut into runs of four sentences in a row, two runs at most */
const orderSets=L=>{const out=[];for(const t of [L.r,L.l]){const ss=splitS(t||'');
 for(let k=0;k+4<=ss.length&&out.length<2;){const run=ss.slice(k,k+4);if(new Set(run).size===4&&run.every(s=>s.split(' ').length<=20&&quoteMarks(s)%2===0)){out.push(run);k+=4}else k++}}return out};
function canPlay(g,L){switch(g){
 case'unscramble':case'spell':case'balloons':case'search':case'letter':return wordsFor[g](L).length>=3;
 case'sentence':return sentFor(L).length>=2;
 case'gap':return gapItems(L).length>=4;
 case'hear':return hearPool(L).length>=5;
 case'order':return orderSets(L).length>=1;
 case'bingo':return V(L).length>=5;
 default:return V(L).length>=4}}
/*PURE-END*/
