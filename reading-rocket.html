<style>/* ===== Shared kit styles. Each game sets the tokens in its own :root ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;direction:rtl;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 28px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default;opacity:.55}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.25;text-wrap:balance}
.en{font-family:var(--f-en);direction:ltr;unicode-bidi:isolate}
.muted{color:var(--ink2)}.small{font-size:14px}
.wrap{max-width:760px;margin:0 auto}
[hidden]{display:none!important}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 14px;
  padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:var(--hdr);box-shadow:0 3px 0 var(--hdr2)}
.hdr-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px}
.back{width:42px;height:42px;border-radius:14px;background:var(--chip);display:grid;place-items:center;flex:none}
.back svg{width:22px;height:22px}
.ttl{flex:1;min-width:0;font-family:var(--f-display);font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--hdrink)}
.gems{display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:99px;background:var(--chip);font-weight:800;font-size:15px;white-space:nowrap;flex:none;color:var(--hdrink)}
.gems.pop{animation:pop .4s}
.mini{width:44px;height:44px;border-radius:50%;background:var(--chip);overflow:hidden;flex:none;box-shadow:0 0 0 2.5px var(--gold)}
.mini svg{width:100%;height:100%;display:block}
body.full .hdr{margin-bottom:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:6px 20px;border-radius:16px;background:var(--accent);color:var(--accent-ink,#fff);
  font-weight:800;font-size:18px;box-shadow:0 5px 0 var(--accent2);transition:transform .08s,box-shadow .08s;text-decoration:none}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--accent2)}
.btn.ok{background:var(--ok);box-shadow:0 5px 0 var(--ok2);color:#fff}
.btn.gold{background:var(--gold);box-shadow:0 5px 0 var(--gold2);color:#3b2a00}
.btn.ghost{background:var(--chip);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.sm{min-height:40px;font-size:15px;padding:4px 14px}
.btn.big{min-height:62px;font-size:24px;font-family:var(--f-display);font-weight:400}
.btn.wide{width:100%}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 4px 0 var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stars{color:var(--gold);letter-spacing:1px;line-height:1}
.stars .off{color:var(--line)}
.seg{display:inline-flex;background:var(--chip);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{min-height:38px;padding:0 12px;border-radius:10px;font-weight:800}
.seg button.on{background:var(--accent);color:var(--accent-ink,#fff)}
.inp{min-height:48px;border-radius:14px;border:2.5px solid var(--line);background:var(--chip);color:var(--ink);font:inherit;font-size:18px;padding:6px 14px;width:100%}

/* keypad */
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px auto 0;max-width:420px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.k{height:56px;border-radius:16px;background:var(--key);color:var(--keyink);font-family:var(--f-display);font-size:30px;box-shadow:0 4px 0 var(--key2);transition:transform .06s}
.k.pr{transform:translateY(3px);box-shadow:0 1px 0 var(--key2)}
.k.go{background:var(--ok);color:#fff;box-shadow:0 4px 0 var(--ok2)}
.k.del{font-size:24px}

/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,14,30,.62);display:grid;place-items:center;animation:fade .2s;overflow:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@keyframes fade{from{opacity:0}}
.res{width:min(420px,100%);background:var(--card);color:var(--ink);border-radius:28px;padding:20px 18px;text-align:center;box-shadow:0 8px 0 var(--line),0 20px 50px rgba(0,0,0,.35);animation:boing .45s;margin:auto}
@keyframes boing{0%{transform:scale(.6)}65%{transform:scale(1.04)}}
.res h2{font-size:28px;color:var(--accent)}
.reshero{width:120px;margin:-6px auto 0}
.reshero svg{width:100%;height:auto}
.res .bigs{font-size:48px;letter-spacing:6px;color:var(--line)}
.res .bigs span{display:inline-block;animation:starin .5s backwards}
.res .bigs span.on{color:var(--gold);text-shadow:0 3px 0 var(--gold2)}
.res .bigs span:nth-child(2){animation-delay:.2s}.res .bigs span:nth-child(3){animation-delay:.4s}
@keyframes starin{from{transform:scale(0) rotate(-120deg)}}
.bigscore{font-family:var(--f-display);font-size:50px;line-height:1.1}
.gemgain{font-family:var(--f-display);font-size:34px;color:var(--gem)}
.res ul{list-style:none;padding:0;margin:8px 0 14px;display:grid;gap:4px;font-weight:600}
.res .btns{display:grid;gap:10px}
.toasts{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:grid;justify-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--ink);color:var(--bg);font-weight:800;padding:10px 18px;border-radius:16px;animation:toastin .3s;max-width:100%;box-shadow:0 6px 20px rgba(0,0,0,.3)}
@keyframes toastin{from{transform:translateY(20px);opacity:0}}
#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:70}

/* hero */
.hero{display:block;width:100%;height:auto;overflow:visible}
.hero.headonly{overflow:hidden}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.hero .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}

/* maker + closet */
.maker-in{text-align:start}
.maker-in h2{text-align:center}
.mprev{width:150px;margin:0 auto}
.mlab{font-weight:800;display:block;margin:6px 0 4px}
.mrow{display:grid;gap:6px;margin-top:10px}
.mrow>span{font-weight:800;font-size:15px}
.mopts{display:flex;flex-wrap:wrap;gap:8px}
.mo{width:46px;height:46px;border-radius:50%;background:var(--chip);font-size:22px;border:3px solid transparent;box-shadow:0 3px 0 var(--line)}
.mo.col{border-color:rgba(0,0,0,.15)}
.mo.on{border-color:var(--accent);transform:scale(1.1)}
#mgo{margin-top:16px}
.closet{display:grid;gap:12px}
.cprev{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:22px;padding:12px;box-shadow:0 4px 0 var(--line)}
.cprev>div:first-child{width:150px;flex:none}
.cprev h2{font-size:26px}
.gemline{font-weight:800;color:var(--gem)}
.ctabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.ctab{flex:none;display:flex;flex-direction:column;align-items:center;gap:0;min-width:64px;padding:6px 8px;border-radius:14px;background:var(--chip);font-size:22px;box-shadow:0 3px 0 var(--line)}
.ctab span{font-size:12px;font-weight:800}
.ctab.on{background:var(--accent);color:var(--accent-ink,#fff)}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-bottom:70px}
@media (min-width:560px){.items{grid-template-columns:repeat(4,1fr)}}
.item{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 10px;border-radius:18px;background:var(--card);box-shadow:0 4px 0 var(--line);border:3px solid transparent;min-width:0}
.item.sel{border-color:var(--accent)}
.item.worn{border-color:var(--ok)}
.item b{font-size:13px;line-height:1.25}
.ipic{width:84px;max-width:100%;aspect-ratio:1;display:grid;place-items:center}
.ipic.big{width:130px;margin:0 auto}
.ipic.none{font-size:34px;color:var(--ink2)}
.ipic svg{width:100%;height:100%}
.iprice{font-size:13px;font-weight:800;color:var(--gem)}
.itag{position:absolute;top:4px;right:4px;font-size:10px;font-weight:800;background:var(--gold);color:#3b2a00;padding:0 6px;border-radius:8px}
.cbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);box-shadow:0 -4px 0 var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

/* chest */
.chest{width:min(220px,70vw);display:block;margin:10px auto}
.chest svg{width:100%;height:auto;display:block;overflow:visible}
.chest .lid{transform-origin:20px 52px;transition:transform .4s}
.chest.open .lid{transform:rotate(-28deg) translateY(-8px)}
.wobble{animation:wobble .35s}
@keyframes wobble{25%{transform:rotate(-6deg) scale(1.04)}75%{transform:rotate(6deg) scale(1.04)}}
.cwin{animation:boing .45s}

/* shared animations */
.shake{animation:shk .4s}
@keyframes shk{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes pop{40%{transform:scale(1.18)}}

/* mic help */
.michelp{background:var(--chip);border:2.5px dashed var(--gold);border-radius:18px;padding:12px 14px;margin:12px 0;text-align:start;color:var(--ink)}
.michelp h3{font-size:17px;margin-bottom:6px;font-family:var(--f-body);font-weight:800}
.michelp ol{margin:0 0 10px;padding-inline-start:22px;display:grid;gap:4px;font-size:15px}
.linkbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--card);border-radius:12px;padding:8px 10px}
.linkbox .en{font-size:13px;word-break:break-all;flex:1 1 180px;min-width:0;user-select:all;text-align:left}
@media (prefers-reduced-motion:reduce){.bob,.hero .eyes{animation:none}}

/* Reading Rocket: a night-sky mission board. Four planet cards glow on deep blue; reading text always sits on bright paper cards so letters stay crisp. Single committed light-on-dark header, light pages. */
:root{
  --bg:#eef0ff;--card:#ffffff;--ink:#1f2148;--ink2:#5d6191;--line:#d6daf5;--chip:#e9ebff;
  --hdr:#1e1b4b;--hdr2:#110f33;--hdrink:#fff6dc;--hchip:rgba(255,255,255,.14);
  --accent:#7c3aed;--accent2:#5b21b6;--gold:#f5b82e;--gold2:#c08a12;--ok:#2fa65a;--ok2:#1f7a40;--bad:#e5484d;--gem:#0e9ac7;
  --key:#ffffff;--keyink:#1f2148;--key2:#cfd4f3;
  --f-display:"Lalezar","Baloo Bhaijaan 2",Tahoma,sans-serif;--f-body:"Baloo Bhaijaan 2",Tahoma,"Segoe UI",sans-serif;--f-en:"Fredoka","Baloo Bhaijaan 2",sans-serif;
  color-scheme:light;
}
body{background-color:var(--bg);background-image:radial-gradient(circle at 12% 20%,rgba(124,58,237,.12) 0 2px,transparent 2.5px),radial-gradient(circle at 70% 60%,rgba(30,27,75,.1) 0 1.5px,transparent 2px),linear-gradient(180deg,#f3f1ff,#e7ebff);background-size:46px 46px,34px 34px,100% 100%}
.back,.gems,.mini{background:var(--hchip)}
.back{color:var(--hdrink)}
.en{font-family:var(--f-en);direction:ltr;unicode-bidi:isolate}
.lead{margin-bottom:12px}
.cen{justify-content:center;text-align:center}
.tip{background:var(--card);border-radius:16px;padding:8px 12px;font-weight:700;font-size:14px;box-shadow:0 3px 0 var(--line);margin-top:8px}
.chipbtn{display:inline-flex;align-items:center;gap:4px;min-height:38px;padding:4px 12px;border-radius:99px;background:var(--card);font-weight:800;font-size:14px;box-shadow:0 3px 0 var(--line)}
.chipbtn.gold{background:var(--gold);color:#3b2a00;box-shadow:0 3px 0 var(--gold2);animation:pop 1.6s ease-in-out infinite}
.sec{font-size:19px;margin:14px 0 8px}
/* المجرّة */
.mtop{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.mhero{width:100px;flex:none}
.mtxt{flex:1;min-width:0;display:grid;gap:6px}
.mtxt h1{font-size:25px;color:var(--hdr)}
.mtxt p{font-weight:700;font-size:15px;color:var(--ink2)}
.galaxy{display:grid;gap:14px;margin-bottom:10px}
.planet{display:flex;align-items:center;gap:12px;text-align:start;border-radius:26px;padding:12px 14px;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.2);position:relative;overflow:hidden;
  background-image:radial-gradient(circle at 85% 25%,rgba(255,255,255,.55) 0 1.5px,transparent 2px),radial-gradient(circle at 30% 80%,rgba(255,255,255,.45) 0 1px,transparent 1.5px);background-size:40px 40px,30px 30px}
.p-mon{background-color:#6d28d9}.p-case{background-color:#0f766e}.p-room{background-color:#b45309}.p-tale{background-color:#be185d}
.ppic{width:90px;height:90px;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.18);border-radius:50%;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.ppic svg,.ppic canvas{width:82px;height:82px}
.pemo{font-size:52px}
.ptxt{flex:1;min-width:0;display:grid;gap:3px}
.ptxt h3{font-size:23px;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.ptxt p{font-weight:700;font-size:14px}
.pprog{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px}
.bbar{flex:1;height:8px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden}
.bbar i{display:block;height:100%;background:#fff;border-radius:9px}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lv{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:92px;border-radius:20px;background:var(--card);box-shadow:0 4px 0 var(--line);padding:6px 4px}
.lv:disabled{opacity:.5}
.lvi{font-family:var(--f-display);font-size:26px;line-height:1.15}
.lvi.en{font-family:var(--f-en);font-weight:600;font-size:20px}
.lvt{font-size:12px;font-weight:800;color:var(--ink2);text-align:center;line-height:1.25}
.lv.here{box-shadow:0 4px 0 var(--line),0 0 0 3px var(--gold);animation:pop 1.6s ease-in-out infinite}
.lv.done{background:#f5f3ff}
.comic .cbig{font-size:72px;line-height:1.15;animation:boing .5s}
.ctext{font-size:18px;font-weight:600;margin:6px 0 12px}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent);width:26px;border-radius:9px}
/* الضغط على الكلمات */
.w{cursor:pointer;border-radius:6px;padding:0 1px;transition:background .2s}
.w:hover,.w.lit{background:#fde68a}
.w.ok{background:#bbf7d0}.w.miss{background:#fecaca}
.wpop{position:absolute;z-index:60;background:var(--hdr);color:#fff;border-radius:12px;padding:5px 12px;display:grid;gap:0;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.25);animation:boing .25s;pointer-events:none;max-width:220px}
.wpop b{font-size:19px}.wpop span{font-size:14px;font-weight:700;color:#fde68a}
.srow{display:inline-flex;gap:1px;font-size:22px;color:#e5e7eb;direction:ltr}.srow i{font-style:normal}.srow i.on{color:#f5b82e}
/* الوحوش */
.mon{display:grid;gap:8px;max-width:520px;margin:0 auto}
.bhud{display:flex;align-items:center;gap:8px}
.hearts{font-size:20px;letter-spacing:1px}
.bw{flex:1;text-align:center;font-weight:800;color:var(--ink2)}
.pz{width:46px;height:46px;border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--line);font-size:18px}
.cue{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:8px 14px;box-shadow:0 4px 0 var(--line);min-height:76px;border:3px solid var(--accent)}
.cue.pop{animation:boing .35s}
.cue>div{display:grid;flex:1}.cue>div b{font-size:17px}.cue>div span{font-size:13px;color:var(--ink2);font-weight:700}
.cemo{font-size:52px;line-height:1}.car{font-family:var(--f-display);font-size:26px;color:var(--accent)}
.cbtn{width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;font-size:26px;box-shadow:0 4px 0 var(--accent2);flex:none}
.cbtn2{width:44px;height:44px;font-size:20px}
.mstage2{position:relative;border-radius:24px;overflow:hidden;box-shadow:0 5px 0 var(--line);background:#0b1033;touch-action:manipulation}
.mstage2 canvas{display:block;width:100%}
.mbub{position:absolute;left:10px;right:10px;bottom:12px;z-index:2;background:#fff;border-radius:16px;padding:6px 12px;text-align:center;font-weight:700;border:2.5px solid var(--ink);animation:boing .3s}
.mbub b{font-size:20px}
/* المحقق */
.case{display:grid;gap:10px}
.cfile{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;background:#fffbeb;border-radius:18px;padding:8px 12px;border:2.5px dashed #b45309}
.cloot{grid-row:span 2;font-size:40px}.cfile b{font-size:17px}.cfile small{font-weight:700;color:#92400e}
.clue{background:var(--card);border-radius:20px;padding:10px 14px;box-shadow:0 4px 0 var(--line);border-inline-start:8px solid #0f766e;display:grid;gap:6px}
.clue.pop{animation:boing .35s}
.chead{font-weight:800;color:#0f766e;font-size:14px}
.ctxt{font-size:23px;font-weight:600;line-height:1.4}
.car2{font-weight:700;color:var(--ink2)}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sgrid.n4{grid-template-columns:repeat(2,1fr)}.sgrid.n5,.sgrid.n6{grid-template-columns:repeat(3,1fr)}
.scard{position:relative;background:var(--card);border-radius:18px;box-shadow:0 4px 0 var(--line);padding:4px;transition:opacity .3s,transform .3s}
.scard svg{width:100%;height:auto;display:block}
.sx{position:absolute;inset:0;display:grid;place-items:center;font-size:56px;color:#ef4444;opacity:0;transition:opacity .25s;text-shadow:0 2px 0 #fff}
.scard.out{opacity:.45;transform:scale(.94)}.scard.out .sx{opacity:1}
.scard.caught{box-shadow:0 4px 0 var(--line),0 0 0 4px var(--gold);animation:pop .8s ease-in-out 3}
/* غرف الهروب */
.esc{display:grid;gap:10px}

.ig{animation:boing .4s}

.tale{display:grid;gap:10px}

.tl{font-size:22px;line-height:1.5;font-weight:500}
.tar{background:#f5f3ff;border-radius:16px;padding:8px 12px;font-weight:700;color:var(--ink2)}
.tch{display:grid;gap:10px}
.tc{display:grid;gap:2px;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 5px 0 var(--accent2);border:3px solid var(--accent);text-align:left}
.tc .en{font-size:21px;font-weight:600}.tc small{font-weight:700;color:var(--ink2);direction:rtl;text-align:right}

.tend.funny{background:#fff7ed;color:#c2410c}
.tscore{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--card);border-radius:14px;padding:6px;box-shadow:0 3px 0 var(--line)}
@media (max-height:700px){.cemo{font-size:42px}.ctxt,.ntxt{font-size:20px}.tl{font-size:20px}}

<script>(function(){'use strict';
/* ===== عدّة «عالم البطل» المشتركة: الأساس ===== */

function seeded(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
  return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return(h>>>0)/4294967296;};}
function loadJSON(key,def){try{const r=localStorage.getItem(key);return r?Object.assign(def(),JSON.parse(r)):def();}catch(e){return def();}}

/* ---------- التنقّل بين الشاشات ---------- */
const SCREENS={};let cur=null,stack=[],cleanups=[],keyHandler=null;

function onClean(f){cleanups.push(f);}
function clean(){const c=cleanups;cleanups=[];c.forEach(f=>{try{f();}catch(e){}});keyHandler=null;$$('.ov').forEach(o=>o.remove());stopSpeak();}
function show(){const d=SCREENS[cur.name];document.body.dataset.screen=cur.name;document.body.classList.toggle('full',!!d.opt.full);d.fn(cur.arg);window.scrollTo(0,0);hud();}

function home(){stack=[];go(APP.home,null,false);}
document.addEventListener('keydown',e=>{if(keyHandler)keyHandler(e);});

function hud(){const g=$('#hgems');if(g)g.innerHTML=`💎 <b>${D(World.p.gems)}</b>`;const m=$('#hhero');if(m)m.innerHTML=heroSVG(World.p.hero,{face:'happy',head:true});}
function toast(h,ms=2400){const t=document.createElement('div');t.className='toast';t.innerHTML=h;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),ms);}
const starsHTML=(n,max=3)=>'<span class="stars">'+[...Array(max)].map((_,i)=>i<n?'★':'<span class="off">★</span>').join('')+'</span>';
const wait=(ms,alive)=>new Promise(r=>setTimeout(()=>r(alive?alive():true),ms));

/* ---------- لوحة الأرقام ---------- */
function keypadHTML(go='✓'){return `<div class="kp" dir="ltr">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="k" data-k="${n}">${D(n)}</button>`).join('')}<button class="k del" data-k="del" aria-label="مسح">⌫</button><button class="k" data-k="0">${D(0)}</button><button class="k go" data-k="ok" aria-label="تأكيد">${go}</button></div>`;}
function bindKeypad(root,{onChange,onSubmit,max=3}){
  let v='',on=true;const press=k=>{if(!on)return;if(k==='del')v=v.slice(0,-1);else if(k==='ok'){if(v!=='')onSubmit(+v);return;}else if(v.length<max)v=(v==='0'?'':v)+k;onChange&&onChange(v);};
  $$('.k',root).forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('pr');setTimeout(()=>b.classList.remove('pr'),120);press(b.dataset.k);}));
  keyHandler=e=>{if(e.target&&e.target.tagName==='INPUT')return;const ch=e.key;const n=/^[0-9]$/.test(ch)?ch:(AR.indexOf(ch)>=0&&ch.length===1?String(AR.indexOf(ch)):null);
    if(n!==null){press(n);e.preventDefault();}else if(ch==='Backspace'){press('del');e.preventDefault();}else if(ch==='Enter'){press('ok');e.preventDefault();}};
  return{reset(){v='';onChange&&onChange(v);},get value(){return v;},lock(x){on=!x;}};
}

/* ---------- شاشة النتيجة ---------- */
function resultOv({title,stars=null,big=null,lines=[],gems=0,chest=null,btns=[],hero=true,mood='happy'}){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="res" role="dialog" aria-modal="true">
    ${hero?`<div class="reshero bob">${heroSVG(World.p.hero,{face:mood,pose:mood==='happy'?'cheer':'idle'})}</div>`:''}
    <h2>${title}</h2>
    ${stars!==null?`<div class="bigs">${[0,1,2].map(i=>`<span class="${i<stars?'on':''}">★</span>`).join('')}</div>`:''}
    ${big!==null?`<div class="bigscore">${big}</div>`:''}
    ${gems?`<div class="gemgain">💎 +<b id="gg">${D(0)}</b></div>`:''}
    <ul>${lines.filter(Boolean).map(l=>`<li>${l}</li>`).join('')}</ul>
    <div class="btns">${btns.map((b,i)=>`<button class="btn ${b.cls||''}" data-b="${i}">${b.label}</button>`).join('')}</div></div>`;
  document.body.appendChild(ov);
  btns.forEach((b,i)=>ov.querySelector(`[data-b="${i}"]`).onclick=()=>{ov.remove();b.fn();});
  if(gems){World.add(gems);let k=0;const step=Math.max(1,Math.ceil(gems/20));const iv=setInterval(()=>{k=Math.min(gems,k+step);const g=ov.querySelector('#gg');if(g)g.textContent=D(k);if(k>=gems)clearInterval(iv);},40);}
  if(stars===null||stars>0)FX.confetti();
  if(chest)setTimeout(()=>openChest(chest),700);
  return ov;
}

/* ===== المؤثرات: شرارات، كلمات طائرة، اهتزاز ===== */
if(window.CanvasRenderingContext2D&&!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(typeof r==='number'?r:(r&&r[0])||0,Math.abs(w)/2,Math.abs(h)/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;};}
const REDUCED=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const FX={c:null,x:null,p:[],raf:0,
  init(){this.c=$('#fx');if(!this.c)return;this.x=this.c.getContext('2d');const rs=()=>{const d=Math.min(2,window.devicePixelRatio||1);this.c.width=innerWidth*d;this.c.height=innerHeight*d;this.x.setTransform(d,0,0,d,0,0);};rs();addEventListener('resize',rs);},
  burst(x,y,o={}){if(!this.x)return;const n=REDUCED?Math.min(6,o.n||16):(o.n||16),cols=o.colors||['#ffd95a','#ff8a80','#8fe3ff','#b8f28c','#ffffff'];
    for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(o.speed||220)*(.4+Math.random()*.8);
      this.p.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(o.up||80),g:o.g==null?420:o.g,life:0,max:.55+Math.random()*.5,r:(o.size||5)*(.6+Math.random()*.8),col:pick(cols),emoji:o.emoji?pick([].concat(o.emoji)):null});}
    this.run();},
  text(x,y,txt,col='#fff',size=28){if(!this.x)return;this.p.push({x,y,vx:0,vy:-70,g:0,life:0,max:1.1,txt,col,size});this.run();},
  confetti(){if(REDUCED||!this.x)return;const cols=['#ffd95a','#ff8a80','#8fe3ff','#b8f28c','#c9a8ff','#ffb86b'];
    for(let i=0;i<120;i++)this.p.push({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.4,vx:(Math.random()-.5)*160,vy:80+Math.random()*160,g:120,life:0,max:2.6+Math.random(),r:4+Math.random()*5,col:pick(cols),rect:1,rot:Math.random()*6,vr:(Math.random()-.5)*8});
    this.run();},
  run(){if(this.raf)return;let last=performance.now();
    const step=t=>{const dt=Math.min(.05,(t-last)/1000);last=t;const x=this.x;x.clearRect(0,0,innerWidth,innerHeight);
      this.p=this.p.filter(q=>(q.life+=dt)<q.max);
      for(const q of this.p){q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;const a=1-q.life/q.max;x.globalAlpha=Math.max(0,Math.min(1,a*1.4));
        if(q.txt){x.font=`800 ${q.size}px Lalezar, "Baloo Bhaijaan 2", Tahoma, sans-serif`;x.textAlign='center';x.lineWidth=5;x.strokeStyle='rgba(0,0,0,.45)';x.strokeText(q.txt,q.x,q.y);x.fillStyle=q.col;x.fillText(q.txt,q.x,q.y);}
        else if(q.emoji){x.font=`${q.r*4}px sans-serif`;x.textAlign='center';x.fillText(q.emoji,q.x,q.y);}
        else if(q.rect){q.rot+=q.vr*dt;x.save();x.translate(q.x,q.y);x.rotate(q.rot);x.fillStyle=q.col;x.fillRect(-q.r,-q.r/2,q.r*2,q.r);x.restore();}
        else{x.fillStyle=q.col;x.beginPath();x.arc(q.x,q.y,q.r*a+1,0,7);x.fill();}}
      x.globalAlpha=1;if(this.p.length)this.raf=requestAnimationFrame(step);else{this.raf=0;x.clearRect(0,0,innerWidth,innerHeight);}};
    this.raf=requestAnimationFrame(step);}
};
function shake(el,cls='shake'){if(!el)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);}
function buzz(ms=30){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
function centerOf(el){const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2];}

/* ===== الصوت: النطق (بلا موسيقى) والاستماع ===== */
const TTS='speechSynthesis' in window;let VOICE={en:null,ar:null};
function pickVoices(){if(!TTS)return;const vs=speechSynthesis.getVoices();
  const pref=[/Samantha/i,/Google US English/i,/Aria/i,/Jenny/i,/Microsoft.*(Zira|Ana)/i,/en[-_]US/i,/Karen|Moira|Tessa/i,/en[-_]GB/i];
  const en=vs.filter(v=>/^en/i.test(v.lang));VOICE.en=null;for(const p of pref){const v=en.find(v=>p.test(v.name)||p.test(v.lang));if(v){VOICE.en=v;break;}}if(!VOICE.en)VOICE.en=en[0]||null;
  const ar=vs.filter(v=>/^ar/i.test(v.lang));VOICE.ar=ar.find(v=>/SA|Maged|Tarik|Hamed|Zariyah/i.test(v.name+v.lang))||ar[0]||null;}
if(TTS){pickVoices();speechSynthesis.onvoiceschanged=pickVoices;}
let sayTok=0;
function speak(text,o={}){
  const tok=++sayTok;let ended=false;const end=()=>{if(ended)return;ended=true;if(o.el)o.el.classList.remove('talking');if(tok===sayTok&&o.onend)o.onend();};
  const lang=o.lang||'en';
  if(!TTS||(lang==='ar'&&(!VOICE.ar||!World.p.voiceAr))){setTimeout(end,o.lang==='ar'?10:400);return;}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text).replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,''));
    u.lang=lang==='ar'?'ar-SA':'en-US';const v=VOICE[lang];if(v)u.voice=v;u.rate=(o.rate||(lang==='ar'?.95:.92))*(lang==='en'?(World.p.rate||1):1);u.pitch=o.pitch||1.05;
    u.onstart=()=>{if(o.el&&tok===sayTok)o.el.classList.add('talking');};
    if(o.onboundary)u.onboundary=e=>{if(tok===sayTok&&e.name!=='sentence')o.onboundary(e.charIndex);};
    u.onend=u.onerror=end;speechSynthesis.speak(u);setTimeout(end,1800+String(text).length*90/u.rate);
  }catch(e){end();}
}
const sayAr=(t,o={})=>speak(t,Object.assign({lang:'ar'},o));
function stopSpeak(){sayTok++;if(TTS)try{speechSynthesis.cancel();}catch(e){}}
document.addEventListener('pointerdown',()=>{try{if(TTS){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}}catch(e){}},{once:true});

/* ---------- الاستماع للميكروفون ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const UA=navigator.userAgent||'';
const IOS=/iPad|iPhone|iPod/.test(UA)||(/Macintosh/.test(UA)&&navigator.maxTouchPoints>1);
const ANDROID=/Android/i.test(UA);
const STANDALONE=window.navigator.standalone===true||(!!window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
const EMBEDDED=(()=>{try{return window.top!==window.self;}catch(e){return true;}})()&&!/github\.io$/.test(location.hostname);
let micState=!SR?'none':EMBEDDED?'embedded':'ready';
let rec=null,recStop=null,listenTok=0;
function listen({onLive,onDone,onError}){
  abortListen();
  if(!SR){onError&&onError('none');return;}
  let r;try{r=new SR();}catch(e){onError&&onError('none');return;}
  const tok=++listenTok;rec=r;let text='',alts=[],err='',done=false,hard=null;
  r.lang='en-US';r.interimResults=true;r.continuous=false;try{r.maxAlternatives=3;}catch(e){}
  let conf=0;
  r.onresult=e=>{const res=Array.from(e.results);text=res.map(x=>x[0].transcript).join(' ').replace(/\s+/g,' ').trim();
    const cs=res.filter(x=>x.isFinal).map(x=>x[0].confidence||0).filter(c=>c>0);conf=cs.length?cs.reduce((a,b)=>a+b,0)/cs.length:0;
    const last=res[res.length-1];const pre=res.slice(0,-1).map(x=>x[0].transcript).join(' ');
    alts=last?Array.from(last).map(a=>(pre+' '+a.transcript).replace(/\s+/g,' ').trim()).filter(Boolean):[text];
    if(tok===listenTok&&onLive)onLive(text);};
  r.onerror=e=>{err=e.error||'error';};
  const finish=()=>{if(done)return;done=true;clearTimeout(hard);if(rec===r){rec=null;recStop=null;}if(tok!==listenTok)return;
    if(text){if(micState!=='embedded')micState='ok';onDone&&onDone({text,alts:alts.length?alts:[text],conf});}
    else if(err&&err!=='no-speech'&&err!=='aborted'){onError&&onError(err);}
    else onDone&&onDone({text:'',alts:[]});};
  r.onend=finish;
  recStop=()=>{try{r.stop();}catch(e){}setTimeout(finish,1600);};
  hard=setTimeout(()=>{if(recStop)recStop();},12000);
  try{r.start();}catch(e){err='start';setTimeout(finish,0);}
}
function stopListen(){if(recStop)recStop();}
function abortListen(){listenTok++;if(rec){try{rec.abort();}catch(e){}}rec=null;recStop=null;}
function micHelp(code){
  let title='الميكروفون لم يعمل',steps=[],link=false;
  if(code==='embedded'||(EMBEDDED&&/not-allowed/.test(code))){title='الميكروفون لا يعمل داخل هذه الصفحة';steps=['افتح اللعبة من رابط GitHub، فهناك يعمل الميكروفون:'];link=true;}
  else if(code==='none'){title='هذا المتصفح لا يفهم الكلام';steps=[IOS?'افتح رابط اللعبة في متصفح Safari.':'افتح رابط اللعبة في متصفح Google Chrome.'];link=true;}
  else if(code==='not-allowed'){steps=IOS?['اسمح لـ Safari بالميكروفون: الإعدادات ← Safari ← الميكروفون ← «اسمح».','أغلق الصفحة وافتحها من جديد، ثم اضغط «اسمح» عندما يسألك.']
      :ANDROID?['اضغط رمز القفل 🔒 بجانب عنوان الصفحة في الأعلى.','اختر «الأذونات» ← «الميكروفون» ← «سماح».','أعد تحميل الصفحة وجرّب مرة أخرى.']
      :['اضغط رمز القفل 🔒 بجانب عنوان الصفحة واسمح بالميكروفون، ثم أعد تحميل الصفحة.'];}
  else if(code==='service-not-allowed'){steps=IOS?['شغّل الإملاء: الإعدادات ← عام ← لوحة المفاتيح ← «تفعيل الإملاء».','تأكد أن Siri والإملاء غير ممنوعين في «مدة استخدام الجهاز».',STANDALONE?'إذا لم يعمل من أيقونة الشاشة الرئيسية، افتح الرابط في Safari مباشرة.':'ثم أغلق الصفحة وافتحها من جديد.']
      :ANDROID?['تأكد أن تطبيق Google مثبّت ومحدّث، وأن «الكتابة بالصوت» مفعّلة.','اسمح لـ Chrome بالميكروفون من إعدادات الهاتف.']
      :['اسمح للمتصفح بالميكروفون، ثم أعد تحميل الصفحة. يعمل أفضل في Google Chrome.'];}
  else if(code==='network')steps=['فهم الكلام يحتاج إلى الإنترنت. تأكد من الاتصال ثم حاول مرة أخرى.'];
  else if(code==='audio-capture')steps=['لم أجد ميكروفوناً يعمل. أغلق أي مكالمة أو تطبيق يستخدم الميكروفون، ثم حاول.'];
  else steps=['حدث خطأ بسيط. اضغط الميكروفون مرة أخرى.'];
  return `<div class="michelp"><h3>🎤 ${title}</h3><ol>${steps.filter(Boolean).map(s=>`<li>${s}</li>`).join('')}</ol>
    ${link?`<div class="linkbox"><span class="en">${APP.gh}</span><button class="btn sm" data-copy>📋 نسخ</button><a class="btn sm ok" href="${APP.gh}" target="_blank" rel="noopener">افتح ↗</a></div>`:''}</div>`;
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-copy]');if(!t)return;
  const sel=()=>{const s=t.parentElement.querySelector('.en');if(!s)return;const r=document.createRange();r.selectNodeContents(s);const g=getSelection();g.removeAllRanges();g.addRange(r);toast('الرابط محدّد، انسخه 📋');};

const NUMW=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
function normS(t){return String(t||'').toLowerCase().replace(/[’‘`]/g,"'").replace(/(\d+)(am|pm)\b/g,'$1 $2')
  .replace(/\b(\d{3,6})\b/g,m=>m.split('').join(' ')).replace(/\b(\d+)\b/g,(m,d)=>NUMW[+d]||d)
  .replace(/n't\b/g,' not').replace(/'m\b/g,' am').replace(/'re\b/g,' are').replace(/'s\b/g,' is').replace(/'d\b/g,' would').replace(/'ll\b/g,' will').replace(/'ve\b/g,' have')
  .replace(/\bwo not\b/g,'will not').replace(/\bca not\b/g,'can not').replace(/\bcannot\b/g,'can not').replace(/\blet is\b/g,'let us')
  .replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim();}

function heroMaker(onDone){
  const h=Object.assign({},World.p.hero);
  const box=document.createElement('div');box.className='ov maker';
  const row=(label,key,arr,isColor)=>`<div class="mrow"><span>${label}</span><div class="mopts">${arr.map((c,i)=>`<button class="mo ${isColor?'col':''} ${h[key]===i?'on':''}" data-k="${key}" data-v="${i}" ${isColor?`style="background:${c}"`:''} aria-label="${label} ${i+1}">${isColor?'':c}</button>`).join('')}</div></div>`;
  const paint=()=>{box.innerHTML=`<div class="res maker-in"><h2>اصنع بطلك! 🦸</h2><div class="mprev bob">${heroSVG(h,{face:'happy',pose:'cheer'})}</div>
    <label class="mlab" for="hn">ما اسمك؟</label><input class="inp" id="hn" maxlength="14" placeholder="اكتب اسمك" value="${esc(World.p.name)}" autocomplete="off">
    ${row('لون البشرة','skin',SKIN,true)}${row('الشعر','hair',['✂️','⚡','🌀','💇','🦁'],false)}${row('لون الشعر','hairC',HAIRC,true)}${row('لون القميص','shirt',SHIRT,true)}
    <button class="btn big wide" id="mgo">🚀 انطلق</button></div>`;
    $$('.mo',box).forEach(b=>b.onclick=()=>{World.p.name=$('#hn',box).value;h[b.dataset.k]=+b.dataset.v;paint();});
    $('#mgo',box).onclick=()=>{World.p.name=($('#hn',box).value.trim()||'البطل').slice(0,14);World.p.hero=h;World.p.made=true;World.save();box.remove();hud();
      if(World.p.gift){toast(`🎁 وجدنا كنزك القديم: +${D(World.p.gift)} 💎`,3500);World.p.gift=0;World.save();}onDone&&onDone();};};
  paint();document.body.appendChild(box);
}

def('closet',(tab)=>{
  setTitle('🦸 بطلي');tab=tab||'look';const h=World.p.hero;let tryOn=null;
  const tabs=[['look','الشكل','🎨'],...SLOTS];
  function draw(){
    const prev=Object.assign({},h);if(tryOn)prev[ITEM[tryOn].slot]=tryOn;
    const it=tryOn&&ITEM[tryOn],owned=it&&World.owns(it.id),worn=it&&h[it.slot]===it.id;
    $('#view').innerHTML=`<div class="closet">
      <div class="cprev"><div class="bob">${heroSVG(prev,{face:'happy',pose:'cheer'})}</div><div><h2>${esc(World.p.name||'البطل')}</h2><p class="gemline">💎 ${D(World.p.gems)} جوهرة</p><p class="muted small">اجمع الجواهر في أي لعبة، واشترِ بها لبطلك.</p></div></div>
      <div class="ctabs">${tabs.map(t=>`<button class="ctab ${t[0]===tab?'on':''}" data-t="${t[0]}">${t[2]}<span>${t[1]}</span></button>`).join('')}</div>
      <div id="cbody"></div>
      ${it?`<div class="cbar"><span><b>${it.name}</b> ${owned?'':`· 💎 ${D(it.price)}`}</span>${worn?`<button class="btn ghost sm" id="coff">اخلعه</button>`:owned?`<button class="btn sm ok" id="cwear">ارتدِه ✓</button>`:`<button class="btn sm" id="cbuy" ${World.p.gems<it.price?'disabled':''}>${World.p.gems<it.price?`ينقصك ${D(it.price-World.p.gems)} 💎`:'اشترِ'}</button>`}</div>`:''}
    </div>`;
    $$('.ctab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;tryOn=null;draw();});
    const body=$('#cbody');
    if(tab==='look'){const row=(label,key,arr,isColor,icons)=>`<div class="mrow"><span>${label}</span><div class="mopts">${arr.map((c,i)=>`<button class="mo ${isColor?'col':''} ${h[key]===i?'on':''}" data-k="${key}" data-v="${i}" ${isColor?`style="background:${c}"`:''} aria-label="${label} ${i+1}">${isColor?'':icons[i]}</button>`).join('')}</div></div>`;
      body.innerHTML=`<div class="card">${row('لون البشرة','skin',SKIN,true)}${row('الشعر','hair',[0,1,2,3,4],false,['✂️','⚡','🌀','💇','🦁'])}${row('لون الشعر','hairC',HAIRC,true)}${row('لون القميص','shirt',SHIRT,true)}
        <div class="mrow"><span>الاسم</span><input class="inp" id="cn" maxlength="14" value="${esc(World.p.name)}"></div>
        <div class="mrow"><span>الأرقام</span><div class="seg"><button data-d="ar" class="${World.p.digits!=='en'?'on':''}">١٢٣</button><button data-d="en" class="${World.p.digits==='en'?'on':''}">123</button></div></div>
        <div class="mrow"><span>صوت الإرشادات</span><div class="seg"><button data-va="1" class="${World.p.voiceAr?'on':''}">🔈 يعمل</button><button data-va="0" class="${!World.p.voiceAr?'on':''}">🔇 صامت</button></div></div></div>`;
      $$('.mo',body).forEach(b=>b.onclick=()=>{h[b.dataset.k]=+b.dataset.v;World.save();hud();draw();});
      $('#cn').onchange=()=>{World.p.name=$('#cn').value.trim().slice(0,14)||World.p.name;World.save();};
      $$('[data-d]',body).forEach(b=>b.onclick=()=>{World.p.digits=b.dataset.d;World.save();hud();draw();});
      $$('[data-va]',body).forEach(b=>b.onclick=()=>{World.p.voiceAr=b.dataset.va==='1';World.save();draw();});}
    else{const list=ITEMS.filter(x=>x[1]===tab).map(x=>ITEM[x[0]]).sort((a,b)=>(b.land===APP.land)-(a.land===APP.land)||a.price-b.price);
      body.innerHTML=`<div class="items">${tab!=='outfit'?`<button class="item ${h[tab]==='none'?'worn':''}" data-none="1"><div class="ipic none">✖</div><b>بدون</b></button>`:''}${list.map(it=>{const p=Object.assign({},h,{[it.slot]:it.id});
        return `<button class="item ${tryOn===it.id?'sel':''} ${h[it.slot]===it.id?'worn':''}" data-i="${it.id}">${it.land===APP.land?'<span class="itag">⭐ من هنا</span>':''}<div class="ipic">${heroSVG(p,{face:'smile',head:it.slot==='hat'||it.slot==='acc'})}</div><b>${it.name}</b><span class="iprice">${World.owns(it.id)?'✔ لك':`💎 ${D(it.price)}`}</span></button>`;}).join('')}</div>`;
      $$('.item',body).forEach(b=>b.onclick=()=>{if(b.dataset.none){World.equip(tab,'none');tryOn=null;draw();return;}tryOn=b.dataset.i;draw();});}
    if($('#cbuy'))$('#cbuy').onclick=()=>{const it=ITEM[tryOn];if(World.spend(it.price)){World.give(it.id);World.equip(it.slot,it.id);FX.confetti();toast(`🎉 اشتريت ${it.name}!`);draw();}};
    if($('#cwear'))$('#cwear').onclick=()=>{const it=ITEM[tryOn];World.equip(it.slot,it.id);toast('✓ يبدو رائعاً!');draw();};
    if($('#coff'))$('#coff').onclick=()=>{const it=ITEM[tryOn];if(it.slot==='outfit')World.equip('outfit','tee');else World.equip(it.slot,'none');draw();};
  }
  draw();
});

/* ---------- صندوق الكنز ---------- */
function openChest(o={}){
  const ov=document.createElement('div');ov.className='ov chestov';let taps=0;const need=3;
  const pool=ITEMS.map(x=>ITEM[x[0]]).filter(it=>it.price>0&&it.price<=(o.maxPrice||90)&&!World.owns(it.id));
  const itemWin=pool.length&&Math.random()<(o.itemChance==null?.3:o.itemChance);
  const reward=itemWin?{item:pick(pool.filter(i=>i.land===APP.land).length&&Math.random()<.6?pool.filter(i=>i.land===APP.land):pool)}:{gems:rint(o.min||8,o.max||25)};
  ov.innerHTML=`<div class="res chest-in"><h2>${o.title||'صندوق كنز! 🎁'}</h2><p class="muted">اضغط الصندوق ${D(need)} مرات لتفتحه</p>
    <button class="chest" id="chest" aria-label="افتح الصندوق"><svg viewBox="0 0 120 100"><rect x="14" y="44" width="92" height="48" rx="8" fill="#a0632d" stroke="#3b2210" stroke-width="4"/><path d="M14 52 Q14 18 60 18 Q106 18 106 52 Z" fill="#c27a3a" stroke="#3b2210" stroke-width="4" class="lid"/><rect x="54" y="42" width="12" height="18" rx="3" fill="#fbbf24" stroke="#3b2210" stroke-width="3"/><path d="M14 64 H106 M36 44 V92 M84 44 V92" stroke="#7a4518" stroke-width="4"/></svg></button>
    <div id="crew"></div></div>`;
  document.body.appendChild(ov);
  const ch=$('#chest',ov);
  ch.onclick=()=>{if(taps>=need)return;taps++;shake(ch,'wobble');buzz(25);const [x,y]=centerOf(ch);FX.burst(x,y,{n:8,colors:['#fbbf24','#fde68a']});
    if(taps<need)return;ch.classList.add('open');const hint=$('.muted',ov);if(hint)hint.style.visibility='hidden';FX.burst(x,y,{n:40,speed:360,colors:['#fbbf24','#fde68a','#ffffff','#8fe3ff']});FX.confetti();
    const r=$('#crew',ov);
    if(reward.item){World.give(reward.item.id);const p=Object.assign({},World.p.hero,{[reward.item.slot]:reward.item.id});
      r.innerHTML=`<div class="cwin"><div class="ipic big">${heroSVG(p,{face:'happy',head:reward.item.slot==='hat'||reward.item.slot==='acc'})}</div><p>حصلت على: <b>${reward.item.name}</b>!</p><div class="btns"><button class="btn ok" id="cwear">ارتدِه الآن</button><button class="btn ghost" id="cok">رائع!</button></div></div>`;
      $('#cwear',ov).onclick=()=>{World.equip(reward.item.slot,reward.item.id);ov.remove();o.onClose&&o.onClose();};}
    else{World.add(reward.gems);r.innerHTML=`<div class="cwin"><p class="gemgain">💎 +${D(reward.gems)}</p><div class="btns"><button class="btn" id="cok">رائع!</button></div></div>`;}
    $('#cok',ov).onclick=()=>{ov.remove();o.onClose&&o.onClose();};};
}

function claimDaily(onClose){World.p.lastDaily=dayKey();World.save();openChest({title:'صندوق اليوم! 🎁',min:15,max:30,itemChance:.4,onClose});}

function spotsOf(o){const {x,y,w,h}=o,S={};
  switch(o.k){
    case 'bed':S.on=[x+w*.04,y-6,w*.92,h*.5];S.under=[x+w*.08,y+h*.62,w*.84,h*.38+6];break;
    case 'box':S.in=[x,y,w,h];S.on=[x,y-16,w,16];break;
    case 'lamp':S.next=[x+w,y+h*.2,30,h*.8];S.on=[x,y-8,w,h*.4];break;
    case 'plant':S.behind=[x-8,y,w+16,h*.6];S.in=[x+w*.15,y+h*.6,w*.7,h*.4];break;
    case 'rug':S.under=[x,y,w,h];S.on=[x,y-10,w,10];break;
    case 'picture':S.behind=[x,y,w,h];break;
    case 'chair':S.on=[x,y+h*.38,w,h*.18];S.under=[x,y+h*.56,w,h*.44];break;
    case 'table':S.on=[x,y-18,w,26];S.under=[x+6,y+10,w-12,h-10];break;
    case 'cupboard':S.in=[x,y,w,h];break;
    case 'teddy':S.behind=[x,y,w,h];break;
    case 'robot':S.next=[x+w,y,30,h];S.behind=[x,y,w,h];break;
    case 'books':S.on=[x,y-14,w,14];S.under=[x,y,w,h];break;
    case 'clock':S.behind=[x,y,w,h];break;}
  return S;}

/* ===== الرسم: وحوش الكلمات، الصاروخ، والمشتبه بهم ===== */
const INK='#1d2433';
const MCOL=['#f472b6','#a78bfa','#34d399','#fbbf24','#60a5fa','#fb923c','#f87171','#2dd4bf'];
function drawWordMonster(x,cx,cy,s,col,word,mood,t,i){
  x.save();x.translate(cx,cy);x.lineJoin='round';x.lineCap='round';x.strokeStyle=INK;const lw=Math.max(2,s*.045);x.lineWidth=lw;
  const sq=mood==='pop'?1:1+Math.sin(t*4+i)*.03;x.scale(1/sq,sq);
  /* قرون */
  x.fillStyle=col;[-1,1].forEach(d=>{x.beginPath();x.moveTo(d*s*.16,-s*.36);x.quadraticCurveTo(d*s*.3,-s*.62,d*s*.36,-s*.42);x.closePath();x.fill();x.stroke();});
  /* أذرع */
  [-1,1].forEach(d=>{x.beginPath();x.moveTo(d*s*.4,0);x.quadraticCurveTo(d*s*.62,-s*.05+Math.sin(t*6+i+d)*s*.06,d*s*.58,s*.18);x.lineWidth=s*.11;x.strokeStyle=INK;x.stroke();x.lineWidth=s*.07;x.strokeStyle=col;x.stroke();});
  x.strokeStyle=INK;x.lineWidth=lw;
  /* الجسم */
  x.fillStyle=col;x.beginPath();x.moveTo(-s*.44,s*.12);x.bezierCurveTo(-s*.5,-s*.52,s*.5,-s*.52,s*.44,s*.12);x.bezierCurveTo(s*.46,s*.42,s*.2,s*.48,0,s*.46);x.bezierCurveTo(-s*.2,s*.48,-s*.46,s*.42,-s*.44,s*.12);x.fill();x.stroke();
  /* أرجل */
  [-1,1].forEach(d=>{x.beginPath();x.ellipse(d*s*.18,s*.48,s*.11,s*.06,0,0,7);x.fill();x.stroke();});
  /* العيون */
  const ey=-s*.24;if(mood==='laugh'){x.lineWidth=lw*1.2;[-1,1].forEach(d=>{x.beginPath();x.arc(d*s*.13,ey+s*.03,s*.07,Math.PI*1.1,Math.PI*1.9);x.stroke();});}
  else{[-1,1].forEach(d=>{x.fillStyle='#fff';x.beginPath();x.arc(d*s*.13,ey,s*.1,0,7);x.fill();x.stroke();x.fillStyle=INK;x.beginPath();x.arc(d*s*.13+(mood==='worried'?0:s*.02),ey+s*.02,s*.05,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(d*s*.13+s*.035,ey-s*.015,s*.018,0,7);x.fill();});}
  x.lineWidth=lw;x.beginPath();if(mood==='laugh'){x.fillStyle='#7a2e2e';x.ellipse(0,-s*.1,s*.08,s*.05,0,0,7);x.fill();x.stroke();}else{x.arc(0,-s*.13,s*.06,.2,Math.PI-.2);x.stroke();}
  /* لافتة الكلمة */
  const fs=Math.min(s*.26,s*1.2/Math.max(3,word.length));x.font=`600 ${fs}px Fredoka, "Baloo Bhaijaan 2", sans-serif`;x.direction='ltr';
  const tw=x.measureText(word).width+s*.16,th=fs*1.35;x.fillStyle='#fff';x.beginPath();x.roundRect(-tw/2,s*.02,tw,th,th*.3);x.fill();x.stroke();
  x.fillStyle=INK;x.textAlign='center';x.textBaseline='middle';x.fillText(word,0,s*.02+th/2+1);
  x.restore();}
function drawRocket(x,cx,cy,s,t){x.save();x.translate(cx,cy);x.lineJoin='round';x.strokeStyle=INK;x.lineWidth=3;
  const fl=s*(.22+Math.sin(t*30)*.05);x.fillStyle='#fb923c';x.beginPath();x.moveTo(-s*.12,s*.3);x.quadraticCurveTo(0,s*.3+fl*2,s*.12,s*.3);x.fill();x.fillStyle='#fde047';x.beginPath();x.moveTo(-s*.06,s*.3);x.quadraticCurveTo(0,s*.3+fl*1.2,s*.06,s*.3);x.fill();
  x.fillStyle='#ef4444';[-1,1].forEach(d=>{x.beginPath();x.moveTo(d*s*.14,s*.05);x.lineTo(d*s*.3,s*.3);x.lineTo(d*s*.14,s*.28);x.closePath();x.fill();x.stroke();});
  x.fillStyle='#f8fafc';x.beginPath();x.moveTo(0,-s*.5);x.bezierCurveTo(s*.22,-s*.3,s*.18,s*.2,s*.14,s*.32);x.lineTo(-s*.14,s*.32);x.bezierCurveTo(-s*.18,s*.2,-s*.22,-s*.3,0,-s*.5);x.fill();x.stroke();
  x.fillStyle='#ef4444';x.beginPath();x.moveTo(0,-s*.5);x.bezierCurveTo(s*.12,-s*.4,s*.15,-s*.32,s*.16,-s*.28);x.lineTo(-s*.16,-s*.28);x.bezierCurveTo(-s*.15,-s*.32,-s*.12,-s*.4,0,-s*.5);x.fill();x.stroke();
  x.fillStyle='#7dd3fc';x.beginPath();x.arc(0,-s*.08,s*.09,0,7);x.fill();x.stroke();x.fillStyle='rgba(255,255,255,.7)';x.beginPath();x.arc(-s*.03,-s*.11,s*.03,0,7);x.fill();
  x.restore();}

function suspectSVG(a,cls=''){

  const ty=a.big?0:18;
  s+=`<g transform="translate(60 ${ty+6}) scale(${sc}) translate(-60 0)">`;
  /* قرون الاستشعار */
  const ants=a.ant===1?[60]:[44,76];
  ants.forEach(ax=>{s+=`<path d="M${ax} 34 Q${ax+(ax-60)*.3} 14 ${ax+(ax-60)*.5} 8" stroke="${I}" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="${ax+(ax-60)*.5}" cy="8" r="5" fill="#fde047" stroke="${I}" stroke-width="2"/>`;});
  /* الذراعان والجسم */
  s+=`<path d="M24 86 Q10 92 12 104 M96 86 Q110 80 112 70" stroke="${I}" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M24 86 Q10 92 12 104 M96 86 Q110 80 112 70" stroke="${c}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  s+=`<path d="M60 30 Q98 30 100 72 Q102 112 60 116 Q18 112 20 72 Q22 30 60 30 Z" fill="${c}" stroke="${I}" stroke-width="3"/><ellipse cx="60" cy="94" rx="20" ry="14" fill="#fff" opacity=".3"/>`;
  s+=`<path d="M44 114 v8 M76 114 v8" stroke="${I}" stroke-width="6" stroke-linecap="round"/>`;
  /* العيون */
  const ex=a.eyes===1?[60]:a.eyes===2?[48,72]:[42,60,78],er=a.eyes===3?7:9;
  ex.forEach(e=>{s+=`<circle cx="${e}" cy="62" r="${er}" fill="#fff" stroke="${I}" stroke-width="2.5"/><circle cx="${e+1}" cy="63" r="${er*.5}" fill="${I}"/><circle cx="${e+2.5}" cy="60.5" r="${er*.18}" fill="#fff"/>`;});
  if(a.gl){ex.forEach(e=>{s+=`<circle cx="${e}" cy="62" r="${er+3}" fill="rgba(255,255,255,.15)" stroke="${I}" stroke-width="3"/>`;});if(ex.length>1)s+=`<path d="M${ex[0]+er+3} 62 H${ex[ex.length-1]-er-3}" stroke="${I}" stroke-width="3"/>`;
    s+=`<path d="M${ex[0]-er-3} 60 L22 56 M${ex[ex.length-1]+er+3} 60 L98 56" stroke="${I}" stroke-width="2.5"/>`;}
  s+=`<path d="M50 84 Q60 92 70 84" stroke="${I}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  /* القبعة */
  if(a.hat==='cap')s+=`<path d="M34 42 Q34 20 60 20 Q86 20 86 42 Z" fill="#ef4444" stroke="${I}" stroke-width="3"/><path d="M84 40 Q102 38 106 46 Q96 48 84 46 Z" fill="#b91c1c" stroke="${I}" stroke-width="2.5"/><circle cx="60" cy="20" r="3" fill="${I}"/>`;
  if(a.hat==='crown')s+=`<path d="M38 36 L40 14 L50 26 L60 8 L70 26 L80 14 L82 36 Z" fill="#fbbf24" stroke="${I}" stroke-width="3" stroke-linejoin="round"/><circle cx="60" cy="22" r="3" fill="#ef4444"/>`;
  if(a.hat==='hat')s+=`<rect x="40" y="6" width="40" height="28" rx="3" fill="#1f2937" stroke="${I}" stroke-width="3"/><rect x="32" y="32" width="56" height="7" rx="3" fill="#1f2937" stroke="${I}" stroke-width="3"/><rect x="40" y="24" width="40" height="5" fill="#ef4444"/>`;
  /* الشيء في اليد */
  if(a.item==='balloon')s+=`<path d="M112 70 Q116 50 110 34" stroke="${I}" stroke-width="1.8" fill="none"/><ellipse cx="110" cy="22" rx="11" ry="14" fill="#f472b6" stroke="${I}" stroke-width="2.5"/>`;
  if(a.item==='book')s+=`<rect x="100" y="56" width="22" height="26" rx="2" fill="#3b82f6" stroke="${I}" stroke-width="2.5" transform="rotate(10 111 69)"/><path d="M104 60 v20" stroke="#fff" stroke-width="2" transform="rotate(10 111 69)"/>`;
  if(a.item==='ball')s+=`<circle cx="114" cy="62" r="11" fill="#fff" stroke="${I}" stroke-width="2.5"/><path d="M104 60 Q114 66 124 60 M114 51 V73" stroke="${I}" stroke-width="2"/>`;
  if(a.item==='flower')s+=`<path d="M112 70 V48" stroke="#16a34a" stroke-width="3"/>${[0,1,2,3,4].map(k=>{const an=k*72*Math.PI/180;return `<circle cx="${112+Math.cos(an)*6}" cy="${42+Math.sin(an)*6}" r="5" fill="#f9a8d4" stroke="${I}" stroke-width="1.5"/>`;}).join('')}<circle cx="112" cy="42" r="4" fill="#facc15" stroke="${I}" stroke-width="1.5"/>`;
  s+='</g>';
  return `<svg class="sus ${cls}" viewBox="-6 -4 134 134" aria-hidden="true">${s}</svg>`;
}

function readCheck(target,res){const tw=normS(target).split(' ').filter(Boolean);let best={ratio:0,hits:tw.map(()=>false)};
  (res.alts&&res.alts.length?res.alts:[res.text]).forEach(a=>{const said=normS(a).split(' ');const hits=tw.map(w=>said.includes(w));const ratio=hits.filter(Boolean).length/tw.length;if(ratio>best.ratio)best={ratio,hits};});
  return best;}

const DEF={col:'green',eyes:2,hat:'none',gl:false,ant:2,item:'none',big:true};
const VALS={col:Object.keys(SCOL),eyes:[1,2,3],hat:['none','cap','crown','hat'],gl:[false,true],ant:[1,2],item:['none','balloon','book','ball','flower'],big:[true,false]};

  case 'eyes':{const e=`${NUMEN[v]} ${v===1?'eye':'eyes'}`;return n?[`The thief does not have ${e}.`,`ليس للص ${EYEAR[v]}.`]:[`The thief has ${e}.`,`للص ${EYEAR[v]}.`];}

  case 'gl':return v?['The thief has glasses.','اللص يلبس نظارة.']:['The thief has no glasses.','اللص بلا نظارة.'];
  case 'item':if(v==='none')return['The thief has nothing in his hands.','يدا اللص فارغتان.'];return n?[`The thief does not have a ${v}.`,`اللص لا يحمل ${ITEMAR[v]}.`]:[`The thief has a ${v}.`,`اللص يحمل ${ITEMAR[v]}.`];
  case 'ant':return[`The thief has ${NUMEN[v]} ${v===1?'antenna':'antennas'}.`,v===1?'للص قرن استشعار واحد.':'للص قرنا استشعار.'];

  const spots=[];R.objs.forEach(o=>{const S=spotsOf(o);Object.entries(S).forEach(([p,r])=>spots.push({id:o.id+':'+p,o,p,r}));});
  (R.between||[]).forEach(b=>spots.push({id:b.id+':between',o:{en:b.en.replace(/^between /,''),ar:b.ar.replace(/^بين /,'')},p:'between',r:[b.x,b.y,b.w,b.h],btw:b}));
  function showNote(){const st=R.steps[k];const first=k===0;
    $('#note').innerHTML=`<div class="nhead">📜 ${first?'رسالة على الباب':'رسالة جديدة'}</div><p class="en ntxt">${tapWords(st.en)}</p><p class="nar" id="nar" hidden>${st.ar}</p>
      <div class="row"><button class="chipbtn" id="nsay">🔊 اسمع</button><button class="chipbtn" id="ntr">🇸🇦 المعنى</button></div>`;
    $('#note').classList.remove('pop');void $('#note').offsetWidth;$('#note').classList.add('pop');
    $('#nsay').onclick=()=>speak(st.en,{rate:.8});$('#ntr').onclick=()=>{$('#nar').hidden=false;};}
  function fb(h,bad){const e=$('#efb');e.innerHTML=h;e.classList.toggle('bad',!!bad);e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop');}
  function svgPt(ev){const svg=$('#rw svg'),pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse());}
  function pop(x,y,emo){const g=$('#rfx');const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',x);t.setAttribute('y',y);t.setAttribute('font-size','30');t.setAttribute('text-anchor','middle');t.setAttribute('dominant-baseline','central');t.setAttribute('class','fpop');t.textContent=emo;g.appendChild(t);setTimeout(()=>t.remove(),1400);}
  $('#rw').addEventListener('click',ev=>{if(done)return;const p=svgPt(ev);
    if(p.x>=296&&p.x<=356&&p.y>=82&&p.y<=204){if(hasKey){done=true;$('#rw').innerHTML=roomSVG(R,{open:true});win();}
      else{fb('🔒 الباب مقفل. اقرأ الرسالة وابحث عن المفتاح!',true);buzz(40);}return;}
    const hit=spots.filter(s=>p.x>=s.r[0]&&p.x<=s.r[0]+s.r[2]&&p.y>=s.r[1]&&p.y<=s.r[1]+s.r[3]).sort((a,b)=>a.r[2]*a.r[3]-b.r[2]*b.r[3])[0];
    const st=R.steps[k];if(!st)return;
    if(hit&&hit.id===st.spot){buzz(25);const cx=hit.r[0]+hit.r[2]/2,cy=hit.r[1]+hit.r[3]/2;pop(cx,cy,st.get);got.push(st.get);
      const [x,y]=[ev.clientX,ev.clientY];FX.burst(x,y,{n:18,colors:['#fde047','#fff','#a78bfa']});
      $('#inv').insertAdjacentHTML('beforeend',`<span class="ig">${st.get}</span>`);k++;
      if(st.get==='🔑'){hasKey=true;fb('🔑 وجدت المفتاح! الآن اضغط الباب لتهرب.');speak('You found the key!',{rate:.85});
        $('#note').innerHTML=`<div class="nhead">🔑 المفتاح معك!</div><p class="en ntxt">${tapWords('Open the door!')}</p>`;}
      else{fb('📜 وجدت رسالة جديدة! اقرأها.');showNote();}return;}
    miss++;buzz(60);
    if(hit){const pe=PREPEN[hit.p],pa=PREPAR[hit.p];fb(`🙈 <span class="en">Nothing ${pe} ${esc(hit.o.en)}.</span> لا شيء ${pa} ${hit.o.ar}. اقرأ الرسالة مرة أخرى!`,true);}
    else fb('🙈 لا شيء هنا. اقرأ الرسالة مرة أخرى!',true);
    if(miss>=3)$('#nar')&&($('#nar').hidden=false);});
  function win(){speak('You escaped! Great reading!',{rate:.85});FX.confetti();const st=miss===0?3:miss<=2?2:1;RS.rooms[ri]=Math.max(RS.rooms[ri]||0,st);rsave();
    setTimeout(()=>{const hasNext=ri+1<ROOMS.length;resultOv({title:'🚪 هربت من الغرفة!',stars:st,gems:st*3+1,
      lines:[`📜 قرأت ${cntAr(R.steps.length,W_NOTE)}`,miss?`ضغطات خاطئة: ${D(miss)}`:'بدون أي خطأ! 👑',st<3?'اقرأ كل كلمة: <span class="en">on, under, in, behind…</span>':''],
      btns:[...(hasNext?[{label:'الغرفة التالية ←',cls:'gold big',fn:()=>go('room',ri+1,false)}]:[]),{label:'🔁 مرة أخرى',cls:'ghost',fn:()=>rerender()},{label:'🪐 المجرّة',cls:'ghost',fn:()=>home()}]});},1300);}
  showNote();
});

/* ===== مجرّة القصص: اقرأ، واختر طريقك ===== */
def('tale',ti=>{
  const S=TALES[ti];let pid=S.start;
  setTitle(`📖 ${S.ar}`);
  function show(){const P=S.pages[pid];
    $('#view').innerHTML=`<div class="tale">
      <div class="tpic">${P.p}</div>
      <div class="tpage" id="tp">${P.s.map(s=>`<p class="tl en">${tapWords(s)}</p>`).join('')}</div>
      <div class="tar" id="tar" hidden>${P.a.map(a=>`<p>${a}</p>`).join('')}</div>
      <div class="row cen"><button class="chipbtn" id="tsay">🔊 اقرأ لي</button><button class="chipbtn" id="tread">🎤 اقرأ بصوتك</button><button class="chipbtn" id="ttr">🇸🇦 الترجمة</button></div>
      <div id="tsc"></div>
      ${P.c?`<h3 class="sec">🤔 ماذا يحدث الآن؟ اقرأ واختر:</h3><div class="tch">${P.c.map((c,i)=>`<button class="tc" data-i="${i}"><span class="en">${esc(c[0])}</span><small class="tca" hidden>${c[1]}</small></button>`).join('')}</div>`
        :`<div class="tend ${P.end}">${P.end==='funny'?'😆 نهاية مضحكة!':'🌟 نهاية سعيدة!'}</div><p class="muted cen" id="tcount"></p>
          <div class="btns"><button class="btn gold big wide" id="tagain">🔁 جرّب طريقاً آخر</button><button class="btn ghost wide" id="tlist">📚 قصة أخرى</button></div>`}
      </div>`;
    $('#tsay').onclick=()=>speak(P.s.join(' '),{rate:.82});
    $('#ttr').onclick=()=>{$('#tar').hidden=!$('#tar').hidden;$$('.tca').forEach(e=>e.hidden=$('#tar').hidden);};
    readAloudBtn($('#tread'),()=>P.s.join(' '),c=>{const ws=$$('#tp .w');let j=0;const tw=normS(P.s.join(' ')).split(' ');
      ws.forEach(w=>{const n=normS(w.textContent);if(!n)return;const ok=c.hits[j];w.classList.toggle('ok',!!ok);w.classList.toggle('miss',!ok);j+=n.split(' ').length;});
      const st=c.ratio>=.85?3:c.ratio>=.55?2:1;$('#tsc').innerHTML=`<div class="tscore">${starRowR(st)} <b>${['','حاول مرة أخرى 👍','قراءة جيدة! 👏','قراءة ممتازة! 🌟'][st]}</b></div>`;if(st===3)World.add(1);});
    $$('.tc').forEach(b=>b.onclick=()=>{pid=P.c[+b.dataset.i][2];stopSpeak();show();window.scrollTo(0,0);});
    if(P.end){const key=ti+':'+pid,fresh=!RS.ends[key];RS.ends[key]=1;const found=Object.keys(RS.ends).filter(e=>e.startsWith(ti+':')).length,total=endsOf(ti);
      RS.stories[ti]=found>=total?3:found>=2?2:1;rsave();if(fresh){World.add(4);FX.confetti();toast('🌟 نهاية جديدة! 💎 +٤');}
      $('#tcount').innerHTML=`اكتشفت ${D(found)} من ${D(total)} نهايات في هذه القصة.`;
      $('#tagain').onclick=()=>{pid=S.start;show();window.scrollTo(0,0);};$('#tlist').onclick=()=>go('rlevels','tales',false);}}
  show();
});
const starRowR=n=>`<span class="srow">${[0,1,2].map(i=>`<i class="${i<n?'on':''}">★</i>`).join('')}</span>`;

/* ===== البداية ===== */
FX.init();
$('#back').onclick=()=>back();
$('#hgems').onclick=()=>go('closet');
$('#hhero').onclick=()=>go('closet');
if(!World.p.made)heroMaker(()=>{home();if(!RS.intro)introComic(()=>{});});
else{home();if(!RS.intro)introComic(()=>{});}

})();</script>
