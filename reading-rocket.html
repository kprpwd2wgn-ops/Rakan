<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>صاروخ القراءة Reading Rocket</title>

<link rel="apple-touch-icon" sizes="180x180" href="https://kprpwd2wgn-ops.github.io/Rakan/reading-rocket-icon-v2.png">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="https://kprpwd2wgn-ops.github.io/Rakan/reading-rocket-icon-v2.png">
<link rel="icon" type="image/png" sizes="32x32" href="https://kprpwd2wgn-ops.github.io/Rakan/reading-rocket-icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="https://kprpwd2wgn-ops.github.io/Rakan/reading-rocket-icon-192.png">
<link rel="manifest" href="https://kprpwd2wgn-ops.github.io/Rakan/reading-rocket.webmanifest">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&family=Fredoka:wght@400;500;600&family=Andika:wght@400;700&display=swap">
<style>/* Layout: a night-sky journey. Planets sit along a winding path on the home screen; reading always happens on bright "page" cards so text stays easy to read. Single committed dark look. */
:root{
  --space:#131a3a; --space-2:#1c2554; --space-3:#27326b; --glow:#7c8cff;
  --page:#fbfcff; --ink:#1b2246; --ink-2:#5b648f; --star:#ffd54f; --ok:#3ccf8e; --bad:#ff6b6b; --line:rgba(255,255,255,.14);
  --text:#eef1ff; --text-2:#aab3e0;
  --f-read:"Andika","Fredoka","Trebuchet MS",system-ui,sans-serif;
  --f-en:"Fredoka","Andika","Trebuchet MS",system-ui,sans-serif;
  --f-ar:"Baloo Bhaijaan 2",Tahoma,"Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--space)}
body{margin:0;direction:rtl;background:var(--space);color:var(--text);font-family:var(--f-ar);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 36px;min-height:100%;
  background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 120px,#fff,transparent),radial-gradient(1.5px 1.5px at 160px 60px,#ffe9a8,transparent),radial-gradient(1px 1px at 230px 170px,#fff,transparent),radial-gradient(1px 1px at 60px 210px,#c8d0ff,transparent),radial-gradient(ellipse 80% 50% at 80% 0%,rgba(124,140,255,.18),transparent 70%);
  background-size:260px 240px,260px 240px,260px 240px,260px 240px,260px 240px,100% 100%;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--space-2)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--star);outline-offset:3px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;line-height:1.25;font-weight:800}
.en{font-family:var(--f-en);direction:ltr;unicode-bidi:isolate}
.read{font-family:var(--f-read);direction:ltr;unicode-bidi:isolate}
.muted{color:var(--text-2)}
.wrap{max-width:760px;margin:0 auto}
[hidden]{display:none!important}

.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 18px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:rgba(28,37,84,.92);backdrop-filter:blur(6px);box-shadow:0 1px 0 var(--line)}
.hdr-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px}
.back{width:42px;height:42px;border-radius:14px;background:var(--space-3);display:grid;place-items:center;flex:none}
.back svg{width:22px;height:22px}
.ttl{flex:1;min-width:0;font-weight:800;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl .en{color:var(--star);font-size:20px;font-weight:600}
.pill{padding:4px 10px;border-radius:99px;background:var(--space-3);font-weight:800;font-size:14px;white-space:nowrap;flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:6px 20px;border-radius:16px;background:var(--star);color:var(--ink);font-weight:800;font-size:18px;box-shadow:0 5px 0 #c79b12;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c79b12}
.btn.ok{background:var(--ok);box-shadow:0 5px 0 #23966a}
.btn.ghost{background:var(--space-3);color:var(--text);box-shadow:0 4px 0 #10163a}
.btn.sm{min-height:40px;font-size:15px;padding:4px 14px}
.btn.wide{width:100%}
.card{background:var(--space-2);border-radius:22px;padding:16px;box-shadow:inset 0 0 0 1.5px var(--line)}
.page{background:var(--page);color:var(--ink);border-radius:22px;padding:18px;box-shadow:0 6px 0 #0c112b}
.sec{font-size:22px;margin:24px 0 12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stars{color:var(--star);letter-spacing:1px;font-size:16px;line-height:1}
.stars .off{color:rgba(255,255,255,.2)}

/* home */
.hello{display:flex;gap:14px;align-items:center}
.avatar{width:70px;height:70px;flex:none;border-radius:50%;background:var(--space-3);display:grid;place-items:center;font-size:40px;box-shadow:0 0 0 3px var(--star),0 0 24px rgba(255,213,79,.35)}
.hello h1{font-size:26px}
.lvl{font-weight:800;color:var(--star);font-size:15px}
.bar{height:12px;border-radius:99px;background:var(--space-3);overflow:hidden;margin:5px 0 2px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--star),#ff8a65);border-radius:99px;transition:width .6s}
.sub{font-size:13px;color:var(--text-2)}
.wotd{margin-top:16px;display:flex;gap:14px;align-items:center;width:100%;text-align:start}
.wotd .big{font-size:44px;line-height:1;flex:none}
.wotd .w{font-family:var(--f-read);font-size:30px;color:var(--ink);direction:ltr;display:block;line-height:1.1}
.wotd .lbl{font-size:12px;font-weight:800;color:var(--ink-2)}
.path{position:relative;margin-top:22px;display:grid;gap:6px}
.path svg.trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pnode{position:relative;display:flex;align-items:center;gap:14px;width:min(92%,460px);padding:6px 8px;border-radius:24px;text-align:start;transition:transform .15s}
.pnode:nth-child(odd){justify-self:start}
.pnode:nth-child(even){justify-self:end;flex-direction:row-reverse;text-align:end}
.pnode:hover{transform:scale(1.03)}
.planet{width:96px;height:96px;flex:none;border-radius:50%;position:relative;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55) 0 10%,transparent 32%),radial-gradient(circle at 65% 70%,rgba(0,0,0,.25),transparent 60%),var(--c);
  box-shadow:0 0 0 4px rgba(255,255,255,.08),0 0 28px color-mix(in srgb,var(--c) 55%,transparent);display:grid;place-items:center}
.planet::after{content:"";position:absolute;left:-14px;right:-14px;top:44%;height:12px;border-radius:50%;border:3px solid var(--r);transform:rotate(-14deg);opacity:.85}
.planet .pi{font-size:34px;position:relative;z-index:1}
.pnode h3{font-family:var(--f-en);font-weight:600;font-size:20px;color:#fff}
.pnode .ar{font-size:14px;color:var(--text-2)}
.pnode .pct{font-size:13px;font-weight:800;color:var(--star)}
.rocket{position:absolute;top:-8px;font-size:30px;z-index:2;filter:drop-shadow(0 0 8px rgba(255,180,80,.8));animation:hover 2s ease-in-out infinite}
.pnode:nth-child(odd) .rocket{left:-6px}.pnode:nth-child(even) .rocket{right:-6px}
@keyframes hover{50%{transform:translateY(-6px)}}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:24px}
.tool{display:flex;gap:10px;align-items:center;padding:14px;border-radius:20px;background:var(--space-2);box-shadow:inset 0 0 0 1.5px var(--line);text-align:start}
.tool .ti{font-size:30px}
.tool h3{font-size:17px}
.tool p{font-size:13px;color:var(--text-2)}

/* planet screen */
.phead{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.phead h1{font-family:var(--f-en);font-weight:600;font-size:28px;color:#fff}
.acts{display:grid;gap:10px}
.act{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:20px;background:var(--space-2);box-shadow:inset 0 0 0 1.5px var(--line);text-align:start;border-inline-start:7px solid var(--c,var(--star))}
.act .ai{font-size:32px;flex:none;width:46px;text-align:center}
.act h3{font-size:19px}
.act p{font-size:14px;color:var(--text-2)}
.act .best{margin-inline-start:auto;flex:none;text-align:center}
.sub-h{font-size:15px;font-weight:800;color:var(--text-2);margin:18px 0 8px}

/* letters & words */
.lgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (min-width:560px){.lgrid{grid-template-columns:repeat(6,1fr)}}
.lt{background:var(--page);color:var(--ink);border-radius:18px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;box-shadow:0 4px 0 #0c112b;transition:transform .15s}
.lt.seen{box-shadow:0 4px 0 #0c112b,inset 0 0 0 3px var(--ok)}
.lt.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.12) rotate(-3deg)}}
.lt .L{font-family:var(--f-read);font-size:34px;line-height:1.1;direction:ltr}
.lt .em{font-size:22px;line-height:1.2}
.lt .w{font-family:var(--f-read);font-size:13px;color:var(--ink-2);direction:ltr}
.tabs{display:flex;gap:6px;background:var(--space-2);padding:5px;border-radius:18px;margin-bottom:14px;box-shadow:inset 0 0 0 1.5px var(--line)}
.tab{flex:1;min-height:46px;border-radius:14px;font-family:var(--f-read);font-weight:700;font-size:22px;color:var(--text-2)}
.tab.on{background:var(--c,var(--star));color:var(--ink)}
.wcards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:560px){.wcards{grid-template-columns:repeat(3,1fr)}}
.wc{background:var(--page);color:var(--ink);border-radius:20px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 5px 0 #0c112b}
.letters{display:flex;gap:4px;direction:ltr}
.letters span{font-family:var(--f-read);font-size:34px;line-height:1.2;min-width:30px;text-align:center;border-radius:10px;padding:0 4px;transition:background .15s,transform .15s}
.letters span.v{color:#d6336c}
.letters span.hl{background:var(--star);transform:translateY(-4px)}
.letters span.team{color:#2b8a3e;text-decoration:underline 3px}
.wc .pic{font-size:40px;line-height:1.1;height:46px;transition:opacity .3s,transform .3s}
.wc .pic.hide{opacity:0;transform:scale(.5)}
.wc .mean{font-size:13px;color:var(--ink-2);min-height:20px}
.wc .row{justify-content:center;gap:6px}
.ic{min-width:40px;height:40px;border-radius:12px;background:#e8ecff;color:var(--ink);display:grid;place-items:center;font-size:17px;font-weight:800;padding:0 8px}
.note{background:var(--page);color:var(--ink);border-radius:18px;padding:12px 16px;margin-bottom:14px;font-weight:600;border-inline-start:7px solid var(--c,var(--star))}
.note .read{font-size:22px;color:#d6336c;font-weight:700}
.sight{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:560px){.sight{grid-template-columns:repeat(4,1fr)}}
.sw{background:var(--page);color:var(--ink);border-radius:18px;padding:12px 6px;text-align:center;box-shadow:0 4px 0 #0c112b}
.sw .read{display:block;font-size:28px;line-height:1.2}
.sw .m{font-size:12px;color:var(--ink-2)}

/* games */
.gtop{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:10px;gap:10px}
.gtop .big{font-family:var(--f-en);font-size:24px;color:var(--star)}
.stage{background:var(--page);color:var(--ink);border-radius:24px;padding:18px 14px;text-align:center;box-shadow:0 6px 0 #0c112b}
.stage.ok{animation:okb .45s}.stage.bad{animation:shake .4s}
@keyframes okb{40%{background:#e4fbef;transform:scale(1.02)}}
@keyframes shake{25%,75%{transform:translateX(-7px)}50%{transform:translateX(7px)}}
.prompt{font-family:var(--f-read);font-size:clamp(34px,10vw,52px);line-height:1.2;direction:ltr}
.prompt.sm{font-size:clamp(22px,6.5vw,30px)}
.prompt.pic{font-size:72px}
.hear{width:84px;height:84px;border-radius:50%;background:var(--star);font-size:36px;display:grid;place-items:center;margin:4px auto;box-shadow:0 5px 0 #c79b12}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.choices.three{grid-template-columns:repeat(3,1fr)}
.choices.one{grid-template-columns:1fr}
.choice{min-height:84px;border-radius:18px;background:var(--page);color:var(--ink);box-shadow:0 5px 0 #0c112b;border:3px solid transparent;display:grid;place-items:center;padding:6px 8px}
.choice.pic{font-size:40px}
.choice.txt{font-family:var(--f-read);font-size:26px;direction:ltr}
.choice.long{font-family:var(--f-read);font-size:19px;direction:ltr;min-height:60px;text-align:left;place-items:center start;padding:8px 14px}
.choice.ok{border-color:var(--ok);background:#e4fbef}
.choice.bad{border-color:var(--bad);background:#ffe5e5}
.fb{min-height:28px;text-align:center;font-weight:800;margin-top:6px}
.fb.ok{color:#178a57}.fb.bad{color:#d63031}
.slots{min-height:60px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:10px;border-radius:16px;border:3px dashed #c9d0f5;direction:ltr;margin:12px 0;background:#f2f4ff}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr}
.chip{font-family:var(--f-read);font-size:24px;padding:4px 14px;border-radius:12px;background:#e8ecff;color:var(--ink);box-shadow:0 3px 0 #c3cbf2;min-height:48px;min-width:46px}
.slots .chip{background:var(--star);box-shadow:0 3px 0 #c79b12}
.chip.used{visibility:hidden}

/* story */
.lib{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:560px){.lib{grid-template-columns:repeat(3,1fr)}}
.bookc{background:var(--page);color:var(--ink);border-radius:8px 18px 18px 8px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:inset 8px 0 0 var(--c),0 5px 0 #0c112b;text-align:center}
.bookc .e{font-size:42px;line-height:1.1}
.bookc .t{font-family:var(--f-read);font-weight:700;font-size:17px;direction:ltr;line-height:1.2}
.bookc .a{font-size:12px;color:var(--ink-2)}
.bookc .lv{font-size:12px;font-weight:800;color:var(--ink-2)}
.story{font-family:var(--f-read);font-size:clamp(22px,6vw,28px);line-height:1.75;direction:ltr;text-align:left}
.story .s{display:inline;border-radius:8px;padding:2px 0;transition:background .2s}
.story .s.cur{background:#fff3c4}
.story .w{cursor:pointer;border-radius:6px;padding:0 1px;transition:background .15s,color .15s}
.story .w.hl{background:var(--star)}
.story .w.ok{color:#178a57}
.story .w.miss{color:#d63031;text-decoration:underline wavy}
.story .w.done{color:#2b8a3e}
.sh{font-family:var(--f-read);font-size:30px;direction:ltr;text-align:center;font-weight:700;margin-bottom:6px}
.bar2{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.wordpop{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--page);color:var(--ink);border-radius:20px;padding:12px 18px;box-shadow:0 8px 30px rgba(0,0,0,.4);display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.wordpop .read{font-size:28px;font-weight:700}
.micwrap{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:12px}
.mic{width:84px;height:84px;border-radius:50%;background:#ff7a59;color:#fff;font-size:36px;display:grid;place-items:center;box-shadow:0 6px 0 #c4502f}
.mic.on{background:var(--ok);box-shadow:0 6px 0 #23966a;animation:pulse 1s infinite}
@keyframes pulse{0%{outline:0 solid rgba(60,207,142,.5)}100%{outline:18px solid rgba(60,207,142,0)}}
.live{min-height:22px;font-family:var(--f-en);color:var(--ink-2);direction:ltr;text-align:center}
.micnote{margin:12px 0;font-size:14px;background:rgba(255,213,79,.12);border:2px dashed var(--star);border-radius:16px;padding:10px 14px}

/* overlay */
.ov{position:fixed;inset:0;z-index:50;background:rgba(8,12,32,.7);display:grid;place-items:center;animation:fade .2s;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@keyframes fade{from{opacity:0}}
.res{width:min(420px,100%);background:var(--space-2);border-radius:28px;padding:22px 18px;text-align:center;box-shadow:0 0 0 2px var(--line),0 0 40px rgba(124,140,255,.35);animation:boing .45s;max-height:100%;overflow:auto}
@keyframes boing{0%{transform:scale(.6)}65%{transform:scale(1.04)}}
.res h2{font-size:28px;color:var(--star)}
.res .bigs{font-size:46px;letter-spacing:6px}
.res .bigs span{display:inline-block;animation:starin .5s backwards}
.res .bigs span:nth-child(2){animation-delay:.2s}.res .bigs span:nth-child(3){animation-delay:.4s}
@keyframes starin{from{transform:scale(0) rotate(-120deg)}}
.res .score{font-family:var(--f-en);font-size:50px;font-weight:600;line-height:1.1;direction:ltr}
.res ul{list-style:none;padding:0;margin:8px 0 16px;display:grid;gap:4px;font-weight:600}
.res .btns{display:grid;gap:10px}
.statg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.statg{grid-template-columns:repeat(3,1fr)}}
.stat{background:var(--space-2);border-radius:16px;padding:12px;box-shadow:inset 0 0 0 1.5px var(--line)}
.stat b{display:block;font-family:var(--f-en);font-size:28px;font-weight:600;color:var(--star);line-height:1.2}
.stat span{font-size:13px;font-weight:600;color:var(--text-2)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:560px){.badges{grid-template-columns:repeat(4,1fr)}}
.bdg{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;padding:10px 6px;border-radius:16px;background:var(--space-2);border:2px dashed var(--line)}
.bdg .bi{font-size:32px;filter:grayscale(1);opacity:.35}
.bdg h3{font-size:15px}
.bdg p{font-size:12px;color:var(--text-2);line-height:1.35}
.bdg.got{border:2px solid var(--star);background:rgba(255,213,79,.1)}
.bdg.got .bi{filter:none;opacity:1}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-weight:800}
.inp{min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--space-3);color:var(--text);font:inherit;font-size:18px;padding:6px 14px;width:100%}
.avs{display:flex;flex-wrap:wrap;gap:8px}
.avb{width:52px;height:52px;font-size:30px;border-radius:50%;border:3px solid transparent;background:var(--space-3)}
.avb.on{border-color:var(--star)}
.seg{display:inline-flex;background:var(--space-3);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{min-height:40px;padding:0 14px;border-radius:10px;font-weight:800}
.seg button.on{background:var(--star);color:var(--ink)}
.welcome{text-align:center;padding-top:10px}
.welcome .logo{width:104px;height:104px;border-radius:26px;margin:0 auto 10px;box-shadow:0 0 30px rgba(124,140,255,.5)}
.welcome h1{font-size:34px;color:var(--star)}

<script>(function(){

(function(){const t=dkey(new Date());if(!S.days.includes(t)){S.days.push(t);S.days=S.days.slice(-60);save();}})();

  for(const p of pref){const v=vs.find(v=>p.test(v.name)||p.test(v.lang));if(v){voice=v;return;}}voice=vs[0]||null;}
if(TTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
let sayTok=0;

const NUMW={1:'one',2:'two',3:'three',4:'four',5:'five',6:'six',7:'seven',8:'eight',9:'nine',10:'ten'};

function matchWords(target,alts){
  const tw=target.split(/\s+/);let best={s:-1,ok:[]};

      {k:'cvc:read',i:'📖',t:'اقرأ واختر الصورة',d:'اقرأ الكلمة بنفسك ثم اختر صورتها',go:()=>gameReadPick('cvc:read',ALLCVC)},
      {k:'cvc:spell',i:'✏️',t:'اكتب الكلمة',d:'اسمع ورتّب الحروف',go:()=>gameSpell()}],
 pat:[{k:'pat:learn',i:'🧩',t:'فِرق الحروف',d:`${N(PATTERNS.length)} فريقاً: sh و ee و oa وغيرها`,go:()=>go('patterns')},

      {k:'pat:which',i:'🔍',t:'أي كتابة صحيحة؟',d:'اختر الكلمة المكتوبة بشكل صحيح',go:()=>gameWhich()}],

      {k:'sent:aloud',i:'🎤',t:'اقرأ بصوت عالٍ',d:'اقرأ ٨ جمل والبرنامج يستمع',go:()=>go('aloud',{mode:'sent'})}],

};
const starsOf=k=>S.done[k]||0;
function planetPct(id){const a=ACTS[id];return Math.round(a.reduce((s,x)=>s+starsOf(x.k),0)/(a.length*3)*100);}

const LEVELS=[[0,'Space Cadet','رائد صغير'],[60,'Word Pilot','طيّار الكلمات'],[180,'Book Captain','قبطان الكتب'],[400,'Story Commander','قائد القصص'],[700,'Reading Astronaut','رائد فضاء القراءة'],[1100,'Galaxy Reader','قارئ المجرّة']];

const BADGES=[

SCREENS.mcq=(o)=>{
  setTitle(o.title);const R=o.rounds;let i=0,sc=0,lock=false,q=null,alive=true;onClean(()=>alive=false);
  view.innerHTML=`<div class="gtop"><span id="gi"></span><span>✅ <span class="big" id="gs">${N(0)}</span></span></div>
   <div class="stage" id="st"><div id="pr"></div><div class="fb" id="fb"></div></div><div class="choices ${o.cols||''}" id="ch"></div>`;
  function next(){if(!alive)return;if(i>=R){const st=rateStars(sc,R),nb=award(o.key,st);addFuel(sc);
      return result({title:st===3?'Excellent! ممتاز':st>0?'Good job! أحسنت':'Try again! حاول مرة أخرى',stars:st,score:`${sc}/${R}`,good:st>0,lines:[nb?'⭐ نجوم جديدة!':'',`+${N(sc)} وقود 🚀`]});}
    lock=false;q=o.gen(i);$('#gi').textContent=`${N(i+1)} / ${N(R)}`;$('#fb').textContent='';$('#fb').className='fb';
    $('#pr').innerHTML=q.prompt+(q.say?`<button class="hear" id="hr" aria-label="استمع">🔊</button>`:'');
    bindWordTaps($('#pr'));
    if(q.say){$('#hr').onclick=()=>say(q.say,{rate:.8});if(!q.noAuto)say(q.say,{rate:.8});}
    $('#ch').innerHTML=q.opts.map((op,k)=>`<button class="choice ${op.cls||''}" data-k="${k}">${op.html}</button>`).join('');
    $$('#ch .choice').forEach(b=>b.onclick=()=>{if(lock)return;lock=true;const op=q.opts[+b.dataset.k],stg=$('#st');stg.classList.remove('ok','bad');void stg.offsetWidth;
      if(op.ok){sc++;b.classList.add('ok');stg.classList.add('ok');$('#fb').className='fb ok';$('#fb').innerHTML=q.okMsg||pick(['Great! 🌟','Super! 👏','Yes! ✅','Well done! 💪']);}
      else{b.classList.add('bad');stg.classList.add('bad');$$('#ch .choice').forEach((c,k)=>{if(q.opts[k].ok)c.classList.add('ok');});$('#fb').className='fb bad';$('#fb').innerHTML=q.badMsg||'الجواب الصحيح باللون الأخضر';}
      $('#gs').textContent=N(sc);i++;
      if(q.after)say(q.after,{rate:.8,onend:()=>setTimeout(next,op.ok?350:900)});else setTimeout(next,op.ok?800:1500);});}
  next();
};

function gameReadPick(key,pool){const W=shuffle(pool.slice()).slice(0,10);mcq({title:'📖 اقرأ واختر الصورة',key,rounds:W.length,cols:'three',gen:i=>{const t=W[i];const ops=shuffle([t,...shuffle(pool.filter(x=>x[1]!==t[1])).slice(0,2)]);
  return{prompt:`<div class="prompt read">${t[0]}</div><p class="muted" style="font-weight:800">اقرأ الكلمة بنفسك، ثم اختر صورتها</p>`,opts:ops.map(o=>({html:o[1],cls:'pic',ok:o===t})),after:t[0],okMsg:`<span class="read">${t[0]}</span> = ${t[2]}`};}});}
function misspell(w,pat){
  const groups=[['sh','ch','th'],['ee','ea','e'],['oa','o','ow'],['ai','a','ay'],['oo','u','o'],['ar','a','or'],['or','ar','o'],['ck','k','c']];
  const out=new Set();
  if(pat==='a_e'){out.add(w.slice(0,-1));out.add(w.slice(0,-2)+'e'+w.slice(-2,-1));}
  else{const g=groups.find(g=>g[0]===pat)||[pat];g.slice(1).forEach(r=>out.add(w.replace(pat,r)));}
  if(out.size<2)out.add(w.slice(0,-1)+w.slice(-1).repeat(2));
  return[...out].filter(x=>x!==w).slice(0,2);
}
function gameWhich(){const W=shuffle(ALLPAT.slice()).slice(0,10);mcq({title:'🔍 أي كتابة صحيحة؟',key:'pat:which',rounds:10,cols:'one',gen:i=>{const t=W[i];const ops=shuffle([t[0],...misspell(t[0],t[3])]);
  return{prompt:`<div class="prompt pic">${t[1]}</div><p class="muted" style="font-weight:800">${t[2]} · اسمع واختر الكتابة الصحيحة</p>`,say:t[0],opts:ops.map(o=>({html:o,cls:'txt',ok:o===t[0]})),okMsg:`<span class="read">${t[0]}</span>`};}});}
function gameSentMatch(){const W=shuffle(SENTENCES.slice()).slice(0,8);mcq({title:'🖼️ اقرأ واختر الصورة',key:'sent:match',rounds:8,cols:'three',gen:i=>{const t=W[i];const ops=shuffle([[t[2],1],[t[3],0],[t[4],0]]);
  return{prompt:`<div class="prompt sm read">${wordsHTML(t[0])}</div><p class="muted" style="font-size:13px">اضغط على أي كلمة لا تعرفها</p>`,opts:ops.map(o=>({html:o[0],cls:'pic',ok:!!o[1]})),after:t[0],okMsg:S.showAr?t[1]:'Yes!'};}});}
function gameBlank(){const W=shuffle(SENTENCES.slice()).slice(0,8);const allW=[...new Set(SENTENCES.flatMap(s=>s[0].replace(/[.,!?]/g,'').split(' ')))].filter(w=>w.length>1);
  mcq({title:'✍️ أكمل الجملة',key:'sent:blank',rounds:8,cols:'three',gen:i=>{const t=W[i];const ws=t[0].replace(/[.]/g,'').split(' ');const cand=ws.map((w,k)=>[w,k]).filter(([w])=>w.length>1&&w!=='The');const [ans,k]=pick(cand);
    const shown=t[0].split(' ').map((w,j)=>j===k?'<b style="color:#d6336c">____</b>'+(/[.]$/.test(w)?'.':''):esc(w)).join(' ');
    const ops=shuffle([ans,...shuffle(allW.filter(x=>x.toLowerCase()!==ans.toLowerCase())).slice(0,2)]);
    return{prompt:`<div class="prompt pic" style="font-size:52px">${t[2]}</div><div class="prompt sm read">${shown}</div>`,opts:ops.map(o=>({html:esc(o),cls:'txt',ok:o===ans})),after:t[0]};}});}

/* ---------- builder engine ---------- */
SCREENS.build=(o)=>{
  setTitle(o.title);const R=o.rounds;let i=0,sc=0,placed=[],toks=[],q=null,alive=true,lock=false;onClean(()=>alive=false);
  view.innerHTML=`<div class="gtop"><span id="gi"></span><span>✅ <span class="big" id="gs">${N(0)}</span></span></div>
   <div class="stage" id="st"><div id="pr"></div><div class="slots" id="sl"></div><div class="pool" id="po"></div><div class="fb" id="fb"></div>
   <div class="bar2"><button class="btn sm" id="hb">🔊 اسمع</button><button class="btn ghost sm" id="cl">↺ امسح</button></div></div>`;
  function draw(){$('#sl').innerHTML=placed.map((k,j)=>`<button class="chip" data-p="${j}">${esc(toks[k])}</button>`).join('')||'<span style="color:#8a92bd;font-size:14px">← اضغط بالترتيب</span>';
    $('#po').innerHTML=toks.map((t,k)=>`<button class="chip ${placed.includes(k)?'used':''}" data-k="${k}">${esc(t)}</button>`).join('');
    $$('#po .chip').forEach(b=>b.onclick=()=>{if(lock)return;const k=+b.dataset.k;if(placed.includes(k))return;placed.push(k);draw();if(placed.length===q.target.length)check();});
    $$('#sl .chip').forEach(b=>b.onclick=()=>{if(lock)return;placed.splice(+b.dataset.p);draw();});}
  function check(){lock=true;const built=placed.map(k=>toks[k]);const ok=built.join(q.sep)===q.target.join(q.sep);const st=$('#st');st.classList.remove('ok','bad');void st.offsetWidth;
    if(ok){sc++;st.classList.add('ok');$('#fb').className='fb ok';$('#fb').innerHTML='Correct! صحيح 🎉';}else{st.classList.add('bad');$('#fb').className='fb bad';$('#fb').innerHTML=`الصحيح: <span class="read">${esc(q.target.join(q.sep))}</span>`;}
    $('#gs').textContent=N(sc);i++;say(q.say,{rate:.8,onend:()=>setTimeout(next,ok?400:1200)});}
  function next(){if(!alive)return;if(i>=R){const st=rateStars(sc,R),nb=award(o.key,st);addFuel(sc);return result({title:st===3?'Excellent! ممتاز':'Good job! أحسنت',stars:st,score:`${sc}/${R}`,good:st>0,lines:[nb?'⭐ نجوم جديدة!':'',`+${N(sc)} وقود 🚀`]});}
    lock=false;q=o.gen(i);toks=q.pool;placed=[];$('#gi').textContent=`${N(i+1)} / ${N(R)}`;$('#fb').textContent='';$('#pr').innerHTML=q.prompt;draw();if(q.autoSay)say(q.say,{rate:.75});}
  $('#hb').onclick=()=>say(q.say,{rate:.7});$('#cl').onclick=()=>{if(!lock){placed=[];draw();}};
  next();
};
function gameSpell(){const W=shuffle(ALLCVC.slice()).slice(0,8);const abc='abcdefghijklmnopqrstuvwxyz';

  setTitle('🧩 فِرق الحروف');
  const heardAll=()=>PATTERNS.filter(p=>p.words.every(w=>S.heard['p:'+w[0]])).length;
  view.innerHTML=`<p class="muted" style="margin-bottom:12px">بعض الحروف تعمل معاً كفريق وتصدر صوتاً جديداً. اضغط على كل كلمة لتسمعها.</p>
   ${PATTERNS.map((p,k)=>`<div class="note" style="--c:#9CCC65"><span class="read">${p.p.replace('_','…')}</span> · ${p.ar}</div>
     <div class="wcards" style="margin-bottom:18px">${p.words.map(w=>`<button class="wc" data-w="${w[0]}" data-p="${p.p}"><div class="letters">${hiPat(w[0],p.p)}</div><div class="pic">${w[1]}</div><div class="mean">${S.showAr?w[2]:''}</div></button>`).join('')}</div>`).join('')}`;
  $$('.wc').forEach(b=>b.onclick=()=>{say(b.dataset.w,{rate:.75});S.heard['p:'+b.dataset.w]=1;save();const n=heardAll();award('pat:learn',n>=PATTERNS.length?3:n>=6?2:1);});
};
function hiPat(w,p){let s,e;if(p==='a_e'){const vi=w.length-3;s=[vi,w.length-1];return w.split('').map((c,i)=>`<span class="${s.includes(i)?'team':''}">${c}</span>`).join('');}
  const i=w.indexOf(p);return w.split('').map((c,k)=>`<span class="${k>=i&&k<i+p.length?'team':''}">${c}</span>`).join('');}

/* ---------- sight words ---------- */
SCREENS.sightset=(i)=>{
  const set=SIGHT[i];setTitle(`⭐ <span class="en">${set.name}</span> · ${set.ar}`);
  view.innerHTML=`<p class="muted" style="margin-bottom:12px">هذه كلمات نراها في كل كتاب تقريباً. احفظ شكلها لتقرأها بسرعة! اضغط لتسمع.</p>
   <div class="sight">${set.words.map(w=>`<button class="sw" data-w="${esc(w[0])}"><span class="read">${esc(w[0])}</span><span class="m">${S.showAr?esc(w[1]):''}</span></button>`).join('')}</div>
   <div class="row" style="justify-content:center;margin-top:16px"><button class="btn" id="pop">🎈 لعبة: اسمع واختر</button><button class="btn ghost" id="rd">🎤 اقرأها بصوتك</button></div>`;
  $$('.sw').forEach(b=>b.onclick=()=>say(b.dataset.w,{rate:.75}));
  $('#pop').onclick=()=>{const W=shuffle(set.words.slice());mcq({title:`🎈 ${set.ar}`,key:'sight:'+(i+1),rounds:12,cols:'three',gen:k=>{const t=W[k];const ops=shuffle([t,...shuffle(set.words.filter(x=>x!==t)).slice(0,5)]);
    return{prompt:`<p class="muted" style="font-weight:800">اسمع، ثم اختر الكلمة</p>`,say:t[0],opts:ops.map(o=>({html:esc(o[0]),cls:'txt',ok:o===t})),okMsg:S.showAr?`<span class="read">${esc(t[0])}</span> = ${esc(t[1])}`:''};}});};
  $('#rd').onclick=()=>go('aloud',{mode:'set',set:i});
};

/* ---------- read aloud engine ---------- */
SCREENS.aloud=(o)=>{
  let items,title,key,timed=0;
  if(o.mode==='speed'){items=shuffle(ALLSIGHT.map(w=>({text:w[0],ar:w[1]})));title='⚡ القراءة السريعة';key='sight:speed';timed=60;}
  else if(o.mode==='set'){items=shuffle(SIGHT[o.set].words.map(w=>({text:w[0],ar:w[1]})));title=`🎤 ${SIGHT[o.set].ar}`;key=null;}
  else{items=shuffle(SENTENCES.slice()).slice(0,8).map(s=>({text:s[0],ar:s[1],pic:s[2]}));title='🎤 اقرأ بصوت عالٍ';key='sent:aloud';}
  setTitle(title);let i=0,sc=0,tries=0,t0=0,alive=true,started=!timed;onClean(()=>alive=false);
  view.innerHTML=`${micNote()}<div class="gtop"><span id="gi"></span><span>✅ <span class="big" id="gs">${N(0)}</span></span></div>
   <div class="stage" id="st"><div id="pr"></div>
    <div class="micwrap">${micAvail()?`<button class="mic" id="mic" aria-label="اقرأ">🎤</button><span style="font-weight:800" id="mh">${timed?'اضغط وابدأ القراءة':'اضغط واقرأ'}</span><div class="live" id="live"></div>`:''}<div class="fb" id="fb"></div></div>
    <div class="bar2">${micAvail()?'':`<button class="btn ok" id="said">✓ قرأتها</button>`}<button class="btn sm" id="help">🔊 ساعدني</button><button class="btn ghost sm" id="skip">تخطَّ ←</button></div></div>`;
  function finish(){if(!alive)return;alive=false;stopListen();
    if(timed){const nb=(S.best.speed||0)<sc;if(nb){S.best.speed=sc;save();}award(key,sc>=25?3:sc>=15?2:sc>=6?1:0);addFuel(sc);checkBadges();
      return result({title:'Time\'s up! انتهى الوقت',score:`${sc}`,lines:[`قرأت ${N(sc)} كلمة في دقيقة`,nb?'🏆 رقم قياسي جديد!':`رقمك القياسي: ${N(S.best.speed||0)}`],good:sc>0});}
    const st=rateStars(sc,items.length);if(key)award(key,st);addFuel(sc*2);result({title:st===3?'Amazing reader! قارئ رائع':'Good reading! أحسنت',stars:st,score:`${sc}/${items.length}`,good:st>0,lines:[`+${N(sc*2)} وقود 🚀`]});}
  function show(){if(!alive)return;if(!timed&&i>=items.length)return finish();if(timed&&i>=items.length){items=items.concat(shuffle(items.slice()));}
    tries=0;const it=items[i];$('#gi').textContent=timed?'':`${N(i+1)} / ${N(items.length)}`;$('#fb').textContent='';if($('#live'))$('#live').textContent='';
    $('#pr').innerHTML=`${it.pic?`<div style="font-size:44px">${it.pic}</div>`:''}<div class="prompt ${it.text.includes(' ')?'sm':''} read" id="tx">${it.text.split(' ').map(w=>`<span class="w">${esc(w)}</span>`).join(' ')}</div>${S.showAr&&!timed?`<p class="muted" style="color:var(--ink-2)">${esc(it.ar)}</p>`:''}`;
    bindWordTaps($('#pr'));}
  function next(ok){if(!alive)return;if(ok){sc++;S.aloud+=it().text.includes(' ')?1:0;S.wordsRead+=it().text.split(' ').length;save();checkBadges();}$('#gs').textContent=N(sc);i++;setTimeout(show,ok?600:200);}
  const it=()=>items[i];
  function startTimer(){if(started)return;started=true;t0=Date.now();const iv=setInterval(()=>{if(!alive){clearInterval(iv);return;}const left=Math.max(0,timed-(Date.now()-t0)/1000);$('#gi').textContent=`⏳ ${N(Math.ceil(left))}`;if(left<=0){clearInterval(iv);finish();}},200);onClean(()=>clearInterval(iv));}
  $('#help').onclick=()=>say(it().text,{rate:.7});$('#skip').onclick=()=>{startTimer();next(false);};
  if(!micAvail())$('#said').onclick=()=>{startTimer();$('#tx').querySelectorAll('.w').forEach(w=>w.classList.add('done'));next(true);};
  else{const mic=$('#mic');
    const go1=()=>{if(!alive)return;mic.classList.add('on');$('#mh').textContent='أنا أستمع…';
      listen({onLive:t=>{$('#live').textContent=t;},onFail:()=>{mic.classList.remove('on');rerender();},
        onDone:alts=>{if(!alive)return;mic.classList.remove('on');$('#mh').textContent='اضغط واقرأ';const r=matchWords(it().text,alts);
          $$('#tx .w').forEach((w,k)=>{w.classList.remove('ok','miss');w.classList.add(r.ok[k]?'ok':'miss');});
          const need=it().text.includes(' ')?.7:.99;
          if(r.s>=need){$('#fb').className='fb ok';$('#fb').textContent=r.s>=.99?'Perfect! ممتاز 🌟':'Good! جيد 👏';next(true);if(timed)setTimeout(()=>{if(alive)go1();},700);}
          else{tries++;$('#fb').className='fb bad';$('#fb').innerHTML=alts.length?`${tries>=2?'اضغط 🔊 لتسمع، ثم حاول':'حاول مرة أخرى! الكلمات الحمراء تحتاج تدريباً'}`:'لم أسمع شيئاً، اقرأ بصوت أعلى';if(timed)setTimeout(()=>{if(alive)go1();},500);}}});};
    mic.onclick=()=>{if(mic.classList.contains('on')){stopListen();return;}if(TTS)speechSynthesis.cancel();startTimer();go1();};}
  show();
};

/* ---------- story reader ---------- */
SCREENS.story=(k)=>{
  const s=STORIES[k];setTitle(`${s.e} <span class="en">${s.t}</span>`);let mode='idle',si=0,alive=true;onClean(()=>alive=false);
  view.innerHTML=`<div class="page"><div class="sh">${s.e} ${esc(s.t)}</div>${S.showAr?`<p style="text-align:center;color:var(--ink-2);margin-bottom:10px">${s.ar} · المستوى ${N(s.lv)}</p>`:''}
    <div class="story" id="sty">${s.text.map((t,i)=>`<span class="s" data-s="${i}">${wordsHTML(t)}</span>`).join(' ')}</div>
    <p style="color:var(--ink-2);font-size:13px;margin-top:10px">💡 اضغط على أي كلمة لتسمعها وتعرف معناها.</p>
    <div class="bar2"><button class="btn" id="listen">🔊 اقرأ لي</button><button class="btn ok" id="me">🎤 سأقرأ أنا</button><button class="btn ghost" id="quiz">❓ الأسئلة</button></div>
    <div id="aloud" hidden><div class="micwrap">${micAvail()?`<button class="mic" id="mic" aria-label="اقرأ">🎤</button><span style="font-weight:800" id="mh">اقرأ الجملة الملوّنة ثم اضغط</span><div class="live" id="live"></div>`:''}<div class="fb" id="fb"></div></div>
     <div class="bar2">${micAvail()?'':'<button class="btn ok" id="said">✓ قرأتها</button>'}<button class="btn sm" id="hlp">🔊 ساعدني</button><button class="btn ghost sm" id="skp">تخطَّ ←</button></div></div></div>
    ${micNote()}`;
  bindWordTaps($('#sty'));
  const sents=$$('#sty .s');
  const mark=i=>{sents.forEach((x,j)=>x.classList.toggle('cur',j===i));if(sents[i])sents[i].scrollIntoView({behavior:'smooth',block:'center'});};
  function readTo(i){if(!alive||mode!=='listen')return;if(i>=s.text.length){mode='idle';mark(-1);$('#listen').textContent='🔊 اقرأ لي';return;}
    mark(i);const words=$$('.w',sents[i]);let wi=0,starts=[],pos=0;const t=s.text[i];words.forEach(w=>{const idx=t.indexOf(w.textContent,pos);starts.push(idx);pos=idx+w.textContent.length;});
    const hl=n=>{words.forEach((w,j)=>w.classList.toggle('hl',j===n));};let gotBoundary=false,tm=null;
    const step=()=>{if(gotBoundary||!alive||mode!=='listen')return;hl(wi);const len=(words[wi]||{textContent:''}).textContent.length;wi++;if(wi<=words.length)tm=setTimeout(step,(220+len*70)/(S.rate*.85));};
    say(t,{rate:.85,onstart:()=>{step();},onboundary:ci=>{gotBoundary=true;clearTimeout(tm);let n=0;starts.forEach((st,j)=>{if(ci>=st)n=j;});hl(n);},
      onend:()=>{clearTimeout(tm);hl(-1);setTimeout(()=>readTo(i+1),250);}});}
  $('#listen').onclick=()=>{if(mode==='listen'){mode='idle';sayTok++;speechSynthesis.cancel();mark(-1);$$('.w').forEach(w=>w.classList.remove('hl'));$('#listen').textContent='🔊 اقرأ لي';return;}
    mode='listen';$('#aloud').hidden=true;$('#listen').textContent='⏸ إيقاف';readTo(0);};
  $('#me').onclick=()=>{mode='aloud';sayTok++;if(TTS)speechSynthesis.cancel();$('#listen').textContent='🔊 اقرأ لي';$('#aloud').hidden=false;si=0;mark(0);};
  const quiz=()=>{const Q=s.q;mcq({title:`❓ ${s.ar}`,key:'story:'+k,rounds:Q.length,cols:'one',gen:i=>{const q=Q[i];const ops=shuffle(q[2].map((o,j)=>({html:esc(o),cls:'long',ok:j===0})));
    return{prompt:`<div class="prompt sm read">${wordsHTML(q[0])}</div>${S.showAr?`<p style="color:var(--ink-2)">${esc(q[1])}</p>`:''}`,say:q[0],opts:ops,after:q[2][0]};}});};
  $('#quiz').onclick=quiz;
  const advance=ok=>{if(ok){S.aloud++;S.wordsRead+=s.text[si].split(' ').length;save();checkBadges();$$('.w',sents[si]).forEach(w=>w.classList.add('done'));}si++;
    if(si>=s.text.length){mark(-1);$('#aloud').hidden=true;mode='idle';toast('📖 أنهيت قراءة القصة! الآن أجب عن الأسئلة');addFuel(5);setTimeout(()=>{if(alive)quiz();},1200);}else{mark(si);$('#fb').textContent='';if($('#live'))$('#live').textContent='';}};
  $('#hlp').onclick=()=>say(s.text[si],{rate:.7});$('#skp').onclick=()=>advance(false);
  if(!micAvail())$('#said').onclick=()=>advance(true);
  else{const mic=$('#mic');let tries=0;mic.onclick=()=>{if(mic.classList.contains('on')){stopListen();return;}if(TTS)speechSynthesis.cancel();mic.classList.add('on');$('#mh').textContent='أنا أستمع…';
    listen({onLive:t=>{$('#live').textContent=t;},onFail:()=>{mic.classList.remove('on');rerender();},onDone:alts=>{if(!alive)return;mic.classList.remove('on');$('#mh').textContent='اقرأ الجملة الملوّنة ثم اضغط';
      const r=matchWords(s.text[si],alts);const ws=$$('.w',sents[si]);ws.forEach((w,j)=>{w.classList.remove('ok','miss');w.classList.add(r.ok[j]?'ok':'miss');});
      if(r.s>=.7){tries=0;$('#fb').className='fb ok';$('#fb').textContent=r.s>=.99?'Perfect! ممتاز 🌟':'Good! جيد 👏';setTimeout(()=>advance(true),700);}
      else{tries++;$('#fb').className='fb bad';$('#fb').textContent=tries>=2?'اضغط «ساعدني» لتسمع، ثم حاول':'حاول مرة أخرى!';}}});};}
};

/* ---------- me ---------- */
SCREENS.me=()=>{
  setTitle('🏅 إنجازاتي والإعدادات');const lv=level();
  view.innerHTML=`<div class="card" style="display:flex;gap:14px;align-items:center"><div class="avatar">${S.avatar}</div><div style="flex:1;min-width:0"><h2 style="font-size:24px">${esc(S.name)}</h2><p class="lvl">🏅 ${lv.ar} · <span class="en">${lv.en}</span></p><div class="bar"><i style="width:${lv.pct}%"></i></div></div></div>
   <h2 class="sec">أرقامي</h2><div class="statg">
    <div class="stat"><b>${S.fuel}</b><span>🚀 وقود</span></div><div class="stat"><b>${totalStars()}</b><span>⭐ نجمة</span></div>
    <div class="stat"><b>${S.wordsRead}</b><span>📖 كلمة قرأتها بصوتك</span></div><div class="stat"><b>${S.aloud}</b><span>🎤 جملة قرأتها</span></div>
    <div class="stat"><b>${STORIES.filter((x,i)=>starsOf('story:'+i)).length}/${STORIES.length}</b><span>📚 قصة</span></div><div class="stat"><b>${streak()}</b><span>🔥 أيام متتالية</span></div></div>
   <h2 class="sec">الأوسمة ${N(Object.keys(S.badges).length)}/${N(BADGES.length)}</h2>
   <div class="badges">${BADGES.map(b=>`<div class="bdg ${S.badges[b.id]?'got':''}"><span class="bi">${b.i}</span><h3>${b.t}</h3><p>${b.d}</p></div>`).join('')}</div>
   <h2 class="sec">الإعدادات</h2><div class="card">
    <div class="field"><label for="nm">الاسم</label><input class="inp" id="nm" maxlength="14" value="${esc(S.name)}"></div>
    <div class="field"><label>الشخصية</label><div class="avs">${AVATARS.map(a=>`<button class="avb ${a===S.avatar?'on':''}" data-a="${a}">${a}</button>`).join('')}</div></div>
    <div class="field"><label>سرعة الصوت</label><div class="seg"><button data-r=".75" class="${S.rate===.75?'on':''}">🐢 بطيء</button><button data-r="1" class="${S.rate===1?'on':''}">🙂 عادي</button></div></div>
    <div class="field"><label>المساعدة بالعربية</label><div class="seg"><button data-t="1" class="${S.showAr?'on':''}">ظاهرة</button><button data-t="0" class="${!S.showAr?'on':''}">مخفية (تحدٍّ)</button></div></div>
    ${SR?`<div class="field"><label>الميكروفون</label><div class="seg"><button data-m="1" class="${!S.micOff?'on':''}">🎤 أقرأ بصوتي</button><button data-m="0" class="${S.micOff?'on':''}">👆 بدون ميكروفون</button></div></div>`:''}
    <button class="btn wide" id="sv">💾 حفظ الاسم</button></div>
   <h2 class="sec">البدء من جديد</h2><div class="card"><p class="muted" style="margin-bottom:10px">يمسح النجوم والوقود والأوسمة من هذا الجهاز.</p><button class="btn ghost sm" id="rs">🗑️ مسح التقدم</button>
    <div id="cf" hidden style="margin-top:10px"><p style="font-weight:800;margin-bottom:8px">هل أنت متأكد؟</p><div class="row"><button class="btn sm" id="yes">نعم، امسح</button><button class="btn ghost sm" id="no">إلغاء</button></div></div></div>`;
  $$('.avb').forEach(b=>b.onclick=()=>{S.avatar=b.dataset.a;save();$$('.avb').forEach(x=>x.classList.toggle('on',x===b));});
  $$('[data-r]').forEach(b=>b.onclick=()=>{S.rate=+b.dataset.r;save();say('This is my reading voice.');rerender();});
  $$('[data-t]').forEach(b=>b.onclick=()=>{S.showAr=b.dataset.t==='1';save();rerender();});
  $$('[data-m]').forEach(b=>b.onclick=()=>{S.micOff=b.dataset.m==='0';save();rerender();});
  $('#sv').onclick=()=>{S.name=$('#nm').value.trim().slice(0,14)||S.name;save();toast('تم الحفظ ✅');};
  $('#rs').onclick=()=>{$('#cf').hidden=false;};$('#no').onclick=()=>{$('#cf').hidden=true;};
  $('#yes').onclick=()=>{const k={name:S.name,avatar:S.avatar,rate:S.rate,showAr:S.showAr,micOff:S.micOff};S=Object.assign(defaults(),k);save();toast('بدأنا من جديد 🌱');home();};
};

checkBadges();hud();
if(!S.name){cur={name:'welcome'};SCREENS.welcome();}else home();
})();
</script>
</body></html>
