<style>/* ===== Shared kit styles. Each game sets the tokens in its own :root ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;direction:rtl;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 28px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default;opacity:.55}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.25;text-wrap:balance}
.en{font-family:var(--f-en);direction:ltr;unicode-bidi:isolate}
.muted{color:var(--ink2)}.small{font-size:14px}
.wrap{max-width:760px;margin:0 auto}
[hidden]{display:none!important}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 14px;
  padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:var(--hdr);box-shadow:0 3px 0 var(--hdr2)}
.hdr-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px}
.back{width:42px;height:42px;border-radius:14px;background:var(--chip);display:grid;place-items:center;flex:none}
.back svg{width:22px;height:22px}
.ttl{flex:1;min-width:0;font-family:var(--f-display);font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--hdrink)}
.gems{display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:99px;background:var(--chip);font-weight:800;font-size:15px;white-space:nowrap;flex:none;color:var(--hdrink)}
.gems.pop{animation:pop .4s}
.mini{width:44px;height:44px;border-radius:50%;background:var(--chip);overflow:hidden;flex:none;box-shadow:0 0 0 2.5px var(--gold)}
.mini svg{width:100%;height:100%;display:block}
body.full .hdr{margin-bottom:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:6px 20px;border-radius:16px;background:var(--accent);color:var(--accent-ink,#fff);
  font-weight:800;font-size:18px;box-shadow:0 5px 0 var(--accent2);transition:transform .08s,box-shadow .08s;text-decoration:none}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--accent2)}
.btn.ok{background:var(--ok);box-shadow:0 5px 0 var(--ok2);color:#fff}
.btn.gold{background:var(--gold);box-shadow:0 5px 0 var(--gold2);color:#3b2a00}
.btn.ghost{background:var(--chip);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.sm{min-height:40px;font-size:15px;padding:4px 14px}
.btn.big{min-height:62px;font-size:24px;font-family:var(--f-display);font-weight:400}
.btn.wide{width:100%}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 4px 0 var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stars{color:var(--gold);letter-spacing:1px;line-height:1}
.stars .off{color:var(--line)}
.seg{display:inline-flex;background:var(--chip);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{min-height:38px;padding:0 12px;border-radius:10px;font-weight:800}
.seg button.on{background:var(--accent);color:var(--accent-ink,#fff)}
.inp{min-height:48px;border-radius:14px;border:2.5px solid var(--line);background:var(--chip);color:var(--ink);font:inherit;font-size:18px;padding:6px 14px;width:100%}

/* keypad */
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px auto 0;max-width:420px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.k{height:56px;border-radius:16px;background:var(--key);color:var(--keyink);font-family:var(--f-display);font-size:30px;box-shadow:0 4px 0 var(--key2);transition:transform .06s}
.k.pr{transform:translateY(3px);box-shadow:0 1px 0 var(--key2)}
.k.go{background:var(--ok);color:#fff;box-shadow:0 4px 0 var(--ok2)}
.k.del{font-size:24px}

/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,14,30,.62);display:grid;place-items:center;animation:fade .2s;overflow:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@keyframes fade{from{opacity:0}}
.res{width:min(420px,100%);background:var(--card);color:var(--ink);border-radius:28px;padding:20px 18px;text-align:center;box-shadow:0 8px 0 var(--line),0 20px 50px rgba(0,0,0,.35);animation:boing .45s;margin:auto}
@keyframes boing{0%{transform:scale(.6)}65%{transform:scale(1.04)}}
.res h2{font-size:28px;color:var(--accent)}
.reshero{width:120px;margin:-6px auto 0}
.reshero svg{width:100%;height:auto}
.res .bigs{font-size:48px;letter-spacing:6px;color:var(--line)}
.res .bigs span{display:inline-block;animation:starin .5s backwards}
.res .bigs span.on{color:var(--gold);text-shadow:0 3px 0 var(--gold2)}
.res .bigs span:nth-child(2){animation-delay:.2s}.res .bigs span:nth-child(3){animation-delay:.4s}
@keyframes starin{from{transform:scale(0) rotate(-120deg)}}
.bigscore{font-family:var(--f-display);font-size:50px;line-height:1.1}
.gemgain{font-family:var(--f-display);font-size:34px;color:var(--gem)}
.res ul{list-style:none;padding:0;margin:8px 0 14px;display:grid;gap:4px;font-weight:600}
.res .btns{display:grid;gap:10px}
.toasts{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:grid;justify-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--ink);color:var(--bg);font-weight:800;padding:10px 18px;border-radius:16px;animation:toastin .3s;max-width:100%;box-shadow:0 6px 20px rgba(0,0,0,.3)}
@keyframes toastin{from{transform:translateY(20px);opacity:0}}
#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:70}

/* hero */
.hero{display:block;width:100%;height:auto;overflow:visible}
.hero.headonly{overflow:hidden}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.hero .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}

/* maker + closet */
.maker-in{text-align:start}
.maker-in h2{text-align:center}
.mprev{width:150px;margin:0 auto}
.mlab{font-weight:800;display:block;margin:6px 0 4px}
.mrow{display:grid;gap:6px;margin-top:10px}
.mrow>span{font-weight:800;font-size:15px}
.mopts{display:flex;flex-wrap:wrap;gap:8px}
.mo{width:46px;height:46px;border-radius:50%;background:var(--chip);font-size:22px;border:3px solid transparent;box-shadow:0 3px 0 var(--line)}
.mo.col{border-color:rgba(0,0,0,.15)}
.mo.on{border-color:var(--accent);transform:scale(1.1)}
#mgo{margin-top:16px}
.closet{display:grid;gap:12px}
.cprev{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:22px;padding:12px;box-shadow:0 4px 0 var(--line)}
.cprev>div:first-child{width:150px;flex:none}
.cprev h2{font-size:26px}
.gemline{font-weight:800;color:var(--gem)}
.ctabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.ctab{flex:none;display:flex;flex-direction:column;align-items:center;gap:0;min-width:64px;padding:6px 8px;border-radius:14px;background:var(--chip);font-size:22px;box-shadow:0 3px 0 var(--line)}
.ctab span{font-size:12px;font-weight:800}
.ctab.on{background:var(--accent);color:var(--accent-ink,#fff)}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-bottom:70px}
@media (min-width:560px){.items{grid-template-columns:repeat(4,1fr)}}
.item{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 10px;border-radius:18px;background:var(--card);box-shadow:0 4px 0 var(--line);border:3px solid transparent;min-width:0}
.item.sel{border-color:var(--accent)}
.item.worn{border-color:var(--ok)}
.item b{font-size:13px;line-height:1.25}
.ipic{width:84px;max-width:100%;aspect-ratio:1;display:grid;place-items:center}
.ipic.big{width:130px;margin:0 auto}
.ipic.none{font-size:34px;color:var(--ink2)}
.ipic svg{width:100%;height:100%}
.iprice{font-size:13px;font-weight:800;color:var(--gem)}
.itag{position:absolute;top:4px;right:4px;font-size:10px;font-weight:800;background:var(--gold);color:#3b2a00;padding:0 6px;border-radius:8px}
.cbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);box-shadow:0 -4px 0 var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

/* chest */
.chest{width:min(220px,70vw);display:block;margin:10px auto}
.chest svg{width:100%;height:auto;display:block;overflow:visible}
.chest .lid{transform-origin:20px 52px;transition:transform .4s}
.chest.open .lid{transform:rotate(-28deg) translateY(-8px)}
.wobble{animation:wobble .35s}
@keyframes wobble{25%{transform:rotate(-6deg) scale(1.04)}75%{transform:rotate(6deg) scale(1.04)}}
.cwin{animation:boing .45s}

/* shared animations */
.shake{animation:shk .4s}
@keyframes shk{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes pop{40%{transform:scale(1.18)}}

/* mic help */
.michelp{background:var(--chip);border:2.5px dashed var(--gold);border-radius:18px;padding:12px 14px;margin:12px 0;text-align:start;color:var(--ink)}
.michelp h3{font-size:17px;margin-bottom:6px;font-family:var(--f-body);font-weight:800}
.michelp ol{margin:0 0 10px;padding-inline-start:22px;display:grid;gap:4px;font-size:15px}
.linkbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--card);border-radius:12px;padding:8px 10px}
.linkbox .en{font-size:13px;word-break:break-all;flex:1 1 180px;min-width:0;user-select:all;text-align:left}
@media (prefers-reduced-motion:reduce){.bob,.hero .eyes{animation:none}}

/* Talk Town: a sunny toy city. Three bold building cards on cream; every play screen centres on a big coral microphone. Single committed light look. */
:root{
  --bg:#fff4e4;--card:#fffdf8;--ink:#23264a;--ink2:#64688f;--line:#ecdcc3;--chip:#fbeedd;
  --hdr:#3b3f9e;--hdr2:#272a73;--hdrink:#fff6dc;--hchip:rgba(255,255,255,.15);
  --accent:#ff6b6b;--accent2:#d94c4c;--gold:#f5b82e;--gold2:#c08a12;--ok:#2fa65a;--ok2:#1f7a40;--bad:#e5484d;--gem:#0e9ac7;
  --key:#fffdf8;--keyink:#23264a;--key2:#e0d2bb;
  --f-display:"Lalezar","Baloo Bhaijaan 2",Tahoma,sans-serif;--f-body:"Baloo Bhaijaan 2",Tahoma,"Segoe UI",sans-serif;--f-en:"Fredoka","Baloo Bhaijaan 2",sans-serif;
  color-scheme:light;
}
body{background-color:var(--bg);background-image:radial-gradient(circle at 1px 1px,rgba(59,63,158,.08) 1.3px,transparent 1.7px),linear-gradient(180deg,#fff8ec,#ffefd9);background-size:22px 22px,100% 100%}
.back,.gems,.mini{background:var(--hchip)}
.back{color:var(--hdrink)}
.en{font-family:var(--f-en);direction:ltr;unicode-bidi:isolate}
.lead{margin-bottom:12px}
.cen{justify-content:center;text-align:center}
.chipbtn{display:inline-flex;align-items:center;gap:4px;min-height:38px;padding:4px 12px;border-radius:99px;background:var(--card);font-weight:800;font-size:14px;box-shadow:0 3px 0 var(--line)}
.chipbtn.gold{background:var(--gold);color:#3b2a00;box-shadow:0 3px 0 var(--gold2);animation:pop 1.6s ease-in-out infinite}
.mini2{width:38px;height:38px;border-radius:12px;background:var(--card);box-shadow:0 3px 0 var(--line);font-size:18px;display:grid;place-items:center}
.tip{background:var(--card);border-radius:16px;padding:8px 12px;font-weight:700;font-size:15px;box-shadow:0 3px 0 var(--line);margin-bottom:8px}

/* المدينة */
.mtop{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.mhero{width:100px;flex:none}
.mtxt{flex:1;min-width:0;display:grid;gap:6px}
.mtxt h1{font-size:27px;color:var(--hdr)}
.mtxt p{font-weight:700;font-size:15px;color:var(--ink2)}
.micnote{background:#fff7c2;border:2.5px dashed var(--gold2);border-radius:16px;padding:10px 12px;font-weight:700;font-size:14px;margin-bottom:12px;line-height:1.6}
.micnote .linkbox{margin-top:6px}
.town{display:grid;gap:14px;margin-bottom:12px}
.bld{display:flex;align-items:center;gap:12px;text-align:start;border-radius:26px;padding:12px 14px;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18);position:relative;overflow:hidden}
.bld::after{content:"";position:absolute;inset:auto -20px -30px auto;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12)}
.b-robo{background:linear-gradient(135deg,#4f46e5,#38bdf8)}
.b-paint{background:linear-gradient(135deg,#ec4899,#fb923c)}
.b-space{background:radial-gradient(circle at 80% 20%,rgba(255,255,255,.5) 0 1.5px,transparent 2px),radial-gradient(circle at 30% 70%,rgba(255,255,255,.4) 0 1px,transparent 1.5px),linear-gradient(135deg,#312e81,#7c3aed);background-size:46px 46px,38px 38px,100% 100%}
.bpic{width:92px;height:92px;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.2);border-radius:22px}
.bpic svg{width:84px;height:84px}
.btx{flex:1;min-width:0;display:grid;gap:3px;position:relative;z-index:1}
.btx h3{font-size:24px;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.btx p{font-weight:700;font-size:14px;opacity:.95}
.bprog{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px}
.bbar{flex:1;height:8px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden}
.bbar i{display:block;height:100%;background:#fff;border-radius:9px}
.sec{font-size:20px;margin:14px 0 8px}
.lvls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lv{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:84px;border-radius:20px;background:var(--card);box-shadow:0 4px 0 var(--line);padding:6px 2px}
.lv:disabled{opacity:.5}
.lvi{font-family:var(--f-display);font-size:28px;line-height:1.1}
.lvt{font-size:11px;font-weight:800;color:var(--ink2);text-align:center;line-height:1.2}
.lv.here{box-shadow:0 4px 0 var(--line),0 0 0 3px var(--gold);animation:pop 1.6s ease-in-out infinite}
.lv.done{background:#f0fdf4}
.wtop{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:20px;padding:12px;box-shadow:0 4px 0 var(--line);margin-bottom:8px}
.wtop b{font-family:var(--f-display);font-size:44px;color:var(--hdr);font-weight:400}
.wtop span{font-weight:800}
.bar{height:12px;border-radius:99px;background:var(--chip);overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--accent));border-radius:99px}
.wchips{display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.wchip{padding:4px 12px;border-radius:99px;background:var(--card);box-shadow:0 3px 0 var(--line);font-weight:600;font-size:16px}
.wchip small{color:var(--ink2);font-size:11px}
.comic .cbig{font-size:84px;line-height:1.1;animation:boing .5s}
.cpic{width:140px;margin:0 auto 4px;animation:boing .5s}
.cpic svg{width:100%;height:auto}
.ctext{font-size:18px;font-weight:600;margin:6px 0 12px}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent);width:26px;border-radius:9px}

/* الميكروفون */
.micwrap{position:sticky;bottom:0;z-index:6;margin:8px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:8px max(16px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(255,244,228,0),rgba(255,244,228,.96) 18%,#fff1dc)}
.nw{white-space:nowrap}
.micbar{display:flex;align-items:center;justify-content:center;gap:18px}
.mic{position:relative;width:84px;height:84px;border-radius:50%;background:linear-gradient(180deg,#ff8a8a,var(--accent));color:#fff;box-shadow:0 6px 0 var(--accent2),0 10px 18px rgba(217,76,76,.3);display:grid;place-items:center}
.mic svg{width:42px;height:42px;position:relative;z-index:1}
.mic .ring{position:absolute;inset:-6px;border-radius:50%;border:4px solid var(--accent);opacity:0}
.mic.on{background:linear-gradient(180deg,#ff5c5c,#e53e3e)}
.mic.on .ring{animation:ring 1.1s ease-out infinite}
@keyframes ring{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.45);opacity:0}}
.mic:active:not(:disabled){transform:translateY(3px);box-shadow:0 3px 0 var(--accent2)}
.mic:disabled{filter:grayscale(.6);opacity:.6}
.mside{width:48px;height:48px;border-radius:50%;background:var(--card);box-shadow:0 4px 0 var(--line);font-size:22px}
.live{min-height:30px;text-align:center;font-weight:700;color:var(--ink2);margin-top:8px;font-size:15px}
.said{color:var(--ink);font-size:18px;font-weight:600}
.hear{color:var(--accent);animation:pop 1s ease-in-out infinite;display:inline-block}
.typed{display:flex;gap:8px;margin-top:8px}
.typed input{flex:1;min-width:0;min-height:46px;border-radius:14px;border:2.5px solid var(--line);background:#fff;padding:6px 12px;font-family:var(--f-en);font-size:18px;color:var(--ink)}
.typed input:focus{border-color:var(--accent);outline:none}
.srow{display:inline-flex;gap:1px;font-size:22px;color:#e5e7eb;direction:ltr}
.srow i{font-style:normal;text-shadow:0 2px 0 rgba(0,0,0,.08)}
.srow i.on{color:#f5b82e}
.rbub{position:relative;margin-bottom:10px;min-height:58px;background:#fff;border-radius:16px;padding:6px 12px 6px 56px;box-shadow:0 4px 0 rgba(0,0,0,.1);border:2.5px solid var(--ink);display:grid;gap:1px;align-content:center;text-align:center}
.rbub::after{content:"";position:absolute;bottom:-9px;left:50%;margin-left:-8px;width:14px;height:14px;background:#fff;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg)}
.rbub b{font-size:17px;line-height:1.3}

    alts=last?Array.from(last).map(a=>(pre+' '+a.transcript).replace(/\s+/g,' ').trim()).filter(Boolean):[text];
    if(tok===listenTok&&onLive)onLive(text);};
  r.onerror=e=>{err=e.error||'error';};
  const finish=()=>{if(done)return;done=true;clearTimeout(hard);if(rec===r){rec=null;recStop=null;}if(tok!==listenTok)return;
    if(text){if(micState!=='embedded')micState='ok';onDone&&onDone({text,alts:alts.length?alts:[text],conf});}
    else if(err&&err!=='no-speech'&&err!=='aborted'){onError&&onError(err);}

  .replace(/\b(\d{3,6})\b/g,m=>m.split('').join(' ')).replace(/\b(\d+)\b/g,(m,d)=>NUMW[+d]||d)
  .replace(/n't\b/g,' not').replace(/'m\b/g,' am').replace(/'re\b/g,' are').replace(/'s\b/g,' is').replace(/'d\b/g,' would').replace(/'ll\b/g,' will').replace(/'ve\b/g,' have')
  .replace(/\bwo not\b/g,'will not').replace(/\bca not\b/g,'can not').replace(/\bcannot\b/g,'can not').replace(/\blet is\b/g,'let us')
  .replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim();}

function heroMaker(onDone){

  const paint=()=>{box.innerHTML=`<div class="res maker-in"><h2>اصنع بطلك! 🦸</h2><div class="mprev bob">${heroSVG(h,{face:'happy',pose:'cheer'})}</div>
    <label class="mlab" for="hn">ما اسمك؟</label><input class="inp" id="hn" maxlength="14" placeholder="اكتب اسمك" value="${esc(World.p.name)}" autocomplete="off">
    ${row('لون البشرة','skin',SKIN,true)}${row('الشعر','hair',['✂️','⚡','🌀','💇','🦁'],false)}${row('لون الشعر','hairC',HAIRC,true)}${row('لون القميص','shirt',SHIRT,true)}
    <button class="btn big wide" id="mgo">🚀 انطلق</button></div>`;
    $$('.mo',box).forEach(b=>b.onclick=()=>{World.p.name=$('#hn',box).value;h[b.dataset.k]=+b.dataset.v;paint();});
    $('#mgo',box).onclick=()=>{World.p.name=($('#hn',box).value.trim()||'البطل').slice(0,14);World.p.hero=h;World.p.made=true;World.save();box.remove();hud();
      if(World.p.gift){toast(`🎁 وجدنا كنزك القديم: +${D(World.p.gift)} 💎`,3500);World.p.gift=0;World.save();}onDone&&onDone();};};
  paint();document.body.appendChild(box);
}

      $$('.mo',body).forEach(b=>b.onclick=()=>{h[b.dataset.k]=+b.dataset.v;World.save();hud();draw();});

      $$('[data-d]',body).forEach(b=>b.onclick=()=>{World.p.digits=b.dataset.d;World.save();hud();draw();});

        return `<button class="item ${tryOn===it.id?'sel':''} ${h[it.slot]===it.id?'worn':''}" data-i="${it.id}">${it.land===APP.land?'<span class="itag">⭐ من هنا</span>':''}<div class="ipic">${heroSVG(p,{face:'smile',head:it.slot==='hat'||it.slot==='acc'})}</div><b>${it.name}</b><span class="iprice">${World.owns(it.id)?'✔ لك':`💎 ${D(it.price)}`}</span></button>`;}).join('')}</div>`;

});

/* ---------- صندوق الكنز ---------- */
function openChest(o={}){
  const ov=document.createElement('div');ov.className='ov chestov';let taps=0;const need=3;
  const pool=ITEMS.map(x=>ITEM[x[0]]).filter(it=>it.price>0&&it.price<=(o.maxPrice||90)&&!World.owns(it.id));
  const itemWin=pool.length&&Math.random()<(o.itemChance==null?.3:o.itemChance);
  const reward=itemWin?{item:pick(pool.filter(i=>i.land===APP.land).length&&Math.random()<.6?pool.filter(i=>i.land===APP.land):pool)}:{gems:rint(o.min||8,o.max||25)};
  ov.innerHTML=`<div class="res chest-in"><h2>${o.title||'صندوق كنز! 🎁'}</h2><p class="muted">اضغط الصندوق ${D(need)} مرات لتفتحه</p>
    <button class="chest" id="chest" aria-label="افتح الصندوق"><svg viewBox="0 0 120 100"><rect x="14" y="44" width="92" height="48" rx="8" fill="#a0632d" stroke="#3b2210" stroke-width="4"/><path d="M14 52 Q14 18 60 18 Q106 18 106 52 Z" fill="#c27a3a" stroke="#3b2210" stroke-width="4" class="lid"/><rect x="54" y="42" width="12" height="18" rx="3" fill="#fbbf24" stroke="#3b2210" stroke-width="3"/><path d="M14 64 H106 M36 44 V92 M84 44 V92" stroke="#7a4518" stroke-width="4"/></svg></button>
    <div id="crew"></div></div>`;
  document.body.appendChild(ov);
  const ch=$('#chest',ov);
  ch.onclick=()=>{if(taps>=need)return;taps++;shake(ch,'wobble');buzz(25);const [x,y]=centerOf(ch);FX.burst(x,y,{n:8,colors:['#fbbf24','#fde68a']});
    if(taps<need)return;ch.classList.add('open');const hint=$('.muted',ov);if(hint)hint.style.visibility='hidden';FX.burst(x,y,{n:40,speed:360,colors:['#fbbf24','#fde68a','#ffffff','#8fe3ff']});FX.confetti();
    const r=$('#crew',ov);
    if(reward.item){World.give(reward.item.id);const p=Object.assign({},World.p.hero,{[reward.item.slot]:reward.item.id});
      r.innerHTML=`<div class="cwin"><div class="ipic big">${heroSVG(p,{face:'happy',head:reward.item.slot==='hat'||reward.item.slot==='acc'})}</div><p>حصلت على: <b>${reward.item.name}</b>!</p><div class="btns"><button class="btn ok" id="cwear">ارتدِه الآن</button><button class="btn ghost" id="cok">رائع!</button></div></div>`;
      $('#cwear',ov).onclick=()=>{World.equip(reward.item.slot,reward.item.id);ov.remove();o.onClose&&o.onClose();};}
    else{World.add(reward.gems);r.innerHTML=`<div class="cwin"><p class="gemgain">💎 +${D(reward.gems)}</p><div class="btns"><button class="btn" id="cok">رائع!</button></div></div>`;}
    $('#cok',ov).onclick=()=>{ov.remove();o.onClose&&o.onClose();};};
}

/* ===== منطق المتاهة: الخريطة، الحركة، فهم الأوامر، والحل الأقصر ===== */
const KEYC={k:'gold',r:'red',b:'blue'},DOORC={D:'gold',R:'red',B:'blue'},CBIT={gold:1,red:2,blue:4};
const DV={up:[-1,0],down:[1,0],left:[0,-1],right:[0,1]};
function mzParse(L){const g=L.map.map(r=>r.split(''));const H=g.length,W=Math.max(...L.map.map(r=>r.length));let S=null,E=null;const keys=[],doors=[],stars=[];
  g.forEach((row,r)=>{while(row.length<W)row.push('#');row.forEach((ch,c)=>{if(ch==='S')S=[r,c];else if(ch==='E')E=[r,c];else if(KEYC[ch])keys.push({r,c,col:KEYC[ch]});else if(DOORC[ch])doors.push({r,c,col:DOORC[ch]});else if(ch==='*')stars.push({r,c});});});
  return{g,H,W,S,E,keys,doors,stars};}
const mzStart=M=>({r:M.S[0],c:M.S[1],inv:0,taken:0,open:0});
function mzBlocked(M,st,r,c){if(r<0||c<0||r>=M.H||c>=M.W)return'edge';if(M.g[r][c]==='#')return'wall';
  const di=M.doors.findIndex(d=>d.r===r&&d.c===c);if(di>=0&&!(st.open>>di&1))return'door';return'';}
const mzKeyAt=(M,st,r,c)=>M.keys.findIndex((k,i)=>k.r===r&&k.c===c&&!(st.taken>>i&1));
const mzAtExit=(M,st)=>st.r===M.E[0]&&st.c===M.E[1];
/* n=0: ينزلق حتى يصطدم أو يقف فوق مفتاح أو عند المخرج */
function mzMove(M,st,dir,n){const [dr,dc]=DV[dir];let r=st.r,c=st.c,steps=0,why='';const path=[];
  while(steps<40){if(n&&steps>=n)break;const nr=r+dr,nc=c+dc,b=mzBlocked(M,st,nr,nc);if(b){why=b;break;}r=nr;c=nc;steps++;path.push([r,c]);
    if(!n&&((r===M.E[0]&&c===M.E[1])||mzKeyAt(M,st,r,c)>=0))break;}
  return{r,c,steps,why,path};}
function mzPick(M,st,col){const ki=mzKeyAt(M,st,st.r,st.c);if(ki<0)return{ok:false,why:'nokey'};const k=M.keys[ki];if(col&&col!==k.col)return{ok:false,why:'color',col:k.col};
  return{ok:true,ki,col:k.col,st:Object.assign({},st,{inv:st.inv|CBIT[k.col],taken:st.taken|1<<ki})};}
function mzOpen(M,st,col){const adj=M.doors.map((d,i)=>[d,i]).filter(([d,i])=>!(st.open>>i&1)&&Math.abs(d.r-st.r)+Math.abs(d.c-st.c)===1&&(!col||d.col===col));
  if(!adj.length)return{ok:false,why:M.doors.some((d,i)=>!(st.open>>i&1)&&Math.abs(d.r-st.r)+Math.abs(d.c-st.c)===1)?'color':'nodoor'};
  const can=adj.find(([d])=>st.inv&CBIT[d.col]);if(!can)return{ok:false,why:'locked',col:adj[0][0].col};
  return{ok:true,di:can[1],col:can[0].col,st:Object.assign({},st,{open:st.open|1<<can[1]})};}
/* أقل عدد من الأوامر للوصول إلى المخرج */
function mzSolve(M,slidesOnly){const s0=mzStart(M),K=s=>s.r+','+s.c+','+s.inv+','+s.taken+','+s.open;const seen=new Set([K(s0)]);let q=[[s0,0]];
  while(q.length){const nq=[];for(const [s,d] of q){if(mzAtExit(M,s))return d;
    const nexts=[];for(const dir in DV)for(const n of slidesOnly?[0]:[0,1,2,3,4,5,6]){const m=mzMove(M,s,dir,n);if(m.steps)nexts.push(Object.assign({},s,{r:m.r,c:m.c}));}
    const p=mzPick(M,s);if(p.ok)nexts.push(p.st);const o=mzOpen(M,s);if(o.ok)nexts.push(o.st);
    for(const t of nexts){const k=K(t);if(!seen.has(k)){seen.add(k);nq.push([t,d+1]);}}}q=nq;}
  return -1;}

/* ---------- فهم الأوامر المنطوقة ---------- */
const DIRW={up:'up',upward:'up',upwards:'up',app:'up',op:'up',north:'up',down:'down',downward:'down',downwards:'down',town:'down',dawn:'down',done:'down',south:'down',
  left:'left',lift:'left',laughed:'left',lefty:'left',west:'left',right:'right',write:'right',rite:'right',wright:'right',ride:'right',bright:'right',light:'right',east:'right'};
const NUMG={one:1,once:1,two:2,twice:2,three:3,tree:3,free:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10};
const NUMNEAR={to:2,too:2,for:4,ate:8};
const COLW={gold:'gold',golden:'gold',yellow:'gold',red:'red',read:'red',blue:'blue',blew:'blue'};
function mzCommands(text){const t=normS(text);if(!t)return[];
  const parts=t.split(/\b(?:and then|then|and|after that|next)\b/).map(s=>s.trim()).filter(Boolean);const out=[];
  for(const p of parts){const w=p.split(' ');
    const col=w.map(x=>COLW[x]).find(Boolean)||null;
    if(/\b(pick|take|get|grab|collect|catch)\b/.test(p)&&/\b(key|keys|it|up)\b/.test(p)){out.push({k:'pick',col});continue;}
    if(/\b(open|unlock)\b/.test(p)){out.push({k:'open',col});continue;}
    const used=new Set();
    for(let i=0;i<w.length;i++){const d=DIRW[w[i]];if(!d)continue;let n=0;
      for(const j of [i+1,i+2]){const x=w[j];if(x==null||DIRW[x])break;if(used.has(j))continue;
        if(NUMG[x]){n=NUMG[x];used.add(j);break;}
        if(j===i+1&&NUMNEAR[x]&&(w[j+1]==null||/^(steps?|times?|more|squares?|blocks?)$/.test(w[j+1]))){n=NUMNEAR[x];used.add(j);break;}}
      if(!n)for(const j of [i-1,i-2,i-3]){const x=w[j];if(x==null||DIRW[x]||used.has(j))break;if(NUMG[x]){n=NUMG[x];used.add(j);break;}}
      out.push({k:'move',dir:d,n});}}

const INK='#1d2433';
const svgDoc=(inner,vb,w,h)=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" width="${w}" height="${h}">${inner}</svg>`;
const IMGC={};
function svgBitmap(key,svg,w,h){
  let e=IMGC[key];
  if(!e){e=IMGC[key]={img:new Image(),ok:false,c:{}};e.img.onload=()=>{e.ok=true;};e.img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);}
  if(!e.ok)return null;
  const dpr=Math.min(2,window.devicePixelRatio||1),cw=Math.max(1,Math.round(w*dpr)),ch=Math.max(1,Math.round(h*dpr)),k=cw+'x'+ch;
  if(!e.c[k]){const c=document.createElement('canvas');c.width=cw;c.height=ch;c.getContext('2d').drawImage(e.img,0,0,cw,ch);e.c[k]=c;}
  return e.c[k];
}
function shade(h,a){const n=parseInt(h.slice(1),16),c=v=>clamp(v+a,0,255);return'#'+((1<<24)+(c(n>>16)<<16)+(c((n>>8)&255)<<8)+c(n&255)).toString(16).slice(1);}

  case 'boat':x.beginPath();x.moveTo(-s*.38,s*.04);x.lineTo(s*.38,s*.04);x.lineTo(s*.26,s*.22);x.lineTo(-s*.26,s*.22);x.closePath();F('#92400e');x.beginPath();x.moveTo(0,s*.04);x.lineTo(0,-s*.4);x.stroke();
    x.beginPath();x.moveTo(s*.02,-s*.38);x.lineTo(s*.3,-s*.02);x.lineTo(s*.02,-s*.02);x.closePath();F(C);break;
  }
  x.restore();}

/* ===== مختبر روبو: متاهة تتحرك بصوتك ===== */
const DIRAR={up:'للأعلى',down:'للأسفل',left:'يساراً',right:'يميناً'},KEYAR={gold:'الذهبي',red:'الأحمر',blue:'الأزرق'};
def('maze',i=>{
  const L=MAZES[i],M=mzParse(L),opt=mzSolve(M);
  setTitle(`🤖 المتاهة ${D(i+1)}`);
  $('#view').innerHTML=`<div class="mz">
    <p class="tip">💡 ${L.tip}</p>
    <div class="rbub" id="rb"><b class="en">…</b><span></span></div>
    <div class="mstage" id="ms"><canvas id="mc"></canvas>
      <div class="mhud"><span class="mcnt" id="mcnt"></span><span id="minv"></span><button class="mini2" id="mre" aria-label="من جديد">↺</button></div></div>
    <div class="wcard"><span class="wct">كلمات تساعدك:</span>${L.words.map(w=>`<button class="wc en" data-w="${esc(w)}">🔊 ${esc(w)}</button>`).join('')}</div>
    <div id="mic"></div></div>`;
  const cv=$('#mc'),ctx=cv.getContext('2d');let W=360,H=240,cell=48,ox=8,oy=8;
  let alive=true,raf=0,last=performance.now(),now=0;
  let st,used,got,pos,queue,mood,moodT,busy,bump,win,sparks;
  function reset(){st=mzStart(M);used=0;got=new Set();pos=[st.c,st.r];queue=[];mood='idle';moodT=0;busy=false;bump=null;win=false;sparks=[];hudUp();}
  onClean(()=>{alive=false;cancelAnimationFrame(raf);removeEventListener('resize',size);});
  function size(){W=$('#ms').clientWidth||360;cell=Math.floor(Math.min(64,(W-16)/M.W));ox=Math.floor((W-cell*M.W)/2);oy=46;H=cell*M.H+oy+8;
    const d=Math.min(2,window.devicePixelRatio||1);cv.width=W*d;cv.height=H*d;cv.style.height=H+'px';ctx.setTransform(d,0,0,d,0,0);}
  function hudUp(){const inv=['gold','red','blue'].filter(c=>st.inv&CBIT[c]);$('#minv').innerHTML=inv.length?'🎒 '+inv.map(c=>`<span class="kchip" style="--kc:${KEYHEX[c]}">🔑</span>`).join(''):'';
    $('#mcnt').textContent=`الأوامر: ${D(used)}`;}
  function bubble(en,ar){const b=$('#rb');b.innerHTML=`<span class="bwho">${roboSVG(mood==='bump'?'bump':mood==='confused'?'confused':'happy')}</span><b class="en">${esc(en)}</b><span>${ar}</span>`;b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');roboSay(en);}
  function setMood(m,ms=1400){mood=m;moodT=ms?now+ms/1000:0;}
  const walk=path=>new Promise(res=>{queue=path.slice();queue.done=res;});
  const pause=ms=>new Promise(res=>setTimeout(res,ms));
  async function run(cmds){busy=true;mic.lock(true);
    for(const c of cmds){if(!alive)return;
      if(c.k==='move'){const m=mzMove(M,st,c.dir,c.n);used++;hudUp();
        if(m.steps){setMood('talk',0);bubble(`Going ${c.dir}${c.n?' '+NUMW[c.n]:''}!`,`أتحرك ${DIRAR[c.dir]}${c.n?` ${D(c.n)} ${c.n===1?'خطوة':c.n===2?'خطوتين':'خطوات'}`:''}!`);
          await walk(m.path);st=Object.assign({},st,{r:m.r,c:m.c});setMood('idle',0);
          if(mzAtExit(M,st))return finish();}
        if(m.why&&(c.n?m.steps<c.n:(!m.steps||m.why==='door'))){bump={dir:c.dir,t0:now};buzz(40);setMood('bump');
          if(m.why==='door')bubble('A door! It is closed.','باب! إنه مغلق.');else bubble('Bonk! A wall!','آخ! جدار!');await pause(650);}}
      else if(c.k==='pick'){used++;const p=mzPick(M,st,c.col);
        if(p.ok){st=p.st;spark(st.r,st.c,KEYHEX[p.col]);setMood('happy');bubble(`Got the ${p.col} key!`,`أخذت المفتاح ${KEYAR[p.col]}!`);buzz(30);}
        else if(p.why==='color'){setMood('confused');bubble(`Hmm, this key is ${p.col}!`,`همم، هذا المفتاح ${KEYAR[p.col].replace('ال','')}!`);}
        else{setMood('confused');bubble('There is no key here.','لا يوجد مفتاح هنا.');}await pause(700);}
      else if(c.k==='open'){used++;const o=mzOpen(M,st,c.col);
        if(o.ok){st=o.st;const d=M.doors[o.di];spark(d.r,d.c,KEYHEX[o.col]);setMood('happy');bubble('The door is open!','انفتح الباب!');buzz(30);}
        else if(o.why==='locked'){setMood('confused');bubble(`It is locked! I need the ${o.col} key.`,`مقفل! أحتاج المفتاح ${KEYAR[o.col]}.`);}
        else if(o.why==='color'){setMood('confused');bubble('That is not the right color!','اللون غير مناسب!');}
        else{setMood('confused');bubble('There is no door next to me.','لا يوجد باب بجانبي.');}await pause(700);}
      hudUp();}
    busy=false;mic.lock(false);}
  function spark(r,c,col){const rc=cv.getBoundingClientRect();FX.burst(rc.left+ox+c*cell+cell/2,rc.top+oy+r*cell+cell/2,{n:18,colors:[col,'#fff','#fde68a'],speed:220});}
  function finish(){win=true;setMood('happy',0);bubble('Yay! We did it!','يا سلام! وصلنا!');FX.confetti();
    const stars=used<=opt?3:used<=opt+2?2:1,sg=got.size,gems=stars*3+sg;T.maze[i]=Math.max(T.maze[i]||0,stars);tsave();
    setTimeout(()=>{if(!alive)return;const hasNext=i+1<MAZES.length;resultOv({title:'🎉 روبو وصل إلى المخرج!',stars,gems,
      lines:[`🗣️ عدد أوامرك: ${D(used)} (أفضل حل: ${D(opt)})`,M.stars.length?`⭐ نجوم جمعتها: ${D(sg)} من ${D(M.stars.length)}`:'',stars<3?'استخدم أوامر أقل لتحصل على ٣ نجوم':'أوامر ذكية! 👑'],
      btns:[...(hasNext?[{label:'المتاهة التالية ←',cls:'gold big',fn:()=>go('maze',i+1,false)}]:[]),{label:'🔁 مرة أخرى',cls:'ghost',fn:()=>rerender()},{label:'🏙️ المدينة',cls:'ghost',fn:()=>home()}]});},1500);}
  function onText(r){if(busy||win)return;let cmds=[];for(const a of r.alts){cmds=mzCommands(a);if(cmds.length)break;}
    if(!cmds.length){setMood('confused');bubble("Beep? I don't understand.",`بيب؟ لم أفهم. قل مثلاً: <span class="en nw">${esc(L.words[0])}</span>`);return;}
    const ws=[];cmds.forEach(c=>{if(c.k==='move'){ws.push(c.dir);if(c.n)ws.push(NUMW[c.n]);}else if(c.k==='pick')ws.push('pick up','key');else ws.push('open','door');if(c.col)ws.push(c.col);});
    if(cmds.length>1)ws.push('and');learnWords(ws);if(normS(r.text).split(' ').length>=3)T.full++;
    run(cmds);}
  const mic=micBar($('#mic'),{onText,hint:'اضغط 🎤 وقل لروبو إلى أين يذهب',onHelp:()=>{bubble(`Say: ${L.words[0]}`,`قل مثلاً: <span class="en">${esc(L.words[0])}</span>`);}});
  $$('.wc').forEach(b=>b.onclick=()=>sayEn(b.dataset.w,{rate:.85}));
  $('#mre').onclick=()=>{if(busy)return;reset();bubble("Let's try again!",'لنحاول من جديد!');};

  /* ---------- الرسم ---------- */
  function draw(){ctx.clearRect(0,0,W,H);
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#eef2ff');g.addColorStop(1,'#e0f2fe');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    for(let r=0;r<M.H;r++)for(let c=0;c<M.W;c++){const X=ox+c*cell,Y=oy+r*cell,ch=M.g[r][c];
      if(ch==='#'){ctx.fillStyle='#6366f1';ctx.strokeStyle='#312e81';ctx.lineWidth=2.5;ctx.beginPath();ctx.roundRect(X+2,Y+2,cell-4,cell-4,cell*.22);ctx.fill();ctx.stroke();
        ctx.fillStyle='rgba(255,255,255,.28)';ctx.beginPath();ctx.roundRect(X+6,Y+5,cell-12,cell*.22,cell*.1);ctx.fill();continue;}
      ctx.fillStyle=(r+c)%2?'#ffffff':'#f1f5ff';ctx.fillRect(X,Y,cell,cell);}
    ctx.strokeStyle='rgba(99,102,241,.18)';ctx.lineWidth=1;ctx.strokeRect(ox,oy,cell*M.W,cell*M.H);
    /* المخرج */
    const [er,ec]=M.E,ex=ox+ec*cell+cell/2,ey=oy+er*cell+cell/2;for(let k=3;k>0;k--){ctx.fillStyle=['#f0abfc','#c084fc','#7c3aed'][3-k];ctx.beginPath();ctx.arc(ex,ey,cell*.13*k+Math.sin(now*3+k)*1.5,0,7);ctx.fill();}
    ctx.save();ctx.translate(ex,ey);ctx.rotate(now*2);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();for(let a=0;a<12;a+=.3){const rr=a*cell*.03;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}ctx.stroke();ctx.restore();
    /* البداية */
    const [sr,sc]=M.S;ctx.fillStyle='rgba(250,204,21,.35)';ctx.beginPath();ctx.arc(ox+sc*cell+cell/2,oy+sr*cell+cell/2,cell*.36,0,7);ctx.fill();
    M.stars.forEach((s,k)=>{if(!got.has(k))drawStar(ctx,ox+s.c*cell+cell/2,oy+s.r*cell+cell/2+Math.sin(now*3+k)*2,cell*.26,'#fde047');});

const PIRR={fish:'fish',butterfly:'butterflies'};

function parsePaint(text){const t=normS(text);if(!t)return{items:[]};const w=t.split(' ');
  if(/\b(clear|clean|erase|delete everything|start again|new picture)\b/.test(t))return{clear:true,items:[]};

    else if(x==='three'&&i>0&&(PCOL[w[i-1]]||PSIZE[w[i-1]])&&!(w[i+1]&&(PNOUNS[w[i+1]]||PPLUR[w[i+1]])))n='tree';

    out.push({n,c,z,k:Math.min(10,k==null?(pl?3:1):k),said:{c:!!c,z:!!z,k:k!=null}});last=i;}

  return `${it.k===1?(/^[aeiou]/.test(adj||it.n)?'an':'a'):NUMW[it.k]||it.k} ${adj?adj+' ':''}${it.k===1?it.n:pluralN(it.n)}`;}

/* ===== محطة الفضاء: زِب يسأل، وأنت تجيب بكلامك ===== */
const CATRE={};Object.entries(CATS).forEach(([k,v])=>{CATRE[k]=v.split('|').sort((a,b)=>b.length-a.length).map(w=>({w,re:new RegExp('\\b'+w.replace(/ /g,'\\s+')+'(?:s|es)?\\b')}));});
const NOARTS=new Set(NOART.split('|'));
const art=x=>NOARTS.has(x)?'':/^[aeiou]/.test(x)?'an':'a';
const cap=x=>PROPER[x]||x.replace(/\b[a-z]/g,c=>c.toUpperCase());
const IRR={fish:'fish',sheep:'sheep',mouse:'mice',deer:'deer',fox:'foxes',wolf:'wolves',butterfly:'butterflies',puppy:'puppies',bunny:'bunnies',octopus:'octopuses',strawberry:'strawberries',cherry:'cherries',peach:'peaches',mango:'mangoes',potato:'potatoes',tomato:'tomatoes'};
const plural=x=>IRR[x]||(/(s|sh|ch|x)$/.test(x)?x+'es':x+'s');
function catFind(cats,t){for(const c of cats.split(',')){for(const e of (CATRE[c]||[]))if(e.re.test(t))return e.w;}return'';}
const fillN=s=>String(s||'').replace(/\{name\}/g,World.p.name||'friend');
function relevant(st,t){const x=st.cat?catFind(st.cat,t):'';let ok=!!x;
  if(!ok&&st.re){const n=normS(World.p.name||'');ok=new RegExp('\\b(?:'+st.re.replace(/\{name\}/g,n||'zzzz')+')\\b').test(t);}return{ok,x};}
const subst=(s,x)=>s.replace(/\{X\}/g,cap(x)).replace(/\{xs\}/g,plural(x)).replace(/\{xa\}/g,COLAR[x]||x).replace(/\{x\}/g,x);
function modelOf(st,x){if(st.tpl&&x)return subst(st.tpl.replace(/\{a\}\s*/g,()=>{const a=art(x);return a?a+' ':'';}),x);return fillN(st.ex);}
const GENERIC=[['Great!','رائع!'],['Cool!','جميل!'],['Nice!','حلو!'],['Awesome!','مدهش!'],['Good answer!','جواب جيد!']];
function reactOf(st,t,x){for(const [p,en,ar] of (st.react||[]))if(new RegExp('\\b(?:'+p+')\\b').test(t))return[en,ar];
  if(st.after){if(/\{(X|x|xs|xa)\}/.test(st.after.join(' '))&&!x)return pick(GENERIC);return[subst(st.after[0],x),subst(st.after[1],x)];}return pick(GENERIC);}
/* النجوم: ١ تكلّمت بالإنجليزية، ٢ أجبت عن السؤال، ٣ بجملة كاملة */
function evalAns(st,res){const alts=(res.alts&&res.alts.length?res.alts:[res.text]).filter(Boolean);
  let best=alts[0]||'',rel={ok:false,x:''};for(const a of alts){const r=relevant(st,normS(a));if(r.ok){best=a;rel=r;break;}}
  const t=normS(best),n=t?t.split(' ').length:0,spoke=n>0,full=n>=(st.min||3);
  return{stars:spoke?1+(rel.ok?1:0)+(rel.ok&&full?1:0):0,spoke,rel,full,raw:best,x:rel.x,model:modelOf(st,rel.x),norm:t};}
const ALLW=new Set(Object.values(CATS).join('|').split('|').concat(['yes','no','please','thank','thanks','hello','hi','bye','goodbye','my','name','like','love','favorite','want','have','can','eat','drink','wear','play','birthday','happy','night','morning']));

const NUMV=x=>{const i=NUMW.indexOf(x);return i>=0?i:x==='hundred'?100:x==='thousand'?1000:x==='million'?1000000:null;};

  function dots(){$('#ad').innerHTML=V.steps.map((_,k)=>`<i class="${k<si?'done':k===si?'on':''}">${k<si?'★':''}</i>`).join('');}
  function sign(h){const s=$('#asg');s.innerHTML=h;s.hidden=false;s.classList.remove('pop');void s.offsetWidth;s.classList.add('pop');}
  function particles(list,cls,n=14){const fx=$('#afx');for(let k=0;k<n;k++){const e=document.createElement('span');e.className='ptc '+cls;e.textContent=pick([].concat(list));
      e.style.left=(Math.random()*92+2)+'%';e.style.animationDelay=(Math.random()*1.2)+'s';e.style.fontSize=(16+Math.random()*16)+'px';fx.appendChild(e);setTimeout(()=>e.remove(),4200);}}
  function weather(x){stg.classList.remove('rainy','snowy','sunny','night');
    if(/rain/.test(x)){stg.classList.add('rainy');particles(['💧'],'fall',22);}else if(/snow|cold|winter/.test(x)){stg.classList.add('snowy');particles(['❄️'],'fall',20);}
    else if(/sun|hot|summer|warm|nice/.test(x)){stg.classList.add('sunny');sign('☀️');}else if(/wind|dust/.test(x))particles(['🍃','💨'],'blow',14);
    else if(/cloud|fog|cool/.test(x))particles(['☁️'],'blow',8);else if(/spring/.test(x))particles(['🌸','🌷'],'fall',16);else if(/autumn|fall/.test(x))particles(['🍂','🍁'],'fall',16);else if(/storm/.test(x))particles(['⛈️','⚡'],'fall',10);}
  function fx(st,e){const [kind,arg]=(st.fx||'').split(':'),x=e.x||'';const em=arg?(EMO[arg]||arg):EMO[x];
    switch(kind){
      case 'name':{const m=e.norm.match(/\b(?:my name is|name is|i am|call me|it is)\s+([a-z]+)/);const nm=m?cap(m[1]):(World.p.name||'');if(nm)sign(`👋 <span class="en">${esc(nm)}</span>`);break;}
      case 'mood':setMood(/sad|angry|bored|sick|not good|scared/.test(e.norm)?'sad':/tired|sleepy/.test(e.norm)?'sad':/happy|great|excited|amazing|awesome|super|fine|good/.test(e.norm)?'laugh':'happy',2600);break;
      case 'num':{const n=NUMV(x);if(n!=null)sign(`🎈 ${D(n)} 🎈`);break;}
      case 'globe':if(x)sign(`🌍 <span class="en">${esc(cap(x))}</span>`);break;
      case 'color':if(COLHEX[x]){col=COLHEX[x];T.zcol=col;tsave();zib();const [cx,cy]=centerOf($('#zw'));FX.burst(cx,cy,{n:30,colors:[col,'#fff',col]});}break;
      case 'sky':if(COLHEX[x])stg.style.setProperty('--sky',COLHEX[x]);break;
      case 'grass':if(COLHEX[x])stg.style.setProperty('--ground',COLHEX[x]);break;
      case 'show':if(em){held=em;heldSz=1;heldGlow=null;zib();}break;
      case 'eat':if(em){const fx2=$('#afx'),e2=document.createElement('span');e2.className='ptc eat';e2.textContent=em;fx2.appendChild(e2);setTimeout(()=>e2.remove(),1300);
        setTimeout(()=>{if(alive)setMood('chew',1600);},900);}break;
      case 'wear':if(em){if(HEADW.test(x))hat=em;else{held=em;heldSz=1;}zib();}break;
      case 'hearts':particles(['❤️','💕','💖'],'rise',16);break;
      case 'fly':if(em){const fx2=$('#afx'),e2=document.createElement('span');e2.className='ptc flyby';e2.textContent=em;fx2.appendChild(e2);setTimeout(()=>e2.remove(),3200);}break;
      case 'count':{const n=Math.min(10,NUMV(x)||5),it=arg?(EMO[arg]||'⭐'):(held||'⭐');sign(it.repeat(n));break;}
      case 'size':if(EMO[x]){held=EMO[x];}if(held){heldSz=/big|large|huge|giant/.test(e.norm)||/elephant|whale|giraffe|hippo|dinosaur/.test(x)?2.1:/small|little|tiny/.test(e.norm)?.55:1.3;zib();}break;
      case 'tint':if(COLHEX[x]){heldGlow=COLHEX[x];if(!held)held='🎁';zib();}break;
      case 'party':FX.confetti();particles(['🎈','🎉','🎊'],'rise',14);break;
      case 'night':stg.classList.add('night');break;
      case 'jump':{const z=$('#zw');z.classList.remove('jump');void z.offsetWidth;z.classList.add('jump');setMood('laugh',1800);break;}
      case 'coin':World.add(5);{const [cx,cy]=centerOf($('#zw'));FX.burst(cx,cy,{n:20,emoji:['💎'],speed:240,size:4});}toast('💎 +٥ هدية من زِب!');break;
      case 'weather':weather(arg||x||e.norm);break;}}
  function ask(){const st=V.steps[si];tries=0;bonusFor=-1;$('#ans').hidden=true;
    $('#qen').textContent=fillN(st.q);$('#qar').textContent=fillN(st.qa);dots();setMood('talk');busy=false;mic.lock(false);
    zibSay(fillN(st.q),{onend:()=>{if(alive&&mood==='talk')setMood('happy');}});}
  function hl(raw,x){const r=esc(raw);if(!x)return r;try{return r.replace(new RegExp('\\b('+x.replace(/ /g,'\\s+')+')(s|es)?\\b','i'),'<mark>$1$2</mark>');}catch(err){return r;}}
  function showAns(e,ok,note,rep){const a=$('#ans');const s=ok?Math.max(1,scores[si]||1):0;
    a.innerHTML=`${ok?`<div class="arow">${starRow(s)}<b>${['','تكلّمت بالإنجليزية 👍','فهمتك! 👏','جملة كاملة! 🌟'][s]}</b></div>`:''}
      <p class="en said">“${hl(e.raw,e.x)}”</p>
      ${rep?`<p class="zrep"><b class="en">${esc(rep[0])}</b><span>${rep[1]}</span></p>`:''}
      ${note?`<p class="note">${note}</p>`:''}
      ${ok&&e.rel.ok&&!e.full?`<p class="better">✨ قلها كاملة: <span class="en">${esc(e.model)}</span> <button class="mini2" id="bsay" aria-label="اسمع">🔊</button><br><small>اضغط 🎤 وقلها كاملة لتربح نجمة إضافية!</small></p>`:''}
      ${ok?`<button class="btn gold big wide" id="anext">${si<N-1?'السؤال التالي ←':'🏁 النهاية'}</button>`:''}`;
    a.hidden=false;if($('#bsay'))$('#bsay').onclick=()=>sayEn(e.model,{rate:.85});if($('#anext'))$('#anext').onclick=next;}
  function next(){stopSpeak();si++;if(si>=N)return finish();ask();}
  function onText(r){if(busy)return;const st=V.steps[si],e=evalAns(st,r);
    if(bonusFor===si){if(e.rel.ok&&e.full){scores[si]=3;fulls++;T.full++;tsave();bonusFor=-1;const [x,y]=centerOf($('#ans'));FX.burst(x,y,{n:24});zibSay('Perfect sentence!');
        showAns(e,true,'⭐ رائع! جملة كاملة.',['Perfect sentence!','جملة ممتازة!']);}
      else{zibSay(e.model,{rate:.85});showAns(e,true,`حاول أن تقول: <span class="en">${esc(e.model)}</span>`);}return;}
    if(!e.spoke){mic.say('لم أسمع كلمات إنجليزية… جرّب مرة أخرى');return;}
    if(!e.rel.ok&&tries<2){tries++;setMood('wow',1800);
      if(tries===1){zibSay("Hmm? I don't understand. Can you say it again?");showAns(e,false,'همم؟ لم يفهم زِب. قلها مرة أخرى بطريقة أخرى!');}
      else{zibSay('Try like this: '+fillN(st.ex),{rate:.85});showAns(e,false,`💡 جرّب مثلاً: <span class="en">${esc(fillN(st.ex))}</span><br><small>${fillN(st.exa)}</small>`);}return;}
    const stars=e.rel.ok?e.stars:1;scores[si]=Math.max(scores[si]||0,stars);
    if(e.rel.ok&&e.full){fulls++;T.full++;}
    fresh+=learnWords(e.x&&e.x.includes(' ')?e.norm.replace(e.x,' ').split(' ').filter(w=>ALLW.has(w)).concat([e.x]):e.norm.split(' ').filter(w=>ALLW.has(w)));
    if(e.rel.ok)fx(st,e);
    const rep=e.rel.ok?reactOf(st,e.norm,e.x):["Okay! Let's go on.",'حسناً! لنكمل.'];
    zibSay(rep[0]);showAns(e,true,null,rep);if(e.rel.ok&&!e.full)bonusFor=si;}
  function finish(){busy=true;mic.lock(true);const tot=scores.reduce((a,b)=>a+(b||0),0),pct=tot/(3*N),stars=pct>=.85?3:pct>=.6?2:1;
    T.alien[vi]=Math.max(T.alien[vi]||0,stars);tsave();zibSay('Thank you, my Earth friend!');
    const hasNext=vi+1<VISITS.length;
    resultOv({title:'👽 زِب سعيد جداً!',stars,gems:Math.round(tot/2)+stars*2,
      lines:[`🌟 جمل كاملة: ${D(fulls)} من ${D(N)}`,fresh?`📚 كلمات جديدة: ${D(fresh)}`:'',stars<3?'أجب بجمل كاملة لتحصل على ٣ نجوم':'متحدث رائع! 👑'],
      btns:[...(hasNext?[{label:'الزيارة التالية ←',cls:'gold big',fn:()=>go('alien',vi+1,false)}]:[]),{label:'🔁 مرة أخرى',cls:'ghost',fn:()=>rerender()},{label:'🏙️ المدينة',cls:'ghost',fn:()=>home()}]});}
  const mic=micBar($('#mic'),{onText,hint:'اضغط 🎤 وأجب زِب بالإنجليزية',onHelp:()=>{const st=V.steps[si];zibSay(fillN(st.ex),{rate:.85});
    showAns({raw:'…',x:'',rel:{ok:false},full:false,model:''},false,`💡 مثال: <span class="en">${esc(fillN(st.ex))}</span><br><small>${fillN(st.exa)}</small><br>قلها بكلماتك أنت!`);}});
  $('#qs').onclick=()=>{const st=V.steps[si];if(st)zibSay(fillN(st.q),{rate:.82});};
  zib();setTimeout(()=>{if(alive)ask();},350);
});

/* ===== البداية ===== */
FX.init();
$('#back').onclick=()=>back();
$('#hgems').onclick=()=>go('closet');
$('#hhero').onclick=()=>go('closet');
if(!World.p.made)heroMaker(()=>{home();if(!T.intro)introComic(()=>{});});
else{home();if(!T.intro)introComic(()=>{});}

})();</script>
