<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مدينة الكلام Talk Town</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="apple-touch-icon" sizes="180x180" href="https://kprpwd2wgn-ops.github.io/Rakan/talk-town-icon-v2.png">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="https://kprpwd2wgn-ops.github.io/Rakan/talk-town-icon-v2.png">
<link rel="icon" type="image/png" sizes="32x32" href="https://kprpwd2wgn-ops.github.io/Rakan/talk-town-icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="https://kprpwd2wgn-ops.github.io/Rakan/talk-town-icon-192.png">
<link rel="manifest" href="https://kprpwd2wgn-ops.github.io/Rakan/talk-town.webmanifest">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Talk Town">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&family=Fredoka:wght@400;500;600&display=swap">
<style>/* Layout: a little sunny town. Streets stack down the page, each with a green street-name sign and a row of buildings; a white tab bar at the bottom. Single committed daylight look. */
:root{
  --sky:#dff1ff; --sky-2:#c4e4ff; --paper:#ffffff; --ink:#1d2b4f; --ink-2:#5a6890; --line:#cfe0f3;
  --coral:#ff6b4a; --sun:#ffc93c; --grass:#43b97f; --road:#59627a; --sign:#0f7a4a; --me:#e3f8ea;
  --f-en:"Fredoka","Baloo Bhaijaan 2","Trebuchet MS",system-ui,sans-serif;
  --f-ar:"Baloo Bhaijaan 2",Tahoma,"Segoe UI",system-ui,sans-serif;
  --nav-h:68px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--sky)}
body{margin:0;direction:rtl;background:var(--sky);color:var(--ink);font-family:var(--f-ar);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px));
  background-image:radial-gradient(ellipse 40% 12% at 18% 9%,#fff 0 40%,transparent 41%),radial-gradient(ellipse 30% 9% at 82% 22%,#fff 0 40%,transparent 41%);
  background-attachment:fixed;min-height:100%}
body.nonav{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;line-height:1.25;font-weight:800}
.en{font-family:var(--f-en);direction:ltr;unicode-bidi:isolate}
.ar{font-family:var(--f-ar);direction:rtl}
.muted{color:var(--ink-2)}
.wrap{max-width:720px;margin:0 auto}
[hidden]{display:none!important}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 16px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--paper);box-shadow:0 3px 0 var(--line)}
.hdr-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
.back{width:42px;height:42px;border-radius:14px;background:var(--sky);display:grid;place-items:center;flex:none}
.back svg{width:22px;height:22px}
.ttl{flex:1;min-width:0;font-weight:800;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl .en{font-size:22px;color:var(--coral)}
.pill{display:flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:var(--sky);font-weight:800;font-size:15px;white-space:nowrap;flex:none}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--paper);box-shadow:0 -3px 0 var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:0;min-height:54px;border-radius:14px;font-weight:800;font-size:13px;color:var(--ink-2)}
.nav button span{font-size:24px;line-height:1.2}
.nav button.on{background:var(--sky);color:var(--ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:6px 20px;border-radius:16px;
  background:var(--coral);color:#fff;font-weight:800;font-size:18px;box-shadow:0 5px 0 #c94a2e;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c94a2e}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 5px 0 #c99a1c}
.btn.green{background:var(--grass);box-shadow:0 5px 0 #2a8a5a}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.sm{min-height:40px;font-size:15px;padding:4px 14px}
.btn.wide{width:100%}
.card{background:var(--paper);border-radius:20px;padding:16px;box-shadow:0 4px 0 var(--line)}
.sec{font-size:22px;margin:24px 0 12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stars{color:var(--sun);letter-spacing:1px;font-size:16px;line-height:1;text-shadow:0 1px 0 #c99a1c}
.stars .off{color:#d7e3f1;text-shadow:none}

/* home */
.hello{display:flex;gap:14px;align-items:center}
.avatar{width:70px;height:70px;flex:none;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:40px;box-shadow:0 4px 0 var(--line);border:3px solid var(--sun)}
.hello h1{font-size:26px}
.lvl{font-weight:800;color:var(--coral);font-size:15px}
.bar{height:12px;border-radius:99px;background:var(--paper);overflow:hidden;margin:5px 0 2px;box-shadow:inset 0 0 0 2px var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--coral));border-radius:99px;transition:width .6s}
.sub{font-size:13px;color:var(--ink-2)}
.wotd{margin-top:16px;display:flex;gap:14px;align-items:center;background:var(--paper);border-radius:20px;padding:12px 14px;box-shadow:0 4px 0 var(--line)}
.wotd .big{font-size:46px;line-height:1;width:60px;text-align:center;flex:none}
.wotd .w{font-family:var(--f-en);font-size:28px;font-weight:600;color:var(--coral);direction:ltr;line-height:1.1}
.wotd .lbl{font-size:12px;font-weight:800;color:var(--ink-2);letter-spacing:.5px}
.wotd .txt{flex:1;min-width:0}
.micnote{margin-top:12px;font-size:14px;background:#fff4d6;border:2px dashed var(--sun);border-radius:16px;padding:10px 14px}

.street{margin-top:22px}
.streetsign{display:inline-flex;align-items:center;gap:10px;background:var(--sign);color:#fff;border:3px solid #fff;outline:2px solid var(--sign);
  border-radius:10px;padding:4px 14px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.15);margin-bottom:10px}
.streetsign .en{font-size:18px;font-weight:600}
.streetsign small{font-size:13px;opacity:.85}
.blocks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:end;position:relative;padding-bottom:22px}
.blocks::after{content:"";position:absolute;left:-8px;right:-8px;bottom:0;height:16px;border-radius:6px;background:var(--road);
  background-image:repeating-linear-gradient(90deg,transparent 0 14px,#ffd84a 14px 30px);background-size:100% 3px;background-repeat:repeat-x;background-position:0 50%}
@media (max-width:440px){.blocks{grid-template-columns:repeat(2,1fr)}}
.bld{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;transition:transform .15s}
.bld:hover{transform:translateY(-4px)}
.bld:active{transform:scale(.96)}
.bld svg{width:100%;max-width:130px;height:auto;display:block;filter:drop-shadow(0 4px 0 rgba(29,43,79,.12))}
.bld .en{font-weight:600;font-size:16px;line-height:1.2}
.bld .ar{font-size:12px;color:var(--ink-2);line-height:1.2}
.bld.done .en::after{content:" ✓";color:var(--grass)}

/* conversation */
.who{display:flex;gap:14px;align-items:center;background:var(--paper);border-radius:22px;padding:10px 14px;box-shadow:0 4px 0 var(--line);border-top:6px solid var(--c)}
.face{width:96px;height:96px;flex:none;border-radius:50%;background:color-mix(in srgb,var(--c) 28%,#fff);overflow:hidden;display:grid;place-items:center}
.face svg{width:100%;height:100%}
.who h2{font-family:var(--f-en);font-weight:600;font-size:24px;direction:ltr;text-align:right}
.prog{display:flex;gap:5px;margin-top:6px;direction:rtl}
.prog i{width:22px;height:8px;border-radius:9px;background:var(--line)}
.prog i.on{background:var(--c)}
.prog i.sp{background:var(--grass)}
.chat{display:flex;flex-direction:column;gap:10px;margin:16px 0;direction:ltr}
.chat .bub .ar,.chat .badge-sp{text-align:left}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:92%;animation:msgin .3s}
@keyframes msgin{from{transform:translateY(10px);opacity:0}}
.msg.bot{align-self:flex-start}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .mini{width:38px;height:38px;flex:none;border-radius:50%;background:color-mix(in srgb,var(--c) 28%,#fff);overflow:hidden;display:grid;place-items:center;font-size:24px}
.msg .mini svg{width:100%;height:100%}
.bub{background:var(--paper);border-radius:20px 20px 20px 6px;padding:10px 14px;box-shadow:0 3px 0 var(--line);min-width:0}
.msg.bot .bub{border-radius:20px 20px 6px 20px}
.msg.me .bub{background:var(--me);border-radius:20px 20px 20px 6px;box-shadow:0 3px 0 #bfe8cb}
.bub .en{display:block;font-size:20px;font-weight:500;line-height:1.35;text-align:left}
.bub .ar{display:block;font-size:14px;color:var(--ink-2);margin-top:2px}
.bub .tools{display:flex;gap:6px;margin-top:6px;direction:ltr}
.ic{min-width:34px;height:34px;border-radius:10px;background:var(--sky);display:grid;place-items:center;font-size:16px;font-weight:800;padding:0 6px}
.badge-sp{display:inline-block;font-size:12px;font-weight:800;color:#1a7a4c;margin-top:4px}
.heard .w{display:inline-block;margin-right:4px}
.heard .w.ok{color:#1a8a50}
.heard .w.miss{color:#c0392b;text-decoration:underline wavy}

.reply{background:var(--paper);border-radius:22px;padding:14px;box-shadow:0 4px 0 var(--line);border:3px solid var(--c)}
.reply .turn{font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:16px;border:2.5px solid var(--line);background:#f7fbff;transition:border-color .15s}
.opt:hover{border-color:var(--c)}
.opt .txt{flex:1;min-width:0}
.opt .en{display:block;font-size:19px;font-weight:500;line-height:1.3}
.opt .ar{display:block;font-size:13px;color:var(--ink-2);text-align:left}
.opt .num{width:30px;height:30px;flex:none;border-radius:50%;background:var(--c);display:grid;place-items:center;font-weight:800;color:var(--ink);font-family:var(--f-en)}
.micwrap{display:flex;flex-direction:column;align-items:center;gap:6px;margin:6px 0 12px}
.mic{width:86px;height:86px;border-radius:50%;background:var(--coral);color:#fff;font-size:38px;display:grid;place-items:center;box-shadow:0 6px 0 #c94a2e;transition:transform .1s}
.mic:active{transform:translateY(4px);box-shadow:0 2px 0 #c94a2e}
.mic.on{background:var(--grass);box-shadow:0 6px 0 #2a8a5a;animation:pulse 1s infinite}
@keyframes pulse{0%{outline:0 solid rgba(67,185,127,.5)}100%{outline:18px solid rgba(67,185,127,0)}}
.micwrap .hint{font-weight:800;font-size:15px}
.live{min-height:24px;font-family:var(--f-en);color:var(--ink-2);direction:ltr;text-align:center}
.say{text-align:center}
.say .en{font-size:clamp(24px,7vw,34px);font-weight:600;line-height:1.25;color:var(--ink)}
.say .ar{font-size:15px;color:var(--ink-2);margin-top:4px}
.fb{min-height:26px;text-align:center;font-weight:800}
.fb.ok{color:#1a8a50} .fb.bad{color:#c0392b}

/* talking & blinking */
.mouth{transform-box:fill-box;transform-origin:center}
.talking .mouth{animation:talk .16s infinite alternate}
@keyframes talk{from{transform:scaleY(.25)}to{transform:scaleY(1.15)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

/* words */
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.cats{grid-template-columns:repeat(3,1fr)}}
.cat{display:flex;gap:10px;align-items:center;padding:12px;border-radius:18px;background:var(--paper);box-shadow:0 4px 0 var(--line);text-align:start}
.cat .ci{font-size:34px;flex:none}
.cat .en{font-weight:600;font-size:18px;display:block;text-align:right}
.cat .ar{font-size:13px;color:var(--ink-2)}
.wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:560px){.wgrid{grid-template-columns:repeat(4,1fr)}}
.wcard{display:flex;flex-direction:column;align-items:center;padding:12px 6px;border-radius:18px;background:var(--paper);box-shadow:0 4px 0 var(--line);transition:transform .15s}
.wcard.pop{animation:wpop .5s}
@keyframes wpop{40%{transform:scale(1.12) rotate(-3deg)}}
.wcard .em{font-size:44px;line-height:1.15;height:52px;display:grid;place-items:center}
.sw{width:46px;height:46px;border-radius:14px;border:3px solid var(--line)}
.wcard .en{font-size:19px;font-weight:600}
.wcard .ar{font-size:13px;color:var(--ink-2)}
.numglyph{font-family:var(--f-en);font-weight:600;font-size:40px;color:var(--coral)}

/* games */
.games{display:grid;gap:10px}
.game{display:flex;gap:14px;align-items:center;text-align:start;padding:14px;border-radius:20px;background:var(--paper);box-shadow:0 4px 0 var(--line);border-inline-start:8px solid var(--c)}
.game .gi{font-size:38px;flex:none;width:52px;text-align:center}
.game h3{font-size:19px}
.game p{font-size:14px;color:var(--ink-2)}
.game .best{margin-inline-start:auto;font-size:12px;font-weight:800;color:var(--ink-2);text-align:center;flex:none}
.gtop{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:10px}
.stage{background:var(--paper);border-radius:22px;padding:16px;box-shadow:0 4px 0 var(--line);text-align:center}
.stage.ok{animation:okb .45s}.stage.bad{animation:shake .4s}
@keyframes okb{40%{background:#e3f8ea;transform:scale(1.02)}}
@keyframes shake{25%,75%{transform:translateX(-7px)}50%{transform:translateX(7px)}}
.bigplay{width:96px;height:96px;border-radius:50%;background:var(--sun);font-size:42px;display:grid;place-items:center;margin:4px auto;box-shadow:0 6px 0 #c99a1c}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.choice{min-height:96px;border-radius:18px;background:var(--paper);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);font-size:50px;display:grid;place-items:center}
.choice.txt{font-family:var(--f-en);font-size:18px;font-weight:500;min-height:70px;padding:8px 10px;text-align:left;direction:ltr;line-height:1.3}
.choice.ok{border-color:var(--grass);background:#e3f8ea}
.choice.bad{border-color:var(--coral);background:#ffe4dc}
.choices.one{grid-template-columns:1fr}
.qline{font-family:var(--f-en);font-size:24px;font-weight:500;direction:ltr;line-height:1.3}
.slots{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:10px;border-radius:16px;border:3px dashed var(--line);direction:ltr;margin:12px 0}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr}
.chip{font-family:var(--f-en);font-size:20px;font-weight:500;padding:6px 14px;border-radius:12px;background:var(--sky);box-shadow:0 3px 0 var(--sky-2);min-height:46px}
.slots .chip{background:var(--sun);box-shadow:0 3px 0 #c99a1c}
.chip.used{visibility:hidden}

/* result */
.ov{position:fixed;inset:0;z-index:50;background:rgba(29,43,79,.45);display:grid;place-items:center;animation:fade .2s;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@keyframes fade{from{opacity:0}}
.res{width:min(420px,100%);background:var(--paper);border-radius:28px;padding:22px 18px;text-align:center;box-shadow:0 8px 0 var(--line);animation:boing .45s;max-height:100%;overflow:auto}
@keyframes boing{0%{transform:scale(.6)}65%{transform:scale(1.04)}}
.res h2{font-size:28px;color:var(--coral)}
.res .bigs{font-size:46px;letter-spacing:6px}
.res .bigs span{display:inline-block;animation:starin .5s backwards}
.res .bigs span:nth-child(2){animation-delay:.2s}.res .bigs span:nth-child(3){animation-delay:.4s}
@keyframes starin{from{transform:scale(0) rotate(-120deg)}}
.res .score{font-family:var(--f-en);font-size:52px;font-weight:600;line-height:1.1;direction:ltr}
.res ul{list-style:none;padding:0;margin:8px 0 16px;display:grid;gap:4px;font-weight:600}
.res .btns{display:grid;gap:10px}
.res .face{margin:0 auto 6px}

/* me */
.statg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.statg{grid-template-columns:repeat(3,1fr)}}
.stat{background:var(--paper);border-radius:16px;padding:12px;box-shadow:0 4px 0 var(--line)}
.stat b{display:block;font-family:var(--f-en);font-size:28px;font-weight:600;color:var(--coral);line-height:1.2;direction:ltr;text-align:right}
.stat span{font-size:13px;font-weight:600;color:var(--ink-2)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:560px){.badges{grid-template-columns:repeat(4,1fr)}}
.bdg{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;padding:10px 6px;border-radius:16px;background:var(--paper);border:2.5px dashed var(--line)}
.bdg .bi{font-size:34px;filter:grayscale(1);opacity:.35}
.bdg h3{font-size:15px}
.bdg p{font-size:12px;color:var(--ink-2);line-height:1.35}
.bdg.got{border:2.5px solid var(--sun);background:#fff8e1}
.bdg.got .bi{filter:none;opacity:1}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-weight:800}
.inp{min-height:48px;border-radius:14px;border:2.5px solid var(--line);background:#f7fbff;color:var(--ink);font:inherit;font-size:18px;padding:6px 14px;width:100%}
.avs{display:flex;flex-wrap:wrap;gap:8px}
.avb{width:52px;height:52px;font-size:30px;border-radius:50%;border:3px solid transparent;background:var(--sky)}
.avb.on{border-color:var(--coral);background:#ffe4dc}
.seg{display:inline-flex;background:var(--sky);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{min-height:40px;padding:0 14px;border-radius:10px;font-weight:800}
.seg button.on{background:var(--coral);color:#fff}

.welcome{text-align:center;padding-top:14px}
.welcome .logo{width:104px;height:104px;border-radius:26px;margin:0 auto 10px;box-shadow:0 6px 0 var(--line)}
.welcome h1{font-size:34px;color:var(--coral)}
.welcome .en{font-size:20px;color:var(--ink-2)}
.cast{display:flex;justify-content:center;gap:4px;margin:12px 0 16px;flex-wrap:wrap}
.cast .face{width:58px;height:58px}

.toasts{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));z-index:60;display:grid;justify-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--ink);color:#fff;font-weight:800;padding:10px 18px;border-radius:16px;animation:toastin .3s;max-width:100%}
@keyframes toastin{from{transform:translateY(20px);opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
@media (prefers-reduced-motion:reduce){.eyes,.mic.on,.msg{animation:none!important}}

/* free-talk feedback */
.evbox{margin-top:10px;padding:12px;border-radius:16px;background:#f7fbff;border:2.5px solid var(--line);text-align:center}
.evbox.good{background:#e3f8ea;border-color:#9fdcb8}
.evbox.mid{background:#fff6dc;border-color:#ffd77a}
.evbox.bad{background:#ffece6;border-color:#ffc2b0}
.evbox.tip{background:#fff6dc;border:2.5px dashed var(--sun)}
.heardline{font-weight:700;line-height:1.5}
.heardline .en{font-size:19px;font-weight:500}
.evstars .stars{font-size:30px;letter-spacing:4px}
.crits{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}
.crit{font-size:13px;font-weight:800;padding:3px 10px;border-radius:99px;background:#ffe1d9;color:#a43a22}
.crit.ok{background:#d4f3df;color:#1a7a4c}
.praise{font-weight:800;margin-top:4px}
.model{display:inline-flex;align-items:center;gap:8px;margin-top:6px;padding:6px 8px 6px 12px;border-radius:12px;background:#fff;box-shadow:0 2px 0 var(--line);direction:ltr;max-width:100%}
.model span{font-family:var(--f-en);font-size:19px;font-weight:500;text-align:left;min-width:0}
.say .model span{font-size:clamp(20px,6vw,28px)}
.turnbar{justify-content:center;margin-top:10px}
.typed{display:flex;gap:8px;margin-top:10px}
.typed .inp{flex:1;min-width:0}
.michelp{background:#fff4d6;border:2.5px dashed var(--sun);border-radius:18px;padding:12px 14px;margin:12px 0;text-align:start}
.michelp h3{font-size:17px;margin-bottom:6px}
.michelp ol{margin:0 0 10px;padding-inline-start:22px;display:grid;gap:4px;font-size:15px}
.linkbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border-radius:12px;padding:8px 10px;margin:0 0 10px}
.linkbox .en{font-size:13px;word-break:break-all;flex:1 1 180px;min-width:0;user-select:all;text-align:left}
.linkbox a.btn{text-decoration:none}
.report{max-height:38vh;overflow:auto;text-align:start;display:grid;gap:8px;margin:4px 0 14px}
.rep{background:#f7fbff;border-radius:14px;padding:8px 10px;direction:ltr;text-align:left}
.rep .rq{font-family:var(--f-en);font-size:14px;color:var(--ink-2)}
.rep .ra{font-family:var(--f-en);font-size:17px}
.rep .ra .stars{font-size:13px}
.rep .rm{font-family:var(--f-en);font-size:14px;color:#1a7a4c}
.diag{list-style:none;padding:0;margin:0 0 6px;display:grid;gap:6px;font-weight:600}
.msg.me .bub .badge-sp{display:block}
.heardtxt{display:block;direction:ltr;text-align:center;font-size:20px;margin-top:2px}

<script>(function(){

const KEY='talk-town-v1';
const AVATARS=['🦁','🐯','🐼','🦊','🐸','🐵','🦄','🐧','🐢','🦉','🐬','🚀'];
const defaults=()=>({name:'',avatar:'🦁',xp:0,scenes:{},spoken:0,heardWords:{},best:{},badges:{},days:[],rate:1,showAr:true,sound:true,micOff:false});
let S=defaults();
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(defaults(),JSON.parse(r));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const AN='٠١٢٣٤٥٦٧٨٩',N=n=>String(n).replace(/[0-9]/g,d=>AN[d]);
const dkey=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
const ALLSCENES=STREETS.flatMap(s=>s.scenes);

/* mark today as played */
(function(){const t=dkey(new Date());if(!S.days.includes(t)){S.days.push(t);S.days=S.days.slice(-60);save();}})();
function streak(){let n=0;const d=new Date();for(;;){if(S.days.includes(dkey(d))){n++;d.setDate(d.getDate()-1);}else break;}return n;}

/* ================= sound ================= */

const TTS='speechSynthesis' in window;
let voice=null;
function pickVoice(){if(!TTS)return;const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)||v.lang==='en');
  const pref=[/Samantha/i,/Google US English/i,/Aria/i,/Jenny/i,/Microsoft.*(Zira|Ana)/i,/en[-_]US/i,/Karen|Moira|Tessa/i,/en[-_]GB/i];
  for(const p of pref){const v=vs.find(v=>p.test(v.name)||p.test(v.lang));if(v){voice=v;return;}}voice=vs[0]||null;}
if(TTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
let sayTok=0;
function say(text,o={}){
  const tok=++sayTok;let ended=false;const end=()=>{if(ended)return;ended=true;if(o.el)o.el.classList.remove('talking');o.onend&&o.onend();};
  if(!TTS){setTimeout(end,600);return;}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/[\u{1F300}-\u{1FAFF}]/gu,''));u.lang='en-US';if(voice)u.voice=voice;
    u.pitch=o.pitch||1;u.rate=(o.rate||1)*S.rate;
    u.onstart=()=>{if(o.el&&tok===sayTok)o.el.classList.add('talking');};
    u.onend=u.onerror=end;speechSynthesis.speak(u);
    setTimeout(end,1500+text.length*80/u.rate);// safety net if onend never fires
  }catch(e){end();}
}
const kidVoice=(t,o={})=>say(t,Object.assign({pitch:1.45,rate:.92},o));

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const UA=navigator.userAgent||'';
const IOS=/iPad|iPhone|iPod/.test(UA)||(/Macintosh/.test(UA)&&navigator.maxTouchPoints>1);
const ANDROID=/Android/i.test(UA);
const STANDALONE=window.navigator.standalone===true||(!!window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
const EMBEDDED=(()=>{try{return window.top!==window.self;}catch(e){return true;}})()&&!/github\.io$/.test(location.hostname);
const GH_URL='https://kprpwd2wgn-ops.github.io/Rakan/talk-town.html';
let micState=!SR?'none':EMBEDDED?'embedded':'ready';
let rec=null,recStop=null,listenTok=0;
/* Listen once. Never switches the mic off for good: every press tries again. */
function listen({onLive,onDone,onError}){
  abortListen();
  if(!SR){onError&&onError('none');return;}
  let r;try{r=new SR();}catch(e){onError&&onError('none');return;}
  const tok=++listenTok;rec=r;let text='',alts=[],conf=0,err='',done=false,hard=null;
  r.lang='en-US';r.interimResults=true;r.continuous=false;try{r.maxAlternatives=3;}catch(e){}
  r.onresult=e=>{const res=Array.from(e.results);text=res.map(x=>x[0].transcript).join(' ').replace(/\s+/g,' ').trim();
    const last=res[res.length-1];conf=(last&&last[0].confidence)||0;const pre=res.slice(0,-1).map(x=>x[0].transcript).join(' ');
    alts=last?Array.from(last).map(a=>(pre+' '+a.transcript).replace(/\s+/g,' ').trim()).filter(Boolean):[text];
    if(tok===listenTok&&onLive)onLive(text);};
  r.onerror=e=>{err=e.error||'error';};
  const finish=()=>{if(done)return;done=true;clearTimeout(hard);if(rec===r){rec=null;recStop=null;}if(tok!==listenTok)return;
    if(text){if(micState!=='embedded')micState='ok';onDone&&onDone({text,alts:alts.length?alts:[text],conf});}
    else if(err&&err!=='no-speech'&&err!=='aborted'){onError&&onError(err);}
    else onDone&&onDone({text:'',alts:[],conf:0});};
  r.onend=finish;
  recStop=()=>{try{r.stop();}catch(e){}setTimeout(finish,1600);};
  hard=setTimeout(()=>{if(recStop)recStop();},12000);
  try{r.start();}catch(e){err='start';setTimeout(finish,0);}
}
function stopListen(){if(recStop)recStop();}
function abortListen(){listenTok++;if(rec){try{rec.abort();}catch(e){}}rec=null;recStop=null;}

/* ---- matching what was heard with what was expected ---- */
const NUMW={0:'zero',1:'one',2:'two',3:'three',4:'four',5:'five',6:'six',7:'seven',8:'eight',9:'nine',10:'ten',11:'eleven',12:'twelve'};
function norm(t){return t.toLowerCase().replace(/[’‘]/g,"'")
  .replace(/\b(\d+)\b/g,(m,d)=>NUMW[d]||d)
  .replace(/n't\b/g,' not').replace(/'m\b/g,' am').replace(/'re\b/g,' are').replace(/'s\b/g,' is').replace(/'d\b/g,' would').replace(/'ll\b/g,' will').replace(/\bcan not\b/g,'can not').replace(/\bcannot\b/g,'can not').replace(/\bwo not\b/g,'will not')
  .replace(/\bms\b|\bmrs\b|\bmr\b/g,'').replace(/[^a-z\s]/g,' ').split(/\s+/).filter(Boolean);}
function score(target,heard){
  const t=norm(target.replace(/\{name\}/g,'')),h=norm(heard);
  if(!t.length)return{s:1,words:[]};
  const pool=h.slice();let hit=0;
  const words=target.replace(/\{name\}/g,nm()).split(/\s+/).map(w=>({w,ok:true}));
  // per-word check on the displayed words
  const tw=target.split(/\s+/);
  let wi=0;tw.forEach((w,i)=>{if(/\{name\}/.test(w)){words[i].ok=true;return;}
    const ws=norm(w);const ok=ws.every(x=>{const k=pool.findIndex(p=>p===x||(x.length>3&&p.slice(0,x.length-1)===x.slice(0,-1)));if(k>=0){pool.splice(k,1);return true;}return false;});
    words[i].ok=ok;if(ok)hit+=ws.length;wi+=ws.length;});
  return{s:wi?hit/wi:1,words};
}
function bestOf(target,alts){let b={s:0,words:target.split(/\s+/).map(w=>({w,ok:false})),heard:alts[0]||''};
  alts.forEach(a=>{const r=score(target,a);if(r.s>b.s)b={...r,heard:a};});return b;}
const heardHTML=words=>`<span class="heard en">${words.map(x=>`<span class="w ${x.ok?'ok':'miss'}">${esc(fill(x.w))}</span>`).join(' ')}</span>`;

/* ---- judging a free answer ---- */
const NUMW2=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
function normS(t){return String(t||'').toLowerCase().replace(/[’‘`]/g,"'").replace(/(\d+)(am|pm)\b/g,'$1 $2')
  .replace(/\b(\d{3,6})\b/g,m=>m.split('').join(' ')).replace(/\b(\d+)\b/g,(m,d)=>NUMW2[+d]||d)
  .replace(/n't\b/g,' not').replace(/'m\b/g,' am').replace(/'re\b/g,' are').replace(/'s\b/g,' is').replace(/'d\b/g,' would').replace(/'ll\b/g,' will').replace(/'ve\b/g,' have')
  .replace(/\bwo not\b/g,'will not').replace(/\bca not\b/g,'can not').replace(/\bcannot\b/g,'can not').replace(/\blet is\b/g,'let us')
  .replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim();}
const CATRE={};Object.entries(CATS).forEach(([k,v])=>{CATRE[k]=v.split('|').sort((a,b)=>b.length-a.length).map(w=>({w,re:new RegExp('\\b'+w.replace(/ /g,'\\s+')+'(?:s|es)?\\b')}));});
const NOARTS=new Set(NOART.split('|'));
const art=x=>NOARTS.has(x)?'':/^[aeiou]/.test(x)?'an':'a';
const cap=x=>PROPER[x]||x.replace(/\b[a-z]/g,c=>c.toUpperCase());
const IRR={fish:'fish',sheep:'sheep',mouse:'mice',deer:'deer',fox:'foxes',wolf:'wolves',butterfly:'butterflies',puppy:'puppies',bunny:'bunnies',octopus:'octopuses',bee:'bees'};
const plural=x=>IRR[x]||(/(s|sh|ch|x)$/.test(x)?x+'es':x+'s');
function catFind(cats,t){for(const c of cats.split(',')){for(const e of (CATRE[c]||[]))if(e.re.test(t))return e.w;}return'';}
function relevant(st,t){const x=st.cat?catFind(st.cat,t):'';let ok=!!x;
  if(!ok&&st.re){const n=normS(S.name||'');ok=new RegExp('\\b(?:'+st.re.replace(/\{name\}/g,n||'zzzz')+')\\b').test(t);}return{ok,x};}
const subst=(s,x)=>s.replace(/\{X\}/g,cap(x)).replace(/\{xs\}/g,plural(x)).replace(/\{x\}/g,x);
function modelOf(st,x){if(st.tpl&&x)return subst(st.tpl.replace(/\{a\}\s*/g,()=>{const a=art(x);return a?a+' ':'';}),x);return fill(st.ex);}
const GENERIC=[['Great!','رائع!'],['Cool!','جميل!'],['Nice!','حلو!'],['Awesome!','مدهش!'],['Good answer!','جواب جيد!']];
function react(st,t,x){for(const [p,en,ar] of (st.react||[]))if(new RegExp('\\b(?:'+p+')\\b').test(t))return[en,ar];
  if(st.after){if(/\{(X|x|xs)\}/.test(st.after[0])&&!x)return pick(GENERIC);return[subst(st.after[0],x),st.after[1]];}return pick(GENERIC);}
/* stars: 1 = spoke English, 2 = answered the question, 3 = in a full sentence */
function evaluate(st,res,target){
  const alts=(res.alts&&res.alts.length?res.alts:[res.text]).filter(Boolean);
  if(target){const r=bestOf(target,alts.length?alts:['']);const spoke=normS(res.text).length>0,ok=r.s>=.6;
    return{stars:spoke?(ok?2:1):0,spoke,rel:{ok,x:''},full:ok,words:r.words,raw:r.heard||res.text,model:target,repeat:true,norm:normS(r.heard||res.text),x:''};}
  let best=alts[0]||'',rel={ok:false,x:''};
  for(const a of alts){const r=relevant(st,normS(a));if(r.ok){best=a;rel=r;break;}}
  const t=normS(best),n=t?t.split(' ').length:0,spoke=n>0,full=n>=(st.min||3);
  return{stars:spoke?1+(rel.ok?1:0)+(rel.ok&&full?1:0):0,spoke,rel,full,raw:best,x:rel.x,model:modelOf(st,rel.x),norm:t};
}

function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#ff6b4a','#ffc93c','#43b97f','#2f6bff','#ff8fab','#8e6cff'];
  const P=[...Array(130)].map(()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.3,col:pick(cols)}));
  let t=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.col;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});if(++t<160)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);})();}
function result({title,stars=null,score=null,lines=[],good=true,face=null,extra=null,report=''}){

   ${score!==null?`<div class="score">${score}</div>`:''}<ul>${lines.filter(Boolean).map(l=>`<li>${l}</li>`).join('')}</ul>${report}
   <div class="btns">${extra?`<button class="btn green" data-r="extra">${extra.label}</button>`:''}<button class="btn ${extra?'ghost':''}" data-r="again">🔁 مرة أخرى</button><button class="btn ghost sm" data-r="back">رجوع</button></div></div>`;
  document.body.appendChild(ov);if(good){sfx.win();confetti();}
  ov.querySelector('[data-r="again"]').onclick=()=>{ov.remove();rerender();};

/* ---------- one speaking turn: listen → judge → feedback ---------- */
function turnUI(box,st,{onDone}){
  let tries=0,fails=0,repeat=false,best=null,typeOk=micState==='none'||micState==='embedded',alive=true,finished=false;
  onClean(()=>{alive=false;});
  const ex=()=>fill(st.ex);
  const crit=(ok,t)=>`<span class="crit ${ok?'ok':''}">${ok?'✓':'✗'} ${t}</span>`;
  const modelLine=m=>`<div class="model"><span>${esc(m)}</span><button class="ic" data-x="say" data-t="${esc(m)}" aria-label="استمع">🔊</button></div>`;
  function paint(){
    if(!alive)return;box.hidden=false;const target=repeat?best.model:'';
    box.innerHTML=`<div class="turn">${repeat?'🔁 اسمع الجملة وقلها بعدي:':'🗣️ دورك! أجب بالإنجليزية بكلماتك أنت'}</div>
      ${repeat?`<div class="say">${modelLine(target)}</div>`:''}
      <div class="micwrap"><button class="mic" id="mic" aria-label="تكلّم">🎤</button><span class="hint" id="mh">اضغط وتكلّم</span><div class="live" id="live"></div></div>
      <div id="ev"></div>
      <div class="row turnbar">${repeat?'':'<button class="btn sun sm" data-x="help">💡 ساعدني</button>'}<button class="btn ghost sm" data-x="type" ${typeOk?'':'hidden'}>⌨️ اكتب جوابك</button><button class="btn ghost sm" data-x="skip" hidden>تخطَّ ←</button></div>
      <form class="typed" hidden><input class="inp en" autocomplete="off" autocapitalize="sentences" enterkeyhint="send" placeholder="Type your answer in English"><button class="btn green sm" type="submit">أرسل ✓</button></form>`;
    if(repeat)kidVoice(target);
    const mic=$('#mic',box),mh=$('#mh',box),live=$('#live',box),ev=$('#ev',box);
    mic.onclick=()=>{
      if(mic.classList.contains('on')){stopListen();mh.textContent='لحظة…';return;}
      if(TTS)try{speechSynthesis.cancel();}catch(e){}
      mic.classList.add('on');mh.textContent='أنا أسمعك… تكلّم الآن';live.textContent='';ev.innerHTML='';
      listen({onLive:t=>{live.textContent=t;},
        onError:code=>{if(!alive)return;mic.classList.remove('on');mh.textContent='اضغط وتكلّم';fails++;typeOk=true;ev.innerHTML=micHelp(code);showBar();},
        onDone:res=>{if(!alive)return;mic.classList.remove('on');mh.textContent='اضغط وتكلّم';live.textContent='';handle(res,false);}});
    };
    box.onclick=e=>{const b=e.target.closest('[data-x]');if(!b||!box.contains(b))return;const x=b.dataset.x;
      if(x==='say')kidVoice(b.dataset.t);
      else if(x==='help'){ev.innerHTML=`<div class="evbox tip">💡 مثال تستطيع أن تقوله:${modelLine(ex())}${S.showAr&&st.exa?`<div class="muted" style="font-size:13px">${esc(fill(st.exa))}</div>`:''}<div style="font-size:14px;font-weight:700;margin-top:4px">والآن اضغط 🎤 وقل جوابك أنت!</div></div>`;kidVoice(ex());}
      else if(x==='type'){const f=$('form',box);f.hidden=false;$('input',f).focus();}
      else if(x==='next')finish();
      else if(x==='skip'){if(!best)best={stars:0,spoke:false,rel:{ok:false,x:''},full:false,raw:'—',model:ex(),norm:'',x:''};finish();}};
    $('form',box).onsubmit=e=>{e.preventDefault();const v=$('input',box).value.trim();if(!v)return;$('input',box).value='';handle({text:v,alts:[v],conf:0},true);};
    showBar();
  }
  function showBar(){const sk=$('[data-x="skip"]',box);if(sk)sk.hidden=!(fails>=2||tries>=3);const ty=$('[data-x="type"]',box);if(ty)ty.hidden=!typeOk;}
  function handle(res,typed){
    const ev=$('#ev',box);
    if(!res.text){fails++;ev.innerHTML=`<div class="evbox bad">🙉 لم أسمع شيئاً. قرّب الهاتف من فمك، اضغط 🎤 وتكلّم بصوت واضح.</div>`;showBar();return;}
    const r=evaluate(st,res,repeat?best.model:null);r.typed=typed;tries++;
    if(!best||r.stars>=best.stars)best=r;
    const head=`<div class="heardline">${typed?'⌨️ كتبت:':'👂 سمعتك تقول:'}<span class="en heardtxt">${esc(r.raw)}</span></div><div class="evstars">${starsHTML(r.stars)}</div>`;
    let body='',btns='';
    if(r.repeat){
      body=`<div class="crits">${crit(r.spoke,'تكلّمت بالإنجليزية')}${crit(r.rel.ok,'كرّرت الجملة')}</div>`+(r.rel.ok?`<p class="praise">👏 أحسنت! نطقت الجملة.</p>`:`<p>${heardHTML(r.words)}</p><p class="praise">الكلمات الحمراء تحتاج تدريباً. اسمعها 🔊 ثم اضغط 🎤 مرة أخرى.</p>`);
      if(r.rel.ok||tries>=5)btns='<button class="btn green" data-x="next">التالي ←</button>';
    }else{
      body=`<div class="crits">${crit(r.spoke,'تكلّمت بالإنجليزية')}${crit(r.rel.ok,'جواب مناسب')}${crit(r.rel.ok&&r.full,'جملة كاملة')}</div>`;
      if(r.stars>=3){body+=`<p class="praise">🌟 ممتاز! جواب رائع.</p>`;if(normS(r.model)!==r.norm)body+=`<div class="muted" style="font-size:13px">ويمكنك أن تقول أيضاً:</div>${modelLine(r.model)}`;btns='<button class="btn green" data-x="next">التالي ←</button>';}
      else if(r.stars===2){body+=`<p class="praise">👍 جواب صحيح! والآن قله في جملة كاملة، اضغط 🎤 وقل:</p>${modelLine(r.model)}`;btns='<button class="btn ghost sm" data-x="next">التالي ←</button>';}
      else{if(tries<2){body+=`<p class="praise">🤔 لم أفهم جوابك عن السؤال. اسمع السؤال مرة أخرى، ثم اضغط 🎤 وأجب. أو اضغط 💡 للمساعدة.</p>`;}
        else{repeat=true;best.model=modelOf(st,'');tries=0;paint();return;}}
    }
    ev.innerHTML=`<div class="evbox ${r.stars>=3?'good':r.stars===2?'mid':'bad'}">${head}${body}${btns?`<div class="row" style="justify-content:center;margin-top:8px">${btns}</div>`:''}</div>`;
    showBar();
    if(r.stars>=3&&!r.repeat)kidVoice(pick(['Great job!','Excellent!','Well done!','Perfect!']));
  }
  function finish(){if(finished)return;finished=true;box.hidden=true;box.innerHTML='';onDone(best);}
  paint();
}

/* ---------- conversation ---------- */
def('scene',(id)=>{
  const sc=SCENES[id],ch=CHARS[sc.ch],steps=sc.steps;
  setTitle(`<span class="en">${sc.en}</span> · ${sc.ar}`,true);
  let step=0,alive=true;const turns=[];
  onClean(()=>{alive=false;});
  view.innerHTML=`<div style="--c:${sc.color}">
    <div class="who"><div class="face" id="face">${charSVG(sc.ch)}</div><div style="min-width:0">
      <h2>${ch.name}</h2><p class="muted" style="font-size:14px">${ch.ar} · ${sc.ar}</p><div class="prog" id="prog">${steps.map(()=>'<i></i>').join('')}</div></div></div>
    ${micNote()}<div class="chat" id="chat"></div><div class="reply" id="reply" hidden></div></div>`;
  const chat=$('#chat'),reply=$('#reply'),face=$('#face');
  const prog=()=>$$('#prog i').forEach((i,k)=>{i.className=k<step?((turns[k]&&turns[k].stars>=3)?'sp':'on'):'';});
  const scrollEnd=()=>setTimeout(()=>{(reply.hidden?chat.lastElementChild:reply)?.scrollIntoView({behavior:'smooth',block:'end'});},60);
  function bot(en,ar,then){
    if(!alive)return;const m=document.createElement('div');m.className='msg bot';
    m.innerHTML=`<div class="mini">${charSVG(sc.ch)}</div><div class="bub"><span class="en">${esc(fill(en))}</span><span class="ar" ${S.showAr?'':'hidden'}>${esc(fill(ar))}</span>
      <div class="tools"><button class="ic" data-a="play" aria-label="استمع">🔊</button><button class="ic" data-a="slow" aria-label="ببطء">🐢</button><button class="ic" data-a="tr" aria-label="الترجمة">ع</button></div></div>`;
    chat.appendChild(m);scrollEnd();
    const play=(slow,cb)=>say(fill(en),{pitch:ch.pitch,rate:ch.rate*(slow?.7:1),el:face,onend:cb});
    m.querySelector('[data-a="play"]').onclick=()=>play(false);
    m.querySelector('[data-a="slow"]').onclick=()=>play(true);
    m.querySelector('[data-a="tr"]').onclick=()=>{const a=m.querySelector('.ar');a.hidden=!a.hidden;};
    play(false,()=>{if(alive&&then)then();});
  }
  function me(ev){const m=document.createElement('div');m.className='msg me';
    m.innerHTML=`<div class="mini" style="background:#fff">${S.avatar}</div><div class="bub"><span class="en">${esc(ev.raw)}</span><span class="badge-sp">${ev.typed?'⌨️':'🎤'} ${starsHTML(ev.stars)}</span></div>`;
    chat.appendChild(m);scrollEnd();}
  function ask(){if(!alive)return;const st=steps[step];
    turnUI(reply,st,{onDone:ev=>{
      me(ev);turns[step]={q:fill(st.q),a:ev.raw,stars:ev.stars,model:ev.model};
      if(ev.spoke&&!ev.typed)S.spoken++;addXP(ev.stars*3);save();step++;prog();checkBadges();
      const r=ev.rel&&ev.rel.ok?react(st,ev.norm,ev.x):['Okay! Let\'s keep going.','حسناً! لنكمل.'];
      setTimeout(()=>bot(r[0],r[1],()=>setTimeout(next,250)),350);}});
    scrollEnd();}
  function next(){if(!alive)return;if(step<steps.length)bot(steps[step].q,steps[step].qa,ask);else finish();}
  function finish(){
    const got=turns.reduce((a,t)=>a+t.stars,0),max=steps.length*3,pct=got/max,stars=pct>=.85?3:pct>=.6?2:1,old=S.scenes[id]||0;
    if(stars>old)S.scenes[id]=stars;addXP(20+(stars>old?(stars-old)*10:0));save();checkBadges();
    const nx=ALLSCENES[ALLSCENES.indexOf(id)+1];

/* sentence builder */
def('build',()=>{
  setTitle('🧱 ركّب الجملة',true);
  const R=8;const pool=ALLEX.filter(o=>{const n=o[0].split(/\s+/).length;return n>=3&&n<=7&&!/\{name\}/.test(o[0]);});
  const qs=shuffle(pool.slice()).slice(0,R);let i=0,sc=0,placed=[],words=[],target='';
  view.innerHTML=`<div class="gtop"><span id="gi"></span><span>✅ <span id="gs">${N(0)}</span></span></div>
   <div class="stage" id="stage"><p class="muted" style="font-weight:800">رتّب الكلمات لتصنع هذه الجملة:</p><p id="ar" style="font-size:20px;font-weight:800;margin:6px 0"></p>
    <div class="slots" id="slots"></div><div class="pool" id="pool"></div><div class="fb" id="fb"></div>
    <div class="row" style="justify-content:center;margin-top:10px"><button class="btn sun sm" id="hint">🔊 تلميح</button><button class="btn ghost sm" id="clr">↺ ابدأ من جديد</button></div></div>`;
  function draw(){
    $('#slots').innerHTML=placed.map((w,k)=>`<button class="chip" data-p="${k}">${esc(words[w])}</button>`).join('')||'<span class="muted" style="font-size:14px">اضغط على الكلمات بالترتيب ←</span>';
    $('#pool').innerHTML=words.map((w,k)=>`<button class="chip ${placed.includes(k)?'used':''}" data-k="${k}">${esc(w)}</button>`).join('');
    $$('#pool .chip').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(placed.includes(k))return;sfx.pop();placed.push(k);say(words[k].replace(/[.,!?]/g,''),{rate:1.05});draw();if(placed.length===words.length)check();});
    $$('#slots .chip').forEach(b=>b.onclick=()=>{placed.splice(+b.dataset.p);sfx.tap();draw();});
  }
  function check(){const built=placed.map(k=>words[k]).join(' ');const ok=built===target;const st=$('#stage');st.classList.remove('ok','bad');void st.offsetWidth;
    if(ok){sc++;sfx.ok();st.classList.add('ok');$('#fb').className='fb ok';$('#fb').textContent='جملة صحيحة! 🎉';}
    else{sfx.bad();st.classList.add('bad');$('#fb').className='fb bad';$('#fb').innerHTML=`الصحيح: <span class="en">${esc(target)}</span>`;}
    $('#gs').textContent=N(sc);i++;kidVoice(target,{onend:()=>setTimeout(next,ok?400:1200)});}
  let alive=true;onClean(()=>{alive=false;});
  function next(){if(!alive)return;if(i>=R){const nb=saveBest('build',sc);addXP(sc*3);return result({title:sc===R?'Master builder! بنّاء ماهر':'Good job! أحسنت',score:`${N(sc)}/${N(R)}`,good:sc>=5,lines:[nb?'🏆 أفضل نتيجة جديدة!':'',`+${N(sc*3)} نقطة`]});}
    const o=qs[i];target=o[0];$('#ar').textContent=o[1];$('#gi').textContent=`${N(i+1)} / ${N(R)}`;$('#fb').textContent='';
    const base=target.split(/\s+/);let sh;do{sh=shuffle(base.slice());}while(sh.join(' ')===target&&base.length>1);words=sh;placed=[];draw();}
  $('#hint').onclick=()=>kidVoice(target,{rate:.7});$('#clr').onclick=()=>{placed=[];sfx.tap();draw();};
  next();
});

/* speak challenge: say the sentence or name the picture */
def('speak',(o)=>{
  const words=o.mode==='words';const R=words?10:8;const key=words?'picture':'speak';
  setTitle(words?'🖼️ قل اسم الصورة':'🗣️ تحدي النطق',true);
  const pool=words?(o.cat?WORDS[o.cat].items:Object.values(WORDS).flatMap(c=>c.items)).map(i=>({en:i[0],ar:i[2],face:wordFace(i)})):ALLEX.map(x=>({en:x[0],ar:x[1]}));
  const qs=shuffle(pool.slice()).slice(0,Math.min(R,pool.length));const T=qs.length;let i=0,sc=0,tries=0,alive=true;onClean(()=>{alive=false;});
  view.innerHTML=`${micNote()}<div class="gtop"><span id="gi"></span><span>✅ <span id="gs">${N(0)}</span></span></div>
   <div class="stage" id="stage"><div id="q"></div>
    <div class="micwrap" style="margin-top:12px"><button class="mic" id="mic" aria-label="تكلّم">🎤</button><span class="hint" id="mh">اضغط وتكلّم</span><div class="live" id="live"></div></div><div class="fb" id="fb"></div>

  const cur=()=>qs[i];
  function show(){if(!alive)return;if(i>=T){const nb=saveBest(key,sc);addXP(sc*4);return result({title:sc>=T-1?'Super speaker! نطق رائع':'Keep going! استمر',score:`${N(sc)}/${N(T)}`,good:sc>=T/2,lines:[nb?'🏆 أفضل نتيجة جديدة!':'',`+${N(sc*4)} نقطة`]});}
    tries=0;const q=cur();$('#gi').textContent=`${N(i+1)} / ${N(T)}`;$('#fb').innerHTML='';$('#live').textContent='';
    $('#q').innerHTML=words?`<div style="font-size:84px;line-height:1.2">${q.face}</div><p class="muted" style="font-weight:800">ما اسم هذه بالإنجليزية؟ <span id="ans" hidden>— <span class="en">${q.en}</span> (${q.ar})</span></p>`
      :`<div class="say"><div class="en">${esc(q.en)}</div><div class="ar">${esc(q.ar)}</div></div>`;
    if(!words)kidVoice(q.en);}
  function next(ok){if(!alive)return;if(ok){sc++;S.spoken++;}$('#gs').textContent=N(sc);save();checkBadges();i++;setTimeout(show,ok?1100:300);}
  $('#hear').onclick=()=>{const q=cur();if(!q)return;if(words)$('#ans').hidden=false;kidVoice(q.en,{rate:words?.85:1});};
  $('#skip').onclick=()=>next(false);
  const mic=$('#mic');
  mic.onclick=()=>{if(mic.classList.contains('on')){stopListen();return;}if(TTS)try{speechSynthesis.cancel();}catch(e){}
    mic.classList.add('on');$('#mh').textContent='تكلّم الآن…';$('#live').textContent='';$('#fb').innerHTML='';
    listen({onLive:t=>{$('#live').textContent=t;},
      onError:code=>{if(!alive)return;mic.classList.remove('on');$('#mh').textContent='اضغط وتكلّم';$('#fb').innerHTML=micHelp(code);},
      onDone:res=>{if(!alive)return;mic.classList.remove('on');$('#mh').textContent='اضغط وتكلّم';const q=cur();
        if(!res.text){$('#fb').className='fb bad';$('#fb').textContent='لم أسمع شيئاً، تكلّم بصوت أعلى';return;}
        const r=bestOf(q.en,res.alts);const stg=$('#stage');stg.classList.remove('ok','bad');void stg.offsetWidth;
        if(r.s>=.75){stg.classList.add('ok');$('#fb').className='fb ok';$('#fb').innerHTML=`${heardHTML(r.words)}<br>${r.s>=.99?'نطق ممتاز! 🌟':'جيد جداً! 👏'}`;addXP(3);next(true);}
        else{tries++;stg.classList.add('bad');$('#fb').className='fb bad';$('#fb').innerHTML=`${heardHTML(r.words)}<br>${tries>=2?'اضغط 🔊 لتسمع، ثم حاول':'حاول مرة أخرى!'}`;}}});};
  show();
});

  setTitle('🔧 اختبار الميكروفون',true);
  const yes=b=>b?'✅':'❌';
  view.innerHTML=`<div class="card" style="text-align:center"><p style="font-weight:800;margin-bottom:6px">اضغط الميكروفون وقل بالإنجليزية:</p><p class="en" style="font-size:24px;font-weight:600">Hello, my name is ${esc(nm())}.</p>
    <div class="micwrap" style="margin-top:12px"><button class="mic" id="mic" aria-label="تكلّم">🎤</button><span class="hint" id="mh">اضغط وتكلّم</span><div class="live" id="live"></div></div><div id="ev"></div></div>
    <h2 class="sec">معلومات الجهاز</h2><div class="card"><ul class="diag">
     <li>${yes(!!SR)} المتصفح يستطيع فهم الكلام</li>
     <li>${yes(!EMBEDDED)} الصفحة مفتوحة من رابط GitHub</li>
     <li>📱 الجهاز: ${IOS?'آيفون / آيباد (استخدم Safari)':ANDROID?'أندرويد (استخدم Chrome)':'كمبيوتر (استخدم Chrome)'}</li>
     ${IOS&&STANDALONE?'<li>🏠 مفتوح من أيقونة الشاشة الرئيسية. إذا لم يعمل الميكروفون، افتح الرابط في Safari.</li>':''}
    </ul>${EMBEDDED||!SR?micHelp(EMBEDDED?'embedded':'none'):''}</div>`;
  const mic=$('#mic');
  mic.onclick=()=>{if(mic.classList.contains('on')){stopListen();return;}if(TTS)try{speechSynthesis.cancel();}catch(e){}
    mic.classList.add('on');$('#mh').textContent='أنا أسمعك…';$('#live').textContent='';$('#ev').innerHTML='';
    listen({onLive:t=>{$('#live').textContent=t;},
      onError:code=>{mic.classList.remove('on');$('#mh').textContent='اضغط وتكلّم';$('#ev').innerHTML=micHelp(code);},
      onDone:res=>{mic.classList.remove('on');$('#mh').textContent='اضغط وتكلّم';
        $('#ev').innerHTML=res.text?`<div class="evbox good"><p class="praise">✅ الميكروفون يعمل!</p><div class="heardline">👂 سمعتك تقول:<span class="en heardtxt">${esc(res.text)}</span></div></div>`
          :`<div class="evbox bad">🙉 الميكروفون يعمل لكني لم أسمع كلاماً. قرّب الهاتف وتكلّم بصوت أعلى.</div>`;}});};
});

/* ================= start ================= */
checkBadges();
if(!S.name){cur={name:'welcome'};render();}else{cur={name:'town'};render();}
})();
</script>
</body></html>
