<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="apple-touch-icon" sizes="180x180" href="https://kprpwd2wgn-ops.github.io/Rakan/times-icon-v2.png">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="https://kprpwd2wgn-ops.github.io/Rakan/times-icon-v2.png">
<link rel="icon" type="image/png" sizes="32x32" href="https://kprpwd2wgn-ops.github.io/Rakan/times-icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="https://kprpwd2wgn-ops.github.io/Rakan/times-icon-192.png">

<style>/* Layout: one centered chalkboard column; a wooden ledge header; chalk-drawn tiles in grids. Single committed look: a school chalkboard. */
:root{
  --board:#1d4a39; --board-2:#163b2d; --board-3:#245a46;
  --chalk:#f6f3e9; --chalk-2:#c3d5c8; --line:rgba(246,243,233,.2);
  --wood:#b97a42; --wood-2:#8a5526;
  --sun:#ffd95a; --ok:#8fe388; --bad:#ff7d72; --ink:#10281f;
  --f-display:"Lalezar","Baloo Bhaijaan 2",Tahoma,"Segoe UI",sans-serif;
  --f-body:"Baloo Bhaijaan 2",Tahoma,"Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--board)}
body{
  margin:0;direction:rtl;background:var(--board);color:var(--chalk);
  font-family:var(--f-body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 32px;
  background-image:
    radial-gradient(ellipse 60% 40% at 15% 10%,rgba(255,255,255,.05),transparent 70%),
    radial-gradient(ellipse 50% 35% at 90% 60%,rgba(255,255,255,.04),transparent 70%),
    radial-gradient(ellipse 70% 30% at 40% 95%,rgba(255,255,255,.035),transparent 70%);
  background-attachment:fixed;
  min-height:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--wood-2)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.25}
p{margin:0}
.wrap{max-width:760px;margin:0 auto}
[hidden]{display:none!important}

/* ===== header: wooden chalk ledge ===== */
.hdr{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:9;
  margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 18px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,var(--wood) 0%,var(--wood-2) 100%);
  box-shadow:0 4px 0 rgba(0,0,0,.25);
}
.hdr-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.hdr .back{width:44px;height:44px;border-radius:14px;background:rgba(0,0,0,.18);display:grid;place-items:center;flex:none}
.hdr .back svg{width:22px;height:22px}
.hdr .ttl{flex:1;min-width:0;font-family:var(--f-display);font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff8e6;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.hud{display:flex;gap:6px;flex:none}
.pill{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.25);font-weight:800;font-size:15px;white-space:nowrap}
.pill b{color:var(--sun)}

/* ===== common ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:52px;padding:8px 22px;border-radius:16px 13px 17px 12px;
  background:var(--sun);color:var(--ink);font-weight:800;font-size:18px;
  box-shadow:0 5px 0 #b8901e;transition:transform .08s, box-shadow .08s;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b8901e}
.btn.ghost{background:transparent;color:var(--chalk);border:2.5px solid var(--line);box-shadow:none}
.btn.ghost:active{transform:translateY(2px)}
.btn.sm{min-height:40px;font-size:15px;padding:4px 14px}
.btn.wide{width:100%}
.btn.ok{background:var(--ok);box-shadow:0 5px 0 #4f9f49}
.btn.bad{background:var(--bad);box-shadow:0 5px 0 #b44c43}
.sec{font-size:24px;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 10px,transparent 10px 16px)}
.muted{color:var(--chalk-2)}
.card{background:rgba(0,0,0,.16);border:2px solid var(--line);border-radius:20px 16px 22px 14px;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stars{letter-spacing:2px;color:var(--sun);font-size:18px;line-height:1}
.stars .off{color:rgba(255,255,255,.22)}

/* ===== home ===== */
.hello{display:flex;gap:14px;align-items:center}
.av{font-size:46px;width:76px;height:76px;flex:none;display:grid;place-items:center;border-radius:50%;background:rgba(0,0,0,.2);border:3px dashed var(--sun)}
.hello h1{font-size:30px}
.hello .lvl{font-weight:800;color:var(--sun)}
.bar{height:12px;border-radius:99px;background:rgba(0,0,0,.3);overflow:hidden;margin:6px 0 2px;border:1.5px solid var(--line)}
.bar i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .6s}
.sub{font-size:14px;color:var(--chalk-2)}
.suggest{margin-top:18px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:rgba(255,217,90,.1);border:2.5px dashed var(--sun);border-radius:18px;padding:12px 16px}
.suggest p{font-weight:600;min-width:0;flex:1 1 200px}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:10px 6px 12px;border:2.5px solid var(--c);border-radius:20px 14px 22px 13px;
  background:color-mix(in srgb,var(--c) 9%,transparent);transition:transform .15s;
}
.tile:hover{transform:rotate(-1.5deg) scale(1.03)}
.tile:active{transform:scale(.96)}
.tile .tn{font-family:var(--f-display);font-size:46px;line-height:1.1;color:var(--c);text-shadow:0 3px 0 rgba(0,0,0,.25)}
.tile .tl{font-size:13px;color:var(--chalk-2);font-weight:600}
.tile .stars{font-size:15px}
.tile .mb{width:80%;height:6px;border-radius:9px;background:rgba(0,0,0,.3);overflow:hidden;margin-top:4px}
.tile .mb i{display:block;height:100%;background:var(--c)}
.tile .crown{position:absolute;top:4px;left:6px;font-size:16px}

.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:640px){.modes{grid-template-columns:repeat(3,1fr)}}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:start;padding:16px;
  border-radius:20px 15px 22px 14px;background:rgba(0,0,0,.18);border:2.5px solid var(--line);transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-3px);border-color:var(--sun)}
.mode .mi{font-size:34px;line-height:1}
.mode h3{font-size:21px}
.mode p{font-size:14px;color:var(--chalk-2);line-height:1.45}

/* ===== table screen ===== */
.thead{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.bignum{font-family:var(--f-display);font-size:78px;line-height:1;color:var(--c);text-shadow:0 5px 0 rgba(0,0,0,.25);min-width:84px;text-align:center}
.thead h1{font-size:28px;color:var(--c)}
.tabs{display:flex;gap:6px;background:rgba(0,0,0,.22);padding:5px;border-radius:16px;margin-bottom:16px}
.tab{flex:1;min-height:46px;border-radius:12px;font-weight:800;font-size:16px;color:var(--chalk-2)}
.tab.on{background:var(--c);color:var(--ink)}
.trows{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (max-width:420px){.trows{grid-template-columns:1fr}}
.trow{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-radius:14px;border:2px solid var(--line);
  font-family:var(--f-display);font-size:24px;background:rgba(0,0,0,.12);direction:rtl}
.trow.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.trow .p{color:var(--c);min-width:2.4em;text-align:center;border-radius:10px;transition:background .2s}
.trow .p.hid{background:rgba(255,255,255,.12);color:transparent}
.trow .tag{font-family:var(--f-body);font-size:11px;font-weight:800;background:var(--c);color:var(--ink);border-radius:8px;padding:0 6px;margin-inline-start:6px;vertical-align:middle}
.dotsbox{margin-top:14px}
.dots{display:grid;gap:5px;justify-content:center;margin:12px 0;direction:ltr}
.dots i{width:clamp(12px,4.2vw,20px);aspect-ratio:1;border-radius:50%;background:var(--c);box-shadow:0 2px 0 rgba(0,0,0,.3);animation:popin .3s backwards}
@keyframes popin{from{transform:scale(0)}}
.cap{text-align:center;font-weight:600}
.cap b{color:var(--c);font-family:var(--f-display);font-size:22px;font-weight:400}
.jumps{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px;direction:rtl}
.jumps span{min-width:46px;text-align:center;padding:4px 6px;border-radius:12px;border:2px dashed var(--line);font-family:var(--f-display);font-size:20px;color:var(--chalk-2);transition:all .2s}
.jumps span.lit{border-style:solid;border-color:var(--c);background:var(--c);color:var(--ink);transform:translateY(-4px) scale(1.08)}

.secret{border-inline-start:6px solid var(--c);padding:14px 16px;border-radius:16px;background:rgba(0,0,0,.18);margin-bottom:12px}
.secret h3{font-size:21px;color:var(--c);margin-bottom:4px}
.secret .ex{margin-top:8px;padding:6px 12px;background:rgba(0,0,0,.22);border-radius:10px;font-weight:800;display:inline-block;font-size:18px}
.nick{display:inline-block;background:var(--c);color:var(--ink);border-radius:10px;padding:2px 12px;font-weight:800;margin-bottom:12px}
.didyou{border:2.5px dashed var(--c);border-radius:18px;padding:14px 16px;margin-top:6px}
.didyou h3{font-size:19px;margin-bottom:4px}

/* fingers */
.hands{display:flex;justify-content:center;gap:4px;align-items:flex-end;direction:ltr;margin:14px 0 6px;height:120px}
.finger{width:clamp(22px,7vw,34px);height:100px;border-radius:16px 16px 8px 8px;background:#f3c9a0;border:2.5px solid #8a5526;display:flex;align-items:flex-end;justify-content:center;font-weight:800;color:#5b3412;font-size:14px;padding-bottom:4px;transition:height .25s,background .25s}
.finger:nth-child(5){margin-right:14px}
.finger:nth-child(1),.finger:nth-child(10){height:72px}
.finger:nth-child(2),.finger:nth-child(9){height:92px}
.finger:nth-child(5),.finger:nth-child(6){height:64px}
.finger.down{height:30px!important;background:var(--bad)}
.handres{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;font-weight:600}
.handres b{font-family:var(--f-display);font-size:24px;color:var(--c);font-weight:400}

.acts{display:grid;gap:10px}
.act{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:18px 14px 20px 13px;background:rgba(0,0,0,.18);border:2.5px solid var(--line);text-align:start;transition:border-color .15s,transform .15s}
.act:hover{border-color:var(--c,var(--sun));transform:translateX(-3px)}
.act .ai{font-size:34px;flex:none;width:48px;text-align:center}
.act h3{font-size:20px}
.act p{font-size:14px;color:var(--chalk-2)}
.act .best{margin-inline-start:auto;flex:none;font-size:13px;font-weight:800;color:var(--sun);text-align:center}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-width:44px;height:44px;border-radius:12px;border:2.5px solid var(--c,var(--line));font-family:var(--f-display);font-size:20px;color:var(--c,var(--chalk));opacity:.45}
.chip.on{opacity:1;background:color-mix(in srgb,var(--c) 22%,transparent)}
.chip.txt{font-family:var(--f-body);font-size:14px;font-weight:800;padding:0 12px;opacity:1;--c:var(--chalk-2)}

/* ===== quiz ===== */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;font-weight:800}
.qlives{font-size:20px;letter-spacing:2px}
.tbar{height:10px;border-radius:99px;background:rgba(0,0,0,.3);overflow:hidden;margin-bottom:12px}
.tbar i{display:block;height:100%;background:var(--c);width:100%;transition:width .1s linear}
.tbar.low i{background:var(--bad)}
.eqcard{text-align:center;padding:18px 10px 12px;border-radius:24px 18px 26px 16px;border:3px solid var(--c);background:rgba(0,0,0,.18);position:relative}
.eq{display:flex;justify-content:center;align-items:center;gap:.3em;direction:rtl;font-family:var(--f-display);line-height:1.2}
.eq.big{font-size:clamp(46px,14vw,74px)}
.eq .op{color:var(--chalk-2);font-size:.7em}
.eq .ans{min-width:1.7em;border-bottom:4px dashed var(--c);color:var(--c)}
.eq .ans.empty{color:rgba(255,255,255,.3)}
.fb{min-height:30px;font-weight:800;font-size:18px}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.eqcard.ok{animation:okglow .5s}
.eqcard.bad{animation:shake .45s}
@keyframes okglow{40%{background:rgba(143,227,136,.25);transform:scale(1.03)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.hintrow{display:flex;justify-content:center;margin:10px 0 0}
.hintbox{margin-top:10px;padding:10px 14px;border-radius:14px;background:rgba(255,217,90,.12);border:2px dashed var(--sun);text-align:center;font-weight:600}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px auto 0;max-width:380px}
.k{height:62px;border-radius:16px;background:rgba(255,255,255,.08);border:2px solid var(--line);font-family:var(--f-display);font-size:30px;box-shadow:0 4px 0 rgba(0,0,0,.3);transition:transform .06s}
.k:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.k.go{background:var(--ok);color:var(--ink);border-color:var(--ok)}
.k.del{font-size:24px}

/* ===== result overlay ===== */
.ov{position:fixed;inset:0;z-index:50;background:rgba(8,22,16,.72);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  animation:fade .25s}
@keyframes fade{from{opacity:0}}
.res{width:min(420px,100%);background:var(--board-3);border:4px solid var(--wood);border-radius:28px 22px 30px 20px;padding:24px 20px;text-align:center;
  box-shadow:0 10px 0 var(--wood-2),0 20px 40px rgba(0,0,0,.4);animation:bounce .5s}
@keyframes bounce{0%{transform:scale(.6)}60%{transform:scale(1.05)}}
.res h2{font-size:30px;color:var(--sun)}
.res .bigs{font-size:46px;letter-spacing:6px;margin:6px 0}
.res .bigs span{display:inline-block;animation:starin .5s backwards}
.res .bigs span:nth-child(2){animation-delay:.25s}.res .bigs span:nth-child(3){animation-delay:.5s}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}}
.res .score{font-family:var(--f-display);font-size:60px;line-height:1.1;color:var(--chalk)}
.res ul{list-style:none;padding:0;margin:8px 0 16px;display:grid;gap:4px;font-weight:600}
.res .btns{display:grid;gap:10px}

/* toast */
.toasts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;z-index:60;display:grid;justify-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--sun);color:var(--ink);font-weight:800;padding:10px 18px;border-radius:16px;box-shadow:0 6px 0 #b8901e;animation:toastin .35s;max-width:100%}
@keyframes toastin{from{transform:translateY(30px);opacity:0}}

/* ===== balloon game ===== */
.sky{position:relative;height:min(62vh,520px);border-radius:24px 18px 26px 16px;overflow:hidden;border:3px solid var(--line);
  background:linear-gradient(180deg,#2c6b8f 0%,#3f8db0 55%,#7cc1c9 100%)}
.sky .cloud{position:absolute;background:rgba(255,255,255,.7);border-radius:99px;filter:blur(1px)}
.qbubble{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:3;background:var(--chalk);color:var(--ink);border-radius:18px;padding:4px 18px;font-family:var(--f-display);font-size:34px;box-shadow:0 5px 0 rgba(0,0,0,.25);white-space:nowrap}
.balloon{position:absolute;bottom:-120px;width:78px;height:96px;margin-left:-39px;z-index:2;
  border-radius:50% 50% 48% 52% / 58% 58% 42% 42%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.65) 0 10%,transparent 26%),var(--c);
  box-shadow:inset -8px -10px 0 rgba(0,0,0,.12);font-family:var(--f-display);font-size:30px;color:var(--ink);
  animation:rise var(--dur) linear forwards, sway 1.6s ease-in-out infinite alternate}
.balloon::after{content:"";position:absolute;top:100%;left:50%;width:2px;height:46px;background:rgba(255,255,255,.7)}
.balloon::before{content:"";position:absolute;top:calc(100% - 4px);left:calc(50% - 6px);border:6px solid transparent;border-bottom-color:var(--c)}
@keyframes rise{from{bottom:-120px}to{bottom:110%}}
@keyframes sway{from{margin-left:-46px}to{margin-left:-32px}}
.balloon.popped{animation:popb .25s forwards;pointer-events:none}
@keyframes popb{to{transform:scale(1.7);opacity:0}}
.balloon.wrong{animation:popb .3s forwards;background:var(--bad)}
.gstat{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800;gap:10px}
.gstat .big{font-family:var(--f-display);font-size:28px;color:var(--sun);font-weight:400}

/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;perspective:800px}
@media (max-width:420px){.mem{grid-template-columns:repeat(3,1fr)}}
.mcard{aspect-ratio:3/4;max-width:100%;position:relative;transform-style:preserve-3d;transition:transform .45s}
.mcard.flip,.mcard.done{transform:rotateY(180deg)}
.mcard .f,.mcard .bk{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mcard .bk{background:repeating-linear-gradient(45deg,var(--wood) 0 10px,var(--wood-2) 10px 20px);border:3px solid #6a3f1a;font-family:var(--f-display);font-size:34px;color:#ffe9c7}
.mcard .f{transform:rotateY(180deg);background:var(--chalk);color:var(--ink);font-family:var(--f-display);font-size:clamp(22px,6vw,32px);border:4px solid var(--c);direction:rtl}
.mcard.done .f{background:var(--c)}

/* true false */
.tfbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.tfbtns .btn{min-height:84px;font-size:26px}

/* missing */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opt{min-height:74px;border-radius:18px;border:3px solid var(--line);background:rgba(255,255,255,.07);font-family:var(--f-display);font-size:36px;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.opt.ok{background:var(--ok);color:var(--ink);border-color:var(--ok)}
.opt.bad{background:var(--bad);color:var(--ink);border-color:var(--bad)}

/* boss */

function hintFor(a,b){
  // يختار أسهل استراتيجية لهذا السؤال
  const t=[a,b];
  const has=n=>t.includes(n);
  const other=n=>a===n?b:a;
  if(has(1)) return `أي عدد × 1 = نفسه`;
  if(has(10)){const o=other(10);return `ضع صفراً بجانب ${o}`;}
  if(has(2)){const o=other(2);return `${o} + ${o} = ؟`;}
  if(has(11)&&other(11)<=9){const o=other(11);return `اكتب ${o} مرتين`;}
  if(has(5)){const o=other(5);return o%2===0?`نصف ${o} ثم ضع صفراً`:`${o} − 1 = ${o-1}، نصفه ${(o-1)/2}، ثم ضع 5`;}
  if(has(9)){const o=other(9);return `(10 × ${o}) − ${o} = ${10*o} − ${o}`;}
  if(has(4)){const o=other(4);return `ضاعف ${o} مرتين: ${o} ← ${o*2} ← ؟`;}
  if(has(3)){const o=other(3);return `(2 × ${o}) + ${o} = ${2*o} + ${o}`;}
  if(has(11)){const o=other(11);return `(10 × ${o}) + ${o} = ${10*o} + ${o}`;}
  if(has(12)){const o=other(12);return `(10 × ${o}) + (2 × ${o}) = ${10*o} + ${2*o}`;}
  if(has(6)){const o=other(6);return `(5 × ${o}) + ${o} = ${5*o} + ${o}`;}
  if(has(8)){const o=other(8);return `ضاعف ${o} ثلاث مرات: ${o} ← ${2*o} ← ${4*o} ← ؟`;}
  if(has(7)){const o=other(7);return `(5 × ${o}) + (2 × ${o}) = ${5*o} + ${2*o}`;}
  return `${a} × ${b} = ${b} × ${a}`;
}

  return{idx:i,name:c[1],next:n?n[0]:null,nextName:n?n[1]:'',pct:n?Math.round((S.coins-c[0])/(n[0]-c[0])*100):100};}

let quiet=false; // لتجميع الإشعارات
function addCoins(n){
  if(n<=0)return;const before=level().idx;S.coins+=n;save();hud();
  const after=level().idx;if(after>before){sfx.win();toast(`🎉 مستوى جديد: ${level().name}!`);}
}
function record(a,b,ok,coin=1){
  const k=fk(a,b),f=S.stats[k]||{c:0,w:0,s:0};
  if(ok){f.c++;f.s++;S.streak++;S.correct++;if(S.streak>S.bestStreak)S.bestStreak=S.streak;addCoins(coin);
    if(S.streak>0&&S.streak%10===0)toast(`🔥 ${D(S.streak)} إجابات صحيحة متتالية!`);}
  else{f.w++;f.s=0;S.streak=0;}
  S.stats[k]=f;save();checkBadges();
}

function go(name,arg,push=true){if(push&&cur)stack.push(cur);clean();cur={name,arg};SCREENS[name](arg);window.scrollTo(0,0);hud();}

/* قصاصات الاحتفال */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const P=[...Array(140)].map(()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.3,col:COLORS[1+Math.floor(Math.random()*12)]}));
  let t=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.col;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});
    if(++t<170)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);})();
}

function keypadHTML(){return `<div class="kp" dir="ltr">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="k" data-k="${n}">${D(n)}</button>`).join('')}<button class="k del" data-k="del" aria-label="مسح">⌫</button><button class="k" data-k="0">${D(0)}</button><button class="k go" data-k="ok" aria-label="تحقّق">✓</button></div>`;}
function bindKeypad(root,{onChange,onSubmit,max=3}){
  let v='';
  const press=k=>{
    if(k==='del'){v=v.slice(0,-1);}
    else if(k==='ok'){if(v!=='')onSubmit(+v);return;}
    else if(v.length<max){v=(v==='0'?'':v)+k;}
    sfx.tap();onChange(v);
  };
  $$('.k',root).forEach(b=>b.addEventListener('click',()=>press(b.dataset.k)));
  keyHandler=e=>{
    if(e.target&&e.target.tagName==='INPUT')return;
    const ch=e.key;const n=/[0-9]/.test(ch)?ch:(AR.indexOf(ch)>=0?String(AR.indexOf(ch)):null);
    if(n!==null&&ch.length===1){press(n);e.preventDefault();}
    else if(ch==='Backspace'){press('del');e.preventDefault();}
    else if(ch==='Enter'){press('ok');e.preventDefault();}
  };
  return{reset(){v='';onChange(v);},get value(){return v;}};
}

function distract(a,b,n=3){
  const p=a*b,set=new Set();
  const c=shuffle([p+a,p-a,p+b,p-b,p+1,p-1,p+10,p-10,(a+1)*(b-1),(a-1)*(b+1),+String(p).split('').reverse().join('')]);
  for(const x of c){if(x>0&&x!==p&&!set.has(x))set.add(x);if(set.size>=n)break;}
  while(set.size<n){const x=p+rint(-12,12);if(x>0&&x!==p)set.add(x);}
  return[...set];
}
function randFact(tables=S.tables,minB=1){const a=pick(tables),b=rint(minB,12);return Math.random()<.5?{a,b}:{a:b,b:a};}
function seeded(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
  return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return(h>>>0)/4294967296;};}

function bindChips(onChange){

  box.innerHTML=`

      <span>${D(n)} × ${D(b)}${isNew?'<span class="tag">جديد</span>':''}</span><span class="p ${hide?'hid':''}" data-p>${D(n*b)}</span></button>`;}).join('');
    $$('.trow').forEach(r=>r.onclick=e=>{

SCREENS.quiz=(o)=>{
  setTitle(o.title);
  let i=0,score=0,wrong=0,hints=0,lives=o.lives||0,q=null,locked=false,hinted=false,t0=Date.now(),left=o.totalTime||0,qT=0,done=false;
  const color=o.color||'var(--sun)';
  view.innerHTML=`<div style="--c:${color}">
    <div class="qtop"><span id="qprog"></span><span class="qlives" id="qlives"></span><span id="qscore"></span></div>
    <div class="tbar" id="tbar" ${o.totalTime||o.perTime?'':'hidden'}><i id="tfill"></i></div>
    <div class="eqcard" id="eqcard"><div id="eq"></div><div class="fb" id="fb"></div></div>
    <div class="hintbox" id="hintbox" hidden></div>
    ${o.hint?'<div class="hintrow"><button class="btn ghost sm" id="hintbtn">💡 تلميح</button></div>':''}
    ${keypadHTML()}</div>`;
  const kp=bindKeypad(view,{onChange:v=>{if(!locked)$('#eq').innerHTML=eqHTML(q.a,q.b,v===''?'':D(v),'big');},onSubmit:submit});
  function top(){
    $('#qprog').textContent=o.total&&o.total<999?`${D(Math.min(i+1,o.total))} / ${D(o.total)}`:'';
    $('#qlives').innerHTML=o.lives?[...Array(o.lives)].map((_,k)=>k<lives?'❤️':'🤍').join(''):'';
    $('#qscore').innerHTML=`✅ ${D(score)}`;
  }
  function next(){
    if(done)return;
    if(o.total&&i>=o.total)return end(true);
    q=o.gen(i);locked=false;hinted=false;qT=Date.now();
    $('#eq').innerHTML=eqHTML(q.a,q.b,'','big');$('#fb').textContent='';$('#fb').className='fb';$('#hintbox').hidden=true;
    kp.reset();top();
  }
  function submit(v){
    if(locked||done)return;locked=true;
    const p=q.a*q.b,ok=v===p,card=$('#eqcard');
    card.classList.remove('ok','bad');void card.offsetWidth;
    if(ok){score+=hinted?.5:1;sfx.ok();card.classList.add('ok');$('#fb').className='fb ok';$('#fb').textContent=pick(['ممتاز! 🌟','رائع! 👏','أحسنت! 💪','عبقري! 🧠','صح! 🎯']);
      record(q.a,q.b,true,hinted?0:1);$('#eq').innerHTML=eqHTML(q.a,q.b,D(p),'big');i++;top();setTimeout(next,o.fast?280:650);}
    else{wrong++;sfx.bad();card.classList.add('bad');record(q.a,q.b,false);
      $('#fb').className='fb bad';$('#fb').innerHTML=`الصواب: ${D(q.a)} × ${D(q.b)} = ${D(p)}`;
      $('#eq').innerHTML=eqHTML(q.a,q.b,D(p),'big');
      if(o.lives){lives--;top();if(lives<=0){setTimeout(()=>end(false),1300);return;}}
      if(o.suddenDeath){setTimeout(()=>end(false),1300);return;}
      if(o.retry)o.retryQueue=(o.retryQueue||[]).concat([q]);
      i++;setTimeout(next,1600);}
  }
  function end(complete){
    if(done)return;done=true;keyHandler=null;
    o.onEnd({score,wrong,hints,count:i,time:Math.round((Date.now()-t0)/1000),complete});
  }
  if(o.hint)$('#hintbtn').onclick=()=>{if(locked||hinted)return;hinted=true;hints++;sfx.flip();$('#hintbox').hidden=false;$('#hintbox').innerHTML='💡 '+D(hintFor(q.a,q.b));};
  if(o.totalTime||o.perTime){
    const iv=setInterval(()=>{
      if(done)return;
      if(o.totalTime){const el=(Date.now()-t0)/1000;left=Math.max(0,o.totalTime-el);$('#tfill').style.width=(left/o.totalTime*100)+'%';$('#tbar').classList.toggle('low',left<10);if(left<=0)end(true);}
    },100);onClean(()=>clearInterval(iv));
  }
  next();
};

function startStarTest(n){
  const bs=shuffle(ALL.slice()).slice(0,10);
  go('quiz',{title:`اختبار نجوم جدول ${D(n)}`,color:COLORS[n],total:10,hint:true,gen:i=>({a:n,b:bs[i]}),
    onEnd:r=>{const st=r.score>=9?3:r.score>=7?2:r.score>=5?1:0,old=S.stars[n]||0;
      if(st>old){S.stars[n]=st;addCoins((st-old)*10);save();checkBadges();}
      result({title:st===3?'مذهل! 🏆':st>0?'أحسنت!':'حاول مرة أخرى 💪',stars:st,score:`${D(r.score)} / ${D(10)}`,good:st>0,
        lines:[st>old?`نجوم جديدة! +${D((st-old)*10)} عملة`:`أفضل نتيجة لك: ${D(old)} نجوم`,r.hints?`استخدمت ${D(r.hints)} تلميح (نصف درجة لكل سؤال بتلميح)`:'بدون أي تلميح 👑',st<3?`تحتاج ${D(9)} صحيحة على الأقل للنجمة الثالثة`:'']});}});
}
function startOrdered(n){
  go('quiz',{title:`تدريب جدول ${D(n)}`,color:COLORS[n],total:12,hint:true,gen:i=>({a:n,b:i+1}),
    onEnd:r=>result({title:'انتهى التدريب!',score:`${D(r.score)} / ${D(12)}`,good:r.score>=8,lines:['الآن جرّب اختبار النجوم ⭐']})});
}
function startSmart(){
  // يختار الحقائق الأضعف أولاً
  const pool=[];for(let a=1;a<=12;a++)for(let b=a;b<=12;b++){const f=S.stats[fk(a,b)]||{c:0,w:0,s:0};
    let w=1+f.w*3-Math.min(f.c,6)*.4-f.s*.5+(f.c+f.w===0?1.5:0)+(a>=6&&b>=6?1:0);pool.push({a,b,w:Math.max(.2,w)});}
  const qs=[];for(let k=0;k<15;k++){const tot=pool.reduce((s,x)=>s+x.w,0);let r=Math.random()*tot,ch=pool[0];for(const x of pool){r-=x.w;if(r<=0){ch=x;break;}}
    qs.push(Math.random()<.5?{a:ch.a,b:ch.b}:{a:ch.b,b:ch.a});ch.w*=.15;}
  go('quiz',{title:'المراجعة الذكية',total:15,hint:true,gen:i=>qs[i],
    onEnd:r=>result({title:'راجعت نقاط ضعفك! 🧠',score:`${D(r.score)} / ${D(15)}`,good:r.score>=10,lines:['المراجعة الذكية تختار الحقائق التي تخطئ فيها أكثر','شاهد تقدّمك في شبكة الإنجاز 🧩']})});
}

/* فرقعة البالونات */
SCREENS.balloon=()=>{
  setTitle('فرقعة البالونات 🎈');
  let score=0,lives=3,round=0,done=false,q;
  view.innerHTML=`<div class="gstat"><span>النقاط: <span class="big" id="bs">${D(0)}</span></span><span class="qlives" id="bl"></span></div>
    <div class="sky" id="sky">
      <div class="cloud" style="width:120px;height:34px;top:22%;left:8%"></div><div class="cloud" style="width:90px;height:26px;top:48%;right:10%"></div><div class="cloud" style="width:140px;height:36px;top:72%;left:30%"></div>
      <div class="qbubble" id="bq"></div></div>
    <p class="muted" style="text-align:center;margin-top:8px;font-size:14px">لا تدع البالون الصحيح يهرب! كل خطأ يكلّفك قلباً.</p>`;
  const sky=$('#sky');
  const lv=()=>$('#bl').innerHTML=[0,1,2].map(k=>k<lives?'❤️':'🤍').join('');
  function lose(){lives--;lv();if(lives<=0)finish();}
  function newRound(){
    if(done)return;round++;const my=round;
    $$('.balloon',sky).forEach(b=>b.remove());
    q=randFact();const p=q.a*q.b;
    $('#bq').innerHTML=`${D(q.a)} × ${D(q.b)} = ؟`;
    const vals=shuffle([p,...distract(q.a,q.b,3)]);const xs=shuffle([14,38,62,86]);
    const dur=Math.max(3.4,7.2-score*.18);
    vals.forEach((v,k)=>{
      const b=document.createElement('button');b.className='balloon';b.textContent=D(v);
      b.style.left=xs[k]+'%';b.style.setProperty('--c',COLORS[1+((k*3+round)%12)]);
      b.style.setProperty('--dur',(dur+Math.random()*1.2)+'s');b.style.animationDelay=(Math.random()*.9)+'s, 0s';
      b.onclick=()=>{if(done||my!==round)return;
        if(v===p){sfx.pop();sfx.ok();b.classList.add('popped');score++;$('#bs').textContent=D(score);record(q.a,q.b,true);setTimeout(newRound,350);}
        else{sfx.bad();b.classList.add('wrong');record(q.a,q.b,false);lose();}};
      b.addEventListener('animationend',e=>{if(e.animationName!=='rise'||my!==round||done)return;
        if(v===p){toast(`${D(q.a)} × ${D(q.b)} = ${D(p)}`,1600);sfx.bad();lose();if(!done)setTimeout(newRound,500);}else b.remove();});
      sky.appendChild(b);
    });
  }
  function finish(){if(done)return;done=true;$$('.balloon',sky).forEach(b=>b.style.animationPlayState='paused');
    const nb=saveBest('balloon',score);addCoins(Math.floor(score/3));
    setTimeout(()=>result({title:'انتهت البالونات!',score:D(score),good:score>0,lines:[nb&&score>0?'🏆 رقم قياسي جديد!':`رقمك القياسي: ${D(S.best.balloon||0)}`,`مكافأة: +${D(Math.floor(score/3))} عملة`]}),500);}
  onClean(()=>{done=true;});
  lv();newRound();
};

/* لعبة الذاكرة */
SCREENS.memory=()=>{
  setTitle('لعبة الذاكرة 🧠');
  const facts=[],prods=new Set();let guard=0;
  while(facts.length<6&&guard++<500){const f=randFact();const p=f.a*f.b;if(!prods.has(p)){prods.add(p);facts.push(f);}}
  const cards=shuffle(facts.flatMap((f,i)=>[{id:i,txt:`${D(f.a)} × ${D(f.b)}`,f},{id:i,txt:D(f.a*f.b),f}]));
  let open=[],moves=0,matched=0,lock=false,t0=Date.now();
  view.innerHTML=`<div class="gstat"><span>المحاولات: <span class="big" id="mm">${D(0)}</span></span><span>الأزواج: <span class="big" id="mp">${D(0)}/${D(6)}</span></span></div>
    <div class="mem">${cards.map((c,k)=>`<button class="mcard" data-k="${k}" style="--c:${COLORS[(c.id*2)%12+1]}" aria-label="بطاقة"><span class="bk">؟</span><span class="f">${c.txt}</span></button>`).join('')}</div>`;
  $$('.mcard').forEach(el=>el.onclick=()=>{
    const k=+el.dataset.k;if(lock||el.classList.contains('flip')||el.classList.contains('done'))return;
    sfx.flip();el.classList.add('flip');open.push(k);
    if(open.length===2){moves++;$('#mm').textContent=D(moves);lock=true;
      const[x,y]=open,A=cards[x],B=cards[y],ex=$(`.mcard[data-k="${x}"]`),ey=$(`.mcard[data-k="${y}"]`);
      if(A.id===B.id){setTimeout(()=>{ex.classList.add('done');ey.classList.add('done');sfx.ok();record(A.f.a,A.f.b,true);matched++;$('#mp').textContent=`${D(matched)}/${D(6)}`;open=[];lock=false;
        if(matched===6){const nb=saveBest('memory',moves,true);addCoins(8);setTimeout(()=>result({title:'ذاكرة رائعة!',score:`${D(moves)} محاولة`,lines:[nb?'🏆 رقم قياسي جديد!':`أفضل نتيجة: ${D(S.best.memory)} محاولة`,`الوقت: ${D(Math.round((Date.now()-t0)/1000))} ثانية`,'مكافأة: +'+D(8)+' عملات']}),500);}},400);}
      else setTimeout(()=>{ex.classList.remove('flip');ey.classList.remove('flip');open=[];lock=false;},950);
    }
  });
};

SCREENS.tf=()=>{

    record(q.a,q.b,ok);
    if(ok){score++;streak++;sfx.ok();card.classList.add('ok');$('#fb').className='fb ok';$('#fb').textContent=streak>=5?`🔥 ${D(streak)} متتالية!`:'صح!';setTimeout(next,350);}
    else{streak=0;sfx.bad();card.classList.add('bad');$('#fb').className='fb bad';$('#fb').textContent=`${D(q.a)} × ${D(q.b)} = ${D(q.a*q.b)}`;setTimeout(next,1200);}
    $('#ts').textContent=D(score);}
  $('#yes').onclick=()=>ans(true);$('#no').onclick=()=>ans(false);
  keyHandler=e=>{if(e.key==='ArrowLeft')ans(true);else if(e.key==='ArrowRight')ans(false);};
  const iv=setInterval(()=>{const left=Math.max(0,T-(Date.now()-t0)/1000);$('#tfill').style.width=(left/T*100)+'%';$('#tst').textContent=`⏳ ${D(Math.ceil(left))}`;

  onClean(()=>{clearInterval(iv);done=true;});
  next();
};

    <div class="eqcard" id="eqcard"><div id="eq"></div><div class="fb" id="fb"></div></div><div class="opts" id="opts"></div></div>`;
  function next(){
    if(i>=N){const nb=saveBest('missing',score);addCoins(score);return result({title:score===N?'محقّق عبقري! 🔍':'أحسنت!',score:`${D(score)} / ${D(N)}`,good:score>=6,lines:[nb?'🏆 أفضل نتيجة جديدة!':`أفضل نتيجة: ${D(S.best.missing)}/${D(N)}`,'مكافأة: +'+D(score)+' عملة']});}
    lock=false;const t=pick(S.tables),b=rint(1,12),p=t*b,left=Math.random()<.5;
    $('#mi').textContent=`${D(i+1)}/${D(N)}`;$('#fb').textContent='';
    $('#eq').innerHTML=`<div class="eq big">${left?`<span class="ans empty">؟</span>`:`<span>${D(t)}</span>`}<span class="op">×</span>${left?`<span>${D(t)}</span>`:`<span class="ans empty">؟</span>`}<span class="op">=</span><span>${D(p)}</span></div>`;
    const set=new Set([b]);while(set.size<4){const x=rint(Math.max(1,b-3),Math.min(12,b+3));if(x!==b)set.add(x);if(set.size<4&&Math.random()<.2)set.add(rint(1,12));}
    $('#opts').innerHTML=shuffle([...set].slice(0,4)).map(v=>`<button class="opt" data-v="${v}">${D(v)}</button>`).join('');
    $$('.opt').forEach(o=>o.onclick=()=>{if(lock)return;lock=true;const v=+o.dataset.v,ok=v===b;record(t,b,ok);
      if(ok){score++;sfx.ok();o.classList.add('ok');$('#fb').className='fb ok';$('#fb').textContent='وجدته! 🔍';}
      else{sfx.bad();o.classList.add('bad');$(`.opt[data-v="${b}"]`).classList.add('ok');$('#fb').className='fb bad';$('#fb').textContent=`${D(t)} × ${D(b)} = ${D(p)}`;}
      $('#ms').textContent=D(score);i++;setTimeout(next,ok?700:1500);});
  }
  next();
};

/* معركة الوحش */
SCREENS.boss=(n)=>{
  setTitle(`المعركة ضد ${MONSTERS[n]}`);
  const HP=8,PT=12;let hp=HP,lives=3,q,locked=false,done=false,qT=0;
  const bag=[];const refill=()=>bag.push(...shuffle(ALL.slice()));
  view.innerHTML=`<div style="--c:${COLORS[n]}">
    <div class="arena" id="arena"><div class="mname">${MONSTERS[n]}</div>
      <div class="hp"><i id="hp" style="width:100%"></i></div><div id="monwrap">${monsterSVG(n)}</div>
      <div class="qlives" id="bl"></div></div>
    <div class="tbar" style="margin-top:10px"><i id="tfill"></i></div>
    <div class="eqcard" id="eqcard"><div id="eq"></div><div class="fb" id="fb"></div></div>
    ${keypadHTML()}</div>`;
  const kp=bindKeypad(view,{onChange:v=>{if(!locked)$('#eq').innerHTML=eqHTML(q.a,q.b,v===''?'':D(v),'big');},onSubmit:submit});
  const lv=()=>$('#bl').innerHTML='أنت: '+[0,1,2].map(k=>k<lives?'❤️':'🤍').join('');
  function next(){if(done)return;if(!bag.length)refill();const b=bag.pop();q=Math.random()<.7?{a:n,b}:{a:b,b:n};locked=false;qT=Date.now();
    $('#eq').innerHTML=eqHTML(q.a,q.b,'','big');$('#fb').textContent='';kp.reset();}
  function hurt(msg){lives--;lv();sfx.bad();const a=$('#arena');a.classList.remove('flash');void a.offsetWidth;a.classList.add('flash');
    $('#fb').className='fb bad';$('#fb').innerHTML=msg;if(lives<=0){done=true;setTimeout(()=>result({title:`${MONSTERS[n]} فاز هذه المرة 😤`,good:false,lines:['راجع أسرار الجدول ثم عُد للانتقام!',`صحة الوحش المتبقية: ${D(hp)} من ${D(HP)}`]}),1300);}else setTimeout(next,1500);}
  function submit(v){if(locked||done)return;locked=true;const p=q.a*q.b;
    if(v===p){record(q.a,q.b,true);hp--;sfx.hit();$('#hp').style.width=(hp/HP*100)+'%';$('#eq').innerHTML=eqHTML(q.a,q.b,D(p),'big');
      const m=$('#monwrap .mon');m.classList.remove('hit');void m.offsetWidth;m.classList.add('hit');
      const d=document.createElement('div');d.className='dmg';d.textContent=pick(['بوم!','طاخ!','−١','ضربة!']);$('#arena').appendChild(d);setTimeout(()=>d.remove(),800);
      $('#fb').className='fb ok';$('#fb').textContent='ضربة موفقة! ⚔️';
      if(hp<=0){done=true;m.classList.add('dead');const first=!S.bosses[n];S.bosses[n]=1;save();addCoins(first?25:5);checkBadges();
        setTimeout(()=>result({title:`هزمت ${MONSTERS[n]}! 🏆`,lines:[first?`+${D(25)} عملة ووسام المعركة`:`+${D(5)} عملات`,`قلوبك المتبقية: ${D(lives)}`]}),900);}
      else setTimeout(next,600);}
    else{record(q.a,q.b,false);$('#eq').innerHTML=eqHTML(q.a,q.b,D(p),'big');hurt(`الوحش ضربك! الصواب ${D(p)}`);}
  }
  const iv=setInterval(()=>{if(done||locked)return;const left=Math.max(0,PT-(Date.now()-qT)/1000);$('#tfill').style.width=(left/PT*100)+'%';
    $('#tfill').parentElement.classList.toggle('low',left<4);
    if(left<=0){locked=true;record(q.a,q.b,false);$('#eq').innerHTML=eqHTML(q.a,q.b,D(q.a*q.b),'big');hurt(`انتهى الوقت! ${D(q.a)} × ${D(q.b)} = ${D(q.a*q.b)}`);}},100);
  onClean(()=>{clearInterval(iv);done=true;});
  lv();next();
};

SCREENS.cards=(n)=>{
  let deck;
  if(n==='weak'){deck=[];for(let a=1;a<=12;a++)for(let b=a;b<=12;b++)if(mastery(a,b)===1)deck.push({a,b});shuffle(deck);setTitle('بطاقات الحقائق الضعيفة');}
  else{deck=shuffle(ALL.map(b=>({a:n,b})));setTitle(`بطاقات جدول ${D(n)}`);}
  let i=0,know=0,again=[];const color=n==='weak'?'var(--bad)':COLORS[n];
  view.innerHTML=`<div style="--c:${color}"><div class="gstat"><span id="cp"></span><span>✅ <span id="ck">${D(0)}</span></span></div>
    <div class="fc" id="fc"><div class="fcin"><div class="fcf" id="ff"></div><div class="fcb" id="fb2"></div></div></div>
    <p class="muted" style="text-align:center;font-size:14px">اضغط على البطاقة لتقلبها</p>
    <div class="tfbtns"><button class="btn ok" id="kn">✔ عرفتها</button><button class="btn bad" id="ag">↻ أعدها لي</button></div></div>`;
  function show(){if(i>=deck.length){if(again.length){deck=deck.concat(shuffle(again));again=[];}else{addCoins(3);return result({title:'أنهيت البطاقات! 🃏',score:`${D(know)}`,lines:['عرفت كل البطاقات في النهاية 💪',`+${D(3)} عملات`]});}}
    const c=deck[i];$('#fc').classList.remove('flip');$('#cp').textContent=`${D(i+1)} / ${D(deck.length)}`;
    $('#ff').innerHTML=`<div>${D(c.a)} × ${D(c.b)}<small>ما الناتج؟</small></div>`;
    setTimeout(()=>{$('#fb2').innerHTML=`<div>${D(c.a*c.b)}<small>${D(c.a)} × ${D(c.b)}</small></div>`;},200);}
  $('#fc').onclick=()=>{sfx.flip();$('#fc').classList.toggle('flip');};
  $('#kn').onclick=()=>{const c=deck[i];record(c.a,c.b,true,0);know++;$('#ck').textContent=D(know);sfx.ok();i++;show();};
  $('#ag').onclick=()=>{const c=deck[i];record(c.a,c.b,false);again.push(c);sfx.flip();i++;show();};
  keyHandler=e=>{if(e.key===' '){e.preventDefault();$('#fc').click();}};
  show();
};

    <div id="cf" hidden style="margin-top:12px"><p style="font-weight:800;margin-bottom:8px">هل أنت متأكد؟ لا يمكن التراجع.</p><div class="row"><button class="btn bad sm" id="yes">نعم، امسح كل شيء</button><button class="btn ghost sm" id="no">إلغاء</button></div></div></div>`;
  $$('.avb').forEach(b=>b.onclick=()=>{sfx.tap();S.avatar=b.dataset.a;save();$$('.avb').forEach(x=>x.classList.toggle('on',x===b));});
  $$('[data-d]').forEach(b=>b.onclick=()=>{S.digits=b.dataset.d;save();rerender();});
  $$('[data-s]').forEach(b=>b.onclick=()=>{S.sound=b.dataset.s==='1';save();rerender();});

};
