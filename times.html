<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="apple-touch-icon" sizes="180x180" href="https://kprpwd2wgn-ops.github.io/Rakan/times-icon-v2.png">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="https://kprpwd2wgn-ops.github.io/Rakan/times-icon-v2.png">
<link rel="icon" type="image/png" sizes="32x32" href="https://kprpwd2wgn-ops.github.io/Rakan/times-icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="https://kprpwd2wgn-ops.github.io/Rakan/times-icon-192.png">

<style>/* Layout: one centered chalkboard column; a wooden ledge header; chalk-drawn tiles in grids. Single committed look: a school chalkboard. */
:root{
  --board:#1d4a39; --board-2:#163b2d; --board-3:#245a46;
  --chalk:#f6f3e9; --chalk-2:#c3d5c8; --line:rgba(246,243,233,.2);
  --wood:#b97a42; --wood-2:#8a5526;
  --sun:#ffd95a; --ok:#8fe388; --bad:#ff7d72; --ink:#10281f;
  --f-display:"Lalezar","Baloo Bhaijaan 2",Tahoma,"Segoe UI",sans-serif;
  --f-body:"Baloo Bhaijaan 2",Tahoma,"Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--board)}
body{
  margin:0;direction:rtl;background:var(--board);color:var(--chalk);
  font-family:var(--f-body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 32px;
  background-image:
    radial-gradient(ellipse 60% 40% at 15% 10%,rgba(255,255,255,.05),transparent 70%),
    radial-gradient(ellipse 50% 35% at 90% 60%,rgba(255,255,255,.04),transparent 70%),
    radial-gradient(ellipse 70% 30% at 40% 95%,rgba(255,255,255,.035),transparent 70%);
  background-attachment:fixed;
  min-height:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--wood-2)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.25}
p{margin:0}
.wrap{max-width:760px;margin:0 auto}
[hidden]{display:none!important}

/* ===== header: wooden chalk ledge ===== */
.hdr{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:9;
  margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 18px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,var(--wood) 0%,var(--wood-2) 100%);
  box-shadow:0 4px 0 rgba(0,0,0,.25);
}
.hdr-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.hdr .back{width:44px;height:44px;border-radius:14px;background:rgba(0,0,0,.18);display:grid;place-items:center;flex:none}
.hdr .back svg{width:22px;height:22px}
.hdr .ttl{flex:1;min-width:0;font-family:var(--f-display);font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff8e6;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.hud{display:flex;gap:6px;flex:none}
.pill{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.25);font-weight:800;font-size:15px;white-space:nowrap}
.pill b{color:var(--sun)}

/* ===== common ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:52px;padding:8px 22px;border-radius:16px 13px 17px 12px;
  background:var(--sun);color:var(--ink);font-weight:800;font-size:18px;
  box-shadow:0 5px 0 #b8901e;transition:transform .08s, box-shadow .08s;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b8901e}
.btn.ghost{background:transparent;color:var(--chalk);border:2.5px solid var(--line);box-shadow:none}
.btn.ghost:active{transform:translateY(2px)}
.btn.sm{min-height:40px;font-size:15px;padding:4px 14px}
.btn.wide{width:100%}
.btn.ok{background:var(--ok);box-shadow:0 5px 0 #4f9f49}
.btn.bad{background:var(--bad);box-shadow:0 5px 0 #b44c43}
.sec{font-size:24px;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 10px,transparent 10px 16px)}
.muted{color:var(--chalk-2)}
.card{background:rgba(0,0,0,.16);border:2px solid var(--line);border-radius:20px 16px 22px 14px;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stars{letter-spacing:2px;color:var(--sun);font-size:18px;line-height:1}
.stars .off{color:rgba(255,255,255,.22)}

/* ===== home ===== */
.hello{display:flex;gap:14px;align-items:center}
.av{font-size:46px;width:76px;height:76px;flex:none;display:grid;place-items:center;border-radius:50%;background:rgba(0,0,0,.2);border:3px dashed var(--sun)}
.hello h1{font-size:30px}
.hello .lvl{font-weight:800;color:var(--sun)}
.bar{height:12px;border-radius:99px;background:rgba(0,0,0,.3);overflow:hidden;margin:6px 0 2px;border:1.5px solid var(--line)}
.bar i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .6s}
.sub{font-size:14px;color:var(--chalk-2)}
.suggest{margin-top:18px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:rgba(255,217,90,.1);border:2.5px dashed var(--sun);border-radius:18px;padding:12px 16px}
.suggest p{font-weight:600;min-width:0;flex:1 1 200px}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:10px 6px 12px;border:2.5px solid var(--c);border-radius:20px 14px 22px 13px;
  background:color-mix(in srgb,var(--c) 9%,transparent);transition:transform .15s;
}
.tile:hover{transform:rotate(-1.5deg) scale(1.03)}
.tile:active{transform:scale(.96)}
.tile .tn{font-family:var(--f-display);font-size:46px;line-height:1.1;color:var(--c);text-shadow:0 3px 0 rgba(0,0,0,.25)}
.tile .tl{font-size:13px;color:var(--chalk-2);font-weight:600}
.tile .stars{font-size:15px}
.tile .mb{width:80%;height:6px;border-radius:9px;background:rgba(0,0,0,.3);overflow:hidden;margin-top:4px}
.tile .mb i{display:block;height:100%;background:var(--c)}
.tile .crown{position:absolute;top:4px;left:6px;font-size:16px}

.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:640px){.modes{grid-template-columns:repeat(3,1fr)}}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:start;padding:16px;
  border-radius:20px 15px 22px 14px;background:rgba(0,0,0,.18);border:2.5px solid var(--line);transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-3px);border-color:var(--sun)}
.mode .mi{font-size:34px;line-height:1}
.mode h3{font-size:21px}
.mode p{font-size:14px;color:var(--chalk-2);line-height:1.45}

/* ===== table screen ===== */
.thead{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.bignum{font-family:var(--f-display);font-size:78px;line-height:1;color:var(--c);text-shadow:0 5px 0 rgba(0,0,0,.25);min-width:84px;text-align:center}
.thead h1{font-size:28px;color:var(--c)}
.tabs{display:flex;gap:6px;background:rgba(0,0,0,.22);padding:5px;border-radius:16px;margin-bottom:16px}
.tab{flex:1;min-height:46px;border-radius:12px;font-weight:800;font-size:16px;color:var(--chalk-2)}
.tab.on{background:var(--c);color:var(--ink)}
.trows{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (max-width:420px){.trows{grid-template-columns:1fr}}
.trow{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-radius:14px;border:2px solid var(--line);
  font-family:var(--f-display);font-size:24px;background:rgba(0,0,0,.12);direction:rtl}
.trow.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.trow .p{color:var(--c);min-width:2.4em;text-align:center;border-radius:10px;transition:background .2s}
.trow .p.hid{background:rgba(255,255,255,.12);color:transparent}
.trow .tag{font-family:var(--f-body);font-size:11px;font-weight:800;background:var(--c);color:var(--ink);border-radius:8px;padding:0 6px;margin-inline-start:6px;vertical-align:middle}
.dotsbox{margin-top:14px}
.dots{display:grid;gap:5px;justify-content:center;margin:12px 0;direction:ltr}
.dots i{width:clamp(12px,4.2vw,20px);aspect-ratio:1;border-radius:50%;background:var(--c);box-shadow:0 2px 0 rgba(0,0,0,.3);animation:popin .3s backwards}
@keyframes popin{from{transform:scale(0)}}
.cap{text-align:center;font-weight:600}
.cap b{color:var(--c);font-family:var(--f-display);font-size:22px;font-weight:400}
.jumps{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px;direction:rtl}
.jumps span{min-width:46px;text-align:center;padding:4px 6px;border-radius:12px;border:2px dashed var(--line);font-family:var(--f-display);font-size:20px;color:var(--chalk-2);transition:all .2s}
.jumps span.lit{border-style:solid;border-color:var(--c);background:var(--c);color:var(--ink);transform:translateY(-4px) scale(1.08)}

.secret{border-inline-start:6px solid var(--c);padding:14px 16px;border-radius:16px;background:rgba(0,0,0,.18);margin-bottom:12px}
.secret h3{font-size:21px;color:var(--c);margin-bottom:4px}
.secret .ex{margin-top:8px;padding:6px 12px;background:rgba(0,0,0,.22);border-radius:10px;font-weight:800;display:inline-block;font-size:18px}
.nick{display:inline-block;background:var(--c);color:var(--ink);border-radius:10px;padding:2px 12px;font-weight:800;margin-bottom:12px}
.didyou{border:2.5px dashed var(--c);border-radius:18px;padding:14px 16px;margin-top:6px}
.didyou h3{font-size:19px;margin-bottom:4px}

/* fingers */
.hands{display:flex;justify-content:center;gap:4px;align-items:flex-end;direction:ltr;margin:14px 0 6px;height:120px}
.finger{width:clamp(22px,7vw,34px);height:100px;border-radius:16px 16px 8px 8px;background:#f3c9a0;border:2.5px solid #8a5526;display:flex;align-items:flex-end;justify-content:center;font-weight:800;color:#5b3412;font-size:14px;padding-bottom:4px;transition:height .25s,background .25s}
.finger:nth-child(5){margin-right:14px}
.finger:nth-child(1),.finger:nth-child(10){height:72px}
.finger:nth-child(2),.finger:nth-child(9){height:92px}
.finger:nth-child(5),.finger:nth-child(6){height:64px}
.finger.down{height:30px!important;background:var(--bad)}
.handres{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;font-weight:600}
.handres b{font-family:var(--f-display);font-size:24px;color:var(--c);font-weight:400}

.acts{display:grid;gap:10px}
.act{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:18px 14px 20px 13px;background:rgba(0,0,0,.18);border:2.5px solid var(--line);text-align:start;transition:border-color .15s,transform .15s}
.act:hover{border-color:var(--c,var(--sun));transform:translateX(-3px)}
.act .ai{font-size:34px;flex:none;width:48px;text-align:center}
.act h3{font-size:20px}
.act p{font-size:14px;color:var(--chalk-2)}
.act .best{margin-inline-start:auto;flex:none;font-size:13px;font-weight:800;color:var(--sun);text-align:center}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-width:44px;height:44px;border-radius:12px;border:2.5px solid var(--c,var(--line));font-family:var(--f-display);font-size:20px;color:var(--c,var(--chalk));opacity:.45}
.chip.on{opacity:1;background:color-mix(in srgb,var(--c) 22%,transparent)}
.chip.txt{font-family:var(--f-body);font-size:14px;font-weight:800;padding:0 12px;opacity:1;--c:var(--chalk-2)}

/* ===== quiz ===== */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;font-weight:800}
.qlives{font-size:20px;letter-spacing:2px}
.tbar{height:10px;border-radius:99px;background:rgba(0,0,0,.3);overflow:hidden;margin-bottom:12px}
.tbar i{display:block;height:100%;background:var(--c);width:100%;transition:width .1s linear}
.tbar.low i{background:var(--bad)}
.eqcard{text-align:center;padding:18px 10px 12px;border-radius:24px 18px 26px 16px;border:3px solid var(--c);background:rgba(0,0,0,.18);position:relative}
.eq{display:flex;justify-content:center;align-items:center;gap:.3em;direction:rtl;font-family:var(--f-display);line-height:1.2}
.eq.big{font-size:clamp(46px,14vw,74px)}
.eq .op{color:var(--chalk-2);font-size:.7em}
.eq .ans{min-width:1.7em;border-bottom:4px dashed var(--c);color:var(--c)}
.eq .ans.empty{color:rgba(255,255,255,.3)}
.fb{min-height:30px;font-weight:800;font-size:18px}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.eqcard.ok{animation:okglow .5s}
.eqcard.bad{animation:shake .45s}
@keyframes okglow{40%{background:rgba(143,227,136,.25);transform:scale(1.03)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.hintrow{display:flex;justify-content:center;margin:10px 0 0}
.hintbox{margin-top:10px;padding:10px 14px;border-radius:14px;background:rgba(255,217,90,.12);border:2px dashed var(--sun);text-align:center;font-weight:600}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px auto 0;max-width:380px}
.k{height:62px;border-radius:16px;background:rgba(255,255,255,.08);border:2px solid var(--line);font-family:var(--f-display);font-size:30px;box-shadow:0 4px 0 rgba(0,0,0,.3);transition:transform .06s}
.k:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.k.go{background:var(--ok);color:var(--ink);border-color:var(--ok)}
.k.del{font-size:24px}

/* ===== result overlay ===== */
.ov{position:fixed;inset:0;z-index:50;background:rgba(8,22,16,.72);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  animation:fade .25s}
@keyframes fade{from{opacity:0}}
.res{width:min(420px,100%);background:var(--board-3);border:4px solid var(--wood);border-radius:28px 22px 30px 20px;padding:24px 20px;text-align:center;
  box-shadow:0 10px 0 var(--wood-2),0 20px 40px rgba(0,0,0,.4);animation:bounce .5s}
@keyframes bounce{0%{transform:scale(.6)}60%{transform:scale(1.05)}}
.res h2{font-size:30px;color:var(--sun)}
.res .bigs{font-size:46px;letter-spacing:6px;margin:6px 0}
.res .bigs span{display:inline-block;animation:starin .5s backwards}
.res .bigs span:nth-child(2){animation-delay:.25s}.res .bigs span:nth-child(3){animation-delay:.5s}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}}
.res .score{font-family:var(--f-display);font-size:60px;line-height:1.1;color:var(--chalk)}
.res ul{list-style:none;padding:0;margin:8px 0 16px;display:grid;gap:4px;font-weight:600}
.res .btns{display:grid;gap:10px}

/* toast */
.toasts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;z-index:60;display:grid;justify-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--sun);color:var(--ink);font-weight:800;padding:10px 18px;border-radius:16px;box-shadow:0 6px 0 #b8901e;animation:toastin .35s;max-width:100%}
@keyframes toastin{from{transform:translateY(30px);opacity:0}}

/* ===== balloon game ===== */
.sky{position:relative;height:min(62vh,520px);border-radius:24px 18px 26px 16px;overflow:hidden;border:3px solid var(--line);
  background:linear-gradient(180deg,#2c6b8f 0%,#3f8db0 55%,#7cc1c9 100%)}
.sky .cloud{position:absolute;background:rgba(255,255,255,.7);border-radius:99px;filter:blur(1px)}
.qbubble{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:3;background:var(--chalk);color:var(--ink);border-radius:18px;padding:4px 18px;font-family:var(--f-display);font-size:34px;box-shadow:0 5px 0 rgba(0,0,0,.25);white-space:nowrap}
.balloon{position:absolute;bottom:-120px;width:78px;height:96px;margin-left:-39px;z-index:2;
  border-radius:50% 50% 48% 52% / 58% 58% 42% 42%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.65) 0 10%,transparent 26%),var(--c);
  box-shadow:inset -8px -10px 0 rgba(0,0,0,.12);font-family:var(--f-display);font-size:30px;color:var(--ink);
  animation:rise var(--dur) linear forwards, sway 1.6s ease-in-out infinite alternate}
.balloon::after{content:"";position:absolute;top:100%;left:50%;width:2px;height:46px;background:rgba(255,255,255,.7)}
.balloon::before{content:"";position:absolute;top:calc(100% - 4px);left:calc(50% - 6px);border:6px solid transparent;border-bottom-color:var(--c)}
@keyframes rise{from{bottom:-120px}to{bottom:110%}}
@keyframes sway{from{margin-left:-46px}to{margin-left:-32px}}
.balloon.popped{animation:popb .25s forwards;pointer-events:none}
@keyframes popb{to{transform:scale(1.7);opacity:0}}
.balloon.wrong{animation:popb .3s forwards;background:var(--bad)}
.gstat{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800;gap:10px}
.gstat .big{font-family:var(--f-display);font-size:28px;color:var(--sun);font-weight:400}

/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;perspective:800px}
@media (max-width:420px){.mem{grid-template-columns:repeat(3,1fr)}}
.mcard{aspect-ratio:3/4;max-width:100%;position:relative;transform-style:preserve-3d;transition:transform .45s}
.mcard.flip,.mcard.done{transform:rotateY(180deg)}
.mcard .f,.mcard .bk{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mcard .bk{background:repeating-linear-gradient(45deg,var(--wood) 0 10px,var(--wood-2) 10px 20px);border:3px solid #6a3f1a;font-family:var(--f-display);font-size:34px;color:#ffe9c7}
.mcard .f{transform:rotateY(180deg);background:var(--chalk);color:var(--ink);font-family:var(--f-display);font-size:clamp(22px,6vw,32px);border:4px solid var(--c);direction:rtl}
.mcard.done .f{background:var(--c)}

/* true false */
.tfbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.tfbtns .btn{min-height:84px;font-size:26px}

/* missing */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opt{min-height:74px;border-radius:18px;border:3px solid var(--line);background:rgba(255,255,255,.07);font-family:var(--f-display);font-size:36px;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.opt.ok{background:var(--ok);color:var(--ink);border-color:var(--ok)}
.opt.bad{background:var(--bad);color:var(--ink);border-color:var(--bad)}

/* boss */
.arena{position:relative;text-align:center;padding:10px 10px 6px;border-radius:24px 18px 26px 16px;background:radial-gradient(ellipse at 50% 90%,rgba(0,0,0,.35),transparent 60%),rgba(0,0,0,.15);border:3px solid var(--c)}
.mon{width:min(190px,48vw);height:auto;display:block;margin:0 auto;animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.04,.97) translateY(3px)}}
.mon.hit{animation:hit .45s}
@keyframes hit{20%{transform:translateX(-14px) rotate(-8deg);filter:brightness(2.2)}50%{transform:translateX(12px) rotate(6deg)}}
.mon.dead{animation:die .9s forwards}

.mname{font-family:var(--f-display);font-size:24px;color:var(--c)}
.hp{height:16px;border-radius:99px;background:rgba(0,0,0,.35);overflow:hidden;border:2px solid var(--line);max-width:300px;margin:6px auto}
.hp i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),#ffb36b);transition:width .35s}
.dmg{position:absolute;top:30%;left:50%;font-family:var(--f-display);font-size:42px;color:var(--sun);animation:dmg .8s forwards;pointer-events:none;text-shadow:0 3px 0 rgba(0,0,0,.4)}
@keyframes dmg{to{transform:translateY(-60px);opacity:0}}
.flash{animation:redflash .5s}
@keyframes redflash{30%{box-shadow:inset 0 0 0 200px rgba(255,80,70,.35)}}
.bossgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:600px){.bossgrid{grid-template-columns:repeat(4,1fr)}}
.bosscard{border:2.5px solid var(--c);border-radius:18px;padding:8px 4px 10px;background:rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center}
.bosscard svg{width:84%;height:auto}
.bosscard .bn{font-family:var(--f-display);font-size:16px;color:var(--c);line-height:1.2;text-align:center}
.bosscard .bs{font-size:12px;font-weight:800;color:var(--chalk-2)}
.bosscard.won{background:color-mix(in srgb,var(--c) 15%,transparent)}

/* grid */
.gridwrap{overflow-x:auto;border-radius:16px;border:2px solid var(--line);background:rgba(0,0,0,.15)}
.mgrid{border-collapse:separate;border-spacing:2px;margin:0 auto;direction:rtl;font-variant-numeric:tabular-nums}
.mgrid th,.mgrid td{width:clamp(24px,7vw,48px);height:clamp(24px,7vw,42px);text-align:center;font-size:clamp(10px,2.8vw,15px);font-weight:800;border-radius:6px;padding:0}
.mgrid th{font-family:var(--f-display);font-weight:400;font-size:clamp(13px,3.6vw,20px);color:var(--c)}
.mgrid td{background:rgba(255,255,255,.05);color:var(--chalk-2);cursor:pointer}
.mgrid td.m1{background:rgba(255,125,114,.45);color:#fff}
.mgrid td.m2{background:rgba(255,217,90,.4);color:#fff}
.mgrid td.m3{background:rgba(143,227,136,.6);color:var(--ink)}
.mgrid td.hl{outline:2px solid var(--sun)}
.mgrid td.sel{background:var(--sun);color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;font-weight:600;margin:10px 0}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:middle;margin-inline-end:4px}
.gridinfo{min-height:52px;text-align:center;font-family:var(--f-display);font-size:28px;margin-top:10px}

/* flash cards */
.fc{perspective:900px;max-width:340px;margin:10px auto}
.fcin{position:relative;aspect-ratio:4/3;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .fcin{transform:rotateY(180deg)}
.fcf,.fcb{position:absolute;inset:0;border-radius:24px 18px 26px 16px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-family:var(--f-display);font-size:clamp(46px,14vw,64px);border:4px solid var(--c)}
.fcf{background:rgba(0,0,0,.2)}
.fcb{background:var(--c);color:var(--ink);transform:rotateY(180deg)}
.fcf small,.fcb small{display:block;font-family:var(--f-body);font-size:14px;font-weight:800;opacity:.75;text-align:center}

/* badges / stats */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:600px){.badges{grid-template-columns:repeat(4,1fr)}}
.badge{text-align:center;padding:12px 6px;border-radius:18px;border:2.5px dashed var(--line);display:flex;flex-direction:column;align-items:center;gap:2px}
.badge .bi{font-size:36px;filter:grayscale(1);opacity:.35}
.badge h3{font-size:16px}
.badge p{font-size:12px;color:var(--chalk-2);line-height:1.35}
.badge.got{border-style:solid;border-color:var(--sun);background:rgba(255,217,90,.1)}
.badge.got .bi{filter:none;opacity:1}
.statg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:600px){.statg{grid-template-columns:repeat(3,1fr)}}
.stat{padding:12px;border-radius:16px;background:rgba(0,0,0,.18);border:2px solid var(--line)}
.stat b{display:block;font-family:var(--f-display);font-size:30px;font-weight:400;color:var(--sun);line-height:1.2}
.stat span{font-size:13px;color:var(--chalk-2);font-weight:600}

/* settings */
.field{display:grid;gap:6px;margin-bottom:16px}
.field label{font-weight:800}
.inp{min-height:50px;border-radius:14px;border:2.5px solid var(--line);background:rgba(0,0,0,.2);color:var(--chalk);font:inherit;font-size:18px;padding:6px 14px;width:100%}
.avs{display:flex;flex-wrap:wrap;gap:8px}
.avb{width:54px;height:54px;font-size:30px;border-radius:50%;border:3px solid transparent;background:rgba(0,0,0,.2)}
.avb.on{border-color:var(--sun);background:rgba(255,217,90,.15)}
.seg{display:inline-flex;background:rgba(0,0,0,.25);border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:42px;padding:0 16px;border-radius:10px;font-weight:800}
.seg button.on{background:var(--sun);color:var(--ink)}
.welcome{text-align:center;padding-top:20px}
.welcome .logo{width:110px;height:110px;border-radius:26px;margin:0 auto 12px;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.welcome h1{font-size:38px;color:var(--sun)}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
@media (prefers-reduced-motion:reduce){
  .mon,.tile:hover,.dots i{animation:none!important}
  .tile:hover{transform:none}
}

/* ===== question styles ===== */
.qcard{text-align:center;padding:14px 12px 10px;border-radius:24px 18px 26px 16px;border:3px solid var(--kc,var(--c));background:rgba(0,0,0,.18);position:relative}
.qcard.ok{animation:okglow .5s}.qcard.bad{animation:shake .45s}
.qkind{display:inline-flex;align-items:center;gap:6px;padding:3px 14px;border-radius:99px;background:var(--kc,var(--c));color:var(--ink);font-weight:800;font-size:15px;margin-bottom:8px;animation:kindin .45s}
@keyframes kindin{from{transform:scale(.7) rotate(-6deg)}}
.k-mul{--kc:#FFE27A}.k-missR,.k-missL,.k-missC{--kc:#8FE3FF}.k-pick{--kc:#FF9EC7}.k-tf{--kc:#B8F28C}.k-pic{--kc:#FFB86B}.k-arr{--kc:#A6C8FF}
.k-story{--kc:#C9A8FF}.k-seq{--kc:#7FF0D0}.k-cmp{--kc:#FF8A80}.k-which{--kc:#F2F27E}.k-odd{--kc:#FFD1A6}.k-dbl{--kc:#FFA8E8}.k-clock{--kc:#8FE3FF}
.qtext{font-weight:700;font-size:18px;margin-bottom:6px;text-wrap:balance}
.qtext.big{font-size:24px;font-family:var(--f-display);font-weight:400}
.abox{display:flex;justify-content:center;margin-top:8px}
.abox .ans{font-family:var(--f-display);font-size:44px;min-width:2.2em;padding:0 10px;border-radius:14px;border:3px dashed var(--kc,var(--c));color:var(--kc,var(--c));line-height:1.2}
.ans.good{color:var(--ok)!important;border-color:var(--ok)!important}
.ans.fix{color:var(--sun)!important}
.grps{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0}
.grp{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;border-radius:16px;background:rgba(255,255,255,.08);border:2px solid var(--line);max-width:120px}
.gbox{font-size:24px;line-height:1}
.gits{font-size:18px;line-height:1.25;letter-spacing:1px;word-break:break-all;max-width:96px}
.dgrid{display:grid;gap:5px;justify-content:center;margin:8px 0;direction:ltr}
.dgrid i{width:clamp(12px,4vw,18px);aspect-ratio:1;border-radius:50%;background:var(--kc);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.story{display:flex;gap:12px;align-items:center;text-align:start;background:rgba(255,255,255,.06);border-radius:16px;padding:10px 12px}
.story .semoji{font-size:44px;flex:none;line-height:1}
.story p{font-size:19px;font-weight:700;line-height:1.55}
.story small{font-size:14px;color:var(--chalk-2);font-weight:600}
.hops{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;direction:ltr;font-size:30px;margin:6px 0}
.hop{font-family:var(--f-display);font-size:26px;min-width:52px;padding:2px 8px;border-radius:12px;background:rgba(255,255,255,.08);border:2px solid var(--line)}

.nextbtn{margin-top:12px}
.combo{height:0;overflow:hidden;text-align:center;font-weight:800;color:var(--sun);transition:height .2s}

button.suggest{width:100%;color:inherit;font:inherit;text-align:start;cursor:pointer;margin:14px 0 0}

/* moles */
.moles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px;margin:0 auto}
.hole{position:relative;aspect-ratio:1/.9;max-width:100%;overflow:hidden;border-radius:0 0 50% 50% / 0 0 34% 34%}
.hole::after{content:"";position:absolute;left:4%;right:4%;bottom:0;height:30%;border-radius:50%;background:radial-gradient(ellipse at 50% 30%,#2a1a0d 0 55%,#5b3a1d 56% 100%);z-index:2;pointer-events:none}

.mole.up{transform:translateY(0)}
.msign{position:absolute;top:2%;left:50%;transform:translateX(-50%);background:var(--chalk);color:var(--ink);font-family:var(--f-display);font-size:clamp(18px,6vw,26px);padding:0 10px;border-radius:10px;border:3px solid #4a2e17;line-height:1.3;min-width:2.2em}

.maze{display:grid;gap:6px;direction:ltr;max-width:420px;margin:0 auto}

.bc{aspect-ratio:1;max-width:100%;border-radius:16px;background:var(--chalk);color:var(--ink);font-family:var(--f-display);font-size:clamp(22px,7vw,32px);box-shadow:0 4px 0 rgba(0,0,0,.35);position:relative}
.bc.mark{background:#d8f5d2}
.bc.mark::after{content:"";position:absolute;inset:14%;border-radius:50%;border:5px solid rgba(229,72,77,.75)}
.bc.win{background:var(--sun);animation:kindin .5s}
.bc.no{animation:shake .4s}
.bc.glow{animation:glow 1.2s 3}

.track{position:relative;background:#3d4451;border-radius:20px;padding:10px 0;margin-bottom:12px;border:4px solid #2b303a;overflow:hidden}
.lane{position:relative;height:52px;border-bottom:3px dashed rgba(255,255,255,.35)}
.lane:last-of-type{border-bottom:0}

.car{position:absolute;left:0;top:50%;transform:translateY(-50%);width:64px;transition:left .45s ease-out;margin-left:6px}
.car svg{width:100%;height:auto;display:block}
.finish{position:absolute;top:0;bottom:0;right:4px;width:14px;background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/14px 14px}

/* area */
.agrid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;direction:ltr;max-width:400px;margin:0 auto;touch-action:manipulation}
.ac{aspect-ratio:1;max-width:100%;border-radius:5px;background:rgba(255,255,255,.08);border:1.5px solid var(--line)}

.ainfo{text-align:center;font-family:var(--f-display);font-size:24px;min-height:40px;margin-top:10px}

/* catcher */
.catchcv{display:block;width:100%;border-radius:22px;touch-action:none;border:3px solid var(--line);background:#2c6b8f}
</style>

function hintFor(a,b){
  // يختار أسهل استراتيجية لهذا السؤال
  const t=[a,b];
  const has=n=>t.includes(n);
  const other=n=>a===n?b:a;
  if(has(1)) return `أي عدد × 1 = نفسه`;
  if(has(10)){const o=other(10);return `ضع صفراً بجانب ${o}`;}
  if(has(2)){const o=other(2);return `${o} + ${o} = ؟`;}
  if(has(11)&&other(11)<=9){const o=other(11);return `اكتب ${o} مرتين`;}
  if(has(5)){const o=other(5);return o%2===0?`نصف ${o} ثم ضع صفراً`:`${o} − 1 = ${o-1}، نصفه ${(o-1)/2}، ثم ضع 5`;}
  if(has(9)){const o=other(9);return `(10 × ${o}) − ${o} = ${10*o} − ${o}`;}
  if(has(4)){const o=other(4);return `ضاعف ${o} مرتين: ${o} ← ${o*2} ← ؟`;}
  if(has(3)){const o=other(3);return `(2 × ${o}) + ${o} = ${2*o} + ${o}`;}
  if(has(11)){const o=other(11);return `(10 × ${o}) + ${o} = ${10*o} + ${o}`;}
  if(has(12)){const o=other(12);return `(10 × ${o}) + (2 × ${o}) = ${10*o} + ${2*o}`;}
  if(has(6)){const o=other(6);return `(5 × ${o}) + ${o} = ${5*o} + ${o}`;}
  if(has(8)){const o=other(8);return `ضاعف ${o} ثلاث مرات: ${o} ← ${2*o} ← ${4*o} ← ؟`;}
  if(has(7)){const o=other(7);return `(5 × ${o}) + (2 × ${o}) = ${5*o} + ${2*o}`;}
  return `${a} × ${b} = ${b} × ${a}`;
}

/* قصاصات الاحتفال */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const P=[...Array(140)].map(()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.3,col:COLORS[1+Math.floor(Math.random()*12)]}));
  let t=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.col;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});

function bindKeypad(root,{onChange,onSubmit,max=3}){
  let v='';
  const press=k=>{
    if(k==='del'){v=v.slice(0,-1);}
    else if(k==='ok'){if(v!=='')onSubmit(+v);return;}
    else if(v.length<max){v=(v==='0'?'':v)+k;}
    sfx.tap();onChange(v);
  };
  $$('.k',root).forEach(b=>b.addEventListener('click',()=>press(b.dataset.k)));

    if(e.target&&e.target.tagName==='INPUT')return;
    const ch=e.key;const n=/[0-9]/.test(ch)?ch:(AR.indexOf(ch)>=0?String(AR.indexOf(ch)):null);
    if(n!==null&&ch.length===1){press(n);e.preventDefault();}
    else if(ch==='Backspace'){press('del');e.preventDefault();}
    else if(ch==='Enter'){press('ok');e.preventDefault();}
  };
  return{reset(){v='';onChange(v);},get value(){return v;}};
}

function distract(a,b,n=3){
  const p=a*b,set=new Set();
  const c=shuffle([p+a,p-a,p+b,p-b,p+1,p-1,p+10,p-10,(a+1)*(b-1),(a-1)*(b+1),+String(p).split('').reverse().join('')]);
  for(const x of c){if(x>0&&x!==p&&!set.has(x))set.add(x);if(set.size>=n)break;}
  while(set.size<n){const x=p+rint(-12,12);if(x>0&&x!==p)set.add(x);}
  return[...set];
}
function distractQ(b){const set=new Set();while(set.size<3){const x=rint(Math.max(1,b-3),b+3);if(x!==b&&x<=12)set.add(x);if(set.size<3&&Math.random()<.2)set.add(rint(1,12));set.delete(b);}return[...set].slice(0,3);}
function randFact(tables=S.tables,minB=1){const a=pick(tables),b=rint(minB,12);return Math.random()<.5?{a,b}:{a:b,b:a};}
function seeded(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
  return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return(h>>>0)/4294967296;};}

function FactBag(o={}){
  const rnd=o.rnd||Math.random;let bag=[],recent=[],uniq=1;
  const fill=()=>{let list=[];
    if(o.facts)list=o.facts.map(f=>({a:f.a,b:f.b}));
    else{const T=o.single?[o.single]:(o.tables||S.tables);T.forEach(a=>{for(let b=o.minB||1;b<=(o.maxB||12);b++){list.push({a,b});if(!o.single&&mastery(a,b)===1)list.push({a,b});}});}
    uniq=new Set(list.map(f=>fk(f.a,f.b))).size;
    for(let i=list.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[list[i],list[j]]=[list[j],list[i]];}bag=list;};
  return{next(){for(let t=0;t<80;t++){if(!bag.length)fill();const f=bag.pop();const k=fk(f.a,f.b);
      if(recent.includes(k)&&t<60)continue;recent.push(k);while(recent.length>Math.max(1,Math.min(10,Math.floor(uniq*.6))))recent.shift();
      if(o.facts)return f;const sw=o.single?rnd()<.3:rnd()<.5;return sw?{a:f.b,b:f.a}:f;}
    return{a:2,b:2};}};
}

  const rnd=o.rnd||Math.random,bag=FactBag(o),kinds=Array.isArray(o.kinds)?o.kinds:KIND_SETS[o.kinds||'all'];let last=[];
  return{next(){const f=bag.next();
    for(let t=0;t<40;t++){const pool=kinds.filter(k=>!last.includes(KINDS[k].label));const k=wpick(pool.length?pool:kinds,rnd);const q=makeQ(k,f,rnd,o);
      if(q){last.push(KINDS[k].label);while(last.length>Math.min(3,kinds.length-1))last.shift();return q;}}
    return makeQ('mul',f,rnd,o);}};
}

   ${hand(h,24,6,'#10281f')}${hand(ang,40,4,'#e5484d')}<circle cx="60" cy="60" r="5" fill="#10281f"/></svg>`;}

function makeQ(kind,f,rnd=Math.random,o={}){
  let {a,b}=f;const p=a*b,K=KINDS[kind];
  const base={kind,icon:K.icon,label:K.label,a,b,rec:true,hint:hintFor(a,b),explain:`${exprTxt(a,b)} = ${D(p)}`};
  switch(kind){
   case 'mul':return{...base,input:'pad',answer:p,html:eqRow([D(a),'×',D(b),'=',SLOT]),say:`${a} ضرب ${b}`};
   case 'missR':return{...base,input:'pad',answer:b,html:`<p class="qtext">أي عدد يكمل الضرب؟</p>`+eqRow([D(a),'×',SLOT,'=',D(p)])};
   case 'missL':return{...base,input:'pad',answer:a,html:`<p class="qtext">أي عدد يكمل الضرب؟</p>`+eqRow([SLOT,'×',D(b),'=',D(p)])};
   case 'missC':{const set=new Set([b]);while(set.size<3){const x=rI(rnd,Math.max(1,b-3),Math.min(12,b+3));if(x!==b)set.add(x);}const ch=rShuffle([...set],rnd);
     return{...base,input:'choice',answer:ch.indexOf(b),choices:ch.map(v=>D(v)),html:`<p class="qtext">أي عدد يختبئ هنا؟</p>`+eqRow([D(a),'×','<span class="ans empty">؟</span>','=',D(p)])};}
   case 'pick':{const ch=rShuffle([p,...distract(a,b,3)],rnd);return{...base,input:'choice',answer:ch.indexOf(p),choices:ch.map(v=>D(v)),html:eqRow([D(a),'×',D(b),'=','<span class="ans empty">؟</span>'])};}
   case 'tf':{const truth=rnd()<.5,s=truth?p:rP(rnd,distract(a,b,3));return{...base,input:'tf',answer:truth,html:`<p class="qtext">هل هذا صحيح؟</p>`+eqRow([D(a),'×',D(b),'=',D(s)])};}
   case 'pic':{if(a>b&&b>=3&&a<=8)[a,b]=[b,a];if(a<3||a>6||b<3||b>8)return null;const th=rP(rnd,PIC_THEMES);
     return{...base,a,b,input:'pad',answer:p,explain:`${D(a)} مجموعات × ${D(b)} = ${D(p)}`,
      html:`<p class="qtext">في كل ${th[2]} العدد نفسه. كم ${th[3]} في الكل؟ استخدم الضرب بدل العدّ!</p>
        <div class="grps">${[...Array(a)].map(()=>`<div class="grp"><span class="gbox">${th[0]}</span><div class="gits">${th[1].repeat(b)}</div></div>`).join('')}</div>${ABOX}`};}
   case 'arr':{if(a<2||b<2||a>8||b>10)return null;
     return{...base,input:'pad',answer:p,explain:`${D(a)} صفوف × ${D(b)} أعمدة = ${D(p)}`,
      html:`<p class="qtext">كم نقطة هنا؟ لا تعدّها واحدة واحدة 😉</p><div class="dgrid" style="grid-template-columns:repeat(${b},auto)">${'<i></i>'.repeat(p)}</div>${ABOX}`};}
   case 'story':{let e,t;const fx=[a,b].filter(x=>STORY_FIX[x]);
     if(fx.length&&rnd()<.55){const m=rP(rnd,fx),k=m===a?b:a;if(k<3)return null;[e,t]=STORY_FIX[m];t=t.replace('{k}',D(k)).replace('{n}',D(m));}
     else{if(a<3||b<3)return null;[e,t]=rP(rnd,STORY_GEN);t=t.replace('{a}',D(a)).replace('{b}',D(b)).replace('{name}',esc(S.name||'البطل'));}
     return{...base,input:'pad',answer:p,html:`<div class="story"><span class="semoji">${e}</span><p>${t}</p></div>${ABOX}`};}
   case 'seq':{const n=o.single&&(a===o.single||b===o.single)?o.single:(a>=2?a:b);if(n<2)return null;const k=n===a?b:a;
     const s=Math.max(1,Math.min(k-rI(rnd,1,3),8)),idx=k-s;if(idx<1||idx>4)return null;
     const terms=[0,1,2,3,4].map(j=>n*(s+j));
     return{...base,a:n,b:k,input:'pad',answer:n*k,hint:`الضفدع يقفز ${n} في كل مرة: أضف ${n} إلى العدد الذي قبله`,explain:`${D(terms[idx-1])} + ${D(n)} = ${D(n*k)}`,
      html:`<p class="qtext">الضفدع يقفز <b>${D(n)}</b> في كل مرة. ما العدد المختبئ؟</p><div class="hops">🐸${terms.map((v,j)=>j===idx?`<span class="hop slot">${SLOT}</span>`:`<span class="hop">${D(v)}</span>`).join('')}</div>`};}
   case 'cmp':{if(a<2||b<2)return null;let other=null;
     if(rnd()<.3){const eq=[];for(let x=2;x<=12;x++){if(p%x===0&&p/x<=12&&p/x>=2&&x!==a&&x!==b)eq.push({a:x,b:p/x,v:p});}if(eq.length)other=rP(rnd,eq);}
     if(!other)other=nearProducts(p,{a,b},rnd,1,10)[0];if(!other)return null;
     const L={a,b,v:p},R=other,sides=rnd()<.5?[L,R]:[R,L];const ans=sides[0].v===sides[1].v?2:sides[0].v>sides[1].v?0:1;
     return{...base,input:'choice',answer:ans,choices:[exprTxt(sides[0].a,sides[0].b),exprTxt(sides[1].a,sides[1].b),'متساويان ='],cls:'expr',
      explain:`${exprTxt(sides[0].a,sides[0].b)} = ${D(sides[0].v)} · ${exprTxt(sides[1].a,sides[1].b)} = ${D(sides[1].v)}`,html:`<p class="qtext big">أيهما أكبر؟ 🏋️</p>`};}
   case 'which':{if(a<2||b<2)return null;const w=nearProducts(p,{a,b},rnd,2,9);if(w.length<2)return null;const ch=rShuffle([{a,b,ok:1},...w],rnd);
     return{...base,input:'choice',answer:ch.findIndex(x=>x.ok),choices:ch.map(x=>exprTxt(x.a,x.b)),cls:'expr',html:`<p class="qtext">أي ضرب يساوي</p><div class="eq big"><span>${D(p)}</span><span class="op">؟</span></div>`};}
   case 'odd':{const n=o.single||(a>=2?a:b);if(n<2)return null;const ks=rShuffle([...Array(12)].map((_,i)=>i+1),rnd).slice(0,3),odd=nonMul(n,rnd);
     const ch=rShuffle([...ks.map(k=>n*k),odd],rnd);
     return{...base,a:n,b:ks[0],rec:false,input:'choice',answer:ch.indexOf(odd),choices:ch.map(v=>D(v)),hint:`أعداد جدول ${n}: ${n}، ${2*n}، ${3*n}، ${4*n}…`,
      explain:`${D(odd)} ليس في جدول ${D(n)}`,html:`<p class="qtext">ثلاثة أعداد من <b>جدول ${D(n)}</b>، وعدد واحد دخيل. أين الدخيل؟ 🕵️</p>`};}
   case 'dbl':{let e=a%2===0&&a>=4?'a':b%2===0&&b>=4?'b':null;if(!e)return null;const h=e==='a'?[a/2,b]:[a,b/2],hp=h[0]*h[1];
     return{...base,input:'pad',answer:p,hint:'الضعف يعني: اجمع العدد مع نفسه',explain:`${D(hp)} + ${D(hp)} = ${D(p)}`,
      html:`<div class="story"><span class="semoji">🪄</span><p>إذا كان ${exprTxt(h[0],h[1])} = ${D(hp)}،<br>فكم يكون ${exprTxt(a,b)}؟ <small>(عدد أكبر بالضعف!)</small></p></div>${ABOX}`};}
   case 'clock':{if(a!==5&&b!==5)return null;const k=a===5?b:a;if(k<1||k>11)return null;
     return{...base,a:5,b:k,input:'pad',answer:5*k,hint:'كل رقم على الساعة = ٥ دقائق',explain:`${exprTxt(5,k)} = ${D(5*k)} دقيقة`,
      html:`<p class="qtext">العقرب الأحمر (الدقائق) عند الرقم <b>${D(k)}</b>. كم دقيقة مرّت بعد الساعة؟</p>${clockSVG(k)}${ABOX}`};}
  }
  return null;
}

/* ---------- عرض سؤال واحد بأي نوع ---------- */
const PRAISE=['ممتاز! 🌟','رائع! 👏','أحسنت! 💪','عبقري! 🧠','صح! 🎯','بطل! 🦸','مذهل! 🚀','تمام! ✅'];
function renderQ(box,q,opt={}){
  let locked=false,hinted=false,val='';
  box.innerHTML=`<div class="qcard k-${q.kind}" id="qc"><div class="qkind">${q.icon} ${q.label}</div><div class="qbody">${q.html}</div><div class="fb" id="qfb"></div></div>
    <div class="hintbox" id="qhb" hidden></div>
    ${opt.hint?'<div class="hintrow"><button class="btn ghost sm" id="qhint">💡 تلميح</button></div>':''}
    <div id="qin"></div>`;
  const qin=$('#qin',box),fb=$('#qfb',box),qc=$('#qc',box);
  if(q.input==='pad'){qin.innerHTML=keypadHTML();
    bindKeypad(qin,{onChange:v=>{val=v;const s=$('#slot',box);if(s&&!locked){s.textContent=v===''?'؟':D(v);s.classList.toggle('empty',v==='');}},onSubmit:v=>judge(v===q.answer)});}
  else if(q.input==='choice'){qin.innerHTML=`<div class="opts ${q.cls||''} n${q.choices.length}">${q.choices.map((c,i)=>`<button class="opt" data-i="${i}">${c}</button>`).join('')}</div>`;
    $$('.opt',qin).forEach(b=>b.onclick=()=>judge(+b.dataset.i===q.answer,b));
    keyHandler=e=>{const n=+e.key||AR.indexOf(e.key);if(n>=1&&n<=q.choices.length){const b=$$('.opt',qin)[n-1];if(b)b.click();}};}
  else{qin.innerHTML=`<div class="tfbtns"><button class="btn ok" data-v="1">✔ صح</button><button class="btn bad" data-v="0">✘ خطأ</button></div>`;
    $$('[data-v]',qin).forEach(b=>b.onclick=()=>judge((b.dataset.v==='1')===q.answer,b));
    keyHandler=e=>{if(e.key==='ArrowLeft')$('[data-v="1"]',qin).click();else if(e.key==='ArrowRight')$('[data-v="0"]',qin).click();};}
  if(opt.hint)$('#qhint',box).onclick=()=>{if(locked||hinted)return;hinted=true;const h=$('#qhb',box);h.hidden=false;h.innerHTML='💡 '+D(q.hint);};
  function judge(ok,btn){
    if(locked)return;locked=true;keyHandler=null;
    qc.classList.remove('ok','bad');void qc.offsetWidth;qc.classList.add(ok?'ok':'bad');
    const s=$('#slot',box);if(s&&q.input==='pad'){s.textContent=D(q.answer);s.classList.remove('empty');s.classList.add(ok?'good':'fix');}
    if(q.input==='choice'){$$('.opt',qin).forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('ok');});if(!ok&&btn)btn.classList.add('bad');
      if(q.kind==='pick'||q.kind==='missC'){const a=$('.qbody .ans',box);if(a){a.textContent=q.choices[q.answer];a.classList.remove('empty');}}}
    if(q.input==='tf')$$('[data-v]',qin).forEach(b=>{b.disabled=true;});
    if(q.input==='pad')$$('.k',qin).forEach(b=>{b.disabled=true;});
    fb.className='fb '+(ok?'ok':'bad');
    fb.innerHTML=ok?`${pick(PRAISE)} <span class="exp">${D(q.explain)}</span>`:`${q.input==='pad'&&val!==''?`كتبت ${D(val)}. `:''}الصواب: <span class="exp">${D(q.explain)}</span>`;
    if(!ok){const h=$('#qhb',box);h.hidden=false;h.innerHTML='💡 '+D(q.hint);}
    if(q.rec)record(q.a,q.b,ok,hinted?0:1);
    if(opt.onAnswer)opt.onAnswer(ok,{hinted});
  }
  return{timeout(){if(!locked)judge(false);},
    next(cb,label='فهمت، التالي ←'){const b=document.createElement('button');b.className='btn wide nextbtn';b.textContent=label;b.onclick=cb;box.appendChild(b);setTimeout(()=>b.scrollIntoView({behavior:'smooth',block:'nearest'}),50);},
    get locked(){return locked;}};
}

/* ---------- شاشة الأسئلة: كل سؤال بشكل مختلف ---------- */
SCREENS.quiz=(o)=>{
  setTitle(o.title);
  let i=0,score=0,wrong=0,lives=o.lives||0,done=false,combo=0,bestCombo=0,t0=Date.now(),ui=null;
  const mix=QMix(Object.assign({kinds:'all'},o.mix||{}));
  view.innerHTML=`<div style="--c:${o.color||'var(--sun)'}"><div class="qtop"><span id="qp"></span><span class="qlives" id="ql"></span><span id="qs"></span></div>
    <div class="tbar" id="tbar" ${o.totalTime?'':'hidden'}><i id="tfl"></i></div><div class="combo" id="combo"></div><div id="qa"></div></div>`;
  const top=()=>{$('#qp').textContent=o.total?`${D(Math.min(i+1,o.total))} / ${D(o.total)}`:'';
    $('#ql').innerHTML=o.lives?[...Array(o.lives)].map((_,k)=>k<lives?'❤️':'🤍').join(''):'';$('#qs').textContent=`✅ ${D(score)}`;};
  const showCombo=()=>{const el=$('#combo');if(combo>=3){el.textContent=`🔥 ${D(combo)} إجابات متتالية!`;el.className='combo on';
      if(combo%5===0){addCoins(2);toast(`🔥 كومبو ${D(combo)}! +${D(2)} عملة`);}}else el.className='combo';};
  function next(){if(done)return;if(o.total&&i>=o.total)return end(true);
    const q=mix.next();
    ui=renderQ($('#qa'),q,{hint:o.hint,onAnswer:(ok,info)=>{
      if(ok){score+=info.hinted?.5:1;combo++;bestCombo=Math.max(bestCombo,combo);showCombo();i++;top();setTimeout(next,o.fast?650:1200);}
      else{wrong++;combo=0;showCombo();i++;
        if(o.lives){lives--;top();if(lives<=0){setTimeout(()=>end(false),2000);return;}}
        if(o.suddenDeath){setTimeout(()=>end(false),2000);return;}
        top();if(o.totalTime||o.fast)setTimeout(next,2200);else ui.next(next);}}});
    top();
  }
  function end(complete){if(done)return;done=true;keyHandler=null;o.onEnd({score,wrong,count:i,time:Math.round((Date.now()-t0)/1000),complete,bestCombo});}
  if(o.totalTime){const iv=setInterval(()=>{if(done)return;const left=Math.max(0,o.totalTime-(Date.now()-t0)/1000);
      $('#tfl').style.width=(left/o.totalTime*100)+'%';$('#tbar').classList.toggle('low',left<10);if(left<=0)end(true);},100);onClean(()=>clearInterval(iv));}
  onClean(()=>{done=true;});
  next();
};

function startSmart(){
  const pool=[];for(let a=1;a<=12;a++)for(let b=a;b<=12;b++){const f=S.stats[fk(a,b)]||{c:0,w:0,s:0};
    let w=1+f.w*3-Math.min(f.c,6)*.4-f.s*.5+(f.c+f.w===0?1.5:0)+(a>=6&&b>=6?1:0);pool.push({a,b,w:Math.max(.2,w)});}
  const qs=[];for(let k=0;k<15;k++){const tot=pool.reduce((s,x)=>s+x.w,0);let r=Math.random()*tot,ch=pool[0];for(const x of pool){r-=x.w;if(r<=0){ch=x;break;}}
    qs.push(Math.random()<.5?{a:ch.a,b:ch.b}:{a:ch.b,b:ch.a});ch.w=0;}
  go('quiz',{title:'المراجعة الذكية',total:15,hint:true,mix:{facts:qs},
    onEnd:r=>result({title:'راجعت نقاط ضعفك! 🧠',score:`${D(r.score)} / ${D(15)}`,good:r.score>=10,lines:['المراجعة الذكية تختار الحقائق التي تخطئ فيها أكثر','شاهد تقدّمك في شبكة الإنجاز 🧩']})});
}
function startRace(){

    onEnd:r=>{const nb=saveBest('race',r.score);addCoins(Math.floor(r.score/5));

}
function saveBest(k,v,lower=false){const o=S.best[k];const better=o===undefined||(lower?v<o:v>o);if(better){S.best[k]=v;save();}checkBadges();return better;}

/* 🧭 متاهة المضاعفات */
function genPath(R,C){const S0=[0,C-1],G=[R-1,0];
  for(let t=0;t<500;t++){const path=[S0],seen=new Set([S0.join()]);let cur=S0,ok=false;
    for(let s=0;s<40;s++){const [r,c]=cur;
      const nb=[[r+1,c],[r-1,c],[r,c+1],[r,c-1]].filter(([y,x])=>y>=0&&y<R&&x>=0&&x<C&&!seen.has(y+','+x)&&
        [[y+1,x],[y-1,x],[y,x+1],[y,x-1]].filter(([yy,xx])=>seen.has(yy+','+xx)).length===1);
      if(!nb.length)break;const w=shuffle(nb).map(([y,x])=>({y,x,d:Math.abs(y-G[0])+Math.abs(x-G[1])}));w.sort((p,q)=>p.d-q.d);
      const ch=Math.random()<.55?w[0]:pick(w);cur=[ch.y,ch.x];path.push(cur);seen.add(cur.join());if(cur[0]===G[0]&&cur[1]===G[1]){ok=true;break;}}
    if(ok&&path.length>=10&&path.length<=18)return path;}
  const p=[];for(let c=C-1;c>=0;c--)p.push([0,c]);for(let r=1;r<R;r++)p.push([r,0]);return p;}
SCREENS.maze=(arg)=>{
  const ROUNDS=3;let round=0,solved=0,lives=3,done=false,alive=true;
  function build(){if(!alive)return;
    const n=gameTable(arg),R=6,C=5,path=genPath(R,C),onP=new Set(path.map(p=>p.join())),vals={};
    path.forEach(([r,c],i)=>{if(i>0&&i<path.length-1)vals[r+','+c]=n*rint(1,12);});
    for(let r=0;r<R;r++)for(let c=0;c<C;c++){const k=r+','+c;if(!onP.has(k))vals[k]=nonMul(n,Math.random);}
    let pos=path[0];const G=path[path.length-1];
    setTitle(`🧭 متاهة جدول ${D(n)}`);
    view.innerHTML=`<div style="--c:${COLORS[n]}"><div class="gstat"><span>المتاهة ${D(round+1)} / ${D(ROUNDS)}</span><span class="qlives" id="zl"></span></div>
      <div class="mission">👣 امشِ على أعداد <b>جدول ${D(n)}</b> فقط لتصل إلى الكنز 💎. اضغط مربعاً بجانبك.</div>
      <div class="maze" style="grid-template-columns:repeat(${C},1fr)">${[...Array(R*C)].map((_,i)=>{const r=Math.floor(i/C),c=i%C;
        const isS=r===pos[0]&&c===pos[1],isG=r===G[0]&&c===G[1],t=isS?'🚩':isG?'💎':D(vals[r+','+c]);
        return `<button class="mz ${isS?'here':''} ${isG?'goal':''}" data-r="${r}" data-c="${c}" data-t="${t}">${isS?S.avatar:t}</button>`;}).join('')}</div>
      <div class="fb" id="zfb"></div><div class="row" style="justify-content:center"><button class="btn ghost sm" id="zh">💡 أين أذهب؟</button></div></div>`;
    const lvz=()=>{$('#zl').innerHTML=[0,1,2].map(k=>k<lives?'❤️':'🤍').join('');};lvz();
    const cell=(r,c)=>$(`.mz[data-r="${r}"][data-c="${c}"]`);
    function move(r,c){const o=cell(pos[0],pos[1]);o.classList.remove('here');o.classList.add('step');o.textContent=o.dataset.t;pos=[r,c];const nw=cell(r,c);nw.classList.add('here');nw.textContent=S.avatar;}
    $$('.mz').forEach(b=>b.onclick=()=>{if(done)return;const r=+b.dataset.r,c=+b.dataset.c;
      if(Math.abs(r-pos[0])+Math.abs(c-pos[1])!==1){$('#zfb').className='fb bad';$('#zfb').textContent='اختر مربعاً بجانبك مباشرة ↔️';return;}
      if(b.classList.contains('step')){$('#zfb').className='fb';$('#zfb').textContent='مشيت هنا من قبل، تقدّم إلى الأمام 👣';move(r,c);return;}
      if(b.classList.contains('goal')){move(r,c);done=true;solved++;round++;const c2=5*boost('maze');addCoins(c2);confetti();$('#zfb').className='fb ok';$('#zfb').textContent=`💎 وجدت الكنز! +${D(c2)} عملة`;
        setTimeout(()=>{if(!alive)return;if(round<ROUNDS){done=false;build();}else end();},1500);return;}
      const v=vals[r+','+c];
      if(v%n===0){move(r,c);record(n,v/n,true,0);$('#zfb').className='fb ok';$('#zfb').textContent=`${exprTxt(n,v/n)} = ${D(v)} ✓`;}
      else{lives--;lvz();b.classList.remove('no');void b.offsetWidth;b.classList.add('no');$('#zfb').className='fb bad';$('#zfb').textContent=`${D(v)} ليس في جدول ${D(n)} — اختر طريقاً آخر`;if(lives<=0){done=true;setTimeout(()=>{if(alive)end();},900);}}});
    $('#zh').onclick=()=>{$$('.mz').forEach(b=>{const r=+b.dataset.r,c=+b.dataset.c;
      if(Math.abs(r-pos[0])+Math.abs(c-pos[1])===1&&!b.classList.contains('step')&&(b.classList.contains('goal')||vals[r+','+c]%n===0)){b.classList.remove('glow');void b.offsetWidth;b.classList.add('glow');}});};
  }
  function end(){if(!alive)return;done=true;const nb=saveBest('maze',solved);
    result({title:solved===ROUNDS?'مستكشف عظيم! 🧭':solved?'أحسنت!':'المتاهة صعبة… حاول مرة أخرى 💪',score:`${D(solved)} / ${D(ROUNDS)}`,good:solved>0,lines:[nb&&solved?'🏆 أفضل نتيجة جديدة!':'',`قلوبك المتبقية: ${D(Math.max(0,lives))}`]});}
  onClean(()=>{done=true;alive=false;});
  build();
};

SCREENS.bingo=()=>{
  setTitle('🎱 بينغو الضرب');
  const T=S.tables.filter(x=>x>1);const prods=new Map();
  const addT=list=>list.forEach(a=>{for(let b=2;b<=12;b++){const p=a*b;if(!prods.has(p))prods.set(p,[]);if(!prods.get(p).some(x=>x[0]===a&&x[1]===b))prods.get(p).push([a,b]);}});
  addT(T.length?T:ALL.slice(1));let keys=shuffle([...prods.keys()]);
  if(keys.length<16){const extra=[];ALL.slice(1).forEach(a=>{for(let b=2;b<=12;b++){const p=a*b;if(!prods.has(p)){prods.set(p,[[a,b]]);extra.push(p);}}});keys=keys.concat(shuffle(extra));}
  const card=keys.slice(0,16),marked=new Array(16).fill(false);let calls=0,miss=0,cur=-1,fact=null,missNow=0,done=false;
  view.innerHTML=`<div class="gstat"><span>النداء: <span class="big" id="bc">${D(0)}</span></span><span>الأخطاء: <span class="big" id="bm">${D(0)}</span></span></div>
    <div class="caller"><span class="cl">🎱 النداء</span><div class="eq big" id="call"></div><button class="ic" id="bsay" aria-label="استمع">🔊</button></div>
    <div class="bingo">${card.map((p,i)=>`<button class="bc" data-i="${i}">${D(p)}</button>`).join('')}</div>
    <div class="fb" id="bfb"></div><p class="muted" style="text-align:center;font-size:14px">اضغط على الجواب في بطاقتك. اجعل ${D(4)} مربعات في خط واحد (أفقي أو عمودي أو مائل) لتصرخ: بينغو! 🎉</p>`;
  const LINES=[];for(let r=0;r<4;r++)LINES.push([0,1,2,3].map(c=>r*4+c));for(let c=0;c<4;c++)LINES.push([0,1,2,3].map(r=>r*4+c));LINES.push([0,5,10,15],[3,6,9,12]);
  function call(){if(done)return;const left=[...Array(16).keys()].filter(i=>!marked[i]);cur=pick(left);fact=pick(prods.get(card[cur]));if(Math.random()<.5)fact=[fact[1],fact[0]];
    calls++;missNow=0;$('#bc').textContent=D(calls);$('#call').innerHTML=`<span>${D(fact[0])}</span><span class="op">×</span><span>${D(fact[1])}</span>`;
    const c=$('#call');c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop');speak(`${fact[0]} ضرب ${fact[1]}`);}
  $('#bsay').onclick=()=>speak(`${fact[0]} ضرب ${fact[1]}`);
  $$('.bc').forEach(b=>b.onclick=()=>{if(done)return;const i=+b.dataset.i;if(marked[i])return;
    if(i===cur){marked[i]=true;b.classList.add('mark');record(fact[0],fact[1],true,0);$('#bfb').className='fb ok';$('#bfb').textContent=`${exprTxt(fact[0],fact[1])} = ${D(card[i])} ✓`;
      const line=LINES.find(l=>l.every(x=>marked[x]));
      if(line){done=true;line.forEach(x=>$$('.bc')[x].classList.add('win'));const st=miss===0?3:miss<=2?2:1;const better=!S.best.bingoBest||calls<S.best.bingoBest;if(better){S.best.bingoBest=calls;save();}checkBadges();
        const c2=(4+st*2)*boost('bingo');addCoins(c2);setTimeout(()=>result({title:'بينغو! 🎉',stars:st,score:`${D(calls)} نداء`,lines:[`الأخطاء: ${D(miss)}`,better?'🏆 أسرع بينغو لك!':'',`+${D(c2)} عملة`]}),900);}
      else setTimeout(call,700);}
    else{miss++;missNow++;$('#bm').textContent=D(miss);b.classList.remove('no');void b.offsetWidth;b.classList.add('no');$('#bfb').className='fb bad';
      $('#bfb').textContent=`${D(card[i])} ليس الجواب. ${missNow>=2?`💡 ${D(hintFor(fact[0],fact[1]))}`:'حاول مرة أخرى!'}`;
      if(missNow>=3){record(fact[0],fact[1],false);$$('.bc')[cur].classList.add('glow');}}});
  onClean(()=>{done=true;});
  call();
};

/* 🧺 اصطد الثمار */
SCREENS.catcher=(arg)=>{
  const n=gameTable(arg);setTitle(`🧺 اصطد مضاعفات ${D(n)}`);
  view.innerHTML=`<div style="--c:${COLORS[n]}"><div class="gstat"><span>الثمار: <span class="big" id="cs">${D(0)}</span></span><span class="qlives" id="cl"></span><span id="ct"></span></div>
    <div class="mission">🧺 حرّك السلة والتقط الثمار التي تحمل أعداداً من <b>جدول ${D(n)}</b>، وابتعد عن غيرها!</div>
    <canvas id="cv" class="catchcv" aria-label="ساحة اللعب"></canvas><div class="fb" id="cfb"></div></div>`;
  const cv=$('#cv'),ctx=cv.getContext('2d');let W=300,H=420;
  const size=()=>{const dpr=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth||300;H=Math.max(320,Math.min(460,Math.round(window.innerHeight*.56)));cv.style.height=H+'px';cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);};
  size();window.addEventListener('resize',size);
  const T=60;let bx=W/2,items=[],pops=[],score=0,lives=3,done=false,t0=performance.now(),last=t0,spawnAt=t0+400,raf=0,flash=0;
  const bw=()=>Math.min(120,W*.28),by=()=>H-30;
  const lv=()=>{$('#cl').innerHTML=[0,1,2].map(k=>k<lives?'❤️':'🤍').join('');};lv();
  const setX=e=>{const r=cv.getBoundingClientRect();bx=Math.max(bw()/2,Math.min(W-bw()/2,e.clientX-r.left));};
  cv.addEventListener('pointerdown',e=>{setX(e);try{cv.setPointerCapture(e.pointerId);}catch(_){}});cv.addEventListener('pointermove',setX);
  keyHandler=e=>{if(e.key==='ArrowLeft')bx=Math.max(bw()/2,bx-36);else if(e.key==='ArrowRight')bx=Math.min(W-bw()/2,bx+36);};
  const FR=['#e5484d','#f59e0b','#22c55e','#a855f7','#ec4899','#f97316'];
  function spawn(){const isM=Math.random()<.55,v=isM?n*rint(1,12):nonMul(n,Math.random);const r=25;
    items.push({x:r+Math.random()*(W-2*r),y:-r,r,v,vy:70+Math.min(120,score*4)+Math.random()*40,col:pick(FR)});}
  function step(ts){if(done)return;const dt=Math.min(.05,(ts-last)/1000);last=ts;const el=(ts-t0)/1000;
    if(ts>spawnAt){spawn();spawnAt=ts+Math.max(520,1150-score*25);}
    items.forEach(it=>{it.y+=it.vy*dt;});
    items=items.filter(it=>{if(it.y+it.r>=by()-6&&it.y-it.r<=by()+8&&Math.abs(it.x-bx)<bw()/2+it.r*.3){
        if(it.v%n===0){score++;$('#cs').textContent=D(score);record(n,it.v/n,true,0);pops.push({x:it.x,y:by()-30,t:0,txt:'+'+D(1),c:'#8fe388'});$('#cfb').className='fb ok';$('#cfb').textContent=`${exprTxt(n,it.v/n)} = ${D(it.v)} ✓`;}
        else{lives--;lv();flash=1;pops.push({x:it.x,y:by()-30,t:0,txt:'✗',c:'#ff7d72'});$('#cfb').className='fb bad';$('#cfb').textContent=`${D(it.v)} ليس في جدول ${D(n)}!`;if(lives<=0)finish();}
        return false;}return it.y-it.r<H;});
    pops.forEach(p=>{p.t+=dt;p.y-=40*dt;});pops=pops.filter(p=>p.t<.8);flash=Math.max(0,flash-dt*2.5);
    draw(el);const left=Math.max(0,T-el);$('#ct').textContent=`⏳ ${D(Math.ceil(left))}`;if(left<=0)return finish();raf=requestAnimationFrame(step);}
  function draw(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2c6b8f');g.addColorStop(.7,'#5fa8c2');g.addColorStop(1,'#7cc1c9');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#3b8a4e';ctx.fillRect(0,H-14,W,14);
    items.forEach(it=>{ctx.fillStyle='#2f7d32';ctx.beginPath();ctx.ellipse(it.x+7,it.y-it.r-3,8,4,-.5,0,7);ctx.fill();
      ctx.fillStyle=it.col;ctx.beginPath();ctx.arc(it.x,it.y,it.r,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(it.x-8,it.y-8,7,0,7);ctx.fill();
      ctx.fillStyle='#fff';ctx.font='700 20px Lalezar, Tahoma, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.35)';ctx.strokeText(D(it.v),it.x,it.y+1);ctx.fillText(D(it.v),it.x,it.y+1);});
    const w=bw(),x=bx-w/2,y=by()-18;ctx.fillStyle='#b97a42';ctx.strokeStyle='#5b3412';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w,y);ctx.lineTo(x+w-12,y+30);ctx.lineTo(x+12,y+30);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.strokeStyle='rgba(91,52,18,.6)';ctx.lineWidth=2;for(let k=1;k<5;k++){ctx.beginPath();ctx.moveTo(x+k*w/5,y);ctx.lineTo(x+k*w/5-(k-2.5)*2,y+30);ctx.stroke();}
    ctx.beginPath();ctx.moveTo(x+4,y+14);ctx.lineTo(x+w-4,y+14);ctx.stroke();
    pops.forEach(p=>{ctx.globalAlpha=1-p.t/.8;ctx.fillStyle=p.c;ctx.font='800 22px Lalezar, Tahoma, sans-serif';ctx.fillText(p.txt,p.x,p.y);ctx.globalAlpha=1;});
    if(flash>0){ctx.fillStyle=`rgba(255,80,70,${flash*.35})`;ctx.fillRect(0,0,W,H);}}
  function finish(){if(done)return;done=true;cancelAnimationFrame(raf);keyHandler=null;const nb=saveBest('catcher',score),c2=Math.floor(score/3)*boost('catcher');addCoins(c2);
    setTimeout(()=>result({title:'انتهت جولة الثمار! 🧺',score:D(score),good:score>0,lines:[nb&&score>0?'🏆 رقم قياسي جديد!':`رقمك القياسي: ${D(S.best.catcher||0)}`,`+${D(c2)} عملة`]}),400);}
  onClean(()=>{done=true;cancelAnimationFrame(raf);window.removeEventListener('resize',size);});
  draw();raf=requestAnimationFrame(step);
};

/* فرقعة البالونات */
SCREENS.balloon=()=>{
  setTitle('فرقعة البالونات 🎈');
  let score=0,lives=3,round=0,done=false,q;
  view.innerHTML=`<div class="gstat"><span>النقاط: <span class="big" id="bs">${D(0)}</span></span><span class="qlives" id="bl"></span></div>
    <div class="sky" id="sky">
      <div class="cloud" style="width:120px;height:34px;top:22%;left:8%"></div><div class="cloud" style="width:90px;height:26px;top:48%;right:10%"></div><div class="cloud" style="width:140px;height:36px;top:72%;left:30%"></div>
      <div class="qbubble" id="bq"></div></div>
    <p class="muted" style="text-align:center;margin-top:8px;font-size:14px">لا تدع البالون الصحيح يهرب! كل خطأ يكلّفك قلباً.</p>`;
  const sky=$('#sky'),bBag=FactBag({minB:2});
  const lv=()=>$('#bl').innerHTML=[0,1,2].map(k=>k<lives?'❤️':'🤍').join('');
  function lose(){lives--;lv();if(lives<=0)finish();}
  function newRound(){
    if(done)return;round++;const my=round;
    $$('.balloon',sky).forEach(b=>b.remove());
    q=bBag.next();const miss=Math.random()<.35&&q.a>1;const p=miss?q.b:q.a*q.b;
    $('#bq').innerHTML=miss?`${D(q.a)} × ؟ = ${D(q.a*q.b)}`:`${D(q.a)} × ${D(q.b)} = ؟`;
    const vals=shuffle([p,...(miss?distractQ(q.b):distract(q.a,q.b,3))]);const xs=shuffle([14,38,62,86]);
    const dur=Math.max(3.4,7.2-score*.18);
    vals.forEach((v,k)=>{
      const b=document.createElement('button');b.className='balloon';b.textContent=D(v);
      b.style.left=xs[k]+'%';b.style.setProperty('--c',COLORS[1+((k*3+round)%12)]);
      b.style.setProperty('--dur',(dur+Math.random()*1.2)+'s');b.style.animationDelay=(Math.random()*.9)+'s, 0s';
      b.onclick=()=>{if(done||my!==round)return;
        if(v===p){sfx.pop();sfx.ok();b.classList.add('popped');score++;$('#bs').textContent=D(score);record(q.a,q.b,true);setTimeout(newRound,350);}
        else{sfx.bad();b.classList.add('wrong');record(q.a,q.b,false);lose();}};
      b.addEventListener('animationend',e=>{if(e.animationName!=='rise'||my!==round||done)return;
        if(v===p){toast(`${D(q.a)} × ${D(q.b)} = ${D(q.a*q.b)}`,1600);sfx.bad();lose();if(!done)setTimeout(newRound,500);}else b.remove();});
      sky.appendChild(b);
    });
  }
  function finish(){if(done)return;done=true;$$('.balloon',sky).forEach(b=>b.style.animationPlayState='paused');
    const nb=saveBest('balloon',score);addCoins(Math.floor(score/3));
    setTimeout(()=>result({title:'انتهت البالونات!',score:D(score),good:score>0,lines:[nb&&score>0?'🏆 رقم قياسي جديد!':`رقمك القياسي: ${D(S.best.balloon||0)}`,`مكافأة: +${D(Math.floor(score/3))} عملة`]}),500);}
  onClean(()=>{done=true;});
  lv();newRound();
};

  while(facts.length<6&&guard++<500){const f=randFact();const p=f.a*f.b;if(!prods.has(p)){prods.add(p);facts.push(f);}}
  const cards=shuffle(facts.flatMap((f,i)=>[{id:i,txt:`${D(f.a)} × ${D(f.b)}`,f},{id:i,txt:D(f.a*f.b),f}]));
  let open=[],moves=0,matched=0,lock=false,t0=Date.now();
  view.innerHTML=`<div class="gstat"><span>المحاولات: <span class="big" id="mm">${D(0)}</span></span><span>الأزواج: <span class="big" id="mp">${D(0)}/${D(6)}</span></span></div>
    <div class="mem">${cards.map((c,k)=>`<button class="mcard" data-k="${k}" style="--c:${COLORS[(c.id*2)%12+1]}" aria-label="بطاقة"><span class="bk">؟</span><span class="f">${c.txt}</span></button>`).join('')}</div>`;
  $$('.mcard').forEach(el=>el.onclick=()=>{

      const[x,y]=open,A=cards[x],B=cards[y],ex=$(`.mcard[data-k="${x}"]`),ey=$(`.mcard[data-k="${y}"]`);
      if(A.id===B.id){setTimeout(()=>{ex.classList.add('done');ey.classList.add('done');sfx.ok();record(A.f.a,A.f.b,true);matched++;$('#mp').textContent=`${D(matched)}/${D(6)}`;open=[];lock=false;
        if(matched===6){const nb=saveBest('memory',moves,true);addCoins(8);setTimeout(()=>result({title:'ذاكرة رائعة!',score:`${D(moves)} محاولة`,lines:[nb?'🏆 رقم قياسي جديد!':`أفضل نتيجة: ${D(S.best.memory)} محاولة`,`الوقت: ${D(Math.round((Date.now()-t0)/1000))} ثانية`,'مكافأة: +'+D(8)+' عملات']}),500);}},400);}
      else setTimeout(()=>{ex.classList.remove('flip');ey.classList.remove('flip');open=[];lock=false;},950);
    }

    $$('.opt').forEach(o=>o.onclick=()=>{if(lock)return;lock=true;const v=+o.dataset.v,ok=v===b;record(t,b,ok);
      if(ok){score++;sfx.ok();o.classList.add('ok');$('#fb').className='fb ok';$('#fb').textContent='وجدته! 🔍';}
      else{sfx.bad();o.classList.add('bad');$(`.opt[data-v="${b}"]`).classList.add('ok');$('#fb').className='fb bad';$('#fb').textContent=`${D(t)} × ${D(b)} = ${D(p)}`;}
      $('#ms').textContent=D(score);i++;setTimeout(next,ok?700:1500);});
  }
  next();
};

   <div class="bossgrid">${ALL.map(n=>`<button class="bosscard ${S.bosses[n]?'won':''}" style="--c:${COLORS[n]}" data-n="${n}">${monsterSVG(n)}<span class="bn">${MONSTERS[n]}</span><span class="bs">${S.bosses[n]?'✅ مهزوم':`جدول ${D(n)}`}</span></button>`).join('')}</div>`;

/* ---------- التحديات ---------- */
SCREENS.challenges=()=>{
  setTitle('التحديات 🏁');
  const td=today(),doneToday=S.daily[td]!==undefined,B=S.best;
  view.innerHTML=`<div class="acts">
    <button class="act" id="c1" style="--c:var(--sun);border-color:var(--sun)"><span class="ai">📅</span><div><h3>التحدي اليومي</h3><p>${D(15)} سؤالاً جديداً كل يوم من كل الجداول. مكافأة أول مرة: ${D(15)} عملة</p></div><span class="best">${doneToday?'✅ اليوم<br>'+D(S.daily[td])+'/'+D(15):'جديد!'}</span></button>
    <button class="act" id="c2"><span class="ai">👑</span><div><h3>ملك الجداول</h3><p>${D(36)} سؤالاً من الجداول كلها، ومعك ${D(3)} قلوب فقط</p></div><span class="best">${B.kingDone?'👑 ملك':'الأفضل<br>'+D(B.king||0)+'/'+D(36)}</span></button>
    <button class="act" id="c3"><span class="ai">🌋</span><div><h3>الجداول الصعبة</h3><p>جداول ${D(6)} و${D(7)} و${D(8)} و${D(9)} و${D(12)} في ${D(90)} ثانية</p></div><span class="best">الأفضل<br>${D(B.hard||0)}</span></button>
    <button class="act" id="c4"><span class="ai">🧗</span><div><h3>السلسلة الذهبية</h3><p>أجب بلا توقف… أول خطأ ينهي التحدي!</p></div><span class="best">الأفضل<br>${D(B.sudden||0)}</span></button>
  </div>
  <h2 class="sec">مهامك</h2>
  <div class="acts">${BADGES.filter(b=>!S.badges[b.id]).slice(0,5).map(b=>`<div class="act" style="cursor:default"><span class="ai">${b.i}</span><div><h3>${b.t}</h3><p>${D(b.d)}</p></div><span class="best">+${D(10)} 🪙</span></div>`).join('')||'<p class="muted">أنجزت كل المهام! أنت أسطورة 🏆</p>'}</div>`;
  $('#c1').onclick=()=>{const r=seeded('d'+td),qs=[...Array(15)].map(()=>{const a=1+Math.floor(r()*12),b=1+Math.floor(r()*12);return{a,b};});
    go('quiz',{title:'التحدي اليومي 📅',total:15,mix:{facts:qs,rnd:r},onEnd:x=>{const first=S.daily[td]===undefined;const sc=Math.floor(x.score);S.daily[td]=Math.max(sc,S.daily[td]||0);save();if(first)addCoins(15);checkBadges();
      result({title:'أكملت تحدي اليوم!',score:`${D(sc)} / ${D(15)}`,good:true,lines:[first?`+${D(15)} عملة مكافأة اليوم`:'عُد غداً لتحدٍّ جديد',`الوقت: ${D(x.time)} ثانية`]});}});};
  $('#c2').onclick=()=>{const qs=[];for(let k=0;k<36;k++){const a=ALL[k%12],b=rint(2,12);qs.push(Math.random()<.5?{a,b}:{a:b,b:a});}shuffle(qs);
    go('quiz',{title:'ملك الجداول 👑',total:36,lives:3,mix:{tables:ALL,minB:2},onEnd:x=>{const sc=Math.floor(x.score);saveBest('king',sc);
      if(x.complete){const first=!S.best.kingDone;S.best.kingDone=1;save();if(first)addCoins(50);checkBadges();}
      result({title:x.complete?'👑 أنت ملك الجداول!':'سقطت القلوب…',score:`${D(sc)} / ${D(36)}`,good:x.complete,lines:[x.complete?'أكملت التحدي الأكبر!':'حاول مرة أخرى، أنت قريب!',`أفضل نتيجة: ${D(S.best.king||0)}`]});}});};
  $('#c3').onclick=()=>go('quiz',{title:'الجداول الصعبة 🌋',totalTime:90,fast:true,mix:{tables:[6,7,8,9,12],minB:3,kinds:'fast'},onEnd:x=>{const nb=saveBest('hard',x.score);addCoins(Math.floor(x.score/4));
      result({title:'انتهى الوقت!',score:D(x.score),good:x.score>0,lines:[nb&&x.score>0?'🏆 رقم قياسي جديد!':`رقمك القياسي: ${D(S.best.hard||0)}`]});}});
  $('#c4').onclick=()=>go('quiz',{title:'السلسلة الذهبية 🧗',suddenDeath:true,fast:true,mix:{tables:ALL,minB:2,kinds:'fast'},onEnd:x=>{const nb=saveBest('sudden',x.score);addCoins(Math.floor(x.score/3));
      result({title:'انتهت السلسلة!',score:D(x.score),good:x.score>=5,lines:[nb&&x.score>0?'🏆 رقم قياسي جديد!':`رقمك القياسي: ${D(S.best.sudden||0)}`]});}});
};

/* ---------- المراجعة ---------- */
SCREENS.review=()=>{
  setTitle('المراجعة 🔁');
  const weak=[];for(let a=1;a<=12;a++)for(let b=a;b<=12;b++)if(mastery(a,b)===1)weak.push(`${D(a)} × ${D(b)}`);
  view.innerHTML=`<div class="acts">
    <button class="act" id="r1"><span class="ai">🧠</span><div><h3>المراجعة الذكية</h3><p>${D(15)} سؤالاً يختارها البرنامج من الحقائق التي تخطئ فيها أكثر</p></div></button>
    <button class="act" id="r2"><span class="ai">🧩</span><div><h3>شبكة الإنجاز والجدول الكامل</h3><p>جدول الضرب ${D(12)} × ${D(12)} ملوّن حسب إتقانك</p></div></button>
  </div>
  <h2 class="sec">بطاقات الحفظ</h2>
  <p class="muted" style="margin-bottom:10px">اختر جدولاً لتراجعه ببطاقات تقلبها بنفسك:</p>
  <div class="chips">${ALL.map(n=>`<button class="chip on" style="--c:${COLORS[n]}" data-c="${n}">${D(n)}</button>`).join('')}<button class="chip txt" data-c="weak">الضعيفة فقط</button></div>
  <h2 class="sec">تحتاج إلى تقوية</h2>
  <div class="card">${weak.length?`<p>${weak.slice(0,30).join(' · ')}</p>`:'<p class="muted">لا توجد حقائق ضعيفة حالياً. استمر! 🌟</p>'}</div>`;
  $('#r1').onclick=()=>startSmart();$('#r2').onclick=()=>go('grid');
  $$('[data-c]').forEach(b=>b.onclick=()=>{sfx.tap();const v=b.dataset.c;
    if(v==='weak'&&!weak.length){toast('لا توجد حقائق ضعيفة 🌟');return;}go('cards',v==='weak'?'weak':+v);});
};

SCREENS.cards=(n)=>{
  let deck;
  if(n==='weak'){deck=[];for(let a=1;a<=12;a++)for(let b=a;b<=12;b++)if(mastery(a,b)===1)deck.push({a,b});shuffle(deck);setTitle('بطاقات الحقائق الضعيفة');}
  else{deck=shuffle(ALL.map(b=>({a:n,b})));setTitle(`بطاقات جدول ${D(n)}`);}
  let i=0,know=0,again=[];const color=n==='weak'?'var(--bad)':COLORS[n];
  view.innerHTML=`<div style="--c:${color}"><div class="gstat"><span id="cp"></span><span>✅ <span id="ck">${D(0)}</span></span></div>
    <div class="fc" id="fc"><div class="fcin"><div class="fcf" id="ff"></div><div class="fcb" id="fb2"></div></div></div>
    <p class="muted" style="text-align:center;font-size:14px">اضغط على البطاقة لتقلبها</p>
    <div class="tfbtns"><button class="btn ok" id="kn">✔ عرفتها</button><button class="btn bad" id="ag">↻ أعدها لي</button></div></div>`;
  function show(){if(i>=deck.length){if(again.length){deck=deck.concat(shuffle(again));again=[];}else{addCoins(3);return result({title:'أنهيت البطاقات! 🃏',score:`${D(know)}`,lines:['عرفت كل البطاقات في النهاية 💪',`+${D(3)} عملات`]});}}
    const c=deck[i];$('#fc').classList.remove('flip');$('#cp').textContent=`${D(i+1)} / ${D(deck.length)}`;
    $('#ff').innerHTML=`<div>${D(c.a)} × ${D(c.b)}<small>ما الناتج؟</small></div>`;
    setTimeout(()=>{$('#fb2').innerHTML=`<div>${D(c.a*c.b)}<small>${D(c.a)} × ${D(c.b)}</small></div>`;},200);}
  $('#fc').onclick=()=>{sfx.flip();$('#fc').classList.toggle('flip');};
  $('#kn').onclick=()=>{const c=deck[i];record(c.a,c.b,true,0);know++;$('#ck').textContent=D(know);sfx.ok();i++;show();};
  $('#ag').onclick=()=>{const c=deck[i];record(c.a,c.b,false);again.push(c);sfx.flip();i++;show();};
  keyHandler=e=>{if(e.key===' '){e.preventDefault();$('#fc').click();}};
  show();
};

SCREENS.grid=(mode)=>{
  mode=mode||'m';setTitle('شبكة الإنجاز 🧩');
  const mc=masteredCount();
  view.innerHTML=`<div style="--c:var(--sun)">
   <div class="row" style="justify-content:space-between;margin-bottom:10px">
     <p style="font-weight:800">أتقنت <span style="color:var(--ok);font-family:var(--f-display);font-size:24px;font-weight:400">${D(mc)}</span> من ${D(78)} حقيقة</p>
     <div class="seg"><button data-m="m" class="${mode==='m'?'on':''}">الإتقان</button><button data-m="p" class="${mode==='p'?'on':''}">الجدول الكامل</button></div>
   </div>
   <div class="bar" style="margin-bottom:10px"><i style="width:${Math.round(mc/78*100)}%;background:var(--ok)"></i></div>
   ${mode==='m'?`<div class="legend"><span><i style="background:rgba(143,227,136,.8)"></i>متقنة</span><span><i style="background:rgba(255,217,90,.6)"></i>في الطريق</span><span><i style="background:rgba(255,125,114,.6)"></i>تحتاج تدريب</span><span><i style="background:rgba(255,255,255,.12)"></i>لم تجربها</span></div>`:'<p class="muted" style="font-size:14px;margin-bottom:8px">اضغط أي خانة لترى المعادلة وتسمعها.</p>'}
   <div class="gridwrap"><table class="mgrid"><thead><tr><th style="color:var(--chalk-2)">×</th>${ALL.map(b=>`<th style="color:${COLORS[b]}">${D(b)}</th>`).join('')}</tr></thead>
   <tbody>${ALL.map(a=>`<tr><th style="color:${COLORS[a]}">${D(a)}</th>${ALL.map(b=>`<td class="${mode==='m'?'m'+mastery(a,b):''}" data-a="${a}" data-b="${b}">${D(a*b)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
   <div class="gridinfo" id="gi"></div>
   <div class="row" style="justify-content:center"><button class="btn" id="gs">🧠 درّب الحقائق الضعيفة</button></div></div>`;
  $$('.seg button').forEach(b=>b.onclick=()=>{cur.arg=b.dataset.m;rerender();});
  $$('.mgrid td').forEach(td=>td.onclick=()=>{
    const a=+td.dataset.a,b=+td.dataset.b;$$('.mgrid td').forEach(x=>{x.classList.remove('sel','hl');if(+x.dataset.a===a||+x.dataset.b===b)x.classList.add('hl');});td.classList.add('sel');
    const m=mastery(a,b);sfx.tap();
    $('#gi').innerHTML=`<span style="color:${COLORS[a]}">${D(a)}</span> × <span style="color:${COLORS[b]}">${D(b)}</span> = ${D(a*b)} <span style="font-family:var(--f-body);font-size:15px">${['· لم تجربها بعد','· تحتاج تدريب','· في الطريق','· متقنة ✅'][m]}</span>`;
    if(mode==='p')speak(`${a} ضرب ${b} يساوي ${a*b}`);});
  $('#gs').onclick=()=>startSmart();
};

  view.innerHTML=`<div class="card" style="display:flex;gap:14px;align-items:center;margin-bottom:14px"><div class="av">${S.avatar}</div><div style="flex:1;min-width:0"><h2 style="font-size:26px">${esc(S.name)}</h2><p class="lvl" style="color:var(--sun);font-weight:800">🏅 ${lv.name}</p><div class="bar"><i style="width:${lv.pct}%"></i></div></div></div>
   <div class="statg">

     <div class="stat"><b>${D(S.correct)}</b><span>✅ إجابة صحيحة</span></div>
     <div class="stat"><b>${D(S.bestStreak)}</b><span>🔥 أطول سلسلة</span></div>

   <div class="badges">${BADGES.map(b=>`<div class="badge ${S.badges[b.id]?'got':''}"><span class="bi">${b.i}</span><h3>${b.t}</h3><p>${D(b.d)}</p></div>`).join('')}</div>
   <h2 class="sec">المستويات</h2>
   <div class="acts">${LEVELS.map((l,k)=>`<div class="act" style="cursor:default;${k===lv.idx?'border-color:var(--sun)':''}"><span class="ai">${k<=lv.idx?'🏅':'🔒'}</span><div><h3>${l[1]}</h3><p>${D(l[0])} عملة</p></div></div>`).join('')}</div>`;
};

/* ---------- الإعدادات ---------- */
SCREENS.settings=()=>{
  setTitle('الإعدادات ⚙️');
  view.innerHTML=`<div class="card">
    <div class="field"><label for="nm">الاسم</label><input class="inp" id="nm" maxlength="20" value="${esc(S.name)}"></div>
    <div class="field"><label>الشخصية</label><div class="avs">${AVATARS.map(a=>`<button class="avb ${a===S.avatar?'on':''}" data-a="${a}">${a}</button>`).join('')}</div></div>
    <div class="field"><label>شكل الأرقام</label><div class="seg"><button data-d="ar" class="${S.digits==='ar'?'on':''}">١٢٣</button><button data-d="en" class="${S.digits==='en'?'on':''}">123</button></div></div>
    <div class="field"><label>نطق الجدول بصوت مسموع</label><div class="seg"><button data-s="1" class="${S.sound?'on':''}">🔊 تشغيل</button><button data-s="0" class="${!S.sound?'on':''}">🔇 إيقاف</button></div></div>
    <button class="btn wide" id="sv">💾 حفظ</button></div>
   <h2 class="sec">إعادة البدء</h2>
   <div class="card"><p class="muted" style="margin-bottom:10px">يمسح كل النجوم والعملات والأوسمة من هذا الجهاز.</p>
    <button class="btn bad" id="rs">🗑️ مسح التقدم</button>
    <div id="cf" hidden style="margin-top:12px"><p style="font-weight:800;margin-bottom:8px">هل أنت متأكد؟ لا يمكن التراجع.</p><div class="row"><button class="btn bad sm" id="yes">نعم، امسح كل شيء</button><button class="btn ghost sm" id="no">إلغاء</button></div></div></div>`;
  $$('.avb').forEach(b=>b.onclick=()=>{sfx.tap();S.avatar=b.dataset.a;save();$$('.avb').forEach(x=>x.classList.toggle('on',x===b));});
  $$('[data-d]').forEach(b=>b.onclick=()=>{S.digits=b.dataset.d;save();rerender();});
  $$('[data-s]').forEach(b=>b.onclick=()=>{S.sound=b.dataset.s==='1';save();rerender();});
  $('#sv').onclick=()=>{S.name=$('#nm').value.trim()||S.name;save();toast('تم الحفظ ✅');sfx.ok();};
  $('#rs').onclick=()=>{$('#cf').hidden=false;};$('#no').onclick=()=>{$('#cf').hidden=true;};
  $('#yes').onclick=()=>{const keep={name:S.name,avatar:S.avatar,digits:S.digits,sound:S.sound};S=Object.assign(defaults(),keep);save();toast('بدأنا من جديد 🌱');home();};
};

/* ================= البدء ================= */
hud();
if(!S.name){cur={name:'welcome'};SCREENS.welcome();}else home();
})();
</script>
