<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المراجعة الشاملة — We Can! 3 الجزء الأول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF7EA;--ink:#1C2240;--muted:#6B6F86;--card:#fff;--line:#EADFCB;--teal:#0FA3A3;--coral:#FF6B5A;--sun:#FFC23C;--ok:#16A34A;--okbg:#E7F8EC;--bad:#E11D48;--badbg:#FDE8EE;--r:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo Bhaijaan 2",system-ui,sans-serif;font-size:17px;line-height:1.5}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 90px}
.en{direction:ltr;text-align:left;unicode-bidi:isolate}
header.top{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.logo{width:52px;height:52px;border-radius:16px;background:var(--ink);color:var(--sun);display:grid;place-items:center;font-weight:800;font-size:15px;line-height:1;text-align:center;flex:none;transform:rotate(-4deg);box-shadow:4px 4px 0 var(--coral)}
.top h1{margin:0;font-size:22px;line-height:1.2}
.top p{margin:0;color:var(--muted);font-size:14px}
.stars{margin-inline-start:auto;background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;white-space:nowrap}
.hero{background:var(--ink);color:#fff;border-radius:26px;padding:20px;position:relative;overflow:hidden;margin-bottom:16px}
.hero h2{margin:0 0 4px;font-size:24px}
.hero p{margin:0;opacity:.85;font-size:15px}
.hero .bubbles{position:absolute;inset-inline-end:-10px;top:-6px;font-size:58px;opacity:.9;transform:rotate(8deg)}
.hero .go{margin-top:14px;background:var(--sun);color:var(--ink);font-weight:800;padding:10px 18px;border-radius:14px;box-shadow:0 4px 0 #C98F00}
.hero .go:active{transform:translateY(3px);box-shadow:0 1px 0 #C98F00}
.label{font-weight:700;color:var(--muted);font-size:14px;margin:14px 2px 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 14px;border-radius:999px;background:#fff;border:2px solid var(--line);font-weight:600;font-size:15px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.sec{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:14px;text-align:start;position:relative;box-shadow:0 4px 0 var(--line);transition:transform .1s}
.sec:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.sec .ic{font-size:30px;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;margin-bottom:6px}
.sec b{display:block;font-size:18px}
.sec small{color:var(--muted);font-size:13px;display:block}
.sec .best{position:absolute;top:10px;inset-inline-end:12px;font-size:12px;font-weight:700;color:var(--muted)}
.sec.wide{grid-column:1/-1;display:flex;align-items:center;gap:12px}
.sec.wide .ic{margin:0}
/* quiz */
.qbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.x{width:40px;height:40px;border-radius:12px;background:#fff;border:2px solid var(--line);font-size:18px;flex:none}
.prog{flex:1;height:14px;background:#fff;border:2px solid var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#35d0b5);border-radius:99px;transition:width .3s}
.cnt{font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
.card{background:#fff;border:2px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 5px 0 var(--line)}
.tags{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:#F3EEE4;color:var(--muted)}
.inst{color:var(--muted);font-size:15px;margin:0 0 8px}
.qtext{font-size:22px;font-weight:700;margin:4px 0 12px;line-height:1.35}
.qtext.big{font-size:64px;text-align:center;line-height:1.1}
.pic{font-size:64px;text-align:center;line-height:1.1;margin:4px 0}
.passage{background:#FFFBF2;border:2px dashed var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px;max-height:260px;overflow:auto}
.passage h4{margin:0 0 6px;font-size:16px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.passage div{white-space:pre-line;font-size:16px;line-height:1.55}
.audio{display:flex;gap:8px;justify-content:center;margin:6px 0 14px;flex-wrap:wrap}
.play{width:84px;height:84px;border-radius:50%;background:var(--coral);color:#fff;font-size:36px;box-shadow:0 5px 0 #C9483A}
.play:active{transform:translateY(4px);box-shadow:0 1px 0 #C9483A}
.play.speaking{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.small{align-self:center;padding:8px 14px;border-radius:14px;background:#F3EEE4;font-weight:700;font-size:14px}
.transcript{background:#F3EEE4;border-radius:12px;padding:8px 12px;margin:-4px 0 12px;font-size:16px}
.opts{display:grid;gap:10px}
.opt{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:18px;font-weight:600;text-align:left;direction:ltr;box-shadow:0 3px 0 var(--line);display:flex;align-items:center;gap:10px}
.opt .k{width:30px;height:30px;border-radius:10px;background:#F3EEE4;display:grid;place-items:center;font-size:14px;flex:none}
.opt:active{transform:translateY(2px)}
.opt.ok{background:var(--okbg);border-color:var(--ok);box-shadow:0 3px 0 var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);box-shadow:0 3px 0 var(--bad);animation:shake .35s}
.opt.dim{opacity:.55}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tf{grid-template-columns:1fr 1fr}
.tf .opt{justify-content:center;font-size:20px}
input.ans{width:100%;font-family:inherit;font-size:22px;padding:12px 14px;border-radius:16px;border:2px solid var(--line);direction:ltr;text-align:left;outline:none}
input.ans:focus{border-color:var(--teal)}
input.ans.ok{border-color:var(--ok);background:var(--okbg)}input.ans.bad{border-color:var(--bad);background:var(--badbg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;border-radius:16px;font-weight:800;background:var(--ink);color:#fff;box-shadow:0 4px 0 #000;font-size:17px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.teal{background:var(--teal);box-shadow:0 4px 0 #0a7272}
.btn.full{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.row .btn{flex:1}
.line{min-height:62px;border:2px dashed var(--line);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;direction:ltr;margin-bottom:12px;align-content:flex-start}
.line.ok{border-color:var(--ok);background:var(--okbg);border-style:solid}.line.bad{border-color:var(--bad);background:var(--badbg);border-style:solid}
.bank{display:flex;flex-wrap:wrap;gap:8px;direction:ltr}
.tile{padding:8px 14px;border-radius:12px;background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:700;font-size:18px}
.tile.used{visibility:hidden}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;direction:ltr}
.match .col{display:grid;gap:8px;align-content:start}
.mi{padding:10px;border-radius:14px;background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:700;font-size:16px;min-height:52px}
.mi.emo{font-size:30px;padding:4px}
.mi.sel{border-color:var(--teal);background:#E2F7F7}
.mi.done{background:var(--okbg);border-color:var(--ok);box-shadow:none;opacity:.75}
.mi.bad{animation:shake .35s;border-color:var(--bad)}
.fb{margin-top:14px;border-radius:16px;padding:12px 14px;display:none}
.fb.show{display:block;animation:pop .25s}
.fb.ok{background:var(--okbg);color:#0f5f2e}.fb.bad{background:var(--badbg);color:#8f1230}
.fb b{font-size:19px;display:block}
.fb .c{direction:ltr;text-align:left;font-weight:700;margin-top:2px}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.mic{width:96px;height:96px;border-radius:50%;background:var(--teal);color:#fff;font-size:40px;box-shadow:0 5px 0 #0a7272;margin:4px auto 8px;display:grid;place-items:center}
.mic.on{background:var(--bad);box-shadow:0 5px 0 #9b1030;animation:pulse 1s infinite}
.heard{min-height:44px;background:#F3EEE4;border-radius:14px;padding:10px 12px;direction:ltr;text-align:left;font-size:18px;margin-bottom:10px}
.or{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin:12px 0 8px}
.or:before,.or:after{content:"";flex:1;height:2px;background:var(--line)}
.model{background:#FFF3D6;border-radius:14px;padding:10px 12px;margin-top:10px;display:flex;align-items:center;gap:10px}
.model .en{flex:1;font-weight:700;font-size:18px}
.spk{width:40px;height:40px;border-radius:12px;background:#fff;border:2px solid var(--line);font-size:18px;flex:none}
/* result */
.res{text-align:center}
.res .big{font-size:60px;line-height:1}
.res h2{margin:6px 0 0;font-size:28px}
.res .pct{font-size:46px;font-weight:800;color:var(--teal);line-height:1.1}
.res .st{font-size:42px;letter-spacing:4px;margin:6px 0}
.mist{text-align:start;margin-top:16px}
.mist .m{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.mist .m .en{font-weight:700}
.mist .m .a{color:var(--ok);font-weight:700}
/* summary */
.unit{background:#fff;border:2px solid var(--line);border-radius:22px;margin-bottom:12px;overflow:hidden}
.unit summary{list-style:none;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;font-weight:700}
.unit summary::-webkit-details-marker{display:none}
.unit .num{width:44px;height:44px;border-radius:14px;color:#fff;display:grid;place-items:center;font-size:20px;font-weight:800;flex:none}
.unit .ub{padding:0 14px 14px}
.unit h5{margin:10px 0 6px;font-size:15px;color:var(--muted)}
.phr{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:12px;background:#FAF6EE;margin-bottom:6px;width:100%;text-align:left;direction:ltr;font-size:16px}
.phr span{flex:1}
.gl{margin:0;padding-inline-start:20px}
.gl li{margin-bottom:3px}
.adv{background:#FFF3D6;border-radius:12px;padding:8px 12px;margin-top:8px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;z-index:9;max-width:90vw;text-align:center;display:none}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}
@media (min-width:640px){.grid{grid-template-columns:1fr 1fr 1fr}.opts.two{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
// ===== Passages (from the Student's Book) =====
const P = {
falcon:{t:"The Traditional Sport of Falconry",x:"Falconry is a popular sport in the Kingdom of Saudi Arabia. Many people have falcons that are trained to hunt other birds and animals.\nFalcons are very strong birds. They can fly fast and dive even faster. They see very far, so they can spot animals that are kilometers away. They have very sharp talons that they use to attack and catch their prey. They are amazing to watch!"},
race:{t:"Reading Race",x:"A. It is as white as snow and as strong as a lion.\nB. It is as scary as a tiger and as quiet as a fish.\nC. It's beautiful and as fast as the wind.\nD. It is very quiet and as slow as a snail.\nE. It is smaller than a cat and as gray as an elephant."},
jack:{t:"This Is Jack's House",x:"Word bank: snake - cat - house - cow - mouse\n\nThis is Jack's house.\nThis is the cheese that is in Jack's (1) ____.\nThis is the (2) ____ that eats the cheese that is in Jack's house.\nThis is the (3) ____ that chases the mouse that eats the cheese that is in Jack's house.\nThis is the (4) ____ that scares the cat that chases the mouse...\nThis is the (5) ____ with the pointed horns that tosses the snake that scares the cat..."},
robot:{t:"Clever Robot",x:"I have a little robot,\nThe smartest ever seen.\nHe washes my dishes,\nAnd keeps the house clean.\nHe bakes my bread,\nAnd makes me a drink.\nHe sits by the fire,\nAnd gives me a smile."},
doing:{t:"What Are They Doing Now?",x:"What is the good helper doing now?\nShe usually vacuums and cleans up her room,\nEarly in the morning or in the afternoon!\nWhat is she doing now?\nShe's watching TV and eating a snack.\nHer room is clean, her chores all done!\n\nWhat is the good helper doing now?\nHe usually feeds the fish and goes shopping,\nEarly in the morning or in the afternoon!\nWhat is he doing now?\nHe's playing games and sitting back.\nThe fish is full, his chores all done!"},
time:{t:"What Time Do You Do It?",x:"At six o'clock, I jump out of bed and brush my teeth.\nAt one o'clock, I finish school and ride the bus home.\nAt two o'clock, I eat my lunch and meet my friends.\nAt ten o'clock, I jump into bed and dream a lot!"},
crew:{t:"Space Station Crew",x:"Who's he? He's Abdullah. What does he do? He's the pilot. Where does he work? In a station. In the train station? No, in the space station!\n\nWho's he? He's Faisal. What does he do? He's a doctor. Where does he work? In a hospital. In the city hospital? No, in the space hospital.\n\nWho are they? They're Ali and Omar. What do they do? They're the cooks. Where do they work? In a restaurant. In the fast-food restaurant? No, in the space restaurant."},
diary:{t:"Monday, August 31st",x:"Yesterday, my basketball team had a big game. We met at the station to go to the tournament. When I tried to catch a fly ball, I crashed into another player and fell on the ground. I twisted my knee and injured my wrist. It really hurt! After the game, I went to the hospital. Luckily, I am okay now. The doctor was very nice, so I will write him a thank-you note. I want to be a doctor or a basketball player in the future."},
market:{t:"To the Market",x:"Monday morning is market day.\nI go to the market for... one fish, for two fish, three eggs, for four eggs, five plums, for six plums, seven cookies, for eight cookies, nine pies, for ten pies, and bring them back home to eat.\nMonday morning was market day. I went to the market to buy food. But I ate it all. Now I have a tummyache!"},
meet:{t:"Kim's Family",x:"Hello. My name is Kim. I'm eleven years old and I live in New York.\nThis is my mother. Her name is Jasmine.\nThese are my sisters. Their names are Judy and Rose.\nThis is our little brother. His name is Pete."},
camp:{t:"He's Going Camping",x:"He's going camping. He's packing his backpack. His cousins are coming to pick him up! He's packing his socks. He's taking his books. His cousins are calling. He's tying his shoes! Oh! Where are his keys? He has to unpack and look in the bag! They're going camping. He runs out and back!"}
};

const Q=[];
const add=o=>Q.push(o);
// first option is ALWAYS the correct one (options are shuffled on screen)
const mc=(u,s,q,o,ex,x={})=>add({u,s,t:'mcq',q,o,ex,...x});
const li=(u,say,q,o,ex,x={})=>add({u,s:'listen',t:'mcq',say,q,o,ex,...x});
const ty=(u,s,q,ans,ex,x={})=>add({u,s,t:'type',q,ans,ex,...x});
const od=(u,s,ans,ex,x={})=>add({u,s,t:'order',ans,ex,...x});
const sp=(u,q,model,kw,x={})=>add({u,s:'speak',t:'speak',q,model,kw,...x});
const ma=(u,s,q,pairs,ex,x={})=>add({u,s,t:'match',q,pairs,ex,...x});

/* ================= UNIT 1 — It's Nice to Meet You! ================= */
// listening
li(1,"Hi. I'm Jack. What's your name?","What's the boy's name?",["Jack","Hashim","Kim"],"قال: I'm Jack = أنا جاك.");
li(1,"My name's Hashim. I live in Jeddah.","Where does Hashim live?",["In Jeddah","In Riyadh","In Abha"],"I live in Jeddah = أسكن في جدة.");
li(1,"How old are you? I'm eleven years old.","How old is he?",["11","7","12"],"eleven = 11");
li(1,"Faisal lives in Madinah. He is twelve years old.","Faisal is ...",["12 years old and lives in Madinah","10 years old and lives in Dammam","12 years old and lives in Jizan"],"twelve = 12، Madinah = المدينة.");
li(1,"These are my sisters. Their names are Judy and Rose.","What are the sisters' names?",["Judy and Rose","Jasmine and Kim","Pete and Rose"],"Their names = أسماؤهن.");
li(1,"Whose shoes are these? They're Steve's.","Whose shoes are they?",["Steve's","Ken's","Kim's"],"Steve's = تخص ستيف.");
li(1,"Nice to meet you.","Choose the best reply.",["Nice to meet you, too.","I'm eleven.","I live in Jeddah."],"الرد على Nice to meet you هو Nice to meet you, too.");
// speaking
sp(1,"What's your name?","My name's Hashim.",["name","im \\w+","i am"],{pic:"🙋‍♂️"});
sp(1,"How old are you?","I'm eleven years old.",["years old","im \\w+","i am"],{pic:"🎂"});
sp(1,"Where do you live?","I live in Riyadh.",["live in","i live"],{pic:"🏠"});
sp(1,"Nice to meet you.","Nice to meet you, too.",["too"],{pic:"🤝"});
sp(1,"Whose bag is this? (It belongs to you.)","It's mine.",["mine"],{pic:"🎒"});
// reading
mc(1,'read',"How old is Kim?",["Eleven","Twelve","Ten"],"I'm eleven years old.",{p:'meet'});
mc(1,'read',"Where does Kim live?",["In New York","In Jeddah","In Abha"],"I live in New York.",{p:'meet'});
mc(1,'read',"Who is Jasmine?",["Kim's mother","Kim's sister","Kim's friend"],"This is my mother. Her name is Jasmine.",{p:'meet'});
mc(1,'read',"Pete is Kim's ...",["little brother","father","sister"],"This is our little brother. His name is Pete.",{p:'meet'});
// grammar
mc(1,'grammar',"This is my mother. ___ name is Jasmine.",["Her","His","Their"],"للمؤنث نستخدم Her.");
mc(1,'grammar',"This is our little brother. ___ name is Pete.",["His","Her","Our"],"للمذكر نستخدم His.");
mc(1,'grammar',"These are my sisters. ___ names are Judy and Rose.",["Their","Her","His"],"للجمع (هم/هن) نستخدم Their.");
mc(1,'grammar',"Ali and I are friends. ___ names are Ali and Sami.",["Our","Their","Your"],"نحن = Our.");
mc(1,'grammar',"Whose pen is this? It's ___. (I)",["mine","my","me"],"mine = ملكي (بدون اسم بعده).");
mc(1,'grammar',"This bag is Sara's. It's ___.",["hers","her","his"],"hers = ملكها.");
mc(1,'grammar',"These toys belong to the boys. They're ___.",["theirs","their","ours"],"theirs = ملكهم.");
mc(1,'grammar',"Is this your book? Yes, it's ___.",["mine","yours","his"],"الكتاب لي ← mine.");
mc(1,'grammar',"___ shoes are these?",["Whose","Who","Where"],"Whose = لمن.");
mc(1,'grammar',"Choose the correct question:",["Whose shoes are these?","Whose shoes is this?","Whose shoe are these?"],"shoes جمع ← are these.");
mc(1,'grammar',"He ___ eleven years old.",["is","are","am"],"He/She ← is");
mc(1,'grammar',"They ___ from Abha.",["are","is","am"],"They ← are");
mc(1,'grammar',"I ___ a b. You have an i.",["have","has","having"],"I/You/We/They ← have");
mc(1,'grammar',"He ___ a c. She has a y.",["has","have","is"],"He/She ← has");
mc(1,'grammar',"You have ___ i.",["an","a","the"],"قبل الحرف المتحرك (a,e,i,o,u) نستخدم an.");
mc(1,'grammar',"I have a d, an e, and an s. You have an r and an s. Can we write 'hat'?",["No, we can't.","Yes, we can.","Yes, we do."],"لا يوجد حرف h ولا t ← No, we can't.");
od(1,'grammar',"What's your name?","");
od(1,'grammar',"Where do you live?","");
od(1,'grammar',"Their names are Judy and Rose.","");
// phonics
mc(1,'phonics',"s _ _ l  (🦭)",["ea → seal","ee → seel","ai → sail"],"seal = فقمة، تكتب ea.");
mc(1,'phonics',"sh _ _ p  (🐑)",["ee → sheep","ea → sheap","ie → shiep"],"sheep تكتب ee.");
mc(1,'phonics',"p _ _ ch  (🍑)",["ea → peach","ee → peech","ai → paich"],"peach تكتب ea.");
mc(1,'phonics',"sl _ _ p  (😴)",["ee → sleep","ea → sleap","ay → slayp"],"sleep تكتب ee.");
mc(1,'phonics',"Which word has the same vowel sound as 'rain'?",["play","pie","meat"],"ai و ay لهما نفس الصوت: rain / play / day / train.");
mc(1,'phonics',"Which word has the same vowel sound as 'tie'?",["rice","train","cheese"],"ie و i_e: tie / pie / rice / pine.");
mc(1,'phonics',"I like to eat ___ . (لحم)",["meat","meet","mat"],"meat = لحم، meet = يقابل.");
mc(1,'phonics',"Nice to ___ you.",["meet","meat","met"],"meet = يقابل.");
ty(1,'phonics',"Listen and write the word.",["cheese"],"cheese تكتب ee.",{say:"cheese",spell:1});
ty(1,'phonics',"Listen and write the word.",["train"],"train تكتب ai.",{say:"train",spell:1});
// vocab
mc(1,'vocab',"Advice Time: Show me your friend and ...",["I'll tell you who you are.","I'll tell you where you live.","we can play together."],"الحكمة: قل لي من صديقك أقل لك من أنت.");

/* ================= UNIT 2 — Sea Animals ================= */

  });
}

      while(out.length<n&&keys.some(k=>by[k].length)){const k=keys[i++%keys.length];if(by[k].length)out.push(by[k].shift())}
      pool=shuf(out);
    }else{pool=shuf(pool);if(count)pool=pool.slice(0,count)}
  }
  if(!pool.length){toast('لا توجد أسئلة لهذا الاختيار');return}
  S={sec,list:pool,i:0,score:0,wrong:[],cur:null};next(true);
}
function next(first){
  if(!first)S.i++;
  if(S.i>=S.list.length)return result();
  S.cur=S.list[S.i];S.done=false;S.st={};
  render(true);window.scrollTo(0,0);
  // auto-play listening audio
  if(S.cur.say&&!S.cur.spell&&S.cur.s==='listen'){}
}
function answered(ok,correctTxt){
  if(S.done)return;S.done=true;
  if(ok){S.score++;sfx.ok()}else{sfx.bad();S.wrong.push({q:S.cur,c:correctTxt})}
  const fb=$('#fb');const q=S.cur;
  fb.className='fb show '+(ok?'ok':'bad');
  const praise=['أحسنت! 🌟','ممتاز! 🎉','رائع! 👏','إجابة صحيحة! ✅'];
  fb.innerHTML=`<b>${ok?praise[Math.floor(Math.random()*praise.length)]:'إجابة خاطئة ❌'}</b>${!ok&&correctTxt?`<div>الإجابة الصحيحة:</div><div class="c">${esc(correctTxt)}</div>`:''}${q.ex?`<div style="margin-top:4px">${isAr(q.ex)?'':'<span class="en">'}${esc(q.ex)}${isAr(q.ex)?'':'</span>'}</div>`:''}`;
  const tr=$('#tr');if(tr)tr.style.display='block';
  $('#nx').style.display='flex';
  setTimeout(()=>fb.scrollIntoView({behavior:'smooth',block:'nearest'}),50);
}
function render(auto){
  const q=S.cur,sec=SEC[q.s];
  const pct=Math.round(S.i/S.list.length*100);
  let h=`<div class="qbar"><button class="x" id="quit" aria-label="خروج">✕</button><div class="prog"><i style="width:${pct}%"></i></div><span class="cnt">${S.i+1} / ${S.list.length}</span></div>
  <div class="card"><div class="tags"><span class="tag">${sec.ic} ${sec.ar}</span><span class="tag">Unit ${q.u}</span>${q.wb?'<span class="tag">📒 Workbook</span>':''}${q.snd?`<span class="tag en">${esc(q.snd)}</span>`:''}<span class="tag">✔ ${S.score}</span></div>`;
  if(q.p){const p=P[q.p];h+=`<div class="passage"><h4><span class="en">${esc(p.t)}</span><button class="spk" id="pread" aria-label="استمع للنص">🔊</button></h4><div class="en">${esc(p.x)}</div></div>`}
  let inst=q.t==='mcq'?(q.s==='listen'?'استمع ثم اختر الإجابة الصحيحة':q.p?'اقرأ النص ثم أجب':TYPE_AR.mcq):TYPE_AR[q.t];
  if(q.t==='type'&&q.spell)inst='استمع للكلمة ثم اكتبها بشكل صحيح';
  if(q.t==='match')inst=q.q+' — '+TYPE_AR.match;
  if(q.pron)inst='اقرأ الكلمة بصوت عالٍ، ثم استمع للنطق الصحيح وقارن';
  if(q.s==='sounds'&&q.t==='mcq')inst='استمع للكلمة ثم اختر الإجابة';
  h+=`<p class="inst">${esc(inst)}</p>`;
  if(q.say&&q.t!=='speak'){h+=`<div class="audio"><button class="play" id="play" aria-label="تشغيل">🔊</button><button class="small" id="slow">🐢 ببطء</button>${(q.spell||q.s==='sounds')?'':'<button class="small" id="showtr">📄 اعرض النص</button>'}</div>${q.spell?'':`<div class="transcript en" id="tr" style="display:none">${esc(q.say)}</div>`}`}
  if(q.pic)h+=`<div class="pic">${q.pic}</div>`;
  if(q.t!=='match'&&q.t!=='order'&&q.q&&!(q.t==='type'&&q.spell)){
    const big=onlyEmoji(q.q);
    h+=`<div class="qtext ${big?'big':''} ${isAr(q.q)?'':'en'}">${esc(q.q)}${q.t==='speak'?` <button class="spk" id="qsay" style="vertical-align:middle">🔊</button>`:''}</div>`;
  }
  h+=`<div id="body"></div><div class="fb" id="fb"></div><div class="row" id="nx" style="display:none"><button class="btn full teal" id="nextb">${S.i+1<S.list.length?'السؤال التالي ←':'اعرض النتيجة 🏁'}</button></div></div>`;
  app.innerHTML=h;
  $('#quit').onclick=()=>{if(S.i>0&&!confirmQuit())return;home()};
  $('#nextb').onclick=()=>next();
  if($('#play')){$('#play').onclick=e=>say(q.say,false,e.currentTarget);$('#slow').onclick=()=>say(q.say,true,$('#play'))}
  if($('#showtr'))$('#showtr').onclick=()=>{$('#tr').style.display='block'};
  if($('#pread'))$('#pread').onclick=e=>say(P[q.p].x.replace(/Word bank:[^\n]*\n/,'').replace(/\(\d\) ____/g,'blank'),false,e.currentTarget);
  if($('#qsay'))$('#qsay').onclick=e=>say(q.q.replace(/\(.*?\)/g,''),false,e.currentTarget);
  ({mcq:bMcq,type:bType,order:bOrder,speak:bSpeak,match:bMatch})[q.t](q,$('#body'));
  if(auto){if(q.say&&q.t!=='speak')say(q.say,false,$('#play'));else if(q.t==='speak'&&!q.pron)say(q.q.replace(/\(.*?\)/g,''))}
}
let quitArm=0;function confirmQuit(){if(Date.now()-quitArm<2500)return true;quitArm=Date.now();toast('اضغط ✕ مرة أخرى للخروج');return false}

/* ---------- question types ---------- */
function bMcq(q,el){
  const correct=q.o[0];const tf=q.o.length===2&&/^(True|False)$/.test(q.o[0]);
  const opts=tf?['True','False']:shuf(q.o);
  const L='ABCD';
  el.innerHTML=`<div class="opts ${tf?'tf':''}">${opts.map((o,i)=>`<button class="opt" data-o="${esc(o)}">${tf?(o==='True'?'✔ True':'✘ False'):`<span class="k">${L[i]}</span>`}<span>${esc(o)}</span></button>`).join('')}</div>`;
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(S.done)return;const ok=b.dataset.o===correct;
    el.querySelectorAll('.opt').forEach(x=>{if(x.dataset.o===correct)x.classList.add('ok');else if(x!==b)x.classList.add('dim')});
    if(!ok)b.classList.add('bad');answered(ok,correct)});
}
function bType(q,el){
  el.innerHTML=`<input class="ans" id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type here..."><div class="row"><button class="btn full" id="chk">تحقق ✓</button></div>`;
  const i=$('#ti'),go=()=>{if(S.done)return;const v=norm(i.value);if(!v){toast('اكتب إجابتك أولاً');return}
    const ok=q.ans.some(a=>norm(a)===v);i.classList.add(ok?'ok':'bad');i.disabled=true;$('#chk').style.display='none';answered(ok,q.ans[0]+(q.spell?'  ('+q.ans[0].split('').join('-')+')':''))};
  $('#chk').onclick=go;i.onkeydown=e=>{if(e.key==='Enter')go()};
}
function bOrder(q,el){
  const words=q.ans.split(' ');let bank=shuf(words.map((w,i)=>({w,i})));
  if(bank.map(x=>x.w).join(' ')===q.ans&&words.length>2)bank=bank.slice(1).concat(bank[0]);
  const picked=[];
  el.innerHTML=`<div class="line" id="ln"></div><div class="bank" id="bk"></div><div class="row"><button class="btn alt" id="clr">↺ مسح</button><button class="btn" id="chk">تحقق ✓</button></div>`;
  const draw=()=>{$('#ln').innerHTML=picked.map((x,k)=>`<button class="tile" data-k="${k}">${esc(x.w)}</button>`).join('');
    $('#bk').innerHTML=bank.map((x,k)=>`<button class="tile ${picked.includes(x)?'used':''}" data-b="${k}">${esc(x.w)}</button>`).join('');
    $('#ln').querySelectorAll('.tile').forEach(t=>t.onclick=()=>{if(S.done)return;picked.splice(+t.dataset.k,1);draw()});
    $('#bk').querySelectorAll('.tile').forEach(t=>t.onclick=()=>{if(S.done)return;const x=bank[+t.dataset.b];if(!picked.includes(x)){picked.push(x);draw()}})};
  draw();
  $('#clr').onclick=()=>{if(S.done)return;picked.length=0;draw()};
  $('#chk').onclick=()=>{if(S.done)return;if(picked.length<words.length){toast('استخدم كل الكلمات');return}
    const ok=picked.map(x=>x.w).join(' ')===q.ans;$('#ln').classList.add(ok?'ok':'bad');$('#clr').style.display=$('#chk').style.display='none';answered(ok,q.ans);say(q.ans)};
}
function bMatch(q,el){
  const left=shuf(q.pairs.map((p,i)=>({t:p[0],i}))),right=shuf(q.pairs.map((p,i)=>({t:p[1],i})));
  let sel=null,miss=0,done=0;
  el.innerHTML=`<div class="match"><div class="col" id="cl">${left.map(x=>`<button class="mi ${onlyEmoji(x.t)?'emo':''}" data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div><div class="col" id="cr">${right.map(x=>`<button class="mi" data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div></div>`;
  el.querySelectorAll('#cl .mi').forEach(b=>b.onclick=()=>{if(b.classList.contains('done'))return;el.querySelectorAll('#cl .mi').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b});
  el.querySelectorAll('#cr .mi').forEach(b=>b.onclick=()=>{if(b.classList.contains('done')||S.done)return;if(!sel){toast('اختر من العمود الأيسر أولاً');return}
    if(sel.dataset.i===b.dataset.i){sel.classList.remove('sel');sel.classList.add('done');b.classList.add('done');fx('tap');done++;if(!/^[^A-Za-z]+$/.test(b.textContent))say(b.textContent);sel=null;
      if(done===q.pairs.length){const ok=miss===0;answered(ok,ok?'':'عدد الأخطاء: '+miss);if(!ok){$('#fb').querySelector('b').textContent='أكملت التوصيل مع '+miss+' خطأ — حاول بدون أخطاء 💪'}}}
    else{miss++;b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');fx('no')}});
}
function bSpeak(q,el){
  const kws=q.kw.map(k=>new RegExp('\\b(?:'+k+')','i'));
  const check=txt=>{const n=norm(txt);return kws.some(r=>r.test(n))};
  let heard='';
  let h='';
  if(DICT){h+=`<button class="mic" id="mic" aria-label="تحدث">🎤</button><p class="inst" style="text-align:center" id="mst">اضغط المايك وتحدث، ثم اضغط مرة أخرى للإنهاء</p><div class="heard" id="hd"></div><div class="or">أو اكتب إجابتك</div>`}
  if(!q.pron)h+=`<input class="ans" id="ti" autocomplete="off" placeholder="type your answer..."><div class="row"><button class="btn" id="chk">تحقق ✓</button></div>`;
  h+=`<div class="or">${q.pron?'قلها بصوت عالٍ ثم قارن':'أو قلها بصوت عالٍ وقيّم نفسك'}</div><button class="btn alt full" id="self">🗣️ قلتها — اعرض الإجابة النموذجية</button><div id="mdl"></div>`;
  el.innerHTML=h;
  const showModel=(selfAssess)=>{$('#mdl').innerHTML=`<div class="model"><button class="spk" id="ms">🔊</button><span class="en">${esc(q.model)}</span></div>${selfAssess?`<p class="inst" style="margin-top:10px">هل كانت إجابتك صحيحة ومشابهة للنموذج؟</p><div class="row"><button class="btn teal" id="y">✅ نعم</button><button class="btn alt" id="n">❌ أحتاج تدريباً</button></div>`:''}`;
    $('#ms').onclick=e=>say(q.model,false,e.currentTarget);
    if(selfAssess){$('#y').onclick=()=>{$('#y').parentNode.remove();answered(true)};$('#n').onclick=()=>{$('#y').parentNode.remove();answered(false,q.model)}}};
  const finish=(txt,src)=>{if(S.done)return;const ok=check(txt);
    if(src==='t'){$('#ti').classList.add(ok?'ok':'bad')}
    ['chk','self'].forEach(id=>{const b=$('#'+id);if(b)b.style.display='none'});const ti=$('#ti');if(ti)ti.disabled=true;
    showModel(false);answered(ok,q.model);if(!ok)$('#fb').insertAdjacentHTML('beforeend','<div style="margin-top:4px">💡 استمع للنموذج وكرّره بصوت عالٍ.</div>')};
  if(!q.pron){$('#chk').onclick=()=>{const v=$('#ti').value;if(!norm(v)){toast('اكتب إجابتك أولاً');return}finish(v,'t')};
  $('#ti').onkeydown=e=>{if(e.key==='Enter')$('#chk').click()};}
  $('#self').onclick=()=>{if(S.done)return;$('#self').style.display='none';showModel(true);say(q.model,!!q.pron)};
  if(DICT){
    const mic=$('#mic');let on=false;
    dictH={partial:t=>{$('#hd')&&($('#hd').textContent=(heard+' '+t).trim())},final:t=>{heard=(heard+' '+t).trim();$('#hd')&&($('#hd').textContent=heard)},
      state:(st,reason)=>{if(!$('#mic'))return;on=st==='listening';mic.classList.toggle('on',on);mic.textContent=on?'⏹':'🎤';if(!on&&heard&&!S.done)finish(heard,'m')}};
    mic.onclick=()=>{if(S.done)return;if(on){DICT.stop().catch(()=>{});return}heard='';$('#hd').textContent='';
      DICT.start().catch(e=>{const c=e&&e.code||e;if(c==='not_granted'){toast('لم يُسمح بالمايك — اكتب إجابتك أو قيّم نفسك');mic.remove();$('#mst').remove();$('#hd').remove()}else toast('تعذّر تشغيل المايك، حاول مرة أخرى')})};
  }
  setTimeout(()=>{},0);
}

/* ---------- RESULT ---------- */
function result(){
  const n=S.list.length,p=Math.round(S.score/n*100);
  const st=p>=90?3:p>=70?2:p>=50?1:0;
  stars+=st;store.set('stars',stars);
  if(!S.retry){const best=store.get('best',{});if(S.sec!=='all'){best[S.sec]=Math.max(best[S.sec]||0,p);store.set('best',best)}}
  const msg=p>=90?['🏆','بطل! أنت جاهز للاختبار']:p>=70?['🎉','ممتاز! راجع أخطاءك القليلة']:p>=50?['💪','جيد! تحتاج مزيداً من التدريب']:['📚','لا بأس — راجع ملخص الوحدات ثم حاول مجدداً'];
  if(p>=70){sfx.win();confetti()}
  app.innerHTML=`<div class="card res"><div class="big">${msg[0]}</div><h2>${msg[1]}</h2><div class="pct">${p}%</div><div>${S.score} من ${n} إجابات صحيحة</div><div class="st">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</div>
  <div class="row">${S.wrong.length?'<button class="btn teal" id="rw">🔁 أعد الأخطاء فقط</button>':''}<button class="btn" id="again">جولة جديدة</button><button class="btn alt" id="hm">🏠 الرئيسية</button></div>
  ${S.wrong.length?`<div class="mist"><div class="label">راجع أخطاءك</div>${S.wrong.map(w=>{const q=w.q;const t=q.t==='order'?'ترتيب جملة':q.t==='match'?q.q:(q.q||q.say);return `<div class="m"><div class="${isAr(t)?'':'en'}">${esc(t)}</div>${q.say&&q.s==='listen'?`<div class="en" style="color:var(--muted)">🎧 ${esc(q.say)}</div>`:''}${w.c?`<div class="a en">✔ ${esc(w.c)}</div>`:''}${q.ex?`<div style="font-size:14px;color:var(--muted)">${esc(q.ex)}</div>`:''}</div>`}).join('')}</div>`:''}</div>`;
  const wl=S.wrong.map(w=>w.q),sec=S.sec;
  if($('#rw'))$('#rw').onclick=()=>{start(sec,shuf(wl));S.retry=1};
  $('#again').onclick=()=>start(sec);$('#hm').onclick=home;
  window.scrollTo(0,0);
}

/* ---------- SOUND LAB ---------- */
function soundLab(){
  window.scrollTo(0,0);S=null;
  const byU={};SOUNDS.forEach(s=>(byU[s.u]=byU[s.u]||[]).push(s));
  const cnt=Q.filter(q=>q.s==='sounds'&&units.has(q.u)).length;
  app.innerHTML=`<div class="qbar"><button class="x" id="bk">→</button><h2 style="margin:0;font-size:22px">🔊 الأصوات الجديدة</h2></div>
  <section class="hero" style="background:#7A1747"><h2>مختبر الأصوات</h2><p>اضغط على أي كلمة لتسمعها، ثم كرّرها بصوتك. بعد ذلك اختبر نفسك: اسمع الكلمة واختر تهجئتها الصحيحة، وابحث عن الكلمات المتشابهة في الصوت، واقرأ بصوت عالٍ.</p><button class="go" id="sq">🎯 اختبر كل الأصوات (${cnt})</button></section>
  ${Object.keys(byU).map(u=>`<div class="label">Unit ${u}</div>${byU[u].map((s,k)=>`<div class="unit" style="padding:12px 14px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span class="num en" style="background:${UNITS[u-1].c};width:auto;min-width:54px;padding:0 10px;font-size:18px">${esc(s.p.trim())}</span><span style="flex:1;font-weight:700">${esc(s.ar)}</span><button class="small" data-snd="${esc(s.p.trim())}">اختبرني</button></div>
   <div class="bank">${s.w.map(w=>`<button class="tile" data-say="${esc(w)}">${hl(w,s.p.trim())} 🔊</button>`).join('')}</div></div>`).join('')}`).join('')}
  <p class="foot">💡 الحروف الملوّنة في كل كلمة هي التي تصنع الصوت</p>`;
  $('#bk').onclick=home;$('#sq').onclick=()=>start('sounds');
  app.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say,true));
  app.querySelectorAll('[data-snd]').forEach(b=>b.onclick=()=>{const l=shuf(Q.filter(q=>q.snd===b.dataset.snd));start('sounds',l)});
}
function hl(w,p){
  const lw=w.toLowerCase();let i=-1,len=0;
  if(p.includes('_')){const m=lw.match(new RegExp(p[0]+'[^aeiou]e$'));if(m){i=m.index;len=3;
    return esc(w.slice(0,i))+'<b style="color:#E11D74">'+esc(w[i])+'</b>'+esc(w[i+1])+'<b style="color:#E11D74">e</b>'}}
  else if(p.includes('/')){const e=p.startsWith('es')?'es':'s';i=lw.length-e.length;len=e.length}
  else{i=lw.indexOf(p);len=p.length}
  if(i<0)return esc(w);
  return esc(w.slice(0,i))+'<b style="color:#E11D74">'+esc(w.slice(i,i+len))+'</b>'+esc(w.slice(i+len));
}

/* ---------- SUMMARY ---------- */
function summary(){
  window.scrollTo(0,0);
  app.innerHTML=`<div class="qbar"><button class="x" id="bk">→</button><h2 style="margin:0;font-size:22px">📝 ملخص الوحدات</h2></div>
  ${UNITS.map(u=>`<details class="unit" ${u.n===1?'open':''}><summary><span class="num" style="background:${u.c}">${u.n}</span><span><span class="en" style="display:block">${esc(u.en)}</span><small style="color:var(--muted)">${u.ar}</small></span></summary><div class="ub">
   <h5>🗣️ الجمل الأساسية (اضغط لتسمع)</h5>${u.ph.map(p=>`<button class="phr" data-say="${esc(p)}"><span>${esc(p)}</span>🔊</button>`).join('')}
   <h5>✏️ القواعد</h5><ul class="gl">${u.g.map(g=>`<li>${esc(g)}</li>`).join('')}</ul>
   <h5>🔤 الأصوات</h5><div class="en">${esc(u.s)}</div>
   <div class="adv">💡 <span class="en">${esc(u.ad)}</span></div>
   <div class="row"><button class="btn teal" data-unit="${u.n}">تدرّب على الوحدة ${u.n} ←</button></div></div></details>`).join('')}`;
  $('#bk').onclick=home;
  app.querySelectorAll('.phr').forEach(b=>b.onclick=()=>say(b.dataset.say));
  app.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{units=new Set([+b.dataset.unit]);start('all')});
}
home();
})();
