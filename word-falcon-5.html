<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>صقر الكلمات ٥</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b3b66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="صقر الكلمات ٥">
<link rel="apple-touch-icon" sizes="180x180" href="https://kprpwd2wgn-ops.github.io/Rakan/word-falcon-5-icon-v2.png">
<link rel="icon" type="image/png" sizes="32x32" href="https://kprpwd2wgn-ops.github.io/Rakan/word-falcon-5-icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="https://kprpwd2wgn-ops.github.io/Rakan/word-falcon-5-icon-192.png">
<link rel="manifest" href="https://kprpwd2wgn-ops.github.io/Rakan/word-falcon-5.webmanifest">
<meta property="og:title" content="صقر الكلمات ٥">
<meta property="og:image" content="https://kprpwd2wgn-ops.github.io/Rakan/word-falcon-5-icon-v2.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* صقر الكلمات — one bright desert-sky look (a deliberate single theme: every color is set here, light only).
   Layout: one column, max 560px, big touch targets; the falcon card is the home's hero. */
:root{
  --night:#0b3b66; --night2:#1d5f9e; --sky:#cfe9ff; --sky2:#e9f5ff; --sand:#fff4de; --sand2:#f6dcac; --dune:#e9bf78;
  --ink:#1c2740; --ink2:#5a6684; --line:#e7dcc6; --card:#ffffff; --card2:#fffaf0;
  --gold:#f2b632; --gold2:#b7800a; --ok:#16a34a; --ok2:#0f7a35; --okbg:#dcfce7; --bad:#e5484d; --bad2:#a8262b; --badbg:#ffe4e4;
  --blue:#2563eb; --blue2:#1e40af; --teal:#0d9488;
  --f-ar:'Baloo Bhaijaan 2', 'Segoe UI', Tahoma, Arial, sans-serif;
  --f-en:'Andika', 'Fredoka', 'Segoe UI', Arial, sans-serif;
  --f-num:'Fredoka', 'Baloo Bhaijaan 2', 'Segoe UI', Arial, sans-serif;
  --emo:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
  --r:20px; --sh:0 6px 0 rgba(28,39,64,.10), 0 10px 24px rgba(28,39,64,.08);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--sand)}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 30%,var(--sand) 72%) fixed;color:var(--ink);font-family:var(--f-ar);font-size:17px;line-height:1.55;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--night)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.en{font-family:var(--f-en);direction:ltr;unicode-bidi:isolate}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 28px;min-height:100vh}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 14px;padding:10px max(16px,env(safe-area-inset-left,0px));background:var(--night);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.bar h1{flex:1;margin:0;font-size:20px;font-weight:800;line-height:1.2;text-wrap:balance;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .ib{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:20px;flex:none}
.bar .ib:active{transform:translateY(1px)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.16);font-weight:700;font-size:15px;white-space:nowrap}
.chip b{font-family:var(--f-num)}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:10px 18px;border-radius:18px;background:var(--gold);color:#3b2600;font-weight:800;font-size:20px;box-shadow:0 5px 0 var(--gold2);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold2)}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--blue2)}
.btn.green{background:var(--ok);color:#fff;box-shadow:0 5px 0 var(--ok2)}
.btn.soft{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);font-size:17px;min-height:50px}
.btn.small{min-height:44px;font-size:16px;border-radius:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.stack{display:grid;gap:12px}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.muted{color:var(--ink2)}
.small{font-size:14px}
.center{text-align:center}
.sec{margin:22px 4px 10px;font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px}
.sec small{font-weight:600;color:var(--ink2);font-size:14px}
.pbar{height:12px;border-radius:99px;background:#efe6d3;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),#ffd76a);transition:width .5s}
.pbar.green i{background:linear-gradient(90deg,#22c55e,#86efac)}

/* ---------- pictures ---------- */
.pic{display:inline-grid;place-items:center;line-height:1;--ps:64px}
.pic.emo{font-family:var(--emo);font-size:var(--ps);height:calc(var(--ps) * 1.15)}
.pic.emo.multi{font-size:calc(var(--ps) * .7);letter-spacing:-.05em}
.pic.svgpic svg{width:calc(var(--ps) * 1.25);height:calc(var(--ps) * 1.25)}
.pairpic{display:inline-flex;align-items:center;gap:6px;font-family:var(--emo)}
.pairpic .pa{font-size:var(--ps);line-height:1.15;border-radius:50%;padding:4px 8px;box-shadow:0 0 0 4px #f59e0b inset,0 0 0 4px rgba(245,158,11,.25);background:rgba(250,204,21,.18)}
.pairpic .pb{font-size:calc(var(--ps) * .55);opacity:.4;filter:grayscale(.5)}
.hl{fill:rgba(250,204,21,.28);stroke:#f59e0b;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:hlp 1.4s ease-in-out infinite}
@keyframes hlp{50%{transform:scale(1.12);fill:rgba(250,204,21,.45)}}

/* ---------- the falcon ---------- */
.falcon{width:100%;height:100%;overflow:visible}
.falcon .lid{transform-box:fill-box;transform-origin:top;transform:scaleY(0);animation:blink 4.6s infinite}
.falcon .lid{height:30px}
@keyframes blink{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
.falcon .spk{transform-box:fill-box;transform-origin:center;animation:spk 1.8s ease-in-out infinite}
@keyframes spk{50%{transform:scale(.4) rotate(40deg);opacity:.5}}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.hop{animation:hop .55s ease-out}
@keyframes hop{30%{transform:translateY(-18px) scale(1.04)}60%{transform:translateY(0) scale(.98)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.25)}}

/* ---------- splash and talking falcon ---------- */
.splash{min-height:calc(100vh - 40px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding-block:30px}
.splash .fbig{width:min(62vw,250px);aspect-ratio:1;max-width:100%}
.splash h1{margin:0;font-size:44px;line-height:1.05;color:var(--night);font-weight:800}
.splash .tag{margin:0;font-size:18px;color:var(--ink2);max-width:22em}
.splash .enname{font-family:var(--f-num);font-weight:700;color:var(--night2);letter-spacing:.06em;font-size:15px}
.splash .btn{max-width:320px}
.bubble{position:relative;background:var(--card);border-radius:22px;padding:14px 18px;box-shadow:var(--sh);font-size:19px;font-weight:700;text-align:center}
.bubble::after{content:"";position:absolute;bottom:-12px;right:50%;transform:translateX(50%);border:12px solid transparent;border-top-color:var(--card);border-bottom:0}
.talkf{display:grid;justify-items:center;gap:6px}
.talkf .fmid{width:150px;height:150px}

/* ---------- home ---------- */
.hero{position:relative;border-radius:26px;overflow:hidden;box-shadow:var(--sh);background:var(--night)}
.hero .scene{position:absolute;inset:0}
.hero .scene svg{width:100%;height:100%;display:block}
.hero .in{position:relative;display:flex;align-items:flex-end;gap:10px;padding:14px 14px 12px;min-height:200px}
.hero .fhome{width:150px;height:150px;flex:none;cursor:pointer}
.hero .rk{flex:1;min-width:0;background:rgba(255,255,255,.92);border-radius:18px;padding:10px 12px}
.hero .rk .rn{display:block;font-size:20px;line-height:1.25}
.hero .rk .en{font-size:13px;color:var(--ink2)}
.hero .rk .pbar{margin:8px 0 4px}
.today{display:flex;align-items:center;gap:14px}
.ring{--p:0;width:74px;height:74px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--ok) calc(var(--p) * 1%),#e8efe0 0);position:relative}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--card)}
.ring span{position:relative;font-family:var(--f-num);font-weight:700;font-size:18px}
.today .t{flex:1;min-width:0}
.today .t b{display:block;font-size:18px}
.big{display:flex;align-items:center;gap:14px;width:100%;text-align:right;padding:14px 16px;border-radius:22px;background:var(--card);box-shadow:0 5px 0 var(--line);min-height:84px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.big .ico{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:32px;flex:none;font-family:var(--emo)}
.big .tx{flex:1;min-width:0}
.big .tx b{display:block;font-size:20px;line-height:1.25}
.big .tx small{display:block;color:var(--ink2);font-size:14px;line-height:1.4}
.big .go{font-size:22px;color:var(--ink2)}
.big.main{background:linear-gradient(135deg,#ffcf4d,#f2b632);box-shadow:0 5px 0 var(--gold2)}
.big.main .tx small{color:#5a3d00}
.badge{min-width:30px;height:30px;padding:0 8px;border-radius:99px;background:var(--bad);color:#fff;display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:16px}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini{display:grid;justify-items:center;gap:2px;padding:12px 6px;border-radius:18px;background:var(--card);box-shadow:0 4px 0 var(--line);font-weight:700;font-size:15px}
.mini span{font-size:28px;font-family:var(--emo)}
.prevw{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.prevw .pic{--ps:22px}

/* ---------- map ---------- */
.stagehd{display:flex;align-items:center;gap:12px;margin:22px 2px 10px}
.stagehd .st{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-size:24px;background:var(--night);color:#fff;font-family:var(--f-num);font-weight:700;flex:none}
.stagehd b{display:block;font-size:19px;line-height:1.2}
.stagehd small{color:var(--ink2)}
.topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tcard{position:relative;display:grid;gap:6px;justify-items:start;text-align:right;padding:14px 12px 12px;border-radius:22px;background:var(--card);box-shadow:0 5px 0 var(--line);min-height:150px}
.tcard:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.tcard .ti{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:28px;font-family:var(--emo)}
.tcard b{font-size:17px;line-height:1.3}
.tcard .en{font-size:12.5px;color:var(--ink2);line-height:1.2}
.tcard .pbar{width:100%;height:9px}
.tcard .cnt{font-size:13px;color:var(--ink2);font-family:var(--f-num)}
.tcard .done{position:absolute;top:10px;left:10px;font-size:20px}
.tcard.next{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- topic ---------- */
.thead{display:flex;align-items:center;gap:14px}
.thead .ti{width:70px;height:70px;border-radius:22px;display:grid;place-items:center;font-size:40px;flex:none;font-family:var(--emo)}
.thead b{display:block;font-size:22px;line-height:1.25}
.lessons{display:grid;gap:10px}
.lcard{display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:12px 14px;border-radius:20px;background:var(--card);box-shadow:0 4px 0 var(--line)}
.lcard:active{transform:translateY(2px)}
.lcard .ln{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:20px;color:#fff;flex:none}
.lcard .lx{flex:1;min-width:0}
.lcard .lx b{display:block}
.lcard .stars{font-size:18px;letter-spacing:1px;color:var(--gold)}
.stars .off{color:#e3d9c4}
.wgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wtile{display:grid;justify-items:center;gap:2px;padding:10px 4px 8px;border-radius:16px;background:var(--card);box-shadow:0 3px 0 var(--line);min-width:0}
.wtile .pic{--ps:40px}
.wtile .en{font-weight:700;font-size:15px;line-height:1.2;max-width:100%;overflow-wrap:anywhere;text-align:center}
.wtile .ar{font-size:12.5px;color:var(--ink2);line-height:1.25;text-align:center}
.wtile .lv{display:flex;gap:2px;margin-top:2px}
.wtile .lv i{width:7px;height:7px;border-radius:50%;background:#e8dfcd}
.wtile .lv i.on{background:var(--ok)}
.wtile.new{opacity:.62}

/* ---------- lesson: meet card ---------- */
.dots{display:flex;gap:6px;justify-content:center;margin:2px 0 12px}
.dots i{width:10px;height:10px;border-radius:50%;background:#e2d6bd}
.dots i.on{background:var(--gold);transform:scale(1.25)}
.dots i.done{background:var(--ok)}
.meet{display:grid;justify-items:center;gap:10px;text-align:center;padding:20px 16px}
.meet .pic{--ps:112px;cursor:pointer}
.meet .word{font-size:46px;font-weight:700;line-height:1.1;color:var(--night);cursor:pointer;overflow-wrap:anywhere}
.meet .mean{font-size:24px;font-weight:800;color:var(--ink)}
.meet .ex{font-size:21px;line-height:1.45;color:var(--ink)}
.meet .exar{font-size:16px;color:var(--ink2)}
.meet button.mean,.meet button.exar,.meet button.sit{cursor:pointer;text-align:center}
.meet button.exar{display:block}
.mark{background:linear-gradient(transparent 55%,#ffe27a 55%);border-radius:3px;padding:0 2px;font-weight:700}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:14px;background:var(--sky2);color:var(--night);font-weight:700;font-size:15px;box-shadow:0 3px 0 #c6dcf0}
.tbtn:active{transform:translateY(2px)}
.tbtn.on{background:var(--night);color:#fff}
.spkbig{width:96px;height:96px;border-radius:50%;background:var(--blue);color:#fff;font-size:42px;display:grid;place-items:center;box-shadow:0 6px 0 var(--blue2);margin:6px auto}
.spkbig.play{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.sit{font-size:13px;color:var(--ink2);background:var(--card2);border-radius:12px;padding:6px 10px}

/* ---------- questions ---------- */
.qtop{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.qtop .pbar{flex:1;height:14px}
.qtop .x{width:42px;height:42px;border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--line);font-size:18px;flex:none}
.qtop .fe{font-weight:800;font-family:var(--f-num);white-space:nowrap}
.qins{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:18px;font-weight:700}
.qins button{width:38px;height:38px;border-radius:12px;background:var(--card);box-shadow:0 3px 0 var(--line);flex:none;font-size:17px}
.prompt{display:grid;justify-items:center;gap:8px;text-align:center;margin-bottom:14px;padding:16px;border-radius:24px;background:var(--card);box-shadow:var(--sh)}
.prompt .pic{--ps:96px}
.prompt .wbig{font-size:40px;font-weight:700;color:var(--night);line-height:1.15;overflow-wrap:anywhere}
.prompt .arbig{font-size:30px;font-weight:800;line-height:1.3}
.prompt .gapline{font-size:22px;line-height:1.55;color:var(--ink)}
.prompt .gapline .blank{display:inline-block;min-width:4.5em;border-bottom:3px dashed var(--gold2);color:var(--ok2);font-weight:700}
.opts{display:grid;gap:10px}
.opts.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{display:grid;place-items:center;gap:4px;min-height:64px;padding:10px;border-radius:18px;background:var(--card);box-shadow:0 5px 0 var(--line);font-weight:700;font-size:21px;line-height:1.25;text-align:center;overflow-wrap:anywhere}
.opt.picopt{min-height:120px}
.opt.picopt .pic{--ps:64px}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.opt.ok{background:var(--okbg);box-shadow:0 5px 0 var(--ok);color:var(--ok2)}
.opt.bad{background:var(--badbg);box-shadow:0 5px 0 var(--bad);color:var(--bad2)}
.opt.dim{opacity:.5}
.opt .cap{font-size:15px;font-family:var(--f-en)}
.opts.locked .opt{pointer-events:none}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .opt{font-size:24px;min-height:76px}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;direction:ltr;margin:4px 0 14px}
.slot{width:40px;height:48px;border-radius:12px;border:2.5px dashed #d8c7a4;display:grid;place-items:center;font-family:var(--f-en);font-weight:700;font-size:26px;background:var(--card2)}
.slot.f{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ok2)}
.slot.sp{border:0;background:none;width:14px}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;direction:ltr}
.tile{min-width:48px;height:52px;padding:0 10px;border-radius:14px;background:var(--card);box-shadow:0 4px 0 var(--line);font-family:var(--f-en);font-weight:700;font-size:24px}
.tile.used{visibility:hidden}
.tile:active{transform:translateY(2px)}
.tile.w{font-size:19px;height:48px}
.built{min-height:60px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;direction:ltr;padding:10px;border-radius:16px;background:var(--card2);border:2.5px dashed #d8c7a4;margin-bottom:12px;font-family:var(--f-en);font-size:20px;font-weight:700}
.built span{background:var(--okbg);color:var(--ok2);border-radius:10px;padding:2px 8px}
.qfoot{margin-top:14px}
.feedback{margin-top:12px;padding:12px 14px;border-radius:16px;font-weight:700;display:flex;align-items:center;gap:10px}
.feedback.ok{background:var(--okbg);color:var(--ok2)}
.feedback.bad{background:var(--badbg);color:var(--bad2)}
.feedback .en{font-size:20px}
.micbtn{width:110px;height:110px;border-radius:50%;background:var(--bad);color:#fff;font-size:46px;display:grid;place-items:center;margin:8px auto;box-shadow:0 6px 0 var(--bad2)}
.micbtn.on{animation:pulse .9s ease-in-out infinite;background:#ff6b6f}
.heard{min-height:30px;font-family:var(--f-en);font-size:20px;color:var(--ink2);text-align:center}

/* ---------- results ---------- */
.result{display:grid;justify-items:center;gap:12px;text-align:center;padding-top:10px}
.result .fres{width:170px;height:170px}
.result h2{margin:0;font-size:30px;line-height:1.2;color:var(--night)}
.bigstars{font-size:52px;letter-spacing:6px;color:var(--gold);line-height:1}
.bigstars .off{color:#e3d9c4}
.gain{display:inline-flex;gap:10px;flex-wrap:wrap;justify-content:center}
.gain span{background:var(--card);border-radius:99px;padding:6px 14px;font-weight:800;box-shadow:0 3px 0 var(--line)}
.wlist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wlist span{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:14px;padding:6px 10px;box-shadow:0 3px 0 var(--line);font-family:var(--f-en);font-weight:700}
.wlist .pic{--ps:22px}

.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.skybox .bub.miss{background:var(--badbg)}

.switch{width:54px;height:32px;border-radius:99px;background:#d6cbb4;position:relative;flex:none}

.gatebox{display:grid;gap:12px;justify-items:center;text-align:center}

.copybox{width:100%;min-height:90px;border-radius:14px;border:2px solid var(--line);padding:10px;font-family:var(--f-en);font-size:14px;direction:ltr;background:var(--card);color:var(--ink)}

/* ---------- talk ---------- */
.qcard{display:grid;gap:10px;text-align:center}
.qcard .qen{font-size:26px;font-weight:700;line-height:1.35;color:var(--night)}

.helpw{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}

/* ---------- toasts and effects ---------- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));z-index:60;display:grid;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--night);color:#fff;border-radius:16px;padding:10px 14px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.25);animation:up .3s;text-align:center}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

.plan .steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:12px}

/* ---------- topics ---------- */

/* ---------- a lesson: meet the words, practice, result ---------- */
def('lesson', ({ t, i }) => {
  const T = TOPIC[t], L = T.lessons[i];
  VO.pre([...L.map(w => w.en), ...L.filter(w => w.ex).map(w => w.ex)]);
  let k = 0;
  const show = () => {
    const w = L[k], long = w.en.length > 14;
    app.innerHTML = bar(`${esc(T.ar)} · الدرس ${num(i + 1)}`) + `<div class="dots">${L.map((_, j) => `<i class="${j < k ? 'done' : j === k ? 'on' : ''}"></i>`).join('')}</div>
      <div class="card meet">${pic(w)}<div class="word en" style="${long ? 'font-size:30px' : ''}">${esc(w.en)}</div><button class="mean" data-a="m">${esc(w.ar)}</button>
        <div class="tools"><button class="tbtn" data-a="w">🔊 ${isPhrase(w) ? 'الجملة' : 'الكلمة'}</button>${w.ex ? '<button class="tbtn" data-a="s">🔊 المثال</button>' : ''}<button class="tbtn" data-a="z">🐢 ببطء</button>${canMic() ? '<button class="tbtn" data-a="m">🎤 قلها</button>' : ''}</div>
        ${w.ex ? `<div class="ex en">${markWord(w.ex, w.en)}</div>${ST.set.arHide ? '<button class="tbtn" data-a="tr">👁 الترجمة</button><button class="exar" data-a="x" hidden>🔊 ' + esc(w.exAr) + '</button>' : `<button class="exar" data-a="x">🔊 ${esc(w.exAr)}</button>`}`
               : `<button class="sit" data-a="x">🗣️ متى أقولها؟ ${esc(w.exAr)}</button>`}
        <div class="heard" id="heard"></div></div>
      <div class="row qfoot">${k > 0 ? '<button class="btn soft" id="pv">→ السابق</button>' : ''}<button class="btn" id="nx">${k < L.length - 1 ? 'التالي ◀︎' : 'هيا نتدرب! ◀︎'}</button></div>`;
    bindBar();
    const sayAll = () => VO.say(cardLines(w));
    VO.say([...(k === 0 && Object.keys(ST.ls).length < 2 ? [{ a: 'meet' }, 300] : []), ...cardLines(w)]);
    on('[data-a="w"]', () => VO.say(wordLines(w)));
    on('[data-a="m"]', () => VO.say({ r: w.ar }));
    on('[data-a="x"]', () => VO.say({ r: w.exAr }));
    on('[data-a="s"]', () => VO.say(w.ex));
    on('[data-a="z"]', () => VO.say({ z: w.ex || w.en }));
    on('[data-a="tr"]', el => { el.hidden = true; el.nextElementSibling.hidden = false; VO.say({ r: w.exAr }); });
    on('[data-a="m"]', el => sayIt(w, el, $('#heard')));
    $('.meet .pic').onclick = () => VO.say(w.en);
    $('.meet .word').onclick = sayAll;
    on('#pv', () => { k--; show(); });
    on('#nx', () => { if (k < L.length - 1) { k++; show(); } else practice(); });
  };
  const practice = () => runSession({ title: T.ar, items: lessonItems(L), mode: 'lesson', requeue: true,
    onAnswer: (q, ok) => { if (!ok && !q.retry) wstate(q.w).x++; },
    onEnd: S => lessonDone(T, i, L, S) });
  show();
});
async function sayIt(w, btn, out) {
  VO.stop(); btn.classList.add('on'); out.textContent = '… أستمع';
  const r = await listen();
  btn.classList.remove('on');
  if (r.err) { out.textContent = r.msg; return; }
  const ok = heardIt(r.alts, w.en);
  out.innerHTML = r.alts.length ? `<span class="en">${esc(r.alts[0])}</span> ${ok ? '✅' : '🔁'}` : 'لم أسمع شيئًا، حاول مرة أخرى.';
  if (ok) { sfx('ok'); VO.say(praise()); } else if (r.alts.length) VO.say([{ a: 'again' }, 200, w.en]);
}
function lessonDone(T, i, L, S) {
  const first = S.res.filter(r => !r.retry), wrong = first.filter(r => !r.ok).length;
  const stars = wrong <= 1 ? 3 : wrong <= 4 ? 2 : 1, key = T.id + ':' + i;
  const fresh = L.filter(w => !isLearned(w));
  L.forEach(introduce);
  ST.ls[key] = Math.max(ST.ls[key] || 0, stars);
  today().l++; if (!wrong) ST.perfect++;
  ST.alt = T.id === 'big' ? 0 : 1;   // with the plan, a lesson of big words comes after every other lesson
  const fe = 5 + stars * 2; ST.fe += fe; save();
  const streakUp = touchStreak();
  app.innerHTML = `<div class="result"><div class="fres hop">${falcon({ mood: 'happy', pose: 'cheer' })}</div><h2>أنهيت الدرس!</h2>
    <div class="bigstars">${Array.from({ length: 3 }, (_, j) => j < stars ? '★' : '<span class="off">★</span>').join('')}</div>
    <div class="gain"><span>🪶 +${num(fe + first.filter(r => r.ok).length)}</span><span>${fresh.length ? `📖 ${num(fresh.length)} كلمات جديدة` : '🔁 درس مراجعة'}</span>${streakUp ? `<span>🔥 ${num(streakNow())}</span>` : ''}</div>
    <div class="wlist">${L.map(w => `<span>${pic(w)}${esc(w.en)}</span>`).join('')}</div>
    <p class="muted small" style="margin:0">ستعود هذه الكلمات غدًا في المراجعة الذكية حتى لا تنساها.</p>
    <div class="stack" style="width:100%">${nextLesson() ? '<button class="btn" id="nxl">الدرس التالي ◀︎</button>' : ''}<button class="btn soft" id="hm">🏠 الرئيسية</button></div></div>`;
  FX.confetti(); sfx('win');
  const lines = [{ a: 'lesson-done' }]; if (streakUp && streakNow() > 1) lines.push(300, { a: 'streak' });
  celebrate(lines);
  on('#nxl', () => { const n = nextLesson(); if (n) { stack = [{ name: 'home' }]; clean(); cur = { name: 'lesson', arg: n }; render(); } });
  on('#hm', home);
}
/* after a lesson or review: rank, badges, today's goal. A new rank shows on the result screen, or on the home screen if he left it first. */
let pendingRank = -1;
function celebrate(lines) {
  const r = rankOf(nLearned());
  if (r > ST.rank) { ST.rank = r; pendingRank = r; lines.push(400, { a: 'rank-' + (r + 1) }); const here = cur; setTimeout(() => { if (cur === here && pendingRank === r) { pendingRank = -1; rankSheet(r); } }, 1600); }
  const got = newBadges();
  if (got.length) { lines.push(300, { a: 'badge' }); got.forEach((b, j) => setTimeout(() => toast(`${b[1]} وسام جديد: ${b[2]}`), 900 + j * 900)); }
  if (today().l >= ST.set.goal && ST.goalDay !== DAY()) { ST.goalDay = DAY(); lines.push(300, { a: 'goal' }); setTimeout(() => toast('🎯 حققت هدف اليوم!'), 2200); }
  if (ST.plan && ST.planDay !== DAY() && planSteps().every(s => s.done)) { ST.planDay = DAY(); lines.push(300, { a: 'plan-all' }); setTimeout(() => { toast('🌟 أنهيت خطة اليوم كلها!'); FX.confetti(); }, 3000); }
  save(); VO.say(lines);
}
function rankSheet(r) {

    <p style="font-size:24px;font-weight:800;margin:0">${RANKS[r].ar}</p><p class="en muted" style="margin:0">${RANKS[r].en}</p><button class="btn" data-close>رائع!</button></div>`,
    el => { el.querySelector('[data-close]').onclick = () => el.remove(); });

}

/* ---------- smart review ---------- */
function reviewType(w) {
  const b = sOf(w).b;
  if (isPhrase(w)) return b <= 1 ? 'wa' : b === 2 ? 'aw' : b === 3 ? 'sit' : 'ord';
  if (b <= 1) return !weak(w) ? 'lp' : 'wa';
  if (b === 2) return !weak(w) ? pick(['pw', 'wp']) : 'aw';
  if (b === 3) return w.ex ? 'gap' : 'aw';
  return spellable(w) ? 'sp' : w.ex ? 'gap' : 'aw';
}
function startReview() {
  const due = dueWords().slice(0, ST.set.rev);
  if (!due.length) { VO.say({ a: 'review-none' }); toast('لا مراجعة الآن ✓ تعود الكلمات في وقتها.'); return; }
  go('review', due);
}
def('review', due => {
  const ups = [], downs = [];
  const run = () => runSession({ title: 'المراجعة الذكية', items: mix(due).map(w => ({ w, type: reviewType(w) })), mode: 'review', requeue: true,
    onAnswer: (q, ok) => { if (q.retry) return; const before = sOf(q.w).b; grade(q.w, ok); today().r++; ST.revN++; (ok ? ups : downs).push([q.w, before]); save(); },
    onEnd: S => {
      const ok = S.res.filter(r => !r.retry && r.ok).length, n = S.res.filter(r => !r.retry).length, mastered = ups.filter(([w, b]) => b === 4).map(([w]) => w);
      touchStreak();
      app.innerHTML = `<div class="result"><div class="fres hop">${falcon({ mood: 'happy', pose: 'cheer' })}</div><h2>مراجعة رائعة!</h2>
        <div class="gain"><span>✅ ${num(ok)} من ${num(n)}</span><span>🪶 +${num(ok)}</span></div>
        ${mastered.length ? `<p style="margin:0;font-weight:800">💎 أتقنت: </p><div class="wlist">${mastered.map(w => `<span>${pic(w)}${esc(w.en)}</span>`).join('')}</div>` : ''}
        ${downs.length ? `<p style="margin:0" class="muted">هذه الكلمات ستعود قريبًا لتتدرب عليها أكثر:</p><div class="wlist">${downs.map(([w]) => `<span>${pic(w)}${esc(w.en)}</span>`).join('')}</div>` : ''}
        <div class="stack" style="width:100%">${dueWords().length ? '<button class="btn blue" id="more">🔁 مراجعة كلمات أخرى</button>' : ''}<button class="btn soft" id="hm">🏠 الرئيسية</button></div></div>`;
      FX.confetti(); sfx('win');
      celebrate([{ a: mastered.length ? 'mastered' : 'review-done' }]);
      on('#more', () => { const d = dueWords().slice(0, ST.set.rev); clean(); cur = { name: 'review', arg: d }; render(); });
      on('#hm', home);
    } });
  app.innerHTML = `<div class="splash"><div class="fbig" style="width:180px">${falcon({ mood: 'idle' })}</div><div class="bubble">حان وقت مراجعة ${num(due.length)} ${due.length > 10 ? 'كلمة' : 'كلمات'}. المراجعة في وقتها تجعل الكلمة لا تُنسى!</div>
    <div class="wlist">${due.slice(0, 15).map(w => `<span>${pic(w)}</span>`).join('')}</div><button class="btn blue" id="st">هيا نراجع ◀︎</button><button class="btn soft" id="bk2" style="max-width:320px">رجوع</button></div>`;
  VO.say({ a: 'review-start' }); VO.pre(due.map(w => w.en));
  on('#st', run); on('#bk2', back);
});

/* ---------- placement test and topic check: what he already knows is not taught again ---------- */
def('placement', () => {
  const picks = [];
  TOPICS.filter(t => t.stage <= 3 && t.id !== 'class').forEach(t => {
    const strong = mix(t.words.filter(w => !weak(w)));
    const n = t.stage === 1 ? 2 : t.stage === 2 ? 1 : (strong.length ? 1 : 0);
    picks.push(...strong.slice(0, n));
  });

/* صقر الكلمات — the question engine: one session of questions for a lesson, a review or a test.
   Kinds: lp listen→picture, wp read→picture, pw picture→word, aw Arabic→word, wa word→Arabic, gap fill the sentence,
   sp spell with letter tiles, tf true or false, say speak into the mic, sit which class phrase fits, ord put the words in order. */
const INS = {
  lp: ['q-lp', 'اسمع، ثم اختر الصورة.'], wp: ['q-wp', 'اقرأ الكلمة، ثم اختر صورتها.'], pw: ['q-pw', 'ما اسم هذه الصورة بالإنجليزية؟'],
  aw: ['q-aw', 'اختر الكلمة الإنجليزية الصحيحة.'], wa: ['q-wa', 'ما معنى هذه الكلمة؟'], gap: ['q-gap', 'اختر الكلمة التي تكمل الجملة.'],
  sp: ['q-sp', 'رتّب الحروف لتكتب الكلمة.'], tf: ['q-tf', 'هل هذه الكلمة تناسب الصورة؟'], say: ['q-say', 'انطق الكلمة بصوت واضح.'],
  sit: ['q-sit', 'ماذا تقول في هذا الموقف؟'], ord: ['q-ord', 'رتّب الكلمات لتكوّن جملة صحيحة.'],
};
/* n wrong answers for w. mode: pic (they are shown as pictures), en, ar, gap (only one may fit the sentence).
   In parts 2-6 every word says what kind of word it is (flags v verb, a adjective or adverb, x small word, else a noun),
   and the wrong answers of a sentence question are words of another kind, so only one choice can fit. */
const pos = w => w.fl.includes('v') ? 'v' : w.fl.includes('a') ? 'a' : w.fl.includes('x') ? 'x' : 'n';
function others(w, n, mode) {
  const T = TOPIC[w.t], words = s => s.split(' ').length;
  const fits = x => x !== w && x.k !== w.k && isPhrase(x) === isPhrase(w) && !similar(x, w)
    && (mode !== 'pic' || (!weak(x) && x.pic !== w.pic))
    && (mode !== 'ar' || x.ar !== w.ar)
    && (mode !== 'gap' || ((PNO > 1 ? pos(x) !== pos(w) : KIND[x.t] !== KIND[w.t]) && !isPhrase(x) && !x.gx));   // big words (own wrong answers) could fit other sentences
  const tiers = mode === 'gap' ? [WORDS.filter(x => words(x.en) === words(w.en)), WORDS]
    : [lessonOf(w), T.words, WORDS.filter(x => TOPIC[x.t].stage === T.stage), WORDS];
  const out = [];
  for (const tier of tiers) for (const x of mix(tier)) {
    if (out.length >= n) return out;
    if (fits(x) && !out.includes(x) && !out.some(y => similar(x, y) || (mode === 'pic' && y.pic === x.pic) || (mode === 'ar' && y.ar === x.ar))) out.push(x);
  }
  return out;
}
const easyType = w => isPhrase(w) || weak(w) ? 'wa' : 'lp';
function lessonItems(L) {
  const r1 = mix(L).map(w => ({ w, type: easyType(w) }));
  const r2 = mix(L).map(w => ({ w, type: isPhrase(w) ? 'sit' : weak(w) ? (w.ex ? pick(['aw', 'gap']) : 'aw') : pick(['pw', 'wp', 'tf', 'aw']) }));
  const sp = mix(L.filter(spellable)).slice(0, 3);
  const r3 = mix([...sp.map(w => ({ w, type: 'sp' })),
    ...mix(L.filter(w => !sp.includes(w) && (isPhrase(w) || w.ex))).slice(0, Math.max(1, 4 - sp.length)).map(w => ({ w, type: isPhrase(w) ? 'ord' : 'gap' }))]);
  const r4 = canMic() ? mix(L.filter(w => !isPhrase(w))).slice(0, 2).map(w => ({ w, type: 'say' })) : [];
  const all = [...r1, ...r2, ...r3, ...r4];
  for (let i = 1; i < all.length; i++) if (all[i].w === all[i - 1].w && i + 1 < all.length) [all[i], all[i + 1]] = [all[i + 1], all[i]];
  return all;
}

/* runSession({items, mode: lesson|review|check|place, requeue, quick, dunno, onAnswer(q, ok), onEnd(S)}) */
function runSession(o) {
  const S = { i: 0, items: o.items.slice(), res: [], again: new Set(), heard: {}, run: 0, over: false };
  const quit = () => confirmSheet(o.mode === 'lesson' ? 'هل تريد الخروج من الدرس؟' : 'هل تريد الخروج؟', 'نعم، اخرج', 'أكمل', () => { S.over = true; back(); });
  const next = () => {
    if (S.over) return;
    if (S.i >= S.items.length) { S.over = true; return o.onEnd(S); }
    const q = S.items[S.i]; q.mode = o.mode; app.dataset.qn = (+app.dataset.qn || 0) + 1;
    app.innerHTML = `<div class="qtop"><button class="x" id="qx" aria-label="خروج">✕</button><div class="pbar"><i style="width:${Math.round(S.i / S.items.length * 100)}%"></i></div><span class="fe">🪶 ${num(ST.fe)}</span></div>
      <p class="qins"><button id="qsay" aria-label="اسمع السؤال">🔊</button><span>${INS[q.type][1]}</span></p><div id="qb"></div>`;
    app.querySelector('#qx').onclick = () => { sfx('tap'); quit(); };
    app.querySelector('#qsay').onclick = () => VO.say({ a: INS[q.type][0] });
    const intro = S.heard[q.type] || o.quick ? [] : [{ a: INS[q.type][0] }, 250];
    S.heard[q.type] = true;
    let answered = false;
    const body = app.querySelector('#qb');
    TYPES[q.type](q, body, intro, (ok, x = {}) => { if (answered || S.over) return; answered = true; respond(q, ok, x); });
    if (o.dunno && !['sp', 'ord', 'say'].includes(q.type)) {
      const d = document.createElement('button'); d.className = 'btn soft small'; d.style.marginTop = '14px'; d.textContent = '🤷 لا أعرف';
      d.onclick = () => { if (answered) return; answered = true; sfx('tap'); const r = body.querySelector('.opt[data-right]'); if (r) r.classList.add('ok'); respond(q, false, { silent: true, fast: true }); };
      body.appendChild(d);
    }
  };
  const done = (q, ok) => {
    if (S.over) return;
    S.res.push({ w: q.w, type: q.type, ok, retry: !!q.retry });
    if (o.onAnswer) o.onAnswer(q, ok);
    const st = today(); if (!q.retry && o.mode !== 'place') { st.q++; if (ok) st.c++; }
    if (!ok && o.requeue && !S.again.has(q.w.k)) { S.again.add(q.w.k); S.items.push({ w: q.w, type: easyType(q.w), retry: true }); }
    save(); S.i++; next();
  };
  const respond = (q, ok, x) => {
    const opts = app.querySelector('#qb .opts'); if (opts) opts.classList.add('locked');
    if (ok) {
      sfx('ok'); S.run++;
      if (x.el) { x.el.classList.add('ok'); const r = x.el.getBoundingClientRect(); FX.burst(r.left + r.width / 2, r.top + r.height / 2); }
      if (!x.silent && o.mode !== 'place') addFeathers(1, x.el || app.querySelector('#qb'));
      const lines = [...(x.say || [])];
      if (!o.quick && S.run % 3 === 0) lines.push(200, praise());
      Promise.all([VO.say(lines), wait(o.quick ? 550 : 900)]).then(() => done(q, true));
      return;
    }
    sfx('no'); S.run = 0;
    if (x.el) { x.el.classList.add('bad'); x.el.classList.remove('shake'); void x.el.offsetWidth; x.el.classList.add('shake'); }
    if (x.right) x.right.classList.add('ok');
    app.querySelectorAll('#qb .cap').forEach(c => { c.hidden = false; });
    if (o.quick || x.fast) { setTimeout(() => done(q, false), 1100); return; }
    const w = q.w, fb = document.createElement('div');
    fb.innerHTML = `<div class="feedback bad"><span>الإجابة الصحيحة:</span> <b class="en">${esc(w.en)}</b> <span class="muted">${esc(w.ar)}</span></div>
      <div class="qfoot"><button class="btn" id="cont">متابعة ◀︎</button></div>`;
    app.querySelector('#qb').appendChild(fb);
    VO.say([...(x.say || [w.en]), 250, x.sayAr || { r: w.ar }]);
    fb.querySelector('#cont').onclick = () => { sfx('tap'); done(q, false); };
    fb.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'nearest' });
  };
  next();
}
/* options: tap one; cb(ok, el, rightEl) */
function bindOpts(body, opts, target, cb) {
  body.querySelectorAll('.opt[data-i]').forEach(el => el.addEventListener('click', () => {
    if (el.closest('.opts').classList.contains('locked')) return;
    cb(opts[+el.dataset.i] === target, el, body.querySelector('.opt[data-right]'));
  }));
}
const optWords = (opts, w) => `<div class="opts ${opts.some(x => x.en.length > 11) ? '' : 'g2'}">${opts.map((x, i) => `<button class="opt en" data-i="${i}"${x === w ? ' data-right' : ''}>${esc(x.en)}</button>`).join('')}</div>`;
const optPics = (opts, w) => `<div class="opts g2">${opts.map((x, i) => `<button class="opt picopt" data-i="${i}"${x === w ? ' data-right' : ''} aria-label="صورة">${pic(x)}<span class="cap" hidden>${esc(x.en)}</span></button>`).join('')}</div>`;
function blanked(ex, en) {
  const re = new RegExp('(^|[^A-Za-z])(' + en.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(?=[^A-Za-z]|$)', 'i'), m = re.exec(ex);
  if (!m) return esc(ex);
  const at = m.index + m[1].length;
  return esc(ex.slice(0, at)) + '<span class="blank">&nbsp;</span>' + esc(ex.slice(at + m[2].length));
}
const TYPES = {
  lp(q, body, intro, R) {
    const opts = mix([q.w, ...others(q.w, 3, 'pic')]);
    body.innerHTML = `<div class="prompt"><button class="spkbig" id="spk" aria-label="اسمع الكلمة">🔊</button></div>${optPics(opts, q.w)}`;
    VO.say([...intro, q.w.en]);
    body.querySelector('#spk').onclick = () => VO.say(q.w.en);
    bindOpts(body, opts, q.w, (ok, el, right) => R(ok, { el, right, say: ok ? [] : [q.w.en] }));
  },
  wp(q, body, intro, R) {
    const opts = mix([q.w, ...others(q.w, 3, 'pic')]);
    body.innerHTML = `<div class="prompt"><div class="wbig en">${esc(q.w.en)}</div></div>${optPics(opts, q.w)}`;
    VO.say(intro);
    bindOpts(body, opts, q.w, (ok, el, right) => R(ok, { el, right, say: [q.w.en] }));
  },
  pw(q, body, intro, R) {
    const opts = mix([q.w, ...others(q.w, 3, 'en')]);

    VO.say(intro);
    bindOpts(body, opts, q.w, (ok, el, right) => R(ok, { el, right, say: [q.w.en] }));
  },
  aw(q, body, intro, R) {
    const opts = mix([q.w, ...others(q.w, 3, 'en')]);
    body.innerHTML = `<div class="prompt"><div class="arbig">${esc(q.w.ar)}</div><button class="tbtn" id="hear">🔊 اسمع</button></div>${optWords(opts, q.w)}`;
    VO.say([...intro, { r: q.w.ar }]);
    body.querySelector('#hear').onclick = () => VO.say({ r: q.w.ar });
    bindOpts(body, opts, q.w, (ok, el, right) => R(ok, { el, right, say: [q.w.en] }));
  },
  wa(q, body, intro, R) {
    const opts = mix([q.w, ...others(q.w, 3, 'ar')]);
    const long = q.w.en.length > 14;
    body.innerHTML = `<div class="prompt"><div class="wbig en" style="${long ? 'font-size:26px' : ''}">${esc(q.w.en)}</div><button class="tbtn" id="hear">🔊 اسمع</button></div>
      <div class="opts${opts.some(x => x.ar.length > 14) ? '' : ' g2'}">${opts.map((x, i) => `<button class="opt" data-i="${i}"${x === q.w ? ' data-right' : ''}>${esc(x.ar)}</button>`).join('')}</div>`;
    VO.say([...intro, q.w.en]);
    body.querySelector('#hear').onclick = () => VO.say(q.w.en);
    bindOpts(body, opts, q.w, (ok, el, right) => R(ok, { el, right, say: ok ? [q.w.en, 250, { r: q.w.ar }] : [q.w.en] }));
  },
  gap(q, body, intro, R) {
    const w = q.w, opts = mix([w, ...(w.gx ? w.gx.map(k => BYK[k]).filter(Boolean) : others(w, 3, 'gap'))]);
    body.innerHTML = `<div class="prompt">${weak(w) || q.mode === 'review' ? '' : `<span style="--ps:56px">${pic(w)}</span>`}<div class="gapline en" id="gl">${blanked(w.ex, w.en)}</div>
      ${ST.set.arHide ? '' : `<div class="muted small">${esc(w.exAr)}</div>`}</div>${optWords(opts, w)}`;
    VO.say(intro);
    bindOpts(body, opts, w, (ok, el, right) => { body.querySelector('#gl').innerHTML = markWord(w.ex, w.en); R(ok, { el, right, say: [w.ex], sayAr: { r: w.exAr } }); });
  },
  tf(q, body, intro, R) {
    const w = q.w, yes = Math.random() < .5, shown = yes ? w : (others(w, 1, 'pic')[0] || w), truth = shown === w;
    body.innerHTML = `<div class="prompt">${pic(w)}<div class="wbig en" style="font-size:32px">${esc(shown.en)}</div><button class="tbtn" id="hear">🔊 اسمع</button></div>
      <div class="opts tf"><button class="opt" data-v="1"${truth ? ' data-right' : ''}>✓ صح</button><button class="opt" data-v="0"${truth ? '' : ' data-right'}>✗ خطأ</button></div>`;
    VO.say([...intro, shown.en]);
    body.querySelector('#hear').onclick = () => VO.say(shown.en);
    body.querySelectorAll('.opt').forEach(el => el.addEventListener('click', () => {
      if (el.closest('.opts').classList.contains('locked')) return;

      R(ok, { el, right: body.querySelector('.opt[data-right]'), say: truth ? [] : [w.en] });

  },
  sp(q, body, intro, R) {
    const w = q.w, chars = [...w.en], isL = c => /[A-Za-z]/.test(c), at = chars.map((c, i) => isL(c) ? i : -1).filter(i => i >= 0);
    const need = at.map(i => chars[i]), extra = q.mode === 'review' ? 2 : q.mode === 'game' ? 1 : 0;
    const abc = 'abcdefghijklmnoprstuwy'.split('').filter(c => !need.some(x => x.toLowerCase() === c));
    let pool = mix([...need, ...mix(abc).slice(0, extra)]);

    body.innerHTML = `<div class="prompt">${pic(w)}<div style="font-size:21px;font-weight:800">${esc(w.ar)}</div><button class="tbtn" id="hear">🔊 اسمع</button></div>
      <div class="slots">${chars.map((c, i) => isL(c) ? `<span class="slot" data-s="${i}"></span>` : `<span class="slot sp">${c === ' ' ? '' : esc(c)}</span>`).join('')}</div>
      <div class="tiles">${pool.map((c, i) => `<button class="tile" data-t="${i}">${esc(c)}</button>`).join('')}</div>
      <div class="row qfoot"><button class="btn soft small" id="hint">💡 ساعدني بحرف</button></div>`;
    VO.say([...intro, { r: w.ar }, 300, w.en]);
    body.querySelector('#hear').onclick = () => VO.say(w.en);
    body.dataset.w = w.en; // for the test bot (tools/falcon-play.js)
    let pos = 0, miss = 0;
    const fill = tile => {
      const slot = body.querySelector(`.slot[data-s="${at[pos]}"]`); slot.textContent = chars[at[pos]]; slot.classList.add('f', 'pop');

  ord(q, body, intro, R) {

      <div class="built" id="built"></div><div class="tiles">${pool.map((p, i) => `<button class="tile w" data-t="${i}">${esc(p.t)}</button>`).join('')}</div>`;
    VO.say([...intro, { r: q.textAr || w.ar }]);

    let pos = 0, miss = 0;
    body.querySelectorAll('.tile').forEach(tile => tile.addEventListener('click', () => {

    VO.say([...intro, { r: q.w.exAr }]);

  },
  say(q, body, intro, R) {
    const w = q.w;
    body.innerHTML = `<div class="prompt">${pic(w)}<div class="wbig en">${esc(w.en)}</div><button class="tbtn" id="hear">🔊 اسمع أولًا</button></div>

      <div class="row qfoot"><button class="btn soft small" id="skip">⏭ تخطَّ</button><button class="btn soft small" id="self" hidden>✓ قلتها</button></div>`;

    body.querySelector('#skip').onclick = () => { sfx('tap'); R(true, { silent: true }); };

  },
};

/* ---------- the microphone: the browser's own speech recognition (no device voice is used) ---------- */
function listen() {
  return new Promise(res => {
    let r; try { r = new MIC(); } catch (e) { micBlocked = true; return res({ err: 1, msg: 'الميكروفون غير متاح هنا.' }); }
    r.lang = 'en-US'; r.interimResults = false; r.maxAlternatives = 5; r.continuous = false;
    const alts = []; let fin = false, tm = 0;
    const end = x => { if (fin) return; fin = true; clearTimeout(tm); res(x || { alts }); };
    r.onresult = e => { for (let i = 0; i < e.results.length; i++) for (let j = 0; j < e.results[i].length; j++) alts.push(e.results[i][j].transcript); };
    r.onerror = e => { if (['not-allowed', 'service-not-allowed', 'audio-capture'].includes(e.error)) { micBlocked = true; end({ err: 1, msg: 'الميكروفون غير متاح هنا. اضغط «قلتها» بعد أن تنطقها.' }); } else end({ alts }); };
    r.onend = () => end({ alts });
    tm = setTimeout(() => { try { r.stop(); } catch (e) {} }, 6500);
    try { r.start(); } catch (e) { end({ err: 1, msg: 'تعذّر تشغيل الميكروفون.' }); }
  });
}

/* ---------- the spelling workshop: look at the word, cover it, write it, check it ----------
   Each word has its own spelling box (ST.sp): right the first time moves it on (back after 1, 3, 7, 14, 30 days),
   a mistake brings it back tomorrow. A new or missed word is shown first with its letter teams coloured;
   a word he has spelled before is written from memory. */
const SPGAP = [0, 1, 3, 7, 14, 30];
const TEAMS = ['tch', 'igh', 'sh', 'ch', 'th', 'ph', 'wh', 'ck', 'ng', 'qu', 'kn', 'wr', 'ee', 'oo', 'ea', 'ai', 'ay', 'oa', 'ow', 'ou', 'oi', 'oy', 'aw', 'ew', 'ue', 'ar', 'er', 'ir', 'or', 'ur'];

    let n = 1;

      else { const t = TEAMS.find(x => lo.startsWith(x, i) && !(x === 'ng' && /[eiy]/.test(lo[i + 2] || ''))); if (t) n = t.length; }
    }

}

  return n > 1 ? `<b class="tm">${esc(s)}</b>` : /[A-Za-z]/.test(s) ? `<span>${esc(s)}</span>` : `<span class="nl">${s === ' ' ? '&nbsp;' : esc(s)}</span>`; }).join('');

  const due = all.filter(w => spOf(w) && spOf(w).d <= D).sort((a, b) => spOf(a).d - spOf(b).d || spOf(a).n - spOf(b).n);

/* ---------- the rule of the day: a short explanation (Hamed and Ollie), then 8 sentences to complete ----------

const grOf = r => ST.gr[r.id] || (ST.gr[r.id] = { d: [], best: 0, n: 0, last: -1 });
const ruleMastered = r => !!(ST.gr && ST.gr[r.id] && ST.gr[r.id].d.length >= 2);
function ruleOfDay() {
  const left = RULES.filter(r => !ruleMastered(r));
  return left.length ? left[0] : RULES.slice().sort((a, b) => grOf(a).last - grOf(b).last)[0];
}
// English words to light up; 'like+s' lights up likes and shows the added s in its own colour

  if (!h) return esc(t); const [base, add] = h.split('+'); return `<span class="mark">${esc(base)}${add ? `<b class="sfx">${esc(add)}</b>` : ''}</span>`; }).join('');

function ruleQuiz(r) {
  const qs = mix(r.qs); let k = 0, right = 0, over = false;

function ruleDone(r, right, n) {

  const mastered = !before && ruleMastered(r), t = today(); t.g = (t.g || 0) + 1;
  const fe = 3, stars = great ? 3 : right >= n - 3 ? 2 : 1; ST.fe += fe; save();
  const streakUp = touchStreak();

    <div class="bigstars">${Array.from({ length: 3 }, (_, j) => j < stars ? '★' : '<span class="off">★</span>').join('')}</div>
    <div class="gain"><span>✅ ${num(right)} من ${num(n)}</span><span>🪶 +${num(fe + right)}</span>${streakUp ? `<span>🔥 ${num(streakNow())}</span>` : ''}</div>
    <p style="margin:0;font-weight:800">${msg}</p>
    <div class="stack" style="width:100%"><button class="btn" id="again">🔁 تدرب مرة أخرى</button><button class="btn soft" id="all">🧩 كل القواعد</button><button class="btn soft" id="hm">🏠 الرئيسية</button></div></div>`;
  FX.confetti(); sfx('win');
  celebrate([{ a: mastered ? (RULES.some(x => !ruleMastered(x)) ? 'rule-master' : 'rule-great') : great ? 'rule-great' : 'rule-more' }]);
  on('#again', () => { clean(); cur = { name: 'rule', arg: r.id }; render(); });
  on('#all', () => { clean(); stack = [{ name: 'home' }]; cur = { name: 'rules' }; render(); });
  on('#hm', home);
}
